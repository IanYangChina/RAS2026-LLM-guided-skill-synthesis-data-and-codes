skill: peg_insert
dsl_version: 2
skill_type: arm

phases:
  - id: align_above_socket
    type: align
    generator: linear_cartesian
    control: position_control
    termination: pose_tolerance
    subtask_id: align
    target:
      source: yaml
      anchor: fixture
      entity: peg_socket
      offset: [0.0, 0.0, 0.125]
      tolerance: 0.008
      orientation:
        mode: align_axis
        axis: [0.0, 0.0, 1.0]
        align_with: insertion_axis
        tolerance: 0.08
    parameters:
      alignment_x:
        type: scalar
        range: [-0.004, 0.004]
        default: 0.0
        binds_to:
          - {path: target.offset.x, mode: add}
      alignment_y:
        type: scalar
        range: [-0.004, 0.004]
        default: 0.0
        binds_to:
          - {path: target.offset.y, mode: add}

  - id: approach_socket_entry
    type: approach
    generator: linear_cartesian
    control: position_control
    termination: pose_tolerance
    subtask_id: approach
    target:
      source: yaml
      anchor: fixture
      entity: peg_socket
      offset: [0.0, 0.0, 0.085]
      tolerance: 0.008
      orientation:
        mode: align_axis
        axis: [0.0, 0.0, 1.0]
        align_with: insertion_axis
        tolerance: 0.08

  - id: probe_socket
    type: contact
    generator: impedance_motion
    control: impedance_control
    termination: force_exceeded
    subtask_id: contact
    target:
      source: yaml
      anchor: fixture
      entity: peg_socket
      offset: [0.0, 0.0, 0.065]
      tolerance: 0.006
      orientation:
        mode: align_axis
        axis: [0.0, 0.0, 1.0]
        align_with: insertion_axis
        tolerance: 0.08
    parameters:
      contact_force_threshold:
        type: scalar
        range: [5.0, 12.0]
        default: 8.0
        binds_to:
          - {path: termination.force_threshold, mode: replace}

  - id: insert_peg
    type: insert
    generator: impedance_motion
    control: admittance_control
    termination: pose_tolerance
    subtask_id: insert
    target:
      source: yaml
      anchor: fixture
      entity: peg_socket
      offset: [0.0, 0.0, 0.070]
      offset_along_axis:
        distance: 0.04
        axis: channel_axis
        mode: add_to_offset
        sign: positive
      tolerance: 0.006
      orientation:
        mode: align_axis
        axis: [0.0, 0.0, 1.0]
        align_with: insertion_axis
        tolerance: 0.08
    parameters:
      insert_depth:
        type: scalar
        range: [0.03, 0.05]
        default: 0.04
        binds_to:
          - {path: target.offset_along_axis.distance, mode: replace}
      insert_speed:
        type: scalar
        range: [0.02, 0.10]
        default: 0.06
        binds_to:
          - {path: generator.speed, mode: replace}
    guards:
      - id: gentle_insertion
        when: during_phase
        predicate: force_below
        args: {scope: all_contacts}
        threshold: 40.0
        on_failure: retry
    retries:
      max_attempts: 1
      strategy: reduce_speed
      reduce_speed_factor: 0.5

  - id: retract_from_socket
    type: retract
    generator: linear_cartesian
    control: position_control
    termination: pose_tolerance
    target:
      source: yaml
      anchor: fixture
      entity: peg_socket
      offset: [0.0, 0.0, 0.225]
      tolerance: 0.015
      orientation: {mode: keep_current}
