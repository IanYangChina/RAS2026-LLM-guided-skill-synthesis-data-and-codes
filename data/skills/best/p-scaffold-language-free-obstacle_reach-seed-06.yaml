skill: obstacle_reach
dsl_version: 2
subtasks:
- id: reach_side
  offset:
  - 0.0
  - 0.2
  - 0.4
  weight: 0.1
- id: reach_high
  offset:
  - 0.0
  - 0.0
  - 0.4
  weight: 0.3
- id: reach_goal
  weight: 0.6
phases:
- id: approach_side
  type: approach
  generator: linear_cartesian
  control: position_control
  termination: pose_tolerance
  target:
    source: yaml
    anchor: task_goal
    offset:
    - 0.0
    - 0.2
    - 0.4
    tolerance: 0.03
    orientation:
      mode: keep_current
      tolerance: 0.1
  parameters:
    lateral_offset:
      type: scalar
      range:
      - 0.15
      - 0.3
      default: 0.2
      binds_to:
      - path: target.offset.y
        mode: replace
    lift_height:
      type: scalar
      range:
      - 0.3
      - 0.5
      default: 0.4
      binds_to:
      - path: target.offset.z
        mode: replace
    speed:
      type: scalar
      range:
      - 0.2
      - 2.0
      default: 0.8
      binds_to:
      - path: generator.speed
        mode: replace
  subtask_id: reach_side
- id: approach_center
  type: approach
  generator: linear_cartesian
  control: position_control
  termination: pose_tolerance
  target:
    source: yaml
    anchor: task_goal
    offset:
    - 0.0
    - 0.0
    - 0.4
    tolerance: 0.02
    orientation:
      mode: keep_current
      tolerance: 0.1
  parameters:
    lift_height:
      type: scalar
      range:
      - 0.3
      - 0.5
      default: 0.4
      binds_to:
      - path: target.offset.z
        mode: replace
    speed:
      type: scalar
      range:
      - 0.2
      - 2.0
      default: 0.8
      binds_to:
      - path: generator.speed
        mode: replace
  subtask_id: reach_high
- id: descend_to_goal
  type: descend
  generator: linear_cartesian
  control: position_control
  termination: pose_tolerance
  target:
    source: yaml
    anchor: task_goal
    offset:
    - 0.0
    - 0.0
    - 0.0
    tolerance: 0.02
    orientation:
      mode: keep_current
      tolerance: 0.1
  parameters:
    speed:
      type: scalar
      range:
      - 0.2
      - 2.0
      default: 0.6
      binds_to:
      - path: generator.speed
        mode: replace
  guards:
  - id: proximity_retry
    when: after_phase
    predicate: pose_within_tolerance
    threshold: 0.015
    on_failure: retry
  retries:
    max_attempts: 2
    strategy: offset_target
    offset:
    - 0.0
    - 0.0
    - -0.005
  subtask_id: reach_goal
