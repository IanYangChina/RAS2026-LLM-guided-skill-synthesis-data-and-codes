skill: obstacle_reach
dsl_version: 2
subtasks:
- id: approach_high
  offset:
  - 0.0
  - -0.15
  - 0.4
  weight: 0.2
- id: reach_goal
  weight: 0.8
phases:
- id: approach_high_side
  type: approach
  generator: arc_cartesian
  control: position_control
  termination: pose_tolerance
  target:
    source: yaml
    anchor: task_goal
    offset:
    - 0.0
    - -0.15
    - 0.4
    tolerance: 0.02
    orientation:
      mode: none
  parameters:
    approach_z_height:
      type: scalar
      range:
      - 0.3
      - 0.6
      default: 0.4
      binds_to:
      - path: target.offset.z
        mode: replace
    arc_height:
      type: scalar
      range:
      - 0.15
      - 0.5
      default: 0.3
      binds_to:
      - path: generator.arc_height
        mode: replace
    lateral_y_offset:
      type: scalar
      range:
      - -0.25
      - -0.05
      default: -0.15
      binds_to:
      - path: target.offset.y
        mode: replace
    speed:
      type: scalar
      range:
      - 0.05
      - 0.25
      default: 0.12
      binds_to:
      - path: generator.speed
        mode: replace
  subtask_id: approach_high
- id: lateral_align_high
  type: align
  generator: linear_cartesian
  control: position_control
  termination: pose_tolerance
  target:
    source: yaml
    anchor: task_goal
    offset:
    - 0.0
    - -0.05
    - 0.4
    tolerance: 0.02
    orientation:
      mode: none
  parameters:
    lat_speed:
      type: scalar
      range:
      - 0.02
      - 0.2
      default: 0.1
      binds_to:
      - path: generator.speed
        mode: replace
    lateral_y_final:
      type: scalar
      range:
      - -0.1
      - 0.0
      default: -0.05
      binds_to:
      - path: target.offset.y
        mode: replace
    lateral_z_height:
      type: scalar
      range:
      - 0.3
      - 0.6
      default: 0.4
      binds_to:
      - path: target.offset.z
        mode: replace
- id: descend_to_goal
  type: approach
  generator: linear_cartesian
  control: impedance_control
  termination: pose_tolerance
  target:
    source: yaml
    anchor: task_goal
    offset:
    - 0.0
    - 0.0
    - 0.0
    tolerance: 0.01
    orientation:
      mode: none
  parameters:
    descend_speed:
      type: scalar
      range:
      - 0.02
      - 0.15
      default: 0.07
      binds_to:
      - path: generator.speed
        mode: replace
  guards:
  - id: contact_guard
    when: during_phase
    predicate: force_below
    threshold: 5.0
    on_failure: retry
  retries:
    max_attempts: 2
    strategy: offset_target
    offset:
    - 0.0
    - 0.02
    - 0.0
  subtask_id: reach_goal
