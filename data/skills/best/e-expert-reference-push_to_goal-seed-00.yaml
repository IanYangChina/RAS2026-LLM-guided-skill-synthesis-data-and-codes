skill: push_to_goal
dsl_version: 2
skill_type: arm

phases:
  - id: approach_push_face
    type: approach
    generator: linear_cartesian
    control: position_control
    termination: pose_tolerance
    subtask_id: approach
    target:
      source: yaml
      anchor: task_object
      offset: [0.0, 0.0, 0.0]
      offset_along_axis:
        distance: 0.08
        axis: task_goal_direction
        mode: add_to_offset
        sign: negative
      tolerance: 0.015
      orientation: {mode: keep_current}

  - id: establish_box_contact
    type: contact
    generator: linear_cartesian
    control: force_threshold_switch
    termination: contact_detected
    subtask_id: contact
    target:
      source: yaml
      anchor: task_object
      offset: [0.0, 0.0, 0.0]
      offset_along_axis:
        distance: 0.020
        axis: task_goal_direction
        mode: add_to_offset
        sign: negative
      tolerance: 0.01
      orientation: {mode: keep_current}

  - id: push_box_to_goal
    type: push
    generator: impedance_motion
    control: impedance_control
    termination: pose_tolerance
    subtask_id: push
    target:
      source: yaml
      anchor: task_goal
      offset: [0.0, 0.0, 0.0]
      offset_along_axis:
        distance: 0.025
        axis: task_goal_direction
        mode: add_to_offset
        sign: negative
      tolerance: 0.02
      orientation: {mode: keep_current}
    parameters:
      trailing_contact_offset:
        type: scalar
        range: [0.0, 0.08]
        default: 0.020
        binds_to:
          - {path: target.offset_along_axis.distance, mode: replace}

  - id: retract_after_push
    type: retract
    generator: linear_cartesian
    control: position_control
    termination: pose_tolerance
    target:
      source: yaml
      anchor: current_tcp
      offset: [0.0, 0.08, 0.12]
      tolerance: 0.02
      orientation: {mode: keep_current}
