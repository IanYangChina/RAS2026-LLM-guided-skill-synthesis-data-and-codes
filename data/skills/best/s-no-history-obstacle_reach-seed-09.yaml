skill: obstacle_reach
dsl_version: 2
subtasks:
- id: reach_clearance
  anchor: fixture
  offset:
  - 0.0
  - 0.2
  - 0.17
  weight: 0.3
- id: reach_goal
  weight: 0.7
phases:
- id: approach_side
  type: approach
  generator: linear_cartesian
  control: position_control
  termination: pose_tolerance
  target:
    source: yaml
    anchor: fixture
    entity: obstacle_block
    offset:
    - 0.0
    - 0.2
    - 0.17
    tolerance: 0.02
    orientation:
      mode: keep_current
  parameters:
    approach_speed:
      type: scalar
      range:
      - 0.1
      - 0.5
      default: 0.25
      binds_to:
      - path: generator.speed
        mode: replace
    lateral_clearance:
      type: scalar
      range:
      - 0.16
      - 0.35
      default: 0.2
      binds_to:
      - path: target.offset.y
        mode: replace
  retries:
    max_attempts: 0
    strategy: repeat
  subtask_id: reach_clearance
- id: approach_past
  type: approach
  generator: linear_cartesian
  control: position_control
  termination: pose_tolerance
  target:
    source: yaml
    anchor: task_goal
    offset:
    - 0.0
    - 0.2
    - 0.17
    tolerance: 0.02
    orientation:
      mode: none
  parameters:
    approach_speed:
      type: scalar
      range:
      - 0.1
      - 0.5
      default: 0.25
      binds_to:
      - path: generator.speed
        mode: replace
    lateral_clearance:
      type: scalar
      range:
      - 0.16
      - 0.35
      default: 0.2
      binds_to:
      - path: target.offset.y
        mode: replace
  retries:
    max_attempts: 1
    strategy: offset_target
    offset:
    - 0.0
    - 0.0
    - 0.0
- id: descend_to_goal
  type: descend
  generator: linear_cartesian
  control: position_control
  termination: pose_tolerance
  target:
    source: yaml
    anchor: task_goal
    offset:
    - 0.0
    - -0.018
    - 0.0
    tolerance: 0.02
    orientation:
      mode: none
  parameters:
    descend_speed:
      type: scalar
      range:
      - 0.08
      - 0.5
      default: 0.35
      binds_to:
      - path: generator.speed
        mode: replace
    descend_y_offset:
      type: scalar
      range:
      - -0.03
      - 0.0
      default: -0.015
      binds_to:
      - path: target.offset.y
        mode: replace
  retries:
    max_attempts: 1
    strategy: offset_target
    offset:
    - 0.0
    - -0.01
    - 0.0
  subtask_id: reach_goal
