skill: peg_insert
phases:
- id: contact_1
  type: contact
  generator: impedance_motion
  control: force_threshold_switch
  termination: contact_detected
  parameters:
    contact_force:
      type: scalar
      range:
      - 1.0
      - 20.0
- id: insert_1
  type: insert
  generator: impedance_motion
  control: impedance_control
  termination: contact_detected
  parameters:
    insertion_depth:
      type: scalar
      range:
      - 0.01
      - 0.15
- id: retract_1
  type: retract
  generator: arc_cartesian
  control: position_control
  termination: pose_tolerance
