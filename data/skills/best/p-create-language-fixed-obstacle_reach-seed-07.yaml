skill: obstacle_reach
dsl_version: 2
phases:
- id: approach_high
  type: approach
  generator: arc_cartesian
  control: position_control
  termination: pose_tolerance
  target:
    source: yaml
    anchor: task_goal
    entity: goal_marker
    offset:
    - 0.0
    - 0.0
    - 0.08
    tolerance: 0.05
    orientation:
      mode: keep_current
  parameters:
    approach_tolerance:
      type: scalar
      range:
      - 0.03
      - 0.07
      default: 0.05
      binds_to:
      - path: termination.pose_tolerance
        mode: replace
    arc_height:
      type: scalar
      range:
      - 0.1
      - 0.22
      default: 0.14
      binds_to:
      - path: generator.arc_height
        mode: replace
    speed_approach:
      type: scalar
      range:
      - 0.08
      - 0.2
      default: 0.14
      binds_to:
      - path: generator.speed
        mode: replace
- id: descend_to_goal
  type: descend
  generator: linear_cartesian
  control: position_control
  termination: pose_tolerance
  target:
    source: yaml
    anchor: task_goal
    entity: goal_marker
    offset:
    - 0.0
    - 0.0
    - 0.0
    offset_along_axis:
      distance: 0.025
      axis: world_z
      mode: add_to_offset
      sign: negative
    tolerance: 0.025
    orientation:
      mode: keep_current
  parameters:
    descend_tolerance:
      type: scalar
      range:
      - 0.015
      - 0.035
      default: 0.025
      binds_to:
      - path: termination.pose_tolerance
        mode: replace
    speed_descend:
      type: scalar
      range:
      - 0.06
      - 0.15
      default: 0.1
      binds_to:
      - path: generator.speed
        mode: replace
