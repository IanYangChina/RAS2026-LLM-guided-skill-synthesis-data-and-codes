skill: grasp_place
dsl_version: 2
skill_type: arm_gripper

phases:
  - id: approach_object
    type: approach
    generator: linear_cartesian
    control: position_control
    termination: pose_tolerance
    end_effector_action: open
    subtask_id: approach_1
    target:
      source: yaml
      anchor: body
      entity: grasp_target
      offset: [0.06, 0.0, 0.12]
      tolerance: 0.012
      orientation:
        mode: align_axis
        axis: [0.0, 0.0, -1.0]
        align_with: world_z
        tolerance: 0.10
    parameters:
      approach_clearance:
        type: scalar
        range: [0.10, 0.14]
        default: 0.12
        binds_to:
          - {path: target.offset.z, mode: replace}

  - id: descend_to_grasp
    type: descend
    generator: linear_cartesian
    control: position_control
    termination: pose_tolerance
    end_effector_action: open
    subtask_id: descend_1
    target:
      source: yaml
      anchor: body
      entity: grasp_target
      offset: [0.016, 0.0, 0.015]
      tolerance: 0.008
      orientation: {mode: keep_current}
    parameters:
      grasp_z_adjustment:
        type: scalar
        range: [-0.015, -0.005]
        default: -0.01
        binds_to:
          - {path: target.offset.z, mode: add}

  - id: secure_grasp
    type: grasp
    generator: null
    control: position_control
    termination: time_limit
    end_effector_action: force_grasp
    subtask_id: grasp_1
    target:
      source: yaml
      anchor: current_tcp
      offset: [0.0, 0.0, 0.0]
      orientation: {mode: keep_current}
    guards:
      - id: bilateral_object_grasp
        when: after_phase
        predicate: bilateral_grasp
        args: {body: grasp_target}
        on_failure: retry
    retries:
      max_attempts: 1
      strategy: repeat

  - id: lift_object
    type: lift
    generator: linear_cartesian
    control: position_control
    termination: pose_tolerance
    target:
      source: yaml
      anchor: body
      entity: grasp_target
      offset: [0.016, 0.0, 0.17]
      tolerance: 0.015
      orientation: {mode: keep_current}
    parameters:
      lift_clearance:
        type: scalar
        range: [0.14, 0.20]
        default: 0.17
        binds_to:
          - {path: target.offset.z, mode: replace}
    guards:
      - id: object_clear_of_table
        when: after_phase
        predicate: object_lifted
        args: {body: grasp_target}
        threshold: 0.08
        on_failure: continue

  - id: transport_to_goal
    type: retract
    generator: linear_cartesian
    control: position_control
    termination: pose_tolerance
    subtask_id: transport_arc
    target:
      source: yaml
      anchor: task_goal
      offset: [0.016, 0.0, 0.025]
      tolerance: 0.015
      orientation: {mode: keep_current}
    parameters:
      transport_speed:
        type: scalar
        range: [0.02, 0.06]
        default: 0.04
        binds_to:
          - {path: generator.speed, mode: replace}
