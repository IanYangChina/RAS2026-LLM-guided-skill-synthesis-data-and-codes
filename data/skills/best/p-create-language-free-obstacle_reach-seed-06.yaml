    approach_2_z_offset:
      type: scalar
      range:
      - 0.12
      - 0.22
      default: 0.17
      binds_to:
      - path: target.offset.z
        mode: replace
  guards:
  - id: force_guard_2
    when: during_phase
    predicate: force_below
    threshold: 5.0
    on_failure: abort
  retries:
    max_attempts: 2
    strategy: offset_target
    offset:
    - 0.0
    - -0.03
    - 0.0
  subtask_id: reach_goal
- id: descend_1
  type: descend
  generator: linear_cartesian
  control: position_control
  termination: pose_tolerance
  target:
    source: yaml
