skill: obstacle_reach
dsl_version: 2
subtasks:
- id: reach_clear
  anchor: fixture
  offset:
  - 0.0
  - -0.284
  - 0.17
  weight: 0.3
- id: reach_goal
  weight: 0.7
phases:
- id: approach_1
  type: approach
  generator: linear_cartesian
  control: position_control
  termination: pose_tolerance
  target:
    source: yaml
    anchor: task_goal
    entity: goal_marker
    offset:
    - -0.204
    - 0.0
    - 0.17
    tolerance: 0.02
    orientation:
      mode: keep_current
  parameters:
    approach_1_speed:
      type: scalar
      range:
      - 0.2
      - 0.5
      default: 0.35
      binds_to:
      - path: generator.speed
        mode: replace
    lateral_clearance:
      type: scalar
      range:
      - -0.35
      - -0.2
      default: -0.284
      binds_to:
      - path: target.offset.y
        mode: replace
  guards:
  - id: force_guard_1
    when: during_phase
    predicate: force_below
    threshold: 5.0
    on_failure: abort
  retries:
    max_attempts: 2
    strategy: offset_target
    offset:
    - 0.0
    - -0.03
    - 0.0
  subtask_id: reach_clear
- id: approach_2
  type: approach
  generator: linear_cartesian
  control: position_control
  termination: pose_tolerance
  target:
