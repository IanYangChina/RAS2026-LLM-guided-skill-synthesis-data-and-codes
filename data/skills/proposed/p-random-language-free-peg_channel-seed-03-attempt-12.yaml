dsl_version: 2
phases:
- control: position_control
  generator: linear_cartesian
  id: approach_behind
  parameters:
    approach_height:
      binds_to:
      - mode: replace
        path: target.offset.z
      default: 0.15
      range:
      - 0.1
      - 0.2
      type: scalar
  subtask_id: approach_peg
  target:
    anchor: task_object
    entity: peg
    offset:
    - 0.0
    - 0.05
    - 0.15
    orientation:
      mode: none
    source: yaml
    tolerance: 0.02
  termination: pose_tolerance
  type: approach
- control: position_control
  generator: linear_cartesian
  id: align_descend
  subtask_id: approach_peg
  target:
    anchor: task_object
    entity: peg
    offset:
    - 0.0
    - 0.03
    - 0.0
    orientation:
      mode: none
    source: yaml
    tolerance: 0.02
  termination: pose_tolerance
  type: descend
- control: impedance_control
  generator: linear_cartesian
  guards:
  - args: {}
    id: force_check
    on_failure: continue
    predicate: force_below
    threshold: 40.0
    when: during_phase
  id: push_along_channel
  retries:
    max_attempts: 1
    strategy: repeat
  subtask_id: push_to_goal
  target:
    anchor: task_goal
    entity: null
    offset:
    - 0.0
    - 0.0
    - 0.0
    orientation:
      mode: none
    source: yaml
    tolerance: 0.02
  termination: pose_tolerance
  type: push
skill: peg_channel
subtasks:
- anchor: object
  id: approach_peg
  offset:
  - 0.0
  - 0.05
  - 0.15
  weight: 0.3
- id: push_to_goal
  metric: goal_progress
  target_entity: object
  weight: 0.7
