dsl_version: 2
phases:
- control: position_control
  generator: arc_cartesian
  id: approach_high
  parameters:
    arc_height:
      binds_to:
      - mode: replace
        path: generator.arc_height
      default: 0.1
      range:
      - 0.05
      - 0.15
      type: scalar
    speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.05
      range:
      - 0.01
      - 0.1
      type: scalar
  subtask_id: reach_peg
  target:
    anchor: task_object
    entity: peg
    offset:
    - 0.0
    - 0.08
    - 0.1
    orientation:
      align_with: channel_axis
      axis:
      - 0.0
      - 0.0
      - 1.0
      mode: align_axis
    source: yaml
    tolerance: 0.015
  termination: pose_tolerance
  type: approach
- control: position_control
  generator: linear_cartesian
  id: descend_contact
  parameters:
    speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.03
      range:
      - 0.01
      - 0.1
      type: scalar
  subtask_id: reach_peg
  target:
    anchor: task_object
    entity: peg
    offset:
    - 0.0
    - 0.08
    - 0.005
    orientation:
      align_with: channel_axis
      axis:
      - 0.0
      - 0.0
      - 1.0
      mode: align_axis
    source: yaml
    tolerance: 0.01
  termination: pose_tolerance
  type: approach
- control: force_threshold_switch
  generator: linear_cartesian
  id: contact_peg
  parameters:
    contact_force:
      binds_to:
      - mode: replace
        path: termination.force_threshold
      default: 5.0
      range:
      - 1.0
      - 20.0
      type: scalar
    speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.02
      range:
      - 0.005
      - 0.05
      type: scalar
  subtask_id: reach_peg
  target:
    anchor: current_tcp
    offset:
    - 0.0
    - 0.0
    - 0.0
    offset_along_axis:
      axis: channel_axis
      distance: 0.04
      mode: add_to_offset
      sign: positive
    orientation:
      align_with: channel_axis
      axis:
      - 0.0
      - 0.0
      - 1.0
      mode: align_axis
    source: yaml
  termination: force_exceeded
  type: contact
- control: impedance_control
  generator: impedance_motion
  guards:
  - args: {}
    id: success_tolerance
    on_failure: continue
    predicate: pose_within_tolerance
    threshold: 0.015
    when: during_phase
  id: push_into_channel
  parameters:
    insert_depth:
      binds_to:
      - mode: replace
        path: target.offset_along_axis.distance
      default: 0.16
      range:
      - 0.14
      - 0.18
      type: scalar
    max_force:
      binds_to:
      - mode: replace
        path: termination.force_threshold
      default: 35.0
      range:
      - 10.0
      - 40.0
      type: scalar
    push_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.03
      range:
      - 0.01
      - 0.08
      type: scalar
  subtask_id: push_goal
  target:
    anchor: current_tcp
    offset:
    - 0.0
    - 0.0
    - 0.0
    offset_along_axis:
      axis: channel_axis
      distance: 0.16
      mode: add_to_offset
      sign: positive
    orientation:
      align_with: channel_axis
      axis:
      - 0.0
      - 0.0
      - 1.0
      mode: align_axis
    source: yaml
    tolerance: 0.01
  termination: force_exceeded
  type: push
- control: position_control
  generator: linear_cartesian
  id: retract_home
  parameters:
    speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.05
      range:
      - 0.01
      - 0.1
      type: scalar
  target:
    anchor: world
    offset:
    - 0.5
    - 0.2
    - 0.3
    orientation:
      mode: keep_current
    source: yaml
    tolerance: 0.02
  termination: pose_tolerance
  type: retract
skill: peg_channel
subtasks:
- anchor: object
  id: reach_peg
  metric: distance
  offset:
  - 0.0
  - 0.08
  - 0.005
  target_entity: tcp
  weight: 0.3
- anchor: goal
  id: push_goal
  metric: goal_progress
  offset:
  - 0.0
  - 0.0
  - 0.0
  target_entity: object
  weight: 0.7
