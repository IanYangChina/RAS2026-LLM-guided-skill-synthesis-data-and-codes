dsl_version: 2
phases:
- control: position_control
  generator: impedance_motion
  id: rotate_1
  parameters:
    retract_height:
      binds_to:
      - mode: replace
        path: target.offset.z
      default: 0.12
      range:
      - 0.05
      - 0.2
      type: scalar
  subtask_id: approach_entry
  target:
    anchor: fixture
    entity: peg_socket
    offset:
    - 0
    - 0
    - 0.15
    orientation:
      align_with: insertion_axis
      axis:
      - 0
      - 0
      - 1
      mode: align_axis
      tolerance: 0.05
    source: yaml
    tolerance: 0.02
  termination: pose_tolerance
  type: rotate
- control: position_control
  generator: arc_cartesian
  id: retract_1
  subtask_id: approach_entry
  target:
    anchor: fixture
    entity: peg_socket
    offset:
    - 0
    - 0
    - 0.08
    orientation:
      mode: keep_current
    source: yaml
    tolerance: 0.02
  termination: pose_tolerance
  type: retract
- control: admittance_control
  generator: linear_cartesian
  id: descend_1
  parameters:
    depth:
      binds_to:
      - mode: replace
        path: target.offset_along_axis.distance
      default: 0.055
      range:
      - 0.01
      - 0.1
      type: scalar
  subtask_id: insertion_goal
  target:
    anchor: fixture
    entity: peg_socket
    offset:
    - 0
    - 0
    - 0.025
    offset_along_axis:
      axis: insertion_axis
      distance: 0.055
      mode: add_to_offset
      sign: positive
    orientation:
      mode: keep_current
    source: yaml
    tolerance: 0.02
  termination: pose_tolerance
  type: descend
- control: impedance_control
  generator: arc_cartesian
  id: pull_1
  parameters:
    pull_distance:
      binds_to:
      - mode: replace
        path: target.offset.z
      default: 0.1
      range:
      - 0.02
      - 0.2
      type: scalar
  subtask_id: insertion_goal
  target:
    anchor: fixture
    entity: peg_socket
    offset:
    - 0
    - 0
    - 0.1
    orientation:
      mode: keep_current
    source: yaml
    tolerance: 0.02
  termination: time_limit
  type: pull
skill: peg_insert
subtasks:
- anchor: fixture
  id: approach_entry
  metric: distance
  offset:
  - 0
  - 0
  - 0.08
  target_entity: tcp
  weight: 0.3
- anchor: fixture
  id: insertion_goal
  metric: distance
  offset:
  - 0
  - 0
  - 0.025
  target_entity: tcp
  weight: 0.7
