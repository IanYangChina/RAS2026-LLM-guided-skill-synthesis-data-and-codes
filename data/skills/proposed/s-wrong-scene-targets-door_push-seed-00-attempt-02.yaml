dsl_version: 2
phases:
- control: position_control
  generator: linear_cartesian
  id: approach_handle
  parameters:
    approach_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.08
      range:
      - 0.01
      - 0.2
      type: scalar
    approach_z_offset:
      binds_to:
      - mode: replace
        path: target.offset.z
      default: 0.05
      range:
      - 0.02
      - 0.15
      type: scalar
  subtask_id: reach_handle
  target:
    anchor: task_goal
    offset:
    - 0.0
    - 0.0
    - 0.05
    orientation:
      mode: none
    source: yaml
    tolerance: 0.01
  termination: pose_tolerance
  type: approach
- control: impedance_control
  generator: linear_cartesian
  guards:
  - args: {}
    id: contact_check
    on_failure: abort
    predicate: contact_detected
    threshold: 1.0
    when: during_phase
  id: push_door
  parameters:
    push_distance:
      binds_to:
      - mode: replace
        path: target.offset_along_axis.distance
      default: 0.4
      range:
      - 0.1
      - 0.6
      type: scalar
    push_duration:
      binds_to:
      - mode: replace
        path: duration.max_time
      default: 3.0
      range:
      - 1.0
      - 5.0
      type: scalar
    push_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.06
      range:
      - 0.01
      - 0.15
      type: scalar
  subtask_id: push_door
  target:
    anchor: task_goal
    offset:
    - 0.0
    - 0.0
    - 0.0
    offset_along_axis:
      axis: task_goal_direction
      distance: 0.4
      mode: add_to_offset
      sign: positive
    orientation:
      mode: none
    source: yaml
    tolerance: 0.05
  termination: time_limit
  type: push
skill: door_push
subtasks:
- anchor: goal
  id: reach_handle
  metric: distance
  offset:
  - 0.0
  - 0.0
  - 0.05
  target_entity: tcp
  weight: 0.3
- anchor: fixture
  id: push_door
  metric: hinge_angle
  offset:
  - 0.0
  - 0.0
  - 0.0
  target_entity: hinge
  weight: 1.0
