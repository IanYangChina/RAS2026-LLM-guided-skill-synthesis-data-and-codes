dsl_version: 2
phases:
- control: position_control
  generator: linear_cartesian
  id: approach_to_entry
  parameters:
    approach_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.15
      range:
      - 0.02
      - 0.25
      type: scalar
    approach_tolerance:
      binds_to:
      - mode: replace
        path: termination.pose_tolerance
      default: 0.03
      range:
      - 0.01
      - 0.05
      type: scalar
  subtask_id: approach_entry
  target:
    anchor: task_goal
    offset:
    - 0.0
    - 0.0
    - 0.12
    orientation:
      mode: keep_current
    source: yaml
  termination: pose_tolerance
  type: approach
- control: position_control
  generator: linear_cartesian
  guards:
  - id: check_alignment
    on_failure: retry
    predicate: pose_within_tolerance
    threshold: 0.03
    when: before_phase
  id: fine_align
  parameters:
    align_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.1
      range:
      - 0.02
      - 0.2
      type: scalar
    align_tolerance:
      binds_to:
      - mode: replace
        path: termination.pose_tolerance
      default: 0.025
      range:
      - 0.01
      - 0.04
      type: scalar
    guard_threshold:
      binds_to:
      - mode: replace
        path: guards.check_alignment.threshold
      default: 0.03
      range:
      - 0.01
      - 0.04
      type: scalar
    lateral_offset_x:
      binds_to:
      - mode: add
        path: target.offset.x
      default: 0.0
      range:
      - -0.02
      - 0.02
      type: scalar
    lateral_offset_y:
      binds_to:
      - mode: add
        path: target.offset.y
      default: 0.0
      range:
      - -0.02
      - 0.02
      type: scalar
    retry_offset_x:
      binds_to:
      - mode: replace
        path: retry.offset.x
      default: 0.0
      range:
      - -0.015
      - 0.015
      type: scalar
    retry_offset_y:
      binds_to:
      - mode: replace
        path: retry.offset.y
      default: 0.0
      range:
      - -0.015
      - 0.015
      type: scalar
  retries:
    max_attempts: 2
    offset:
    - 0.0
    - 0.0
    - 0.0
    strategy: offset_target
  subtask_id: alignment_complete
  target:
    anchor: task_goal
    offset:
    - 0.0
    - 0.0
    - 0.06
    orientation:
      align_with: channel_axis
      axis:
      - 0.0
      - 0.0
      - 1.0
      mode: align_axis
      tolerance: 0.05
    source: yaml
  termination: pose_tolerance
  type: align
- control: impedance_control
  generator: linear_cartesian
  guards:
  - id: check_pose
    on_failure: retry
    predicate: pose_within_tolerance
    threshold: 0.03
    when: before_phase
  - id: force_check
    on_failure: retry
    predicate: force_below
    threshold: 20.0
    when: during_phase
  id: descend_insert
  parameters:
    force_guard_threshold:
      binds_to:
      - mode: replace
        path: guards.force_check.threshold
      default: 20.0
      range:
      - 10.0
      - 35.0
      type: scalar
    guard_pose_tolerance:
      binds_to:
      - mode: replace
        path: guards.check_pose.threshold
      default: 0.03
      range:
      - 0.01
      - 0.04
      type: scalar
    insert_pose_tolerance:
      binds_to:
      - mode: replace
        path: termination.pose_tolerance
      default: 0.02
      range:
      - 0.01
      - 0.03
      type: scalar
    insertion_depth:
      binds_to:
      - mode: replace
        path: target.offset_along_axis.distance
      default: 0.035
      range:
      - 0.02
      - 0.045
      type: scalar
    insertion_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.015
      range:
      - 0.005
      - 0.04
      type: scalar
    retry_offset_x:
      binds_to:
      - mode: replace
        path: retry.offset.x
      default: 0.0
      range:
      - -0.008
      - 0.008
      type: scalar
    retry_offset_y:
      binds_to:
      - mode: replace
        path: retry.offset.y
      default: 0.0
      range:
      - -0.008
      - 0.008
      type: scalar
  retries:
    max_attempts: 2
    offset:
    - 0.0
    - 0.0
    - 0.0
    strategy: offset_target
  subtask_id: insertion_complete
  target:
    anchor: task_goal
    offset:
    - 0.0
    - 0.0
    - 0.06
    offset_along_axis:
      axis: channel_axis
      distance: 0.035
      mode: replace_offset_projection
      sign: positive
    orientation:
      align_with: channel_axis
      axis:
      - 0.0
      - 0.0
      - 1.0
      mode: align_axis
      tolerance: 0.05
    source: yaml
  termination: pose_tolerance
  type: insert
skill: peg_insert
skill_type: arm_gripper
subtasks:
- anchor: fixture
  id: approach_entry
  offset:
  - 0.0
  - 0.0
  - 0.12
  weight: 0.3
- anchor: fixture
  id: alignment_complete
  offset:
  - 0.0
  - 0.0
  - 0.06
  weight: 0.3
- anchor: fixture
  id: insertion_complete
  metric: goal_progress
  target_entity: object
  weight: 0.4
