dsl_version: 2
phases:
- control: position_control
  generator: arc_cartesian
  id: approach_peg
  parameters:
    approach_arc_height:
      binds_to:
      - mode: replace
        path: generator.arc_height
      default: 0.04
      range:
      - 0.01
      - 0.08
      type: scalar
    approach_pose_tol:
      binds_to:
      - mode: replace
        path: termination.pose_tolerance
      default: 0.02
      range:
      - 0.005
      - 0.04
      type: scalar
    approach_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.15
      range:
      - 0.05
      - 0.5
      type: scalar
  target:
    anchor: task_object
    entity: peg
    offset:
    - 0.0
    - 0.05
    - 0.04
    orientation:
      mode: none
    source: yaml
  termination: pose_tolerance
  type: approach
- control: force_threshold_switch
  generator: linear_cartesian
  id: contact_peg
  parameters:
    contact_force_threshold:
      binds_to:
      - mode: replace
        path: termination.force_threshold
      default: 15.0
      range:
      - 5.0
      - 30.0
      type: scalar
    contact_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.05
      range:
      - 0.01
      - 0.2
      type: scalar
  target:
    anchor: task_object
    entity: peg
    offset:
    - 0.0
    - 0.01
    - 0.0
    orientation:
      mode: none
    source: yaml
  termination: force_exceeded
  type: contact
- control: impedance_control
  generator: linear_cartesian
  guards:
  - args: {}
    id: push_force_guard
    on_failure: retry
    predicate: force_below
    threshold: 5.0
    when: during_phase
  id: push_through_channel
  parameters:
    push_depth:
      binds_to:
      - mode: replace
        path: target.offset_along_axis.distance
      default: 0.16
      range:
      - 0.1
      - 0.2
      type: scalar
    push_force_threshold:
      binds_to:
      - mode: replace
        path: guards.push_force_guard.threshold
      default: 5.0
      range:
      - 2.0
      - 10.0
      type: scalar
    push_lateral_offset:
      binds_to:
      - mode: replace
        path: target.offset.x
      default: 0.0
      range:
      - -0.04
      - 0.04
      type: scalar
    push_pose_tol:
      binds_to:
      - mode: replace
        path: termination.pose_tolerance
      default: 0.02
      range:
      - 0.005
      - 0.04
      type: scalar
    push_retry_offset_x:
      binds_to:
      - mode: replace
        path: retry.offset.x
      default: 0.0
      range:
      - -0.04
      - 0.04
      type: scalar
    push_retry_offset_y:
      binds_to:
      - mode: replace
        path: retry.offset.y
      default: 0.0
      range:
      - -0.04
      - 0.04
      type: scalar
    push_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.05
      range:
      - 0.02
      - 0.15
      type: scalar
  retries:
    max_attempts: 2
    offset:
    - 0.0
    - 0.0
    - 0.0
    strategy: offset_target
  target:
    anchor: task_goal
    entity: channel_exit
    offset:
    - 0.0
    - 0.12
    - 0.0
    offset_along_axis:
      axis: channel_axis
      distance: 0.16
      mode: add_to_offset
      sign: positive
    orientation:
      mode: keep_current
    source: yaml
  termination: pose_tolerance
  type: push
skill: peg_channel
