dsl_version: 2
phases:
- control: position_control
  generator: linear_cartesian
  guards: []
  id: approach_object
  orientation:
    mode: keep_current
  parameters:
    approach_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.1
      range:
      - 0.02
      - 0.2
      type: scalar
  subtask_id: reach_object
  target:
    anchor: task_object
    offset:
    - 0.0
    - 0.0
    - 0.1
    tolerance: 0.02
  termination: pose_tolerance
  type: approach
- control: force_threshold_switch
  generator: linear_cartesian
  guards: []
  id: descend_to_contact
  orientation:
    mode: keep_current
  parameters:
    contact_force:
      binds_to:
      - mode: replace
        path: termination.force_threshold
      default: 5.0
      range:
      - 1.0
      - 10.0
      type: scalar
  target:
    anchor: task_object
    offset:
    - 0.0
    - 0.0
    - 0.025
    tolerance: 0.005
  termination: force_exceeded
  type: descend
- control: impedance_control
  generator: impedance_motion
  guards: []
  id: push_to_goal
  orientation:
    mode: keep_current
  parameters:
    push_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.1
      range:
      - 0.02
      - 0.2
      type: scalar
  subtask_id: push_to_goal
  target:
    anchor: task_goal
    offset:
    - 0.0
    - 0.0
    - 0.0
    tolerance: 0.02
  termination: pose_tolerance
  type: push
skill: push_to_goal
skill_type: arm
subtasks:
- anchor: object
  id: reach_object
  metric: distance
  offset:
  - 0.0
  - 0.0
  - 0.1
  target_entity: tcp
  weight: 0.3
- anchor: goal
  id: push_to_goal
  metric: goal_progress
  offset:
  - 0.0
  - 0.0
  - 0.0
  target_entity: object
  weight: 0.7
