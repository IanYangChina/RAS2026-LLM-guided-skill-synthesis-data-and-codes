dsl_version: 2
phases:
- control: position_control
  generator: linear_cartesian
  id: approach_align
  parameters:
    lateral_x:
      binds_to:
      - mode: add
        path: target.offset.x
      default: 0.0
      range:
      - -0.01
      - 0.01
      type: scalar
    lateral_y:
      binds_to:
      - mode: add
        path: target.offset.y
      default: 0.0
      range:
      - -0.01
      - 0.01
      type: scalar
  subtask_id: approach
  target:
    anchor: fixture
    entity: peg_socket
    offset:
    - 0.0
    - 0.0
    - 0.06
    orientation:
      align_with: insertion_axis
      axis:
      - 0
      - 0
      - 1
      mode: align_axis
      tolerance: 0.05
    source: yaml
    tolerance: 0.01
  termination: pose_tolerance
  type: align
- control: impedance_control
  generator: impedance_motion
  id: descend_insert
  parameters:
    force_threshold:
      binds_to:
      - mode: replace
        path: termination.force_threshold
      default: 30.0
      range:
      - 10.0
      - 40.0
      type: scalar
    push_depth:
      binds_to:
      - mode: replace
        path: target.offset_along_axis.distance
      default: 0.05
      range:
      - 0.03
      - 0.08
      type: scalar
  subtask_id: insertion
  target:
    anchor: fixture
    entity: peg_socket
    offset_along_axis:
      axis: insertion_axis
      distance: 0.06
      mode: replace_offset_projection
      sign: negative
    orientation:
      mode: keep_current
    source: yaml
  termination: force_exceeded
  type: push
- control: position_control
  generator: linear_cartesian
  id: lift_retract
  target:
    anchor: fixture
    entity: peg_socket
    offset:
    - 0.0
    - 0.0
    - 0.05
    orientation:
      mode: keep_current
    source: yaml
  termination: pose_tolerance
  type: retract
skill: peg_insert
skill_type: arm_gripper
subtasks:
- anchor: fixture
  id: approach
  offset:
  - 0.0
  - 0.0
  - 0.05
  target_entity: tcp
  weight: 0.3
- anchor: fixture
  id: insertion
  metric: goal_progress
  offset:
  - 0.0
  - 0.0
  - -0.04
  target_entity: tcp
  weight: 0.7
