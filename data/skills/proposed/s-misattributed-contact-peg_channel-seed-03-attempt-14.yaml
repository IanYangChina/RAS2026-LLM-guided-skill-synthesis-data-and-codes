dsl_version: 2
phases:
- control: position_control
  generator: linear_cartesian
  id: approach_1
  parameters:
    approach_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.2
      range:
      - 0.05
      - 0.5
      type: scalar
  subtask_id: approach_peg
  target:
    anchor: task_object
    offset:
    - 0.0
    - 0.08
    - 0.1
    orientation:
      mode: none
    source: yaml
    tolerance: 0.01
  termination: pose_tolerance
  type: approach
- control: position_control
  generator: linear_cartesian
  id: descend_1
  parameters:
    descend_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.08
      range:
      - 0.02
      - 0.2
      type: scalar
  subtask_id: contact_peg
  target:
    anchor: task_object
    offset:
    - 0.0
    - 0.08
    - 0.0
    orientation:
      mode: none
    source: yaml
    tolerance: 0.01
  termination: contact_detected
  type: descend
- control: impedance_control
  generator: linear_cartesian
  id: push_1
  parameters:
    push_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.08
      range:
      - 0.03
      - 0.15
      type: scalar
    push_tolerance:
      binds_to:
      - mode: replace
        path: termination.pose_tolerance
      default: 0.015
      range:
      - 0.01
      - 0.025
      type: scalar
  subtask_id: push_peg
  target:
    anchor: task_goal
    offset:
    - 0.0
    - 0.0
    - 0.0
    orientation:
      align_with: channel_axis
      axis:
      - 0.0
      - 0.0
      - 1.0
      mode: align_axis
      tolerance: 0.1
    source: yaml
    tolerance: 0.015
  termination: pose_tolerance
  type: push
skill: peg_channel
subtasks:
- anchor: object
  id: approach_peg
  metric: distance
  offset:
  - 0.0
  - 0.08
  - 0.1
  target_entity: tcp
  weight: 0.2
- anchor: object
  id: contact_peg
  metric: distance
  offset:
  - 0.0
  - 0.08
  - 0.0
  target_entity: tcp
  weight: 0.3
- anchor: goal
  id: push_peg
  metric: distance
  offset:
  - 0.0
  - 0.0
  - 0.0
  target_entity: tcp
  weight: 0.5
