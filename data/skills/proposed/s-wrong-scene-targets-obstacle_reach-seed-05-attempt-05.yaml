dsl_version: 2
phases:
- control: position_control
  generator: arc_cartesian
  id: approach_over_obstacle
  parameters:
    approach_tolerance:
      binds_to:
      - mode: add
        path: termination.pose_tolerance
      default: 0.04
      range:
      - 0.02
      - 0.08
      type: scalar
    arc_height:
      binds_to:
      - mode: add
        path: generator.arc_height
      default: 0.2
      range:
      - 0.1
      - 0.35
      type: scalar
    speed:
      binds_to:
      - mode: add
        path: generator.speed
      default: 0.1
      range:
      - 0.02
      - 0.3
      type: scalar
  subtask_id: reach_goal
  target:
    anchor: task_goal
    offset:
    - 0.0
    - 0.0
    - 0.05
    source: yaml
  termination: pose_tolerance
  type: approach
- control: position_control
  generator: linear_cartesian
  id: descend_to_goal
  parameters:
    descend_speed:
      binds_to:
      - mode: add
        path: generator.speed
      default: 0.1
      range:
      - 0.02
      - 0.2
      type: scalar
    descend_tolerance:
      binds_to:
      - mode: add
        path: termination.pose_tolerance
      default: 0.02
      range:
      - 0.01
      - 0.04
      type: scalar
  subtask_id: reach_goal
  target:
    anchor: task_goal
    offset:
    - 0.0
    - 0.0
    - 0.0
    source: yaml
  termination: pose_tolerance
  type: descend
skill: obstacle_reach
subtasks:
- id: reach_goal
