dsl_version: 2
phases:
- control: position_control
  generator: arc_cartesian
  id: approach_peg
  parameters:
    approach_height:
      binds_to:
      - mode: replace
        path: target.offset.z
      default: 0.15
      range:
      - 0.05
      - 0.3
      type: scalar
    arc_height:
      binds_to:
      - mode: replace
        path: generator.arc_height
      default: 0.08
      range:
      - 0.02
      - 0.15
      type: scalar
    speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.05
      range:
      - 0.01
      - 0.1
      type: scalar
  subtask_id: reach_peg
  target:
    anchor: task_object
    entity: peg
    offset:
    - 0.0
    - 0.0
    - 0.15
    orientation:
      mode: keep_current
    source: yaml
    tolerance: 0.02
  termination: pose_tolerance
  type: approach
- control: force_threshold_switch
  generator: linear_cartesian
  id: descend_to_contact
  parameters:
    contact_force:
      binds_to:
      - mode: replace
        path: termination.force_threshold
      default: 10.0
      range:
      - 1.0
      - 20.0
      type: scalar
    descend_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.03
      range:
      - 0.01
      - 0.08
      type: scalar
    lateral_offset_x:
      binds_to:
      - mode: replace
        path: target.offset.x
      default: 0.0
      range:
      - -0.015
      - 0.015
      type: scalar
  subtask_id: reach_peg
  target:
    anchor: task_object
    entity: peg
    offset:
    - 0.0
    - 0.0
    - 0.02
    orientation:
      mode: keep_current
    source: yaml
    tolerance: 0.01
  termination: force_exceeded
  type: descend
- control: impedance_control
  generator: impedance_motion
  guards:
  - args: {}
    id: force_limit
    on_failure: retry
    predicate: force_below
    threshold: 40.0
    when: during_phase
  id: push_along_channel
  parameters:
    lateral_offset_y:
      binds_to:
      - mode: add
        path: retry.offset.y
      default: 0.0
      range:
      - -0.01
      - 0.01
      type: scalar
  retries:
    max_attempts: 2
    offset:
    - 0.0
    - 0.005
    - 0.0
    strategy: offset_target
  subtask_id: push_channel
  target:
    anchor: current_tcp
    offset:
    - 0.0
    - 0.0
    - 0.0
    offset_along_axis:
      axis: channel_axis
      distance: 0.16
      mode: add_to_offset
      sign: negative
    source: yaml
  termination: time_limit
  type: push
- control: position_control
  generator: arc_cartesian
  id: lift_and_retract
  parameters:
    retract_height:
      binds_to:
      - mode: replace
        path: target.offset.z
      default: 0.1
      range:
      - 0.05
      - 0.2
      type: scalar
    speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.05
      range:
      - 0.01
      - 0.1
      type: scalar
  target:
    anchor: current_tcp
    offset:
    - 0.0
    - 0.0
    - 0.1
    orientation:
      mode: keep_current
    source: yaml
  termination: pose_tolerance
  type: retract
skill: peg_channel
skill_type: arm
subtasks:
- anchor: object
  id: reach_peg
  metric: distance
  offset:
  - 0.0
  - 0.0
  - 0.1
  target_entity: tcp
  weight: 0.3
- anchor: goal
  id: push_channel
  metric: goal_progress
  target_entity: object
  weight: 0.7
