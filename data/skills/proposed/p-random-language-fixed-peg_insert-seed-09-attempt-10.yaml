dsl_version: 2
phases:
- control: position_control
  generator: linear_cartesian
  id: align_above
  parameters:
    align_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.05
      range:
      - 0.02
      - 0.1
      type: scalar
  subtask_id: align
  target:
    anchor: task_goal
    entity: peg_socket
    offset:
    - 0.0
    - 0.0
    - 0.12
    source: yaml
    tolerance: 0.01
  termination: pose_tolerance
  type: align
- control: admittance_control
  generator: linear_cartesian
  guards:
  - id: force_guard
    on_failure: retry
    predicate: force_below
    threshold: 30.0
    when: during_phase
  id: approach_entry
  parameters:
    descend_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.02
      range:
      - 0.01
      - 0.05
      type: scalar
  retries:
    max_attempts: 2
    offset:
    - 0.005
    - 0.0
    - 0.0
    strategy: offset_target
  subtask_id: approach
  target:
    anchor: task_goal
    entity: peg_socket
    offset:
    - 0.0
    - 0.0
    - 0.005
    source: yaml
    tolerance: 0.005
  termination: pose_tolerance
  type: descend
- control: force_threshold_switch
  generator: linear_cartesian
  id: contact_rim
  parameters:
    probe_force:
      binds_to:
      - mode: add
        path: termination.force_threshold
      default: 8.0
      range:
      - 3.0
      - 15.0
      type: scalar
  retries:
    max_attempts: 2
    offset:
    - 0.003
    - 0.003
    - 0.0
    strategy: offset_target
  subtask_id: contact
  target:
    anchor: task_goal
    entity: peg_socket
    offset:
    - 0.0
    - 0.0
    - -0.005
    source: yaml
    tolerance: 0.005
  termination: force_exceeded
  type: contact
- control: position_control
  generator: linear_cartesian
  id: lift_off_contact
  subtask_id: null
  target:
    anchor: current_tcp
    offset:
    - 0.0
    - 0.0
    - 0.01
    source: yaml
    tolerance: 0.005
  termination: pose_tolerance
  type: retract
- control: impedance_control
  generator: linear_cartesian
  guards:
  - id: high_force_guard
    on_failure: retry
    predicate: force_below
    threshold: 35.0
    when: during_phase
  id: insert_down
  parameters:
    insert_depth:
      binds_to:
      - mode: replace
        path: target.offset_along_axis.distance
      default: 0.05
      range:
      - 0.04
      - 0.07
      type: scalar
    insert_force_guard_threshold:
      binds_to:
      - mode: replace
        path: guards.high_force_guard.threshold
      default: 35.0
      range:
      - 15.0
      - 40.0
      type: scalar
    insert_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.015
      range:
      - 0.005
      - 0.04
      type: scalar
    retry_offset_x:
      binds_to:
      - mode: replace
        path: retry.offset.x
      default: 0.003
      range:
      - -0.01
      - 0.01
      type: scalar
    retry_offset_y:
      binds_to:
      - mode: replace
        path: retry.offset.y
      default: 0.003
      range:
      - -0.01
      - 0.01
      type: scalar
  retries:
    max_attempts: 2
    offset:
    - 0.003
    - 0.003
    - 0.0
    strategy: offset_target
  subtask_id: insert
  target:
    anchor: task_goal
    entity: peg_socket
    offset:
    - 0.0
    - 0.0
    - 0.0
    offset_along_axis:
      axis: channel_axis
      distance: 0.05
      mode: add_to_offset
      sign: positive
    orientation:
      align_with: channel_axis
      axis:
      - 0.0
      - 0.0
      - 1.0
      mode: align_axis
      tolerance: 0.1
    source: yaml
    tolerance: 0.01
  termination: pose_tolerance
  type: insert
skill: peg_insert
