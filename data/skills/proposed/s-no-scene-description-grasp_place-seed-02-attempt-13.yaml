dsl_version: 2
phases:
- control: position_control
  generator: arc_cartesian
  id: approach_object
  parameters:
    approach_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.2
      range:
      - 0.05
      - 0.5
      type: scalar
    arc_height:
      binds_to:
      - mode: replace
        path: generator.arc_height
      default: 0.08
      range:
      - 0.02
      - 0.25
      type: scalar
  retries:
    max_attempts: 1
    offset:
    - 0.0
    - 0.0
    - 0.0
    strategy: reduce_speed
  subtask_id: reach_object
  target:
    anchor: task_object
    entity: grasp_target
    offset:
    - 0.0
    - 0.0
    - 0.1
    orientation:
      mode: keep_current
    source: yaml
    tolerance: 0.01
  termination: pose_tolerance
  type: approach
- control: force_threshold_switch
  generator: linear_cartesian
  guards:
  - args: {}
    id: check_force_before_descend
    on_failure: abort
    predicate: force_below
    threshold: 20.0
    when: before_phase
  id: descend_to_grasp
  parameters:
    contact_force_threshold:
      binds_to:
      - mode: replace
        path: termination.force_threshold
      default: 10.0
      range:
      - 2.0
      - 20.0
      type: scalar
    descend_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.1
      range:
      - 0.02
      - 0.3
      type: scalar
  retries:
    max_attempts: 2
    offset:
    - 0.0
    - 0.0
    - -0.005
    strategy: offset_target
  subtask_id: grasp_object
  target:
    anchor: task_object
    entity: grasp_target
    offset:
    - 0.0
    - 0.0
    - 0.0
    orientation:
      mode: keep_current
    source: yaml
  termination: force_exceeded
  type: descend
- control: position_control
  end_effector_action: force_grasp
  generator: null
  guards:
  - args: {}
    id: check_grasp
    on_failure: abort
    predicate: bilateral_grasp
    threshold: 1.0
    when: after_phase
  id: close_gripper
  target:
    anchor: current_tcp
    entity: null
    offset:
    - 0.0
    - 0.0
    - 0.0
    source: yaml
  termination: grasp_success
  type: grasp
- control: impedance_control
  generator: linear_cartesian
  guards:
  - args: {}
    id: ensure_grasped
    on_failure: abort
    predicate: bilateral_grasp
    threshold: 1.0
    when: before_phase
  id: lift_object
  parameters:
    lift_height:
      binds_to:
      - mode: replace
        path: target.offset.z
      default: 0.15
      range:
      - 0.08
      - 0.25
      type: scalar
    lift_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.1
      range:
      - 0.02
      - 0.3
      type: scalar
  retries:
    max_attempts: 1
    offset:
    - 0.0
    - 0.0
    - 0.0
    strategy: repeat
  subtask_id: lift_object
  target:
    anchor: task_object
    entity: grasp_target
    offset:
    - 0.0
    - 0.0
    - 0.15
    orientation:
      mode: keep_current
    source: yaml
    tolerance: 0.02
  termination: pose_tolerance
  type: lift
- control: position_control
  generator: arc_cartesian
  id: approach_goal
  parameters:
    goal_arc_height:
      binds_to:
      - mode: replace
        path: generator.arc_height
      default: 0.1
      range:
      - 0.02
      - 0.25
      type: scalar
    transport_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.2
      range:
      - 0.05
      - 0.5
      type: scalar
  retries:
    max_attempts: 1
    offset:
    - 0.0
    - 0.0
    - 0.0
    strategy: reduce_speed
  subtask_id: place_object
  target:
    anchor: task_goal
    entity: null
    offset:
    - 0.0
    - 0.0
    - 0.2
    orientation:
      mode: keep_current
    source: yaml
    tolerance: 0.01
  termination: pose_tolerance
  type: approach
- control: admittance_control
  generator: linear_cartesian
  guards:
  - args: {}
    id: check_place_contact
    on_failure: abort
    predicate: contact_detected
    threshold: 1.0
    when: during_phase
  id: descend_to_place
  parameters:
    place_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.08
      range:
      - 0.02
      - 0.3
      type: scalar
  retries:
    max_attempts: 2
    offset:
    - 0.0
    - 0.0
    - -0.005
    strategy: offset_target
  target:
    anchor: task_goal
    entity: null
    offset:
    - 0.0
    - 0.0
    - 0.0
    orientation:
      mode: keep_current
    source: yaml
  termination: contact_detected
  type: descend
- control: position_control
  end_effector_action: open
  generator: null
  id: release_gripper
  parameters:
    release_duration:
      binds_to:
      - mode: replace
        path: duration.max_time
      default: 0.8
      range:
      - 0.3
      - 2.0
      type: scalar
  target:
    anchor: current_tcp
    entity: null
    offset:
    - 0.0
    - 0.0
    - 0.0
    source: yaml
  termination: time_limit
  type: release
- control: position_control
  generator: linear_cartesian
  id: retract_after_place
  parameters:
    retract_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.2
      range:
      - 0.05
      - 0.5
      type: scalar
  retries:
    max_attempts: 1
    offset:
    - 0.0
    - 0.0
    - 0.0
    strategy: reduce_speed
  target:
    anchor: task_goal
    entity: null
    offset:
    - 0.0
    - 0.0
    - 0.2
    orientation:
      mode: keep_current
    source: yaml
    tolerance: 0.02
  termination: pose_tolerance
  type: retract
skill: grasp_place
subtasks:
- anchor: object
  id: reach_object
  offset:
  - 0.0
  - 0.0
  - 0.1
  target_entity: tcp
  weight: 0.2
- anchor: object
  id: grasp_object
  offset:
  - 0.0
  - 0.0
  - 0.0
  target_entity: tcp
  weight: 0.1
- anchor: object
  id: lift_object
  offset:
  - 0.0
  - 0.0
  - 0.15
  target_entity: tcp
  weight: 0.2
- anchor: goal
  id: place_object
  offset:
  - 0.0
  - 0.0
  - 0.0
  target_entity: tcp
  weight: 0.5
