dsl_version: 2
phases:
- control: position_control
  generator: linear_cartesian
  id: approach_above
  orientation:
    mode: keep_current
  parameters:
    speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.05
      range:
      - 0.01
      - 0.1
      type: scalar
  subtask_id: contact_reach
  target:
    anchor: task_object
    offset:
    - 0.0
    - 0.06
    - 0.15
    tolerance: 0.02
  termination: pose_tolerance
  type: approach
- control: force_threshold_switch
  generator: linear_cartesian
  id: descent_to_contact
  orientation:
    mode: keep_current
  parameters:
    contact_force_threshold:
      binds_to:
      - mode: replace
        path: termination.force_threshold
      default: 5.0
      range:
      - 2.0
      - 10.0
      type: scalar
  subtask_id: contact_reach
  target:
    anchor: task_object
    offset:
    - 0.0
    - 0.06
    - 0.025
  termination: force_exceeded
  type: descend
- control: impedance_control
  generator: linear_cartesian
  id: push_to_goal
  orientation:
    mode: keep_current
  parameters:
    push_distance:
      binds_to:
      - mode: replace
        path: target.offset_along_axis.distance
      default: 0.15
      range:
      - 0.05
      - 0.3
      type: scalar
  subtask_id: goal_progress
  target:
    anchor: current_tcp
    offset_along_axis:
      axis: task_goal_direction
      distance: 0.15
      sign: positive
    tolerance: 0.02
  termination: pose_tolerance
  type: push
- control: position_control
  generator: linear_cartesian
  id: retract
  orientation:
    mode: keep_current
  parameters:
    speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.05
      range:
      - 0.02
      - 0.1
      type: scalar
  target:
    anchor: task_object
    offset:
    - 0.0
    - 0.1
    - 0.15
    tolerance: 0.02
  termination: pose_tolerance
  type: retract
skill: push_to_goal
skill_type: arm_gripper
subtasks:
- anchor: object
  id: contact_reach
  metric: distance
  offset:
  - 0.0
  - 0.06
  - 0.025
  target_entity: tcp
  weight: 0.3
- anchor: goal
  id: goal_progress
  metric: goal_progress
  target_entity: object
  weight: 0.7
