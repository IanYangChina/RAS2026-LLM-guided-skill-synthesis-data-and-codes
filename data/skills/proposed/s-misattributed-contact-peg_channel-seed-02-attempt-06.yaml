dsl_version: 2
phases:
- control: position_control
  generator: linear_cartesian
  id: approach_above_peg
  parameters:
    approach_height:
      binds_to:
      - mode: replace
        path: target.offset.z
      default: 0.1
      range:
      - 0.05
      - 0.15
      type: scalar
  retries:
    max_attempts: 0
    strategy: repeat
  subtask_id: reach_contact
  target:
    anchor: task_object
    offset:
    - 0.0
    - 0.05
    - 0.1
    orientation:
      mode: keep_current
    source: yaml
    tolerance: 0.02
  termination: pose_tolerance
  type: approach
- control: impedance_control
  generator: linear_cartesian
  id: descend_contact
  parameters:
    descend_backset_y:
      binds_to:
      - mode: replace
        path: target.offset.y
      default: 0.02
      range:
      - 0.0
      - 0.05
      type: scalar
    descend_force_threshold:
      binds_to:
      - mode: replace
        path: termination.force_threshold
      default: 15.0
      range:
      - 5.0
      - 25.0
      type: scalar
    descend_lateral_x:
      binds_to:
      - mode: replace
        path: target.offset.x
      default: 0.0
      range:
      - -0.02
      - 0.02
      type: scalar
  subtask_id: reach_contact
  target:
    anchor: task_object
    offset:
    - 0.0
    - 0.02
    - 0.005
    orientation:
      mode: keep_current
    source: yaml
    tolerance: 0.01
  termination: force_exceeded
  type: descend
- control: position_control
  generator: linear_cartesian
  id: align_channel
  parameters:
    align_lateral_x:
      binds_to:
      - mode: add
        path: target.offset.x
      default: 0.0
      range:
      - -0.02
      - 0.02
      type: scalar
    align_y_backset:
      binds_to:
      - mode: replace
        path: target.offset.y
      default: 0.06
      range:
      - 0.04
      - 0.08
      type: scalar
  retries:
    max_attempts: 0
    strategy: repeat
  subtask_id: align_to_channel
  target:
    anchor: fixture
    offset:
    - -0.04
    - 0.06
    - 0.01
    orientation:
      align_with: channel_axis
      axis:
      - 0.0
      - 0.0
      - 1.0
      mode: align_axis
    source: yaml
    tolerance: 0.02
  termination: pose_tolerance
  type: align
- control: impedance_control
  generator: linear_cartesian
  id: push_to_goal
  parameters:
    push_distance:
      binds_to:
      - mode: replace
        path: target.offset_along_axis.distance
      default: 0.16
      range:
      - 0.14
      - 0.18
      type: scalar
    push_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.03
      range:
      - 0.01
      - 0.05
      type: scalar
  retries:
    max_attempts: 1
    strategy: reduce_speed
  subtask_id: push_channel
  target:
    anchor: current_tcp
    offset:
    - 0.0
    - 0.0
    - 0.0
    offset_along_axis:
      axis: channel_axis
      distance: 0.16
      mode: replace_offset_projection
      sign: positive
    orientation:
      align_with: channel_axis
      axis:
      - 0.0
      - 0.0
      - 1.0
      mode: align_axis
    source: yaml
    tolerance: 0.03
  termination: pose_tolerance
  type: push
skill: peg_channel
subtasks:
- anchor: object
  id: reach_contact
  metric: distance
  offset:
  - 0.0
  - 0.02
  - 0.005
  target_entity: tcp
  weight: 0.3
- anchor: fixture
  id: align_to_channel
  metric: distance
  offset:
  - -0.04
  - 0.06
  - 0.01
  target_entity: tcp
  weight: 0.3
- id: push_channel
  metric: goal_progress
  weight: 0.4
