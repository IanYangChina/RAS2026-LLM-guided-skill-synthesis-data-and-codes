dsl_version: 2
phases:
- control: position_control
  generator: linear_cartesian
  id: approach_lin
  parameters:
    approach_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.6
      range:
      - 0.1
      - 1.0
      type: scalar
    approach_tolerance:
      binds_to:
      - mode: replace
        path: termination.pose_tolerance
      default: 0.1
      range:
      - 0.02
      - 0.15
      type: scalar
  subtask_id: high_approach
  target:
    anchor: task_goal
    offset:
    - 0.0
    - 0.0
    - 0.3
    orientation:
      mode: keep_current
    source: yaml
  termination: pose_tolerance
  type: approach
- control: position_control
  generator: linear_cartesian
  id: descend_goal
  parameters:
    descend_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.4
      range:
      - 0.1
      - 1.0
      type: scalar
    goal_tolerance:
      binds_to:
      - mode: replace
        path: termination.pose_tolerance
      default: 0.02
      range:
      - 0.01
      - 0.03
      type: scalar
  subtask_id: goal_reach
  target:
    anchor: task_goal
    offset:
    - 0.0
    - 0.0
    - 0.0
    orientation:
      mode: keep_current
    source: yaml
  termination: pose_tolerance
  type: descend
skill: obstacle_reach
subtasks:
- anchor: goal
  id: high_approach
  metric: distance
  offset:
  - 0.0
  - 0.0
  - 0.3
  target_entity: tcp
  weight: 0.3
- anchor: goal
  id: goal_reach
  metric: distance
  offset:
  - 0.0
  - 0.0
  - 0.0
  target_entity: tcp
  weight: 0.7
