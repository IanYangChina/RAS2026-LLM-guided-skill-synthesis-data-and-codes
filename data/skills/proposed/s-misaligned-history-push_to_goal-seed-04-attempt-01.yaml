dsl_version: 2
phases:
- control: position_control
  generator: arc_cartesian
  guards: []
  id: approach_1
  parameters:
    approach_arc_height:
      binds_to:
      - mode: replace
        path: generator.arc_height
      default: 0.08
      range:
      - 0.02
      - 0.15
      type: scalar
    approach_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.08
      range:
      - 0.02
      - 0.15
      type: scalar
  retries:
    max_attempts: 0
  subtask_id: reach_contact
  target:
    anchor: task_object
    entity: push_box
    offset:
    - 0.02
    - 0.0
    - 0.0
    orientation:
      mode: keep_current
    source: yaml
    tolerance: 0.005
  termination: pose_tolerance
  type: approach
- control: impedance_control
  generator: linear_cartesian
  guards:
  - args: {}
    id: push_progress
    on_failure: continue
    predicate: object_progress
    threshold: 0.15
    when: during_phase
  id: push_1
  parameters:
    push_distance:
      binds_to:
      - mode: replace
        path: target.offset_along_axis.distance
      default: 0.15
      range:
      - 0.05
      - 0.25
      type: scalar
    push_force:
      binds_to:
      - mode: replace
        path: termination.force_threshold
      default: 12.0
      range:
      - 5.0
      - 20.0
      type: scalar
    push_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.06
      range:
      - 0.02
      - 0.1
      type: scalar
  retries:
    max_attempts: 1
    offset:
    - 0.005
    - 0.005
    - 0.0
    strategy: offset_target
  subtask_id: push_to_goal
  target:
    anchor: task_goal
    entity: goal_marker
    offset:
    - 0.0
    - 0.0
    - 0.0
    offset_along_axis:
      axis: task_goal_direction
      distance: 0.15
      mode: replace_offset_projection
      sign: positive
    orientation:
      mode: keep_current
    source: yaml
    tolerance: 0.02
  termination: force_exceeded
  type: push
- control: position_control
  generator: linear_cartesian
  guards: []
  id: retract_1
  parameters:
    retract_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.08
      range:
      - 0.03
      - 0.15
      type: scalar
  retries:
    max_attempts: 0
  target:
    anchor: current_tcp
    entity: null
    offset:
    - 0.0
    - 0.0
    - 0.1
    orientation:
      mode: keep_current
    source: yaml
    tolerance: 0.01
  termination: pose_tolerance
  type: retract
skill: push_to_goal
skill_type: arm
subtasks:
- anchor: object
  id: reach_contact
  metric: distance
  offset:
  - 0.02
  - 0.0
  - 0.05
  target_entity: tcp
  weight: 0.3
- anchor: goal
  id: push_to_goal
  metric: goal_progress
  offset:
  - 0.0
  - 0.0
  - 0.0
  target_entity: object
  weight: 0.7
