dsl_version: 2
phases:
- control: position_control
  generator: arc_cartesian
  id: approach_clearance
  parameters:
    approach_max_time:
      binds_to:
      - mode: replace
        path: duration.max_time
      default: 800
      range:
      - 500
      - 1000
      type: scalar
    approach_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.1
      range:
      - 0.05
      - 0.2
      type: scalar
    approach_tolerance:
      binds_to:
      - mode: replace
        path: termination.pose_tolerance
      default: 0.1
      range:
      - 0.05
      - 0.15
      type: scalar
    arc_height:
      binds_to:
      - mode: add
        path: generator.arc_height
      default: 0.12
      range:
      - 0.05
      - 0.25
      type: scalar
  retries:
    max_attempts: 0
    strategy: repeat
  subtask_id: clear_obstacle
  target:
    anchor: task_goal
    offset:
    - 0.0
    - 0.0
    - 0.3
    orientation:
      mode: keep_current
    source: yaml
    tolerance: 0.1
  termination: time_limit
  type: approach
- control: position_control
  generator: linear_cartesian
  id: descend_to_goal
  parameters:
    descend_max_time:
      binds_to:
      - mode: replace
        path: duration.max_time
      default: 800
      range:
      - 500
      - 1000
      type: scalar
    descend_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.08
      range:
      - 0.03
      - 0.2
      type: scalar
    descend_z_offset:
      binds_to:
      - mode: replace
        path: target.offset.z
      default: -0.02
      range:
      - -0.03
      - 0.0
      type: scalar
  retries:
    max_attempts: 0
    strategy: repeat
  subtask_id: reach_goal
  target:
    anchor: task_goal
    offset:
    - 0.0
    - 0.0
    - -0.02
    orientation:
      mode: keep_current
    source: yaml
    tolerance: 0.02
  termination: time_limit
  type: descend
skill: obstacle_reach
skill_type: arm_gripper
subtasks:
- id: clear_obstacle
  offset:
  - 0.0
  - 0.0
  - 0.3
  weight: 0.5
- id: reach_goal
  weight: 0.5
