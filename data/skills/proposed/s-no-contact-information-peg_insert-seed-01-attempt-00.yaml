dsl_version: 2
phases:
- control: impedance_control
  generator: impedance_motion
  id: rotate_1
  parameters:
    rot_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.3
      range:
      - 0.1
      - 0.5
      type: scalar
  subtask_id: reach_above_socket
  target:
    anchor: task_goal
    entity: null
    offset:
    - 0.0
    - 0.0
    - 0.06
    orientation:
      align_with: insertion_axis
      axis:
      - 0.0
      - 0.0
      - 1.0
      mode: align_axis
      tolerance: 0.05
  termination: time_limit
  type: rotate
- control: position_control
  generator: linear_cartesian
  id: align_1
  parameters:
    lateral_offset_x:
      binds_to:
      - mode: add
        path: target.offset.x
      default: 0.0
      range:
      - -0.01
      - 0.01
      type: scalar
    lateral_offset_y:
      binds_to:
      - mode: add
        path: target.offset.y
      default: 0.0
      range:
      - -0.01
      - 0.01
      type: scalar
  subtask_id: align_above_socket
  target:
    anchor: task_goal
    entity: null
    offset:
    - 0.0
    - 0.0
    - 0.05
    orientation:
      mode: keep_current
  termination: pose_tolerance
  type: align
- control: impedance_control
  generator: impedance_motion
  id: push_1
  parameters:
    force_threshold:
      binds_to:
      - mode: replace
        path: termination.force_threshold
      default: 20.0
      range:
      - 5.0
      - 35.0
      type: scalar
    push_distance:
      binds_to:
      - mode: scale
        path: target.offset_along_axis.distance
      default: 0.08
      range:
      - 0.03
      - 0.15
      type: scalar
  subtask_id: insert_into_socket
  target:
    anchor: task_goal
    entity: null
    offset:
    - 0.0
    - 0.0
    - 0.0
    offset_along_axis:
      axis: insertion_axis
      distance: 0.1
      mode: replace_offset_projection
      sign: negative
    orientation:
      mode: keep_current
  termination: force_exceeded
  type: push
- control: position_control
  generator: linear_cartesian
  id: align_2
  parameters:
    lateral_offset_x:
      binds_to:
      - mode: add
        path: target.offset.x
      default: 0.0
      range:
      - -0.01
      - 0.01
      type: scalar
    lateral_offset_y:
      binds_to:
      - mode: add
        path: target.offset.y
      default: 0.0
      range:
      - -0.01
      - 0.01
      type: scalar
  target:
    anchor: task_goal
    entity: null
    offset:
    - 0.0
    - 0.0
    - 0.05
    orientation:
      mode: keep_current
  termination: pose_tolerance
  type: align
skill: peg_insert
subtasks:
- anchor: goal
  id: reach_above_socket
  metric: distance
  offset:
  - 0.0
  - 0.0
  - 0.06
  target_entity: tcp
  weight: 0.3
- anchor: goal
  id: align_above_socket
  metric: distance
  offset:
  - 0.0
  - 0.0
  - 0.04
  target_entity: tcp
  weight: 0.3
- anchor: goal
  id: insert_into_socket
  metric: distance
  offset:
  - 0.0
  - 0.0
  - -0.02
  target_entity: tcp
  weight: 0.4
