dsl_version: 2
phases:
- control: position_control
  generator: linear_cartesian
  id: approach_object
  parameters:
    approach_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.15
      range:
      - 0.05
      - 0.3
      type: scalar
  subtask_id: approach_object
  target:
    anchor: task_object
    offset:
    - 0.0
    - 0.0
    - 0.08
    orientation:
      mode: keep_current
    source: yaml
  termination: pose_tolerance
  type: approach
- control: position_control
  generator: linear_cartesian
  id: descend_to_grasp
  parameters:
    grasp_height_offset:
      binds_to:
      - mode: replace
        path: target.offset.z
      default: 0.015
      range:
      - 0.01
      - 0.03
      type: scalar
  subtask_id: approach_object
  target:
    anchor: task_object
    offset:
    - 0.0
    - 0.0
    - 0.015
    orientation:
      mode: keep_current
    source: yaml
  termination: pose_tolerance
  type: descend
- control: null
  end_effector_action: force_grasp
  generator: null
  guards:
  - args: {}
    id: check_grasp
    on_failure: retry
    predicate: bilateral_grasp
    threshold: 1.0
    when: after_phase
  id: grasp
  retries:
    max_attempts: 2
    strategy: repeat
  subtask_id: approach_object
  target:
    anchor: current_tcp
    offset:
    - 0.0
    - 0.0
    - 0.0
    source: yaml
  termination: grasp_success
  type: grasp
- control: position_control
  generator: linear_cartesian
  guards:
  - args: {}
    id: check_lift
    on_failure: abort
    predicate: object_lifted
    threshold: 0.05
    when: after_phase
  id: lift_object
  parameters:
    lift_distance:
      binds_to:
      - mode: replace
        path: target.offset_along_axis.distance
      default: 0.1
      range:
      - 0.05
      - 0.15
      type: scalar
  subtask_id: reach_goal
  target:
    anchor: current_tcp
    offset:
    - 0.0
    - 0.0
    - 0.0
    offset_along_axis:
      axis: world_z
      distance: 0.1
      mode: add_to_offset
      sign: positive
    orientation:
      mode: keep_current
    source: yaml
  termination: pose_tolerance
  type: lift
- control: position_control
  generator: linear_cartesian
  id: transport_to_goal
  parameters:
    transport_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.1
      range:
      - 0.05
      - 0.3
      type: scalar
  subtask_id: reach_goal
  target:
    anchor: task_goal
    offset:
    - 0.0
    - 0.0
    - 0.1
    orientation:
      mode: keep_current
    source: yaml
  termination: pose_tolerance
  type: approach
- control: position_control
  generator: linear_cartesian
  id: descend_to_place
  parameters:
    place_height_offset:
      binds_to:
      - mode: replace
        path: target.offset.z
      default: 0.0
      range:
      - -0.02
      - 0.02
      type: scalar
  subtask_id: reach_goal
  target:
    anchor: task_goal
    offset:
    - 0.0
    - 0.0
    - 0.0
    orientation:
      mode: keep_current
    source: yaml
  termination: pose_tolerance
  type: descend
- control: null
  end_effector_action: open
  generator: null
  id: release
  subtask_id: reach_goal
  target:
    anchor: current_tcp
    offset:
    - 0.0
    - 0.0
    - 0.0
    source: yaml
  termination: time_limit
  type: release
- control: position_control
  generator: linear_cartesian
  id: retract
  parameters:
    retract_distance:
      binds_to:
      - mode: replace
        path: target.offset_along_axis.distance
      default: 0.1
      range:
      - 0.05
      - 0.2
      type: scalar
  subtask_id: reach_goal
  target:
    anchor: current_tcp
    offset:
    - 0.0
    - 0.0
    - 0.0
    offset_along_axis:
      axis: world_z
      distance: 0.1
      mode: add_to_offset
      sign: positive
    orientation:
      mode: keep_current
    source: yaml
  termination: pose_tolerance
  type: retract
skill: grasp_place
subtasks:
- anchor: object
  id: approach_object
  metric: distance
  offset:
  - 0.0
  - 0.0
  - 0.05
  target_entity: tcp
  weight: 0.3
- anchor: goal
  id: reach_goal
  metric: distance
  offset:
  - 0.0
  - 0.0
  - 0.0
  target_entity: tcp
  weight: 0.7
