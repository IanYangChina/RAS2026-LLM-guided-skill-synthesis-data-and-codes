dsl_version: 2
phases:
- control: position_control
  generator: linear_cartesian
  guards: []
  id: approach_1
  parameters:
    approach_height:
      binds_to:
      - mode: replace
        path: target.offset.z
      default: 0.02
      range:
      - 0.01
      - 0.05
      type: scalar
    approach_lateral_offset:
      binds_to:
      - mode: add
        path: target.offset.y
      default: 0.04
      range:
      - 0.02
      - 0.06
      type: scalar
  retries:
    max_attempts: 1
    strategy: repeat
  subtask_id: reach_approach
  target:
    anchor: task_object
    entity: null
    offset:
    - 0.0
    - 0.04
    - 0.02
    orientation:
      align_with: task_goal_direction
      axis:
      - 1
      - 0
      - 0
      mode: align_axis
      tolerance: 0.1
    source: yaml
  termination: pose_tolerance
  type: approach
- control: position_control
  generator: linear_cartesian
  guards: []
  id: descend_1
  parameters:
    approach_lateral_offset:
      binds_to:
      - mode: add
        path: target.offset.y
  retries:
    max_attempts: 1
    strategy: repeat
  subtask_id: null
  target:
    anchor: task_object
    entity: null
    offset:
    - 0.0
    - 0.04
    - 0.0
    orientation:
      mode: keep_current
    source: yaml
  termination: pose_tolerance
  type: descend
- control: impedance_control
  generator: linear_cartesian
  guards: []
  id: push_1
  parameters:
    push_distance:
      binds_to:
      - mode: replace
        path: target.offset_along_axis.distance
      default: 0.2
      range:
      - 0.1
      - 0.35
      type: scalar
    push_lateral_offset:
      binds_to:
      - mode: add
        path: target.offset.y
      default: 0.04
      range:
      - 0.02
      - 0.06
      type: scalar
  retries:
    max_attempts: 2
    offset:
    - 0.0
    - -0.005
    - 0.0
    strategy: offset_target
  subtask_id: push_to_goal
  target:
    anchor: task_object
    entity: null
    offset:
    - 0.0
    - 0.04
    - 0.0
    offset_along_axis:
      axis: task_goal_direction
      distance: 0.2
      mode: add_to_offset
      sign: positive
    orientation:
      align_with: task_goal_direction
      axis:
      - 1
      - 0
      - 0
      mode: align_axis
      tolerance: 0.1
    source: yaml
  termination: time_limit
  type: push
skill: push_to_goal
subtasks:
- anchor: object
  id: reach_approach
  metric: distance
  offset:
  - 0.0
  - 0.04
  - 0.02
  target_entity: tcp
  weight: 0.3
- anchor: goal
  id: push_to_goal
  metric: goal_progress
  target_entity: tcp
  weight: 0.7
