dsl_version: 2
phases:
- control: position_control
  generator: linear_cartesian
  guards:
  - id: lifted
    on_failure: retry
    predicate: pose_within_tolerance
    threshold: 0.05
    when: after_phase
  id: lift_z
  parameters:
    lift_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.3
      range:
      - 0.1
      - 0.5
      type: scalar
  retries:
    max_attempts: 2
    offset:
    - 0.0
    - 0.0
    - 0.02
    strategy: offset_target
  target:
    anchor: current_tcp
    offset:
    - 0.0
    - 0.0
    - 0.25
    orientation:
      mode: keep_current
    source: yaml
    tolerance: 0.05
  termination: pose_tolerance
  type: lift
- control: position_control
  generator: linear_cartesian
  guards:
  - id: above_goal
    on_failure: retry
    predicate: pose_within_tolerance
    threshold: 0.05
    when: after_phase
  id: move_to_above_goal
  parameters:
    move_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.3
      range:
      - 0.1
      - 0.5
      type: scalar
  retries:
    max_attempts: 2
    offset:
    - 0.0
    - 0.02
    - 0.02
    strategy: offset_target
  subtask_id: approach_above
  target:
    anchor: task_goal
    offset:
    - 0.0
    - 0.0
    - 0.25
    orientation:
      mode: keep_current
    source: yaml
    tolerance: 0.05
  termination: pose_tolerance
  type: approach
- control: position_control
  generator: linear_cartesian
  guards:
  - id: goal_reached
    on_failure: retry
    predicate: pose_within_tolerance
    threshold: 0.02
    when: after_phase
  id: descend_to_goal
  parameters:
    descend_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.2
      range:
      - 0.1
      - 0.5
      type: scalar
  retries:
    max_attempts: 2
    offset:
    - 0.0
    - 0.02
    - 0.02
    strategy: offset_target
  subtask_id: reach_goal
  target:
    anchor: task_goal
    offset:
    - 0.0
    - 0.0
    - 0.0
    orientation:
      mode: keep_current
    source: yaml
    tolerance: 0.02
  termination: pose_tolerance
  type: descend
skill: obstacle_reach
subtasks:
- anchor: goal
  id: approach_above
  metric: distance
  offset:
  - 0.0
  - 0.0
  - 0.25
  target_entity: tcp
  weight: 0.3
- anchor: goal
  id: reach_goal
  metric: distance
  offset:
  - 0.0
  - 0.0
  - 0.0
  target_entity: tcp
  weight: 0.7
