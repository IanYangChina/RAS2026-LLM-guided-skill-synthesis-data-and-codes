dsl_version: 2
phases:
- control: position_control
  generator: linear_cartesian
  id: approach_panel
  parameters:
    approach_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.15
      range:
      - 0.05
      - 0.3
      type: scalar
  subtask_id: reach_pre_contact
  target:
    anchor: fixture
    entity: door_panel
    offset:
    - -0.005
    - 0.03
    - 0.35
    orientation:
      mode: none
    source: yaml
    tolerance: 0.02
  termination: pose_tolerance
  type: approach
- control: force_threshold_switch
  generator: linear_cartesian
  id: contact_panel
  parameters:
    descend_force_threshold:
      binds_to:
      - mode: replace
        path: termination.force_threshold
      default: 10.0
      range:
      - 5.0
      - 20.0
      type: scalar
  subtask_id: reach_pre_contact
  target:
    anchor: fixture
    entity: door_panel
    offset:
    - -0.005
    - 0.01
    - 0.35
    orientation:
      mode: none
    source: yaml
  termination: force_exceeded
  type: contact
- control: admittance_control
  generator: linear_cartesian
  guards:
  - id: contact_during_push
    on_failure: retry
    predicate: contact_detected
    threshold: 0.5
    when: during_phase
  id: push_door
  parameters:
    push_distance:
      binds_to:
      - mode: replace
        path: target.offset_along_axis.distance
      default: 0.15
      range:
      - 0.1
      - 0.3
      type: scalar
    push_force_threshold:
      binds_to:
      - mode: replace
        path: termination.force_threshold
      default: 12.0
      range:
      - 6.0
      - 25.0
      type: scalar
  retries:
    max_attempts: 2
    offset:
    - 0.0
    - -0.02
    - 0.0
    strategy: offset_target
  subtask_id: close_door
  target:
    anchor: current_tcp
    offset:
    - 0.0
    - 0.0
    - 0.0
    offset_along_axis:
      axis: task_goal_direction
      distance: 0.15
      mode: add_to_offset
      sign: positive
    orientation:
      mode: none
    source: yaml
  termination: force_exceeded
  type: push
skill: door_push
skill_type: arm_gripper
subtasks:
- anchor: fixture
  id: reach_pre_contact
  metric: distance
  offset:
  - -0.005
  - 0.03
  - 0.35
  target_entity: tcp
  weight: 0.3
- anchor: fixture
  id: close_door
  metric: hinge_angle
  target_entity: tcp
  weight: 0.7
