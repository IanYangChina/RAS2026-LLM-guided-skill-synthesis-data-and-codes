dsl_version: 2
phases:
- control: position_control
  generator: linear_cartesian
  guards: []
  id: approach_object
  parameters:
    approach_height:
      binds_to:
      - mode: replace
        path: target.offset.z
      default: 0.1
      range:
      - 0.05
      - 0.15
      type: scalar
    approach_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.3
      range:
      - 0.1
      - 0.5
      type: scalar
  retries: []
  subtask_id: grasp_approach
  target:
    anchor: task_object
    offset:
    - 0
    - 0
    - 0.1
    orientation:
      mode: keep_current
    tolerance: 0.01
  termination: pose_tolerance
  type: approach
- control: force_threshold_switch
  generator: linear_cartesian
  guards: []
  id: descend_grasp
  parameters:
    descend_force:
      binds_to:
      - mode: replace
        path: termination.force_threshold
      default: 2.0
      range:
      - 0.5
      - 5.0
      type: scalar
  retries: []
  target:
    anchor: task_object
    offset:
    - 0
    - 0
    - 0
    orientation:
      mode: keep_current
    tolerance: 0.01
  termination: force_exceeded
  type: descend
- control: null
  duration:
    max_time: 0.3
  end_effector_action: force_grasp
  generator: null
  guards:
  - args: {}
    id: check_grasp
    on_failure: retry
    predicate: bilateral_grasp
    threshold: 0
    when: after_phase
  id: grasp_object
  parameters:
    grasp_duration:
      binds_to:
      - mode: replace
        path: duration.max_time
      default: 0.3
      range:
      - 0.1
      - 0.5
      type: scalar
  retries:
    max_attempts: 2
    offset:
    - 0
    - 0
    - -0.005
    strategy: offset_target
  target:
    anchor: current_tcp
    orientation:
      mode: keep_current
  termination: time_limit
  type: grasp
- control: position_control
  generator: linear_cartesian
  guards: []
  id: lift_object
  parameters:
    lift_height:
      binds_to:
      - mode: replace
        path: target.offset_along_axis.distance
      default: 0.15
      range:
      - 0.08
      - 0.25
      type: scalar
    lift_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.2
      range:
      - 0.1
      - 0.4
      type: scalar
  retries: []
  target:
    anchor: current_tcp
    offset:
    - 0
    - 0
    - 0
    offset_along_axis:
      axis: world_z
      distance: 0.15
      mode: add_to_offset
      sign: positive
    orientation:
      mode: keep_current
  termination: pose_tolerance
  type: lift
- control: position_control
  generator: linear_cartesian
  guards: []
  id: transport_to_goal
  parameters:
    place_above_height:
      binds_to:
      - mode: replace
        path: target.offset.z
      default: 0.1
      range:
      - 0.05
      - 0.2
      type: scalar
    transport_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.3
      range:
      - 0.1
      - 0.5
      type: scalar
  retries: []
  target:
    anchor: task_goal
    offset:
    - 0
    - 0
    - 0.1
    orientation:
      mode: keep_current
  termination: pose_tolerance
  type: approach
- control: force_threshold_switch
  generator: linear_cartesian
  guards: []
  id: descend_place
  parameters:
    place_force:
      binds_to:
      - mode: replace
        path: termination.force_threshold
      default: 2.0
      range:
      - 0.5
      - 5.0
      type: scalar
  retries: []
  subtask_id: place_release
  target:
    anchor: task_goal
    offset:
    - 0
    - 0
    - 0.03
    orientation:
      mode: keep_current
  termination: force_exceeded
  type: descend
- control: null
  duration:
    max_time: 0.3
  end_effector_action: open
  generator: null
  guards:
  - args: {}
    id: check_place
    on_failure: retry
    predicate: object_progress
    threshold: 0.02
    when: after_phase
  id: release_object
  parameters:
    release_duration:
      binds_to:
      - mode: replace
        path: duration.max_time
      default: 0.3
      range:
      - 0.1
      - 0.5
      type: scalar
  retries:
    max_attempts: 1
    strategy: reduce_speed
  target:
    anchor: current_tcp
    orientation:
      mode: keep_current
  termination: time_limit
  type: release
- control: position_control
  generator: linear_cartesian
  guards: []
  id: retract_final
  parameters:
    retract_height:
      binds_to:
      - mode: replace
        path: target.offset_along_axis.distance
      default: 0.1
      range:
      - 0.05
      - 0.2
      type: scalar
  retries: []
  target:
    anchor: current_tcp
    offset:
    - 0
    - 0
    - 0
    offset_along_axis:
      axis: world_z
      distance: 0.1
      mode: add_to_offset
      sign: positive
    orientation:
      mode: keep_current
  termination: pose_tolerance
  type: retract
skill: grasp_place
skill_type: arm_gripper
subtasks:
- anchor: object
  id: grasp_approach
  metric: distance
  offset:
  - 0
  - 0
  - 0.08
  target_entity: tcp
  weight: 0.3
- anchor: goal
  id: place_release
  metric: distance
  offset:
  - 0
  - 0
  - 0.03
  target_entity: tcp
  weight: 0.7
