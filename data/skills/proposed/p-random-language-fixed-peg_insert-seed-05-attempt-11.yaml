dsl_version: 2
phases:
- control: force_threshold_switch
  generator: linear_cartesian
  id: push_to_entry
  parameters:
    contact_force:
      binds_to:
      - mode: replace
        path: termination.force_threshold
      default: 15
      range:
      - 5
      - 30
      type: scalar
    speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.08
      range:
      - 0.01
      - 0.15
      type: scalar
  retries:
    max_attempts: 1
    strategy: reduce_speed
  target:
    anchor: fixture
    entity: peg_socket
    offset:
    - 0
    - 0
    - 0.055
    orientation:
      align_with: channel_axis
      axis:
      - 0
      - 0
      - -1
      mode: align_axis
      tolerance: 0.1
    source: yaml
  termination: force_exceeded
  type: push
- control: impedance_control
  generator: linear_cartesian
  guards:
  - args: {}
    id: force_limit
    on_failure: abort
    predicate: force_below
    threshold: 40
    when: during_phase
  id: insert_deep
  parameters:
    speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.02
      range:
      - 0.005
      - 0.05
      type: scalar
  target:
    anchor: fixture
    entity: peg_socket
    offset:
    - 0
    - 0
    - 0.0
    offset_along_axis:
      axis: channel_axis
      distance: 0.055
      mode: add_to_offset
      sign: negative
    orientation:
      align_with: channel_axis
      axis:
      - 0
      - 0
      - -1
      mode: align_axis
      tolerance: 0.1
    source: yaml
    tolerance: 0.005
  termination: pose_tolerance
  type: insert
skill: peg_insert
skill_type: arm_gripper
