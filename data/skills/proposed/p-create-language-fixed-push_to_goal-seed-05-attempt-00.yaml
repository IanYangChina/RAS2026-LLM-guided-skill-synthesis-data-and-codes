dsl_version: 2
phases:
- control: position_control
  generator: linear_cartesian
  id: approach_1
  subtask_id: approach
  target:
    anchor: task_object
    entity: push_box
    offset:
    - 0.0
    - 0.08
    - 0.0
    orientation:
      mode: keep_current
    source: yaml
    tolerance: 0.03
  termination: pose_tolerance
  type: approach
- control: force_threshold_switch
  generator: linear_cartesian
  id: contact_1
  parameters:
    contact_force:
      binds_to:
      - mode: replace
        path: termination.force_threshold
      default: 5.0
      range:
      - 1.0
      - 20.0
      type: scalar
  subtask_id: contact
  target:
    anchor: task_object
    entity: push_box
    offset:
    - 0.0
    - 0.03
    - 0.0
    orientation:
      mode: keep_current
    source: yaml
  termination: force_exceeded
  type: contact
- control: position_control
  generator: linear_cartesian
  id: push_1
  parameters:
    push_depth:
      binds_to:
      - mode: replace
        path: target.offset_along_axis.distance
      default: 0.08
      range:
      - 0.02
      - 0.15
      type: scalar
    push_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.08
      range:
      - 0.01
      - 0.1
      type: scalar
    push_tolerance:
      binds_to:
      - mode: replace
        path: termination.pose_tolerance
      default: 0.03
      range:
      - 0.01
      - 0.05
      type: scalar
  subtask_id: push
  target:
    anchor: task_goal
    entity: goal_marker
    offset:
    - 0.0
    - 0.03
    - 0.0
    offset_along_axis:
      axis: world_y
      distance: 0.08
      mode: add_to_offset
      sign: negative
    orientation:
      mode: keep_current
    source: yaml
    tolerance: 0.03
  termination: pose_tolerance
  type: push
- control: position_control
  generator: linear_cartesian
  id: retract_1
  target:
    anchor: current_tcp
    offset:
    - 0.0
    - 0.0
    - 0.1
    orientation:
      mode: keep_current
    source: yaml
    tolerance: 0.03
  termination: pose_tolerance
  type: retract
skill: push_to_goal
