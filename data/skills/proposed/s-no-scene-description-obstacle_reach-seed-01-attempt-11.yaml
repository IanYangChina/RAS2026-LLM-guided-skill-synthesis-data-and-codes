dsl_version: 2
phases:
- control: position_control
  generator: arc_cartesian
  id: arc_approach
  parameters:
    approach_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.3
      range:
      - 0.1
      - 0.5
      type: scalar
    arc_height:
      binds_to:
      - mode: replace
        path: generator.arc_height
      default: 0.15
      range:
      - 0.05
      - 0.3
      type: scalar
    arc_time:
      binds_to:
      - mode: replace
        path: duration.max_time
      default: 12.0
      range:
      - 5.0
      - 20.0
      type: scalar
  subtask_id: reach_goal_above
  target:
    anchor: task_goal
    offset:
    - 0.0
    - 0.0
    - 0.0
    orientation:
      mode: keep_current
      tolerance: 0.1
    source: yaml
  termination: time_limit
  type: approach
- control: position_control
  generator: linear_cartesian
  id: final_approach
  parameters:
    final_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.1
      range:
      - 0.05
      - 0.3
      type: scalar
    final_time:
      binds_to:
      - mode: replace
        path: duration.max_time
      default: 5.0
      range:
      - 1.0
      - 10.0
      type: scalar
  subtask_id: reach_goal
  target:
    anchor: task_goal
    offset:
    - 0.0
    - 0.0
    - 0.0
    orientation:
      mode: keep_current
      tolerance: 0.1
    source: yaml
  termination: time_limit
  type: approach
skill: obstacle_reach
subtasks:
- id: reach_goal_above
  offset:
  - 0.0
  - 0.0
  - 0.02
  weight: 0.3
- id: reach_goal
  weight: 0.7
