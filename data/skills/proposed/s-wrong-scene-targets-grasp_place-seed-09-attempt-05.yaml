dsl_version: 2
phases:
- control: position_control
  generator: linear_cartesian
  id: approach_above
  parameters:
    speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.05
      range:
      - 0.01
      - 0.1
      type: scalar
  subtask_id: pre_grasp
  target:
    anchor: body
    entity: grasp_target
    offset:
    - 0.0
    - 0.0
    - 0.25
    orientation:
      align_with: world_z
      axis:
      - 0.0
      - 0.0
      - -1.0
      mode: align_axis
      tolerance: 0.1
    source: yaml
    tolerance: 0.02
  termination: pose_tolerance
  type: approach
- control: position_control
  generator: linear_cartesian
  id: descend_grasp
  parameters:
    speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.05
      range:
      - 0.01
      - 0.1
      type: scalar
  subtask_id: pre_grasp
  target:
    anchor: body
    entity: grasp_target
    offset:
    - 0.0
    - 0.0
    - 0.0
    orientation:
      mode: keep_current
    source: yaml
    tolerance: 0.01
  termination: pose_tolerance
  type: descend
- control: position_control
  end_effector_action: force_grasp
  guards:
  - id: bilateral_check
    on_failure: retry
    predicate: bilateral_grasp
    threshold: 0.0
    when: after_phase
  id: grasp_object
  retries:
    max_attempts: 2
    offset:
    - 0.0
    - 0.0
    - 0.01
    strategy: offset_target
  subtask_id: pre_grasp
  target:
    anchor: current_tcp
    offset:
    - 0.0
    - 0.0
    - 0.0
    orientation:
      mode: keep_current
    source: yaml
  termination: grasp_success
  type: grasp
- control: position_control
  generator: linear_cartesian
  id: lift_clear
  parameters:
    lift_clear_height:
      binds_to:
      - mode: replace
        path: target.offset_along_axis.distance
      default: 0.12
      range:
      - 0.05
      - 0.2
      type: scalar
    speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.05
      range:
      - 0.01
      - 0.1
      type: scalar
  subtask_id: pre_grasp
  target:
    anchor: current_tcp
    offset:
    - 0.0
    - 0.0
    - 0.0
    offset_along_axis:
      axis: world_z
      distance: 0.12
      mode: add_to_offset
      sign: positive
    orientation:
      mode: keep_current
    source: yaml
    tolerance: 0.01
  termination: pose_tolerance
  type: lift
- control: position_control
  generator: arc_cartesian
  id: transport_to_goal
  parameters:
    arc_height:
      binds_to:
      - mode: replace
        path: generator.arc_height
      default: 0.1
      range:
      - 0.05
      - 0.15
      type: scalar
    speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.06
      range:
      - 0.01
      - 0.1
      type: scalar
    transport_height:
      binds_to:
      - mode: replace
        path: target.offset.z
      default: 0.2
      range:
      - 0.12
      - 0.25
      type: scalar
  subtask_id: transport_goal
  target:
    anchor: body
    entity: placement_surface
    offset:
    - 0.0
    - 0.0
    - 0.2
    orientation:
      align_with: world_z
      axis:
      - 0.0
      - 0.0
      - -1.0
      mode: align_axis
      tolerance: 0.1
    source: yaml
    tolerance: 0.03
  termination: pose_tolerance
  type: approach
- control: force_threshold_switch
  generator: linear_cartesian
  guards:
  - args: {}
    id: contact_guard
    on_failure: retry
    predicate: force_below
    threshold: 10.0
    when: after_phase
  id: descend_contact
  parameters:
    contact_force_threshold:
      binds_to:
      - mode: replace
        path: termination.force_threshold
      default: 2.0
      range:
      - 0.5
      - 5.0
      type: scalar
    descend_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.01
      range:
      - 0.005
      - 0.03
      type: scalar
  retries:
    max_attempts: 1
    offset:
    - 0.0
    - 0.0
    - 0.01
    strategy: offset_target
  subtask_id: transport_goal
  target:
    anchor: body
    entity: placement_surface
    offset:
    - 0.0
    - 0.0
    - 0.0
    offset_along_axis:
      axis: world_z
      distance: 0.15
      mode: add_to_offset
      sign: negative
    orientation:
      mode: keep_current
    source: yaml
  termination: force_exceeded
  type: descend
- control: position_control
  end_effector_action: open
  id: release_object
  parameters:
    max_time:
      binds_to:
      - mode: replace
        path: duration.max_time
      default: 1.0
      range:
      - 0.5
      - 2.0
      type: scalar
  subtask_id: transport_goal
  target:
    anchor: current_tcp
    offset:
    - 0.0
    - 0.0
    - 0.0
    orientation:
      mode: keep_current
    source: yaml
  termination: time_limit
  type: release
skill: grasp_place
skill_type: arm_gripper
subtasks:
- anchor: object
  id: pre_grasp
  offset:
  - 0.0
  - 0.0
  - 0.1
  weight: 0.2
- id: transport_goal
  metric: goal_progress
  target_entity: object
  weight: 0.8
