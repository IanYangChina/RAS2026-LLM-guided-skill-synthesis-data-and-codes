dsl_version: 2
phases:
- control: position_control
  generator: linear_cartesian
  id: align_1
  orientation:
    mode: keep_current
  parameters:
    lateral_offset_x:
      binds_to:
      - mode: add
        path: target.offset.x
      default: 0.0
      range:
      - -0.01
      - 0.01
      type: scalar
    lateral_offset_y:
      binds_to:
      - mode: add
        path: target.offset.y
      default: 0.0
      range:
      - -0.01
      - 0.01
      type: scalar
    tolerance:
      binds_to:
      - mode: replace
        path: termination.pose_tolerance
      default: 0.02
      range:
      - 0.005
      - 0.04
      type: scalar
  subtask_id: reach_object
  target:
    anchor: task_object
    entity: peg
    offset:
    - 0.0
    - 0.0
    - 0.15
    source: yaml
    tolerance: 0.02
  termination: pose_tolerance
  type: align
- control: position_control
  generator: arc_cartesian
  id: approach_1
  orientation:
    mode: keep_current
  parameters:
    arc_height:
      binds_to:
      - mode: replace
        path: generator.arc_height
      default: 0.05
      range:
      - 0.01
      - 0.08
      type: scalar
    speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.03
      range:
      - 0.01
      - 0.1
      type: scalar
  subtask_id: reach_object
  target:
    anchor: task_object
    entity: peg
    offset:
    - 0.0
    - 0.0
    - 0.04
    source: yaml
    tolerance: 0.005
  termination: pose_tolerance
  type: approach
- control: force_threshold_switch
  generator: linear_cartesian
  id: contact_1
  orientation:
    mode: keep_current
  parameters:
    force_threshold:
      binds_to:
      - mode: replace
        path: termination.force_threshold
      default: 15.0
      range:
      - 5.0
      - 30.0
      type: scalar
    speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.02
      range:
      - 0.005
      - 0.05
      type: scalar
  subtask_id: reach_object
  target:
    anchor: task_object
    entity: peg
    offset:
    - 0.0
    - 0.0
    - 0.0
    source: yaml
  termination: force_exceeded
  type: contact
- control: impedance_control
  generator: linear_cartesian
  guards:
  - args: {}
    id: stall_guard
    on_failure: abort
    predicate: force_below
    threshold: 1.0
    when: during_phase
  id: push_1
  orientation:
    mode: keep_current
  parameters:
    max_time:
      binds_to:
      - mode: replace
        path: duration.max_time
      default: 3.5
      range:
      - 1.0
      - 6.0
      type: scalar
    push_depth:
      binds_to:
      - mode: replace
        path: target.offset_along_axis.distance
      default: 0.16
      range:
      - 0.05
      - 0.25
      type: scalar
    speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.03
      range:
      - 0.01
      - 0.08
      type: scalar
  retries:
    max_attempts: 1
    offset:
    - 0.005
    - 0.0
    - 0.0
    strategy: offset_target
  subtask_id: push_channel
  target:
    anchor: current_tcp
    offset:
    - 0.0
    - 0.0
    - 0.0
    offset_along_axis:
      axis: channel_axis
      distance: 0.16
      mode: add_to_offset
      sign: positive
    source: yaml
  termination: time_limit
  type: push
- control: position_control
  generator: arc_cartesian
  id: retract_1
  orientation:
    mode: keep_current
  parameters:
    retract_height:
      binds_to:
      - mode: add
        path: target.offset.z
      default: 0.12
      range:
      - 0.05
      - 0.25
      type: scalar
    speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.05
      range:
      - 0.01
      - 0.1
      type: scalar
  target:
    anchor: world
    offset:
    - 0.5
    - 0.0
    - 0.3
    source: yaml
    tolerance: 0.03
  termination: pose_tolerance
  type: retract
skill: peg_channel
subtasks:
- anchor: object
  id: reach_object
  metric: distance
  offset:
  - 0.0
  - 0.0
  - 0.1
  target_entity: tcp
  weight: 0.3
- anchor: goal
  id: push_channel
  metric: goal_progress
  offset:
  - 0.0
  - 0.0
  - 0.0
  target_entity: object
  weight: 0.7
