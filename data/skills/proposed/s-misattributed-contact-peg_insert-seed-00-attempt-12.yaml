dsl_version: 2
phases:
- control: position_control
  generator: linear_cartesian
  id: approach_above
  parameters:
    approach_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.4
      range:
      - 0.2
      - 0.8
      type: scalar
    approach_tolerance:
      binds_to:
      - mode: replace
        path: termination.pose_tolerance
      default: 0.02
      range:
      - 0.01
      - 0.025
      type: scalar
  subtask_id: approach_socket
  target:
    anchor: task_goal
    offset:
    - 0.0
    - 0.0
    - 0.12
    orientation:
      align_with: channel_axis
      axis:
      - 0.0
      - 0.0
      - 1.0
      mode: align_axis
      tolerance: 0.05
    source: yaml
  termination: pose_tolerance
  type: approach
- control: impedance_control
  generator: linear_cartesian
  guards:
  - args: {}
    id: jam_detect
    on_failure: retry
    predicate: force_below
    threshold: 45.0
    when: during_phase
  id: insert_into_hole
  parameters:
    force_threshold:
      binds_to:
      - mode: replace
        path: termination.force_threshold
      default: 35.0
      range:
      - 25.0
      - 50.0
      type: scalar
    insert_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.02
      range:
      - 0.005
      - 0.05
      type: scalar
    insertion_distance:
      binds_to:
      - mode: replace
        path: target.offset_along_axis.distance
      default: 0.055
      range:
      - 0.04
      - 0.06
      type: scalar
    retry_offset_x:
      binds_to:
      - mode: replace
        path: retry.offset.x
      default: 0.006
      range:
      - 0.0
      - 0.015
      type: scalar
    retry_offset_y:
      binds_to:
      - mode: replace
        path: retry.offset.y
      default: 0.006
      range:
      - 0.0
      - 0.015
      type: scalar
  retries:
    max_attempts: 2
    offset:
    - 0.006
    - 0.006
    - 0.0
    strategy: offset_target
  subtask_id: insert_peg
  target:
    anchor: task_goal
    offset:
    - 0.0
    - 0.0
    - 0.0
    offset_along_axis:
      axis: channel_axis
      distance: 0.055
      mode: add_to_offset
      sign: positive
    orientation:
      align_with: channel_axis
      axis:
      - 0.0
      - 0.0
      - 1.0
      mode: align_axis
      tolerance: 0.05
    source: yaml
  termination: force_exceeded
  type: insert
- control: position_control
  generator: linear_cartesian
  id: retract_up
  parameters:
    retract_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.05
      range:
      - 0.02
      - 0.1
      type: scalar
    retract_tolerance:
      binds_to:
      - mode: replace
        path: termination.pose_tolerance
      default: 0.012
      range:
      - 0.008
      - 0.02
      type: scalar
  target:
    anchor: task_goal
    offset:
    - 0.0
    - 0.0
    - 0.14
    orientation:
      align_with: channel_axis
      axis:
      - 0.0
      - 0.0
      - 1.0
      mode: align_axis
      tolerance: 0.05
    source: yaml
  termination: pose_tolerance
  type: retract
skill: peg_insert
subtasks:
- anchor: goal
  id: approach_socket
  metric: distance
  offset:
  - 0.0
  - 0.0
  - 0.12
  target_entity: tcp
  weight: 0.3
- anchor: fixture
  id: insert_peg
  metric: goal_progress
  offset:
  - 0.0
  - 0.0
  - 0.0
  target_entity: object
  weight: 0.7
