      type: scalar
    retract_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.07
      range:
      - 0.01
      - 0.2
      type: scalar
    retract_tol:
      binds_to:
      - mode: replace
        path: termination.pose_tolerance
      default: 0.01
      range:
      - 0.005
      - 0.05
      type: scalar
  retries:
    max_attempts: 0
    offset:
    - 0
    - 0
    - 0
    strategy: repeat
  subtask_id: null
  target:
    anchor: current_tcp
    entity: null
    offset:
    - 0
    - 0
    - 0
    offset_along_axis: null
    orientation:
      align_with: null
      axis: null
      mode: keep_current
      tolerance: 0.1
    source: yaml
    tolerance: 0.01
  termination: pose_tolerance
  type: retract
skill: grasp_place
skill_type: arm_gripper
subtasks:
- anchor: object
  id: approach_1
  metric: distance
  offset:
  - 0
  - 0
  - 0
  target_entity: null
  weight: 1.0
- anchor: object
  id: descend_1
  metric: distance
  offset:
  - 0
  - 0
  - 0.02
  target_entity: null
  weight: 1.0
- anchor: object
  id: grasp_1
