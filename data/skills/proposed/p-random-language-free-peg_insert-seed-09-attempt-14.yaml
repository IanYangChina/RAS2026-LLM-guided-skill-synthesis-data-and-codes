dsl_version: 2
phases:
- control: impedance_control
  generator: arc_cartesian
  id: approach_1
  parameters:
    approach_height:
      binds_to:
      - mode: replace
        path: target.offset.z
      default: 0.12
      range:
      - 0.08
      - 0.16
      type: scalar
    approach_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.15
      range:
      - 0.05
      - 0.3
      type: scalar
    approach_tolerance:
      binds_to:
      - mode: replace
        path: termination.pose_tolerance
      default: 0.01
      range:
      - 0.005
      - 0.02
      type: scalar
    arc_height:
      binds_to:
      - mode: replace
        path: generator.arc_height
      default: 0.12
      range:
      - 0.05
      - 0.25
      type: scalar
  subtask_id: approach_entry
  target:
    anchor: fixture
    entity: peg_socket
    offset:
    - 0.0
    - 0.0
    - 0.12
    orientation:
      align_with: world_z
      axis:
      - 0.0
      - 0.0
      - 1.0
      mode: align_axis
      tolerance: 0.1
    source: yaml
  termination: pose_tolerance
  type: approach
- control: impedance_control
  generator: linear_cartesian
  guards:
  - args: {}
    id: contact_excessive
    on_failure: abort
    predicate: force_below
    threshold: 60.0
    when: during_phase
  id: insert_1
  parameters:
    force_threshold:
      binds_to:
      - mode: replace
        path: termination.force_threshold
      default: 35.0
      range:
      - 20.0
      - 50.0
      type: scalar
    guard_force_limit:
      binds_to:
      - mode: replace
        path: guards.contact_excessive.threshold
      default: 60.0
      range:
      - 40.0
      - 80.0
      type: scalar
    insertion_depth:
      binds_to:
      - mode: replace
        path: target.offset_along_axis.distance
      default: 0.08
      range:
      - 0.05
      - 0.12
      type: scalar
    insertion_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.02
      range:
      - 0.01
      - 0.05
      type: scalar
  subtask_id: insertion_final
  target:
    anchor: fixture
    entity: peg_socket
    offset:
    - 0.0
    - 0.0
    - 0.0
    offset_along_axis:
      axis: channel_axis
      distance: 0.08
      mode: replace_offset_projection
      sign: positive
    orientation:
      mode: keep_current
    source: yaml
  termination: force_exceeded
  type: descend
skill: peg_insert
subtasks:
- anchor: fixture
  id: approach_entry
  metric: distance
  offset:
  - 0.0
  - 0.0
  - 0.12
  target_entity: tcp
  weight: 0.3
- anchor: fixture
  id: insertion_final
  metric: goal_progress
  target_entity: tcp
  weight: 0.7
