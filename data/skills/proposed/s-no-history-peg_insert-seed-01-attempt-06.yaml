dsl_version: 2
phases:
- control: position_control
  generator: linear_cartesian
  id: approach_above_entry
  parameters:
    approach_height:
      binds_to:
      - mode: replace
        path: target.offset.z
      default: 0.1
      range:
      - 0.05
      - 0.15
      type: scalar
    approach_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.15
      range:
      - 0.05
      - 0.3
      type: scalar
  subtask_id: reach_above_entry
  target:
    anchor: task_goal
    entity: socket_entry
    offset:
    - 0.0
    - 0.0
    - 0.1
    orientation:
      align_with: world_z
      axis:
      - 0.0
      - 0.0
      - 1.0
      mode: align_axis
      tolerance: 0.01
    source: yaml
    tolerance: 0.005
  termination: pose_tolerance
  type: approach
- control: position_control
  generator: linear_cartesian
  id: align_at_entry
  parameters:
    align_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.1
      range:
      - 0.05
      - 0.2
      type: scalar
    lateral_offset_x:
      binds_to:
      - mode: add
        path: target.offset.x
      default: 0.0
      range:
      - -0.03
      - 0.03
      type: scalar
    lateral_offset_y:
      binds_to:
      - mode: add
        path: target.offset.y
      default: 0.0
      range:
      - -0.03
      - 0.03
      type: scalar
  subtask_id: reach_above_entry
  target:
    anchor: task_goal
    entity: socket_entry
    offset:
    - 0.0
    - 0.0
    - 0.05
    orientation:
      mode: keep_current
    source: yaml
    tolerance: 0.005
  termination: pose_tolerance
  type: align
- control: impedance_control
  generator: linear_cartesian
  guards:
  - args: {}
    id: max_force_guard
    on_failure: retry
    predicate: force_below
    threshold: 40.0
    when: during_phase
  id: descend_insert
  parameters:
    force_threshold:
      binds_to:
      - mode: replace
        path: termination.force_threshold
      default: 20.0
      range:
      - 5.0
      - 30.0
      type: scalar
    insertion_depth:
      binds_to:
      - mode: replace
        path: target.offset.z
      default: -0.03
      range:
      - -0.05
      - -0.01
      type: scalar
    insertion_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.05
      range:
      - 0.02
      - 0.1
      type: scalar
  retries:
    max_attempts: 2
    strategy: reduce_speed
  subtask_id: reach_insertion
  target:
    anchor: task_goal
    entity: socket_entry
    offset:
    - 0.0
    - 0.0
    - -0.02
    orientation:
      mode: keep_current
    source: yaml
    tolerance: 0.005
  termination: force_exceeded
  type: insert
- control: impedance_control
  generator: linear_cartesian
  guards:
  - args: {}
    id: max_force_guard_push
    on_failure: retry
    predicate: force_below
    threshold: 40.0
    when: during_phase
  id: push_home
  parameters:
    final_push_depth:
      binds_to:
      - mode: replace
        path: target.offset.z
      default: -0.04
      range:
      - -0.06
      - -0.02
      type: scalar
    push_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.02
      range:
      - 0.01
      - 0.05
      type: scalar
  retries:
    max_attempts: 1
    strategy: reduce_speed
  subtask_id: reach_insertion
  target:
    anchor: task_goal
    entity: socket_entry
    offset:
    - 0.0
    - 0.0
    - -0.05
    orientation:
      mode: keep_current
    source: yaml
    tolerance: 0.005
  termination: pose_tolerance
  type: push
skill: peg_insert
subtasks:
- anchor: fixture
  id: reach_above_entry
  metric: distance
  offset:
  - 0.0
  - 0.0
  - 0.1
  target_entity: tcp
  weight: 0.3
- anchor: fixture
  id: reach_insertion
  metric: distance
  offset:
  - 0.0
  - 0.0
  - 0.0
  target_entity: tcp
  weight: 0.7
