dsl_version: 2
phases:
- control: position_control
  generator: linear_cartesian
  id: approach_above_object
  parameters:
    approach_height:
      binds_to:
      - mode: replace
        path: target.offset.z
      default: 0.1
      range:
      - 0.05
      - 0.15
      type: scalar
  subtask_id: approach_above_object
  target:
    anchor: task_object
    offset:
    - 0
    - 0
    - 0.1
    orientation:
      mode: keep_current
    source: yaml
    tolerance: 0.01
  termination: pose_tolerance
  type: approach
- control: force_threshold_switch
  generator: linear_cartesian
  id: descend_to_contact
  parameters:
    contact_force_threshold:
      binds_to:
      - mode: replace
        path: termination.force_threshold
      default: 5.0
      range:
      - 1.0
      - 10.0
      type: scalar
  subtask_id: approach_above_object
  target:
    anchor: task_object
    offset:
    - 0
    - 0
    - 0.0
    orientation:
      mode: keep_current
    source: yaml
  termination: force_exceeded
  type: contact
- control: impedance_control
  generator: linear_cartesian
  guards:
  - args: {}
    id: contact_maintained
    on_failure: retry
    predicate: contact_detected
    threshold: 0
    when: during_phase
  id: push_object_to_goal
  parameters:
    push_distance:
      binds_to:
      - mode: replace
        path: target.offset_along_axis.distance
      default: 0.12
      range:
      - 0.02
      - 0.2
      type: scalar
    push_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.05
      range:
      - 0.01
      - 0.1
      type: scalar
  retries:
    max_attempts: 2
    offset:
    - 0
    - 0.005
    - 0
    strategy: offset_target
  subtask_id: push_object_to_goal
  target:
    anchor: current_tcp
    offset_along_axis:
      axis: task_goal_direction
      distance: 0.12
      mode: add_to_offset
    orientation:
      mode: keep_current
    source: yaml
    tolerance: 0.02
  termination: pose_tolerance
  type: push
skill: push_to_goal
subtasks:
- anchor: object
  id: approach_above_object
  metric: distance
  offset:
  - 0
  - 0
  - 0.1
  target_entity: tcp
  weight: 0.3
- anchor: goal
  id: push_object_to_goal
  metric: goal_progress
  target_entity: object
  weight: 0.7
