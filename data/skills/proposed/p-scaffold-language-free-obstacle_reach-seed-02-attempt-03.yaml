dsl_version: 2
phases:
- control: position_control
  generator: arc_cartesian
  id: lift_side
  parameters:
    arc_height:
      binds_to:
      - mode: replace
        path: generator.arc_height
      default: 0.3
      range:
      - 0.15
      - 0.5
      type: scalar
  retries:
    max_attempts: 2
    strategy: reduce_speed
  subtask_id: clear_obstacle
  target:
    anchor: task_goal
    offset:
    - 0.0
    - 0.25
    - 0.35
    source: yaml
    tolerance: 0.02
  termination: pose_tolerance
  type: approach
- control: position_control
  generator: linear_cartesian
  id: center_above
  parameters:
    center_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.05
      range:
      - 0.02
      - 0.1
      type: scalar
  subtask_id: above_goal
  target:
    anchor: task_goal
    offset:
    - 0.0
    - 0.0
    - 0.35
    source: yaml
    tolerance: 0.02
  termination: pose_tolerance
  type: approach
- control: admittance_control
  generator: linear_cartesian
  guards:
  - id: collision_guard
    on_failure: retry
    predicate: force_below
    threshold: 5.0
    when: during_phase
  id: descend_goal
  parameters:
    descend_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.05
      range:
      - 0.02
      - 0.1
      type: scalar
  retries:
    max_attempts: 3
    offset:
    - 0.0
    - 0.15
    - 0.0
    strategy: offset_target
  subtask_id: reach_goal
  target:
    anchor: task_goal
    offset:
    - 0.0
    - 0.0
    - 0.0
    source: yaml
    tolerance: 0.02
  termination: pose_tolerance
  type: descend
skill: obstacle_reach
subtasks:
- anchor: goal
  id: clear_obstacle
  offset:
  - 0.0
  - 0.25
  - 0.35
  target_entity: tcp
  weight: 0.2
- anchor: goal
  id: above_goal
  offset:
  - 0.0
  - 0.0
  - 0.3
  target_entity: tcp
  weight: 0.2
- anchor: goal
  id: reach_goal
  target_entity: tcp
  weight: 0.6
