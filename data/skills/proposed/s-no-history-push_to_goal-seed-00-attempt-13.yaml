dsl_version: 2
phases:
- control: position_control
  end_effector_action: null
  generator: linear_cartesian
  guards: []
  id: approach_behind
  parameters:
    approach_speed:
      binds_to:
      - mode: add
        path: generator.speed
      default: 0.05
      range:
      - 0.02
      - 0.1
      type: scalar
  retries:
    max_attempts: 0
    strategy: repeat
  subtask_id: pre_contact
  target:
    anchor: task_object
    offset:
    - 0.0
    - 0.06
    - 0.1
    orientation:
      mode: keep_current
    source: yaml
    tolerance: 0.02
  termination: pose_tolerance
  type: approach
- control: force_threshold_switch
  end_effector_action: null
  generator: linear_cartesian
  guards: []
  id: descend_contact
  parameters:
    descend_speed:
      binds_to:
      - mode: add
        path: generator.speed
      default: 0.02
      range:
      - 0.01
      - 0.05
      type: scalar
    force_threshold:
      binds_to:
      - mode: add
        path: termination.force_threshold
      default: 5.0
      range:
      - 2.0
      - 15.0
      type: scalar
  retries:
    max_attempts: 0
    strategy: repeat
  subtask_id: pre_contact
  target:
    anchor: task_object
    offset:
    - 0.0
    - 0.06
    - 0.025
    orientation:
      mode: keep_current
    source: yaml
    tolerance: 0.01
  termination: force_exceeded
  type: contact
- control: impedance_control
  end_effector_action: null
  generator: impedance_motion
  guards:
  - args: {}
    id: force_limit
    on_failure: continue
    predicate: force_below
    threshold: 22.0
    when: during_phase
  id: push_to_goal
  parameters:
    push_distance:
      binds_to:
      - mode: add
        path: target.offset_along_axis.distance
      default: 0.15
      range:
      - 0.05
      - 0.2
      type: scalar
    push_speed:
      binds_to:
      - mode: add
        path: generator.speed
      default: 0.04
      range:
      - 0.01
      - 0.08
      type: scalar
  retries:
    max_attempts: 2
    strategy: reduce_speed
  subtask_id: push_task
  target:
    anchor: current_tcp
    offset:
    - 0.0
    - 0.0
    - 0.0
    offset_along_axis:
      axis: task_goal_direction
      distance: 0.15
      mode: add_to_offset
      sign: positive
    orientation:
      mode: none
    source: yaml
    tolerance: 0.02
  termination: pose_tolerance
  type: push
skill: push_to_goal
skill_type: arm
subtasks:
- anchor: object
  id: pre_contact
  metric: distance
  offset:
  - 0.0
  - 0.06
  - 0.025
  target_entity: tcp
  weight: 0.3
- anchor: goal
  id: push_task
  metric: distance
  offset:
  - 0.0
  - 0.0
  - 0.0
  target_entity: tcp
  weight: 0.7
