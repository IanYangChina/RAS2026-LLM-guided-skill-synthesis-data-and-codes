dsl_version: 2
phases:
- control: position_control
  generator: linear_cartesian
  id: approach_prepush
  parameters:
    approach_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.2
      range:
      - 0.05
      - 0.5
      type: scalar
    approach_tolerance:
      binds_to:
      - mode: replace
        path: termination.pose_tolerance
      default: 0.01
      range:
      - 0.005
      - 0.02
      type: scalar
  subtask_id: pre_contact
  target:
    anchor: task_object
    offset:
    - 0.02
    - 0.15
    - 0.1
    orientation:
      mode: none
    source: yaml
    tolerance: 0.01
  termination: pose_tolerance
  type: approach
- control: position_control
  generator: joint_interpolation
  id: align_tool
  parameters:
    align_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.3
      range:
      - 0.1
      - 0.5
      type: scalar
  subtask_id: pre_contact
  target:
    anchor: current_tcp
    offset:
    - 0.0
    - 0.0
    - 0.0
    orientation:
      align_with: channel_axis
      axis:
      - 0.0
      - 0.0
      - 1.0
      mode: align_axis
      tolerance: 0.1
    source: yaml
    tolerance: 0.01
  termination: pose_tolerance
  type: align
- control: impedance_control
  generator: linear_cartesian
  id: contact_settle
  parameters:
    settle_force_threshold:
      binds_to:
      - mode: replace
        path: termination.force_threshold
      default: 5.0
      range:
      - 3.0
      - 10.0
      type: scalar
    settle_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.05
      range:
      - 0.02
      - 0.15
      type: scalar
  subtask_id: pre_contact
  target:
    anchor: task_object
    offset:
    - 0.02
    - 0.03
    - 0.0
    offset_along_axis:
      axis: channel_axis
      distance: 0.05
      mode: add_to_offset
      sign: positive
    orientation:
      mode: keep_current
    source: yaml
    tolerance: 0.01
  termination: force_exceeded
  type: push
- control: impedance_control
  generator: linear_cartesian
  guards:
  - id: force_limit
    on_failure: retry
    predicate: force_below
    threshold: 40.0
    when: during_phase
  id: push_through
  parameters:
    push_distance:
      binds_to:
      - mode: replace
        path: target.offset_along_axis.distance
      default: 0.18
      range:
      - 0.14
      - 0.22
      type: scalar
    push_force_guard_threshold:
      binds_to:
      - mode: replace
        path: guards.force_limit.threshold
      default: 40.0
      range:
      - 30.0
      - 45.0
      type: scalar
    push_pose_tolerance:
      binds_to:
      - mode: replace
        path: termination.pose_tolerance
      default: 0.02
      range:
      - 0.01
      - 0.03
      type: scalar
    push_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.04
      range:
      - 0.01
      - 0.12
      type: scalar
    retry_offset_x:
      binds_to:
      - mode: replace
        path: retry.offset.x
      default: 0.01
      range:
      - -0.02
      - 0.02
      type: scalar
    retry_offset_y:
      binds_to:
      - mode: replace
        path: retry.offset.y
      default: -0.005
      range:
      - -0.02
      - 0.0
      type: scalar
    retry_offset_z:
      binds_to:
      - mode: replace
        path: retry.offset.z
      default: 0.0
      range:
      - -0.01
      - 0.01
      type: scalar
  retries:
    max_attempts: 3
    offset:
    - 0.01
    - -0.005
    - 0.0
    strategy: offset_target
  subtask_id: push_progress
  target:
    anchor: current_tcp
    offset:
    - 0.0
    - 0.0
    - 0.0
    offset_along_axis:
      axis: channel_axis
      distance: 0.18
      mode: add_to_offset
      sign: positive
    orientation:
      mode: keep_current
    source: yaml
    tolerance: 0.02
  termination: pose_tolerance
  type: push
skill: peg_channel
subtasks:
- anchor: object
  id: pre_contact
  offset:
  - 0.02
  - 0.03
  - 0.1
  weight: 0.3
- id: push_progress
  metric: goal_progress
  target_entity: object
  weight: 0.7
