dsl_version: 2
phases:
- control: position_control
  generator: linear_cartesian
  id: approach_peg
  parameters:
    approach_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.2
      range:
      - 0.1
      - 0.5
      type: scalar
  retries:
    max_attempts: 1
    offset:
    - 0.0
    - 0.0
    - 0.02
    strategy: offset_target
  subtask_id: reach_peg
  target:
    anchor: task_object
    offset:
    - 0.0
    - 0.05
    - 0.1
    orientation:
      mode: none
    source: yaml
    tolerance: 0.02
  termination: pose_tolerance
  type: approach
- control: force_threshold_switch
  generator: linear_cartesian
  guards:
  - args: {}
    id: contact_made
    on_failure: retry
    predicate: contact_detected
    threshold: 1
    when: after_phase
  id: descend_to_peg
  parameters:
    contact_force_threshold:
      binds_to:
      - mode: replace
        path: termination.force_threshold
      default: 5.0
      range:
      - 1.0
      - 15.0
      type: scalar
    descent_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.05
      range:
      - 0.01
      - 0.1
      type: scalar
  retries:
    max_attempts: 1
    offset:
    - 0.0
    - 0.0
    - 0.01
    strategy: offset_target
  subtask_id: reach_peg
  target:
    anchor: task_object
    offset:
    - 0.0
    - 0.05
    - 0.04
    orientation:
      mode: none
    source: yaml
  termination: force_exceeded
  type: contact
- control: impedance_control
  generator: linear_cartesian
  guards:
  - args: {}
    id: progress_ok
    on_failure: retry
    predicate: object_progress
    threshold: 0.05
    when: after_phase
  - args: {}
    id: peg_lost
    on_failure: retry
    predicate: force_below
    threshold: 3.0
    when: during_phase
  id: push_through_channel
  parameters:
    pose_tolerance:
      binds_to:
      - mode: replace
        path: termination.pose_tolerance
      default: 0.02
      range:
      - 0.01
      - 0.05
      type: scalar
    push_distance:
      binds_to:
      - mode: replace
        path: target.offset_along_axis.distance
      default: 0.12
      range:
      - 0.05
      - 0.2
      type: scalar
    push_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.05
      range:
      - 0.01
      - 0.1
      type: scalar
  retries:
    max_attempts: 1
    offset:
    - 0.0
    - 0.01
    - 0.0
    strategy: offset_target
  subtask_id: push_channel
  target:
    anchor: task_object
    offset:
    - 0.0
    - 0.05
    - 0.04
    offset_along_axis:
      axis: channel_axis
      distance: 0.15
      mode: replace_offset_projection
      sign: positive
    orientation:
      mode: none
    source: yaml
    tolerance: 0.02
  termination: pose_tolerance
  type: push
- control: position_control
  generator: arc_cartesian
  id: retract_pusher
  parameters:
    retract_height:
      binds_to:
      - mode: replace
        path: generator.arc_height
      default: 0.1
      range:
      - 0.05
      - 0.2
      type: scalar
    retract_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.15
      range:
      - 0.05
      - 0.3
      type: scalar
  target:
    anchor: task_goal
    offset:
    - 0.0
    - 0.0
    - 0.15
    orientation:
      mode: none
    source: yaml
    tolerance: 0.05
  termination: pose_tolerance
  type: retract
skill: peg_channel
subtasks:
- anchor: object
  id: reach_peg
  metric: distance
  offset:
  - 0.0
  - 0.05
  - 0.1
  target_entity: tcp
  weight: 0.3
- anchor: goal
  id: push_channel
  metric: goal_progress
  offset:
  - 0.0
  - 0.0
  - 0.0
  target_entity: object
  weight: 0.7
