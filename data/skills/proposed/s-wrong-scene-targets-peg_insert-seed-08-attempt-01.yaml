dsl_version: 2
phases:
- control: position_control
  generator: linear_cartesian
  guards:
  - args: {}
    id: approach_timeout
    on_failure: continue
    predicate: force_below
    threshold: 5.0
    when: during_phase
  id: approach_up
  parameters:
    approach_height:
      binds_to:
      - mode: replace
        path: target.offset.z
      default: 0.12
      range:
      - 0.06
      - 0.18
      type: scalar
    speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.08
      range:
      - 0.02
      - 0.15
      type: scalar
  retries:
    max_attempts: 1
    offset:
    - 0.0
    - 0.0
    - 0.02
    strategy: offset_target
  subtask_id: approach_to_entry
  target:
    anchor: fixture
    entity: peg_socket
    offset:
    - 0.0
    - 0.0
    - 0.12
    orientation:
      align_with: world_z
      axis:
      - 0.0
      - 0.0
      - -1.0
      mode: align_axis
      tolerance: 0.05
    source: yaml
  termination: pose_tolerance
  type: approach
- control: impedance_control
  generator: linear_cartesian
  guards:
  - args: {}
    id: lateral_force_guard
    on_failure: continue
    predicate: force_below
    threshold: 5.0
    when: during_phase
  id: insert_down
  parameters:
    insertion_force:
      binds_to:
      - mode: replace
        path: termination.force_threshold
      default: 30.0
      range:
      - 15.0
      - 40.0
      type: scalar
    insertion_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.015
      range:
      - 0.005
      - 0.03
      type: scalar
  retries:
    max_attempts: 2
    offset:
    - 0.005
    - 0.005
    - 0.0
    strategy: offset_target
  subtask_id: insertion_depth
  target:
    anchor: current_tcp
    offset:
    - 0.0
    - 0.0
    - 0.0
    offset_along_axis:
      axis: insertion_axis
      distance: 0.06
      mode: replace_offset_projection
      sign: positive
    orientation:
      mode: keep_current
    source: yaml
  termination: force_exceeded
  type: insert
skill: peg_insert
subtasks:
- anchor: fixture
  id: approach_to_entry
  metric: distance
  offset:
  - 0.0
  - 0.0
  - 0.12
  target_entity: tcp
  weight: 0.3
- anchor: fixture
  id: insertion_depth
  metric: goal_progress
  offset:
  - 0.0
  - 0.0
  - 0.02
  target_entity: tcp
  weight: 0.7
