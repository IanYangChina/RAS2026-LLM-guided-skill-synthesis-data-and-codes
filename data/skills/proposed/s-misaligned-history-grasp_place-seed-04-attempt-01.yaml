dsl_version: 2
phases:
- control: position_control
  generator: linear_cartesian
  id: approach_above
  parameters:
    approach_height:
      binds_to:
      - mode: replace
        path: target.offset.z
      default: 0.15
      range:
      - 0.1
      - 0.2
      type: scalar
    approach_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.1
      range:
      - 0.05
      - 0.2
      type: scalar
  subtask_id: reach_above_object
  target:
    anchor: task_object
    entity: grasp_target
    offset:
    - 0.0
    - 0.0
    - 0.15
    orientation:
      mode: none
    source: yaml
    tolerance: 0.02
  termination: pose_tolerance
  type: approach
- control: force_threshold_switch
  generator: linear_cartesian
  id: descend_grasp
  parameters:
    descend_force_threshold:
      binds_to:
      - mode: replace
        path: termination.force_threshold
      default: 5.0
      range:
      - 1.0
      - 10.0
      type: scalar
    descend_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.05
      range:
      - 0.02
      - 0.1
      type: scalar
    grasp_offset_z:
      binds_to:
      - mode: replace
        path: target.offset.z
      default: 0.02
      range:
      - 0.0
      - 0.06
      type: scalar
  target:
    anchor: task_object
    entity: grasp_target
    offset:
    - 0.0
    - 0.0
    - 0.02
    orientation:
      mode: keep_current
    source: yaml
    tolerance: 0.02
  termination: force_exceeded
  type: descend
- control: position_control
  end_effector_action: force_grasp
  generator: null
  id: grasp
  retries:
    max_attempts: 2
    strategy: repeat
  target:
    anchor: current_tcp
    offset:
    - 0.0
    - 0.0
    - 0.0
    orientation:
      mode: keep_current
    source: yaml
  termination: grasp_success
  type: grasp
- control: position_control
  generator: linear_cartesian
  id: lift
  parameters:
    lift_height:
      binds_to:
      - mode: replace
        path: target.offset_along_axis.distance
      default: 0.15
      range:
      - 0.1
      - 0.25
      type: scalar
    lift_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.1
      range:
      - 0.05
      - 0.15
      type: scalar
  target:
    anchor: current_tcp
    offset:
    - 0.0
    - 0.0
    - 0.0
    offset_along_axis:
      axis: world_z
      distance: 0.15
      mode: add_to_offset
      sign: positive
    orientation:
      mode: keep_current
    source: yaml
    tolerance: 0.03
  termination: pose_tolerance
  type: lift
- control: position_control
  generator: linear_cartesian
  id: transport_to_goal
  parameters:
    approach_goal_height:
      binds_to:
      - mode: replace
        path: target.offset.z
      default: 0.15
      range:
      - 0.1
      - 0.2
      type: scalar
    transport_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.12
      range:
      - 0.08
      - 0.2
      type: scalar
  subtask_id: reach_goal
  target:
    anchor: task_goal
    offset:
    - 0.0
    - 0.0
    - 0.15
    orientation:
      mode: none
    source: yaml
    tolerance: 0.02
  termination: pose_tolerance
  type: approach
- control: position_control
  generator: linear_cartesian
  id: descend_place
  parameters:
    place_offset_z:
      binds_to:
      - mode: replace
        path: target.offset.z
      default: 0.0
      range:
      - -0.02
      - 0.02
      type: scalar
    place_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.05
      range:
      - 0.02
      - 0.1
      type: scalar
  target:
    anchor: task_goal
    offset:
    - 0.0
    - 0.0
    - 0.0
    orientation:
      mode: keep_current
    source: yaml
    tolerance: 0.02
  termination: pose_tolerance
  type: descend
- control: position_control
  end_effector_action: open
  generator: null
  id: release
  parameters:
    release_duration:
      binds_to:
      - mode: replace
        path: duration.max_time
      default: 0.3
      range:
      - 0.1
      - 0.5
      type: scalar
  target:
    anchor: current_tcp
    offset:
    - 0.0
    - 0.0
    - 0.0
    orientation:
      mode: keep_current
    source: yaml
  termination: time_limit
  type: release
- control: position_control
  generator: linear_cartesian
  id: retract
  parameters:
    retract_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.2
      range:
      - 0.1
      - 0.3
      type: scalar
  target:
    anchor: task_goal
    offset:
    - 0.0
    - 0.0
    - 0.2
    orientation:
      mode: none
    source: yaml
    tolerance: 0.03
  termination: pose_tolerance
  type: retract
skill: grasp_place
skill_type: arm_gripper
subtasks:
- anchor: object
  id: reach_above_object
  metric: distance
  offset:
  - 0.0
  - 0.0
  - 0.15
  target_entity: tcp
  weight: 0.3
- anchor: goal
  id: reach_goal
  metric: distance
  offset:
  - 0.0
  - 0.0
  - 0.0
  target_entity: tcp
  weight: 0.7
