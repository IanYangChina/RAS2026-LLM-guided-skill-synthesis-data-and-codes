dsl_version: 2
phases:
- control: position_control
  generator: linear_cartesian
  id: approach_1
  parameters:
    speed:
      binds_to:
      - mode: add
        path: generator.speed
      default: 0.1
      range:
      - 0.05
      - 0.2
      type: scalar
  subtask_id: reach_above_peg
  target:
    anchor: task_object
    entity: peg
    offset:
    - 0.0
    - 0.0
    - 0.12
    orientation:
      mode: none
    source: yaml
    tolerance: 0.02
  termination: pose_tolerance
  type: approach
- control: position_control
  generator: linear_cartesian
  id: descend_1
  parameters:
    speed:
      binds_to:
      - mode: add
        path: generator.speed
      default: 0.05
      range:
      - 0.02
      - 0.1
      type: scalar
  subtask_id: contact_peg
  target:
    anchor: task_object
    entity: peg
    offset:
    - 0.0
    - 0.04
    - 0.02
    orientation:
      mode: none
    source: yaml
    tolerance: 0.02
  termination: pose_tolerance
  type: descend
- control: impedance_control
  generator: linear_cartesian
  id: push_1
  parameters:
    overshoot_y:
      binds_to:
      - mode: replace
        path: target.offset.y
      default: 0.02
      range:
      - 0.0
      - 0.04
      type: scalar
    retry_x_offset:
      binds_to:
      - mode: replace
        path: retry.offset.x
      default: 0.01
      range:
      - 0.005
      - 0.02
      type: scalar
    speed:
      binds_to:
      - mode: add
        path: generator.speed
      default: 0.05
      range:
      - 0.02
      - 0.08
      type: scalar
  retries:
    max_attempts: 2
    offset:
    - 0.01
    - 0.0
    - 0.0
    strategy: offset_target
  subtask_id: push_through_channel
  target:
    anchor: task_goal
    entity: peg
    offset:
    - 0.0
    - 0.02
    - 0.0
    orientation:
      align_with: channel_axis
      axis:
      - 1.0
      - 0.0
      - 0.0
      mode: align_axis
      tolerance: 0.1
    source: yaml
    tolerance: 0.02
  termination: pose_tolerance
  type: push
skill: peg_channel
subtasks:
- anchor: object
  id: reach_above_peg
  offset:
  - 0.0
  - 0.0
  - 0.12
  weight: 0.2
- anchor: object
  id: contact_peg
  offset:
  - 0.0
  - 0.04
  - 0.02
  weight: 0.3
- id: push_through_channel
  metric: goal_progress
  target_entity: object
  weight: 0.5
