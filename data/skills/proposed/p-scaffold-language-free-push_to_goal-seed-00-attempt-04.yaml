dsl_version: 2
phases:
- control: position_control
  generator: arc_cartesian
  id: approach_1
  parameters:
    approach_height:
      binds_to:
      - mode: replace
        path: target.offset.z
      default: 0.2
      range:
      - 0.05
      - 0.3
      type: scalar
  target:
    anchor: task_object
    offset:
    - 0
    - 0
    - 0.2
    orientation:
      mode: keep_current
    source: yaml
  termination: pose_tolerance
  type: approach
- control: admittance_control
  generator: impedance_motion
  id: contact_1
  parameters:
    contact_force:
      binds_to:
      - mode: replace
        path: termination.force_threshold
      default: 10.0
      range:
      - 1.0
      - 20.0
      type: scalar
  target:
    anchor: task_object
    offset:
    - 0
    - 0
    - 0.01
    orientation:
      mode: keep_current
    source: yaml
  termination: force_exceeded
  type: contact
- control: impedance_control
  generator: linear_cartesian
  id: push_1
  parameters:
    push_distance:
      binds_to:
      - mode: replace
        path: target.offset_along_axis.distance
      default: 0.1
      range:
      - 0.02
      - 0.2
      type: scalar
    push_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.05
      range:
      - 0.01
      - 0.1
      type: scalar
  target:
    anchor: current_tcp
    offset:
    - 0
    - 0
    - 0
    offset_along_axis:
      axis: task_goal_direction
      distance: 0.1
      mode: add_to_offset
      sign: positive
    orientation:
      mode: keep_current
    source: yaml
  termination: pose_tolerance
  type: push
- control: position_control
  generator: linear_cartesian
  id: retract_1
  target:
    anchor: current_tcp
    offset:
    - 0
    - 0
    - 0.1
    orientation:
      mode: keep_current
    source: yaml
  termination: pose_tolerance
  type: retract
skill: push_to_goal
