dsl_version: 2
phases:
- control: impedance_control
  generator: linear_cartesian
  guards:
  - id: force_limit
    on_failure: retry
    predicate: force_below
    threshold: 5.0
    when: during_phase
  id: approach_over
  parameters:
    approach_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.35
      range:
      - 0.2
      - 0.5
      type: scalar
    force_threshold:
      binds_to:
      - mode: replace
        path: guards.force_limit.threshold
      default: 5.0
      range:
      - 3.0
      - 8.0
      type: scalar
  retries:
    max_attempts: 1
    offset:
    - 0.0
    - 0.02
    - 0.03
    strategy: offset_target
  subtask_id: reach_above_goal
  target:
    anchor: task_goal
    offset:
    - 0.0
    - 0.0
    - 0.2
    orientation:
      mode: keep_current
      tolerance: 0.3
    source: yaml
    tolerance: 0.02
  termination: pose_tolerance
  type: approach
- control: position_control
  generator: linear_cartesian
  id: descend_to_goal
  parameters:
    descend_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.2
      range:
      - 0.1
      - 0.4
      type: scalar
    goal_tolerance:
      binds_to:
      - mode: replace
        path: termination.pose_tolerance
      default: 0.015
      range:
      - 0.01
      - 0.025
      type: scalar
  retries:
    max_attempts: 1
    offset:
    - 0.0
    - 0.0
    - 0.0
    strategy: reduce_speed
  subtask_id: reach_goal
  target:
    anchor: task_goal
    offset:
    - 0.0
    - 0.0
    - 0.0
    orientation:
      mode: keep_current
      tolerance: 0.3
    source: yaml
    tolerance: 0.02
  termination: pose_tolerance
  type: descend
skill: obstacle_reach
subtasks:
- anchor: goal
  id: reach_above_goal
  metric: distance
  offset:
  - 0.0
  - 0.0
  - 0.2
  target_entity: tcp
  weight: 0.3
- anchor: goal
  id: reach_goal
  metric: distance
  offset:
  - 0.0
  - 0.0
  - 0.0
  target_entity: tcp
  weight: 0.7
