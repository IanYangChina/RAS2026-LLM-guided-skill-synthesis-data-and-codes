dsl_version: 2
phases:
- control: position_control
  generator: linear_cartesian
  guards: null
  id: approach_1
  parameters:
    approach_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.05
      range:
      - 0.01
      - 0.1
      type: scalar
  retries: null
  subtask_id: approach_hole
  target:
    anchor: task_goal
    entity: null
    offset:
    - 0.0
    - 0.0
    - 0.0
    orientation:
      align_with: channel_axis
      axis:
      - 0.0
      - 0.0
      - 1.0
      mode: align_axis
      tolerance: 0.1
    source: yaml
    tolerance: 0.005
  termination: pose_tolerance
  type: approach
- control: impedance_control
  generator: impedance_motion
  guards:
  - args: {}
    id: guard_force_limit
    on_failure: continue
    predicate: force_below
    threshold: 40.0
    when: during_phase
  id: insert_1
  parameters:
    force_threshold:
      binds_to:
      - mode: replace
        path: termination.force_threshold
      default: 20.0
      range:
      - 5.0
      - 40.0
      type: scalar
    push_distance:
      binds_to:
      - mode: replace
        path: target.offset_along_axis.distance
      default: 0.055
      range:
      - 0.02
      - 0.08
      type: scalar
  retries:
    max_attempts: 1
    offset:
    - 0.005
    - 0.0
    - 0.0
    strategy: offset_target
  subtask_id: insert_peg
  target:
    anchor: fixture
    entity: peg_socket
    offset:
    - 0.0
    - 0.0
    - 0.0
    offset_along_axis:
      axis: channel_axis
      distance: 0.055
      mode: add_to_offset
      sign: negative
    orientation:
      align_with: channel_axis
      axis:
      - 0.0
      - 0.0
      - 1.0
      mode: align_axis
      tolerance: 0.1
    source: yaml
    tolerance: 0.01
  termination: force_exceeded
  type: push
- control: position_control
  generator: linear_cartesian
  guards: null
  id: retract_1
  parameters: {}
  retries: null
  target:
    anchor: task_goal
    entity: null
    offset:
    - 0.0
    - 0.0
    - 0.05
    orientation:
      mode: keep_current
    source: yaml
    tolerance: 0.01
  termination: pose_tolerance
  type: retract
skill: peg_insert
subtasks:
- anchor: goal
  id: approach_hole
  metric: distance
  offset:
  - 0.0
  - 0.0
  - 0.0
  target_entity: tcp
  weight: 0.3
- anchor: fixture
  id: insert_peg
  metric: distance
  offset:
  - 0.0
  - 0.0
  - 0.0
  target_entity: object
  weight: 0.7
