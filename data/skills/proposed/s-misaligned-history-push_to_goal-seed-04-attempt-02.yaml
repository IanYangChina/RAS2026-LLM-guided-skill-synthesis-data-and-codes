dsl_version: 2
phases:
- control: position_control
  generator: linear_cartesian
  id: approach
  parameters:
    approach_height:
      binds_to:
      - mode: replace
        path: target.offset.z
      default: 0.1
      range:
      - 0.05
      - 0.15
      type: scalar
    approach_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.1
      range:
      - 0.05
      - 0.2
      type: scalar
  subtask_id: reach_contact
  target:
    anchor: task_object
    entity: null
    offset:
    - 0.05
    - 0.1
    - 0.1
    orientation:
      mode: none
    source: yaml
    tolerance: 0.005
  termination: pose_tolerance
  type: approach
- control: position_control
  generator: linear_cartesian
  id: descend
  parameters:
    contact_height:
      binds_to:
      - mode: replace
        path: target.offset.z
      default: 0.04
      range:
      - 0.02
      - 0.06
      type: scalar
    descend_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.05
      range:
      - 0.02
      - 0.1
      type: scalar
  retries:
    max_attempts: 1
    offset:
    - 0.0
    - 0.0
    - 0.01
    strategy: offset_target
  subtask_id: reach_contact
  target:
    anchor: task_object
    entity: null
    offset:
    - 0.05
    - 0.1
    - 0.04
    orientation:
      mode: none
    source: yaml
    tolerance: 0.01
  termination: contact_detected
  type: contact
- control: impedance_control
  generator: linear_cartesian
  guards:
  - args: {}
    id: force_limit
    on_failure: abort
    predicate: force_below
    threshold: 25.0
    when: during_phase
  id: push
  parameters:
    push_distance:
      binds_to:
      - mode: replace
        path: target.offset_along_axis.distance
      default: 0.05
      range:
      - 0.02
      - 0.2
      type: scalar
    push_height:
      binds_to:
      - mode: replace
        path: target.offset.z
      default: 0.04
      range:
      - 0.02
      - 0.06
      type: scalar
    push_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.06
      range:
      - 0.02
      - 0.15
      type: scalar
  retries:
    max_attempts: 1
    strategy: reduce_speed
  subtask_id: reach_goal
  target:
    anchor: task_goal
    entity: null
    offset:
    - 0.0
    - 0.0
    - 0.04
    offset_along_axis:
      axis: push_direction
      distance: 0.05
      mode: replace_offset_projection
      sign: positive
    orientation:
      mode: none
    source: yaml
    tolerance: 0.02
  termination: pose_tolerance
  type: push
skill: push_to_goal
skill_type: arm_gripper
subtasks:
- anchor: object
  id: reach_contact
  metric: distance
  offset:
  - 0.05
  - 0.1
  - 0.04
  target_entity: tcp
  weight: 0.3
- anchor: goal
  id: reach_goal
  metric: distance
  offset:
  - 0.0
  - 0.0
  - 0.04
  target_entity: tcp
  weight: 0.7
