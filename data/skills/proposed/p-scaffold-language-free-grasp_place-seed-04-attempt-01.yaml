dsl_version: 2
phases:
- control: position_control
  generator: linear_cartesian
  id: approach_1
  orientation:
    mode: keep_current
  parameters:
    approach_height:
      binds_to:
      - mode: replace
        path: target.offset.z
      default: 0.12
      range:
      - 0.05
      - 0.2
      type: scalar
    speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.05
      range:
      - 0.01
      - 0.1
      type: scalar
  subtask_id: object_approach
  target:
    anchor: task_object
    entity: grasp_target
    offset:
    - 0.0
    - 0.0
    - 0.12
  termination: pose_tolerance
  type: approach
- control: position_control
  generator: linear_cartesian
  id: descend_1
  orientation:
    mode: keep_current
  parameters:
    descend_z:
      binds_to:
      - mode: replace
        path: target.offset.z
      default: 0.03
      range:
      - 0.01
      - 0.05
      type: scalar
    speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.03
      range:
      - 0.01
      - 0.08
      type: scalar
  subtask_id: object_approach
  target:
    anchor: task_object
    entity: grasp_target
    offset:
    - 0.0
    - 0.0
    - 0.03
  termination: pose_tolerance
  type: descend
- control: position_control
  end_effector_action: force_grasp
  generator: null
  id: grasp_1
  orientation:
    mode: keep_current
  parameters:
    grasp_time:
      binds_to:
      - mode: replace
        path: duration.max_time
      default: 1.0
      range:
      - 0.5
      - 3.0
      type: scalar
  subtask_id: object_approach
  target:
    anchor: current_tcp
    offset:
    - 0.0
    - 0.0
    - 0.0
  termination: time_limit
  type: grasp
- control: position_control
  generator: linear_cartesian
  id: lift_1
  orientation:
    mode: keep_current
  parameters:
    lift_height:
      binds_to:
      - mode: replace
        path: target.offset.z
      default: 0.15
      range:
      - 0.1
      - 0.3
      type: scalar
    speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.05
      range:
      - 0.01
      - 0.1
      type: scalar
  subtask_id: object_approach
  target:
    anchor: task_object
    entity: grasp_target
    offset:
    - 0.0
    - 0.0
    - 0.15
  termination: pose_tolerance
  type: lift
- control: position_control
  generator: linear_cartesian
  id: transport_to_goal
  orientation:
    mode: keep_current
  parameters:
    speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.06
      range:
      - 0.01
      - 0.12
      type: scalar
    transport_height:
      binds_to:
      - mode: replace
        path: target.offset.z
      default: 0.05
      range:
      - 0.02
      - 0.15
      type: scalar
  subtask_id: goal_approach
  target:
    anchor: task_goal
    entity: place_target
    offset:
    - 0.0
    - 0.0
    - 0.05
  termination: pose_tolerance
  type: approach
- control: position_control
  generator: linear_cartesian
  id: descend_to_goal
  orientation:
    mode: keep_current
  parameters:
    goal_z:
      binds_to:
      - mode: replace
        path: target.offset.z
      default: 0.0
      range:
      - -0.03
      - 0.03
      type: scalar
    speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.03
      range:
      - 0.01
      - 0.08
      type: scalar
  subtask_id: goal_approach
  target:
    anchor: task_goal
    entity: place_target
    offset:
    - 0.0
    - 0.0
    - 0.0
  termination: pose_tolerance
  type: descend
- control: position_control
  end_effector_action: open
  generator: null
  id: release_1
  orientation:
    mode: keep_current
  parameters:
    release_time:
      binds_to:
      - mode: replace
        path: duration.max_time
      default: 1.0
      range:
      - 0.5
      - 2.0
      type: scalar
  subtask_id: goal_approach
  target:
    anchor: current_tcp
    offset:
    - 0.0
    - 0.0
    - 0.0
  termination: time_limit
  type: release
- control: position_control
  generator: linear_cartesian
  id: retract_1
  orientation:
    mode: keep_current
  parameters:
    retract_distance:
      binds_to:
      - mode: replace
        path: target.offset.z
      default: 0.1
      range:
      - 0.05
      - 0.2
      type: scalar
    speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.08
      range:
      - 0.01
      - 0.12
      type: scalar
  target:
    anchor: current_tcp
    offset:
    - 0.0
    - 0.0
    - 0.1
  termination: pose_tolerance
  type: retract
skill: grasp_place
skill_type: arm_gripper
subtasks:
- anchor: object
  id: object_approach
  metric: distance
  offset:
  - 0.0
  - 0.0
  - 0.1
  target_entity: tcp
  weight: 0.3
- anchor: goal
  id: goal_approach
  metric: distance
  offset:
  - 0.0
  - 0.0
  - 0.0
  target_entity: tcp
  weight: 0.7
