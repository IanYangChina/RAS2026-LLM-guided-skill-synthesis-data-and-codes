dsl_version: 2
phases:
- control: impedance_control
  generator: arc_cartesian
  id: approach
  parameters:
    approach_height:
      binds_to:
      - mode: add
        path: target.offset.2
      default: 0.2
      range:
      - 0.1
      - 0.3
      type: scalar
    approach_lateral:
      binds_to:
      - mode: add
        path: target.offset.1
      default: 0.0
      range:
      - -0.05
      - 0.05
      type: scalar
    speed:
      binds_to:
      - mode: scale
        path: generator.speed
      default: 0.08
      range:
      - 0.02
      - 0.15
      type: scalar
  subtask_id: reach_door
  target:
    anchor: fixture
    entity: door_panel
    offset:
    - -0.4
    - -0.12
    - 0.35
    orientation:
      align_with: world_z
      axis:
      - 0
      - 0
      - 1
      mode: align_axis
      tolerance: 0.1
    source: yaml
  termination: pose_tolerance
  type: approach
- control: impedance_control
  generator: linear_cartesian
  guards:
  - args: {}
    id: check_force
    on_failure: retry
    predicate: force_below
    threshold: 30.0
    when: during_phase
  id: push
  parameters:
    force_limit:
      binds_to:
      - mode: replace
        path: termination.force_threshold
      default: 25.0
      range:
      - 10.0
      - 30.0
      type: scalar
    push_distance:
      binds_to:
      - mode: replace
        path: target.offset_along_axis.distance
      default: 0.3
      range:
      - 0.1
      - 0.5
      type: scalar
    push_speed:
      binds_to:
      - mode: scale
        path: generator.speed
      default: 0.05
      range:
      - 0.01
      - 0.1
      type: scalar
  retries:
    max_attempts: 2
    offset:
    - 0.0
    - 0.01
    - 0.0
    strategy: offset_target
  subtask_id: push_door
  target:
    anchor: current_tcp
    offset_along_axis:
      axis: world_y
      distance: 0.3
      mode: add_to_offset
      sign: positive
    orientation:
      mode: keep_current
      tolerance: 0.1
    source: yaml
  termination: force_exceeded
  type: push
- control: position_control
  generator: linear_cartesian
  id: retract
  parameters:
    retract_speed:
      binds_to:
      - mode: scale
        path: generator.speed
      default: 0.06
      range:
      - 0.02
      - 0.1
      type: scalar
  target:
    anchor: current_tcp
    offset:
    - 0.0
    - -0.1
    - 0.1
    orientation:
      mode: keep_current
    source: yaml
  termination: pose_tolerance
  type: retract
skill: door_push
subtasks:
- anchor: fixture
  id: reach_door
  metric: distance
  offset:
  - -0.4
  - -0.07
  - 0.35
  target_entity: tcp
  weight: 0.2
- anchor: goal
  id: push_door
  metric: hinge_angle
  target_entity: hinge
  weight: 0.8
