dsl_version: 2
phases:
- control: impedance_control
  generator: arc_cartesian
  guards:
  - args: {}
    id: obstacle_contact
    on_failure: retry
    predicate: contact_detected
    threshold: 0.5
    when: during_phase
  id: approach_goal
  parameters:
    arc_height:
      binds_to:
      - mode: replace
        path: generator.arc_height
      default: 0.4
      range:
      - 0.2
      - 0.6
      type: scalar
    retry_x:
      binds_to:
      - mode: replace
        path: retry.offset.x
      default: 0.05
      range:
      - 0.01
      - 0.1
      type: scalar
    speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.05
      range:
      - 0.01
      - 0.15
      type: scalar
  retries:
    max_attempts: 2
    offset:
    - 0.05
    - 0.0
    - 0.0
    strategy: offset_target
  subtask_id: reach_goal
  target:
    anchor: task_goal
    offset:
    - 0.0
    - 0.0
    - 0.0
    orientation:
      mode: none
    source: yaml
    tolerance: 0.02
  termination: pose_tolerance
  type: approach
skill: obstacle_reach
subtasks:
- anchor: goal
  id: reach_goal
  metric: distance
  offset:
  - 0.0
  - 0.0
  - 0.0
  target_entity: tcp
  weight: 1.0
