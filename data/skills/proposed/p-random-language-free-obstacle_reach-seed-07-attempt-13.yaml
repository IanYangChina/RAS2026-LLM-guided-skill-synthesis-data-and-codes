dsl_version: 2
phases:
- control: position_control
  generator: arc_cartesian
  id: go_over_obstacle
  orientation:
    mode: keep_current
  parameters:
    arc_height:
      binds_to:
      - mode: replace
        path: generator.arc_height
      default: 0.15
      range:
      - 0.05
      - 0.3
      type: scalar
    speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.15
      range:
      - 0.1
      - 0.3
      type: scalar
  subtask_id: reach_goal_lateral
  target:
    anchor: task_goal
    offset:
    - 0.0
    - 0.2
    - 0.25
    source: yaml
    tolerance: 0.02
  termination: pose_tolerance
  type: approach
- control: position_control
  generator: linear_cartesian
  id: go_to_goal
  orientation:
    mode: keep_current
  parameters:
    speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.1
      range:
      - 0.05
      - 0.2
      type: scalar
  subtask_id: reach_goal
  target:
    anchor: task_goal
    offset:
    - 0.0
    - 0.0
    - 0.0
    source: yaml
    tolerance: 0.015
  termination: pose_tolerance
  type: approach
skill: obstacle_reach
skill_type: arm_gripper
subtasks:
- anchor: goal
  id: reach_goal_lateral
  metric: distance
  offset:
  - 0.0
  - 0.2
  - 0.25
  target_entity: tcp
  weight: 0.3
- anchor: goal
  id: reach_goal
  metric: distance
  offset:
  - 0.0
  - 0.0
  - 0.0
  target_entity: tcp
  weight: 0.7
