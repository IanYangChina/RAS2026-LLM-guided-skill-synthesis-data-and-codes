dsl_version: 2
phases:
- control: position_control
  generator: linear_cartesian
  id: approach_handle_phase
  parameters:
    approach_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.08
      range:
      - 0.01
      - 0.15
      type: scalar
  subtask_id: approach_handle
  target:
    anchor: task_object
    offset:
    - -0.4
    - -0.02
    - 0.45
    orientation:
      mode: keep_current
    tolerance: 0.03
  termination: pose_tolerance
  type: approach
- control: force_threshold_switch
  generator: linear_cartesian
  id: contact_handle_phase
  parameters:
    contact_force_threshold:
      binds_to:
      - mode: replace
        path: termination.force_threshold
      default: 20.0
      range:
      - 10.0
      - 30.0
      type: scalar
  retries:
    max_attempts: 1
    offset:
    - 0.0
    - 0.0
    - 0.0
    strategy: offset_target
  subtask_id: approach_handle
  target:
    anchor: task_object
    offset:
    - -0.4
    - -0.02
    - 0.35
    orientation:
      mode: keep_current
  termination: force_exceeded
  type: contact
- control: impedance_control
  generator: linear_cartesian
  id: push_door_phase
  parameters:
    push_distance:
      binds_to:
      - mode: replace
        path: target.offset_along_axis.distance
      default: 0.15
      range:
      - 0.05
      - 0.25
      type: scalar
    push_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.04
      range:
      - 0.01
      - 0.1
      type: scalar
  subtask_id: achieve_angle
  target:
    anchor: task_object
    offset:
    - -0.4
    - -0.02
    - 0.35
    offset_along_axis:
      axis: task_goal_direction
      distance: 0.15
      mode: replace_offset_projection
      sign: positive
    orientation:
      mode: keep_current
  termination: time_limit
  type: push
skill: door_push
skill_type: arm_gripper
subtasks:
- anchor: object
  id: approach_handle
  metric: distance
  offset:
  - -0.4
  - -0.02
  - 0.45
  target_entity: tcp
  weight: 0.3
- anchor: goal
  id: achieve_angle
  metric: hinge_angle
  target_entity: hinge
  weight: 0.7
