dsl_version: 2
phases:
- control: position_control
  generator: arc_cartesian
  id: approach_above_behind
  parameters:
    approach_height:
      binds_to:
      - mode: replace
        path: target.offset.z
      default: 0.05
      range:
      - 0.02
      - 0.1
      type: scalar
    approach_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.15
      range:
      - 0.05
      - 0.3
      type: scalar
    lateral_behind_distance:
      binds_to:
      - mode: replace
        path: target.offset_along_axis.distance
      default: -0.03
      range:
      - -0.05
      - -0.01
      type: scalar
  subtask_id: approach_tcp
  target:
    anchor: task_object
    offset:
    - 0.0
    - 0.0
    - 0.05
    offset_along_axis:
      axis: task_goal_direction
      distance: -0.03
      mode: replace_offset_projection
      sign: positive
    source: yaml
  termination: pose_tolerance
  type: approach
- control: position_control
  generator: linear_cartesian
  id: descend_to_contact_side
  parameters:
    descend_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.1
      range:
      - 0.05
      - 0.3
      type: scalar
    lateral_behind_distance:
      binds_to:
      - mode: replace
        path: target.offset_along_axis.distance
      default: -0.03
      range:
      - -0.05
      - -0.01
      type: scalar
  subtask_id: approach_tcp
  target:
    anchor: task_object
    offset:
    - 0.0
    - 0.0
    - 0.0
    offset_along_axis:
      axis: task_goal_direction
      distance: -0.03
      mode: replace_offset_projection
      sign: positive
    source: yaml
  termination: pose_tolerance
  type: descend
- control: position_control
  generator: linear_cartesian
  id: push_to_goal
  parameters:
    push_distance:
      binds_to:
      - mode: replace
        path: target.offset_along_axis.distance
      default: 0.3
      range:
      - 0.2
      - 0.5
      type: scalar
    push_pose_tolerance:
      binds_to:
      - mode: replace
        path: termination.pose_tolerance
      default: 0.03
      range:
      - 0.01
      - 0.05
      type: scalar
    push_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.15
      range:
      - 0.05
      - 0.3
      type: scalar
  subtask_id: push_goal
  target:
    anchor: current_tcp
    offset:
    - 0.0
    - 0.0
    - 0.0
    offset_along_axis:
      axis: task_goal_direction
      distance: 0.3
      mode: add_to_offset
      sign: positive
    source: yaml
  termination: pose_tolerance
  type: push
skill: push_to_goal
subtasks:
- anchor: object
  id: approach_tcp
  metric: distance
  offset:
  - 0.0
  - 0.0
  - 0.05
  target_entity: tcp
  weight: 0.3
- anchor: goal
  id: push_goal
  metric: distance
  target_entity: object
  weight: 0.7
