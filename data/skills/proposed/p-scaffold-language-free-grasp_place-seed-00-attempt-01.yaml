dsl_version: 2
phases:
- control: position_control
  generator: arc_cartesian
  id: approach_1
  orientation:
    mode: keep_current
  parameters:
    approach_arc_height:
      binds_to:
      - mode: replace
        path: generator.arc_height
      default: 0.05
      range:
      - 0.02
      - 0.15
      type: scalar
    approach_height:
      binds_to:
      - mode: replace
        path: target.offset.z
      default: 0.15
      range:
      - 0.05
      - 0.3
      type: scalar
    approach_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.1
      range:
      - 0.05
      - 0.5
      type: scalar
  subtask_id: reach_object
  target:
    anchor: task_object
    offset:
    - 0.0
    - 0.0
    - 0.15
    source: yaml
  termination: pose_tolerance
  type: approach
- control: position_control
  generator: linear_cartesian
  id: descend_1
  orientation:
    mode: keep_current
  parameters:
    descend_offset:
      binds_to:
      - mode: replace
        path: target.offset.z
      default: 0.02
      range:
      - 0.0
      - 0.05
      type: scalar
    descend_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.1
      range:
      - 0.05
      - 0.5
      type: scalar
  subtask_id: reach_object
  target:
    anchor: task_object
    offset:
    - 0.0
    - 0.0
    - 0.02
    source: yaml
  termination: pose_tolerance
  type: descend
- control: position_control
  end_effector_action: force_grasp
  id: grasp_1
  orientation:
    mode: keep_current
  parameters:
    grip_force:
      default: 20.0
      range:
      - 5.0
      - 30.0
      type: scalar
  subtask_id: reach_object
  target:
    anchor: task_object
    offset:
    - 0.0
    - 0.0
    - 0.0
    source: yaml
  termination: grasp_success
  type: grasp
- control: position_control
  generator: linear_cartesian
  id: lift_1
  orientation:
    mode: keep_current
  parameters:
    lift_height:
      binds_to:
      - mode: replace
        path: target.offset.z
      default: 0.15
      range:
      - 0.05
      - 0.3
      type: scalar
  subtask_id: lift_object
  target:
    anchor: task_object
    offset:
    - 0.0
    - 0.0
    - 0.15
    source: yaml
  termination: pose_tolerance
  type: lift
- control: position_control
  generator: linear_cartesian
  id: transport_1
  orientation:
    mode: keep_current
  parameters:
    transport_height:
      binds_to:
      - mode: replace
        path: target.offset.z
      default: 0.2
      range:
      - 0.05
      - 0.3
      type: scalar
    transport_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.15
      range:
      - 0.05
      - 0.5
      type: scalar
  subtask_id: reach_goal
  target:
    anchor: task_goal
    offset:
    - 0.0
    - 0.0
    - 0.2
    source: yaml
  termination: pose_tolerance
  type: approach
- control: position_control
  generator: linear_cartesian
  id: descend_2
  orientation:
    mode: keep_current
  parameters:
    descend2_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.1
      range:
      - 0.05
      - 0.5
      type: scalar
  subtask_id: place_goal
  target:
    anchor: task_goal
    offset:
    - 0.0
    - 0.0
    - 0.0
    source: yaml
  termination: pose_tolerance
  type: descend
- control: position_control
  end_effector_action: open
  id: release_1
  orientation:
    mode: keep_current
  subtask_id: place_goal
  target:
    anchor: task_goal
    offset:
    - 0.0
    - 0.0
    - 0.0
    source: yaml
  termination: pose_tolerance
  type: release
skill: grasp_place
skill_type: arm_gripper
subtasks:
- anchor: object
  id: reach_object
  offset:
  - 0.0
  - 0.0
  - 0.05
  target_entity: tcp
  weight: 0.3
- anchor: object
  id: lift_object
  offset:
  - 0.0
  - 0.0
  - 0.15
  target_entity: object
  weight: 0.2
- anchor: goal
  id: reach_goal
  offset:
  - 0.0
  - 0.0
  - 0.1
  target_entity: tcp
  weight: 0.3
- anchor: goal
  id: place_goal
  offset:
  - 0.0
  - 0.0
  - 0.0
  target_entity: object
  weight: 0.2
