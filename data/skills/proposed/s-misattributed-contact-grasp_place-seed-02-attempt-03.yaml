dsl_version: 2
phases:
- control: position_control
  generator: linear_cartesian
  guards: []
  id: approach_1
  parameters:
    approach_height:
      binds_to:
      - mode: replace
        path: target.offset.z
      default: 0.15
      range:
      - 0.1
      - 0.2
      type: scalar
    speed:
      binds_to:
      - mode: scale
        path: generator.speed
      default: 0.5
      range:
      - 0.3
      - 1.0
      type: scalar
  retries:
    max_attempts: 0
    strategy: repeat
  subtask_id: reach_object
  target:
    anchor: task_object
    entity: grasp_target
    offset:
    - 0.0
    - 0.0
    - 0.15
    orientation:
      align_with: world_z
      axis:
      - 0.0
      - 0.0
      - 1.0
      mode: align_axis
      tolerance: 0.05
    source: yaml
  termination: pose_tolerance
  type: approach
- control: impedance_control
  generator: linear_cartesian
  guards: []
  id: descend_1
  parameters:
    descend_z:
      binds_to:
      - mode: replace
        path: target.offset.z
      default: 0.02
      range:
      - 0.01
      - 0.05
      type: scalar
    speed:
      binds_to:
      - mode: scale
        path: generator.speed
      default: 0.2
      range:
      - 0.1
      - 0.5
      type: scalar
  retries:
    max_attempts: 0
    strategy: repeat
  subtask_id: grasp_object
  target:
    anchor: task_object
    entity: grasp_target
    offset:
    - 0.0
    - 0.0
    - 0.02
    orientation:
      mode: keep_current
    source: yaml
  termination: contact_detected
  type: descend
- end_effector_action: force_grasp
  generator: null
  guards:
  - args: {}
    id: check_grasp
    on_failure: retry
    predicate: bilateral_grasp
    threshold: 1.0
    when: after_phase
  id: grasp_1
  orientation: null
  retries:
    max_attempts: 2
    strategy: reduce_speed
  target:
    anchor: current_tcp
    offset:
    - 0.0
    - 0.0
    - 0.0
    orientation:
      mode: keep_current
    source: yaml
  termination: grasp_success
  type: grasp
- control: position_control
  generator: linear_cartesian
  guards: []
  id: lift_1
  parameters:
    lift_height:
      binds_to:
      - mode: replace
        path: target.offset_along_axis.distance
      default: 0.15
      range:
      - 0.1
      - 0.2
      type: scalar
    speed:
      binds_to:
      - mode: scale
        path: generator.speed
      default: 0.5
      range:
      - 0.3
      - 1.0
      type: scalar
  retries:
    max_attempts: 0
    strategy: repeat
  subtask_id: place_at_goal
  target:
    anchor: current_tcp
    offset:
    - 0.0
    - 0.0
    - 0.0
    offset_along_axis:
      axis: world_z
      distance: 0.15
      mode: replace_offset_projection
      sign: positive
    orientation:
      mode: keep_current
    source: yaml
  termination: pose_tolerance
  type: lift
- control: position_control
  generator: linear_cartesian
  guards: []
  id: transport_1
  parameters:
    approach_height_2:
      binds_to:
      - mode: replace
        path: target.offset.z
      default: 0.15
      range:
      - 0.1
      - 0.2
      type: scalar
    speed:
      binds_to:
      - mode: scale
        path: generator.speed
      default: 0.5
      range:
      - 0.3
      - 1.0
      type: scalar
  retries:
    max_attempts: 0
    strategy: repeat
  subtask_id: place_at_goal
  target:
    anchor: task_goal
    entity: place_target
    offset:
    - 0.0
    - 0.0
    - 0.15
    orientation:
      mode: keep_current
    source: yaml
  termination: pose_tolerance
  type: approach
- control: impedance_control
  generator: linear_cartesian
  guards: []
  id: descend_2
  parameters:
    descend_z_2:
      binds_to:
      - mode: replace
        path: target.offset.z
      default: 0.02
      range:
      - 0.01
      - 0.05
      type: scalar
    speed:
      binds_to:
      - mode: scale
        path: generator.speed
      default: 0.2
      range:
      - 0.1
      - 0.5
      type: scalar
  retries:
    max_attempts: 0
    strategy: repeat
  subtask_id: place_at_goal
  target:
    anchor: task_goal
    entity: place_target
    offset:
    - 0.0
    - 0.0
    - 0.02
    orientation:
      mode: keep_current
    source: yaml
  termination: contact_detected
  type: descend
- end_effector_action: open
  generator: null
  guards: []
  id: release_1
  retries:
    max_attempts: 0
    strategy: repeat
  target:
    anchor: current_tcp
    offset:
    - 0.0
    - 0.0
    - 0.0
    orientation:
      mode: keep_current
    source: yaml
  termination: pose_tolerance
  type: release
- control: position_control
  generator: linear_cartesian
  guards: []
  id: retract_1
  parameters:
    speed:
      binds_to:
      - mode: scale
        path: generator.speed
      default: 0.5
      range:
      - 0.3
      - 1.0
      type: scalar
  retries:
    max_attempts: 0
    strategy: repeat
  target:
    anchor: task_goal
    entity: place_target
    offset:
    - 0.0
    - 0.0
    - 0.15
    orientation:
      mode: keep_current
    source: yaml
  termination: pose_tolerance
  type: retract
skill: grasp_place
subtasks:
- anchor: object
  id: reach_object
  metric: distance
  offset:
  - 0.0
  - 0.0
  - 0.15
  target_entity: tcp
  weight: 0.3
- anchor: object
  id: grasp_object
  metric: distance
  offset:
  - 0.0
  - 0.0
  - 0.02
  target_entity: tcp
  weight: 0.3
- anchor: goal
  id: place_at_goal
  metric: distance
  offset:
  - 0.0
  - 0.0
  - 0.0
  target_entity: tcp
  weight: 0.4
