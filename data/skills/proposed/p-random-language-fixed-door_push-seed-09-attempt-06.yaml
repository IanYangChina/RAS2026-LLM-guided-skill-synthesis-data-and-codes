dsl_version: 2
phases:
- control: position_control
  generator: linear_cartesian
  id: approach_1
  retries:
    max_attempts: 0
    strategy: repeat
  target:
    anchor: fixture
    entity: door_panel
    offset:
    - -0.38
    - 0.01
    - 0.45
    orientation:
      mode: keep_current
    source: yaml
  termination: pose_tolerance
  type: approach
- control: position_control
  generator: linear_cartesian
  id: descend_1
  retries:
    max_attempts: 0
    strategy: repeat
  target:
    anchor: fixture
    entity: door_panel
    offset:
    - -0.38
    - 0.01
    - 0.35
    orientation:
      mode: keep_current
    source: yaml
  termination: pose_tolerance
  type: descend
- control: admittance_control
  generator: linear_cartesian
  guards:
  - id: force_limit_guard
    on_failure: continue
    predicate: force_below
    threshold: 30.0
    when: during_phase
  - args: {}
    id: hinge_delta_reached_guard
    on_failure: continue
    predicate: hinge_delta_reached
    threshold: 0.524
    when: during_phase
  id: push_open
  parameters:
    push_distance:
      binds_to:
      - mode: replace
        path: target.offset_along_axis.distance
      default: 0.2
      range:
      - 0.1
      - 0.5
      type: scalar
    push_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.05
      range:
      - 0.01
      - 0.15
      type: scalar
  retries:
    max_attempts: 1
    offset:
    - 0.0
    - 0.0
    - 0.0
    strategy: reduce_speed
  target:
    anchor: current_tcp
    offset:
    - 0.0
    - 0.0
    - 0.0
    offset_along_axis:
      axis: world_y
      distance: 0.2
      mode: add_to_offset
      sign: negative
    orientation:
      mode: keep_current
    source: yaml
  termination: time_limit
  type: push
skill: door_push
