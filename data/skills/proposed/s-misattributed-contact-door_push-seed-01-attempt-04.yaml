dsl_version: 2
phases:
- control: position_control
  generator: arc_cartesian
  id: approach_handle
  parameters:
    approach_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.1
      range:
      - 0.01
      - 0.2
      type: scalar
    arc_height:
      binds_to:
      - mode: replace
        path: generator.arc_height
      default: 0.12
      range:
      - 0.05
      - 0.2
      type: scalar
  subtask_id: approach_sub
  target:
    anchor: fixture
    entity: door_panel
    offset:
    - -0.4
    - -0.02
    - 0.45
    orientation:
      mode: none
    source: yaml
    tolerance: 0.02
  termination: pose_tolerance
  type: approach
- control: impedance_control
  generator: linear_cartesian
  id: descend_to_handle
  parameters:
    descend_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.05
      range:
      - 0.005
      - 0.1
      type: scalar
  subtask_id: contact_sub
  target:
    anchor: fixture
    entity: door_panel
    offset:
    - -0.4
    - -0.02
    - 0.34
    orientation:
      mode: keep_current
    source: yaml
    tolerance: 0.025
  termination: pose_tolerance
  type: descend
- control: impedance_control
  generator: linear_cartesian
  guards:
  - id: contact_guard
    on_failure: retry
    predicate: contact_detected
    threshold: 1.0
    when: during_phase
  - args: {}
    id: success_guard
    on_failure: continue
    predicate: hinge_delta_reached
    threshold: 0.524
    when: during_phase
  id: push_door
  parameters:
    contact_retry_y_offset:
      binds_to:
      - mode: replace
        path: retry.offset.y
      default: 0.01
      range:
      - 0.0
      - 0.03
      type: scalar
    contact_retry_z_offset:
      binds_to:
      - mode: replace
        path: retry.offset.z
      default: -0.01
      range:
      - -0.02
      - 0.0
      type: scalar
    push_distance:
      binds_to:
      - mode: replace
        path: target.offset_along_axis.distance
      default: 0.4
      range:
      - 0.15
      - 0.7
      type: scalar
    push_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.15
      range:
      - 0.02
      - 0.3
      type: scalar
  retries:
    max_attempts: 2
    offset:
    - 0.0
    - 0.01
    - -0.01
    strategy: offset_target
  subtask_id: push_sub
  target:
    anchor: current_tcp
    offset:
    - 0.0
    - 0.0
    - 0.0
    offset_along_axis:
      axis: world_y
      distance: 0.4
      mode: add_to_offset
      sign: positive
    orientation:
      mode: keep_current
    source: yaml
  termination: time_limit
  type: push
skill: door_push
subtasks:
- anchor: fixture
  id: approach_sub
  offset:
  - -0.4
  - -0.02
  - 0.45
  weight: 0.2
- anchor: fixture
  id: contact_sub
  offset:
  - -0.4
  - -0.02
  - 0.34
  weight: 0.3
- anchor: fixture
  id: push_sub
  metric: hinge_angle
  target_entity: hinge
  weight: 0.5
