dsl_version: 2
phases:
- control: position_control
  generator: linear_cartesian
  id: align_high
  parameters:
    align_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.12
      range:
      - 0.05
      - 0.2
      type: scalar
  subtask_id: approach
  target:
    anchor: task_goal
    offset:
    - 0.0
    - 0.2
    - 0.15
    orientation:
      mode: keep_current
    source: yaml
    tolerance: 0.01
  termination: pose_tolerance
  type: align
- control: position_control
  generator: linear_cartesian
  id: descend_vertical
  parameters:
    descend_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.05
      range:
      - 0.02
      - 0.1
      type: scalar
  subtask_id: approach
  target:
    anchor: task_goal
    offset:
    - 0.0
    - 0.18
    - 0.02
    orientation:
      mode: keep_current
    source: yaml
    tolerance: 0.005
  termination: pose_tolerance
  type: approach
- control: force_threshold_switch
  generator: linear_cartesian
  id: contact_initial
  parameters:
    contact_force_threshold:
      binds_to:
      - mode: replace
        path: termination.force_threshold
      default: 6.0
      range:
      - 2.0
      - 20.0
      type: scalar
    contact_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.015
      range:
      - 0.005
      - 0.04
      type: scalar
  subtask_id: contact
  target:
    anchor: task_goal
    offset:
    - 0.0
    - 0.165
    - 0.0
    orientation:
      mode: keep_current
    source: yaml
    tolerance: 0.005
  termination: force_exceeded
  type: contact
- control: impedance_control
  generator: impedance_motion
  guards:
  - id: push_force_guard
    on_failure: abort
    predicate: force_below
    threshold: 40.0
    when: during_phase
  id: push_through_channel
  parameters:
    push_distance:
      binds_to:
      - mode: replace
        path: target.offset_along_axis.distance
      default: 0.16
      range:
      - 0.08
      - 0.2
      type: scalar
    push_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.03
      range:
      - 0.01
      - 0.08
      type: scalar
    push_tolerance:
      binds_to:
      - mode: replace
        path: termination.pose_tolerance
      default: 0.03
      range:
      - 0.01
      - 0.04
      type: scalar
  retries:
    max_attempts: 2
    offset:
    - 0.0
    - 0.0
    - 0.0
    strategy: reduce_speed
  subtask_id: push
  target:
    anchor: task_goal
    offset:
    - 0.0
    - 0.0
    - 0.0
    offset_along_axis:
      axis: channel_axis
      distance: 0.16
      mode: add_to_offset
      sign: positive
    orientation:
      align_with: channel_axis
      axis:
      - 0.0
      - 1.0
      - 0.0
      mode: align_axis
      tolerance: 0.1
    source: yaml
    tolerance: 0.02
  termination: pose_tolerance
  type: push
- control: position_control
  generator: arc_cartesian
  id: retract_final
  parameters:
    retract_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.12
      range:
      - 0.05
      - 0.2
      type: scalar
  target:
    anchor: current_tcp
    offset:
    - 0.0
    - 0.0
    - 0.15
    orientation:
      mode: none
    source: yaml
    tolerance: 0.01
  termination: pose_tolerance
  type: retract
skill: peg_channel
subtasks:
- anchor: object
  id: approach
  offset:
  - 0.0
  - 0.04
  - 0.0
- anchor: object
  id: contact
  offset:
  - 0.0
  - 0.02
  - 0.0
- anchor: world
  id: push
  offset:
  - 0.5
  - -0.08
  - 0.04
