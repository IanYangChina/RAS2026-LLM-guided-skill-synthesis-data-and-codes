dsl_version: 2
phases:
- control: position_control
  generator: linear_cartesian
  id: approach_object
  parameters:
    approach_height:
      binds_to:
      - mode: replace
        path: target.offset.z
      default: 0.1
      range:
      - 0.05
      - 0.2
      type: scalar
  subtask_id: approach_object
  target:
    anchor: task_object
    entity: null
    offset:
    - 0
    - 0
    - 0.1
    orientation:
      mode: none
    source: yaml
  termination: pose_tolerance
  type: approach
- control: force_threshold_switch
  generator: linear_cartesian
  id: descend_to_grasp
  parameters:
    descend_depth:
      binds_to:
      - mode: replace
        path: target.offset.z
      default: 0.01
      range:
      - 0.0
      - 0.05
      type: scalar
    force_threshold:
      binds_to:
      - mode: replace
        path: termination.force_threshold
      default: 3.0
      range:
      - 1.0
      - 10.0
      type: scalar
  subtask_id: grasp_object
  target:
    anchor: task_object
    entity: null
    offset:
    - 0
    - 0
    - -0.01
    orientation:
      mode: none
    source: yaml
  termination: force_exceeded
  type: descend
- control: null
  end_effector_action: force_grasp
  generator: null
  guards:
  - args: {}
    id: check_grasp
    on_failure: retry
    predicate: gripper_closed
    threshold: 0.01
    when: after_phase
  id: grasp_object
  retries:
    max_attempts: 2
    strategy: repeat
  subtask_id: grasp_object
  target:
    anchor: current_tcp
    entity: null
    offset:
    - 0
    - 0
    - 0
    orientation:
      mode: none
    source: yaml
  termination: grasp_success
  type: grasp
- control: position_control
  generator: linear_cartesian
  id: lift_object
  parameters:
    lift_height:
      binds_to:
      - mode: replace
        path: target.offset.z
      default: 0.08
      range:
      - 0.05
      - 0.15
      type: scalar
  subtask_id: lift_object
  target:
    anchor: task_object
    entity: null
    offset:
    - 0
    - 0
    - 0.08
    orientation:
      mode: none
    source: yaml
  termination: pose_tolerance
  type: lift
- control: position_control
  generator: linear_cartesian
  id: transport_to_goal
  parameters:
    transport_z_offset:
      binds_to:
      - mode: replace
        path: target.offset.z
      default: 0.02
      range:
      - 0.0
      - 0.1
      type: scalar
  subtask_id: place_at_goal
  target:
    anchor: task_goal
    entity: null
    offset:
    - 0
    - 0
    - 0.02
    orientation:
      mode: none
    source: yaml
  termination: pose_tolerance
  type: approach
- control: null
  end_effector_action: open
  generator: null
  id: release_object
  parameters:
    release_duration:
      binds_to:
      - mode: replace
        path: termination.max_time
      default: 1.0
      range:
      - 0.5
      - 2.0
      type: scalar
  target:
    anchor: current_tcp
    entity: null
    offset:
    - 0
    - 0
    - 0
    orientation:
      mode: none
    source: yaml
  termination: time_limit
  type: release
- control: position_control
  generator: linear_cartesian
  id: retract_from_goal
  parameters:
    retract_height:
      binds_to:
      - mode: replace
        path: target.offset.z
      default: 0.1
      range:
      - 0.05
      - 0.2
      type: scalar
  target:
    anchor: task_goal
    entity: null
    offset:
    - 0
    - 0
    - 0.1
    orientation:
      mode: none
    source: yaml
  termination: pose_tolerance
  type: retract
skill: grasp_place
subtasks:
- anchor: object
  id: approach_object
  metric: distance
  offset:
  - 0
  - 0
  - 0.1
  target_entity: tcp
  weight: 0.15
- anchor: object
  id: grasp_object
  metric: distance
  offset:
  - 0
  - 0
  - 0.0
  target_entity: tcp
  weight: 0.15
- anchor: object
  id: lift_object
  metric: distance
  offset:
  - 0
  - 0
  - 0.08
  target_entity: object
  weight: 0.2
- anchor: goal
  id: place_at_goal
  metric: distance
  offset:
  - 0
  - 0
  - 0.0
  target_entity: object
  weight: 0.5
