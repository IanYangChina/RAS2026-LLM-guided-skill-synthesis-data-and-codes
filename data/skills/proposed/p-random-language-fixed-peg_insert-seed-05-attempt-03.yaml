dsl_version: 2
phases:
- control: position_control
  generator: linear_cartesian
  guards:
  - args: {}
    id: approach_contact
    on_failure: abort
    predicate: contact_detected
    threshold: 1
    when: during_phase
  id: approach
  parameters:
    approach_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.1
      range:
      - 0.02
      - 0.2
      type: scalar
  subtask_id: approach
  target:
    anchor: fixture
    entity: peg_socket
    offset:
    - 0
    - 0
    - 0.12
    orientation:
      mode: keep_current
    source: yaml
  termination: pose_tolerance
  type: approach
- control: position_control
  generator: linear_cartesian
  guards:
  - args: {}
    id: align_contact
    on_failure: abort
    predicate: contact_detected
    threshold: 1
    when: during_phase
  id: align
  parameters:
    align_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.08
      range:
      - 0.02
      - 0.15
      type: scalar
  subtask_id: align
  target:
    anchor: fixture
    entity: peg_socket
    offset:
    - 0
    - 0
    - 0.09
    orientation:
      align_with: insertion_axis
      axis:
      - 0
      - 0
      - 1
      mode: align_axis
      tolerance: 0.05
    source: yaml
  termination: pose_tolerance
  type: align
- control: force_threshold_switch
  generator: linear_cartesian
  guards:
  - args: {}
    id: descend_force
    on_failure: abort
    predicate: force_below
    threshold: 40
    when: during_phase
  id: descend
  parameters:
    contact_force_threshold:
      binds_to:
      - mode: replace
        path: termination.force_threshold
      default: 15
      range:
      - 5
      - 30
      type: scalar
    descend_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.05
      range:
      - 0.01
      - 0.1
      type: scalar
  subtask_id: contact
  target:
    anchor: fixture
    entity: peg_socket
    offset:
    - 0
    - 0
    - 0.07
    offset_along_axis:
      axis: insertion_axis
      distance: 0.04
      mode: add_to_offset
      sign: positive
    orientation:
      mode: keep_current
    source: yaml
  termination: force_exceeded
  type: contact
- control: impedance_control
  generator: linear_cartesian
  guards:
  - args: {}
    id: insert_force_guard
    on_failure: abort
    predicate: force_below
    threshold: 40
    when: during_phase
  id: insert
  parameters:
    insert_depth:
      binds_to:
      - mode: replace
        path: target.offset_along_axis.distance
      default: 0.05
      range:
      - 0.02
      - 0.08
      type: scalar
    insert_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.04
      range:
      - 0.01
      - 0.08
      type: scalar
    max_insert_time:
      binds_to:
      - mode: replace
        path: termination.max_time
      default: 3
      range:
      - 1
      - 5
      type: scalar
  retries:
    max_attempts: 2
    offset:
    - 0.005
    - 0.005
    - 0
    strategy: offset_target
  subtask_id: insert
  target:
    anchor: fixture
    entity: peg_socket
    offset:
    - 0
    - 0
    - 0.06
    offset_along_axis:
      axis: insertion_axis
      distance: 0.06
      mode: add_to_offset
      sign: positive
    orientation:
      mode: keep_current
    source: yaml
  termination: time_limit
  type: insert
- control: position_control
  generator: linear_cartesian
  guards:
  - args: {}
    id: retract_contact
    on_failure: continue
    predicate: contact_detected
    threshold: 1
    when: during_phase
  id: retract
  parameters:
    retract_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.1
      range:
      - 0.02
      - 0.2
      type: scalar
  target:
    anchor: current_tcp
    offset:
    - 0
    - 0
    - 0.15
    orientation:
      mode: keep_current
    source: yaml
  termination: pose_tolerance
  type: retract
skill: peg_insert
skill_type: arm
subtasks:
- anchor: object
  id: approach
  metric: distance
  offset:
  - 0
  - 0
  - 0.12
  target_entity: tcp
  weight: 1.0
- anchor: object
  id: align
  metric: distance
  offset:
  - 0
  - 0
  - 0.09
  target_entity: tcp
  weight: 1.0
- anchor: object
  id: contact
  metric: distance
  offset:
  - 0
  - 0
  - 0.07
  target_entity: tcp
  weight: 1.0
- anchor: object
  id: insert
  metric: distance
  offset:
  - 0
  - 0
  - 0.06
  target_entity: tcp
  weight: 1.0
