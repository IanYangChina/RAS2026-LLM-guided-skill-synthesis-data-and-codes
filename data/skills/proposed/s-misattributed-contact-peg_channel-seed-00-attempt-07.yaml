dsl_version: 2
phases:
- control: position_control
  generator: linear_cartesian
  guards: []
  id: approach_to_peg
  orientation:
    mode: none
  parameters:
    approach_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.1
      range:
      - 0.05
      - 0.2
      type: scalar
  retries:
    max_attempts: 0
  subtask_id: reach_approach
  target:
    anchor: task_object
    offset:
    - 0.0
    - 0.0
    - 0.1
    source: yaml
    tolerance: 0.02
  termination: pose_tolerance
  type: approach
- control: force_threshold_switch
  generator: linear_cartesian
  guards:
  - args: {}
    id: contact_check
    on_failure: retry
    predicate: contact_detected
    threshold: 1.0
    when: during_phase
  id: descend_to_contact
  orientation:
    mode: none
  parameters:
    descend_force_threshold:
      binds_to:
      - mode: replace
        path: termination.force_threshold
      default: 10.0
      range:
      - 5.0
      - 20.0
      type: scalar
    descend_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.02
      range:
      - 0.01
      - 0.05
      type: scalar
  retries:
    max_attempts: 2
    offset:
    - 0.005
    - 0.0
    - 0.0
    strategy: offset_target
  subtask_id: reach_contact
  target:
    anchor: task_object
    offset:
    - 0.0
    - 0.0
    - 0.02
    source: yaml
    tolerance: 0.01
  termination: force_exceeded
  type: descend
- control: impedance_control
  generator: linear_cartesian
  guards:
  - args: {}
    id: force_limit
    on_failure: abort
    predicate: force_below
    threshold: 30.0
    when: during_phase
  id: push_along_channel
  orientation:
    align_with: channel_axis
    axis:
    - 0.0
    - 0.0
    - 1.0
    mode: align_axis
    tolerance: 0.1
  parameters:
    push_distance:
      binds_to:
      - mode: replace
        path: target.offset_along_axis.distance
      default: 0.15
      range:
      - 0.1
      - 0.18
      type: scalar
    push_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.05
      range:
      - 0.01
      - 0.1
      type: scalar
  retries:
    max_attempts: 1
    offset:
    - 0.0
    - 0.0
    - 0.0
    strategy: reduce_speed
  subtask_id: push_progress
  target:
    anchor: task_object
    offset:
    - 0.0
    - 0.0
    - 0.0
    offset_along_axis:
      axis: task_goal_direction
      distance: 0.15
      mode: replace_offset_projection
      sign: positive
    source: yaml
    tolerance: 0.02
  termination: pose_tolerance
  type: push
- control: position_control
  generator: linear_cartesian
  guards: []
  id: retract_from_channel
  orientation:
    mode: none
  parameters:
    retract_height:
      binds_to:
      - mode: replace
        path: target.offset.z
      default: 0.1
      range:
      - 0.05
      - 0.2
      type: scalar
    retract_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.1
      range:
      - 0.05
      - 0.2
      type: scalar
  retries:
    max_attempts: 0
  target:
    anchor: current_tcp
    offset:
    - 0.0
    - 0.0
    - 0.1
    source: yaml
    tolerance: 0.02
  termination: pose_tolerance
  type: retract
skill: peg_channel
skill_type: arm
subtasks:
- anchor: object
  id: reach_approach
  metric: distance
  offset:
  - 0.0
  - 0.0
  - 0.1
  target_entity: tcp
  weight: 0.3
- anchor: object
  id: reach_contact
  metric: distance
  offset:
  - 0.0
  - 0.0
  - 0.0
  target_entity: tcp
  weight: 0.3
- anchor: goal
  id: push_progress
  metric: goal_progress
  offset:
  - 0.0
  - 0.0
  - 0.0
  target_entity: tcp
  weight: 0.4
