dsl_version: 2
phases:
- control: position_control
  generator: linear_cartesian
  id: approach_above_behind
  parameters:
    approach_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.05
      range:
      - 0.02
      - 0.1
      type: scalar
  subtask_id: approach_peg
  target:
    anchor: task_object
    offset:
    - 0.0
    - 0.02
    - 0.08
    orientation:
      mode: keep_current
    source: yaml
    tolerance: 0.01
  termination: pose_tolerance
  type: approach
- control: position_control
  generator: linear_cartesian
  id: descend_to_peg
  parameters:
    descend_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.015
      range:
      - 0.005
      - 0.03
      type: scalar
  target:
    anchor: task_object
    offset:
    - 0.0
    - 0.02
    - 0.045
    orientation:
      mode: keep_current
    source: yaml
    tolerance: 0.005
  termination: pose_tolerance
  type: approach
- control: impedance_control
  generator: linear_cartesian
  guards:
  - id: check_progress
    on_failure: continue
    predicate: object_progress
    threshold: 0.14
    when: during_phase
  id: push_along_channel
  parameters:
    max_push_time:
      binds_to:
      - mode: replace
        path: duration.max_time
      default: 10.0
      range:
      - 5.0
      - 20.0
      type: scalar
    push_distance:
      binds_to:
      - mode: replace
        path: target.offset_along_axis.distance
      default: 0.16
      range:
      - 0.12
      - 0.2
      type: scalar
    push_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.04
      range:
      - 0.01
      - 0.08
      type: scalar
  subtask_id: push_through
  target:
    anchor: current_tcp
    offset_along_axis:
      axis: channel_axis
      distance: 0.16
      mode: add_to_offset
      sign: positive
    orientation:
      mode: keep_current
    source: yaml
  termination: time_limit
  type: push
- control: position_control
  generator: linear_cartesian
  id: retract_up
  parameters:
    retract_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.06
      range:
      - 0.03
      - 0.12
      type: scalar
  target:
    anchor: current_tcp
    offset:
    - 0.0
    - 0.0
    - 0.1
    orientation:
      mode: keep_current
    source: yaml
    tolerance: 0.01
  termination: pose_tolerance
  type: retract
skill: peg_channel
subtasks:
- anchor: object
  id: approach_peg
  metric: distance
  offset:
  - 0.0
  - 0.02
  - 0.08
  target_entity: tcp
  weight: 0.2
- anchor: goal
  id: push_through
  metric: goal_progress
  target_entity: object
  weight: 0.8
