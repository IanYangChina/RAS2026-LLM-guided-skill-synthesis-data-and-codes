skill: grasp_place
dsl_version: 2
skill_type: arm_gripper
subtasks:
- id: reach_pregrasp
  anchor: object
  offset: [0.0, 0.0, 0.1]
  weight: 0.2
- id: grasp_contact
  anchor: object
  metric: contact
  weight: 0.3
- id: lift_clear
  anchor: object
  target_entity: object
  offset: [0.0, 0.0, 0.15]
  weight: 0.3
- id: place_goal
  anchor: goal
  target_entity: object
  weight: 0.2
phases:
- id: approach_object
  type: approach
  generator: linear_cartesian
  control: position_control
  termination: pose_tolerance
  target:
    source: yaml
    anchor: task_object
    entity: grasp_target
    offset: [0.0, 0.0, 0.1]
    tolerance: 0.03
    orientation:
      mode: none
  parameters:
    approach_z:
      type: scalar
      range: [0.08, 0.15]
      default: 0.1
      binds_to:
      - path: target.offset.z
        mode: replace
    approach_speed:
      type: scalar
      range: [0.3, 1.0]
      default: 0.6
      binds_to:
      - path: generator.speed
        mode: replace
  subtask_id: reach_pregrasp
- id: descend_to_object
  type: descend
  generator: linear_cartesian
  control: position_control
  termination: pose_tolerance
  target:
    source: yaml
    anchor: task_object
    entity: grasp_target
    offset: [0.0, 0.0, 0.05]
    tolerance: 0.02
    orientation:
      mode: align_axis
      axis: [0.0, 0.0, 1.0]
      align_with: world_z
      tolerance: 0.1
  parameters:
    hover_z:
      type: scalar
      range: [0.03, 0.07]
      default: 0.05
      binds_to:
      - path: target.offset.z
        mode: replace
    descend_speed:
      type: scalar
      range: [0.2, 0.6]
      default: 0.4
      binds_to:
      - path: generator.speed
        mode: replace
  subtask_id: reach_pregrasp
- id: touch_object_top
  type: contact
  generator: linear_cartesian
  control: force_threshold_switch
  termination: force_exceeded
  target:
    source: yaml
    anchor: task_object
    entity: grasp_target
    offset: [0.0, 0.0, 0.0]
    orientation:
      mode: align_axis
      axis: [0.0, 0.0, 1.0]
      align_with: world_z
      tolerance: 0.1
  parameters:
    contact_force:
      type: scalar
      range: [3.0, 10.0]
      default: 6.0
      binds_to:
      - path: termination.force_threshold
        mode: replace
  guards:
  - id: check_contact
    when: during_phase
    predicate: contact_detected
    threshold: 0.5
    on_failure: continue
  subtask_id: grasp_contact
- id: grasp_object
  type: grasp
  generator: null
  control: position_control
  termination: grasp_success
  end_effector_action: force_grasp
  target:
    source: yaml
    anchor: current_tcp
    offset: [0.0, 0.0, 0.0]
    orientation:
      mode: keep_current
  guards:
  - id: check_grasp
    when: after_phase
    predicate: bilateral_grasp
    threshold: 0.5
    on_failure: retry
  retries:
    max_attempts: 2
    strategy: repeat
  subtask_id: grasp_contact
- id: lift_object
  type: lift
  generator: linear_cartesian
  control: position_control
  termination: pose_tolerance
  target:
    source: yaml
    anchor: task_object
    entity: grasp_target
    offset: [0.0, 0.0, 0.15]
    tolerance: 0.015
    orientation:
      mode: align_axis
      axis: [0.0, 0.0, 1.0]
      align_with: world_z
      tolerance: 0.1
  parameters:
    lift_height:
      type: scalar
      range: [0.08, 0.2]
      default: 0.15
      binds_to:
      - path: target.offset.z
        mode: replace
    lift_speed:
      type: scalar
      range: [0.2, 0.6]
      default: 0.4
      binds_to:
      - path: generator.speed
        mode: replace
  subtask_id: lift_clear
- id: transport_to_goal
  type: approach
  generator: linear_cartesian
  control: position_control
  termination: pose_tolerance
  target:
    source: yaml
    anchor: task_goal
    entity: grasp_target
    offset: [0.0, 0.0, 0.12]
    tolerance: 0.02
    orientation:
      mode: align_axis
      axis: [0.0, 0.0, 1.0]
      align_with: world_z
      tolerance: 0.1
  parameters:
    approach_goal_z:
      type: scalar
      range: [0.08, 0.18]
      default: 0.12
      binds_to:
      - path: target.offset.z
        mode: replace
    transport_speed:
      type: scalar
      range: [0.3, 0.8]
      default: 0.5
      binds_to:
      - path: generator.speed
        mode: replace
  subtask_id: place_goal
- id: descend_at_goal
  type: descend
  generator: linear_cartesian
  control: position_control
  termination: pose_tolerance
  target:
    source: yaml
    anchor: task_goal
    entity: grasp_target
    offset: [0.0, 0.0, 0.0]
    tolerance: 0.02
    orientation:
      mode: align_axis
      axis: [0.0, 0.0, 1.0]
      align_with: world_z
      tolerance: 0.1
  parameters:
    descend_goal_tolerance:
      type: scalar
      range: [0.005, 0.03]
      default: 0.02
      binds_to:
      - path: termination.pose_tolerance
        mode: replace
    descend_goal_speed:
      type: scalar
      range: [0.2, 0.5]
      default: 0.3
      binds_to:
      - path: generator.speed
        mode: replace
  subtask_id: place_goal
- id: release_object
  type: release
  generator: null
  control: position_control
  termination: time_limit
  end_effector_action: open
  target:
    source: yaml
    anchor: current_tcp
    offset: [0.0, 0.0, 0.0]
    orientation:
      mode: keep_current
  parameters:
    release_duration:
      type: scalar
      range: [0.5, 2.0]
      default: 1.0
      binds_to:
      - path: duration.max_time
        mode: replace
  retries:
    max_attempts: 0
    strategy: repeat
```