dsl_version: 2
phases:
- control: position_control
  generator: linear_cartesian
  id: rotate_1
  orientation:
    mode: keep_current
  parameters:
    speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.12
      range:
      - 0.05
      - 0.2
      type: scalar
  subtask_id: approach
  target:
    anchor: task_goal
    offset:
    - 0
    - 0
    - 0.04
    source: yaml
    tolerance: 0.01
  termination: pose_tolerance
  type: approach
- control: position_control
  generator: linear_cartesian
  id: retract_1
  orientation:
    mode: keep_current
  subtask_id: align
  target:
    anchor: task_goal
    offset:
    - 0
    - 0
    - 0.02
    source: yaml
    tolerance: 0.01
  termination: pose_tolerance
  type: align
- control: force_threshold_switch
  generator: linear_cartesian
  id: descend_1
  orientation:
    align_with: insertion_axis
    axis:
    - 0
    - 0
    - 1
    mode: align_axis
    tolerance: 0.05
  parameters:
    depth:
      binds_to:
      - mode: replace
        path: target.offset.z
      default: 0.05
      range:
      - 0.01
      - 0.1
      type: scalar
    force_threshold:
      binds_to:
      - mode: replace
        path: termination.force_threshold
      default: 15.0
      range:
      - 5.0
      - 40.0
      type: scalar
  subtask_id: contact
  target:
    anchor: fixture
    entity: peg_socket
    offset:
    - 0
    - 0
    - 0.055
    source: yaml
    tolerance: 0.01
  termination: force_exceeded
  type: contact
- control: impedance_control
  generator: linear_cartesian
  guards:
  - args: {}
    id: force_limit
    on_failure: abort
    predicate: force_below
    threshold: 40.0
    when: during_phase
  id: pull_1
  orientation:
    align_with: insertion_axis
    axis:
    - 0
    - 0
    - 1
    mode: align_axis
    tolerance: 0.05
  parameters:
    duration:
      binds_to:
      - mode: replace
        path: termination.time_limit
      default: 5.0
      range:
      - 2.0
      - 10.0
      type: scalar
    pull_distance:
      binds_to:
      - mode: replace
        path: target.offset_along_axis.distance
      default: 0.04
      range:
      - 0.02
      - 0.08
      type: scalar
  subtask_id: insert
  target:
    anchor: fixture
    entity: peg_socket
    offset:
    - 0
    - 0
    - 0.025
    offset_along_axis:
      axis: insertion_axis
      distance: 0.04
      mode: add_to_offset
      sign: negative
    source: yaml
    tolerance: 0.02
  termination: time_limit
  type: insert
skill: peg_insert
