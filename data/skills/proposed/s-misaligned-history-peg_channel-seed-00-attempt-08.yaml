dsl_version: 2
phases:
- control: force_threshold_switch
  end_effector_action: null
  generator: linear_cartesian
  id: approach_and_contact
  orientation:
    mode: keep_current
  parameters:
    approach_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.05
      range:
      - 0.02
      - 0.15
      type: scalar
    contact_force:
      binds_to:
      - mode: replace
        path: termination.force_threshold
      default: 5.0
      range:
      - 2.0
      - 10.0
      type: scalar
  subtask_id: approach_target
  target:
    anchor: task_object
    entity: peg
    offset:
    - 0
    - 0
    - 0.08
    offset_along_axis: null
    orientation: null
    tolerance: 0.02
  termination: force_exceeded
- control: impedance_control
  end_effector_action: null
  generator: linear_cartesian
  id: push_along_channel
  orientation:
    mode: keep_current
  parameters:
    push_distance:
      binds_to:
      - mode: replace
        path: target.offset_along_axis.distance
      default: 0.18
      range:
      - 0.12
      - 0.24
      type: scalar
    push_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.05
      range:
      - 0.02
      - 0.1
      type: scalar
    termination_force:
      binds_to:
      - mode: replace
        path: termination.force_threshold
      default: 40.0
      range:
      - 30.0
      - 45.0
      type: scalar
  subtask_id: push_target
  target:
    anchor: task_object
    entity: peg
    offset:
    - 0
    - 0
    - 0
    offset_along_axis:
      axis: channel_axis
      distance: 0.18
      mode: add_to_offset
      sign: positive
    tolerance: 0.02
  termination: force_exceeded
skill: peg_channel
skill_type: arm
subtasks:
- anchor: object
  id: approach_target
  metric: distance
  offset:
  - 0.0
  - 0.0
  - 0.08
  target_entity: tcp
  weight: 0.3
- anchor: goal
  id: push_target
  metric: goal_progress
  target_entity: object
  weight: 0.7
