dsl_version: 2
phases:
- control: position_control
  generator: linear_cartesian
  guards: []
  id: approach_1
  parameters:
    approach_offset_along_axis:
      binds_to:
      - mode: replace
        path: target.offset_along_axis.distance
      default: 0.08
      range:
      - 0.01
      - 0.15
      type: scalar
    approach_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.2
      range:
      - 0.05
      - 0.4
      type: scalar
  retries:
    max_attempts: 1
    strategy: reduce_speed
  subtask_id: reach_contact
  target:
    anchor: task_object
    entity: push_box
    offset:
    - 0.0
    - 0.0
    - 0.09
    offset_along_axis:
      axis: task_goal_direction
      distance: 0.04
      mode: replace_offset_projection
      sign: negative
    orientation:
      mode: keep_current
    source: yaml
    tolerance: 0.01
  termination: pose_tolerance
  type: approach
- control: force_threshold_switch
  generator: linear_cartesian
  guards:
  - args: {}
    id: contact_guard
    on_failure: retry
    predicate: contact_detected
    threshold: 0.0
    when: after_phase
  id: descend_1
  parameters:
    descend_force_threshold:
      binds_to:
      - mode: replace
        path: termination.force_threshold
      default: 5.0
      range:
      - 2.0
      - 15.0
      type: scalar
    descend_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.08
      range:
      - 0.03
      - 0.2
      type: scalar
  retries:
    max_attempts: 2
    offset:
    - 0.0
    - 0.0
    - 0.005
    strategy: offset_target
  subtask_id: reach_contact
  target:
    anchor: current_tcp
    entity: null
    offset:
    - 0.0
    - 0.0
    - -0.07
    orientation:
      mode: keep_current
    source: yaml
    tolerance: 0.005
  termination: force_exceeded
  type: descend
- control: impedance_control
  generator: linear_cartesian
  guards:
  - args: {}
    id: force_guard
    on_failure: continue
    predicate: force_below
    threshold: 20.0
    when: during_phase
  - args: {}
    id: contact_guard
    on_failure: retry
    predicate: contact_detected
    threshold: 0.0
    when: before_phase
  id: push_1
  parameters:
    push_distance:
      binds_to:
      - mode: replace
        path: target.offset_along_axis.distance
      default: 0.3
      range:
      - 0.1
      - 0.5
      type: scalar
    push_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.07
      range:
      - 0.02
      - 0.2
      type: scalar
    push_tolerance:
      binds_to:
      - mode: replace
        path: termination.pose_tolerance
      default: 0.015
      range:
      - 0.005
      - 0.05
      type: scalar
  retries:
    max_attempts: 1
    offset:
    - 0.0
    - -0.005
    - 0.0
    strategy: offset_target
  subtask_id: push_to_goal
  target:
    anchor: task_object
    entity: push_box
    offset:
    - 0.0
    - 0.0
    - 0.0
    offset_along_axis:
      axis: task_goal_direction
      distance: 0.2
      mode: replace_offset_projection
      sign: positive
    orientation:
      align_with: task_goal_direction
      axis:
      - 1.0
      - 0.0
      - 0.0
      mode: align_axis
      tolerance: 0.2
    source: yaml
    tolerance: 0.015
  termination: pose_tolerance
  type: push
skill: push_to_goal
subtasks:
- anchor: object
  id: reach_contact
  metric: distance
  offset:
  - 0.0
  - 0.0
  - 0.025
  target_entity: tcp
  weight: 0.3
- anchor: goal
  id: push_to_goal
  metric: distance
  offset:
  - 0.0
  - 0.0
  - 0.0
  target_entity: tcp
  weight: 0.7
