dsl_version: 2
phases:
- control: position_control
  generator: arc_cartesian
  guards:
  - args: {}
    id: guard_approach
    on_failure: retry
    predicate: pose_within_tolerance
    threshold: 0.02
    when: after_phase
  id: approach_1
  parameters:
    speed:
      binds_to:
      - mode: add
        path: generator.speed
      default: 0.05
      range:
      - 0.01
      - 0.1
      type: scalar
  retries:
    max_attempts: 2
    offset:
    - 0.0
    - 0.0
    - 0.005
    strategy: offset_target
  subtask_id: reach_object
  target:
    anchor: task_object
    offset:
    - 0.0
    - 0.0
    - 0.12
    orientation:
      mode: keep_current
    source: yaml
  termination: pose_tolerance
  type: approach
- control: admittance_control
  generator: linear_cartesian
  guards:
  - args: {}
    id: guard_descend_contact
    on_failure: abort
    predicate: force_below
    threshold: 20.0
    when: during_phase
  id: descend_1
  parameters:
    speed:
      binds_to:
      - mode: add
        path: generator.speed
      default: 0.02
      range:
      - 0.01
      - 0.05
      type: scalar
  subtask_id: grasp_point
  target:
    anchor: task_object
    offset:
    - 0.0
    - 0.0
    - 0.03
    orientation:
      mode: keep_current
    source: yaml
  termination: pose_tolerance
  type: descend
- control: position_control
  end_effector_action: force_grasp
  guards:
  - args: {}
    id: guard_grasp
    on_failure: retry
    predicate: bilateral_grasp
    threshold: 0.5
    when: after_phase
  id: grasp_1
  parameters:
    grip_force:
      binds_to:
      - mode: replace
        path: guards.guard_grasp.threshold
      default: 20.0
      range:
      - 10.0
      - 30.0
      type: scalar
  retries:
    max_attempts: 1
    strategy: repeat
  subtask_id: grasp_point
  termination: time_limit
  type: grasp
- control: position_control
  generator: linear_cartesian
  guards:
  - args: {}
    id: guard_lift
    on_failure: retry
    predicate: object_lifted
    threshold: 0.05
    when: after_phase
  id: lift_1
  parameters:
    speed:
      binds_to:
      - mode: add
        path: generator.speed
      default: 0.05
      range:
      - 0.01
      - 0.1
      type: scalar
  retries:
    max_attempts: 2
    strategy: repeat
  subtask_id: lift_height
  target:
    anchor: task_object
    offset:
    - 0.0
    - 0.0
    - 0.15
    orientation:
      mode: keep_current
    source: yaml
  termination: pose_tolerance
  type: lift
- control: position_control
  generator: arc_cartesian
  guards:
  - args: {}
    id: guard_transport
    on_failure: retry
    predicate: pose_within_tolerance
    threshold: 0.03
    when: after_phase
  id: transport_1
  parameters:
    height:
      binds_to:
      - mode: replace
        path: generator.arc_height
      default: 0.12
      range:
      - 0.05
      - 0.2
      type: scalar
    speed:
      binds_to:
      - mode: add
        path: generator.speed
      default: 0.05
      range:
      - 0.01
      - 0.1
      type: scalar
  retries:
    max_attempts: 2
    offset:
    - 0.0
    - 0.0
    - 0.005
    strategy: offset_target
  subtask_id: transport_goal
  target:
    anchor: task_goal
    offset:
    - 0.0
    - 0.0
    - 0.15
    orientation:
      mode: keep_current
    source: yaml
  termination: pose_tolerance
  type: approach
- control: admittance_control
  generator: linear_cartesian
  guards:
  - args: {}
    id: guard_descend2_contact
    on_failure: abort
    predicate: force_below
    threshold: 20.0
    when: during_phase
  id: descend_2
  parameters:
    speed:
      binds_to:
      - mode: add
        path: generator.speed
      default: 0.02
      range:
      - 0.01
      - 0.05
      type: scalar
  subtask_id: place
  target:
    anchor: task_goal
    offset:
    - 0.0
    - 0.0
    - 0.0
    orientation:
      mode: keep_current
    source: yaml
  termination: pose_tolerance
  type: descend
- control: position_control
  end_effector_action: open
  guards:
  - args: {}
    id: guard_release
    on_failure: retry
    predicate: object_progress
    threshold: 0.02
    when: after_phase
  id: release_1
  retries:
    max_attempts: 1
    strategy: repeat
  subtask_id: place
  target:
    anchor: current_tcp
    source: yaml
  termination: time_limit
  type: release
- control: position_control
  generator: linear_cartesian
  id: retract_1
  parameters:
    speed:
      binds_to:
      - mode: add
        path: generator.speed
      default: 0.05
      range:
      - 0.01
      - 0.1
      type: scalar
  target:
    anchor: task_goal
    offset:
    - 0.0
    - 0.0
    - 0.15
    orientation:
      mode: keep_current
    source: yaml
  termination: pose_tolerance
  type: retract
skill: grasp_place
skill_type: arm_gripper
subtasks:
- anchor: object
  id: reach_object
  metric: distance
  offset:
  - 0.0
  - 0.0
  - 0.12
  target_entity: tcp
  weight: 0.15
- anchor: object
  id: grasp_point
  metric: distance
  offset:
  - 0.0
  - 0.0
  - 0.03
  target_entity: tcp
  weight: 0.1
- anchor: object
  id: lift_height
  metric: distance
  offset:
  - 0.0
  - 0.0
  - 0.15
  target_entity: tcp
  weight: 0.2
- anchor: goal
  id: transport_goal
  metric: distance
  offset:
  - 0.0
  - 0.0
  - 0.15
  target_entity: tcp
  weight: 0.2
- anchor: goal
  id: place
  metric: goal_progress
  offset:
  - 0.0
  - 0.0
  - 0.0
  target_entity: object
  weight: 0.35
