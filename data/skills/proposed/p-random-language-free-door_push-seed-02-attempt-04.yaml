dsl_version: 2
phases:
- control: position_control
  generator: arc_cartesian
  guards: []
  id: approach_handle
  parameters:
  - binds_to:
    - mode: replace
      path: generator.arc_height
    default: 0.1
    name: arc_height
    range:
    - 0.05
    - 0.2
    type: scalar
  - binds_to:
    - mode: replace
      path: generator.speed
    default: 0.05
    name: speed
    range:
    - 0.01
    - 0.1
    type: scalar
  - binds_to:
    - mode: replace
      path: termination.pose_tolerance
    default: 0.02
    name: pose_tol
    range:
    - 0.01
    - 0.05
    type: scalar
  retries:
    max_attempts: 0
  subtask_id: reach_contact
  target:
    anchor: fixture
    entity: door_panel
    offset:
    - -0.4
    - -0.02
    - 0.35
    orientation:
      mode: keep_current
    source: yaml
    tolerance: 0.02
  termination: pose_tolerance
  type: approach
- control: impedance_control
  generator: linear_cartesian
  guards:
  - args: {}
    id: push_guard
    on_failure: abort
    predicate: hinge_delta_reached
    threshold: 0.5
    when: during_phase
  id: push_door
  parameters:
  - binds_to:
    - mode: replace
      path: target.offset_along_axis.distance
    default: 0.2
    name: push_distance
    range:
    - 0.05
    - 0.3
    type: scalar
  - binds_to:
    - mode: replace
      path: generator.speed
    default: 0.05
    name: speed
    range:
    - 0.01
    - 0.1
    type: scalar
  - binds_to:
    - mode: replace
      path: duration.max_time
    default: 3.0
    name: max_time
    range:
    - 1.0
    - 5.0
    type: scalar
  - binds_to:
    - mode: replace
      path: guards.push_guard.threshold
    default: 0.5
    name: hinge_target
    range:
    - 0.3
    - 0.6
    type: scalar
  - binds_to:
    - mode: replace
      path: retry.offset.y
    default: 0.0
    name: retry_offset_y
    range:
    - -0.02
    - 0.02
    type: scalar
  - binds_to:
    - mode: replace
      path: retry.offset.z
    default: 0.0
    name: retry_offset_z
    range:
    - -0.02
    - 0.02
    type: scalar
  retries:
    max_attempts: 1
    offset:
    - 0.0
    - 0.0
    - 0.0
    strategy: offset_target
  subtask_id: open_door
  target:
    anchor: current_tcp
    offset:
    - 0
    - 0
    - 0
    offset_along_axis:
      axis: world_x
      distance: 0.2
      mode: add_to_offset
      sign: positive
    orientation:
      mode: keep_current
    source: yaml
  termination: time_limit
  type: push
skill: door_push
skill_type: arm
subtasks:
- anchor: fixture
  id: reach_contact
  metric: distance
  offset:
  - -0.4
  - -0.02
  - 0.35
  target_entity: tcp
  weight: 0.3
- anchor: fixture
  id: open_door
  metric: hinge_angle
  offset:
  - 0
  - 0
  - 0
  target_entity: hinge
  weight: 0.7
