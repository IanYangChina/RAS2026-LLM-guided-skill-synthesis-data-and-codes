dsl_version: 2
phases:
- control: position_control
  generator: linear_cartesian
  id: approach_behind
  parameters:
    approach_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.05
      range:
      - 0.01
      - 0.2
      type: scalar
    approach_tol:
      binds_to:
      - mode: replace
        path: termination.pose_tolerance
      default: 0.02
      range:
      - 0.005
      - 0.03
      type: scalar
  subtask_id: approach_obj
  target:
    anchor: task_object
    offset:
    - 0.0
    - -0.08
    - 0.1
    orientation:
      mode: keep_current
    tolerance: 0.02
  termination: pose_tolerance
  type: approach
- control: position_control
  generator: linear_cartesian
  id: descend_to_contact
  parameters:
    descend_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.02
      range:
      - 0.005
      - 0.05
      type: scalar
    descend_tol:
      binds_to:
      - mode: replace
        path: termination.pose_tolerance
      default: 0.01
      range:
      - 0.003
      - 0.02
      type: scalar
  subtask_id: descend_contact
  target:
    anchor: task_object
    offset:
    - 0.0
    - -0.08
    - 0.01
    orientation:
      mode: keep_current
    tolerance: 0.02
  termination: pose_tolerance
  type: descend
- control: impedance_control
  generator: linear_cartesian
  id: push_toward_goal
  parameters:
    push_distance:
      binds_to:
      - mode: replace
        path: target.offset_along_axis.distance
      default: 0.2
      range:
      - 0.1
      - 0.3
      type: scalar
    push_duration:
      binds_to:
      - mode: replace
        path: duration.max_time
      default: 5.0
      range:
      - 2.0
      - 10.0
      type: scalar
    push_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.05
      range:
      - 0.02
      - 0.1
      type: scalar
  subtask_id: push_to_goal
  target:
    anchor: task_object
    offset:
    - 0.0
    - 0.0
    - 0.0
    offset_along_axis:
      axis: push_direction
      distance: 0.2
      mode: replace_offset_projection
      sign: negative
    orientation:
      mode: keep_current
  termination: time_limit
  type: push
skill: push_to_goal
skill_type: arm
subtasks:
- anchor: object
  id: approach_obj
  metric: distance
  offset:
  - 0.0
  - -0.08
  - 0.1
  target_entity: tcp
  weight: 0.2
- anchor: object
  id: descend_contact
  metric: distance
  offset:
  - 0.0
  - -0.08
  - 0.01
  target_entity: tcp
  weight: 0.2
- anchor: goal
  id: push_to_goal
  metric: goal_progress
  target_entity: object
  weight: 0.6
