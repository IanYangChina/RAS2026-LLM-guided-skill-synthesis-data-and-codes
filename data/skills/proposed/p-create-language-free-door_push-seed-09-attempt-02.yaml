dsl_version: 2
phases:
- control: position_control
  generator: linear_cartesian
  id: approach_1
  parameters:
    approach_tolerance:
      binds_to:
      - mode: replace
        path: termination.pose_tolerance
      default: 0.01
      range:
      - 0.001
      - 0.1
      type: scalar
    speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.05
      range:
      - 0.01
      - 0.1
      type: scalar
  subtask_id: reach_handle
  target:
    anchor: site
    entity: door_handle
    offset:
    - 0.0
    - 0.0
    - 0.1
    orientation:
      mode: keep_current
    source: yaml
  termination: pose_tolerance
  type: approach
- control: force_threshold_switch
  generator: linear_cartesian
  id: contact_1
  parameters:
    contact_force:
      binds_to:
      - mode: replace
        path: termination.force_threshold
      default: 5.0
      range:
      - 1.0
      - 20.0
      type: scalar
  subtask_id: reach_handle
  target:
    anchor: site
    entity: door_handle
    offset:
    - 0.0
    - 0.0
    - 0.0
    orientation:
      mode: keep_current
    source: yaml
  termination: force_exceeded
  type: contact
- control: impedance_control
  generator: impedance_motion
  id: push_1
  parameters:
    push_distance:
      binds_to:
      - mode: replace
        path: target.offset_along_axis.distance
      default: 0.21
      range:
      - 0.1
      - 0.3
      type: scalar
    push_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.03
      range:
      - 0.01
      - 0.1
      type: scalar
    push_tolerance:
      binds_to:
      - mode: replace
        path: termination.pose_tolerance
      default: 0.01
      range:
      - 0.001
      - 0.1
      type: scalar
  subtask_id: push_open
  target:
    anchor: current_tcp
    offset:
    - 0.0
    - 0.0
    - 0.0
    offset_along_axis:
      axis: world_y
      distance: 0.21
      mode: replace_offset_projection
      sign: negative
    orientation:
      mode: keep_current
    source: yaml
  termination: pose_tolerance
  type: push
skill: door_push
subtasks:
- anchor: fixture
  id: reach_handle
  offset:
  - -0.4
  - -0.02
  - 0.45
  weight: 0.3
- id: push_open
  metric: hinge_angle
  target_entity: hinge
  weight: 0.7
