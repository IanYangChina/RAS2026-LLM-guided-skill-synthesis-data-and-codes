dsl_version: 2
phases:
- control: position_control
  generator: linear_cartesian
  id: approach_behind_object
  parameters:
    approach_behind:
      binds_to:
      - mode: replace
        path: target.offset_along_axis.distance
      default: 0.08
      range:
      - 0.02
      - 0.2
      type: scalar
    approach_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.12
      range:
      - 0.05
      - 0.3
      type: scalar
    approach_tolerance:
      binds_to:
      - mode: replace
        path: termination.pose_tolerance
      default: 0.02
      range:
      - 0.01
      - 0.05
      type: scalar
  subtask_id: approach_object
  target:
    anchor: task_object
    offset:
    - 0.0
    - 0.0
    - 0.025
    offset_along_axis:
      axis: task_goal_direction
      distance: 0.05
      mode: add_to_offset
      sign: negative
    orientation:
      mode: keep_current
    source: yaml
    tolerance: 0.02
  termination: pose_tolerance
  type: approach
- control: impedance_control
  generator: impedance_motion
  id: push_object_to_goal
  parameters:
    push_distance:
      binds_to:
      - mode: replace
        path: target.offset_along_axis.distance
      default: 0.25
      range:
      - 0.15
      - 0.4
      type: scalar
    push_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.12
      range:
      - 0.05
      - 0.3
      type: scalar
    push_tolerance:
      binds_to:
      - mode: replace
        path: termination.pose_tolerance
      default: 0.04
      range:
      - 0.02
      - 0.08
      type: scalar
  retries:
    max_attempts: 1
    offset:
    - 0.0
    - 0.01
    - 0.0
    strategy: offset_target
  subtask_id: push_to_goal
  target:
    anchor: task_object
    offset:
    - 0.0
    - 0.0
    - 0.025
    offset_along_axis:
      axis: task_goal_direction
      distance: 0.05
      mode: add_to_offset
      sign: positive
    orientation:
      mode: keep_current
    source: yaml
    tolerance: 0.04
  termination: pose_tolerance
  type: push
skill: push_to_goal
subtasks:
- anchor: object
  id: approach_object
  metric: distance
  offset:
  - 0.0
  - 0.0
  - 0.025
  target_entity: tcp
  weight: 0.3
- anchor: goal
  id: push_to_goal
  metric: goal_progress
  target_entity: object
  weight: 0.7
