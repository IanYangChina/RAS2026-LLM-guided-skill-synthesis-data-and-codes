dsl_version: 2
phases:
- control: position_control
  generator: arc_cartesian
  id: approach_peg
  orientation:
    mode: none
  parameters:
    approach_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.05
      range:
      - 0.01
      - 0.1
      type: scalar
    arc_height:
      binds_to:
      - mode: replace
        path: generator.arc_height
      default: 0.15
      range:
      - 0.05
      - 0.3
      type: scalar
  subtask_id: reach_peg
  target:
    anchor: task_object
    offset:
    - 0
    - 0.01
    - 0.09
    source: yaml
  termination: pose_tolerance
  type: approach
- control: position_control
  generator: linear_cartesian
  id: descend_to_peg
  orientation:
    align_with: channel_axis
    axis:
    - 1
    - 0
    - 0
    mode: align_axis
    tolerance: 0.1
  parameters:
    descend_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.05
      range:
      - 0.01
      - 0.1
      type: scalar
  subtask_id: reach_peg
  target:
    anchor: task_object
    offset:
    - 0
    - 0.01
    - 0.0
    source: yaml
  termination: pose_tolerance
  type: descend
- control: impedance_control
  generator: linear_cartesian
  guards:
  - args: {}
    id: progress_check
    on_failure: retry
    predicate: object_progress
    threshold: 0.01
    when: during_phase
  id: push_through_channel
  orientation:
    mode: keep_current
  parameters:
    progress_threshold:
      binds_to:
      - mode: replace
        path: guards.progress_check.threshold
      default: 0.01
      range:
      - 0.003
      - 0.02
      type: scalar
    push_distance:
      binds_to:
      - mode: replace
        path: target.offset_along_axis.distance
      default: 0.15
      range:
      - 0.1
      - 0.2
      type: scalar
    push_duration:
      binds_to:
      - mode: replace
        path: duration.max_time
      default: 3.0
      range:
      - 2.0
      - 5.0
      type: scalar
    push_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.05
      range:
      - 0.01
      - 0.1
      type: scalar
  retries:
    max_attempts: 1
    offset:
    - 0
    - -0.005
    - 0
    strategy: offset_target
  subtask_id: push_through_channel
  target:
    anchor: current_tcp
    offset_along_axis:
      axis: channel_axis
      distance: 0.0
      mode: add_to_offset
    source: yaml
  termination: time_limit
  type: push
skill: peg_channel
skill_type: arm_gripper
subtasks:
- anchor: object
  id: reach_peg
  offset:
  - 0
  - 0.01
  - 0.09
  target_entity: tcp
  weight: 0.3
- anchor: goal
  id: push_through_channel
  metric: distance
  offset:
  - 0
  - 0
  - 0
  target_entity: tcp
  weight: 0.7
