dsl_version: 2
phases:
- control: position_control
  generator: linear_cartesian
  id: lift_z
  orientation:
    mode: none
  parameters:
    lift_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.08
      range:
      - 0.02
      - 0.15
      type: scalar
    lift_z_offset:
      binds_to:
      - mode: replace
        path: target.offset.z
      default: 0.1
      range:
      - 0.05
      - 0.15
      type: scalar
  subtask_id: lift_clear
  target:
    anchor: current_tcp
    offset:
    - 0
    - 0
    - 0.1
    source: yaml
    tolerance: 0.01
  termination: pose_tolerance
  type: lift
- control: position_control
  generator: linear_cartesian
  id: approach_over
  orientation:
    mode: none
  parameters:
    approach_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.08
      range:
      - 0.03
      - 0.15
      type: scalar
    over_clearance_z:
      binds_to:
      - mode: replace
        path: target.offset.z
      default: 0.25
      range:
      - 0.15
      - 0.35
      type: scalar
  subtask_id: over_obstacle
  target:
    anchor: task_goal
    offset:
    - 0
    - 0
    - 0.25
    source: yaml
    tolerance: 0.02
  termination: pose_tolerance
  type: approach
- control: position_control
  generator: linear_cartesian
  id: descend_to_goal
  orientation:
    mode: none
  parameters:
    descend_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.05
      range:
      - 0.02
      - 0.1
      type: scalar
  subtask_id: final_goal
  target:
    anchor: task_goal
    offset:
    - 0
    - 0
    - 0
    source: yaml
    tolerance: 0.01
  termination: pose_tolerance
  type: descend
skill: obstacle_reach
skill_type: arm
subtasks:
- anchor: world
  id: lift_clear
  metric: distance
  offset:
  - 0.35
  - 0
  - 0.4
  target_entity: tcp
  weight: 0.15
- anchor: goal
  id: over_obstacle
  metric: distance
  offset:
  - 0
  - 0
  - 0.25
  target_entity: tcp
  weight: 0.3
- anchor: goal
  id: final_goal
  metric: distance
  offset:
  - 0
  - 0
  - 0
  target_entity: tcp
  weight: 0.55
