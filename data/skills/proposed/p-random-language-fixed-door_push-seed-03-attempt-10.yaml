dsl_version: 2
phases:
- control: impedance_control
  generator: arc_cartesian
  id: approach_handle
  parameters:
    approach_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.15
      range:
      - 0.05
      - 0.3
      type: scalar
    arc_height:
      binds_to:
      - mode: replace
        path: generator.arc_height
      default: 0.05
      range:
      - 0.02
      - 0.1
      type: scalar
    force_threshold:
      binds_to:
      - mode: replace
        path: termination.force_threshold
      default: 12.0
      range:
      - 5.0
      - 25.0
      type: scalar
  retries:
    max_attempts: 1
    offset:
    - 0.0
    - 0.005
    - 0.0
    strategy: offset_target
  target:
    anchor: site
    entity: door_handle
    offset:
    - 0.0
    - 0.0
    - 0.0
    orientation:
      mode: keep_current
    source: yaml
    tolerance: 0.02
  termination: force_exceeded
  type: approach
- control: impedance_control
  generator: linear_cartesian
  id: push_door
  parameters:
    max_time:
      binds_to:
      - mode: replace
        path: duration.max_time
      default: 6.0
      range:
      - 3.0
      - 10.0
      type: scalar
    push_distance:
      binds_to:
      - mode: replace
        path: target.offset_along_axis.distance
      default: 0.3
      range:
      - 0.15
      - 0.5
      type: scalar
    push_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.08
      range:
      - 0.05
      - 0.12
      type: scalar
  retries:
    max_attempts: 0
    strategy: repeat
  target:
    anchor: current_tcp
    offset:
    - 0.0
    - 0.0
    - 0.0
    offset_along_axis:
      axis: world_y
      distance: 0.3
      mode: replace_offset_projection
      sign: positive
    orientation:
      mode: keep_current
    source: yaml
    tolerance: 0.02
  termination: time_limit
  type: push
skill: door_push
subtasks:
- anchor: fixture
  id: hinge_progress
  metric: hinge_angle
  target_entity: hinge
