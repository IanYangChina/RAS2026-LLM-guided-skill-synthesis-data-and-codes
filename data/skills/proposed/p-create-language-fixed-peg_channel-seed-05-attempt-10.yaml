dsl_version: 2
phases:
- control: position_control
  generator: linear_cartesian
  guards:
  - args: {}
    id: table_collision
    on_failure: abort
    predicate: contact_detected
    threshold: 0
    when: during_phase
  id: approach_behind
  parameters:
    speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.04
      range:
      - 0.01
      - 0.1
      type: scalar
  subtask_id: approach
  target:
    anchor: task_object
    entity: peg
    offset:
    - 0.0
    - 0.03
    - 0.06
    orientation:
      mode: none
    source: yaml
  termination: pose_tolerance
  type: approach
- control: impedance_control
  generator: impedance_motion
  guards:
  - args: {}
    id: track_force
    on_failure: retry
    predicate: force_below
    threshold: 5.0
    when: during_phase
  - args: {}
    id: contact_force
    on_failure: continue
    predicate: force_below
    threshold: 0.5
    when: during_phase
  id: push_through_channel
  parameters:
    force_limit:
      binds_to:
      - mode: replace
        path: guards.track_force.threshold
      default: 15.0
      range:
      - 5.0
      - 30.0
      type: scalar
    push_distance:
      binds_to:
      - mode: replace
        path: target.offset_along_axis.distance
      default: 0.16
      range:
      - 0.1
      - 0.18
      type: scalar
    push_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.02
      range:
      - 0.005
      - 0.05
      type: scalar
    retry_x:
      binds_to:
      - mode: replace
        path: retry.offset.x
      default: 0.002
      range:
      - -0.005
      - 0.005
      type: scalar
    retry_y:
      binds_to:
      - mode: replace
        path: retry.offset.y
      default: -0.002
      range:
      - -0.005
      - 0.005
      type: scalar
  retries:
    max_attempts: 2
    offset:
    - 0.002
    - -0.002
    - 0.0
    strategy: offset_target
  target:
    anchor: task_object
    entity: peg
    offset:
    - 0.0
    - 0.0
    - 0.0
    offset_along_axis:
      axis: channel_axis
      distance: 0.16
      mode: add_to_offset
    orientation:
      align_with: channel_axis
      axis:
      - 0
      - 0
      - 1
      mode: align_axis
      tolerance: 0.15
    source: yaml
  termination: pose_tolerance
  type: push
skill: peg_channel
skill_type: arm
