dsl_version: 2
phases:
- control: position_control
  generator: linear_cartesian
  id: align_1
  parameters:
    lateral_offset_x:
      binds_to:
      - mode: add
        path: target.offset.x
      default: 0.0
      range:
      - -0.01
      - 0.01
      type: scalar
    lateral_offset_y:
      binds_to:
      - mode: add
        path: target.offset.y
      default: 0.0
      range:
      - -0.01
      - 0.01
      type: scalar
  subtask_id: reach_socket
  target:
    anchor: task_goal
    offset:
    - 0.0
    - 0.0
    - 0.1
    orientation:
      align_with: channel_axis
      axis:
      - 0.0
      - 0.0
      - 1.0
      mode: align_axis
      tolerance: 0.02
    source: yaml
  termination: pose_tolerance
  type: align
- control: position_control
  generator: linear_cartesian
  id: approach_1
  parameters:
    approach_height:
      binds_to:
      - mode: replace
        path: target.offset.z
      default: 0.03
      range:
      - 0.02
      - 0.08
      type: scalar
    approach_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.03
      range:
      - 0.01
      - 0.05
      type: scalar
  subtask_id: reach_socket
  target:
    anchor: task_goal
    offset:
    - 0.0
    - 0.0
    - 0.03
    orientation:
      mode: keep_current
    source: yaml
  termination: pose_tolerance
  type: approach
- control: admittance_control
  generator: linear_cartesian
  id: descend_1
  parameters:
    contact_force_threshold:
      binds_to:
      - mode: replace
        path: termination.force_threshold
      default: 30.0
      range:
      - 20.0
      - 40.0
      type: scalar
    descend_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.015
      range:
      - 0.005
      - 0.025
      type: scalar
    descend_z:
      binds_to:
      - mode: replace
        path: target.offset.z
      default: 0.03
      range:
      - 0.02
      - 0.05
      type: scalar
  subtask_id: insert_peg
  target:
    anchor: task_goal
    offset:
    - 0.0
    - 0.0
    - 0.03
    orientation:
      mode: keep_current
    source: yaml
  termination: force_exceeded
  type: descend
- control: impedance_control
  generator: linear_cartesian
  guards:
  - id: insertion_force_guard
    on_failure: retry
    predicate: force_below
    threshold: 40.0
    when: during_phase
  id: insert_1
  parameters:
    insert_distance:
      binds_to:
      - mode: replace
        path: target.offset_along_axis.distance
      default: 0.05
      range:
      - 0.03
      - 0.08
      type: scalar
    insert_max_force:
      binds_to:
      - mode: replace
        path: termination.force_threshold
      default: 40.0
      range:
      - 30.0
      - 50.0
      type: scalar
    insert_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.008
      range:
      - 0.003
      - 0.015
      type: scalar
    retry_lateral_x:
      binds_to:
      - mode: replace
        path: retry.offset.x
      default: 0.005
      range:
      - -0.025
      - 0.025
      type: scalar
    retry_lateral_y:
      binds_to:
      - mode: replace
        path: retry.offset.y
      default: 0.005
      range:
      - -0.025
      - 0.025
      type: scalar
  retries:
    max_attempts: 2
    offset:
    - 0.0
    - 0.0
    - 0.0
    strategy: offset_target
  subtask_id: insert_peg
  target:
    anchor: task_goal
    offset:
    - 0.0
    - 0.0
    - 0.0
    offset_along_axis:
      axis: channel_axis
      distance: 0.05
      mode: add_to_offset
      sign: positive
    orientation:
      align_with: channel_axis
      axis:
      - 0.0
      - 0.0
      - 1.0
      mode: align_axis
      tolerance: 0.02
    source: yaml
  termination: force_exceeded
  type: insert
- control: position_control
  end_effector_action: close
  id: grasp_1
  parameters:
    grasp_duration:
      binds_to:
      - mode: replace
        path: duration.max_time
      default: 1.0
      range:
      - 0.5
      - 2.0
      type: scalar
  target:
    anchor: current_tcp
    offset:
    - 0.0
    - 0.0
    - 0.0
    source: yaml
  termination: time_limit
  type: grasp
skill: peg_insert
skill_type: arm_gripper
subtasks:
- anchor: task_goal
  id: reach_socket
  offset:
  - 0.0
  - 0.0
  - 0.05
  weight: 0.3
- anchor: task_goal
  id: insert_peg
  metric: goal_progress
  weight: 0.7
