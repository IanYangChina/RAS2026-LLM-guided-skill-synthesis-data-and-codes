dsl_version: 2
phases:
- control: position_control
  generator: linear_cartesian
  guards: []
  id: approach_peg
  parameters:
    approach_offset_y:
      binds_to:
      - mode: add
        path: target.offset.y
      default: 0.04
      range:
      - 0.02
      - 0.06
      type: scalar
  retries:
    max_attempts: 0
  subtask_id: approach
  target:
    anchor: task_object
    offset:
    - 0.0
    - 0.04
    - 0.0
    orientation:
      mode: none
    tolerance: 0.01
  termination: pose_tolerance
  type: approach
- control: force_threshold_switch
  generator: linear_cartesian
  guards: []
  id: contact_peg
  parameters:
    contact_force_threshold:
      binds_to:
      - mode: replace
        path: termination.force_threshold
      default: 12.0
      range:
      - 5.0
      - 20.0
      type: scalar
  retries:
    max_attempts: 0
  subtask_id: contact
  target:
    anchor: task_object
    offset:
    - 0.0
    - 0.0
    - 0.0
    orientation:
      mode: none
    tolerance: 0.01
  termination: force_exceeded
  type: contact
- control: impedance_control
  generator: linear_cartesian
  guards:
  - args: {}
    id: push_force_guard
    on_failure: continue
    predicate: force_below
    threshold: 35.0
    when: during_phase
  id: push_through_channel
  parameters:
    orientation_tolerance:
      binds_to:
      - mode: replace
        path: orientation.tolerance
      default: 0.1
      range:
      - 0.05
      - 0.3
      type: scalar
    push_depth:
      binds_to:
      - mode: replace
        path: target.offset_along_axis.distance
      default: 0.16
      range:
      - 0.1
      - 0.2
      type: scalar
  retries:
    max_attempts: 2
    offset:
    - 0.005
    - 0.0
    - 0.0
    strategy: offset_target
  subtask_id: push
  target:
    anchor: task_object
    offset:
    - 0.0
    - 0.0
    - 0.0
    offset_along_axis:
      axis: channel_axis
      distance: 0.16
      mode: replace_offset_projection
    orientation:
      align_with: channel_axis
      axis:
      - 0.0
      - 0.0
      - 1.0
      mode: align_axis
      tolerance: 0.1
    tolerance: 0.02
  termination: pose_tolerance
  type: push
- control: position_control
  generator: linear_cartesian
  guards: []
  id: retract_after_push
  parameters: {}
  retries:
    max_attempts: 0
  target:
    anchor: current_tcp
    offset:
    - 0.0
    - 0.0
    - 0.15
    orientation:
      mode: keep_current
    tolerance: 0.01
  termination: pose_tolerance
  type: retract
skill: peg_channel
