dsl_version: 2
phases:
- control: position_control
  generator: linear_cartesian
  id: approach_1
  orientation:
    mode: keep_current
  parameters:
    speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.05
      range:
      - 0.02
      - 0.1
      type: scalar
  subtask_id: pre_insertion
  target:
    anchor: task_object
    entity: peg
    offset:
    - 0.0
    - 0.06
    - 0.08
    source: yaml
  termination: pose_tolerance
  type: approach
- control: admittance_control
  generator: linear_cartesian
  id: descend_1
  orientation:
    mode: keep_current
  parameters:
    force_threshold:
      binds_to:
      - mode: replace
        path: termination.force_threshold
      default: 5.0
      range:
      - 1.0
      - 10.0
      type: scalar
    speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.02
      range:
      - 0.01
      - 0.05
      type: scalar
  subtask_id: pre_insertion
  target:
    anchor: task_object
    entity: peg
    offset:
    - 0.0
    - -0.02
    - 0.0
    source: yaml
  termination: force_exceeded
  type: descend
- control: position_control
  generator: linear_cartesian
  id: align_1
  orientation:
    align_with: channel_axis
    axis:
    - 0.0
    - -1.0
    - 0.0
    mode: align_axis
    tolerance: 0.1
  parameters:
    lateral_offset_x:
      binds_to:
      - mode: add
        path: target.offset.x
      default: 0.0
      range:
      - -0.02
      - 0.02
      type: scalar
    lateral_offset_y:
      binds_to:
      - mode: add
        path: target.offset.y
      default: 0.0
      range:
      - -0.01
      - 0.01
      type: scalar
  subtask_id: pre_insertion
  target:
    anchor: task_object
    entity: peg
    offset:
    - 0.0
    - -0.02
    - 0.0
    source: yaml
  termination: pose_tolerance
  type: align
- control: impedance_control
  generator: linear_cartesian
  guards:
  - args: {}
    id: object_moving
    on_failure: retry
    predicate: object_progress
    threshold: 0.001
    when: during_phase
  id: push_1
  orientation:
    align_with: channel_axis
    axis:
    - 0.0
    - -1.0
    - 0.0
    mode: align_axis
    tolerance: 0.1
  parameters:
    max_time:
      binds_to:
      - mode: replace
        path: duration.max_time
      default: 5.0
      range:
      - 2.0
      - 8.0
      type: scalar
    push_distance:
      binds_to:
      - mode: replace
        path: target.offset_along_axis.distance
      default: 0.16
      range:
      - 0.08
      - 0.2
      type: scalar
    push_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.02
      range:
      - 0.01
      - 0.05
      type: scalar
  retries:
    max_attempts: 2
    offset:
    - 0.0
    - 0.0
    - 0.0
    strategy: offset_target
  subtask_id: insertion
  target:
    anchor: task_object
    entity: peg
    offset:
    - 0.0
    - -0.02
    - 0.0
    offset_along_axis:
      axis: task_goal_direction
      distance: 0.16
      mode: add_to_offset
      sign: positive
    source: yaml
  termination: time_limit
  type: push
skill: peg_channel
skill_type: arm
subtasks:
- anchor: object
  id: pre_insertion
  metric: distance
  offset:
  - 0.0
  - 0.0
  - 0.06
  target_entity: tcp
  weight: 0.3
- anchor: goal
  id: insertion
  metric: goal_progress
  target_entity: tcp
  weight: 0.7
