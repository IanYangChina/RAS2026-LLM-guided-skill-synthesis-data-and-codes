dsl_version: 2
phases:
- control: position_control
  generator: linear_cartesian
  id: align_behind
  parameters:
    align_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.1
      range:
      - 0.02
      - 0.2
      type: scalar
    approach_distance:
      binds_to:
      - mode: replace
        path: target.offset_along_axis.distance
      default: 0.05
      range:
      - 0.03
      - 0.1
      type: scalar
  subtask_id: contact_object
  target:
    anchor: task_object
    offset:
    - 0.0
    - 0.0
    - 0.0
    offset_along_axis:
      axis: task_goal_direction
      distance: 0.05
      mode: replace_offset_projection
      sign: negative
    orientation:
      mode: keep_current
    source: yaml
    tolerance: 0.015
  termination: pose_tolerance
  type: approach
- control: impedance_control
  generator: linear_cartesian
  guards:
  - args: {}
    id: max_force_guard
    on_failure: abort
    predicate: force_below
    threshold: 25.0
    when: during_phase
  id: push_to_goal
  parameters:
    push_height_offset:
      binds_to:
      - mode: replace
        path: target.offset.z
      default: 0.005
      range:
      - 0.0
      - 0.02
      type: scalar
    push_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.05
      range:
      - 0.005
      - 0.15
      type: scalar
  retries:
    max_attempts: 1
    strategy: reduce_speed
  subtask_id: move_to_goal
  target:
    anchor: task_goal
    offset:
    - 0.0
    - 0.0
    - 0.005
    orientation:
      mode: keep_current
    source: yaml
    tolerance: 0.02
  termination: pose_tolerance
  type: push
skill: push_to_goal
subtasks:
- anchor: object
  id: contact_object
  offset:
  - 0.0
  - 0.06
  - 0.0
  weight: 0.3
- id: move_to_goal
  metric: goal_progress
  target_entity: object
  weight: 0.7
