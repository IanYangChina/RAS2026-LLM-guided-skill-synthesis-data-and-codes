dsl_version: 2
phases:
- control: position_control
  generator: linear_cartesian
  id: approach_behind
  parameters:
    approach_height_z:
      binds_to:
      - mode: replace
        path: target.offset.z
      default: 0.1
      range:
      - 0.05
      - 0.15
      type: scalar
    approach_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.08
      range:
      - 0.05
      - 0.1
      type: scalar
    behind_offset_y:
      binds_to:
      - mode: replace
        path: target.offset.y
      default: 0.05
      range:
      - 0.04
      - 0.08
      type: scalar
  subtask_id: approach_sub
  target:
    anchor: task_object
    offset:
    - 0.0
    - 0.05
    - 0.1
    orientation:
      mode: keep_current
    source: yaml
    tolerance: 0.04
  termination: pose_tolerance
  type: approach
- control: position_control
  generator: linear_cartesian
  guards:
  - args:
      body_a: attachment
      body_b: push_box
      geom_a: pusher_tip
      geom_b: push_box_geom
    id: contact_box
    on_failure: retry
    predicate: contact_pair
    threshold: 1.0
    when: during_phase
  id: descend_to_push
  parameters:
    behind_offset_y:
      binds_to:
      - mode: replace
        path: target.offset.y
      default: 0.05
      range:
      - 0.04
      - 0.08
      type: scalar
    descend_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.05
      range:
      - 0.05
      - 0.1
      type: scalar
  retries:
    max_attempts: 2
    offset:
    - 0.0
    - 0.01
    - 0.0
    strategy: offset_target
  subtask_id: approach_sub
  target:
    anchor: task_object
    offset:
    - 0.0
    - 0.05
    - 0.0
    orientation:
      mode: keep_current
    source: yaml
    tolerance: 0.02
  termination: pose_tolerance
  type: descend
- control: impedance_control
  generator: linear_cartesian
  guards:
  - args: {}
    id: object_progress_check
    on_failure: retry
    predicate: object_progress
    threshold: 0.01
    when: during_phase
  id: push_to_goal
  parameters:
    push_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.15
      range:
      - 0.05
      - 0.25
      type: scalar
    push_stroke:
      binds_to:
      - mode: replace
        path: target.offset_along_axis.distance
      default: 0.35
      range:
      - 0.2
      - 0.5
      type: scalar
    push_time:
      binds_to:
      - mode: replace
        path: duration.max_time
      default: 6.0
      range:
      - 4.0
      - 10.0
      type: scalar
  retries:
    max_attempts: 1
    strategy: reduce_speed
  subtask_id: push_sub
  target:
    anchor: current_tcp
    offset:
    - 0.0
    - 0.0
    - 0.0
    offset_along_axis:
      axis: task_goal_direction
      distance: 0.35
      mode: replace_offset_projection
      sign: positive
    orientation:
      mode: keep_current
    source: yaml
    tolerance: 0.02
  termination: time_limit
  type: push
skill: push_to_goal
subtasks:
- anchor: object
  id: approach_sub
  offset:
  - 0.0
  - 0.0
  - 0.1
  weight: 0.3
- id: push_sub
  metric: goal_progress
  target_entity: object
  weight: 0.7
