dsl_version: 2
phases:
- control: position_control
  generator: linear_cartesian
  id: approach_above_peg
  parameters:
    approach_height:
      binds_to:
      - mode: replace
        path: target.offset.z
      default: 0.1
      range:
      - 0.05
      - 0.15
      type: scalar
  retries:
    max_attempts: 0
    strategy: repeat
  subtask_id: reach_align
  target:
    anchor: task_object
    offset:
    - 0.0
    - 0.0
    - 0.1
    orientation:
      mode: keep_current
    source: yaml
    tolerance: 0.02
  termination: pose_tolerance
  type: approach
- control: position_control
  generator: linear_cartesian
  id: align_behind_peg
  parameters:
    align_backset_y:
      binds_to:
      - mode: replace
        path: target.offset.y
      default: 0.05
      range:
      - 0.03
      - 0.07
      type: scalar
    align_height_z:
      binds_to:
      - mode: replace
        path: target.offset.z
      default: 0.04
      range:
      - 0.03
      - 0.05
      type: scalar
  retries:
    max_attempts: 0
    strategy: repeat
  subtask_id: reach_align
  target:
    anchor: task_object
    offset:
    - 0.0
    - 0.05
    - 0.04
    orientation:
      align_with: channel_axis
      axis:
      - 1.0
      - 0.0
      - 0.0
      mode: align_axis
      tolerance: 0.1
    source: yaml
    tolerance: 0.01
  termination: pose_tolerance
  type: align
- control: impedance_control
  generator: linear_cartesian
  guards:
  - args: {}
    id: guard_contact_force
    on_failure: abort
    predicate: force_below
    threshold: 2.0
    when: during_phase
  id: push_through_channel
  parameters:
    push_force_threshold:
      binds_to:
      - mode: replace
        path: termination.force_threshold
      default: 30.0
      range:
      - 5.0
      - 40.0
      type: scalar
    push_lateral_x:
      binds_to:
      - mode: replace
        path: target.offset.x
      default: 0.0
      range:
      - -0.03
      - 0.03
      type: scalar
    push_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.03
      range:
      - 0.01
      - 0.05
      type: scalar
  retries:
    max_attempts: 2
    strategy: reduce_speed
  subtask_id: push_channel
  target:
    anchor: task_goal
    offset:
    - 0.0
    - 0.0
    - 0.04
    orientation:
      mode: keep_current
    source: yaml
    tolerance: 0.04
  termination: force_exceeded
  type: push
skill: peg_channel
subtasks:
- anchor: object
  id: reach_align
  metric: distance
  offset:
  - 0.0
  - 0.05
  - 0.04
  target_entity: tcp
  weight: 0.3
- anchor: goal
  id: push_channel
  metric: goal_progress
  offset:
  - 0.0
  - 0.0
  - 0.04
  target_entity: tcp
  weight: 0.7
