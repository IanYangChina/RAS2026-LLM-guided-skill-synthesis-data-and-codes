dsl_version: 2
phases:
- control: position_control
  generator: linear_cartesian
  id: align_1
  subtask_id: standoff
  target:
    anchor: task_goal
    offset:
    - 0.0
    - 0.0
    - 0.1
    orientation:
      mode: none
    source: yaml
    tolerance: 0.015
  termination: pose_tolerance
  type: align
- control: force_threshold_switch
  generator: linear_cartesian
  guards:
  - id: force_safe
    on_failure: continue
    predicate: force_below
    threshold: 30.0
    when: during_phase
  id: contact_1
  parameters:
    contact_force:
      binds_to:
      - mode: replace
        path: termination.force_threshold
      default: 3.0
      range:
      - 1.0
      - 10.0
      type: scalar
    contact_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.01
      range:
      - 0.005
      - 0.03
      type: scalar
  subtask_id: hole_entry
  target:
    anchor: task_goal
    offset:
    - 0.0
    - 0.0
    - -0.05
    source: yaml
  termination: force_exceeded
  type: contact
- control: force_threshold_switch
  generator: linear_cartesian
  guards:
  - id: insertion_progress
    on_failure: continue
    predicate: object_progress
    threshold: 0.005
    when: during_phase
  - id: insertion_force_safe
    on_failure: continue
    predicate: force_below
    threshold: 35.0
    when: during_phase
  id: insert_1
  parameters:
    insert_force:
      binds_to:
      - mode: replace
        path: termination.force_threshold
      default: 12.0
      range:
      - 5.0
      - 25.0
      type: scalar
    insertion_depth:
      binds_to:
      - mode: replace
        path: target.offset_along_axis.distance
      default: 0.05
      range:
      - 0.01
      - 0.15
      type: scalar
    insertion_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.005
      range:
      - 0.002
      - 0.02
      type: scalar
  retries:
    max_attempts: 2
    offset:
    - 0.005
    - 0.005
    - 0.0
    strategy: offset_target
  subtask_id: full_insertion
  target:
    anchor: task_goal
    offset:
    - 0.0
    - 0.0
    - 0.0
    offset_along_axis:
      axis: channel_axis
      distance: 0.05
      mode: add_to_offset
      sign: positive
    orientation:
      align_with: channel_axis
      axis:
      - 0.0
      - 0.0
      - 1.0
      mode: align_axis
      tolerance: 0.02
    source: yaml
  termination: force_exceeded
  type: push
- control: position_control
  generator: linear_cartesian
  id: retract_1
  target:
    anchor: current_tcp
    offset:
    - 0.0
    - 0.0
    - 0.1
    source: yaml
  termination: pose_tolerance
  type: retract
skill: peg_insert
subtasks:
- id: standoff
  offset:
  - 0.0
  - 0.0
  - 0.1
  weight: 0.2
- id: hole_entry
  metric: contact
  weight: 0.2
- id: full_insertion
  offset:
  - 0.0
  - 0.0
  - -0.05
  weight: 0.6
