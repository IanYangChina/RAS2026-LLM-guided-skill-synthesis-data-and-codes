dsl_version: 2
phases:
- control: position_control
  generator: linear_cartesian
  id: approach_panel
  parameters:
    approach_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.1
      range:
      - 0.05
      - 0.15
      type: scalar
  subtask_id: push_hinge
  target:
    anchor: fixture
    entity: door_panel
    offset:
    - -0.4
    - 0.03
    - 0.35
    orientation:
      mode: none
    source: yaml
    tolerance: 0.02
  termination: pose_tolerance
  type: approach
- control: admittance_control
  generator: linear_cartesian
  id: push_door
  parameters:
    push_duration:
      binds_to:
      - mode: replace
        path: duration.max_time
      default: 8.0
      range:
      - 4.0
      - 12.0
      type: scalar
    push_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.04
      range:
      - 0.01
      - 0.08
      type: scalar
    push_stroke:
      binds_to:
      - mode: replace
        path: target.offset_along_axis.distance
      default: 0.35
      range:
      - 0.2
      - 0.6
      type: scalar
  retries:
    max_attempts: 1
    offset:
    - 0.0
    - 0.005
    - 0.0
    strategy: offset_target
  subtask_id: push_hinge
  target:
    anchor: fixture
    entity: door_panel
    offset:
    - -0.4
    - 0.01
    - 0.35
    offset_along_axis:
      axis: world_x
      distance: 0.3
      mode: replace_offset_projection
      sign: positive
    orientation:
      mode: keep_current
    source: yaml
    tolerance: 0.05
  termination: time_limit
  type: push
skill: door_push
subtasks:
- anchor: world
  id: push_hinge
  metric: hinge_angle
  target_entity: hinge
  weight: 1.0
