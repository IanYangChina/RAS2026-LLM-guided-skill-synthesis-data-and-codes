dsl_version: 2
phases:
- control: position_control
  generator: linear_cartesian
  id: approach_1
  parameters:
    approach_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.08
      range:
      - 0.02
      - 0.15
      type: scalar
  subtask_id: above_entry
  target:
    anchor: task_goal
    offset:
    - 0
    - 0
    - 0.05
    orientation:
      align_with: insertion_axis
      axis:
      - 0
      - 0
      - 1
      mode: align_axis
      tolerance: 0.05
    source: yaml
  termination: pose_tolerance
  type: approach
- control: impedance_control
  generator: linear_cartesian
  id: insert_1
  parameters:
    insertion_distance:
      binds_to:
      - mode: replace
        path: target.offset_along_axis.distance
      default: 0.06
      range:
      - 0.03
      - 0.08
      type: scalar
    insertion_force_threshold:
      binds_to:
      - mode: replace
        path: termination.force_threshold
      default: 20
      range:
      - 5
      - 40
      type: scalar
    insertion_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.02
      range:
      - 0.005
      - 0.05
      type: scalar
  subtask_id: fully_inserted
  target:
    anchor: current_tcp
    offset:
    - 0
    - 0
    - 0
    offset_along_axis:
      axis: insertion_axis
      distance: 0.06
      mode: add_to_offset
      sign: positive
    orientation:
      mode: keep_current
    source: yaml
  termination: force_exceeded
  type: insert
skill: peg_insert
subtasks:
- anchor: goal
  id: above_entry
  offset:
  - 0
  - 0
  - 0.05
  target_entity: tcp
  weight: 0.3
- anchor: goal
  id: fully_inserted
  offset:
  - 0
  - 0
  - 0
  target_entity: tcp
  weight: 1.0
