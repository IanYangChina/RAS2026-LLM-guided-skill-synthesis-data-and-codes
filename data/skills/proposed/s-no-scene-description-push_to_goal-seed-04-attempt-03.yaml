dsl_version: 2
phases:
- control: position_control
  generator: linear_cartesian
  id: behind_1
  parameters:
    approach_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.08
      range:
      - 0.02
      - 0.15
      type: scalar
    behind_distance:
      binds_to:
      - mode: replace
        path: target.offset_along_axis.distance
      default: 0.05
      range:
      - 0.01
      - 0.15
      type: scalar
  subtask_id: behind_object
  target:
    anchor: task_object
    offset:
    - 0.0
    - 0.0
    - 0.025
    offset_along_axis:
      axis: task_goal_direction
      distance: 0.05
      mode: replace_offset_projection
      sign: negative
    orientation:
      mode: keep_current
    source: yaml
    tolerance: 0.01
  termination: pose_tolerance
  type: approach
- control: admittance_control
  generator: linear_cartesian
  guards:
  - args: {}
    id: contact_lost_guard
    on_failure: retry
    predicate: force_below
    threshold: 1.5
    when: during_phase
  id: push_1
  parameters:
    contact_force_threshold:
      binds_to:
      - mode: replace
        path: guards.contact_lost_guard.threshold
      default: 1.5
      range:
      - 0.5
      - 5.0
      type: scalar
    push_distance:
      binds_to:
      - mode: replace
        path: target.offset_along_axis.distance
      default: 0.2
      range:
      - 0.05
      - 0.3
      type: scalar
    push_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.05
      range:
      - 0.01
      - 0.1
      type: scalar
    retry_offset_x:
      binds_to:
      - mode: replace
        path: retry.offset.x
      default: 0.0
      range:
      - -0.02
      - 0.02
      type: scalar
    retry_offset_y:
      binds_to:
      - mode: replace
        path: retry.offset.y
      default: 0.0
      range:
      - -0.02
      - 0.02
      type: scalar
  retries:
    max_attempts: 2
    offset:
    - 0.0
    - 0.0
    - 0.0
    strategy: offset_target
  subtask_id: push_to_goal
  target:
    anchor: task_goal
    offset:
    - 0.0
    - 0.0
    - 0.0
    offset_along_axis:
      axis: task_goal_direction
      distance: 0.2
      mode: add_to_offset
      sign: positive
    orientation:
      mode: keep_current
    source: yaml
    tolerance: 0.02
  termination: pose_tolerance
  type: push
skill: push_to_goal
skill_type: arm_gripper
subtasks:
- anchor: object
  id: behind_object
  metric: distance
  offset:
  - 0.0
  - 0.0
  - 0.0
  target_entity: tcp
  weight: 0.2
- anchor: goal
  id: push_to_goal
  metric: distance
  offset:
  - 0.0
  - 0.0
  - 0.0
  target_entity: tcp
  weight: 0.8
