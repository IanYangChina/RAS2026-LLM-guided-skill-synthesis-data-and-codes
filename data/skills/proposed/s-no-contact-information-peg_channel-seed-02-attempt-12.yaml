dsl_version: 2
phases:
- control: position_control
  generator: linear_cartesian
  id: approach_high
  parameters:
    approach_y_offset:
      binds_to:
      - mode: replace
        path: target.offset.y
      default: 0.18
      range:
      - 0.15
      - 0.25
      type: scalar
    approach_z_offset:
      binds_to:
      - mode: replace
        path: target.offset.z
      default: 0.12
      range:
      - 0.08
      - 0.15
      type: scalar
  subtask_id: pre_push
  target:
    anchor: task_object
    entity: peg
    offset:
    - 0.0
    - 0.18
    - 0.12
    source: yaml
  termination: pose_tolerance
  type: approach
- control: position_control
  generator: linear_cartesian
  id: lateral_align
  parameters:
    lateral_y_offset:
      binds_to:
      - mode: replace
        path: target.offset.y
      default: 0.05
      range:
      - 0.0
      - 0.1
      type: scalar
  subtask_id: pre_push
  target:
    anchor: task_object
    entity: peg
    offset:
    - 0.0
    - 0.05
    - 0.08
    source: yaml
  termination: pose_tolerance
  type: align
- control: position_control
  generator: linear_cartesian
  id: vertical_descend
  parameters:
    descend_z_offset:
      binds_to:
      - mode: replace
        path: target.offset.z
      default: 0.0
      range:
      - -0.01
      - 0.01
      type: scalar
  subtask_id: pre_push
  target:
    anchor: task_object
    entity: peg
    offset:
    - 0.0
    - 0.05
    - 0.0
    source: yaml
  termination: pose_tolerance
  type: descend
- control: impedance_control
  generator: linear_cartesian
  guards:
  - id: progress_check
    on_failure: continue
    predicate: object_progress
    threshold: 0.12
    when: during_phase
  id: push_through_channel
  parameters:
    force_threshold:
      binds_to:
      - mode: replace
        path: termination.force_threshold
      default: 35.0
      range:
      - 20.0
      - 40.0
      type: scalar
    push_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.06
      range:
      - 0.02
      - 0.15
      type: scalar
  retries:
    max_attempts: 2
    offset:
    - 0.0
    - 0.01
    - 0.0
    strategy: offset_target
  subtask_id: final_push
  target:
    anchor: task_object
    offset:
    - 0.0
    - 0.0
    - 0.0
    offset_along_axis:
      axis: channel_axis
      distance: 0.16
      mode: replace_offset_projection
    orientation:
      align_with: channel_axis
      axis:
      - 0.0
      - 0.0
      - 1.0
      mode: align_axis
      tolerance: 0.1
    source: yaml
  termination: force_exceeded
  type: push
skill: peg_channel
subtasks:
- anchor: object
  id: pre_push
  metric: distance
  offset:
  - 0.0
  - 0.18
  - 0.08
  target_entity: tcp
  weight: 0.3
- anchor: goal
  id: final_push
  metric: goal_progress
  target_entity: tcp
  weight: 0.7
