dsl_version: 2
phases:
- control: position_control
  generator: linear_cartesian
  id: approach
  parameters:
    approach_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.2
      range:
      - 0.1
      - 0.5
      type: scalar
  subtask_id: pre_contact
  target:
    anchor: task_object
    offset:
    - 0.0
    - 0.0
    - 0.1
    orientation:
      align_with: task_goal_direction
      axis:
      - 1.0
      - 0.0
      - 0.0
      mode: align_axis
      tolerance: 0.1
    source: yaml
    tolerance: 0.02
  termination: pose_tolerance
  type: approach
- control: force_threshold_switch
  generator: linear_cartesian
  id: descend
  parameters:
    descend_force_threshold:
      binds_to:
      - mode: replace
        path: termination.force_threshold
      default: 5.0
      range:
      - 2.0
      - 10.0
      type: scalar
  subtask_id: contact
  target:
    anchor: task_object
    offset:
    - 0.0
    - 0.0
    - 0.03
    offset_along_axis:
      axis: world_z
      distance: 0.03
      mode: add_to_offset
      sign: negative
    orientation:
      mode: keep_current
    source: yaml
  termination: force_exceeded
  type: contact
- control: impedance_control
  generator: impedance_motion
  guards:
  - args: {}
    id: push_contact_guard
    on_failure: retry
    predicate: contact_detected
    threshold: 0.5
    when: during_phase
  id: push
  parameters:
    push_distance:
      binds_to:
      - mode: replace
        path: target.offset_along_axis.distance
      default: 0.15
      range:
      - 0.05
      - 0.25
      type: scalar
    push_tolerance:
      binds_to:
      - mode: replace
        path: termination.pose_tolerance
      default: 0.01
      range:
      - 0.005
      - 0.03
      type: scalar
  retries:
    max_attempts: 1
    offset:
    - 0.0
    - 0.02
    - 0.0
    strategy: offset_target
  subtask_id: push_progress
  target:
    anchor: task_object
    offset:
    - 0.0
    - 0.0
    - 0.0
    offset_along_axis:
      axis: task_goal_direction
      distance: 0.15
      mode: replace_offset_projection
    orientation:
      align_with: task_goal_direction
      axis:
      - 1.0
      - 0.0
      - 0.0
      mode: align_axis
      tolerance: 0.1
    source: yaml
  termination: pose_tolerance
  type: push
skill: push_to_goal
subtasks:
- anchor: object
  id: pre_contact
  metric: distance
  offset:
  - 0.0
  - 0.0
  - 0.05
  target_entity: tcp
  weight: 0.1
- anchor: object
  id: contact
  metric: contact
  target_entity: tcp
  weight: 0.2
- anchor: goal
  id: push_progress
  metric: goal_progress
  target_entity: object
  weight: 0.7
