skill: peg_insert
dsl_version: 2
phases:
- id: align_1
  type: align
  generator: linear_cartesian
  control: position_control
  termination: pose_tolerance
  target:
    source: yaml
    anchor: fixture
    entity: peg_socket
    offset: [0.0, 0.0, 0.12]
    orientation:
      mode: align_axis
      axis: [0.0, 0.0, 1.0]
      align_with: channel_axis
      tolerance: 0.1
  parameters:
    speed:
      type: scalar
      range: [0.01, 0.1]
      default: 0.05
      binds_to:
      - path: generator.speed
        mode: replace
- id: approach_1
  type: approach
  generator: linear_cartesian
  control: position_control
  termination: pose_tolerance
  target:
    source: yaml
    anchor: fixture
    entity: peg_socket
    offset: [0.0, 0.0, 0.08]
    orientation:
      mode: keep_current
  parameters:
    speed:
      type: scalar
      range: [0.005, 0.03]
      default: 0.01
      binds_to:
      - path: generator.speed
        mode: replace
- id: contact_1
  type: contact
  generator: linear_cartesian
  control: force_threshold_switch
  termination: force_exceeded
  target:
    source: yaml
    anchor: fixture
    entity: peg_socket
    offset: [0.0, 0.0, 0.06]
    orientation:
      mode: keep_current
  parameters:
    contact_force:
      type: scalar
      range: [1.0, 20.0]
      default: 3.0
      binds_to:
      - path: termination.force_threshold
        mode: replace
- id: insert_1
  type: insert
  generator: linear_cartesian
  control: admittance_control
  termination: pose_tolerance
  target:
    source: yaml
    anchor: fixture
    entity: peg_socket
    offset: [0.0, 0.0, 0.08]
    offset_along_axis:
      distance: 0.05
      axis: channel_axis
      mode: add_to_offset
      sign: negative
    orientation:
      mode: keep_current
  parameters:
    insertion_depth:
      type: scalar
      range: [0.02, 0.12]
      default: 0.05
      binds_to:
      - path: target.offset_along_axis.distance
        mode: replace
    force_limit:
      type: scalar
      range: [5.0, 30.0]
      default: 20.0
      binds_to:
      - path: guards.insert_force_guard.threshold
        mode: replace
  guards:
  - id: insert_force_guard
    when: during_phase
    predicate: force_below
    args: {}
    threshold: 20.0
    on_failure: abort
  retries:
    max_attempts: 2
    strategy: reduce_speed
- id: retract_1
  type: retract
  generator: linear_cartesian
  control: position_control
  termination: pose_tolerance
  target:
    source: yaml
    anchor: fixture
    entity: peg_socket
    offset: [0.0, 0.0, 0.15]
    orientation:
      mode: keep_current
  parameters:
    speed:
      type: scalar
      range: [0.01, 0.1]
      default: 0.05
      binds_to:
      - path: generator.speed
        mode: replace
```