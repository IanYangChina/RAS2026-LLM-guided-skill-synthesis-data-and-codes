dsl_version: 2
phases:
- control: position_control
  generator: linear_cartesian
  id: approach_door
  parameters:
    approach_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.05
      range:
      - 0.01
      - 0.1
      type: scalar
  subtask_id: push_door
  target:
    anchor: task_goal
    offset:
    - 0.0
    - 0.0
    - 0.0
    source: yaml
  termination: pose_tolerance
  type: approach
- control: impedance_control
  generator: linear_cartesian
  guards:
  - args: {}
    id: hinge_progress
    on_failure: continue
    predicate: hinge_delta_reached
    threshold: 0.5
    when: during_phase
  id: push_door
  parameters:
    force_threshold:
      binds_to:
      - mode: replace
        path: termination.force_threshold
      default: 20.0
      range:
      - 10.0
      - 30.0
      type: scalar
    hinge_angle_threshold:
      binds_to:
      - mode: replace
        path: guards.hinge_progress.threshold
      default: 0.5
      range:
      - 0.1
      - 1.0
      type: scalar
    push_distance:
      binds_to:
      - mode: replace
        path: target.offset_along_axis.distance
      default: 0.15
      range:
      - 0.05
      - 0.3
      type: scalar
    push_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.03
      range:
      - 0.01
      - 0.1
      type: scalar
  retries:
    max_attempts: 1
    offset:
    - 0.0
    - 0.02
    - 0.0
    strategy: offset_target
  subtask_id: push_door
  target:
    anchor: current_tcp
    offset:
    - 0.0
    - 0.0
    - 0.0
    offset_along_axis:
      axis: world_y
      distance: 0.15
      mode: add_to_offset
      sign: negative
    source: yaml
  termination: force_exceeded
  type: push
- control: position_control
  generator: linear_cartesian
  id: retract
  parameters:
    retract_distance:
      binds_to:
      - mode: replace
        path: target.offset_along_axis.distance
      default: 0.1
      range:
      - 0.05
      - 0.15
      type: scalar
    retract_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.05
      range:
      - 0.01
      - 0.1
      type: scalar
  target:
    anchor: current_tcp
    offset:
    - 0.0
    - 0.0
    - 0.0
    offset_along_axis:
      axis: world_y
      distance: 0.1
      mode: add_to_offset
      sign: positive
    source: yaml
  termination: time_limit
  type: retract
skill: door_push
skill_type: arm_gripper
subtasks:
- anchor: fixture
  id: push_door
  metric: hinge_angle
  target_entity: hinge
  weight: 1.0
