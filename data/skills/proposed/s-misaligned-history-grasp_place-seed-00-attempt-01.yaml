dsl_version: 2
phases:
- control: position_control
  generator: linear_cartesian
  id: approach_object
  orientation:
    mode: keep_current
  parameters:
    approach_height:
      binds_to:
      - mode: replace
        path: target.offset.z
      default: 0.1
      range:
      - 0.05
      - 0.15
      type: scalar
    approach_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.1
      range:
      - 0.05
      - 0.2
      type: scalar
  subtask_id: reach_object
  target:
    anchor: task_object
    offset:
    - 0.0
    - 0.0
    - 0.1
    source: yaml
  termination: pose_tolerance
  type: approach
- control: position_control
  generator: linear_cartesian
  id: descend_to_grasp
  orientation:
    mode: keep_current
  parameters:
    descend_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.05
      range:
      - 0.02
      - 0.1
      type: scalar
    grasp_offset_z:
      binds_to:
      - mode: replace
        path: target.offset.z
      default: 0.03
      range:
      - 0.02
      - 0.04
      type: scalar
  subtask_id: grasp_lift
  target:
    anchor: task_object
    offset:
    - 0.0
    - 0.0
    - 0.03
    source: yaml
  termination: pose_tolerance
  type: descend
- control: admittance_control
  end_effector_action: force_grasp
  generator: null
  guards:
  - id: bilateral_grasp
    on_failure: retry
    predicate: bilateral_grasp
    threshold: 1.0
    when: after_phase
  id: grasp
  orientation:
    mode: keep_current
  parameters:
    grasp_force:
      binds_to:
      - mode: replace
        path: guards.bilateral_grasp.threshold
      default: 1.0
      range:
      - 0.5
      - 2.0
      type: scalar
  retries:
    max_attempts: 2
    strategy: reduce_speed
  target:
    anchor: current_tcp
    source: yaml
  termination: grasp_success
  type: grasp
- control: position_control
  generator: linear_cartesian
  id: lift
  orientation:
    mode: keep_current
  parameters:
    lift_height:
      binds_to:
      - mode: replace
        path: target.offset.z
      default: 0.12
      range:
      - 0.08
      - 0.2
      type: scalar
    lift_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.05
      range:
      - 0.02
      - 0.1
      type: scalar
  subtask_id: grasp_lift
  target:
    anchor: task_object
    offset:
    - 0.0
    - 0.0
    - 0.12
    source: yaml
  termination: pose_tolerance
  type: lift
- control: position_control
  generator: linear_cartesian
  id: approach_goal
  orientation:
    mode: keep_current
  parameters:
    approach_goal_height:
      binds_to:
      - mode: replace
        path: target.offset.z
      default: 0.1
      range:
      - 0.05
      - 0.15
      type: scalar
    transport_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.1
      range:
      - 0.05
      - 0.2
      type: scalar
  subtask_id: reach_goal
  target:
    anchor: task_goal
    offset:
    - 0.0
    - 0.0
    - 0.1
    source: yaml
  termination: pose_tolerance
  type: approach
- control: position_control
  generator: linear_cartesian
  id: descend_to_place
  orientation:
    mode: keep_current
  parameters:
    place_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.05
      range:
      - 0.02
      - 0.1
      type: scalar
  subtask_id: reach_goal
  target:
    anchor: task_goal
    offset:
    - 0.0
    - 0.0
    - 0.0
    source: yaml
  termination: pose_tolerance
  type: descend
- control: position_control
  end_effector_action: open
  generator: null
  id: release
  orientation:
    mode: keep_current
  parameters:
    release_duration:
      binds_to:
      - mode: replace
        path: duration.max_time
      default: 1.0
      range:
      - 0.5
      - 2.0
      type: scalar
  target:
    anchor: current_tcp
    source: yaml
  termination: time_limit
  type: release
- control: position_control
  generator: linear_cartesian
  id: retract
  orientation:
    mode: keep_current
  parameters:
    retract_height:
      binds_to:
      - mode: replace
        path: target.offset.z
      default: 0.15
      range:
      - 0.1
      - 0.25
      type: scalar
    retract_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.1
      range:
      - 0.05
      - 0.2
      type: scalar
  target:
    anchor: task_goal
    offset:
    - 0.0
    - 0.0
    - 0.15
    source: yaml
  termination: pose_tolerance
  type: retract
skill: grasp_place
subtasks:
- anchor: object
  id: reach_object
  metric: distance
  offset:
  - 0.0
  - 0.0
  - 0.1
  target_entity: tcp
  weight: 0.3
- anchor: object
  id: grasp_lift
  metric: distance
  offset:
  - 0.0
  - 0.0
  - 0.03
  target_entity: tcp
  weight: 0.3
- anchor: goal
  id: reach_goal
  metric: distance
  offset:
  - 0.0
  - 0.0
  - 0.0
  target_entity: tcp
  weight: 0.4
