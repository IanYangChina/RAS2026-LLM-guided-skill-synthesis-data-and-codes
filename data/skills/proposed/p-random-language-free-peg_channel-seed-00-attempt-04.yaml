dsl_version: 2
phases:
- control: position_control
  generator: linear_cartesian
  id: approach_1
  parameters:
    approach_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.05
      range:
      - 0.01
      - 0.1
      type: scalar
  subtask_id: reach_pre_contact
  target:
    anchor: task_object
    entity: peg
    offset:
    - 0.0
    - 0.06
    - 0.1
    orientation:
      mode: keep_current
    source: yaml
  termination: pose_tolerance
  type: approach
- control: force_threshold_switch
  generator: linear_cartesian
  id: descend_1
  parameters:
    contact_force_threshold:
      binds_to:
      - mode: replace
        path: termination.force_threshold
      default: 5.0
      range:
      - 2.0
      - 15.0
      type: scalar
    descend_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.03
      range:
      - 0.01
      - 0.05
      type: scalar
  subtask_id: reach_pre_contact
  target:
    anchor: task_object
    entity: peg
    offset:
    - 0.0
    - 0.02
    - 0.025
    orientation:
      mode: keep_current
    source: yaml
  termination: force_exceeded
  type: descend
- control: impedance_control
  generator: linear_cartesian
  guards:
  - args: {}
    id: push_force_guard
    on_failure: retry
    predicate: force_below
    threshold: 45.0
    when: during_phase
  id: push_1
  parameters:
    push_distance:
      binds_to:
      - mode: replace
        path: target.offset_along_axis.distance
      default: 0.16
      range:
      - 0.1
      - 0.2
      type: scalar
    push_force_threshold:
      binds_to:
      - mode: replace
        path: termination.force_threshold
      default: 35.0
      range:
      - 20.0
      - 40.0
      type: scalar
    push_lateral_offset:
      binds_to:
      - mode: add
        path: retry.offset.x
      default: 0.0
      range:
      - -0.01
      - 0.01
      type: scalar
    push_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.02
      range:
      - 0.01
      - 0.05
      type: scalar
  retries:
    max_attempts: 2
    offset:
    - 0.0
    - 0.0
    - 0.0
    strategy: offset_target
  subtask_id: push_to_goal
  target:
    anchor: current_tcp
    offset_along_axis:
      axis: channel_axis
      distance: 0.16
      mode: replace_offset_projection
    orientation:
      align_with: channel_axis
      axis:
      - 0.0
      - 0.0
      - -1.0
      mode: align_axis
      tolerance: 0.1
    source: yaml
  termination: force_exceeded
  type: push
skill: peg_channel
subtasks:
- anchor: object
  id: reach_pre_contact
  metric: distance
  offset:
  - 0.0
  - 0.02
  - 0.05
  target_entity: tcp
  weight: 0.3
- anchor: goal
  id: push_to_goal
  metric: goal_progress
  offset:
  - 0.0
  - 0.0
  - 0.02
  target_entity: tcp
  weight: 0.7
