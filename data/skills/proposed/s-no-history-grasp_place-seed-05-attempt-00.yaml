dsl_version: 2
phases:
- control: position_control
  generator: linear_cartesian
  guards: []
  id: approach_object
  parameters:
    approach_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.15
      range:
      - 0.05
      - 0.3
      type: scalar
  retries:
    max_attempts: 0
  subtask_id: reach_object
  target:
    anchor: task_object
    entity: grasp_target
    offset:
    - 0.0
    - 0.0
    - 0.12
    orientation:
      mode: keep_current
    source: yaml
    tolerance: 0.02
  termination: pose_tolerance
  type: approach
- control: impedance_control
  generator: linear_cartesian
  guards:
  - args: {}
    id: contact_before_grasp
    on_failure: continue
    predicate: contact_detected
    threshold: 1
    when: during_phase
  id: descend_to_grasp
  parameters:
    descend_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.08
      range:
      - 0.02
      - 0.15
      type: scalar
  retries:
    max_attempts: 0
  target:
    anchor: task_object
    entity: grasp_target
    offset:
    - 0.0
    - 0.0
    - 0.0
    orientation:
      mode: keep_current
    source: yaml
    tolerance: 0.01
  termination: pose_tolerance
  type: descend
- control: position_control
  end_effector_action: force_grasp
  generator: null
  guards:
  - args: {}
    id: grasp_check
    on_failure: retry
    predicate: bilateral_grasp
    threshold: 1.0
    when: after_phase
  id: grasp_object
  parameters:
    grip_force:
      binds_to:
      - mode: replace
        path: guards.grasp_check.threshold
      default: 15.0
      range:
      - 5.0
      - 30.0
      type: scalar
  retries:
    max_attempts: 2
    offset:
    - 0.0
    - 0.0
    - -0.005
    strategy: offset_target
  target:
    anchor: current_tcp
    entity: null
    offset:
    - 0.0
    - 0.0
    - 0.0
    source: yaml
  termination: time_limit
  type: grasp
- control: impedance_control
  generator: linear_cartesian
  guards:
  - args:
      height: 0.05
      object: grasp_target
    id: lifted_check
    on_failure: retry
    predicate: object_lifted
    threshold: 1
    when: after_phase
  id: lift_object
  parameters:
    lift_height:
      binds_to:
      - mode: replace
        path: target.offset.z
      default: 0.1
      range:
      - 0.05
      - 0.15
      type: scalar
    lift_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.06
      range:
      - 0.02
      - 0.15
      type: scalar
  retries:
    max_attempts: 1
    offset:
    - 0.0
    - 0.0
    - 0.0
    strategy: reduce_speed
  target:
    anchor: task_object
    entity: grasp_target
    offset:
    - 0.0
    - 0.0
    - 0.1
    orientation:
      mode: keep_current
    source: yaml
    tolerance: 0.02
  termination: pose_tolerance
  type: lift
- control: position_control
  generator: arc_cartesian
  guards: []
  id: transport_to_goal
  parameters:
    arc_height:
      binds_to:
      - mode: replace
        path: generator.arc_height
      default: 0.15
      range:
      - 0.05
      - 0.25
      type: scalar
    transport_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.12
      range:
      - 0.05
      - 0.3
      type: scalar
  retries:
    max_attempts: 0
  subtask_id: approach_goal
  target:
    anchor: task_goal
    entity: null
    offset:
    - 0.0
    - 0.0
    - 0.12
    orientation:
      mode: keep_current
    source: yaml
    tolerance: 0.02
  termination: pose_tolerance
  type: approach
- control: impedance_control
  generator: linear_cartesian
  guards:
  - args: {}
    id: contact_during_place
    on_failure: continue
    predicate: contact_detected
    threshold: 1
    when: during_phase
  id: descend_place
  parameters:
    place_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.04
      range:
      - 0.02
      - 0.1
      type: scalar
  retries:
    max_attempts: 0
  subtask_id: place_at_goal
  target:
    anchor: task_goal
    entity: null
    offset:
    - 0.0
    - 0.0
    - 0.0
    orientation:
      mode: keep_current
    source: yaml
    tolerance: 0.01
  termination: pose_tolerance
  type: descend
- control: position_control
  end_effector_action: open
  generator: null
  guards: []
  id: release_object
  parameters:
    release_time:
      binds_to:
      - mode: replace
        path: termination.time_limit
      default: 0.5
      range:
      - 0.1
      - 1.0
      type: scalar
  retries:
    max_attempts: 0
  target:
    anchor: current_tcp
    entity: null
    offset:
    - 0.0
    - 0.0
    - 0.0
    source: yaml
  termination: time_limit
  type: release
- control: position_control
  generator: linear_cartesian
  guards: []
  id: retract_after_place
  parameters:
    retract_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.15
      range:
      - 0.05
      - 0.3
      type: scalar
  retries:
    max_attempts: 0
  target:
    anchor: task_goal
    entity: null
    offset:
    - 0.0
    - 0.0
    - 0.15
    orientation:
      mode: keep_current
    source: yaml
    tolerance: 0.02
  termination: pose_tolerance
  type: retract
skill: grasp_place
skill_type: arm_gripper
subtasks:
- anchor: object
  id: reach_object
  metric: distance
  offset:
  - 0.0
  - 0.0
  - 0.1
  target_entity: tcp
  weight: 0.2
- anchor: goal
  id: approach_goal
  metric: distance
  offset:
  - 0.0
  - 0.0
  - 0.1
  target_entity: tcp
  weight: 0.2
- anchor: goal
  id: place_at_goal
  metric: distance
  offset:
  - 0.0
  - 0.0
  - 0.0
  target_entity: object
  weight: 0.6
