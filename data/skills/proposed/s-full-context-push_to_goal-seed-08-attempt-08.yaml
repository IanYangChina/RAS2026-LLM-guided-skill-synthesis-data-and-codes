dsl_version: 2
phases:
- control: position_control
  generator: arc_cartesian
  id: approach_above
  parameters:
    approach_tolerance:
      binds_to:
      - mode: replace
        path: termination.pose_tolerance
      default: 0.015
      range:
      - 0.005
      - 0.03
      type: scalar
    speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.2
      range:
      - 0.05
      - 0.5
      type: scalar
    y_offset_approach:
      binds_to:
      - mode: replace
        path: target.offset.y
      default: 0.03
      range:
      - 0.0
      - 0.1
      type: scalar
  subtask_id: pre_contact
  target:
    anchor: task_object
    offset:
    - 0.0
    - 0.03
    - 0.1
    source: yaml
  termination: pose_tolerance
  type: approach
- control: position_control
  generator: linear_cartesian
  id: descend_contact
  parameters:
    descend_tolerance:
      binds_to:
      - mode: replace
        path: termination.pose_tolerance
      default: 0.01
      range:
      - 0.003
      - 0.02
      type: scalar
    speed_descend:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.06
      range:
      - 0.02
      - 0.12
      type: scalar
    y_offset_descend:
      binds_to:
      - mode: replace
        path: target.offset.y
      default: 0.03
      range:
      - 0.0
      - 0.1
      type: scalar
  subtask_id: pre_contact
  target:
    anchor: task_object
    offset:
    - 0.0
    - 0.03
    - 0.0
    source: yaml
  termination: pose_tolerance
  type: descend
- control: impedance_control
  generator: linear_cartesian
  id: push_to_goal
  parameters:
    force_threshold_push:
      binds_to:
      - mode: replace
        path: termination.force_threshold
      default: 15.0
      range:
      - 5.0
      - 22.0
      type: scalar
    speed_push:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.15
      range:
      - 0.02
      - 0.3
      type: scalar
  subtask_id: push_goal
  target:
    anchor: task_goal
    offset:
    - 0.0
    - 0.0
    - 0.0
    source: yaml
  termination: force_exceeded
  type: push
skill: push_to_goal
subtasks:
- anchor: object
  id: pre_contact
  offset:
  - 0.0
  - 0.03
  - 0.05
  weight: 0.3
- id: push_goal
  metric: goal_progress
  target_entity: object
  weight: 0.7
