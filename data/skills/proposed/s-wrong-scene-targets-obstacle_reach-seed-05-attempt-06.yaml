dsl_version: 2
phases:
- control: position_control
  generator: arc_cartesian
  id: approach_over_obstacle
  parameters:
    approach_tolerance:
      binds_to:
      - mode: add
        path: termination.pose_tolerance
      default: 0.03
      range:
      - 0.01
      - 0.05
      type: scalar
    arc_height:
      binds_to:
      - mode: add
        path: generator.arc_height
      default: 0.15
      range:
      - 0.05
      - 0.3
      type: scalar
    speed:
      binds_to:
      - mode: add
        path: generator.speed
      default: 0.08
      range:
      - 0.01
      - 0.2
      type: scalar
  subtask_id: reach_goal
  target:
    anchor: task_goal
    offset:
    - 0.0
    - 0.0
    - 0.25
    source: yaml
  termination: pose_tolerance
  type: approach
- control: force_threshold_switch
  generator: linear_cartesian
  id: descend_contact
  parameters:
    desc_speed:
      binds_to:
      - mode: add
        path: generator.speed
      default: 0.03
      range:
      - 0.005
      - 0.1
      type: scalar
    force_threshold:
      binds_to:
      - mode: add
        path: termination.force_threshold
      default: 3.0
      range:
      - 1.0
      - 5.0
      type: scalar
  subtask_id: reach_goal
  target:
    anchor: task_goal
    offset:
    - 0.0
    - 0.0
    - 0.0
    source: yaml
  termination: force_exceeded
  type: descend
- control: impedance_control
  generator: linear_cartesian
  id: push_to_goal
  parameters:
    push_speed:
      binds_to:
      - mode: add
        path: generator.speed
      default: 0.015
      range:
      - 0.005
      - 0.05
      type: scalar
    push_tolerance:
      binds_to:
      - mode: add
        path: termination.pose_tolerance
      default: 0.01
      range:
      - 0.005
      - 0.02
      type: scalar
  subtask_id: reach_goal
  target:
    anchor: task_goal
    offset:
    - 0.0
    - 0.0
    - 0.0
    source: yaml
  termination: pose_tolerance
  type: push
skill: obstacle_reach
subtasks:
- anchor: goal
  id: reach_goal
  metric: distance
  offset:
  - 0.0
  - 0.0
  - 0.0
  target_entity: tcp
  weight: 1.0
