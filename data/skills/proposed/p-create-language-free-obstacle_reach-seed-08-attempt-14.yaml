dsl_version: 2
phases:
- control: position_control
  generator: linear_cartesian
  id: approach_1
  parameters:
    speed_scale:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.35
      range:
      - 0.2
      - 0.6
      type: scalar
  subtask_id: reach_standoff
  target:
    anchor: task_goal
    offset:
    - 0.0
    - 0.0
    - 0.2
    orientation:
      mode: keep_current
    source: yaml
    tolerance: 0.02
  termination: pose_tolerance
  type: approach
- control: position_control
  generator: linear_cartesian
  id: descend_1
  parameters:
    speed_scale:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.5
      range:
      - 0.3
      - 0.9
      type: scalar
  subtask_id: reach_goal
  target:
    anchor: task_goal
    offset:
    - 0.0
    - 0.0
    - 0.0
    orientation:
      mode: keep_current
    source: yaml
    tolerance: 0.02
  termination: pose_tolerance
  type: descend
- control: position_control
  generator: linear_cartesian
  id: fine_approach
  parameters:
    speed_scale:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.2
      range:
      - 0.1
      - 0.4
      type: scalar
  subtask_id: reach_goal
  target:
    anchor: task_goal
    offset:
    - 0.0
    - 0.0
    - 0.0
    orientation:
      mode: keep_current
    source: yaml
    tolerance: 0.005
  termination: pose_tolerance
  type: descend
skill: obstacle_reach
subtasks:
- anchor: goal
  id: reach_standoff
  offset:
  - 0.0
  - 0.0
  - 0.2
  target_entity: tcp
  weight: 0.2
- anchor: goal
  id: reach_goal
  target_entity: tcp
  weight: 0.8
