dsl_version: 2
phases:
- control: position_control
  generator: linear_cartesian
  id: align_1
  retries:
    max_attempts: 0
    strategy: repeat
  subtask_id: approach
  target:
    anchor: task_object
    entity: peg
    offset:
    - 0.0
    - 0.04
    - 0.05
    orientation:
      mode: keep_current
    source: yaml
    tolerance: 0.02
  termination: pose_tolerance
  type: approach
- control: position_control
  generator: linear_cartesian
  id: approach_1
  parameters:
    lateral_offset_x:
      binds_to:
      - mode: replace
        path: target.offset.x
      default: 0.0
      range:
      - -0.01
      - 0.01
      type: scalar
    lateral_offset_y:
      binds_to:
      - mode: replace
        path: target.offset.y
      default: 0.0
      range:
      - -0.01
      - 0.01
      type: scalar
    speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.05
      range:
      - 0.01
      - 0.1
      type: scalar
  subtask_id: contact
  target:
    anchor: task_object
    entity: peg
    offset:
    - 0.0
    - 0.02
    - 0.02
    orientation:
      mode: keep_current
    source: yaml
    tolerance: 0.01
  termination: pose_tolerance
  type: approach
- control: force_threshold_switch
  generator: linear_cartesian
  id: contact_1
  parameters:
    contact_force_threshold:
      binds_to:
      - mode: replace
        path: termination.force_threshold
      default: 5.0
      range:
      - 2.0
      - 15.0
      type: scalar
  retries:
    max_attempts: 0
    strategy: repeat
  target:
    anchor: task_object
    entity: peg
    offset:
    - 0.0
    - 0.02
    - 0.02
    offset_along_axis:
      axis: world_y
      distance: 0.04
      mode: add_to_offset
      sign: negative
    orientation:
      mode: keep_current
    source: yaml
  termination: force_exceeded
  type: contact
- control: impedance_control
  generator: linear_cartesian
  id: push_1
  parameters:
    push_stroke:
      binds_to:
      - mode: replace
        path: target.offset_along_axis.distance
      default: 0.16
      range:
      - 0.12
      - 0.2
      type: scalar
    speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.05
      range:
      - 0.02
      - 0.1
      type: scalar
  retries:
    max_attempts: 0
    strategy: repeat
  target:
    anchor: task_object
    entity: peg
    offset:
    - 0.0
    - 0.0
    - 0.02
    offset_along_axis:
      axis: channel_axis
      distance: 0.16
      mode: add_to_offset
      sign: negative
    orientation:
      mode: keep_current
    source: yaml
    tolerance: 0.02
  termination: pose_tolerance
  type: push
- control: position_control
  generator: linear_cartesian
  id: backoff_1
  parameters:
    backoff_distance:
      binds_to:
      - mode: replace
        path: target.offset.y
      default: 0.05
      range:
      - 0.02
      - 0.1
      type: scalar
    speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.05
      range:
      - 0.01
      - 0.1
      type: scalar
  target:
    anchor: current_tcp
    offset:
    - 0.0
    - 0.05
    - 0.0
    orientation:
      mode: none
    source: yaml
    tolerance: 0.02
  termination: pose_tolerance
  type: retract
- control: position_control
  generator: arc_cartesian
  id: lift_1
  parameters:
    retract_height:
      binds_to:
      - mode: replace
        path: target.offset.z
      default: 0.15
      range:
      - 0.05
      - 0.2
      type: scalar
    speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.05
      range:
      - 0.01
      - 0.1
      type: scalar
  target:
    anchor: current_tcp
    offset:
    - 0.0
    - 0.0
    - 0.15
    orientation:
      mode: none
    source: yaml
    tolerance: 0.05
  termination: pose_tolerance
  type: retract
skill: peg_channel
subtasks:
- anchor: object
  id: approach
  offset:
  - 0.0
  - 0.04
  - 0.0
- anchor: object
  id: contact
  offset:
  - 0.0
  - 0.02
  - 0.0
- anchor: world
  id: push
  offset:
  - 0.5
  - -0.08
  - 0.04
