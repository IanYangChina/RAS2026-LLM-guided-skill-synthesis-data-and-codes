dsl_version: 2
phases:
- control: position_control
  generator: arc_cartesian
  id: approach_arc
  parameters:
    arc_height:
      binds_to:
      - mode: replace
        path: generator.arc_height
      default: 0.08
      range:
      - 0.02
      - 0.15
      type: scalar
  retries:
    max_attempts: 1
    offset:
    - 0.0
    - 0.0
    - 0.01
    strategy: offset_target
  subtask_id: approach_obstacle_clear
  target:
    anchor: fixture
    offset:
    - 0.0
    - 0.0
    - 0.35
    orientation:
      mode: none
    source: yaml
    tolerance: 0.02
  termination: pose_tolerance
  type: approach
- control: impedance_control
  generator: linear_cartesian
  guards:
  - args: {}
    id: descend_progress
    on_failure: retry
    predicate: force_below
    threshold: 4.0
    when: during_phase
  id: descend_to_goal
  retries:
    max_attempts: 2
    offset:
    - 0.0
    - 0.0
    - -0.02
    strategy: offset_target
  subtask_id: reach_goal
  target:
    anchor: task_goal
    offset:
    - 0.0
    - 0.0
    - 0.0
    orientation:
      align_with: world_z
      axis:
      - 0.0
      - 0.0
      - 1.0
      mode: align_axis
      tolerance: 0.05
    source: yaml
    tolerance: 0.02
  termination: pose_tolerance
  type: descend
skill: obstacle_reach
skill_type: arm_gripper
subtasks:
- anchor: fixture
  id: approach_obstacle_clear
  metric: distance
  offset:
  - 0.0
  - 0.0
  - 0.35
  target_entity: tcp
  weight: 0.3
- anchor: goal
  id: reach_goal
  metric: distance
  offset:
  - 0.0
  - 0.0
  - 0.0
  target_entity: tcp
  weight: 0.7
