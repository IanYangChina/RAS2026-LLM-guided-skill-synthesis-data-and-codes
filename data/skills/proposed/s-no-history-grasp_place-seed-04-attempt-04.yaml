dsl_version: 2
phases:
- control: position_control
  generator: linear_cartesian
  guards:
  - args: {}
    id: approach_contact
    on_failure: continue
    predicate: contact_detected
    threshold: 1
    when: during_phase
  id: approach_object_1
  parameters:
    approach_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.2
      range:
      - 0.02
      - 0.6
      type: scalar
  subtask_id: approach_object
  target:
    anchor: task_object
    entity: grasp_target
    offset:
    - 0.0
    - 0.0
    - 0.12
    orientation:
      mode: keep_current
      tolerance: 0.05
    source: yaml
    tolerance: 0.02
  termination: pose_tolerance
  type: approach
- control: force_threshold_switch
  generator: linear_cartesian
  guards:
  - args: {}
    id: descend_contact
    on_failure: continue
    predicate: contact_detected
    threshold: 1
    when: during_phase
  id: descend_grasp_1
  parameters:
    descend_force:
      binds_to:
      - mode: replace
        path: termination.force_threshold
      default: 8.0
      range:
      - 1.0
      - 20.0
      type: scalar
    descend_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.08
      range:
      - 0.02
      - 0.3
      type: scalar
  retries:
    max_attempts: 2
    offset:
    - 0.0
    - 0.0
    - -0.005
    strategy: offset_target
  subtask_id: pre_grasp
  target:
    anchor: task_object
    entity: grasp_target
    offset:
    - 0.0
    - 0.0
    - -0.01
    orientation:
      align_with: world_z
      axis:
      - 0.0
      - 0.0
      - -1.0
      mode: align_axis
      tolerance: 0.05
    source: yaml
    tolerance: 0.005
  termination: force_exceeded
  type: descend
- control: null
  end_effector_action: force_grasp
  generator: null
  guards:
  - args: {}
    id: grasp_success
    on_failure: retry
    predicate: bilateral_grasp
    threshold: 1
    when: after_phase
  id: grasp_1
  parameters:
    grasp_duration:
      binds_to:
      - mode: replace
        path: duration.max_time
      default: 0.7
      range:
      - 0.2
      - 1.5
      type: scalar
  retries:
    max_attempts: 1
    strategy: reduce_speed
  subtask_id: pre_grasp
  target:
    anchor: current_tcp
    offset:
    - 0.0
    - 0.0
    - 0.0
    source: yaml
  termination: time_limit
  type: grasp
- control: position_control
  generator: linear_cartesian
  guards:
  - args: {}
    id: lift_check
    on_failure: retry
    predicate: object_lifted
    threshold: 0.05
    when: after_phase
  id: lift_1
  parameters:
    lift_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.15
      range:
      - 0.02
      - 0.4
      type: scalar
  retries:
    max_attempts: 1
    offset:
    - 0.0
    - 0.0
    - 0.02
    strategy: offset_target
  subtask_id: lift_clearance
  target:
    anchor: task_object
    entity: grasp_target
    offset:
    - 0.0
    - 0.0
    - 0.12
    orientation:
      mode: keep_current
      tolerance: 0.1
    source: yaml
    tolerance: 0.02
  termination: pose_tolerance
  type: lift
- control: position_control
  generator: linear_cartesian
  guards:
  - args: {}
    id: transport_contact
    on_failure: abort
    predicate: force_below
    threshold: 15.0
    when: during_phase
  id: approach_goal_1
  parameters:
    transport_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.3
      range:
      - 0.05
      - 0.8
      type: scalar
  subtask_id: approach_goal
  target:
    anchor: task_goal
    offset:
    - 0.0
    - 0.0
    - 0.05
    orientation:
      mode: keep_current
      tolerance: 0.1
    source: yaml
    tolerance: 0.02
  termination: pose_tolerance
  type: approach
- control: null
  end_effector_action: open
  generator: null
  guards:
  - args: {}
    id: release_complete
    on_failure: continue
    predicate: gripper_closed
    threshold: 0
    when: after_phase
  id: release_1
  parameters:
    release_duration:
      binds_to:
      - mode: replace
        path: duration.max_time
      default: 1.0
      range:
      - 0.3
      - 2.0
      type: scalar
  subtask_id: final_release
  target:
    anchor: current_tcp
    offset:
    - 0.0
    - 0.0
    - 0.0
    source: yaml
  termination: time_limit
  type: release
- control: position_control
  generator: linear_cartesian
  id: retract_1
  parameters:
    retract_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.2
      range:
      - 0.05
      - 0.5
      type: scalar
  target:
    anchor: current_tcp
    offset:
    - 0.0
    - 0.0
    - 0.0
    offset_along_axis:
      axis: world_z
      distance: 0.3
      mode: add_to_offset
      sign: positive
    orientation:
      mode: keep_current
      tolerance: 0.2
    source: yaml
    tolerance: 0.05
  termination: pose_tolerance
  type: retract
skill: grasp_place
skill_type: arm_gripper
subtasks:
- anchor: object
  id: approach_object
  metric: distance
  offset:
  - 0.0
  - 0.0
  - 0.1
  target_entity: tcp
  weight: 0.2
- anchor: object
  id: pre_grasp
  metric: distance
  offset:
  - 0.0
  - 0.0
  - 0.03
  target_entity: tcp
  weight: 0.3
- anchor: object
  id: lift_clearance
  metric: distance
  offset:
  - 0.0
  - 0.0
  - 0.15
  target_entity: tcp
  weight: 0.1
- anchor: goal
  id: approach_goal
  metric: distance
  offset:
  - 0.0
  - 0.0
  - 0.0
  target_entity: tcp
  weight: 0.2
- anchor: goal
  id: final_release
  metric: goal_progress
  target_entity: tcp
  weight: 0.2
