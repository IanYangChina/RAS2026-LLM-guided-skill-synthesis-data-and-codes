skill: push_to_goal
dsl_version: 2
skill_type: arm_gripper
subtasks:
- id: pre_contact
  anchor: object
  target_entity: tcp
  metric: distance
  offset: [0.0, 0.0, 0.1]
  weight: 0.2
- id: behind_alignment
  anchor: object
  target_entity: tcp
  metric: distance
  offset: [0.0, 0.0, 0.0]
  weight: 0.3
- id: push_complete
  anchor: goal
  target_entity: object
  metric: goal_progress
  weight: 0.5
phases:
- id: approach_above
  type: approach
  generator: linear_cartesian
  control: position_control
  termination: pose_tolerance
  target:
    source: yaml
    anchor: task_object
    entity: push_box
    offset: [0.0, 0.0, 0.1]
    tolerance: 0.05
    orientation:
      mode: none
  parameters:
    speed:
      type: scalar
      range: [0.02, 0.1]
      default: 0.05
      binds_to:
      - path: generator.speed
        mode: replace
    above_height:
      type: scalar
      range: [0.06, 0.15]
      default: 0.1
      binds_to:
      - path: target.offset.z
        mode: replace
  subtask_id: pre_contact
- id: align_behind
  type: approach
  generator: linear_cartesian
  control: position_control
  termination: pose_tolerance
  target:
    source: yaml
    anchor: task_object
    entity: push_box
    offset: [0.0, 0.0, 0.0]
    offset_along_axis:
      distance: 0.1
      axis: task_goal_direction
      mode: add_to_offset
      sign: negative
    tolerance: 0.04
    orientation:
      mode: none
  parameters:
    behind_distance:
      type: scalar
      range: [0.05, 0.15]
      default: 0.1
      binds_to:
      - path: target.offset_along_axis.distance
        mode: replace
    alignment_speed:
      type: scalar
      range: [0.02, 0.08]
      default: 0.04
      binds_to:
      - path: generator.speed
        mode: replace
  subtask_id: behind_alignment
- id: push_to_goal
  type: push
  generator: linear_cartesian
  control: admittance_control
  termination: pose_tolerance
  target:
    source: yaml
    anchor: task_goal
    entity: goal_marker
    offset: [0.0, 0.0, 0.0]
    offset_along_axis:
      distance: 0.15
      axis: task_goal_direction
      mode: add_to_offset
      sign: positive
    tolerance: 0.04
    orientation:
      mode: none
  parameters:
    push_distance:
      type: scalar
      range: [0.08, 0.25]
      default: 0.15
      binds_to:
      - path: target.offset_along_axis.distance
        mode: replace
    push_speed:
      type: scalar
      range: [0.01, 0.06]
      default: 0.03
      binds_to:
      - path: generator.speed
        mode: replace
    retry_offset_y:
      type: scalar
      range: [-0.015, 0.015]
      default: 0.0
      binds_to:
      - path: retry.offset.y
        mode: add
  guards:
  - id: contact_check
    when: during_phase
    predicate: contact_detected
    threshold: 1.0
    on_failure: retry
  retries:
    max_attempts: 2
    strategy: offset_target
    offset: [0.0, 0.0, 0.0]
  subtask_id: push_complete
- id: retract_after_push
  type: retract
  generator: linear_cartesian
  control: position_control
  termination: pose_tolerance
  target:
    source: yaml
    anchor: current_tcp
    offset: [0.0, 0.0, 0.1]
    tolerance: 0.03
    orientation:
      mode: keep_current
  parameters:
    retract_height:
      type: scalar
      range: [0.05, 0.2]
      default: 0.1
      binds_to:
      - path: target.offset.z
        mode: replace
```