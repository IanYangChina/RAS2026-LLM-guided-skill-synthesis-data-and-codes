dsl_version: 2
phases:
- control: position_control
  generator: arc_cartesian
  id: approach_behind
  parameters:
    approach_speed:
      binds_to:
      - mode: add
        path: generator.speed
      default: 0.3
      range:
      - 0.1
      - 0.5
      type: scalar
    arc_height:
      binds_to:
      - mode: replace
        path: generator.arc_height
      default: 0.12
      range:
      - 0.05
      - 0.25
      type: scalar
  subtask_id: reach_behind
  target:
    anchor: task_object
    offset:
    - 0.0
    - 0.0
    - 0.1
    offset_along_axis:
      axis: task_goal_direction
      distance: 0.08
      mode: add_to_offset
      sign: negative
    source: yaml
    tolerance: 0.05
  termination: pose_tolerance
  type: approach
- control: position_control
  generator: linear_cartesian
  id: descend_contact
  parameters:
    descend_distance:
      binds_to:
      - mode: replace
        path: target.offset_along_axis.distance
      default: 0.1
      range:
      - 0.06
      - 0.15
      type: scalar
  subtask_id: reach_behind
  target:
    anchor: current_tcp
    offset:
    - 0.0
    - 0.0
    - 0.0
    offset_along_axis:
      axis: world_z
      distance: 0.1
      mode: add_to_offset
      sign: negative
    source: yaml
    tolerance: 0.02
  termination: pose_tolerance
  type: descend
- control: impedance_control
  generator: linear_cartesian
  guards:
  - id: contact_ok
    on_failure: retry
    predicate: contact_detected
    threshold: 1.0
    when: during_phase
  - id: force_ok
    on_failure: retry
    predicate: force_below
    threshold: 15.0
    when: during_phase
  id: push_to_goal
  parameters:
    max_push_force:
      binds_to:
      - mode: replace
        path: guards.force_ok.threshold
      default: 15.0
      range:
      - 5.0
      - 20.0
      type: scalar
    push_speed:
      binds_to:
      - mode: add
        path: generator.speed
      default: 0.12
      range:
      - 0.05
      - 0.3
      type: scalar
  retries:
    max_attempts: 2
    offset:
    - 0.0
    - 0.005
    - 0.0
    strategy: offset_target
  subtask_id: push_to_goal
  target:
    anchor: task_goal
    offset:
    - 0.0
    - 0.0
    - 0.0
    source: yaml
    tolerance: 0.02
  termination: pose_tolerance
  type: push
skill: push_to_goal
subtasks:
- anchor: object
  id: reach_behind
  offset:
  - 0.0
  - 0.0
  - 0.1
  weight: 0.3
- id: push_to_goal
  metric: goal_progress
  target_entity: object
  weight: 0.7
