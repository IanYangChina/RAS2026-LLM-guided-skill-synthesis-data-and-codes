dsl_version: 2
phases:
- control: position_control
  generator: linear_cartesian
  id: approach_1
  parameters:
    approach_height:
      binds_to:
      - mode: replace
        path: target.offset.z
      default: 0.17
      range:
      - 0.1
      - 0.25
      type: scalar
    approach_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.7
      range:
      - 0.3
      - 1.0
      type: scalar
  target:
    anchor: task_goal
    offset:
    - 0.0
    - 0.0
    - 0.17
    orientation:
      mode: keep_current
    source: yaml
    tolerance: 0.02
  termination: pose_tolerance
  type: approach
- control: position_control
  generator: linear_cartesian
  id: descend_1
  parameters:
    descend_retry_offset_z:
      binds_to:
      - mode: replace
        path: retry.offset.z
      default: -0.01
      range:
      - -0.02
      - 0.0
      type: scalar
    descend_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.7
      range:
      - 0.3
      - 1.0
      type: scalar
  retries:
    max_attempts: 1
    offset:
    - 0.0
    - 0.0
    - -0.01
    strategy: offset_target
  target:
    anchor: task_goal
    offset:
    - 0.0
    - 0.0
    - 0.0
    orientation:
      mode: keep_current
    source: yaml
    tolerance: 0.025
  termination: pose_tolerance
  type: descend
skill: obstacle_reach
