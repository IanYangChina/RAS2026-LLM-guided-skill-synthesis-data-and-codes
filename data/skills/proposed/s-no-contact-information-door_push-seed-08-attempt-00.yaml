dsl_version: 2
phases:
- control: position_control
  generator: linear_cartesian
  id: approach_handle
  parameters:
    approach_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.3
      range:
      - 0.1
      - 0.5
      type: scalar
  subtask_id: door_open_progress
  target:
    anchor: task_goal
    offset:
    - 0.0
    - 0.0
    - 0.05
    source: yaml
    tolerance: 0.01
  termination: pose_tolerance
  type: approach
- control: position_control
  generator: linear_cartesian
  id: descend_to_handle
  parameters:
    descend_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.15
      range:
      - 0.05
      - 0.3
      type: scalar
  subtask_id: door_open_progress
  target:
    anchor: task_goal
    offset:
    - 0.0
    - 0.0
    - 0.0
    source: yaml
    tolerance: 0.005
  termination: pose_tolerance
  type: descend
- control: impedance_control
  generator: linear_cartesian
  guards:
  - args: {}
    id: door_open_success
    on_failure: continue
    predicate: hinge_delta_reached
    threshold: 0.85
    when: during_phase
  id: push_door_open
  parameters:
    max_time:
      binds_to:
      - mode: replace
        path: duration.max_time
      default: 5.0
      range:
      - 1.0
      - 10.0
      type: scalar
    push_distance:
      binds_to:
      - mode: replace
        path: target.offset_along_axis.distance
      default: 0.4
      range:
      - 0.1
      - 0.8
      type: scalar
    push_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.12
      range:
      - 0.05
      - 0.3
      type: scalar
  retries:
    max_attempts: 2
    offset:
    - 0.0
    - -0.01
    - 0.0
    strategy: offset_target
  subtask_id: door_open_progress
  target:
    anchor: current_tcp
    offset_along_axis:
      axis: world_x
      distance: 0.4
      mode: replace_offset_projection
      sign: positive
    source: yaml
    tolerance: 0.02
  termination: time_limit
  type: push
skill: door_push
subtasks:
- anchor: fixture
  id: door_open_progress
  metric: hinge_angle
  target_entity: hinge
  weight: 1.0
