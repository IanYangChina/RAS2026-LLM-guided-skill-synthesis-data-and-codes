dsl_version: 2
phases:
- control: position_control
  generator: linear_cartesian
  id: approach_to_channel
  parameters:
    approach_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.2
      range:
      - 0.05
      - 0.5
      type: scalar
  subtask_id: pre_push
  target:
    anchor: fixture
    entity: channel_left_wall
    offset:
    - -0.04
    - 0.08
    - 0.065
    orientation:
      mode: keep_current
    source: yaml
    tolerance: 0.02
  termination: pose_tolerance
  type: approach
- control: position_control
  generator: linear_cartesian
  guards:
  - id: contact_peg
    on_failure: continue
    predicate: contact_detected
    threshold: 0.0
    when: during_phase
  id: descend_to_contact
  parameters:
    descend_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.08
      range:
      - 0.02
      - 0.2
      type: scalar
  subtask_id: pre_push
  target:
    anchor: fixture
    entity: channel_left_wall
    offset:
    - -0.04
    - 0.08
    - 0.005
    orientation:
      mode: keep_current
    source: yaml
    tolerance: 0.005
  termination: pose_tolerance
  type: descend
- control: impedance_control
  generator: linear_cartesian
  guards:
  - id: jam_force
    on_failure: retry
    predicate: force_below
    threshold: 40.0
    when: during_phase
  id: push_through_channel
  parameters:
    jam_force_limit:
      binds_to:
      - mode: replace
        path: guards.jam_force.threshold
      default: 40
      range:
      - 20
      - 50
      type: scalar
    push_distance:
      binds_to:
      - mode: replace
        path: target.offset_along_axis.distance
      default: 0.16
      range:
      - 0.08
      - 0.25
      type: scalar
    push_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.08
      range:
      - 0.02
      - 0.2
      type: scalar
    retry_lateral_x:
      binds_to:
      - mode: replace
        path: retry.offset.x
      default: 0.01
      range:
      - -0.02
      - 0.02
      type: scalar
  retries:
    max_attempts: 2
    offset:
    - 0.0
    - 0.0
    - 0.0
    strategy: offset_target
  subtask_id: push_channel
  target:
    anchor: fixture
    entity: channel_left_wall
    offset:
    - -0.04
    - 0.08
    - 0.005
    offset_along_axis:
      axis: channel_axis
      distance: 0.16
      mode: add_to_offset
      sign: positive
    orientation:
      mode: keep_current
    source: yaml
    tolerance: 0.02
  termination: pose_tolerance
  type: push
skill: peg_channel
skill_type: arm_gripper
subtasks:
- anchor: fixture
  id: pre_push
  metric: distance
  offset:
  - -0.04
  - 0.08
  - 0.065
  target_entity: tcp
  weight: 0.3
- anchor: fixture
  id: push_channel
  metric: goal_progress
  offset:
  - -0.04
  - 0.08
  - 0.005
  target_entity: tcp
  weight: 0.7
