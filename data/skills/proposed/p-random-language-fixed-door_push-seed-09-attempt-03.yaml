dsl_version: 2
phases:
- control: position_control
  generator: linear_cartesian
  guards: []
  id: approach_handle
  parameters:
    approach_speed:
      binds_to:
      - mode: scale
        path: generator.speed
      default: 0.15
      range:
      - 0.05
      - 0.3
      type: scalar
  retries: null
  target:
    anchor: task_goal
    entity: null
    offset:
    - 0
    - 0
    - 0.1
    orientation:
      mode: keep_current
    source: yaml
    tolerance: 0.02
  termination: pose_tolerance
  type: approach
- control: impedance_control
  generator: linear_cartesian
  guards: []
  id: contact_handle
  parameters:
    contact_force_threshold:
      binds_to:
      - mode: replace
        path: termination.force_threshold
      default: 10.0
      range:
      - 5.0
      - 25.0
      type: scalar
    contact_speed:
      binds_to:
      - mode: scale
        path: generator.speed
      default: 0.02
      range:
      - 0.01
      - 0.05
      type: scalar
  retries: null
  target:
    anchor: task_goal
    entity: null
    offset:
    - 0
    - 0
    - 0
    orientation:
      mode: keep_current
    source: yaml
    tolerance: 0.02
  termination: force_exceeded
  type: descend
- control: admittance_control
  generator: linear_cartesian
  guards:
  - args: {}
    id: force_limit
    on_failure: abort
    predicate: force_below
    threshold: 28.0
    when: during_phase
  id: push_door
  parameters:
    push_distance:
      binds_to:
      - mode: replace
        path: target.offset_along_axis.distance
      default: 0.25
      range:
      - 0.1
      - 0.4
      type: scalar
    push_duration:
      binds_to:
      - mode: replace
        path: duration.max_time
      default: 4.0
      range:
      - 2.0
      - 6.0
      type: scalar
    push_force_limit:
      binds_to:
      - mode: replace
        path: guards.force_limit.threshold
      default: 28.0
      range:
      - 20.0
      - 30.0
      type: scalar
    push_speed:
      binds_to:
      - mode: scale
        path: generator.speed
      default: 0.08
      range:
      - 0.02
      - 0.15
      type: scalar
  retries: null
  target:
    anchor: current_tcp
    entity: null
    offset:
    - 0
    - 0
    - 0
    offset_along_axis:
      axis: world_y
      distance: 0.25
      mode: add_to_offset
      sign: positive
    orientation:
      mode: keep_current
    source: yaml
  termination: time_limit
  type: push
skill: door_push
skill_type: arm
