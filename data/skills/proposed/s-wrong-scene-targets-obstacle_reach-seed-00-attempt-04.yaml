dsl_version: 2
phases:
- control: position_control
  generator: arc_cartesian
  guards:
  - args: {}
    id: obstacle_contact
    on_failure: retry
    predicate: contact_detected
    threshold: 1
    when: during_phase
  id: approach_goal
  parameters:
    arc_height:
      binds_to:
      - mode: replace
        path: generator.arc_height
      default: 0.4
      range:
      - 0.2
      - 0.5
      type: scalar
    lateral_offset:
      binds_to:
      - mode: replace
        path: retry.offset.y
      default: 0.05
      range:
      - 0.0
      - 0.15
      type: scalar
    speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.08
      range:
      - 0.01
      - 0.15
      type: scalar
  retries:
    max_attempts: 2
    offset:
    - 0.0
    - 0.0
    - 0.0
    strategy: offset_target
  subtask_id: reach_goal
  target:
    anchor: world
    offset:
    - 0.35
    - 0.0
    - 0.32
    orientation:
      mode: none
    source: yaml
    tolerance: 0.02
  termination: pose_tolerance
  type: approach
skill: obstacle_reach
subtasks:
- anchor: world
  id: reach_goal
  metric: distance
  offset:
  - 0.35
  - 0.0
  - 0.32
  target_entity: tcp
  weight: 1.0
