dsl_version: 2
phases:
- control: position_control
  generator: arc_cartesian
  guards:
  - args: {}
    id: pre_collision
    on_failure: retry
    predicate: contact_detected
    threshold: 1
    when: during_phase
  id: pre_approach
  parameters:
    pre_arc_height:
      binds_to:
      - mode: replace
        path: generator.arc_height
      default: 0.25
      range:
      - 0.1
      - 0.4
      type: scalar
    pre_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.25
      range:
      - 0.1
      - 0.4
      type: scalar
  retries:
    max_attempts: 1
    offset:
    - 0.0
    - 0.05
    - 0.0
    strategy: offset_target
  subtask_id: approach_goal
  target:
    anchor: task_goal
    offset:
    - 0.0
    - -0.1
    - 0.35
    orientation:
      align_with: world_z
      axis:
      - 0.0
      - 0.0
      - 1.0
      mode: align_axis
      tolerance: 0.05
    source: yaml
    tolerance: 0.03
  termination: pose_tolerance
  type: approach
- control: position_control
  generator: linear_cartesian
  id: contact_align
  parameters:
    align_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.1
      range:
      - 0.05
      - 0.2
      type: scalar
  subtask_id: approach_goal
  target:
    anchor: task_goal
    offset:
    - 0.0
    - 0.0
    - 0.15
    orientation:
      mode: keep_current
    source: yaml
    tolerance: 0.02
  termination: pose_tolerance
  type: align
- control: force_threshold_switch
  generator: linear_cartesian
  id: contact_probe
  parameters:
    probe_force_threshold:
      binds_to:
      - mode: replace
        path: termination.force_threshold
      default: 5.0
      range:
      - 2.0
      - 15.0
      type: scalar
    probe_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.05
      range:
      - 0.02
      - 0.1
      type: scalar
  subtask_id: approach_goal
  target:
    anchor: task_goal
    offset:
    - 0.0
    - 0.0
    - 0.0
    orientation:
      mode: keep_current
    source: yaml
    tolerance: 0.02
  termination: force_exceeded
  type: contact
- control: impedance_control
  generator: linear_cartesian
  guards:
  - args: {}
    id: push_contact
    on_failure: abort
    predicate: force_below
    threshold: 30.0
    when: during_phase
  id: push_door
  parameters:
    push_distance:
      binds_to:
      - mode: replace
        path: target.offset_along_axis.distance
      default: 0.4
      range:
      - 0.1
      - 0.6
      type: scalar
    push_max_time:
      binds_to:
      - mode: replace
        path: duration.max_time
      default: 6.0
      range:
      - 2.0
      - 10.0
      type: scalar
    push_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.3
      range:
      - 0.1
      - 0.5
      type: scalar
  subtask_id: push_hinge
  target:
    anchor: current_tcp
    offset:
    - 0.0
    - 0.0
    - 0.0
    offset_along_axis:
      axis: task_goal_direction
      distance: 0.4
      mode: add_to_offset
      sign: positive
    orientation:
      mode: keep_current
    source: yaml
  termination: time_limit
  type: push
skill: door_push
subtasks:
- anchor: goal
  id: approach_goal
  metric: distance
  offset:
  - 0.0
  - 0.0
  - 0.15
  target_entity: tcp
  weight: 0.3
- anchor: fixture
  id: push_hinge
  metric: hinge_angle
  target_entity: hinge
  weight: 0.7
