dsl_version: 2
phases:
- control: position_control
  generator: linear_cartesian
  id: align_behind
  orientation:
    mode: none
  parameters:
    offset_y:
      binds_to:
      - mode: replace
        path: target.offset.y
      default: 0.02
      range:
      - 0.005
      - 0.04
      type: scalar
    offset_z:
      binds_to:
      - mode: replace
        path: target.offset.z
      default: 0.01
      range:
      - 0.005
      - 0.02
      type: scalar
  subtask_id: alignment
  target:
    anchor: task_object
    offset:
    - 0.0
    - 0.02
    - 0.01
    source: yaml
    tolerance: 0.01
  termination: pose_tolerance
  type: align
- control: impedance_control
  generator: impedance_motion
  id: push_channel
  orientation:
    align_with: channel_axis
    axis:
    - 0.0
    - 0.0
    - 1.0
    mode: align_axis
    tolerance: 0.05
  parameters:
    push_distance:
      binds_to:
      - mode: replace
        path: target.offset_along_axis.distance
      default: 0.16
      range:
      - 0.12
      - 0.18
      type: scalar
    push_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.02
      range:
      - 0.01
      - 0.05
      type: scalar
  subtask_id: push_completion
  target:
    anchor: task_object
    offset:
    - 0.0
    - 0.0
    - 0.0
    offset_along_axis:
      axis: channel_axis
      distance: 0.16
      mode: add_to_offset
      sign: positive
    source: yaml
    tolerance: 0.02
  termination: pose_tolerance
  type: push
skill: peg_channel
skill_type: arm
subtasks:
- anchor: object
  id: alignment
  metric: distance
  offset:
  - 0.0
  - 0.02
  - 0.01
  target_entity: tcp
  weight: 0.3
- anchor: object
  id: push_completion
  metric: distance
  offset:
  - 0.0
  - -0.16
  - 0.0
  target_entity: object
  weight: 0.7
