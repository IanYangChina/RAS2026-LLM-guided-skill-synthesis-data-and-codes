dsl_version: 2
phases:
- control: position_control
  generator: linear_cartesian
  id: descend_to_object
  parameters:
    descend_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.05
      range:
      - 0.01
      - 0.1
      type: scalar
    descend_tolerance:
      binds_to:
      - mode: replace
        path: termination.pose_tolerance
      default: 0.015
      range:
      - 0.005
      - 0.03
      type: scalar
  target:
    anchor: task_object
    offset:
    - 0.0
    - 0.0
    - 0.03
    orientation:
      mode: none
    source: yaml
  termination: pose_tolerance
  type: descend
- control: force_threshold_switch
  generator: linear_cartesian
  id: approach_contact
  parameters:
    approach_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.05
      range:
      - 0.02
      - 0.15
      type: scalar
    contact_force_threshold:
      binds_to:
      - mode: replace
        path: termination.force_threshold
      default: 2.0
      range:
      - 0.5
      - 5.0
      type: scalar
    side_offset_x:
      binds_to:
      - mode: add
        path: target.offset.x
      default: 0.0
      range:
      - -0.05
      - 0.05
      type: scalar
    side_offset_y:
      binds_to:
      - mode: add
        path: target.offset.y
      default: 0.03
      range:
      - -0.05
      - 0.05
      type: scalar
  subtask_id: approach_object
  target:
    anchor: task_object
    offset:
    - 0.0
    - 0.03
    - 0.0
    orientation:
      mode: none
    source: yaml
  termination: force_exceeded
  type: approach
- control: admittance_control
  generator: linear_cartesian
  guards:
  - id: contact_maintained
    on_failure: continue
    predicate: contact_detected
    threshold: 1.0
    when: during_phase
  id: push_to_goal
  parameters:
    push_force_threshold:
      binds_to:
      - mode: replace
        path: termination.force_threshold
      default: 20.0
      range:
      - 10.0
      - 25.0
      type: scalar
    push_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.04
      range:
      - 0.01
      - 0.08
      type: scalar
    retry_offset_x:
      binds_to:
      - mode: replace
        path: retry.offset.x
      default: 0.005
      range:
      - -0.015
      - 0.015
      type: scalar
    retry_offset_y:
      binds_to:
      - mode: replace
        path: retry.offset.y
      default: 0.005
      range:
      - -0.015
      - 0.015
      type: scalar
  retries:
    max_attempts: 2
    offset:
    - 0.005
    - 0.005
    - 0.0
    strategy: offset_target
  subtask_id: push_to_goal
  target:
    anchor: task_object
    offset:
    - 0.0
    - 0.03
    - 0.0
    offset_along_axis:
      axis: task_goal_direction
      distance: 0.25
      mode: add_to_offset
      sign: positive
    orientation:
      mode: none
    source: yaml
  termination: force_exceeded
  type: push
skill: push_to_goal
subtasks:
- anchor: object
  id: approach_object
  weight: 0.3
- id: push_to_goal
  metric: goal_progress
  target_entity: object
  weight: 0.7
