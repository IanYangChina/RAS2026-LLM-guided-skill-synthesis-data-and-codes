dsl_version: 2
phases:
- control: position_control
  generator: linear_cartesian
  id: approach_above_peg
  orientation:
    mode: keep_current
  parameters:
    approach_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.15
      range:
      - 0.05
      - 0.3
      type: scalar
  subtask_id: reach_above_peg
  target:
    anchor: task_object
    offset:
    - 0.0
    - 0.05
    - 0.12
    source: yaml
  termination: pose_tolerance
  type: approach
- control: position_control
  generator: linear_cartesian
  id: align_to_entry
  orientation:
    mode: keep_current
  parameters:
    height_adjust:
      binds_to:
      - mode: add
        path: target.offset.z
      default: 0.0
      range:
      - -0.02
      - 0.02
      type: scalar
    lateral_offset_x:
      binds_to:
      - mode: add
        path: target.offset.x
      default: 0.0
      range:
      - -0.01
      - 0.01
      type: scalar
  subtask_id: align_to_channel
  target:
    anchor: task_object
    offset:
    - 0.0
    - -0.02
    - 0.035
    source: yaml
  termination: pose_tolerance
  type: align
- control: impedance_control
  generator: impedance_motion
  guards:
  - args: {}
    id: contact_force_ok
    on_failure: abort
    predicate: force_below
    threshold: 40.0
    when: during_phase
  - args:
      body_a: attachment
      body_b: peg_geom
    id: keep_contact
    on_failure: abort
    predicate: contact_detected
    threshold: 0.5
    when: during_phase
  id: push_through_channel
  orientation:
    align_with: channel_axis
    axis:
    - 0.0
    - 0.0
    - 1.0
    mode: align_axis
  parameters:
    push_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.04
      range:
      - 0.02
      - 0.08
      type: scalar
  retries:
    max_attempts: 1
    offset:
    - 0.0
    - 0.005
    - 0.0
    strategy: offset_target
  subtask_id: push_through_channel
  target:
    anchor: task_goal
    offset:
    - 0.0
    - 0.0
    - 0.0
    source: yaml
  termination: time_limit
  type: push
skill: peg_channel
skill_type: arm_gripper
subtasks:
- anchor: object
  id: reach_above_peg
  metric: distance
  offset:
  - 0.0
  - 0.05
  - 0.12
  target_entity: tcp
  weight: 0.3
- anchor: object
  id: align_to_channel
  metric: distance
  offset:
  - 0.0
  - -0.02
  - 0.035
  target_entity: tcp
  weight: 0.3
- anchor: goal
  id: push_through_channel
  metric: goal_progress
  target_entity: tcp
  weight: 0.4
