dsl_version: 2
phases:
- control: position_control
  generator: linear_cartesian
  id: approach_above_peg
  parameters:
    approach_height:
      binds_to:
      - mode: replace
        path: target.offset.z
      default: 0.1
      range:
      - 0.05
      - 0.15
      type: scalar
  retries:
    max_attempts: 0
    strategy: repeat
  subtask_id: reach_contact
  target:
    anchor: task_object
    offset:
    - 0.0
    - 0.05
    - 0.1
    orientation:
      mode: keep_current
    source: yaml
    tolerance: 0.02
  termination: pose_tolerance
  type: approach
- control: impedance_control
  generator: linear_cartesian
  guards:
  - id: contact_after_descend
    on_failure: abort
    predicate: contact_detected
    threshold: 1.0
    when: after_phase
  id: descend_contact
  parameters:
    descend_backset_y:
      binds_to:
      - mode: replace
        path: target.offset.y
      default: 0.015
      range:
      - 0.005
      - 0.03
      type: scalar
  retries:
    max_attempts: 0
    strategy: repeat
  subtask_id: reach_contact
  target:
    anchor: task_object
    offset:
    - 0.0
    - 0.015
    - 0.0
    orientation:
      mode: keep_current
    source: yaml
    tolerance: 0.015
  termination: pose_tolerance
  type: descend
- control: impedance_control
  generator: linear_cartesian
  guards:
  - id: force_safe
    on_failure: abort
    predicate: force_below
    threshold: 50.0
    when: during_phase
  id: push_to_goal
  parameters:
    lateral_offset_x:
      binds_to:
      - mode: replace
        path: target.offset.x
      default: 0.0
      range:
      - -0.02
      - 0.02
      type: scalar
    push_force_threshold:
      binds_to:
      - mode: replace
        path: termination.force_threshold
      default: 40.0
      range:
      - 30.0
      - 45.0
      type: scalar
    push_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.03
      range:
      - 0.01
      - 0.05
      type: scalar
  retries:
    max_attempts: 2
    offset:
    - 0.01
    - 0.0
    - 0.0
    strategy: offset_target
  subtask_id: push_channel
  target:
    anchor: task_goal
    offset:
    - 0.0
    - 0.0
    - 0.005
    orientation:
      align_with: channel_axis
      axis:
      - 0
      - 0
      - 1
      mode: align_axis
      tolerance: 0.15
    source: yaml
    tolerance: 0.03
  termination: force_exceeded
  type: push
skill: peg_channel
subtasks:
- anchor: object
  id: reach_contact
  offset:
  - 0.0
  - 0.015
  - 0.0
  weight: 0.3
- id: push_channel
  metric: goal_progress
  weight: 0.7
