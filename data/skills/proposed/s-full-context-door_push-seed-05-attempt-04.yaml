dsl_version: 2
phases:
- control: position_control
  generator: linear_cartesian
  guards:
  - args:
      target: task_goal
    id: approach_tolerance
    on_failure: abort
    predicate: pose_within_tolerance
    threshold: 0.02
    when: after_phase
  id: approach_door
  parameters:
    approach_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.2
      range:
      - 0.05
      - 0.5
      type: scalar
  subtask_id: pre_contact
  target:
    anchor: fixture
    entity: door_panel
    offset:
    - -0.4
    - 0.0
    - 0.35
    orientation:
      mode: keep_current
    source: yaml
    tolerance: 0.02
  termination: pose_tolerance
  type: approach
- control: impedance_control
  generator: linear_cartesian
  guards:
  - args:
      body_a: link7
      body_b: door_panel
    id: contact_check
    on_failure: retry
    predicate: contact_detected
    threshold: 1.0
    when: during_phase
  id: push_door
  parameters:
    push_distance:
      binds_to:
      - mode: replace
        path: target.offset_along_axis.distance
      default: 0.15
      range:
      - 0.05
      - 0.3
      type: scalar
    push_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.1
      range:
      - 0.02
      - 0.2
      type: scalar
  retries:
    max_attempts: 2
    offset:
    - 0.0
    - -0.01
    - 0.0
    strategy: offset_target
  subtask_id: door_opening
  target:
    anchor: current_tcp
    offset:
    - 0.0
    - 0.0
    - 0.0
    offset_along_axis:
      axis: world_y
      distance: 0.15
      mode: replace_offset_projection
      sign: negative
    orientation:
      mode: keep_current
    source: yaml
    tolerance: 0.1
  termination: pose_tolerance
  type: push
skill: door_push
subtasks:
- anchor: fixture
  id: door_opening
  metric: hinge_angle
  target_entity: hinge
- anchor: fixture
  id: pre_contact
  offset:
  - -0.4
  - 0.0
  - 0.35
  weight: 0.3
