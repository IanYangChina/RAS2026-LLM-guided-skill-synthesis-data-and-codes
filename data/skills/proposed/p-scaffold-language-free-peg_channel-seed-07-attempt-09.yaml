dsl_version: 2
phases:
- control: position_control
  generator: linear_cartesian
  id: align_1
  orientation:
    align_with: channel_axis
    axis:
    - 1
    - 0
    - 0
    mode: align_axis
    tolerance: 0.1
  parameters:
    lateral_offset_y:
      binds_to:
      - mode: add
        path: target.offset.y
      default: 0.0
      range:
      - -0.02
      - 0.02
      type: scalar
    speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.1
      range:
      - 0.01
      - 0.2
      type: scalar
  subtask_id: reach_prepush
  target:
    anchor: task_object
    offset:
    - 0
    - 0.03
    - 0.1
    orientation:
      align_with: channel_axis
      axis:
      - 1
      - 0
      - 0
      mode: align_axis
      tolerance: 0.1
  termination: pose_tolerance
  type: align
- control: position_control
  generator: linear_cartesian
  id: approach_1
  orientation:
    mode: keep_current
  parameters:
    speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.05
      range:
      - 0.01
      - 0.1
      type: scalar
  subtask_id: reach_prepush
  target:
    anchor: task_object
    offset:
    - 0
    - 0.02
    - 0.04
    orientation:
      mode: keep_current
  termination: pose_tolerance
  type: approach
- control: impedance_control
  generator: linear_cartesian
  guards:
  - args: {}
    id: force_exceeded_guard
    on_failure: abort
    predicate: force_below
    threshold: 40.0
    when: during_phase
  id: push_1
  orientation:
    mode: keep_current
  parameters:
    force_limit:
      binds_to:
      - mode: replace
        path: guards.force_exceeded_guard.threshold
      default: 30.0
      range:
      - 10.0
      - 40.0
      type: scalar
    push_distance:
      binds_to:
      - mode: replace
        path: target.offset_along_axis.distance
      default: 0.16
      range:
      - 0.05
      - 0.2
      type: scalar
    speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.02
      range:
      - 0.01
      - 0.05
      type: scalar
  retries:
    max_attempts: 2
    offset:
    - 0.005
    - 0.0
    - 0.0
    strategy: offset_target
  subtask_id: push_through
  target:
    anchor: current_tcp
    offset_along_axis:
      axis:
      - 0
      - -1
      - 0
      distance: 0.16
      mode: replace_offset_projection
      sign: positive
    orientation:
      mode: keep_current
  termination: pose_tolerance
  type: push
- control: position_control
  generator: linear_cartesian
  id: retract_1
  orientation:
    mode: keep_current
  parameters:
    speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.08
      range:
      - 0.01
      - 0.15
      type: scalar
  subtask_id: push_through
  target:
    anchor: current_tcp
    offset:
    - 0
    - 0
    - 0.15
    orientation:
      mode: keep_current
  termination: pose_tolerance
  type: retract
skill: peg_channel
subtasks:
- anchor: object
  id: reach_prepush
  metric: distance
  offset:
  - 0
  - 0.03
  - 0.1
  target_entity: tcp
  weight: 0.3
- anchor: goal
  id: push_through
  metric: goal_progress
  offset:
  - 0
  - 0
  - 0
  target_entity: object
  weight: 0.7
