dsl_version: 2
phases:
- control: position_control
  generator: linear_cartesian
  guards: []
  id: approach_1
  parameters:
    approach_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.04
      range:
      - 0.01
      - 0.1
      type: scalar
  retries:
    max_attempts: 0
    strategy: repeat
  subtask_id: reach_pre_insert
  target:
    anchor: fixture
    entity: peg_socket
    offset:
    - 0.0
    - 0.0
    - 0.12
    orientation:
      mode: keep_current
    source: yaml
    tolerance: 0.005
  termination: pose_tolerance
  type: approach
- control: position_control
  generator: linear_cartesian
  guards: []
  id: align_1
  parameters:
    align_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.03
      range:
      - 0.01
      - 0.1
      type: scalar
    lateral_offset_x:
      binds_to:
      - mode: replace
        path: target.offset.x
      default: 0.0
      range:
      - -0.05
      - 0.05
      type: scalar
    lateral_offset_y:
      binds_to:
      - mode: replace
        path: target.offset.y
      default: 0.0
      range:
      - -0.05
      - 0.05
      type: scalar
  retries:
    max_attempts: 0
    strategy: repeat
  subtask_id: reach_pre_insert
  target:
    anchor: fixture
    entity: peg_socket
    offset:
    - 0.0
    - 0.0
    - 0.12
    orientation:
      mode: keep_current
    source: yaml
    tolerance: 0.005
  termination: pose_tolerance
  type: align
- control: impedance_control
  generator: impedance_motion
  guards: []
  id: insert_1
  parameters:
    insertion_depth:
      binds_to:
      - mode: replace
        path: target.offset_along_axis.distance
      default: 0.08
      range:
      - 0.03
      - 0.12
      type: scalar
    insertion_force:
      binds_to:
      - mode: replace
        path: termination.force_threshold
      default: 15.0
      range:
      - 5.0
      - 30.0
      type: scalar
  retries:
    max_attempts: 1
    offset:
    - 0.0
    - 0.0
    - 0.0
    strategy: offset_target
  subtask_id: reach_inserted
  target:
    anchor: fixture
    entity: peg_socket
    offset:
    - 0.0
    - 0.0
    - 0.12
    offset_along_axis:
      axis: world_z
      distance: 0.06
      mode: add_to_offset
      sign: positive
    orientation:
      mode: none
    source: yaml
  termination: force_exceeded
  type: insert
skill: peg_insert
skill_type: arm
subtasks:
- anchor: fixture
  id: reach_pre_insert
  metric: distance
  offset:
  - 0.0
  - 0.0
  - 0.12
  target_entity: tcp
  weight: 0.3
- anchor: fixture
  id: reach_inserted
  metric: distance
  offset:
  - 0.0
  - 0.0
  - -0.01
  target_entity: tcp
  weight: 0.7
