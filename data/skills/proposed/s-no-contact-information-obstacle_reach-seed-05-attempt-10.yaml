dsl_version: 2
phases:
- control: position_control
  generator: arc_cartesian
  id: arc_to_goal_above
  parameters:
    arc_height:
      binds_to:
      - mode: replace
        path: generator.arc_height
      default: 0.2
      range:
      - 0.05
      - 0.4
      type: scalar
    speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.2
      range:
      - 0.1
      - 0.35
      type: scalar
    y_offset:
      binds_to:
      - mode: add
        path: target.offset.y
      default: 0.0
      range:
      - -0.1
      - 0.1
      type: scalar
  retries:
    max_attempts: 1
    offset:
    - 0.02
    - 0.0
    - 0.01
    strategy: offset_target
  subtask_id: reach_above
  target:
    anchor: task_goal
    offset:
    - 0.0
    - 0.0
    - 0.1
    orientation:
      mode: none
    source: yaml
    tolerance: 0.05
  termination: pose_tolerance
  type: approach
- control: position_control
  generator: linear_cartesian
  id: descend_to_goal
  parameters:
    speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.08
      range:
      - 0.04
      - 0.15
      type: scalar
  subtask_id: reach_goal
  target:
    anchor: task_goal
    offset:
    - 0.0
    - 0.0
    - 0.0
    orientation:
      mode: none
    source: yaml
    tolerance: 0.02
  termination: pose_tolerance
  type: descend
skill: obstacle_reach
subtasks:
- id: reach_above
  offset:
  - 0.0
  - 0.0
  - 0.1
  weight: 0.3
- id: reach_goal
  weight: 0.7
