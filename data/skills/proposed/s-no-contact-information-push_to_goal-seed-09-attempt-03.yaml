skill: push_to_goal
dsl_version: 2
skill_type: arm_gripper
subtasks:
  - id: pre_contact
    anchor: object
    target_entity: tcp
    metric: distance
    offset: [0.0, 0.0, 0.15]
    weight: 0.2
  - id: contact
    anchor: object
    target_entity: tcp
    metric: distance
    offset: [0.01, 0.03, 0.0]
    weight: 0.3
  - id: goal_push
    anchor: goal
    target_entity: object
    metric: goal_progress
    offset: [0.0, 0.0, 0.0]
    weight: 1.0
phases:
  - id: approach_to_box
    type: approach
    generator: linear_cartesian
    control: position_control
    termination: pose_tolerance
    subtask_id: pre_contact
    target:
      source: yaml
      anchor: task_object
      entity: null
      offset: [0.0, 0.0, 0.15]
      orientation:
        mode: none
      tolerance: 0.02
    parameters:
      approach_height:
        type: scalar
        range: [0.1, 0.3]
        default: 0.15
        binds_to:
          - path: target.offset.z
            mode: replace
    retries:
      max_attempts: 0
      strategy: repeat
    guards: []
  - id: descend_to_contact
    type: descend
    generator: linear_cartesian
    control: force_threshold_switch
    termination: force_exceeded
    subtask_id: contact
    target:
      source: yaml
      anchor: task_object
      entity: null
      offset: [0.01, 0.03, 0.0]
      orientation:
        mode: none
    parameters:
      contact_offset_x:
        type: scalar
        range: [0.0, 0.05]
        default: 0.01
        binds_to:
          - path: target.offset.x
            mode: replace
      contact_offset_y:
        type: scalar
        range: [0.0, 0.05]
        default: 0.03
        binds_to:
          - path: target.offset.y
            mode: replace
      contact_force_threshold:
        type: scalar
        range: [1.0, 10.0]
        default: 3.0
        binds_to:
          - path: termination.force_threshold
            mode: replace
    retries:
      max_attempts: 1
      strategy: offset_target
      offset: [0.0, 0.0, -0.005]
    guards:
      - id: contact_detected_guard
        when: during_phase
        predicate: contact_detected
        args: {}
        threshold: 0.0
        on_failure: continue
  - id: push_to_goal
    type: push
    generator: linear_cartesian
    control: impedance_control
    termination: time_limit
    subtask_id: goal_push
    target:
      source: yaml
      anchor: task_object
      entity: null
      offset: [0.0, 0.0, 0.0]
      offset_along_axis:
        distance: 0.14
        axis: task_goal_direction
        mode: add_to_offset
        sign: positive
      orientation:
        mode: keep_current
    parameters:
      push_distance:
        type: scalar
        range: [0.05, 0.25]
        default: 0.14
        binds_to:
          - path: target.offset_along_axis.distance
            mode: replace
      push_speed:
        type: scalar
        range: [0.01, 0.1]
        default: 0.05
        binds_to:
          - path: generator.speed
            mode: replace
      push_timeout:
        type: scalar
        range: [1.0, 5.0]
        default: 3.0
        binds_to:
          - path: duration.max_time
            mode: replace
    retries:
      max_attempts: 1
      strategy: offset_target
      offset: [0.0, 0.0, 0.0]
    guards:
      - id: object_progress_guard
        when: during_phase
        predicate: object_progress
        args: {}
        threshold: 0.8
        on_failure: continue
      - id: force_below_guard
        when: during_phase
        predicate: force_below
        args: {}
        threshold: 25.0
        on_failure: abort
```