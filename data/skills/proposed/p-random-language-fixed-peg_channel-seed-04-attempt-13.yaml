dsl_version: 2
phases:
- control: position_control
  generator: arc_cartesian
  id: approach_peg
  parameters:
    arc_height:
      binds_to:
      - mode: replace
        path: generator.arc_height
      default: 0.05
      range:
      - 0.02
      - 0.1
      type: scalar
  subtask_id: approach
  target:
    anchor: task_object
    offset:
    - 0.0
    - 0.04
    - 0.0
    orientation:
      align_with: channel_axis
      axis:
      - 0.0
      - 0.0
      - 1.0
      mode: align_axis
      tolerance: 0.1
    source: yaml
  termination: pose_tolerance
  type: approach
- control: force_threshold_switch
  generator: linear_cartesian
  id: contact_peg
  parameters:
    contact_force_threshold:
      binds_to:
      - mode: replace
        path: termination.force_threshold
      default: 5.0
      range:
      - 1.0
      - 20.0
      type: scalar
  subtask_id: contact
  target:
    anchor: task_object
    offset:
    - 0.0
    - 0.02
    - 0.0
    orientation:
      mode: keep_current
    source: yaml
  termination: force_exceeded
  type: contact
- control: impedance_control
  generator: impedance_motion
  guards:
  - args: {}
    id: force_limit_guard
    on_failure: retry
    predicate: force_below
    threshold: 40.0
    when: during_phase
  id: push_through_channel
  parameters:
    push_distance:
      binds_to:
      - mode: replace
        path: target.offset_along_axis.distance
      default: 0.12
      range:
      - 0.05
      - 0.2
      type: scalar
    push_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.1
      range:
      - 0.01
      - 0.2
      type: scalar
  retries:
    max_attempts: 2
    offset:
    - 0.005
    - 0.005
    - 0.0
    strategy: offset_target
  subtask_id: push
  target:
    anchor: world
    offset:
    - 0.5
    - -0.08
    - 0.04
    offset_along_axis:
      axis: channel_axis
      distance: 0.12
      mode: add_to_offset
      sign: positive
    orientation:
      mode: keep_current
    source: yaml
  termination: time_limit
  type: push
skill: peg_channel
skill_type: arm_gripper
subtasks:
- anchor: object
  id: approach
  metric: distance
  offset:
  - 0.0
  - 0.04
  - 0.0
  target_entity: tcp
  weight: 1.0
- anchor: object
  id: contact
  metric: distance
  offset:
  - 0.0
  - 0.02
  - 0.0
  target_entity: tcp
  weight: 1.0
- anchor: world
  id: push
  metric: distance
  offset:
  - 0.5
  - -0.08
  - 0.04
  target_entity: tcp
  weight: 1.0
