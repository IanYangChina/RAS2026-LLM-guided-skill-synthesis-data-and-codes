dsl_version: 2
phases:
- control: position_control
  generator: linear_cartesian
  guards: []
  id: align_1
  parameters:
    offset_y:
      binds_to:
      - mode: replace
        path: target.offset.y
      default: 0.08
      range:
      - 0.05
      - 0.12
      type: scalar
    offset_z:
      binds_to:
      - mode: replace
        path: target.offset.z
      default: 0.1
      range:
      - 0.06
      - 0.15
      type: scalar
  retries:
    max_attempts: 0
  subtask_id: reach_pre_contact
  target:
    anchor: task_object
    entity: peg
    offset:
    - 0.0
    - 0.08
    - 0.1
    orientation:
      mode: keep_current
    tolerance: 0.02
  termination: pose_tolerance
  type: align
- control: force_threshold_switch
  generator: linear_cartesian
  guards: []
  id: approach_1
  parameters:
    contact_force:
      binds_to:
      - mode: replace
        path: termination.force_threshold
      default: 8.0
      range:
      - 2.0
      - 15.0
      type: scalar
    speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.02
      range:
      - 0.01
      - 0.05
      type: scalar
  retries:
    max_attempts: 0
  target:
    anchor: task_object
    entity: peg
    offset:
    - 0.0
    - 0.015
    - 0.0
    orientation:
      mode: keep_current
    tolerance: 0.01
  termination: force_exceeded
  type: approach
- control: impedance_control
  generator: impedance_motion
  guards:
  - args: {}
    id: push_progress
    on_failure: continue
    predicate: object_progress
    threshold: 0.5
    when: during_phase
  id: push_1
  parameters:
    push_distance:
      binds_to:
      - mode: replace
        path: target.offset_along_axis.distance
      default: 0.18
      range:
      - 0.12
      - 0.22
      type: scalar
  retries:
    max_attempts: 0
  subtask_id: reach_goal
  target:
    anchor: task_object
    entity: peg
    offset:
    - 0.0
    - 0.015
    - 0.0
    offset_along_axis:
      axis: channel_axis
      distance: 0.18
      mode: add_to_offset
      sign: positive
    orientation:
      mode: keep_current
    tolerance: 0.02
  termination: pose_tolerance
  type: push
- control: position_control
  generator: linear_cartesian
  guards: []
  id: retract_1
  parameters:
    speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.05
      range:
      - 0.02
      - 0.1
      type: scalar
  retries:
    max_attempts: 0
  target:
    anchor: current_tcp
    offset:
    - 0.0
    - 0.0
    - 0.15
    orientation:
      mode: keep_current
    tolerance: 0.02
  termination: pose_tolerance
  type: retract
skill: peg_channel
subtasks:
- anchor: object
  id: reach_pre_contact
  metric: distance
  offset:
  - 0.0
  - 0.08
  - 0.1
  target_entity: tcp
  weight: 0.3
- anchor: goal
  id: reach_goal
  metric: distance
  offset:
  - 0.0
  - 0.0
  - 0.0
  target_entity: tcp
  weight: 0.7
