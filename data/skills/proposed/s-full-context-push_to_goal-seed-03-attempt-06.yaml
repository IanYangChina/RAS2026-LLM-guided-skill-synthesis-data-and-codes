dsl_version: 2
phases:
- control: position_control
  generator: linear_cartesian
  id: approach_1
  parameters:
    approach_height:
      binds_to:
      - mode: replace
        path: target.offset.z
      default: 0.05
      range:
      - 0.03
      - 0.07
      type: scalar
    behind_distance_approach:
      binds_to:
      - mode: replace
        path: target.offset_along_axis.distance
      default: 0.15
      range:
      - 0.08
      - 0.25
      type: scalar
  subtask_id: approach_target
  target:
    anchor: task_object
    entity: body
    offset:
    - 0.0
    - 0.0
    - 0.05
    offset_along_axis:
      axis: task_goal_direction
      distance: 0.15
      mode: add_to_offset
      sign: negative
    orientation:
      mode: keep_current
    source: yaml
  termination: pose_tolerance
  type: approach
- control: position_control
  generator: linear_cartesian
  id: descend_1
  parameters:
    behind_distance_descend:
      binds_to:
      - mode: replace
        path: target.offset_along_axis.distance
      default: 0.15
      range:
      - 0.08
      - 0.25
      type: scalar
  subtask_id: approach_target
  target:
    anchor: task_object
    entity: body
    offset:
    - 0.0
    - 0.0
    - 0.0
    offset_along_axis:
      axis: task_goal_direction
      distance: 0.15
      mode: add_to_offset
      sign: negative
    orientation:
      mode: keep_current
    source: yaml
  termination: pose_tolerance
  type: descend
- control: force_threshold_switch
  generator: linear_cartesian
  id: contact_1
  parameters:
    contact_force_threshold:
      binds_to:
      - mode: replace
        path: termination.force_threshold
      default: 10.0
      range:
      - 5.0
      - 20.0
      type: scalar
    contact_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.05
      range:
      - 0.02
      - 0.08
      type: scalar
  subtask_id: push_goal
  target:
    anchor: task_object
    entity: body
    offset:
    - 0.0
    - 0.0
    - 0.0
    offset_along_axis:
      axis: task_goal_direction
      distance: 0.05
      mode: add_to_offset
      sign: positive
    orientation:
      align_with: task_goal_direction
      axis:
      - 1.0
      - 0.0
      - 0.0
      mode: align_axis
      tolerance: 0.15
    source: yaml
  termination: force_exceeded
  type: contact
- control: admittance_control
  generator: linear_cartesian
  guards:
  - args:
      limit: 25.0
    id: force_guard
    on_failure: retry
    predicate: force_below
    threshold: 25.0
    when: during_phase
  id: push_1
  parameters:
    push_distance:
      binds_to:
      - mode: replace
        path: target.offset_along_axis.distance
      default: 0.2
      range:
      - 0.1
      - 0.3
      type: scalar
    push_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.1
      range:
      - 0.05
      - 0.15
      type: scalar
  retries:
    max_attempts: 2
    offset:
    - 0.01
    - 0.0
    - 0.0
    strategy: offset_target
  subtask_id: push_goal
  target:
    anchor: task_object
    entity: body
    offset:
    - 0.0
    - 0.0
    - 0.0
    offset_along_axis:
      axis: task_goal_direction
      distance: 0.2
      mode: add_to_offset
      sign: positive
    orientation:
      align_with: task_goal_direction
      axis:
      - 1.0
      - 0.0
      - 0.0
      mode: align_axis
      tolerance: 0.15
    source: yaml
  termination: time_limit
  type: push
- control: position_control
  generator: arc_cartesian
  id: retract_1
  target:
    anchor: current_tcp
    offset:
    - 0.0
    - 0.0
    - 0.1
    orientation:
      mode: keep_current
    source: yaml
  termination: pose_tolerance
  type: retract
skill: push_to_goal
subtasks:
- anchor: object
  id: approach_target
  offset:
  - 0.0
  - 0.0
  - 0.05
  weight: 0.3
- id: push_goal
  metric: goal_progress
  target_entity: object
  weight: 0.7
