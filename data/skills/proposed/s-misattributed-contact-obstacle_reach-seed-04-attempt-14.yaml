dsl_version: 2
phases:
- control: position_control
  generator: arc_cartesian
  id: approach_over
  parameters:
    approach_speed:
      binds_to:
      - mode: scale
        path: generator.speed
      default: 0.15
      range:
      - 0.05
      - 0.3
      type: scalar
    arc_height:
      binds_to:
      - mode: add
        path: generator.arc_height
      default: 0.25
      range:
      - 0.15
      - 0.4
      type: scalar
    clearance_z:
      binds_to:
      - mode: replace
        path: target.offset.z
      default: 0.3
      range:
      - 0.2
      - 0.4
      type: scalar
    offset_y:
      binds_to:
      - mode: replace
        path: target.offset.y
      default: 0.2
      range:
      - 0.1
      - 0.3
      type: scalar
  subtask_id: reach_clear
  target:
    anchor: task_goal
    offset:
    - 0.0
    - 0.2
    - 0.3
    orientation:
      mode: none
    source: yaml
    tolerance: 0.02
  termination: pose_tolerance
  type: approach
- control: position_control
  generator: linear_cartesian
  guards:
  - id: contact_guard
    on_failure: retry
    predicate: force_below
    threshold: 4.5
    when: during_phase
  id: descend_clear
  parameters:
    descend_speed:
      binds_to:
      - mode: scale
        path: generator.speed
      default: 0.1
      range:
      - 0.05
      - 0.2
      type: scalar
    offset_y_descend:
      binds_to:
      - mode: replace
        path: target.offset.y
      default: 0.2
      range:
      - 0.1
      - 0.3
      type: scalar
  retries:
    max_attempts: 2
    offset:
    - 0.0
    - 0.03
    - 0.0
    strategy: offset_target
  subtask_id: reach_clear
  target:
    anchor: task_goal
    offset:
    - 0.0
    - 0.2
    - 0.0
    orientation:
      mode: none
    source: yaml
    tolerance: 0.02
  termination: pose_tolerance
  type: descend
- control: position_control
  generator: linear_cartesian
  id: lateral_shift
  parameters:
    lateral_speed:
      binds_to:
      - mode: scale
        path: generator.speed
      default: 0.08
      range:
      - 0.05
      - 0.15
      type: scalar
  subtask_id: reach_goal
  target:
    anchor: task_goal
    offset:
    - 0.0
    - 0.0
    - 0.0
    orientation:
      mode: keep_current
    source: yaml
    tolerance: 0.02
  termination: pose_tolerance
  type: approach
skill: obstacle_reach
subtasks:
- anchor: goal
  id: reach_clear
  metric: distance
  offset:
  - 0.0
  - 0.2
  - 0.3
  target_entity: tcp
  weight: 0.3
- anchor: goal
  id: reach_goal
  metric: distance
  offset:
  - 0.0
  - 0.0
  - 0.0
  target_entity: tcp
  weight: 0.7
