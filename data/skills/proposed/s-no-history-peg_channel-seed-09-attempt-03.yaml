dsl_version: 2
phases:
- control: position_control
  generator: linear_cartesian
  guards: []
  id: approach_1
  parameters:
    approach_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.15
      range:
      - 0.05
      - 0.3
      type: scalar
  retries:
    max_attempts: 1
    strategy: reduce_speed
  subtask_id: approach_peg
  target:
    anchor: task_object
    offset:
    - 0.0
    - 0.03
    - 0.0
    orientation:
      align_with: channel_axis
      axis:
      - 0
      - 0
      - 1
      mode: align_axis
      tolerance: 0.1
    source: yaml
    tolerance: 0.005
  termination: pose_tolerance
  type: approach
- control: impedance_control
  generator: linear_cartesian
  guards:
  - args: {}
    id: force_guard
    on_failure: abort
    predicate: force_below
    threshold: 30.0
    when: during_phase
  id: push_1
  parameters:
    push_distance:
      binds_to:
      - mode: replace
        path: target.offset_along_axis.distance
      default: 0.16
      range:
      - 0.1
      - 0.2
      type: scalar
    push_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.03
      range:
      - 0.01
      - 0.05
      type: scalar
    push_time_limit:
      binds_to:
      - mode: replace
        path: duration.max_time
      default: 10.0
      range:
      - 5.0
      - 20.0
      type: scalar
  retries:
    max_attempts: 1
    offset:
    - 0.0
    - 0.0
    - 0.005
    strategy: offset_target
  subtask_id: push_peg
  target:
    anchor: task_object
    offset:
    - 0.0
    - 0.0
    - 0.0
    offset_along_axis:
      axis: channel_axis
      distance: 0.16
      mode: replace_offset_projection
      sign: negative
    orientation:
      align_with: channel_axis
      axis:
      - 0
      - 0
      - 1
      mode: align_axis
      tolerance: 0.1
    source: yaml
    tolerance: 0.01
  termination: time_limit
  type: push
- control: position_control
  generator: linear_cartesian
  id: retract_1
  parameters: {}
  target:
    anchor: current_tcp
    offset:
    - 0.0
    - 0.05
    - 0.0
    orientation:
      mode: keep_current
    source: yaml
    tolerance: 0.01
  termination: pose_tolerance
  type: retract
skill: peg_channel
skill_type: arm_gripper
subtasks:
- anchor: object
  id: approach_peg
  metric: distance
  offset:
  - 0.0
  - 0.03
  - 0.0
  target_entity: tcp
  weight: 0.3
- anchor: goal
  id: push_peg
  metric: goal_progress
  target_entity: object
  weight: 0.7
