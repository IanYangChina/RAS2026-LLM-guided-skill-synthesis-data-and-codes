dsl_version: 2
phases:
- control: impedance_control
  generator: impedance_motion
  id: push_1
  parameters:
    push_distance:
      binds_to:
      - mode: replace
        path: target.offset.z
      default: 0.12
      range:
      - 0.02
      - 0.2
      type: scalar
    push_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.05
      range:
      - 0.01
      - 0.1
      type: scalar
  subtask_id: approach_socket
  target:
    anchor: task_goal
    offset:
    - 0.0
    - 0.0
    - 0.04
    source: yaml
  termination: time_limit
  type: push
- control: position_control
  generator: linear_cartesian
  id: align_1
  parameters:
    lateral_offset_x:
      binds_to:
      - mode: add
        path: target.offset.x
      default: 0.0
      range:
      - -0.015
      - 0.015
      type: scalar
    lateral_offset_y:
      binds_to:
      - mode: add
        path: target.offset.y
      default: 0.0
      range:
      - -0.015
      - 0.015
      type: scalar
  subtask_id: approach_socket
  target:
    anchor: task_goal
    offset:
    - 0.0
    - 0.0
    - 0.04
    source: yaml
  termination: pose_tolerance
  type: align
- control: impedance_control
  generator: impedance_motion
  id: descend_1
  parameters:
    descend_force:
      binds_to:
      - mode: replace
        path: termination.force_threshold
      default: 8.0
      range:
      - 2.0
      - 15.0
      type: scalar
  subtask_id: insertion
  target:
    anchor: task_goal
    offset:
    - 0.0
    - 0.0
    - 0.0
    orientation:
      align_with: insertion_axis
      axis:
      - 0.0
      - 0.0
      - 1.0
      mode: align_axis
      tolerance: 0.1
    source: yaml
  termination: force_exceeded
  type: approach
- control: impedance_control
  generator: impedance_motion
  guards:
  - args: {}
    id: force_spike
    on_failure: abort
    predicate: force_below
    threshold: 38.0
    when: during_phase
  id: insert_1
  parameters:
    insertion_depth:
      binds_to:
      - mode: replace
        path: target.offset_along_axis.distance
      default: 0.055
      range:
      - 0.02
      - 0.07
      type: scalar
    insertion_force:
      binds_to:
      - mode: replace
        path: termination.force_threshold
      default: 20.0
      range:
      - 5.0
      - 35.0
      type: scalar
  subtask_id: insertion
  target:
    anchor: fixture
    offset:
    - 0.0
    - 0.0
    - 0.0
    offset_along_axis:
      axis: insertion_axis
      distance: 0.055
      mode: replace_offset_projection
      sign: negative
    orientation:
      align_with: insertion_axis
      axis:
      - 0.0
      - 0.0
      - 1.0
      mode: align_axis
      tolerance: 0.05
    source: yaml
  termination: force_exceeded
  type: insert
skill: peg_insert
skill_type: arm
subtasks:
- anchor: goal
  id: approach_socket
  metric: distance
  offset:
  - 0.0
  - 0.0
  - 0.05
  target_entity: tcp
  weight: 0.3
- anchor: goal
  id: insertion
  metric: goal_progress
  target_entity: tcp
  weight: 0.7
