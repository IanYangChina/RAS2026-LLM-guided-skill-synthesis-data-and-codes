dsl_version: 2
phases:
- control: position_control
  generator: linear_cartesian
  id: approach_1
  parameters:
    approach_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.05
      range:
      - 0.01
      - 0.1
      type: scalar
  subtask_id: reach_pre_contact
  target:
    anchor: task_object
    offset:
    - 0.0
    - 0.02
    - 0.05
    orientation:
      mode: none
    source: yaml
    tolerance: 0.02
  termination: pose_tolerance
  type: approach
- control: force_threshold_switch
  generator: linear_cartesian
  id: descend_1
  parameters:
    contact_force:
      binds_to:
      - mode: replace
        path: termination.force_threshold
      default: 5.0
      range:
      - 1.0
      - 10.0
      type: scalar
    descend_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.01
      range:
      - 0.005
      - 0.03
      type: scalar
  subtask_id: reach_pre_contact
  target:
    anchor: task_object
    offset:
    - 0.0
    - 0.0
    - 0.0
    orientation:
      align_with: channel_axis
      axis:
      - 0.0
      - 0.0
      - 1.0
      mode: align_axis
      tolerance: 0.1
    source: yaml
  termination: force_exceeded
  type: descend
- control: impedance_control
  generator: linear_cartesian
  id: push_1
  parameters:
    push_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.03
      range:
      - 0.01
      - 0.05
      type: scalar
  subtask_id: reach_goal
  target:
    anchor: task_goal
    offset:
    - 0.0
    - 0.0
    - 0.0
    orientation:
      align_with: channel_axis
      axis:
      - 0.0
      - 0.0
      - 1.0
      mode: align_axis
      tolerance: 0.1
    source: yaml
    tolerance: 0.02
  termination: pose_tolerance
  type: push
- control: position_control
  generator: arc_cartesian
  id: retract_1
  parameters:
    retract_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.05
      range:
      - 0.01
      - 0.1
      type: scalar
  target:
    anchor: task_goal
    offset:
    - 0.0
    - 0.0
    - 0.05
    orientation:
      mode: none
    source: yaml
    tolerance: 0.02
  termination: pose_tolerance
  type: retract
skill: peg_channel
subtasks:
- anchor: object
  id: reach_pre_contact
  metric: distance
  offset:
  - 0.0
  - 0.02
  - 0.05
  target_entity: tcp
  weight: 0.3
- anchor: goal
  id: reach_goal
  metric: distance
  offset:
  - 0.0
  - 0.0
  - 0.0
  target_entity: tcp
  weight: 0.7
