dsl_version: 2
phases:
- control: position_control
  generator: linear_cartesian
  id: approach_above_peg
  subtask_id: approach_peg
  target:
    anchor: task_object
    entity: peg
    offset:
    - 0.0
    - 0.0
    - 0.1
    orientation:
      mode: keep_current
    source: yaml
    tolerance: 0.02
  termination: pose_tolerance
  type: approach
- control: position_control
  generator: linear_cartesian
  id: align_tcp
  target:
    anchor: current_tcp
    entity: tcp
    offset:
    - 0.0
    - 0.0
    - 0.0
    orientation:
      align_with: world_y
      axis:
      - 0.0
      - 0.0
      - 1.0
      mode: align_axis
      tolerance: 0.05
    source: yaml
    tolerance: 0.02
  termination: pose_tolerance
  type: rotate
- control: impedance_control
  generator: linear_cartesian
  id: contact_peg
  parameters:
    contact_speed:
      binds_to:
      - mode: scale
        path: generator.speed
      default: 0.012
      range:
      - 0.005
      - 0.025
      type: scalar
  target:
    anchor: current_tcp
    offset:
    - 0.0
    - 0.0
    - -0.1
    orientation:
      mode: keep_current
    source: yaml
    tolerance: 0.01
  termination: contact_detected
  type: descend
- control: admittance_control
  generator: linear_cartesian
  guards:
  - args: {}
    id: force_guard
    on_failure: retry
    predicate: force_below
    threshold: 35.0
    when: during_phase
  id: push_through_channel
  parameters:
    push_speed:
      binds_to:
      - mode: scale
        path: generator.speed
      default: 0.02
      range:
      - 0.008
      - 0.04
      type: scalar
  retries:
    max_attempts: 2
    offset:
    - 0.005
    - 0.0
    - 0.005
    strategy: offset_target
  subtask_id: push_channel
  target:
    anchor: current_tcp
    offset:
    - 0.0
    - 0.0
    - 0.0
    offset_along_axis:
      axis: world_y
      distance: 0.16
      mode: add_to_offset
      sign: negative
    orientation:
      align_with: world_y
      axis:
      - 0.0
      - 0.0
      - 1.0
      mode: align_axis
      tolerance: 0.05
    source: yaml
    tolerance: 0.02
  termination: pose_tolerance
  type: push
- control: position_control
  generator: linear_cartesian
  id: retract
  target:
    anchor: current_tcp
    offset:
    - 0.0
    - 0.06
    - 0.04
    orientation:
      mode: keep_current
    source: yaml
    tolerance: 0.02
  termination: pose_tolerance
  type: retract
skill: peg_channel
skill_type: arm_gripper
subtasks:
- anchor: object
  id: approach_peg
  metric: distance
  offset:
  - 0.0
  - 0.0
  - 0.1
  target_entity: tcp
  weight: 0.3
- anchor: goal
  id: push_channel
  metric: goal_progress
  offset:
  - 0.0
  - 0.0
  - 0.0
  target_entity: tcp
  weight: 0.7
