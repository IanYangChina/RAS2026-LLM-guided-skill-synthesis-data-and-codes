dsl_version: 2
phases:
- control: position_control
  generator: arc_cartesian
  id: pre_approach
  parameters:
    arc_height:
      binds_to:
      - mode: replace
        path: generator.arc_height
      default: 0.1
      range:
      - 0.05
      - 0.2
      type: scalar
    pre_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.15
      range:
      - 0.05
      - 0.3
      type: scalar
    pre_tol:
      binds_to:
      - mode: replace
        path: termination.pose_tolerance
      default: 0.02
      range:
      - 0.01
      - 0.05
      type: scalar
  subtask_id: approach_door
  target:
    anchor: world
    offset:
    - 0.3
    - 0.4
    - 0.45
    orientation:
      mode: keep_current
    source: yaml
    tolerance: 0.02
  termination: pose_tolerance
  type: approach
- control: force_threshold_switch
  generator: linear_cartesian
  guards:
  - args: {}
    id: contact_guard
    on_failure: retry
    predicate: force_below
    threshold: 30.0
    when: during_phase
  id: align_contact
  parameters:
    descend_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.05
      range:
      - 0.02
      - 0.1
      type: scalar
    force_threshold:
      binds_to:
      - mode: replace
        path: termination.force_threshold
      default: 10.0
      range:
      - 5.0
      - 25.0
      type: scalar
  subtask_id: approach_door
  target:
    anchor: world
    offset:
    - 0.1
    - 0.18
    - 0.35
    orientation:
      mode: keep_current
    source: yaml
    tolerance: 0.01
  termination: force_exceeded
  type: descend
- control: impedance_control
  generator: linear_cartesian
  guards:
  - id: door_fully_open
    on_failure: abort
    predicate: hinge_delta_reached
    threshold: 0.9
    when: during_phase
  id: push_open
  parameters:
    door_finish_threshold:
      binds_to:
      - mode: replace
        path: guards.door_fully_open.threshold
      default: 0.9
      range:
      - 0.7
      - 0.95
      type: scalar
    max_time:
      binds_to:
      - mode: replace
        path: duration.max_time
      default: 5.0
      range:
      - 2.0
      - 10.0
      type: scalar
    push_distance:
      binds_to:
      - mode: replace
        path: target.offset_along_axis.distance
      default: 0.21
      range:
      - 0.1
      - 0.3
      type: scalar
    push_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.1
      range:
      - 0.05
      - 0.3
      type: scalar
  retries:
    max_attempts: 2
    strategy: reduce_speed
  subtask_id: open_door
  target:
    anchor: current_tcp
    offset:
    - 0.0
    - 0.0
    - 0.0
    offset_along_axis:
      axis: world_y
      distance: 0.21
      mode: add_to_offset
      sign: negative
    orientation:
      mode: keep_current
    source: yaml
    tolerance: 0.02
  termination: time_limit
  type: push
skill: door_push
subtasks:
- anchor: fixture
  id: approach_door
  metric: distance
  offset:
  - -0.4
  - 0.01
  - 0.35
  target_entity: tcp
  weight: 0.2
- anchor: fixture
  id: open_door
  metric: hinge_angle
  target_entity: hinge
  weight: 0.8
