dsl_version: 2
phases:
- control: position_control
  generator: linear_cartesian
  id: approach_handle
  subtask_id: reach_handle
  target:
    anchor: fixture
    entity: door_panel
    offset:
    - -0.4
    - -0.02
    - 0.4
    orientation:
      mode: keep_current
    source: yaml
    tolerance: 0.02
  termination: pose_tolerance
  type: approach
- control: admittance_control
  generator: linear_cartesian
  guards:
  - args: {}
    id: force_guard
    on_failure: retry
    predicate: force_below
    threshold: 30.0
    when: during_phase
  id: push_door
  parameters:
    push_distance:
      binds_to:
      - mode: replace
        path: target.offset_along_axis.distance
      default: 0.35
      range:
      - 0.2
      - 0.5
      type: scalar
  retries:
    max_attempts: 2
    offset:
    - 0.0
    - 0.005
    - 0.0
    strategy: offset_target
  subtask_id: push_target
  target:
    anchor: fixture
    entity: door_panel
    offset:
    - -0.4
    - -0.02
    - 0.35
    offset_along_axis:
      axis: world_y
      distance: 0.35
      mode: replace_offset_projection
      sign: negative
    orientation:
      mode: keep_current
    source: yaml
  termination: pose_tolerance
  type: push
skill: door_push
subtasks:
- anchor: fixture
  id: reach_handle
  offset:
  - -0.4
  - -0.02
  - 0.4
  weight: 0.2
- id: push_target
  metric: hinge_angle
  target_entity: hinge
  weight: 0.8
