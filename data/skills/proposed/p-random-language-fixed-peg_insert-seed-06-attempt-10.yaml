dsl_version: 2
phases:
- control: position_control
  generator: arc_cartesian
  id: approach_entry
  parameters:
    approach_arc_height:
      binds_to:
      - mode: replace
        path: generator.arc_height
      default: 0.05
      range:
      - 0.02
      - 0.08
      type: scalar
    approach_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.08
      range:
      - 0.02
      - 0.15
      type: scalar
  subtask_id: approach
  target:
    anchor: fixture
    entity: peg_socket
    offset:
    - 0.0
    - 0.0
    - 0.05
    orientation:
      mode: keep_current
    source: yaml
    tolerance: 0.005
  termination: pose_tolerance
  type: approach
- control: position_control
  generator: linear_cartesian
  guards:
  - id: contact_guard_align
    on_failure: retry
    predicate: contact_detected
    threshold: 1
    when: during_phase
  id: align_xy
  parameters:
    align_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.04
      range:
      - 0.01
      - 0.08
      type: scalar
    lateral_x:
      binds_to:
      - mode: add
        path: target.offset.x
      default: 0.0
      range:
      - -0.025
      - 0.025
      type: scalar
    lateral_y:
      binds_to:
      - mode: add
        path: target.offset.y
      default: 0.0
      range:
      - -0.025
      - 0.025
      type: scalar
    retry_lateral_x_align:
      binds_to:
      - mode: add
        path: retry.offset.x
      default: 0.008
      range:
      - -0.025
      - 0.025
      type: scalar
    retry_lateral_y_align:
      binds_to:
      - mode: add
        path: retry.offset.y
      default: 0.008
      range:
      - -0.025
      - 0.025
      type: scalar
  retries:
    max_attempts: 2
    offset:
    - 0.0
    - 0.0
    - 0.0
    strategy: offset_target
  subtask_id: align
  target:
    anchor: fixture
    entity: peg_socket
    offset:
    - 0.0
    - 0.0
    - 0.05
    orientation:
      mode: keep_current
    source: yaml
    tolerance: 0.002
  termination: pose_tolerance
  type: align
- control: impedance_control
  generator: linear_cartesian
  guards:
  - id: force_guard
    on_failure: retry
    predicate: force_below
    threshold: 40.0
    when: during_phase
  id: insertion
  parameters:
    insert_depth_offset:
      binds_to:
      - mode: add
        path: target.offset.z
      default: -0.03
      range:
      - -0.06
      - 0.01
      type: scalar
    insert_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.015
      range:
      - 0.003
      - 0.03
      type: scalar
    retry_lateral_x:
      binds_to:
      - mode: add
        path: retry.offset.x
      default: 0.01
      range:
      - -0.025
      - 0.025
      type: scalar
    retry_lateral_y:
      binds_to:
      - mode: add
        path: retry.offset.y
      default: 0.01
      range:
      - -0.025
      - 0.025
      type: scalar
  retries:
    max_attempts: 3
    offset:
    - 0.0
    - 0.0
    - 0.0
    strategy: offset_target
  subtask_id: insert
  target:
    anchor: fixture
    entity: peg_socket
    offset:
    - 0.0
    - 0.0
    - 0.0
    orientation:
      align_with: channel_axis
      axis:
      - 0.0
      - 0.0
      - 1.0
      mode: align_axis
      tolerance: 0.05
    source: yaml
    tolerance: 0.005
  termination: pose_tolerance
  type: insert
skill: peg_insert
subtasks:
- anchor: object
  id: approach
  offset:
  - 0.0
  - 0.0
  - 0.09
- anchor: object
  id: align
  offset:
  - 0.0
  - 0.0
  - 0.12
- anchor: object
  id: contact
  offset:
  - 0.0
  - 0.0
  - 0.07
- anchor: object
  id: insert
  offset:
  - 0.0
  - 0.0
  - 0.06
