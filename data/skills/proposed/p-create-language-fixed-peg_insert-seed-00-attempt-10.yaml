dsl_version: 2
phases:
- control: position_control
  generator: linear_cartesian
  id: align_1
  subtask_id: align
  target:
    anchor: fixture
    entity: peg_socket
    offset:
    - 0.0
    - 0.0
    - 0.12
    orientation:
      align_with: insertion_axis
      axis:
      - 0.0
      - 0.0
      - 1.0
      mode: align_axis
      tolerance: 0.01
    source: yaml
  termination: pose_tolerance
  type: align
- control: position_control
  generator: linear_cartesian
  id: approach_1
  subtask_id: approach
  target:
    anchor: fixture
    entity: peg_socket
    offset:
    - 0.0
    - 0.0
    - 0.09
    orientation:
      align_with: insertion_axis
      axis:
      - 0.0
      - 0.0
      - 1.0
      mode: align_axis
      tolerance: 0.01
    source: yaml
  termination: pose_tolerance
  type: approach
- control: position_control
  generator: linear_cartesian
  id: descend_1
  parameters:
    descend_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.015
      range:
      - 0.005
      - 0.05
      type: scalar
    descend_z:
      binds_to:
      - mode: replace
        path: target.offset.z
      default: 0.05
      range:
      - 0.035
      - 0.065
      type: scalar
  subtask_id: contact
  target:
    anchor: fixture
    entity: peg_socket
    offset:
    - 0.0
    - 0.0
    - 0.05
    orientation:
      align_with: insertion_axis
      axis:
      - 0.0
      - 0.0
      - 1.0
      mode: align_axis
      tolerance: 0.01
    source: yaml
  termination: pose_tolerance
  type: descend
- control: impedance_control
  generator: impedance_motion
  id: insert_entry
  parameters:
    force_threshold_entry:
      binds_to:
      - mode: replace
        path: termination.force_threshold
      default: 30.0
      range:
      - 20.0
      - 40.0
      type: scalar
    insert_speed_entry:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.006
      range:
      - 0.002
      - 0.02
      type: scalar
  subtask_id: insert
  target:
    anchor: fixture
    entity: peg_socket
    offset:
    - 0.0
    - 0.0
    - 0.02
    orientation:
      align_with: insertion_axis
      axis:
      - 0.0
      - 0.0
      - 1.0
      mode: align_axis
      tolerance: 0.01
    source: yaml
  termination: force_exceeded
  type: insert
- control: impedance_control
  generator: impedance_motion
  id: insert_seat
  parameters:
    seat_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.004
      range:
      - 0.001
      - 0.015
      type: scalar
    seat_tolerance:
      binds_to:
      - mode: replace
        path: termination.pose_tolerance
      default: 0.01
      range:
      - 0.005
      - 0.02
      type: scalar
  target:
    anchor: fixture
    entity: peg_socket
    offset:
    - 0.0
    - 0.0
    - 0.0
    orientation:
      align_with: insertion_axis
      axis:
      - 0.0
      - 0.0
      - 1.0
      mode: align_axis
      tolerance: 0.01
    source: yaml
  termination: pose_tolerance
  type: push
skill: peg_insert
