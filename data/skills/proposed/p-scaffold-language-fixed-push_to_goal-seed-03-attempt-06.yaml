dsl_version: 2
phases:
- control: position_control
  generator: linear_cartesian
  id: approach_1
  parameters:
    speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.05
      range:
      - 0.01
      - 0.1
      type: scalar
  subtask_id: approach
  target:
    anchor: task_object
    entity: push_box
    offset:
    - 0.0
    - 0.08
    - 0.0
    source: yaml
    tolerance: 0.02
  termination: pose_tolerance
  type: approach
- control: force_threshold_switch
  generator: linear_cartesian
  guards:
  - args: {}
    id: force_guard_contact
    on_failure: abort
    predicate: force_below
    threshold: 25.0
    when: during_phase
  id: contact_1
  parameters:
    speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.02
      range:
      - 0.005
      - 0.05
      type: scalar
  retries:
    max_attempts: 2
    offset:
    - 0.0
    - -0.005
    - 0.0
    strategy: offset_target
  subtask_id: contact
  target:
    anchor: task_object
    entity: push_box
    offset:
    - 0.0
    - 0.03
    - 0.0
    source: yaml
    tolerance: 0.02
  termination: contact_detected
  type: contact
- control: impedance_control
  generator: linear_cartesian
  guards:
  - args: {}
    id: force_guard_push
    on_failure: abort
    predicate: force_below
    threshold: 25.0
    when: during_phase
  id: push_1
  parameters:
    push_depth:
      binds_to:
      - mode: replace
        path: target.offset_along_axis.distance
      default: 0.05
      range:
      - 0.01
      - 0.15
      type: scalar
  retries:
    max_attempts: 2
    offset:
    - 0.0
    - 0.005
    - 0.0
    strategy: offset_target
  subtask_id: push
  target:
    anchor: task_goal
    offset:
    - 0.0
    - 0.03
    - 0.0
    offset_along_axis:
      axis: task_goal_direction
      distance: 0.05
      mode: add_to_offset
      sign: positive
    orientation:
      align_with: task_goal_direction
      axis:
      - 0.0
      - 0.0
      - 1.0
      mode: align_axis
      tolerance: 0.1
    source: yaml
    tolerance: 0.02
  termination: pose_tolerance
  type: push
- control: position_control
  generator: linear_cartesian
  id: retract_1
  parameters:
    speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.05
      range:
      - 0.02
      - 0.1
      type: scalar
  target:
    anchor: current_tcp
    offset:
    - 0.0
    - 0.0
    - 0.15
    source: yaml
    tolerance: 0.02
  termination: pose_tolerance
  type: retract
skill: push_to_goal
skill_type: arm
