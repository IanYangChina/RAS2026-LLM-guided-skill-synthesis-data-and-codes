dsl_version: 2
phases:
- control: position_control
  generator: arc_cartesian
  id: arc_approach
  parameters:
    arc_height:
      binds_to:
      - mode: replace
        path: generator.arc_height
      default: 0.1
      range:
      - 0.05
      - 0.2
      type: scalar
    speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.12
      range:
      - 0.08
      - 0.2
      type: scalar
  subtask_id: approach_above
  target:
    anchor: world
    offset:
    - 0.35
    - 0.0
    - 0.52
    source: yaml
  termination: pose_tolerance
  type: approach
- control: impedance_control
  generator: linear_cartesian
  guards:
  - id: contact_guard
    on_failure: retry
    predicate: contact_detected
    when: during_phase
  id: soft_descend
  parameters:
    force_threshold:
      binds_to:
      - mode: replace
        path: termination.force_threshold
      default: 2.0
      range:
      - 1.0
      - 4.0
      type: scalar
    speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.05
      range:
      - 0.03
      - 0.1
      type: scalar
  retries:
    max_attempts: 1
    strategy: reduce_speed
  subtask_id: final_reach
  target:
    anchor: world
    offset:
    - 0.35
    - 0.0
    - 0.32
    source: yaml
  termination: force_exceeded
  type: descend
skill: obstacle_reach
skill_type: arm_gripper
subtasks:
- anchor: world
  id: approach_above
  metric: distance
  offset:
  - 0.35
  - 0.0
  - 0.52
  target_entity: tcp
  weight: 0.3
- anchor: world
  id: final_reach
  metric: distance
  offset:
  - 0.35
  - 0.0
  - 0.32
  target_entity: tcp
  weight: 0.7
