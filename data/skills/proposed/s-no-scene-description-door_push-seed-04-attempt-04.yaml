dsl_version: 2
phases:
- control: position_control
  generator: linear_cartesian
  id: approach_1
  parameters:
    approach_x:
      binds_to:
      - mode: replace
        path: target.offset.x
      default: 0.15
      range:
      - 0.1
      - 0.2
      type: scalar
    approach_y:
      binds_to:
      - mode: replace
        path: target.offset.y
      default: 0.16
      range:
      - 0.12
      - 0.2
      type: scalar
  subtask_id: approach_contact
  target:
    anchor: fixture
    offset:
    - 0.15
    - 0.16
    - 0.35
    source: yaml
    tolerance: 0.02
  termination: pose_tolerance
  type: approach
- control: position_control
  generator: linear_cartesian
  id: push_1
  parameters:
    approach_x:
      binds_to:
      - mode: replace
        path: target.offset.x
      default: 0.15
      range:
      - 0.1
      - 0.2
      type: scalar
    approach_y:
      binds_to:
      - mode: replace
        path: target.offset.y
      default: 0.16
      range:
      - 0.12
      - 0.2
      type: scalar
    push_distance:
      binds_to:
      - mode: replace
        path: target.offset_along_axis.distance
      default: 0.2
      range:
      - 0.05
      - 0.3
      type: scalar
    push_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.05
      range:
      - 0.01
      - 0.1
      type: scalar
  subtask_id: push_door
  target:
    anchor: fixture
    offset:
    - 0.15
    - 0.16
    - 0.35
    offset_along_axis:
      axis: world_y
      distance: 0.2
      mode: add_to_offset
      sign: negative
    source: yaml
  termination: time_limit
  type: push
- control: position_control
  generator: linear_cartesian
  id: retract_1
  parameters: {}
  target:
    anchor: fixture
    offset:
    - 0.15
    - 0.16
    - 0.45
    source: yaml
  termination: time_limit
  type: retract
skill: door_push
skill_type: arm_gripper
subtasks:
- anchor: fixture
  id: approach_contact
  metric: distance
  offset:
  - 0.15
  - 0.16
  - 0.35
  target_entity: tcp
  weight: 0.3
- anchor: fixture
  id: push_door
  metric: hinge_angle
  offset:
  - 0.0
  - 0.0
  - 0.0
  target_entity: hinge
  weight: 0.7
