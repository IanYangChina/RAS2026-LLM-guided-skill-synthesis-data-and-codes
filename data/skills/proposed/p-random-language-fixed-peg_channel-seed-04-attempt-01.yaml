dsl_version: 2
phases:
- control: position_control
  generator: linear_cartesian
  id: approach_peg
  parameters:
    approach_speed:
      binds_to:
      - mode: add
        path: generator.speed
      default: 0.05
      range:
      - 0.01
      - 0.2
      type: scalar
    approach_tolerance:
      binds_to:
      - mode: add
        path: termination.pose_tolerance
      default: 0.01
      range:
      - 0.001
      - 0.05
      type: scalar
  subtask_id: approach
  target:
    anchor: task_object
    offset:
    - 0
    - 0.04
    - 0
    orientation:
      align_with: channel_axis
      axis:
      - 0
      - 0
      - 1
      mode: align_axis
      tolerance: 0.1
    source: yaml
  termination: pose_tolerance
  type: approach
- control: position_control
  generator: linear_cartesian
  id: contact_peg
  parameters:
    descend_speed:
      binds_to:
      - mode: add
        path: generator.speed
      default: 0.01
      range:
      - 0.005
      - 0.05
      type: scalar
  subtask_id: contact
  target:
    anchor: task_object
    offset:
    - 0
    - 0.02
    - 0
    orientation:
      mode: keep_current
    source: yaml
  termination: contact_detected
  type: descend
- control: impedance_control
  generator: linear_cartesian
  guards:
  - args: {}
    id: force_limit_guard
    on_failure: abort
    predicate: force_below
    threshold: 40.0
    when: during_phase
  id: push_through_channel
  parameters:
    push_depth:
      binds_to:
      - mode: add
        path: target.offset_along_axis.distance
      default: 0.16
      range:
      - 0.05
      - 0.2
      type: scalar
    push_force_threshold:
      binds_to:
      - mode: add
        path: termination.force_threshold
      default: 40.0
      range:
      - 5.0
      - 40.0
      type: scalar
    push_speed:
      binds_to:
      - mode: add
        path: generator.speed
      default: 0.02
      range:
      - 0.005
      - 0.05
      type: scalar
  retries:
    max_attempts: 2
    offset:
    - 0
    - -0.01
    - 0
    strategy: offset_target
  subtask_id: push
  target:
    anchor: current_tcp
    offset_along_axis:
      axis:
      - 0
      - -1
      - 0
      distance: 0.16
      mode: add_to_offset
    orientation:
      align_with: channel_axis
      axis:
      - 0
      - 0
      - 1
      mode: align_axis
      tolerance: 0.1
    source: yaml
  termination: force_exceeded
  type: push
skill: peg_channel
skill_type: arm_gripper
