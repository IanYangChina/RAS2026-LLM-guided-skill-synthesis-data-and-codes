dsl_version: 2
phases:
- control: position_control
  generator: linear_cartesian
  guards: []
  id: approach_handle
  orientation:
    mode: none
  parameters:
    approach_offset_z:
      binds_to:
      - mode: replace
        path: target.offset.z
      default: 0.38
      range:
      - 0.35
      - 0.45
      type: scalar
    approach_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.05
      range:
      - 0.02
      - 0.1
      type: scalar
  retries:
    max_attempts: 0
  subtask_id: reach_handle
  target:
    anchor: fixture
    offset:
    - -0.4
    - -0.02
    - 0.38
    source: yaml
    tolerance: 0.03
  termination: pose_tolerance
  type: approach
- control: impedance_control
  generator: linear_cartesian
  guards: []
  id: push_door
  parameters:
    push_distance:
      binds_to:
      - mode: replace
        path: target.offset_along_axis.distance
      default: 0.06
      range:
      - 0.02
      - 0.15
      type: scalar
    push_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.04
      range:
      - 0.01
      - 0.08
      type: scalar
  retries:
    max_attempts: 0
  subtask_id: push_door_score
  target:
    anchor: fixture
    offset:
    - -0.4
    - -0.02
    - 0.35
    offset_along_axis:
      axis: world_y
      distance: 0.06
      mode: add_to_offset
      sign: positive
    orientation:
      align_with: world_y
      axis:
      - 0
      - 1
      - 0
      mode: align_axis
      tolerance: 0.1
    source: yaml
    tolerance: 0.02
  termination: pose_tolerance
  type: push
skill: door_push
skill_type: arm
subtasks:
- anchor: fixture
  id: reach_handle
  metric: distance
  offset:
  - -0.4
  - -0.02
  - 0.38
  target_entity: tcp
  weight: 0.3
- anchor: fixture
  id: push_door_score
  metric: hinge_angle
  target_entity: hinge
  weight: 0.7
