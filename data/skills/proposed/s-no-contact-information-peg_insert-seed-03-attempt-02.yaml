dsl_version: 2
phases:
- control: position_control
  generator: impedance_motion
  id: rotate_1
  orientation:
    align_with: insertion_axis
    axis:
    - 0.0
    - 0.0
    - 1.0
    mode: align_axis
    tolerance: 0.05
  subtask_id: reach_above_socket
  target:
    anchor: current_tcp
    entity: null
    offset:
    - 0.0
    - 0.0
    - 0.0
    source: yaml
  termination: pose_tolerance
  type: rotate
- control: position_control
  generator: linear_cartesian
  id: align_1
  orientation:
    mode: keep_current
  parameters:
    align_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.05
      range:
      - 0.02
      - 0.1
      type: scalar
  subtask_id: reach_above_socket
  target:
    anchor: task_goal
    entity: null
    offset:
    - 0.0
    - 0.0
    - 0.12
    source: yaml
  termination: pose_tolerance
  type: align
- control: admittance_control
  generator: linear_cartesian
  id: descend_1
  orientation:
    mode: keep_current
  parameters:
    descend_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.025
      range:
      - 0.01
      - 0.05
      type: scalar
    descend_tol:
      binds_to:
      - mode: replace
        path: termination.pose_tolerance
      default: 0.01
      range:
      - 0.005
      - 0.02
      type: scalar
  subtask_id: reach_above_socket
  target:
    anchor: task_goal
    entity: null
    offset:
    - 0.0
    - 0.0
    - 0.08
    source: yaml
  termination: pose_tolerance
  type: descend
- control: impedance_control
  generator: linear_cartesian
  guards:
  - args: {}
    id: force_guard
    on_failure: abort
    predicate: force_below
    threshold: 30.0
    when: during_phase
  id: insert_1
  orientation:
    mode: keep_current
  parameters:
    force_limit:
      binds_to:
      - mode: replace
        path: termination.force_threshold
      default: 25.0
      range:
      - 10.0
      - 35.0
      type: scalar
    insert_depth:
      binds_to:
      - mode: replace
        path: target.offset_along_axis.distance
      default: 0.04
      range:
      - 0.02
      - 0.06
      type: scalar
  retries:
    max_attempts: 1
    offset:
    - 0.005
    - 0.0
    - 0.0
    strategy: offset_target
  subtask_id: insert_peg
  target:
    anchor: task_goal
    entity: null
    offset:
    - 0.0
    - 0.0
    - 0.0
    offset_along_axis:
      axis: insertion_axis
      distance: 0.04
      mode: add_to_offset
      sign: negative
    source: yaml
  termination: force_exceeded
  type: push
skill: peg_insert
subtasks:
- anchor: goal
  id: reach_above_socket
  offset:
  - 0.0
  - 0.0
  - 0.1
  target_entity: tcp
  weight: 0.3
- anchor: goal
  id: insert_peg
  offset:
  - 0.0
  - 0.0
  - -0.03
  target_entity: tcp
  weight: 0.7
