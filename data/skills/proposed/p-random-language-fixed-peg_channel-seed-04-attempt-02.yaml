skill: peg_channel
dsl_version: 2
skill_type: arm_gripper
subtasks:
  - id: approach
    anchor: object
    target_entity: object
    metric: distance
    offset: [0.0, 0.04, 0.0]
    weight: 1.0
  - id: contact
    anchor: object
    target_entity: object
    metric: distance
    offset: [0.0, 0.02, 0.0]
    weight: 1.0
  - id: push
    anchor: world
    target_entity: tcp
    metric: distance
    offset: [0.50, -0.08, 0.04]
    weight: 1.0
phases:
  - id: approach_peg
    type: approach
    generator: linear_cartesian
    control: position_control
    termination: pose_tolerance
    target:
      source: yaml
      anchor: task_object
      entity: peg
      offset: [0.0, 0.02, 0.08]
      orientation:
        mode: keep_current
      tolerance: 0.02
    subtask_id: approach
    parameters:
      approach_height:
        type: scalar
        range: [0.05, 0.15]
        default: 0.08
        binds_to:
          - path: target.offset.z
            mode: add
      approach_speed:
        type: scalar
        range: [0.05, 0.2]
        default: 0.1
        binds_to:
          - path: generator.speed
            mode: replace
    retries:
      max_attempts: 1
      strategy: repeat
      offset: [0.0, 0.0, -0.01]
  - id: contact_peg
    type: contact
    generator: linear_cartesian
    control: force_threshold_switch
    termination: force_exceeded
    target:
      source: yaml
      anchor: task_object
      entity: peg
      offset: [0.0, 0.02, 0.04]
      orientation:
        mode: keep_current
      tolerance: 0.01
    subtask_id: contact
    parameters:
      contact_force_threshold:
        type: scalar
        range: [1.0, 10.0]
        default: 5.0
        binds_to:
          - path: termination.force_threshold
            mode: replace
      contact_speed:
        type: scalar
        range: [0.01, 0.05]
        default: 0.02
        binds_to:
          - path: generator.speed
            mode: replace
    guards:
      - id: contact_guard
        when: after_phase
        predicate: contact_detected
        args: {body_a: attachment_site, body_b: peg}
        threshold: 0.1
        on_failure: abort
    retries:
      max_attempts: 2
      strategy: offset_target
      offset: [0.0, 0.005, 0.0]
  - id: push_through_channel
    type: push
    generator: linear_cartesian
    control: impedance_control
    termination: pose_tolerance
    target:
      source: yaml
      anchor: world
      offset: [0.50, 0.08, 0.04]
      offset_along_axis:
        distance: 0.16
        axis: channel_axis
        mode: add_to_offset
        sign: positive
      orientation:
        mode: keep_current
      tolerance: 0.02
    subtask_id: push
    parameters:
      push_depth:
        type: scalar
        range: [0.02, 0.2]
        default: 0.16
        binds_to:
          - path: target.offset_along_axis.distance
            mode: replace
      push_speed:
        type: scalar
        range: [0.01, 0.1]
        default: 0.05
        binds_to:
          - path: generator.speed
            mode: replace
    guards:
      - id: force_limit
        when: during_phase
        predicate: force_below
        threshold: 40.0
        on_failure: abort
```