dsl_version: 2
phases:
- control: position_control
  generator: linear_cartesian
  id: approach_behind
  orientation:
    mode: keep_current
  parameters:
    speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.2
      range:
      - 0.1
      - 0.5
      type: scalar
  target:
    anchor: task_object
    entity: push_box
    offset:
    - 0.0
    - 0.0
    - 0.1
    offset_along_axis:
      axis: task_goal_direction
      distance: 0.08
      mode: replace_offset_projection
      sign: negative
    source: yaml
    tolerance: 0.02
  termination: pose_tolerance
  type: approach
- control: position_control
  generator: linear_cartesian
  id: descend_behind
  orientation:
    mode: keep_current
  parameters:
    speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.05
      range:
      - 0.02
      - 0.2
      type: scalar
  target:
    anchor: task_object
    entity: push_box
    offset:
    - 0.0
    - 0.0
    - 0.0
    offset_along_axis:
      axis: task_goal_direction
      distance: 0.08
      mode: replace_offset_projection
      sign: negative
    source: yaml
    tolerance: 0.01
  termination: pose_tolerance
  type: descend
- control: force_threshold_switch
  generator: linear_cartesian
  guards:
  - id: pre_force
    on_failure: abort
    predicate: force_below
    threshold: 15.0
    when: before_phase
  id: contact_make
  orientation:
    align_with: task_goal_direction
    axis:
    - 0.0
    - 0.0
    - 1.0
    mode: align_axis
    tolerance: 0.05
  parameters:
    contact_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.03
      range:
      - 0.01
      - 0.1
      type: scalar
    force_threshold:
      binds_to:
      - mode: replace
        path: termination.force_threshold
      default: 2.0
      range:
      - 0.5
      - 5.0
      type: scalar
  target:
    anchor: task_object
    entity: push_box
    offset:
    - 0.0
    - 0.0
    - 0.0
    offset_along_axis:
      axis: task_goal_direction
      distance: 0.06
      mode: replace_offset_projection
      sign: positive
    source: yaml
    tolerance: 0.01
  termination: force_exceeded
  type: contact
- control: admittance_control
  generator: linear_cartesian
  guards:
  - id: force_limit_guard
    on_failure: abort
    predicate: force_below
    threshold: 30.0
    when: during_phase
  id: push_to_goal
  orientation:
    align_with: task_goal_direction
    axis:
    - 0.0
    - 0.0
    - 1.0
    mode: align_axis
    tolerance: 0.05
  parameters:
    max_time:
      binds_to:
      - mode: replace
        path: duration.max_time
      default: 10.0
      range:
      - 3.0
      - 15.0
      type: scalar
    push_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.03
      range:
      - 0.01
      - 0.05
      type: scalar
    stroke_distance:
      binds_to:
      - mode: replace
        path: target.offset_along_axis.distance
      default: 0.2
      range:
      - 0.1
      - 0.3
      type: scalar
  retries:
    max_attempts: 2
    offset:
    - 0.02
    - 0.02
    - 0.0
    strategy: offset_target
  subtask_id: push_progress
  target:
    anchor: task_goal
    offset:
    - 0.0
    - 0.0
    - 0.0
    offset_along_axis:
      axis: task_goal_direction
      distance: 0.2
      mode: replace_offset_projection
      sign: positive
    source: yaml
    tolerance: 0.02
  termination: time_limit
  type: push
skill: push_to_goal
subtasks:
- anchor: object
  id: push_progress
  metric: goal_progress
  target_entity: object
