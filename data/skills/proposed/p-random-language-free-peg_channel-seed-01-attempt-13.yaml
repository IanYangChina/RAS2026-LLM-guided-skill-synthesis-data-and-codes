dsl_version: 2
phases:
- control: position_control
  generator: linear_cartesian
  id: approach_1
  parameters:
    approach_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.3
      range:
      - 0.1
      - 0.5
      type: scalar
    approach_y:
      binds_to:
      - mode: replace
        path: target.offset.y
      default: 0.1
      range:
      - 0.05
      - 0.2
      type: scalar
  subtask_id: reach_pre_contact
  target:
    anchor: world
    offset:
    - 0.5
    - 0.1
    - 0.15
    orientation:
      mode: keep_current
    source: yaml
    tolerance: 0.01
  termination: pose_tolerance
  type: approach
- control: position_control
  generator: linear_cartesian
  id: descend_safe
  parameters:
    descend_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.1
      range:
      - 0.05
      - 0.2
      type: scalar
    descend_y:
      binds_to:
      - mode: replace
        path: target.offset.y
      default: 0.1
      range:
      - 0.05
      - 0.2
      type: scalar
  subtask_id: reach_pre_contact
  target:
    anchor: world
    offset:
    - 0.5
    - 0.1
    - 0.09
    orientation:
      mode: keep_current
    source: yaml
    tolerance: 0.01
  termination: pose_tolerance
  type: descend
- control: position_control
  generator: linear_cartesian
  id: align_to_peg
  parameters:
    align_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.1
      range:
      - 0.05
      - 0.2
      type: scalar
    align_x:
      binds_to:
      - mode: replace
        path: target.offset.x
      default: 0.0
      range:
      - -0.02
      - 0.02
      type: scalar
  subtask_id: reach_pre_contact
  target:
    anchor: task_object
    offset:
    - 0.0
    - 0.03
    - 0.05
    orientation:
      mode: keep_current
    source: yaml
    tolerance: 0.01
  termination: pose_tolerance
  type: align
- control: impedance_control
  generator: linear_cartesian
  id: descend_final
  parameters:
    descend_final_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.08
      range:
      - 0.03
      - 0.15
      type: scalar
    descend_height:
      binds_to:
      - mode: replace
        path: target.offset.z
      default: 0.0
      range:
      - -0.01
      - 0.02
      type: scalar
  subtask_id: reach_pre_contact
  target:
    anchor: task_object
    offset:
    - 0.0
    - 0.0
    - 0.0
    orientation:
      mode: keep_current
    source: yaml
    tolerance: 0.01
  termination: pose_tolerance
  type: descend
- control: impedance_control
  generator: impedance_motion
  guards:
  - id: force_guard
    on_failure: retry
    predicate: force_below
    threshold: 30.0
    when: during_phase
  id: push_1
  parameters:
    guard_force_threshold:
      binds_to:
      - mode: replace
        path: guards.force_guard.threshold
      default: 30.0
      range:
      - 25.0
      - 35.0
      type: scalar
    push_distance:
      binds_to:
      - mode: replace
        path: target.offset_along_axis.distance
      default: 0.18
      range:
      - 0.12
      - 0.25
      type: scalar
    push_force_limit:
      binds_to:
      - mode: replace
        path: termination.force_threshold
      default: 40.0
      range:
      - 35.0
      - 45.0
      type: scalar
    push_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.08
      range:
      - 0.03
      - 0.15
      type: scalar
    retry_lateral_x:
      binds_to:
      - mode: replace
        path: retry.offset.x
      default: 0.008
      range:
      - 0.003
      - 0.015
      type: scalar
  retries:
    max_attempts: 5
    offset:
    - 0.008
    - 0.0
    - 0.0
    strategy: offset_target
  subtask_id: push_channel
  target:
    anchor: current_tcp
    offset:
    - 0.0
    - 0.0
    - 0.0
    offset_along_axis:
      axis: channel_axis
      distance: 0.18
      mode: add_to_offset
      sign: positive
    orientation:
      mode: keep_current
    source: yaml
  termination: force_exceeded
  type: push
- control: position_control
  generator: linear_cartesian
  id: retract_1
  parameters:
    retract_height:
      binds_to:
      - mode: replace
        path: target.offset.z
      default: 0.15
      range:
      - 0.1
      - 0.25
      type: scalar
    retract_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.3
      range:
      - 0.1
      - 0.5
      type: scalar
  subtask_id: push_channel
  target:
    anchor: current_tcp
    offset:
    - 0.0
    - 0.0
    - 0.15
    orientation:
      mode: keep_current
    source: yaml
    tolerance: 0.01
  termination: pose_tolerance
  type: retract
skill: peg_channel
subtasks:
- anchor: object
  id: reach_pre_contact
  offset:
  - 0.0
  - 0.03
  - 0.05
  weight: 0.3
- id: push_channel
  metric: goal_progress
  target_entity: object
  weight: 0.7
