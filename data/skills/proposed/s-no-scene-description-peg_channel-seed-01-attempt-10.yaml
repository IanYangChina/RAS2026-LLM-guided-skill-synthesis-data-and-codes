dsl_version: 2
phases:
- control: position_control
  generator: linear_cartesian
  id: approach_entry
  parameters:
    approach_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.08
      range:
      - 0.02
      - 0.2
      type: scalar
  retries:
    max_attempts: 1
    offset:
    - 0
    - 0
    - 0.01
    strategy: offset_target
  subtask_id: reach_entry
  target:
    anchor: task_object
    offset:
    - 0
    - 0
    - 0.105
    orientation:
      align_with: channel_axis
      axis:
      - 0
      - 0
      - 1
      mode: align_axis
      tolerance: 0.15
    source: yaml
    tolerance: 0.02
  termination: pose_tolerance
  type: approach
- control: impedance_control
  generator: linear_cartesian
  guards:
  - args: {}
    id: force_limit
    on_failure: retry
    predicate: force_below
    threshold: 30
    when: during_phase
  id: push_through_channel
  parameters:
    force_limit_threshold:
      binds_to:
      - mode: replace
        path: guards.force_limit.threshold
      default: 30
      range:
      - 15
      - 38
      type: scalar
    push_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.03
      range:
      - 0.01
      - 0.08
      type: scalar
  retries:
    max_attempts: 1
    offset:
    - 0
    - 0.003
    - 0
    strategy: offset_target
  subtask_id: traverse_channel
  target:
    anchor: task_goal
    offset:
    - 0
    - 0
    - 0.105
    orientation:
      mode: keep_current
    source: yaml
    tolerance: 0.03
  termination: pose_tolerance
  type: push
skill: peg_channel
skill_type: arm_gripper
subtasks:
- anchor: object
  id: reach_entry
  metric: distance
  offset:
  - 0
  - 0
  - 0.105
  target_entity: tcp
  weight: 0.3
- anchor: goal
  id: traverse_channel
  metric: goal_progress
  offset:
  - 0
  - 0
  - 0.105
  target_entity: tcp
  weight: 0.7
