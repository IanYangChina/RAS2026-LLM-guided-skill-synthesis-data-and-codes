dsl_version: 2
phases:
- control: position_control
  generator: linear_cartesian
  id: approach_1
  parameters:
    approach_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.2
      range:
      - 0.05
      - 0.3
      type: scalar
    approach_z:
      binds_to:
      - mode: replace
        path: target.offset.z
      default: 0.08
      range:
      - 0.06
      - 0.15
      type: scalar
  subtask_id: reach_above_peg
  target:
    anchor: task_object
    offset:
    - 0.0
    - 0.05
    - 0.08
    orientation:
      mode: keep_current
      tolerance: 0.05
    source: yaml
  termination: pose_tolerance
  type: approach
- control: position_control
  generator: linear_cartesian
  id: descend_1
  parameters:
    descend_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.08
      range:
      - 0.02
      - 0.15
      type: scalar
  subtask_id: contact_peg
  target:
    anchor: task_object
    offset:
    - 0.0
    - 0.03
    - 0.0
    orientation:
      mode: keep_current
      tolerance: 0.05
    source: yaml
  termination: pose_tolerance
  type: descend
- control: impedance_control
  generator: linear_cartesian
  guards:
  - id: force_limit_guard
    on_failure: abort
    predicate: force_below
    threshold: 40.0
    when: during_phase
  - id: progress_guard
    on_failure: retry
    predicate: object_progress
    threshold: 0.02
    when: during_phase
  id: push_1
  parameters:
    lateral_offset_x:
      binds_to:
      - mode: replace
        path: target.offset.x
      default: 0.0
      range:
      - -0.01
      - 0.01
      type: scalar
    push_distance:
      binds_to:
      - mode: replace
        path: target.offset_along_axis.distance
      default: 0.2
      range:
      - 0.12
      - 0.28
      type: scalar
    push_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.06
      range:
      - 0.02
      - 0.15
      type: scalar
  retries:
    max_attempts: 2
    offset:
    - 0.005
    - 0.0
    - 0.0
    strategy: offset_target
  subtask_id: push_through_channel
  target:
    anchor: task_object
    offset:
    - 0.0
    - 0.0
    - 0.0
    offset_along_axis:
      axis: task_goal_direction
      distance: 0.2
      mode: add_to_offset
      sign: positive
    orientation:
      align_with: channel_axis
      axis:
      - 1
      - 0
      - 0
      mode: align_axis
      tolerance: 0.1
    source: yaml
  termination: pose_tolerance
  type: push
skill: peg_channel
subtasks:
- anchor: object
  id: reach_above_peg
  offset:
  - 0.0
  - 0.05
  - 0.08
  weight: 0.3
- anchor: object
  id: contact_peg
  offset:
  - 0.0
  - 0.03
  - 0.0
  weight: 0.3
- id: push_through_channel
  metric: goal_progress
  weight: 0.4
