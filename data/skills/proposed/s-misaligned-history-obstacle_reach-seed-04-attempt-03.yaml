dsl_version: 2
phases:
- control: position_control
  generator: linear_cartesian
  id: clear_1
  parameters:
    clear_x:
      binds_to:
      - mode: replace
        path: target.offset.x
      default: 0.55
      range:
      - 0.45
      - 0.65
      type: scalar
    clear_z:
      binds_to:
      - mode: replace
        path: target.offset.z
      default: 0.45
      range:
      - 0.35
      - 0.55
      type: scalar
    speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.1
      range:
      - 0.05
      - 0.2
      type: scalar
  subtask_id: clear_obstacle
  target:
    anchor: world
    offset:
    - 0.55
    - 0.0
    - 0.45
    orientation:
      mode: keep_current
    source: yaml
    tolerance: 0.02
  termination: pose_tolerance
  type: approach
- control: position_control
  generator: linear_cartesian
  id: approach_goal_1
  parameters:
    above_goal_z:
      binds_to:
      - mode: replace
        path: target.offset.z
      default: 0.25
      range:
      - 0.15
      - 0.35
      type: scalar
    speed2:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.1
      range:
      - 0.05
      - 0.2
      type: scalar
  subtask_id: reach_goal
  target:
    anchor: task_goal
    offset:
    - 0.0
    - 0.0
    - 0.25
    orientation:
      align_with: world_z
      axis:
      - 0.0
      - 0.0
      - 1.0
      mode: align_axis
      tolerance: 0.05
    source: yaml
    tolerance: 0.02
  termination: pose_tolerance
  type: approach
- control: position_control
  generator: linear_cartesian
  guards:
  - args: {}
    id: descend_check
    on_failure: retry
    predicate: pose_within_tolerance
    threshold: 0.02
    when: after_phase
  id: descend_1
  parameters:
    descend_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.05
      range:
      - 0.02
      - 0.1
      type: scalar
    descend_tolerance:
      binds_to:
      - mode: replace
        path: termination.pose_tolerance
      default: 0.02
      range:
      - 0.01
      - 0.03
      type: scalar
    guard_threshold:
      binds_to:
      - mode: replace
        path: guards.descend_check.threshold
      default: 0.02
      range:
      - 0.01
      - 0.03
      type: scalar
    retry_x:
      binds_to:
      - mode: replace
        path: retries.offset.x
      default: 0.005
      range:
      - -0.01
      - 0.01
      type: scalar
    retry_y:
      binds_to:
      - mode: replace
        path: retries.offset.y
      default: 0.005
      range:
      - -0.01
      - 0.01
      type: scalar
  retries:
    max_attempts: 1
    offset:
    - 0.005
    - 0.005
    - 0.0
    strategy: offset_target
  subtask_id: reach_goal
  target:
    anchor: task_goal
    offset:
    - 0.0
    - 0.0
    - 0.0
    orientation:
      align_with: world_z
      axis:
      - 0.0
      - 0.0
      - 1.0
      mode: align_axis
      tolerance: 0.05
    source: yaml
    tolerance: 0.02
  termination: pose_tolerance
  type: descend
skill: obstacle_reach
skill_type: arm_gripper
subtasks:
- anchor: world
  id: clear_obstacle
  offset:
  - 0.55
  - 0.0
  - 0.45
  target_entity: tcp
  weight: 0.3
- anchor: goal
  id: reach_goal
  target_entity: tcp
  weight: 0.7
