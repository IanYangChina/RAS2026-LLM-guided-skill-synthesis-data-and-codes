dsl_version: 2
phases:
- control: position_control
  generator: linear_cartesian
  id: approach_1
  parameters:
    approach_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.15
      range:
      - 0.05
      - 0.3
      type: scalar
  subtask_id: contact_peg
  target:
    anchor: task_object
    entity: peg
    offset:
    - 0
    - 0
    - 0.1
    orientation:
      mode: keep_current
    source: yaml
    tolerance: 0.02
  termination: pose_tolerance
  type: approach
- control: force_threshold_switch
  generator: linear_cartesian
  id: contact_1
  parameters:
    contact_force_threshold:
      binds_to:
      - mode: replace
        path: termination.force_threshold
      default: 10.0
      range:
      - 5.0
      - 20.0
      type: scalar
    descend_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.04
      range:
      - 0.01
      - 0.08
      type: scalar
  subtask_id: contact_peg
  target:
    anchor: task_object
    entity: peg
    offset:
    - 0
    - 0
    - 0.005
    orientation:
      mode: keep_current
    source: yaml
    tolerance: 0.005
  termination: force_exceeded
  type: descend
- control: impedance_control
  generator: impedance_motion
  guards:
  - args: {}
    id: lateral_force_guard
    predicate: force_below
    threshold: 30.0
    when: during_phase
  id: push_through_1
  parameters:
    lateral_offset_x:
      binds_to:
      - mode: replace
        path: retry.offset.x
      default: 0.005
      range:
      - -0.01
      - 0.01
      type: scalar
  retries:
    max_attempts: 2
    offset:
    - 0.005
    - 0
    - 0
    strategy: offset_target
  subtask_id: push_through
  target:
    anchor: current_tcp
    entity: null
    offset:
    - 0
    - 0
    - 0
    offset_along_axis:
      axis: channel_axis
      distance: 0.16
      mode: add_to_offset
      sign: positive
    orientation:
      mode: keep_current
    source: yaml
  termination: pose_tolerance
  type: push
skill: peg_channel
subtasks:
- anchor: object
  id: contact_peg
  metric: distance
  offset:
  - 0
  - 0
  - 0
  target_entity: tcp
  weight: 0.3
- anchor: goal
  id: push_through
  metric: goal_progress
  offset:
  - 0
  - 0
  - 0
  target_entity: tcp
  weight: 0.7
