dsl_version: 2
phases:
- control: force_threshold_switch
  generator: linear_cartesian
  id: approach_1
  parameters:
    approach_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.2
      range:
      - 0.05
      - 0.3
      type: scalar
    contact_force_threshold:
      binds_to:
      - mode: replace
        path: termination.force_threshold
      default: 8
      range:
      - 5
      - 15
      type: scalar
  subtask_id: approach_handle
  target:
    anchor: task_goal
    offset:
    - 0.0
    - 0.0
    - 0.0
    orientation:
      mode: none
    source: yaml
    tolerance: 0.05
  termination: force_exceeded
  type: approach
- control: impedance_control
  generator: linear_cartesian
  guards:
  - id: force_limit
    on_failure: continue
    predicate: force_below
    threshold: 30.0
    when: during_phase
  id: push_1
  parameters:
    push_distance:
      binds_to:
      - mode: replace
        path: target.offset_along_axis.distance
      default: 0.2
      range:
      - 0.1
      - 0.4
      type: scalar
    push_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.05
      range:
      - 0.02
      - 0.1
      type: scalar
  subtask_id: push_door
  target:
    anchor: task_goal
    offset:
    - 0.0
    - 0.0
    - 0.0
    offset_along_axis:
      axis: world_x
      distance: 0.2
      mode: add_to_offset
      sign: negative
    orientation:
      mode: keep_current
    source: yaml
    tolerance: 0.05
  termination: pose_tolerance
  type: push
skill: door_push
subtasks:
- anchor: goal
  id: approach_handle
  metric: distance
  offset:
  - 0.0
  - 0.0
  - 0.0
  target_entity: tcp
  weight: 0.3
- anchor: object
  id: push_door
  metric: hinge_angle
  target_entity: hinge
  weight: 0.7
