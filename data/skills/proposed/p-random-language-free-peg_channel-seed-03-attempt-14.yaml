dsl_version: 2
phases:
- control: position_control
  generator: linear_cartesian
  id: approach_behind
  parameters:
    approach_height:
      binds_to:
      - mode: replace
        path: target.offset.z
      default: 0.15
      range:
      - 0.1
      - 0.2
      type: scalar
  subtask_id: approach_peg
  target:
    anchor: task_object
    entity: peg
    offset:
    - 0.0
    - 0.05
    - 0.15
    orientation:
      mode: none
    source: yaml
    tolerance: 0.02
  termination: pose_tolerance
  type: approach
- control: position_control
  generator: linear_cartesian
  id: align_descend
  parameters:
    descend_y_offset:
      binds_to:
      - mode: replace
        path: target.offset.y
      default: 0.03
      range:
      - 0.02
      - 0.05
      type: scalar
    descend_z_offset:
      binds_to:
      - mode: replace
        path: target.offset.z
      default: 0.015
      range:
      - 0.01
      - 0.03
      type: scalar
  subtask_id: approach_peg
  target:
    anchor: task_object
    entity: peg
    offset:
    - 0.0
    - 0.03
    - 0.015
    orientation:
      align_with: channel_axis
      axis:
      - 0.0
      - 0.0
      - 1.0
      mode: align_axis
      tolerance: 0.05
    source: yaml
    tolerance: 0.01
  termination: pose_tolerance
  type: descend
- control: impedance_control
  generator: linear_cartesian
  guards:
  - args: {}
    id: push_force_guard
    on_failure: retry
    predicate: force_below
    threshold: 30.0
    when: during_phase
  id: push_along_channel
  parameters:
    force_guard_threshold:
      binds_to:
      - mode: replace
        path: guards.push_force_guard.threshold
      default: 30.0
      range:
      - 20.0
      - 40.0
      type: scalar
    lateral_shift:
      binds_to:
      - mode: replace
        path: target.offset.x
      default: 0.0
      range:
      - -0.01
      - 0.01
      type: scalar
    push_distance_beyond:
      binds_to:
      - mode: replace
        path: target.offset_along_axis.distance
      default: 0.02
      range:
      - 0.01
      - 0.05
      type: scalar
    push_z_offset:
      binds_to:
      - mode: replace
        path: target.offset.z
      default: 0.02
      range:
      - 0.01
      - 0.04
      type: scalar
    retry_x_offset:
      binds_to:
      - mode: replace
        path: retry.offset.x
      default: 0.005
      range:
      - -0.01
      - 0.01
      type: scalar
  retries:
    max_attempts: 2
    offset:
    - 0.005
    - 0.0
    - 0.0
    strategy: offset_target
  subtask_id: push_to_goal
  target:
    anchor: task_goal
    offset:
    - 0.0
    - 0.0
    - 0.02
    offset_along_axis:
      axis: channel_axis
      distance: 0.02
      mode: add_to_offset
      sign: positive
    orientation:
      align_with: channel_axis
      axis:
      - 0.0
      - 0.0
      - 1.0
      mode: align_axis
      tolerance: 0.05
    source: yaml
    tolerance: 0.02
  termination: pose_tolerance
  type: push
skill: peg_channel
subtasks:
- anchor: object
  id: approach_peg
  metric: distance
  offset:
  - 0.0
  - 0.05
  - 0.15
  target_entity: tcp
  weight: 0.3
- anchor: goal
  id: push_to_goal
  metric: goal_progress
  target_entity: object
  weight: 0.7
