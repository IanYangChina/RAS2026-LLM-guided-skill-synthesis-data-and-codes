dsl_version: 2
phases:
- control: position_control
  generator: arc_cartesian
  guards: []
  id: approach_object
  parameters:
    approach_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.05
      range:
      - 0.01
      - 0.15
      type: scalar
  retries:
    max_attempts: 1
    strategy: repeat
  subtask_id: reach_object
  target:
    anchor: task_object
    offset:
    - 0.0
    - 0.0
    - 0.1
    orientation:
      mode: none
    source: yaml
    tolerance: 0.02
  termination: pose_tolerance
  type: approach
- control: impedance_control
  generator: linear_cartesian
  guards:
  - args: {}
    id: check_contact
    on_failure: abort
    predicate: contact_detected
    threshold: 0.0
    when: before_phase
  id: descend_grasp
  parameters:
    descent_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.03
      range:
      - 0.01
      - 0.1
      type: scalar
  retries:
    max_attempts: 1
    strategy: repeat
  subtask_id: reach_object
  target:
    anchor: task_object
    offset:
    - 0.0
    - 0.0
    - 0.03
    orientation:
      mode: none
    source: yaml
    tolerance: 0.02
  termination: pose_tolerance
  type: descend
- control: position_control
  end_effector_action: force_grasp
  generator: null
  guards:
  - args: {}
    id: check_bilateral_grasp
    on_failure: retry
    predicate: bilateral_grasp
    threshold: 0.0
    when: after_phase
  id: grasp_object
  parameters: {}
  retries:
    max_attempts: 2
    strategy: repeat
  target:
    anchor: current_tcp
    offset:
    - 0.0
    - 0.0
    - 0.0
    source: yaml
  termination: time_limit
  type: grasp
- control: position_control
  generator: linear_cartesian
  guards: []
  id: lift_object
  parameters:
    lift_distance:
      binds_to:
      - mode: replace
        path: target.offset_along_axis.distance
      default: 0.12
      range:
      - 0.05
      - 0.25
      type: scalar
  retries:
    max_attempts: 1
    strategy: repeat
  subtask_id: place_goal
  target:
    anchor: current_tcp
    offset:
    - 0.0
    - 0.0
    - 0.0
    offset_along_axis:
      axis: world_z
      distance: 0.12
      mode: add_to_offset
      sign: positive
    orientation:
      mode: keep_current
    source: yaml
  termination: pose_tolerance
  type: lift
- control: position_control
  generator: linear_cartesian
  guards: []
  id: transport_to_goal
  parameters:
    transport_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.08
      range:
      - 0.01
      - 0.15
      type: scalar
  retries:
    max_attempts: 1
    strategy: repeat
  subtask_id: place_goal
  target:
    anchor: task_goal
    offset:
    - 0.0
    - 0.0
    - 0.15
    orientation:
      mode: keep_current
    source: yaml
    tolerance: 0.02
  termination: pose_tolerance
  type: push
- control: position_control
  generator: linear_cartesian
  guards: []
  id: descend_place
  parameters:
    place_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.04
      range:
      - 0.01
      - 0.1
      type: scalar
  retries:
    max_attempts: 1
    strategy: repeat
  subtask_id: place_goal
  target:
    anchor: task_goal
    offset:
    - 0.0
    - 0.0
    - 0.0
    orientation:
      mode: keep_current
    source: yaml
    tolerance: 0.02
  termination: pose_tolerance
  type: descend
- control: position_control
  end_effector_action: open
  generator: null
  guards: []
  id: release_object
  parameters: {}
  retries:
    max_attempts: 1
    strategy: repeat
  subtask_id: place_goal
  target:
    anchor: current_tcp
    offset:
    - 0.0
    - 0.0
    - 0.0
    source: yaml
  termination: time_limit
  type: release
- control: position_control
  generator: linear_cartesian
  guards: []
  id: retract_after_place
  parameters:
    retract_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.06
      range:
      - 0.01
      - 0.15
      type: scalar
  retries:
    max_attempts: 1
    strategy: repeat
  target:
    anchor: current_tcp
    offset:
    - 0.0
    - 0.0
    - 0.0
    offset_along_axis:
      axis: world_z
      distance: 0.15
      mode: add_to_offset
      sign: positive
    orientation:
      mode: keep_current
    source: yaml
  termination: pose_tolerance
  type: retract
skill: grasp_place
skill_type: arm_gripper
subtasks:
- anchor: object
  id: reach_object
  metric: distance
  offset:
  - 0.0
  - 0.0
  - 0.1
  target_entity: tcp
  weight: 0.3
- anchor: goal
  id: place_goal
  metric: distance
  offset:
  - 0.0
  - 0.0
  - 0.0
  target_entity: object
  weight: 0.7
