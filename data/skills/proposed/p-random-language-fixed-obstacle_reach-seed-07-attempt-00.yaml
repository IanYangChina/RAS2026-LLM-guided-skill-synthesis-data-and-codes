dsl_version: 2
phases:
- control: position_control
  generator: linear_cartesian
  id: lift_above
  orientation:
    mode: keep_current
  parameters:
    lift_height:
      binds_to:
      - mode: replace
        path: target.offset_along_axis.distance
      default: 0.1
      range:
      - 0.05
      - 0.2
      type: scalar
  target:
    anchor: current_tcp
    offset:
    - 0
    - 0
    - 0
    offset_along_axis:
      axis: world_z
      distance: 0.1
      mode: add_to_offset
      sign: positive
    source: yaml
    tolerance: 0.01
  termination: pose_tolerance
  type: approach
- control: position_control
  generator: linear_cartesian
  guards:
  - args: {}
    id: guard_obstacle
    on_failure: retry
    predicate: contact_detected
    threshold: 1
    when: during_phase
  id: move_forward
  orientation:
    mode: keep_current
  parameters:
    forward_height_offset:
      binds_to:
      - mode: replace
        path: target.offset.z
      default: 0.2
      range:
      - 0.1
      - 0.3
      type: scalar
  retries:
    max_attempts: 2
    offset:
    - 0
    - 0.02
    - 0
    strategy: offset_target
  target:
    anchor: task_goal
    offset:
    - 0
    - 0
    - 0.2
    source: yaml
    tolerance: 0.01
  termination: pose_tolerance
  type: approach
- control: position_control
  generator: linear_cartesian
  id: descend_to_goal
  orientation:
    mode: keep_current
  parameters:
    descend_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.05
      range:
      - 0.01
      - 0.1
      type: scalar
  target:
    anchor: task_goal
    offset:
    - 0
    - 0
    - 0
    source: yaml
    tolerance: 0.01
  termination: pose_tolerance
  type: descend
skill: obstacle_reach
skill_type: arm_gripper
subtasks:
- anchor: goal
  id: goal_reach
  metric: distance
  offset:
  - 0
  - 0
  - 0
  target_entity: tcp
  weight: 1.0
