dsl_version: 2
phases:
- control: position_control
  generator: linear_cartesian
  guards:
  - args: {}
    id: approach_orient_check
    on_failure: continue
    predicate: orientation_within_tolerance
    threshold: 0.15
    when: during_phase
  id: approach_1
  parameters:
    approach_height:
      binds_to:
      - mode: replace
        path: target.offset.z
      default: 0.065
      range:
      - 0.03
      - 0.1
      type: scalar
    approach_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.08
      range:
      - 0.02
      - 0.15
      type: scalar
    approach_tolerance:
      binds_to:
      - mode: replace
        path: termination.pose_tolerance
      default: 0.01
      range:
      - 0.005
      - 0.025
      type: scalar
  retries:
    max_attempts: 1
    offset:
    - 0
    - 0
    - 0.005
    strategy: offset_target
  subtask_id: approach_socket
  target:
    anchor: task_goal
    offset:
    - 0
    - 0
    - 0.065
    orientation:
      align_with: channel_axis
      axis:
      - 0
      - 0
      - 1
      mode: align_axis
      tolerance: 0.05
    source: yaml
    tolerance: 0.01
  termination: pose_tolerance
  type: approach
- control: impedance_control
  generator: linear_cartesian
  guards:
  - args: {}
    id: descend_force_limit
    on_failure: continue
    predicate: force_below
    threshold: 35.0
    when: during_phase
  id: descend_1
  parameters:
    descend_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.04
      range:
      - 0.01
      - 0.08
      type: scalar
    descend_tolerance:
      binds_to:
      - mode: replace
        path: termination.pose_tolerance
      default: 0.01
      range:
      - 0.005
      - 0.025
      type: scalar
    insertion_depth:
      binds_to:
      - mode: replace
        path: target.offset_along_axis.distance
      default: 0.06
      range:
      - 0.04
      - 0.08
      type: scalar
  retries:
    max_attempts: 1
    strategy: reduce_speed
  subtask_id: insert_peg
  target:
    anchor: task_goal
    offset:
    - 0
    - 0
    - 0.08
    offset_along_axis:
      axis: channel_axis
      distance: 0.06
      mode: add_to_offset
      sign: positive
    orientation:
      mode: keep_current
    source: yaml
    tolerance: 0.01
  termination: pose_tolerance
  type: descend
skill: peg_insert
skill_type: arm
subtasks:
- anchor: fixture
  id: approach_socket
  metric: distance
  offset:
  - 0
  - 0
  - 0.055
  target_entity: tcp
  weight: 0.3
- anchor: fixture
  id: insert_peg
  metric: distance
  offset:
  - 0
  - 0
  - 0
  target_entity: object
  weight: 0.7
