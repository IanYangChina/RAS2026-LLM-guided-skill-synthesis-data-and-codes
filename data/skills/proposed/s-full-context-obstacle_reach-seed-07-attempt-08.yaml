dsl_version: 2
phases:
- control: position_control
  generator: linear_cartesian
  id: lift_z
  parameters:
    lift_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.08
      range:
      - 0.02
      - 0.15
      type: scalar
    lift_z_offset:
      binds_to:
      - mode: replace
        path: target.offset.z
      default: 0.1
      range:
      - 0.05
      - 0.15
      type: scalar
  subtask_id: lift_clear
  target:
    anchor: current_tcp
    offset:
    - 0.0
    - 0.0
    - 0.1
    source: yaml
    tolerance: 0.01
  termination: pose_tolerance
  type: lift
- control: position_control
  generator: linear_cartesian
  id: approach_above
  parameters:
    approach_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.08
      range:
      - 0.03
      - 0.15
      type: scalar
    clearance_z:
      binds_to:
      - mode: replace
        path: target.offset.z
      default: 0.18
      range:
      - 0.1
      - 0.25
      type: scalar
  subtask_id: approach_side
  target:
    anchor: task_goal
    offset:
    - 0.0
    - 0.0
    - 0.18
    source: yaml
    tolerance: 0.03
  termination: pose_tolerance
  type: approach
- control: position_control
  generator: linear_cartesian
  id: descend_to_goal
  parameters:
    descend_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.05
      range:
      - 0.02
      - 0.1
      type: scalar
  subtask_id: final_goal
  target:
    anchor: task_goal
    offset:
    - 0.0
    - 0.0
    - 0.0
    source: yaml
    tolerance: 0.02
  termination: pose_tolerance
  type: approach
skill: obstacle_reach
subtasks:
- anchor: world
  id: lift_clear
  offset:
  - 0.35
  - 0.0
  - 0.4
  target_entity: tcp
  weight: 0.15
- anchor: goal
  id: approach_side
  offset:
  - 0.0
  - 0.0
  - 0.18
  target_entity: tcp
  weight: 0.3
- anchor: goal
  id: final_goal
  offset:
  - 0.0
  - 0.0
  - 0.0
  target_entity: tcp
  weight: 0.55
