dsl_version: 2
phases:
- control: position_control
  generator: arc_cartesian
  id: approach_to_box
  orientation:
    mode: none
  parameters:
    approach_x:
      binds_to:
      - mode: replace
        path: target.offset.x
      default: 0.04
      range:
      - -0.1
      - 0.1
      type: scalar
    approach_y:
      binds_to:
      - mode: replace
        path: target.offset.y
      default: 0.04
      range:
      - -0.1
      - 0.1
      type: scalar
    arc_height:
      binds_to:
      - mode: replace
        path: generator.arc_height
      default: 0.08
      range:
      - 0.02
      - 0.15
      type: scalar
  retries:
    max_attempts: 1
    strategy: repeat
  subtask_id: approach
  target:
    anchor: task_object
    offset:
    - approach_x
    - approach_y
    - 0.025
    source: yaml
    tolerance: 0.01
  termination: pose_tolerance
  type: approach
- control: position_control
  generator: linear_cartesian
  guards:
  - args: {}
    id: contact_check
    on_failure: continue
    predicate: contact_detected
    when: during_phase
  id: push_to_goal
  orientation:
    mode: none
  parameters:
    push_depth:
      binds_to:
      - mode: replace
        path: target.offset_along_axis.distance
      default: 0.2
      range:
      - 0.1
      - 0.3
      type: scalar
  subtask_id: push_goal
  target:
    anchor: task_object
    offset:
    - approach_x
    - approach_y
    - 0.025
    offset_along_axis:
      axis: task_goal_direction
      distance: push_depth
      mode: add_to_offset
      sign: positive
    source: yaml
    tolerance: 0.02
  termination: pose_tolerance
  type: push
skill: push_to_goal
skill_type: arm_gripper
subtasks:
- anchor: object
  id: approach
  metric: distance
  offset:
  - 0.0
  - 0.0
  - 0.05
  target_entity: tcp
  weight: 0.3
- anchor: goal
  id: push_goal
  metric: goal_progress
  offset:
  - 0.0
  - 0.0
  - 0.0
  target_entity: object
  weight: 0.7
