dsl_version: 2
phases:
- control: position_control
  generator: linear_cartesian
  id: approach_above_socket
  parameters:
    speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.1
      range:
      - 0.02
      - 0.2
      type: scalar
    tolerance:
      binds_to:
      - mode: replace
        path: termination.pose_tolerance
      default: 0.025
      range:
      - 0.015
      - 0.035
      type: scalar
  subtask_id: approach_socket
  target:
    anchor: fixture
    entity: peg_socket
    offset:
    - 0.0
    - 0.0
    - 0.06
    orientation:
      mode: keep_current
    source: yaml
    tolerance: 0.025
  termination: pose_tolerance
  type: approach
- control: impedance_control
  generator: linear_cartesian
  guards:
  - id: guard_excessive_force
    on_failure: continue
    predicate: force_below
    threshold: 50.0
    when: during_phase
  id: insert_downward
  parameters:
    force_threshold:
      binds_to:
      - mode: replace
        path: termination.force_threshold
      default: 30.0
      range:
      - 20.0
      - 40.0
      type: scalar
    insert_depth:
      binds_to:
      - mode: replace
        path: target.offset_along_axis.distance
      default: 0.05
      range:
      - 0.03
      - 0.07
      type: scalar
    speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.02
      range:
      - 0.005
      - 0.05
      type: scalar
  retries:
    max_attempts: 1
    strategy: reduce_speed
  subtask_id: insert_peg
  target:
    anchor: fixture
    entity: peg_socket
    offset:
    - 0.0
    - 0.0
    - 0.06
    offset_along_axis:
      axis: channel_axis
      distance: 0.05
      mode: add_to_offset
      sign: positive
    orientation:
      align_with: channel_axis
      axis:
      - 0.0
      - 0.0
      - 1.0
      mode: align_axis
      tolerance: 0.05
    source: yaml
  termination: force_exceeded
  type: insert
- control: position_control
  generator: linear_cartesian
  guards:
  - id: guard_contact_retract
    on_failure: retry
    predicate: contact_detected
    threshold: 1.0
    when: during_phase
  - id: guard_force_retract
    on_failure: continue
    predicate: force_below
    threshold: 40.0
    when: during_phase
  id: retract_after_insert
  parameters:
    speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.1
      range:
      - 0.02
      - 0.2
      type: scalar
    tolerance:
      binds_to:
      - mode: replace
        path: termination.pose_tolerance
      default: 0.03
      range:
      - 0.015
      - 0.04
      type: scalar
  retries:
    max_attempts: 2
    offset:
    - 0.005
    - 0.005
    - 0.0
    strategy: offset_target
  target:
    anchor: fixture
    entity: peg_socket
    offset:
    - 0.0
    - 0.0
    - 0.18
    orientation:
      align_with: world_z
      axis:
      - 0.0
      - 0.0
      - 1.0
      mode: align_axis
      tolerance: 0.05
    source: yaml
    tolerance: 0.03
  termination: pose_tolerance
  type: retract
skill: peg_insert
subtasks:
- anchor: fixture
  id: approach_socket
  offset:
  - 0.0
  - 0.0
  - 0.06
  weight: 0.3
- anchor: fixture
  id: insert_peg
  metric: goal_progress
  target_entity: object
  weight: 0.7
