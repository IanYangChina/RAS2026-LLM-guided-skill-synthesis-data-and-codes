dsl_version: 2
phases:
- control: position_control
  generator: arc_cartesian
  id: approach_offset
  parameters:
    arc_height:
      binds_to:
      - mode: replace
        path: generator.arc_height
      default: 0.25
      range:
      - 0.15
      - 0.35
      type: scalar
    offset_x:
      binds_to:
      - mode: replace
        path: target.offset.x
      default: 0.15
      range:
      - 0.05
      - 0.3
      type: scalar
    speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.4
      range:
      - 0.2
      - 0.6
      type: scalar
  subtask_id: reach_above
  target:
    anchor: task_goal
    offset:
    - 0.15
    - 0.0
    - 0.4
    source: yaml
    tolerance: 0.02
  termination: pose_tolerance
  type: approach
- control: position_control
  generator: linear_cartesian
  id: align_offset
  parameters:
    align_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.3
      range:
      - 0.1
      - 0.5
      type: scalar
    offset_x:
      binds_to:
      - mode: replace
        path: target.offset.x
      default: 0.15
      range:
      - 0.05
      - 0.3
      type: scalar
  subtask_id: align_above
  target:
    anchor: task_goal
    offset:
    - 0.15
    - 0.0
    - 0.2
    source: yaml
    tolerance: 0.02
  termination: pose_tolerance
  type: align
- control: position_control
  generator: linear_cartesian
  id: descend_offset
  parameters:
    descend_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.3
      range:
      - 0.1
      - 0.5
      type: scalar
    offset_x:
      binds_to:
      - mode: replace
        path: target.offset.x
      default: 0.15
      range:
      - 0.05
      - 0.3
      type: scalar
  subtask_id: reach_goal
  target:
    anchor: task_goal
    offset:
    - 0.15
    - 0.0
    - 0.0
    orientation:
      mode: keep_current
    source: yaml
    tolerance: 0.02
  termination: pose_tolerance
  type: descend
- control: position_control
  generator: linear_cartesian
  id: push_to_goal
  parameters:
    push_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.2
      range:
      - 0.05
      - 0.4
      type: scalar
  subtask_id: reach_goal
  target:
    anchor: task_goal
    offset:
    - 0.0
    - 0.0
    - 0.0
    orientation:
      mode: keep_current
    source: yaml
    tolerance: 0.02
  termination: pose_tolerance
  type: push
skill: obstacle_reach
subtasks:
- anchor: goal
  id: reach_above
  metric: distance
  offset:
  - 0.15
  - 0.0
  - 0.4
  target_entity: tcp
  weight: 0.2
- anchor: goal
  id: align_above
  metric: distance
  offset:
  - 0.15
  - 0.0
  - 0.2
  target_entity: tcp
  weight: 0.2
- anchor: goal
  id: reach_goal
  metric: distance
  offset:
  - 0.0
  - 0.0
  - 0.0
  target_entity: tcp
  weight: 0.6
