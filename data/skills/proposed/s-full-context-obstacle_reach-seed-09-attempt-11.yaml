dsl_version: 2
phases:
- control: position_control
  generator: arc_cartesian
  id: approach_above_goal
  parameters:
    approach_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.3
      range:
      - 0.1
      - 0.5
      type: scalar
    approach_tolerance:
      binds_to:
      - mode: replace
        path: termination.pose_tolerance
      default: 0.03
      range:
      - 0.01
      - 0.05
      type: scalar
    arc_height:
      binds_to:
      - mode: replace
        path: generator.arc_height
      default: 0.2
      range:
      - 0.1
      - 0.3
      type: scalar
    hover_z:
      binds_to:
      - mode: replace
        path: target.offset.z
      default: 0.3
      range:
      - 0.2
      - 0.4
      type: scalar
    lateral_y:
      binds_to:
      - mode: replace
        path: target.offset.y
      default: 0.15
      range:
      - 0.1
      - 0.35
      type: scalar
  retries:
    max_attempts: 0
    strategy: repeat
  subtask_id: reaching_above_goal
  target:
    anchor: task_goal
    offset:
    - 0.0
    - 0.15
    - 0.3
    orientation:
      mode: none
    source: yaml
    tolerance: 0.03
  termination: pose_tolerance
  type: approach
- control: position_control
  generator: linear_cartesian
  id: align_above_goal
  parameters:
    align_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.15
      range:
      - 0.05
      - 0.3
      type: scalar
    align_tolerance:
      binds_to:
      - mode: replace
        path: termination.pose_tolerance
      default: 0.01
      range:
      - 0.005
      - 0.02
      type: scalar
  retries:
    max_attempts: 0
    strategy: repeat
  subtask_id: reaching_above_goal
  target:
    anchor: task_goal
    offset:
    - 0.0
    - 0.0
    - 0.3
    orientation:
      mode: none
    source: yaml
    tolerance: 0.01
  termination: pose_tolerance
  type: align
- control: position_control
  generator: linear_cartesian
  id: descend_to_goal
  parameters:
    descend_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.15
      range:
      - 0.05
      - 0.3
      type: scalar
    descend_tolerance:
      binds_to:
      - mode: replace
        path: termination.pose_tolerance
      default: 0.01
      range:
      - 0.003
      - 0.02
      type: scalar
  retries:
    max_attempts: 2
    offset:
    - 0.0
    - 0.03
    - -0.01
    strategy: offset_target
  subtask_id: reaching_goal
  target:
    anchor: task_goal
    offset:
    - 0.0
    - 0.0
    - 0.0
    orientation:
      mode: none
    source: yaml
    tolerance: 0.01
  termination: pose_tolerance
  type: descend
skill: obstacle_reach
subtasks:
- anchor: goal
  id: reaching_above_goal
  metric: distance
  offset:
  - 0.0
  - 0.15
  - 0.3
  target_entity: tcp
  weight: 0.3
- anchor: goal
  id: reaching_goal
  metric: distance
  offset:
  - 0.0
  - 0.0
  - 0.0
  target_entity: tcp
  weight: 0.7
