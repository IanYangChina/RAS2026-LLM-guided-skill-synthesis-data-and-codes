dsl_version: 2
phases:
- control: position_control
  generator: linear_cartesian
  id: approach_1
  parameters:
    approach_distance:
      binds_to:
      - mode: replace
        path: target.offset_along_axis.distance
      default: 0.08
      range:
      - 0.03
      - 0.15
      type: scalar
    approach_offset_x:
      binds_to:
      - mode: add
        path: target.offset.x
      default: 0.0
      range:
      - -0.05
      - 0.05
      type: scalar
    approach_offset_y:
      binds_to:
      - mode: add
        path: target.offset.y
      default: 0.0
      range:
      - -0.05
      - 0.05
      type: scalar
    approach_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.05
      range:
      - 0.01
      - 0.1
      type: scalar
  subtask_id: reach_pre_contact
  target:
    anchor: task_object
    entity: push_box
    offset:
    - 0.0
    - 0.0
    - 0.1
    offset_along_axis:
      axis: task_goal_direction
      distance: 0.08
      mode: replace_offset_projection
      sign: negative
    orientation:
      mode: keep_current
    source: yaml
    tolerance: 0.02
  termination: pose_tolerance
  type: approach
- control: position_control
  generator: linear_cartesian
  id: descend_1
  parameters:
    descent_distance:
      binds_to:
      - mode: replace
        path: target.offset_along_axis.distance
      default: 0.06
      range:
      - 0.03
      - 0.12
      type: scalar
    descent_offset_x:
      binds_to:
      - mode: add
        path: target.offset.x
      default: 0.0
      range:
      - -0.04
      - 0.04
      type: scalar
    descent_offset_y:
      binds_to:
      - mode: add
        path: target.offset.y
      default: 0.0
      range:
      - -0.04
      - 0.04
      type: scalar
    descent_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.04
      range:
      - 0.01
      - 0.08
      type: scalar
  subtask_id: reach_pre_contact
  target:
    anchor: task_object
    entity: push_box
    offset:
    - 0.0
    - 0.0
    - 0.025
    offset_along_axis:
      axis: task_goal_direction
      distance: 0.06
      mode: replace_offset_projection
      sign: negative
    orientation:
      mode: keep_current
    source: yaml
    tolerance: 0.015
  termination: pose_tolerance
  type: descend
- control: impedance_control
  generator: impedance_motion
  guards:
  - args: {}
    id: contact_guard
    on_failure: retry
    predicate: contact_detected
    threshold: 1.0
    when: during_phase
  id: push_1
  parameters:
    push_distance:
      binds_to:
      - mode: replace
        path: target.offset_along_axis.distance
      default: 0.16
      range:
      - 0.05
      - 0.25
      type: scalar
    push_offset_x:
      binds_to:
      - mode: add
        path: target.offset.x
      default: 0.0
      range:
      - -0.02
      - 0.02
      type: scalar
    push_offset_y:
      binds_to:
      - mode: add
        path: target.offset.y
      default: 0.0
      range:
      - -0.02
      - 0.02
      type: scalar
    push_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.06
      range:
      - 0.02
      - 0.12
      type: scalar
  retries:
    max_attempts: 2
    offset:
    - 0.0
    - 0.0
    - 0.0
    strategy: offset_target
  subtask_id: push_to_goal
  target:
    anchor: task_goal
    entity: goal_marker
    offset:
    - 0.0
    - 0.0
    - 0.025
    offset_along_axis:
      axis: task_goal_direction
      distance: 0.12
      mode: replace_offset_projection
      sign: negative
    orientation:
      mode: keep_current
    source: yaml
    tolerance: 0.02
  termination: pose_tolerance
  type: push
- control: position_control
  generator: linear_cartesian
  id: retract_1
  parameters:
    retract_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.12
      range:
      - 0.05
      - 0.2
      type: scalar
    retract_z:
      binds_to:
      - mode: replace
        path: target.offset.z
      default: 0.15
      range:
      - 0.05
      - 0.25
      type: scalar
  target:
    anchor: current_tcp
    entity: null
    offset:
    - 0.0
    - 0.0
    - 0.15
    orientation:
      mode: keep_current
    source: yaml
    tolerance: 0.02
  termination: pose_tolerance
  type: retract
skill: push_to_goal
skill_type: arm
subtasks:
- anchor: object
  id: reach_pre_contact
  metric: distance
  offset:
  - 0.0
  - 0.0
  - 0.1
  target_entity: tcp
  weight: 0.3
- anchor: goal
  id: push_to_goal
  metric: goal_progress
  offset:
  - 0.0
  - 0.0
  - 0.0
  target_entity: tcp
  weight: 0.7
