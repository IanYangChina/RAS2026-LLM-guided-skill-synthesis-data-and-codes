dsl_version: 2
phases:
- control: position_control
  generator: arc_cartesian
  id: arc_to_side
  parameters:
    approach_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.12
      range:
      - 0.05
      - 0.25
      type: scalar
    arc_height:
      binds_to:
      - mode: replace
        path: generator.arc_height
      default: 0.35
      range:
      - 0.15
      - 0.5
      type: scalar
    lateral_y_offset:
      binds_to:
      - mode: replace
        path: target.offset.y
      default: -0.25
      range:
      - -0.35
      - -0.15
      type: scalar
  subtask_id: approach_side
  target:
    anchor: task_goal
    offset:
    - 0.0
    - -0.25
    - 0.0
    orientation:
      mode: none
    source: yaml
    tolerance: 0.02
  termination: pose_tolerance
  type: approach
- control: position_control
  generator: linear_cartesian
  id: horizontal_to_goal
  parameters:
    approach_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.07
      range:
      - 0.02
      - 0.15
      type: scalar
  subtask_id: reach_goal
  target:
    anchor: task_goal
    offset:
    - 0.0
    - 0.0
    - 0.0
    orientation:
      mode: none
    source: yaml
    tolerance: 0.01
  termination: pose_tolerance
  type: approach
skill: obstacle_reach
subtasks:
- anchor: goal
  id: approach_side
  metric: distance
  offset:
  - 0.0
  - -0.25
  - 0.0
  target_entity: tcp
  weight: 0.2
- anchor: goal
  id: reach_goal
  metric: distance
  offset:
  - 0.0
  - 0.0
  - 0.0
  target_entity: tcp
  weight: 0.8
