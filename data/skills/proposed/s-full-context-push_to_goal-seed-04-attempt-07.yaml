dsl_version: 2
phases:
- control: position_control
  generator: linear_cartesian
  guards:
  - args: {}
    id: pose_guard_approach
    on_failure: continue
    predicate: pose_within_tolerance
    threshold: 0.05
    when: during_phase
  id: approach_1
  parameters:
    approach_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.1
      range:
      - 0.02
      - 0.2
      type: scalar
    approach_time:
      binds_to:
      - mode: replace
        path: duration.max_time
      default: 1.5
      range:
      - 0.5
      - 3.0
      type: scalar
  retries:
    max_attempts: 1
    strategy: repeat
  subtask_id: reach_pre_contact
  target:
    anchor: task_object
    offset:
    - 0.0
    - 0.0
    - 0.1
    orientation:
      mode: keep_current
    source: yaml
    tolerance: 0.005
  termination: time_limit
  type: approach
- control: position_control
  generator: linear_cartesian
  guards:
  - args: {}
    id: pose_guard_descend
    on_failure: continue
    predicate: pose_within_tolerance
    threshold: 0.02
    when: during_phase
  id: descend_1
  parameters:
    descend_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.05
      range:
      - 0.01
      - 0.1
      type: scalar
    descend_time:
      binds_to:
      - mode: replace
        path: duration.max_time
      default: 1.0
      range:
      - 0.3
      - 2.0
      type: scalar
    lateral_offset_x:
      binds_to:
      - mode: add
        path: target.offset.x
      default: 0.0
      range:
      - -0.03
      - 0.03
      type: scalar
    lateral_offset_y:
      binds_to:
      - mode: add
        path: target.offset.y
      default: 0.0
      range:
      - -0.03
      - 0.03
      type: scalar
  retries:
    max_attempts: 1
    strategy: repeat
  subtask_id: reach_pre_contact
  target:
    anchor: task_object
    offset:
    - 0.0
    - 0.0
    - 0.025
    orientation:
      mode: keep_current
    source: yaml
    tolerance: 0.005
  termination: time_limit
  type: descend
- control: impedance_control
  generator: linear_cartesian
  guards:
  - args: {}
    id: force_guard_push
    on_failure: reduce_speed
    predicate: force_below
    threshold: 25.0
    when: during_phase
  - args: {}
    id: progress_guard_push
    on_failure: retry
    predicate: object_progress
    threshold: 0.01
    when: during_phase
  id: push_1
  parameters:
    push_distance:
      binds_to:
      - mode: replace
        path: target.offset_along_axis.distance
      default: 0.15
      range:
      - 0.05
      - 0.25
      type: scalar
    push_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.08
      range:
      - 0.02
      - 0.15
      type: scalar
    push_time:
      binds_to:
      - mode: replace
        path: duration.max_time
      default: 1.5
      range:
      - 0.5
      - 3.0
      type: scalar
  retries:
    max_attempts: 2
    offset:
    - 0.005
    - 0.005
    - 0.0
    strategy: offset_target
  subtask_id: push_to_goal
  target:
    anchor: task_goal
    offset:
    - 0.0
    - 0.0
    - 0.025
    offset_along_axis:
      axis: task_goal_direction
      distance: 0.15
      mode: replace_offset_projection
      sign: positive
    orientation:
      align_with: task_goal_direction
      axis:
      - 0.0
      - 0.0
      - 1.0
      mode: align_axis
      tolerance: 0.05
    source: yaml
    tolerance: 0.01
  termination: time_limit
  type: push
- control: position_control
  generator: linear_cartesian
  id: retract_1
  parameters:
    retract_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.1
      range:
      - 0.02
      - 0.2
      type: scalar
    retract_time:
      binds_to:
      - mode: replace
        path: duration.max_time
      default: 1.0
      range:
      - 0.3
      - 2.0
      type: scalar
  retries:
    max_attempts: 1
    strategy: repeat
  target:
    anchor: task_object
    offset:
    - 0.0
    - 0.0
    - 0.1
    orientation:
      mode: keep_current
    source: yaml
    tolerance: 0.01
  termination: time_limit
  type: retract
skill: push_to_goal
skill_type: arm_gripper
subtasks:
- anchor: object
  id: reach_pre_contact
  metric: distance
  offset:
  - 0.0
  - 0.0
  - 0.1
  target_entity: tcp
  weight: 0.3
- anchor: goal
  id: push_to_goal
  metric: distance
  offset:
  - 0.0
  - 0.0
  - 0.0
  target_entity: object
  weight: 0.7
