dsl_version: 2
phases:
- control: position_control
  generator: linear_cartesian
  id: approach_1
  parameters:
    approach_speed:
      binds_to:
      - mode: add
        path: generator.speed
      default: 0.05
      range:
      - 0.01
      - 0.1
      type: scalar
  subtask_id: reach_above_socket
  target:
    anchor: task_object
    offset:
    - 0.0
    - 0.0
    - -0.005
    orientation:
      align_with: insertion_axis
      axis:
      - 0.0
      - 0.0
      - 1.0
      mode: align_axis
      tolerance: 0.0873
    source: yaml
  termination: pose_tolerance
  type: approach
- control: impedance_control
  generator: linear_cartesian
  id: insert_1
  parameters:
    insert_speed:
      binds_to:
      - mode: add
        path: generator.speed
      default: 0.02
      range:
      - 0.005
      - 0.05
      type: scalar
    insertion_depth:
      binds_to:
      - mode: replace
        path: target.offset_along_axis.distance
      default: 0.05
      range:
      - 0.03
      - 0.07
      type: scalar
  subtask_id: insert_peg
  target:
    anchor: task_object
    offset:
    - 0.0
    - 0.0
    - -0.005
    offset_along_axis:
      axis: insertion_axis
      distance: 0.05
      mode: add_to_offset
      sign: positive
    orientation:
      mode: keep_current
    source: yaml
  termination: pose_tolerance
  type: insert
skill: peg_insert
subtasks:
- anchor: object
  id: reach_above_socket
  metric: distance
  offset:
  - 0.0
  - 0.0
  - -0.005
  target_entity: tcp
  weight: 0.3
- anchor: object
  id: insert_peg
  metric: goal_progress
  offset:
  - 0.0
  - 0.0
  - -0.105
  target_entity: tcp
  weight: 0.7
