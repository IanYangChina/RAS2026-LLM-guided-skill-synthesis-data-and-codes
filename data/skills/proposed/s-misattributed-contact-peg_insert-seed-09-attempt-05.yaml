dsl_version: 2
phases:
- control: position_control
  generator: linear_cartesian
  guards:
  - id: approach_ok
    on_failure: retry
    predicate: pose_within_tolerance
    threshold: 0.01
    when: after_phase
  id: approach_above_socket
  parameters:
    approach_height:
      binds_to:
      - mode: replace
        path: target.offset.z
      default: 0.065
      range:
      - 0.05
      - 0.12
      type: scalar
    approach_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.05
      range:
      - 0.02
      - 0.1
      type: scalar
    approach_tol:
      binds_to:
      - mode: replace
        path: termination.pose_tolerance
      default: 0.01
      range:
      - 0.005
      - 0.03
      type: scalar
  retries:
    max_attempts: 2
    offset:
    - 0.005
    - 0.005
    - 0.0
    strategy: offset_target
  subtask_id: approach_socket
  target:
    anchor: fixture
    entity: peg_socket
    offset:
    - 0.0
    - 0.0
    - 0.065
    source: yaml
    tolerance: 0.01
  termination: pose_tolerance
  type: approach
- control: impedance_control
  generator: linear_cartesian
  guards:
  - id: excessive_force
    on_failure: abort
    predicate: force_below
    threshold: 40.0
    when: during_phase
  id: insert_into_socket
  parameters:
    insert_depth:
      binds_to:
      - mode: replace
        path: target.offset_along_axis.distance
      default: 0.055
      range:
      - 0.04
      - 0.07
      type: scalar
    insert_force_threshold:
      binds_to:
      - mode: replace
        path: termination.force_threshold
      default: 30
      range:
      - 15.0
      - 40.0
      type: scalar
    insert_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.015
      range:
      - 0.005
      - 0.03
      type: scalar
  retries:
    max_attempts: 2
    offset:
    - 0.003
    - 0.003
    - 0.0
    strategy: offset_target
  subtask_id: insert_peg
  target:
    anchor: fixture
    entity: peg_socket
    offset:
    - 0.0
    - 0.0
    - 0.055
    offset_along_axis:
      axis: channel_axis
      distance: 0.055
      mode: add_to_offset
      sign: positive
    source: yaml
    tolerance: 0.005
  termination: force_exceeded
  type: insert
skill: peg_insert
subtasks:
- anchor: fixture
  id: approach_socket
  offset:
  - 0.0
  - 0.0
  - 0.1
  weight: 0.3
- id: insert_peg
  metric: goal_progress
  weight: 0.7
