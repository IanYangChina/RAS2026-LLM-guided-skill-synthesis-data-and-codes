dsl_version: 2
phases:
- control: impedance_control
  generator: linear_cartesian
  id: approach_to_above
  parameters:
    approach_height:
      binds_to:
      - mode: replace
        path: target.offset.z
      default: 0.15
      range:
      - 0.1
      - 0.2
      type: scalar
    approach_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.25
      range:
      - 0.05
      - 0.5
      type: scalar
    approach_tolerance:
      binds_to:
      - mode: replace
        path: termination.pose_tolerance
      default: 0.01
      range:
      - 0.005
      - 0.02
      type: scalar
  subtask_id: approach_entry
  target:
    anchor: fixture
    entity: peg_socket
    offset:
    - 0.0
    - 0.0
    - 0.15
    orientation:
      align_with: world_z
      axis:
      - 0.0
      - 0.0
      - 1.0
      mode: align_axis
      tolerance: 0.1
    source: yaml
  termination: pose_tolerance
  type: approach
- control: position_control
  generator: linear_cartesian
  guards:
  - args: {}
    id: guard_align_contact
    on_failure: retry
    predicate: contact_detected
    threshold: 1
    when: during_phase
  id: align_above_hole
  parameters:
    align_height:
      binds_to:
      - mode: replace
        path: target.offset.z
      default: 0.055
      range:
      - 0.04
      - 0.08
      type: scalar
    align_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.08
      range:
      - 0.02
      - 0.2
      type: scalar
    align_tolerance:
      binds_to:
      - mode: replace
        path: termination.pose_tolerance
      default: 0.005
      range:
      - 0.002
      - 0.01
      type: scalar
  retries:
    max_attempts: 1
    offset:
    - 0.005
    - 0.005
    - 0.0
    strategy: offset_target
  target:
    anchor: fixture
    entity: peg_socket
    offset:
    - 0.0
    - 0.0
    - 0.055
    orientation:
      mode: keep_current
    source: yaml
  termination: pose_tolerance
  type: align
- control: impedance_control
  generator: linear_cartesian
  guards:
  - args: {}
    id: guard_insert_contact
    on_failure: continue
    predicate: contact_detected
    threshold: 1
    when: during_phase
  id: insert_into_hole
  parameters:
    force_limit:
      binds_to:
      - mode: replace
        path: termination.force_threshold
      default: 20.0
      range:
      - 10.0
      - 30.0
      type: scalar
    insertion_depth:
      binds_to:
      - mode: replace
        path: target.offset_along_axis.distance
      default: 0.06
      range:
      - 0.04
      - 0.08
      type: scalar
    insertion_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.02
      range:
      - 0.01
      - 0.04
      type: scalar
  subtask_id: insertion_final
  target:
    anchor: fixture
    entity: peg_socket
    offset:
    - 0.0
    - 0.0
    - 0.0
    offset_along_axis:
      axis: channel_axis
      distance: 0.06
      mode: replace_offset_projection
      sign: positive
    orientation:
      mode: keep_current
    source: yaml
  termination: force_exceeded
  type: descend
skill: peg_insert
subtasks:
- anchor: fixture
  id: approach_entry
  offset:
  - 0.0
  - 0.0
  - 0.15
  weight: 0.3
- anchor: fixture
  id: insertion_final
  metric: goal_progress
  weight: 0.7
