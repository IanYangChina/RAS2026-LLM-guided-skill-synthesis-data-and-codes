dsl_version: 2
phases:
- control: position_control
  generator: linear_cartesian
  id: approach_above_socket
  parameters:
    approach_height:
      binds_to:
      - mode: replace
        path: target.offset.z
      default: 0.12
      range:
      - 0.1
      - 0.15
      type: scalar
    approach_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.1
      range:
      - 0.05
      - 0.2
      type: scalar
  subtask_id: approach_socket
  target:
    anchor: fixture
    offset:
    - 0.0
    - 0.0
    - 0.12
    orientation:
      align_with: world_z
      axis:
      - 0.0
      - 0.0
      - 1.0
      mode: align_axis
      tolerance: 0.05
    source: yaml
    tolerance: 0.01
  termination: pose_tolerance
  type: approach
- control: impedance_control
  generator: linear_cartesian
  id: insert_downward
  parameters:
    force_threshold:
      binds_to:
      - mode: replace
        path: termination.force_threshold
      default: 25.0
      range:
      - 15.0
      - 40.0
      type: scalar
    insert_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.03
      range:
      - 0.01
      - 0.06
      type: scalar
    lateral_x:
      binds_to:
      - mode: replace
        path: target.offset.x
      default: 0.0
      range:
      - -0.02
      - 0.02
      type: scalar
    lateral_y:
      binds_to:
      - mode: replace
        path: target.offset.y
      default: 0.0
      range:
      - -0.02
      - 0.02
      type: scalar
  retries:
    max_attempts: 2
    offset:
    - 0.003
    - 0.003
    - 0.0
    strategy: offset_target
  subtask_id: insert_into_socket
  target:
    anchor: current_tcp
    offset:
    - 0.0
    - 0.0
    - 0.0
    offset_along_axis:
      axis: channel_axis
      distance: 0.055
      mode: replace_offset_projection
      sign: positive
    orientation:
      mode: keep_current
    source: yaml
    tolerance: 0.01
  termination: force_exceeded
  type: insert
- control: position_control
  generator: linear_cartesian
  id: lift_after_insert
  parameters:
    lift_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.05
      range:
      - 0.02
      - 0.1
      type: scalar
  subtask_id: insert_into_socket
  target:
    anchor: current_tcp
    offset:
    - 0.0
    - 0.0
    - 0.1
    orientation:
      mode: keep_current
    source: yaml
  termination: pose_tolerance
  type: lift
skill: peg_insert
subtasks:
- anchor: fixture
  id: approach_socket
  metric: distance
  offset:
  - 0.0
  - 0.0
  - 0.12
  target_entity: tcp
  weight: 0.3
- anchor: goal
  id: insert_into_socket
  metric: distance
  offset:
  - 0.0
  - 0.0
  - 0.0
  target_entity: tcp
  weight: 0.7
