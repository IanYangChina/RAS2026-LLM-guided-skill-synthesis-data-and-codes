dsl_version: 2
phases:
- control: position_control
  generator: linear_cartesian
  guards:
  - id: approach_pose_check
    on_failure: retry
    predicate: pose_within_tolerance
    threshold: 0.02
    when: after_phase
  id: approach_from_behind
  parameters:
    approach_behind_distance:
      binds_to:
      - mode: replace
        path: target.offset_along_axis.distance
      default: 0.08
      range:
      - 0.03
      - 0.15
      type: scalar
    approach_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.05
      range:
      - 0.02
      - 0.15
      type: scalar
    approach_tolerance:
      binds_to:
      - mode: replace
        path: termination.pose_tolerance
      default: 0.01
      range:
      - 0.005
      - 0.03
      type: scalar
    approach_z_offset:
      binds_to:
      - mode: replace
        path: target.offset.z
      default: 0.01
      range:
      - 0.0
      - 0.025
      type: scalar
  retries:
    max_attempts: 2
    offset:
    - 0.0
    - 0.0
    - -0.005
    strategy: offset_target
  subtask_id: reach_object
  target:
    anchor: task_object
    offset:
    - 0.0
    - 0.0
    - 0.01
    offset_along_axis:
      axis: task_goal_direction
      distance: 0.08
      mode: replace_offset_projection
      sign: negative
    orientation:
      mode: none
    source: yaml
    tolerance: 0.01
  termination: pose_tolerance
  type: approach
- control: impedance_control
  generator: linear_cartesian
  guards:
  - id: force_limit
    on_failure: abort
    predicate: force_below
    threshold: 25.0
    when: during_phase
  id: push_to_goal_phase
  parameters:
    push_distance:
      binds_to:
      - mode: replace
        path: target.offset_along_axis.distance
      default: 0.2
      range:
      - 0.08
      - 0.35
      type: scalar
    push_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.05
      range:
      - 0.02
      - 0.15
      type: scalar
    push_tolerance:
      binds_to:
      - mode: replace
        path: termination.pose_tolerance
      default: 0.02
      range:
      - 0.005
      - 0.03
      type: scalar
  subtask_id: push_to_goal
  target:
    anchor: task_object
    offset:
    - 0.0
    - 0.0
    - 0.0
    offset_along_axis:
      axis: task_goal_direction
      distance: 0.2
      mode: replace_offset_projection
      sign: positive
    orientation:
      mode: none
    source: yaml
    tolerance: 0.02
  termination: pose_tolerance
  type: push
skill: push_to_goal
skill_type: arm_gripper
subtasks:
- anchor: object
  id: reach_object
  weight: 0.2
- id: push_to_goal
  metric: goal_progress
  target_entity: object
  weight: 0.8
