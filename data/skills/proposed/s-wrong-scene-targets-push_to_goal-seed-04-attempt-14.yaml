dsl_version: 2
phases:
- control: position_control
  generator: linear_cartesian
  guards: []
  id: approach_1
  parameters:
    approach_height:
      binds_to:
      - mode: replace
        path: target.offset.z
      default: 0.15
      range:
      - 0.08
      - 0.25
      type: scalar
    approach_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.1
      range:
      - 0.02
      - 0.2
      type: scalar
  retries:
    max_attempts: 0
  subtask_id: reach_contact
  target:
    anchor: task_object
    offset:
    - 0.0
    - 0.0
    - 0.15
    orientation:
      mode: keep_current
    source: yaml
    tolerance: 0.02
  termination: pose_tolerance
  type: approach
- control: force_threshold_switch
  generator: linear_cartesian
  guards: []
  id: descend_1
  parameters:
    descend_force_threshold:
      binds_to:
      - mode: replace
        path: termination.force_threshold
      default: 5.0
      range:
      - 1.0
      - 10.0
      type: scalar
    descend_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.05
      range:
      - 0.01
      - 0.1
      type: scalar
  retries:
    max_attempts: 0
  subtask_id: reach_contact
  target:
    anchor: task_object
    offset:
    - 0.0
    - 0.0
    - 0.025
    orientation:
      mode: keep_current
    source: yaml
  termination: force_exceeded
  type: descend
- control: impedance_control
  generator: linear_cartesian
  guards:
  - args: {}
    id: progress_check
    on_failure: retry
    predicate: object_progress
    threshold: 0.02
    when: during_phase
  id: push_1
  parameters:
    push_distance:
      binds_to:
      - mode: replace
        path: target.offset_along_axis.distance
      default: 0.15
      range:
      - 0.05
      - 0.3
      type: scalar
    push_duration:
      binds_to:
      - mode: replace
        path: duration.max_time
      default: 5.0
      range:
      - 1.0
      - 10.0
      type: scalar
    push_progress_threshold:
      binds_to:
      - mode: replace
        path: guards.progress_check.threshold
      default: 0.02
      range:
      - 0.01
      - 0.05
      type: scalar
    push_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.05
      range:
      - 0.01
      - 0.15
      type: scalar
    retry_offset_x:
      binds_to:
      - mode: replace
        path: retry.offset.x
      default: 0.0
      range:
      - -0.02
      - 0.02
      type: scalar
    retry_offset_y:
      binds_to:
      - mode: replace
        path: retry.offset.y
      default: 0.0
      range:
      - -0.02
      - 0.02
      type: scalar
  retries:
    max_attempts: 2
    offset:
    - 0.0
    - 0.0
    - 0.0
    strategy: offset_target
  subtask_id: push_object
  target:
    anchor: task_object
    offset:
    - 0.0
    - 0.0
    - 0.025
    offset_along_axis:
      axis: task_goal_direction
      distance: 0.15
      mode: add_to_offset
    orientation:
      mode: keep_current
    source: yaml
  termination: time_limit
  type: push
- control: position_control
  generator: linear_cartesian
  guards: []
  id: retract_1
  parameters:
    retract_height:
      binds_to:
      - mode: replace
        path: target.offset.z
      default: 0.15
      range:
      - 0.08
      - 0.25
      type: scalar
    retract_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.1
      range:
      - 0.02
      - 0.2
      type: scalar
  retries:
    max_attempts: 0
  subtask_id: lift_off
  target:
    anchor: current_tcp
    offset:
    - 0.0
    - 0.0
    - 0.15
    orientation:
      mode: keep_current
    source: yaml
    tolerance: 0.02
  termination: pose_tolerance
  type: retract
skill: push_to_goal
skill_type: arm_gripper
subtasks:
- anchor: object
  id: reach_contact
  metric: distance
  offset:
  - 0.0
  - 0.0
  - 0.05
  target_entity: tcp
  weight: 0.2
- anchor: goal
  id: push_object
  metric: goal_progress
  target_entity: object
  weight: 0.6
- anchor: object
  id: lift_off
  metric: distance
  offset:
  - 0.0
  - 0.0
  - 0.15
  target_entity: tcp
  weight: 0.2
