dsl_version: 2
phases:
- control: position_control
  generator: linear_cartesian
  id: approach_1
  parameters:
    speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.05
      range:
      - 0.01
      - 0.1
      type: scalar
  subtask_id: approach_handle
  target:
    anchor: task_goal
    offset:
    - 0.0
    - 0.04
    - 0.0
    orientation:
      mode: keep_current
      tolerance: 0.1
    source: yaml
  termination: pose_tolerance
  type: approach
- control: force_threshold_switch
  generator: linear_cartesian
  id: contact_1
  parameters:
    force_threshold:
      binds_to:
      - mode: replace
        path: termination.force_threshold
      default: 10.0
      range:
      - 5.0
      - 20.0
      type: scalar
    speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.02
      range:
      - 0.01
      - 0.05
      type: scalar
  target:
    anchor: fixture
    offset:
    - -0.4
    - -0.04
    - 0.35
    orientation:
      mode: keep_current
      tolerance: 0.1
    source: yaml
  termination: force_exceeded
  type: contact
- control: admittance_control
  generator: linear_cartesian
  id: push_1
  parameters:
    push_distance:
      binds_to:
      - mode: replace
        path: target.offset_along_axis.distance
      default: 0.15
      range:
      - 0.1
      - 0.2
      type: scalar
    speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.03
      range:
      - 0.01
      - 0.06
      type: scalar
  subtask_id: push_door_open
  target:
    anchor: current_tcp
    offset:
    - 0.0
    - 0.0
    - 0.0
    offset_along_axis:
      axis: world_y
      distance: 0.15
      mode: add_to_offset
      sign: negative
    orientation:
      mode: keep_current
      tolerance: 0.1
    source: yaml
  termination: pose_tolerance
  type: push
skill: door_push
skill_type: arm_gripper
subtasks:
- anchor: fixture
  id: approach_handle
  offset:
  - -0.4
  - -0.02
  - 0.35
  weight: 0.3
- anchor: fixture
  id: push_door_open
  offset:
  - -0.4
  - -0.25
  - 0.35
  weight: 0.7
