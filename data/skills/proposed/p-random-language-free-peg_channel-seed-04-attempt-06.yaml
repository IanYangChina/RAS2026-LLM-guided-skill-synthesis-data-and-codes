dsl_version: 2
phases:
- control: position_control
  generator: linear_cartesian
  id: approach_peg
  parameters:
    approach_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.08
      range:
      - 0.01
      - 0.2
      type: scalar
  subtask_id: reach_object
  target:
    anchor: task_object
    offset:
    - 0
    - 0.03
    - 0.0
    orientation:
      mode: keep_current
    source: yaml
    tolerance: 0.005
  termination: pose_tolerance
  type: approach
- control: impedance_control
  generator: impedance_motion
  guards:
  - args: {}
    id: force_guard
    on_failure: abort
    predicate: force_below
    threshold: 30.0
    when: during_phase
  id: push_through
  parameters:
    insertion_force:
      binds_to:
      - mode: replace
        path: termination.force_threshold
      default: 10.0
      range:
      - 1.0
      - 20.0
      type: scalar
    push_distance:
      binds_to:
      - mode: replace
        path: target.offset_along_axis.distance
      default: 0.16
      range:
      - 0.05
      - 0.2
      type: scalar
    push_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.03
      range:
      - 0.01
      - 0.1
      type: scalar
  retries:
    max_attempts: 1
    strategy: reduce_speed
  subtask_id: push_complete
  target:
    anchor: task_object
    offset:
    - 0
    - 0
    - 0
    offset_along_axis:
      axis: task_goal_direction
      distance: 0.16
      mode: add_to_offset
    orientation:
      align_with: channel_axis
      axis:
      - 0
      - -1
      - 0
      mode: align_axis
      tolerance: 0.05
    source: yaml
    tolerance: 0.01
  termination: force_exceeded
  type: push
skill: peg_channel
skill_type: arm
subtasks:
- anchor: object
  id: reach_object
  metric: distance
  offset:
  - 0
  - 0.03
  - 0.0
  target_entity: tcp
  weight: 0.3
- anchor: goal
  id: push_complete
  metric: goal_progress
  offset:
  - 0
  - 0
  - 0
  target_entity: object
  weight: 0.7
