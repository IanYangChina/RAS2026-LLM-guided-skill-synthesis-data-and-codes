dsl_version: 2
phases:
- control: position_control
  generator: linear_cartesian
  id: approach_above
  parameters:
    speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.12
      range:
      - 0.05
      - 0.2
      type: scalar
  subtask_id: pre_contact
  target:
    anchor: task_goal
    offset:
    - 0.0
    - 0.0
    - 0.17
    orientation:
      mode: keep_current
    source: yaml
    tolerance: 0.02
  termination: pose_tolerance
  type: approach
- control: position_control
  generator: linear_cartesian
  id: descend_near
  parameters:
    speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.08
      range:
      - 0.03
      - 0.15
      type: scalar
  subtask_id: near_goal
  target:
    anchor: task_goal
    offset:
    - 0.0
    - 0.0
    - 0.05
    orientation:
      mode: keep_current
    source: yaml
    tolerance: 0.02
  termination: pose_tolerance
  type: approach
- control: position_control
  generator: joint_interpolation
  id: final_descend
  parameters:
    speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.04
      range:
      - 0.01
      - 0.1
      type: scalar
  subtask_id: contact_goal
  target:
    anchor: task_goal
    offset:
    - 0.0
    - 0.0
    - 0.0
    orientation:
      align_with: world_z
      axis:
      - 0.0
      - 0.0
      - 1.0
      mode: align_axis
    source: yaml
    tolerance: 0.02
  termination: pose_tolerance
  type: approach
skill: obstacle_reach
subtasks:
- id: pre_contact
  offset:
  - 0.0
  - 0.0
  - 0.17
  weight: 0.3
- id: near_goal
  offset:
  - 0.0
  - 0.0
  - 0.05
  weight: 0.3
- id: contact_goal
  weight: 0.4
