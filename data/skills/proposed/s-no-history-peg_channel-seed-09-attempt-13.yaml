dsl_version: 2
phases:
- control: position_control
  generator: linear_cartesian
  id: approach_above
  parameters:
    approach_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.1
      range:
      - 0.01
      - 0.3
      type: scalar
  subtask_id: contact_peg_side
  target:
    anchor: task_object
    entity: peg
    offset:
    - 0.03
    - 0.08
    - 0.095
    orientation:
      mode: keep_current
    source: yaml
    tolerance: 0.01
  termination: pose_tolerance
  type: approach
- control: force_threshold_switch
  generator: linear_cartesian
  guards:
  - id: contact_guard
    on_failure: retry
    predicate: force_below
    threshold: 10.0
    when: after_phase
  id: descend_to_contact
  parameters:
    contact_force_threshold:
      binds_to:
      - mode: replace
        path: termination.force_threshold
      default: 5.0
      range:
      - 2.0
      - 12.0
      type: scalar
  retries:
    max_attempts: 2
    offset:
    - 0.0
    - -0.01
    - 0.0
    strategy: offset_target
  subtask_id: contact_peg_side
  target:
    anchor: task_object
    entity: peg
    offset:
    - 0.03
    - 0.02
    - -0.005
    orientation:
      mode: keep_current
    source: yaml
    tolerance: 0.005
  termination: force_exceeded
  type: descend
- control: impedance_control
  generator: linear_cartesian
  guards:
  - id: lateral_force_guard
    on_failure: retry
    predicate: force_below
    threshold: 40.0
    when: after_phase
  id: lateral_center
  parameters:
    lateral_distance:
      binds_to:
      - mode: replace
        path: target.offset_along_axis.distance
      default: 0.03
      range:
      - 0.01
      - 0.06
      type: scalar
    lateral_force_threshold:
      binds_to:
      - mode: replace
        path: termination.force_threshold
      default: 20.0
      range:
      - 10.0
      - 50.0
      type: scalar
    lateral_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.04
      range:
      - 0.01
      - 0.1
      type: scalar
  retries:
    max_attempts: 2
    offset:
    - 0.0
    - 0.005
    - 0.0
    strategy: offset_target
  subtask_id: center_peg
  target:
    anchor: task_object
    entity: peg
    offset:
    - 0.03
    - 0.02
    - -0.005
    offset_along_axis:
      axis: world_x
      distance: 0.03
      mode: add_to_offset
      sign: negative
    orientation:
      mode: keep_current
    source: yaml
    tolerance: 0.02
  termination: force_exceeded
  type: push
- control: impedance_control
  generator: linear_cartesian
  guards:
  - id: push_force_guard
    on_failure: retry
    predicate: force_below
    threshold: 40.0
    when: after_phase
  id: channel_push
  parameters:
    push_distance:
      binds_to:
      - mode: replace
        path: target.offset_along_axis.distance
      default: 0.16
      range:
      - 0.08
      - 0.2
      type: scalar
    push_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.05
      range:
      - 0.02
      - 0.15
      type: scalar
  retries:
    max_attempts: 2
    offset:
    - 0.02
    - 0.0
    - 0.0
    strategy: offset_target
  subtask_id: push_channel
  target:
    anchor: task_object
    entity: peg
    offset:
    - 0.0
    - 0.0
    - -0.005
    offset_along_axis:
      axis: channel_axis
      distance: 0.16
      mode: replace_offset_projection
      sign: positive
    orientation:
      mode: keep_current
    source: yaml
    tolerance: 0.02
  termination: time_limit
  type: push
- control: position_control
  generator: arc_cartesian
  id: retract_after_push
  target:
    anchor: current_tcp
    offset:
    - 0.0
    - -0.05
    - 0.1
    orientation:
      mode: keep_current
    source: yaml
  termination: pose_tolerance
  type: retract
skill: peg_channel
subtasks:
- anchor: object
  id: contact_peg_side
  metric: distance
  offset:
  - 0.03
  - 0.02
  - -0.005
  target_entity: tcp
  weight: 0.2
- anchor: fixture
  id: center_peg
  metric: distance
  offset:
  - -0.04
  - 0.063
  - 0.0
  target_entity: object
  weight: 0.3
- anchor: goal
  id: push_channel
  metric: goal_progress
  target_entity: object
  weight: 0.5
