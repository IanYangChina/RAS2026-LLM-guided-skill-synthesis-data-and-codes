dsl_version: 2
phases:
- control: position_control
  generator: arc_cartesian
  id: approach_behind
  parameters:
    approach_height:
      binds_to:
      - mode: replace
        path: target.offset.z
      default: 0.1
      range:
      - 0.06
      - 0.15
      type: scalar
    approach_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.15
      range:
      - 0.05
      - 0.3
      type: scalar
    lateral_offset:
      binds_to:
      - mode: replace
        path: target.offset_along_axis.distance
      default: -0.05
      range:
      - -0.1
      - -0.02
      type: scalar
  subtask_id: approach_tcp
  target:
    anchor: task_object
    offset:
    - 0.0
    - 0.0
    - 0.1
    offset_along_axis:
      axis: task_goal_direction
      distance: -0.05
      mode: add_to_offset
      sign: positive
    source: yaml
  termination: pose_tolerance
  type: approach
- control: position_control
  generator: linear_cartesian
  id: descend_behind
  parameters:
    descend_lateral_offset:
      binds_to:
      - mode: replace
        path: target.offset_along_axis.distance
      default: -0.05
      range:
      - -0.1
      - -0.02
      type: scalar
    descend_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.07
      range:
      - 0.03
      - 0.15
      type: scalar
    descend_z:
      binds_to:
      - mode: replace
        path: target.offset.z
      default: 0.025
      range:
      - 0.02
      - 0.04
      type: scalar
  subtask_id: approach_tcp
  target:
    anchor: task_object
    offset:
    - 0.0
    - 0.0
    - 0.025
    offset_along_axis:
      axis: task_goal_direction
      distance: -0.05
      mode: add_to_offset
      sign: positive
    source: yaml
  termination: pose_tolerance
  type: descend
- control: impedance_control
  generator: linear_cartesian
  guards:
  - args: {}
    id: goal_reached
    on_failure: abort
    predicate: object_progress
    threshold: 0.95
    when: during_phase
  id: push_to_goal
  parameters:
    push_distance:
      binds_to:
      - mode: replace
        path: target.offset_along_axis.distance
      default: 0.25
      range:
      - 0.1
      - 0.4
      type: scalar
    push_pose_tolerance:
      binds_to:
      - mode: replace
        path: termination.pose_tolerance
      default: 0.03
      range:
      - 0.01
      - 0.05
      type: scalar
    push_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.1
      range:
      - 0.05
      - 0.2
      type: scalar
    push_stiffness:
      default: 200.0
      range:
      - 50.0
      - 500.0
      type: scalar
  subtask_id: push_goal
  target:
    anchor: current_tcp
    offset:
    - 0.0
    - 0.0
    - 0.0
    offset_along_axis:
      axis: task_goal_direction
      distance: 0.25
      mode: add_to_offset
      sign: positive
    source: yaml
  termination: pose_tolerance
  type: push
skill: push_to_goal
subtasks:
- anchor: object
  id: approach_tcp
  offset:
  - 0.0
  - 0.0
  - 0.1
  weight: 0.3
- id: push_goal
  target_entity: object
  weight: 0.7
