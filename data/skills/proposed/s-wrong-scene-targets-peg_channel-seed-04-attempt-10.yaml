dsl_version: 2
phases:
- control: position_control
  generator: linear_cartesian
  guard: null
  id: approach_peg
  parameters:
    approach_speed:
      binds_to:
      - mode: add
        path: generator.speed
      default: 0.1
      range:
      - 0.02
      - 0.2
      type: scalar
  retries: null
  subtask_id: reach_peg
  target:
    anchor: task_object
    offset:
    - 0.0
    - 0.05
    - 0.07
    source: yaml
    tolerance: 0.01
  termination: pose_tolerance
  type: approach
- control: impedance_control
  generator: impedance_motion
  guards:
  - args: {}
    id: contact_maintained
    on_failure: retry
    predicate: contact_detected
    threshold: 0.001
    when: during_phase
  id: push_forward
  orientation:
    align_with: channel_axis
    axis:
    - 0.0
    - 1.0
    - 0.0
    mode: align_axis
    tolerance: 0.2
  parameters:
    push_force_threshold:
      binds_to:
      - mode: replace
        path: termination.force_threshold
      default: 20.0
      range:
      - 5.0
      - 35.0
      type: scalar
    push_speed:
      binds_to:
      - mode: add
        path: generator.speed
      default: 0.02
      range:
      - 0.005
      - 0.05
      type: scalar
  retries:
    max_attempts: 1
    strategy: reduce_speed
  subtask_id: push_channel
  target:
    anchor: task_object
    offset:
    - 0.0
    - 0.0
    - 0.0
    offset_along_axis:
      axis: channel_axis
      distance: 0.16
      mode: replace_offset_projection
      sign: positive
    source: yaml
    tolerance: 0.01
  termination: force_exceeded
  type: push
- control: position_control
  generator: linear_cartesian
  id: retract_tcp
  parameters:
    retract_speed:
      binds_to:
      - mode: add
        path: generator.speed
      default: 0.08
      range:
      - 0.02
      - 0.15
      type: scalar
  target:
    anchor: current_tcp
    offset:
    - 0.0
    - 0.0
    - 0.08
    source: yaml
    tolerance: 0.02
  termination: pose_tolerance
  type: retract
skill: peg_channel
skill_type: arm_gripper
subtasks:
- anchor: object
  id: reach_peg
  metric: distance
  offset:
  - 0.0
  - 0.05
  - 0.1
  target_entity: tcp
  weight: 0.3
- anchor: object
  id: push_channel
  metric: distance
  offset:
  - 0.0
  - -0.16
  - 0.0
  target_entity: tcp
  weight: 0.7
