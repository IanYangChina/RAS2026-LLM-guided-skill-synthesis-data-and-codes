dsl_version: 2
phases:
- control: position_control
  generator: linear_cartesian
  id: align_1
  parameters:
    lateral_offset_x:
      binds_to:
      - mode: add
        path: target.offset.x
      default: 0.0
      range:
      - -0.015
      - 0.015
      type: scalar
    lateral_offset_y:
      binds_to:
      - mode: add
        path: target.offset.y
      default: 0.0
      range:
      - -0.015
      - 0.015
      type: scalar
    speed:
      binds_to:
      - mode: scale
        path: generator.speed
      default: 0.1
      range:
      - 0.05
      - 0.2
      type: scalar
  target:
    anchor: fixture
    entity: null
    offset:
    - 0.0
    - 0.0
    - 0.12
    orientation:
      align_with: insertion_axis
      axis:
      - 0
      - 0
      - 1
      mode: align_axis
      tolerance: 0.05
    source: yaml
  termination: pose_tolerance
  type: align
- control: position_control
  generator: linear_cartesian
  id: approach_1
  parameters:
    speed:
      binds_to:
      - mode: scale
        path: generator.speed
      default: 0.08
      range:
      - 0.05
      - 0.2
      type: scalar
  target:
    anchor: fixture
    entity: null
    offset:
    - 0.0
    - 0.0
    - 0.08
    orientation:
      align_with: insertion_axis
      axis:
      - 0
      - 0
      - 1
      mode: align_axis
      tolerance: 0.05
    source: yaml
  termination: pose_tolerance
  type: approach
- control: force_threshold_switch
  generator: impedance_motion
  guards:
  - args: {}
    id: force_guard_contact
    on_failure: abort
    predicate: force_below
    threshold: 40.0
    when: during_phase
  id: contact_1
  parameters:
    contact_force:
      binds_to:
      - mode: replace
        path: termination.force_threshold
      default: 10.0
      range:
      - 2.0
      - 30.0
      type: scalar
    speed:
      binds_to:
      - mode: scale
        path: generator.speed
      default: 0.01
      range:
      - 0.005
      - 0.05
      type: scalar
  retries:
    max_attempts: 2
    offset:
    - 0.003
    - 0.003
    - 0.0
    strategy: offset_target
  target:
    anchor: fixture
    entity: null
    offset:
    - 0.0
    - 0.0
    - 0.055
    orientation:
      align_with: insertion_axis
      axis:
      - 0
      - 0
      - 1
      mode: align_axis
      tolerance: 0.02
    source: yaml
  termination: force_exceeded
  type: contact
- control: admittance_control
  generator: impedance_motion
  guards:
  - args: {}
    id: force_guard_insert
    on_failure: abort
    predicate: force_below
    threshold: 40.0
    when: during_phase
  id: insert_1
  parameters:
    insertion_depth:
      binds_to:
      - mode: replace
        path: target.offset_along_axis.distance
      default: 0.05
      range:
      - 0.02
      - 0.08
      type: scalar
    insertion_force:
      binds_to:
      - mode: replace
        path: termination.force_threshold
      default: 15.0
      range:
      - 5.0
      - 30.0
      type: scalar
    speed:
      binds_to:
      - mode: scale
        path: generator.speed
      default: 0.01
      range:
      - 0.005
      - 0.05
      type: scalar
  retries:
    max_attempts: 1
    offset:
    - 0.002
    - 0.002
    - 0.0
    strategy: offset_target
  target:
    anchor: fixture
    entity: null
    offset:
    - 0.0
    - 0.0
    - 0.055
    offset_along_axis:
      axis: insertion_axis
      distance: 0.05
      mode: replace_offset_projection
      sign: negative
    orientation:
      align_with: insertion_axis
      axis:
      - 0
      - 0
      - 1
      mode: align_axis
      tolerance: 0.02
    source: yaml
  termination: force_exceeded
  type: insert
- control: position_control
  generator: linear_cartesian
  id: retract_1
  parameters:
    retract_height:
      binds_to:
      - mode: replace
        path: target.offset.z
      default: 0.12
      range:
      - 0.08
      - 0.2
      type: scalar
    speed:
      binds_to:
      - mode: scale
        path: generator.speed
      default: 0.1
      range:
      - 0.05
      - 0.15
      type: scalar
  target:
    anchor: fixture
    entity: null
    offset:
    - 0.0
    - 0.0
    - 0.12
    orientation:
      mode: keep_current
    source: yaml
  termination: pose_tolerance
  type: retract
skill: peg_insert
