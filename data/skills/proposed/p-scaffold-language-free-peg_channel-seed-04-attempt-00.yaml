dsl_version: 2
phases:
- control: position_control
  generator: linear_cartesian
  id: align_behind
  parameters:
    align_y_offset:
      binds_to:
      - mode: add
        path: target.offset.y
      default: 0.02
      range:
      - -0.02
      - 0.05
      type: scalar
    approach_height:
      binds_to:
      - mode: add
        path: target.offset.z
      default: 0.08
      range:
      - 0.06
      - 0.15
      type: scalar
    speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.15
      range:
      - 0.05
      - 0.3
      type: scalar
  subtask_id: pre_insert_alignment
  target:
    anchor: task_object
    entity: null
    offset:
    - 0.0
    - 0.02
    - 0.08
    orientation:
      mode: keep_current
      tolerance: 0.1
    source: yaml
  termination: pose_tolerance
  type: approach
- control: position_control
  generator: linear_cartesian
  id: descend_to_peg
  parameters:
    descend_y_offset:
      binds_to:
      - mode: add
        path: target.offset.y
      default: 0.02
      range:
      - -0.02
      - 0.05
      type: scalar
    speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.02
      range:
      - 0.01
      - 0.05
      type: scalar
  subtask_id: pre_insert_alignment
  target:
    anchor: task_object
    entity: null
    offset:
    - 0.0
    - 0.02
    - 0.0
    orientation:
      mode: keep_current
      tolerance: 0.1
    source: yaml
  termination: pose_tolerance
  type: descend
- control: force_threshold_switch
  generator: linear_cartesian
  id: contact_peg
  parameters:
    contact_force_threshold:
      binds_to:
      - mode: replace
        path: termination.force_threshold
      default: 8.0
      range:
      - 3.0
      - 15.0
      type: scalar
    speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.015
      range:
      - 0.005
      - 0.03
      type: scalar
  subtask_id: pre_insert_alignment
  target:
    anchor: task_object
    entity: null
    offset:
    - 0.0
    - 0.02
    - 0.0
    orientation:
      mode: keep_current
      tolerance: 0.1
    source: yaml
  termination: force_exceeded
  type: contact
- control: impedance_control
  generator: linear_cartesian
  id: push_through_channel
  parameters:
    push_distance:
      binds_to:
      - mode: replace
        path: target.offset_along_axis.distance
      default: 0.18
      range:
      - 0.16
      - 0.22
      type: scalar
    push_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.05
      range:
      - 0.01
      - 0.1
      type: scalar
  subtask_id: channel_insertion
  target:
    anchor: task_goal
    entity: null
    offset:
    - 0.0
    - 0.0
    - 0.0
    offset_along_axis:
      axis: channel_axis
      distance: 0.18
      mode: add_to_offset
      sign: positive
    orientation:
      align_with: channel_axis
      axis:
      - 0.0
      - 0.0
      - 1.0
      mode: align_axis
      tolerance: 0.15
    source: yaml
  termination: time_limit
  type: push
- control: position_control
  generator: arc_cartesian
  id: retract_up
  parameters:
    retract_height:
      binds_to:
      - mode: add
        path: target.offset.z
      default: 0.15
      range:
      - 0.08
      - 0.25
      type: scalar
    speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.06
      range:
      - 0.02
      - 0.12
      type: scalar
  target:
    anchor: task_goal
    entity: null
    offset:
    - 0.0
    - 0.0
    - 0.15
    orientation:
      mode: keep_current
      tolerance: 0.1
    source: yaml
  termination: pose_tolerance
  type: retract
skill: peg_channel
subtasks:
- anchor: object
  id: pre_insert_alignment
  metric: distance
  offset:
  - 0.0
  - 0.03
  - 0.08
  target_entity: tcp
  weight: 0.2
- anchor: goal
  id: channel_insertion
  metric: goal_progress
  target_entity: object
  weight: 0.8
