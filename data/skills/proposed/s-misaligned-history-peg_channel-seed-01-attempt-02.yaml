dsl_version: 2
phases:
- control: position_control
  generator: linear_cartesian
  guards: []
  id: approach_peg
  parameters:
    approach_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.15
      range:
      - 0.05
      - 0.3
      type: scalar
  retries:
    max_attempts: 0
  subtask_id: approach_peg
  target:
    anchor: task_object
    entity: peg
    offset:
    - 0
    - 0.02
    - 0.08
    orientation:
      mode: keep_current
    tolerance: 0.02
  termination: pose_tolerance
  type: approach
- control: force_threshold_switch
  generator: linear_cartesian
  guards: []
  id: contact_peg
  parameters:
    contact_force_threshold:
      binds_to:
      - mode: replace
        path: termination.force_threshold
      default: 5.0
      range:
      - 2.0
      - 10.0
      type: scalar
  retries:
    max_attempts: 0
  subtask_id: approach_peg
  target:
    anchor: task_object
    entity: peg
    offset:
    - 0
    - 0
    - 0
    orientation:
      mode: keep_current
  termination: force_exceeded
  type: contact
- control: impedance_control
  generator: linear_cartesian
  guards:
  - args: {}
    id: force_check
    on_failure: retry
    predicate: force_below
    threshold: 40.0
    when: during_phase
  id: push_channel
  parameters:
    push_distance:
      binds_to:
      - mode: replace
        path: target.offset_along_axis.distance
      default: 0.16
      range:
      - 0.14
      - 0.18
      type: scalar
    push_time_limit:
      binds_to:
      - mode: replace
        path: duration.max_time
      default: 3.0
      range:
      - 2.0
      - 5.0
      type: scalar
  retries:
    max_attempts: 2
    offset:
    - 0
    - 0
    - 0
    strategy: reduce_speed
  subtask_id: push_through_channel
  target:
    anchor: task_object
    entity: peg
    offset:
    - 0
    - 0
    - 0
    offset_along_axis:
      axis: channel_axis
      distance: 0.16
      mode: add_to_offset
    orientation:
      mode: keep_current
  termination: time_limit
  type: push
- control: position_control
  generator: linear_cartesian
  guards: []
  id: retract
  parameters: {}
  retries:
    max_attempts: 0
  target:
    anchor: current_tcp
    offset:
    - 0
    - 0
    - 0.05
    orientation:
      mode: keep_current
    tolerance: 0.02
  termination: pose_tolerance
  type: retract
skill: peg_channel
skill_type: arm
subtasks:
- anchor: object
  id: approach_peg
  metric: distance
  offset:
  - 0
  - 0.02
  - 0.08
  target_entity: tcp
  weight: 0.2
- anchor: goal
  id: push_through_channel
  metric: goal_progress
  offset:
  - 0
  - 0
  - 0
  target_entity: object
  weight: 0.8
