dsl_version: 2
phases:
- control: position_control
  generator: linear_cartesian
  guards: []
  id: approach_high
  parameters:
    approach_height:
      binds_to:
      - mode: replace
        path: target.offset.z
      default: 0.9
      range:
      - 0.6
      - 1.0
      type: scalar
    approach_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.5
      range:
      - 0.1
      - 1.0
      type: scalar
    approach_tolerance:
      binds_to:
      - mode: replace
        path: termination.pose_tolerance
      default: 0.05
      range:
      - 0.02
      - 0.1
      type: scalar
  retries:
    max_attempts: 0
  subtask_id: tcp_contact
  target:
    anchor: task_object
    offset:
    - 0.0
    - 0.0
    - 0.9
    orientation:
      mode: keep_current
    source: yaml
    tolerance: 0.05
  termination: pose_tolerance
  type: approach
- control: position_control
  generator: linear_cartesian
  guards: []
  id: descend_to_handle
  parameters:
    descend_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.05
      range:
      - 0.02
      - 0.2
      type: scalar
    descend_tol:
      binds_to:
      - mode: replace
        path: termination.pose_tolerance
      default: 0.02
      range:
      - 0.01
      - 0.05
      type: scalar
    handle_x:
      binds_to:
      - mode: replace
        path: target.offset.x
      default: 0.1
      range:
      - 0.05
      - 0.2
      type: scalar
    handle_y:
      binds_to:
      - mode: replace
        path: target.offset.y
      default: 0.18
      range:
      - 0.1
      - 0.25
      type: scalar
    handle_z:
      binds_to:
      - mode: replace
        path: target.offset.z
      default: 0.35
      range:
      - 0.25
      - 0.45
      type: scalar
  retries:
    max_attempts: 0
  target:
    anchor: task_object
    offset:
      x: 0.1
      y: 0.18
      z: 0.35
    orientation:
      align_with: world_x
      axis:
      - 0.0
      - 0.0
      - 1.0
      mode: align_axis
      tolerance: 0.1
    source: yaml
    tolerance: 0.02
  termination: pose_tolerance
  type: descend
- control: impedance_control
  generator: linear_cartesian
  guards: []
  id: push_door
  parameters:
    dur:
      binds_to:
      - mode: replace
        path: duration.max_time
      default: 5.0
      range:
      - 2.0
      - 15.0
      type: scalar
    handle_x:
      binds_to:
      - mode: replace
        path: target.offset.x
      default: 0.1
      range:
      - 0.05
      - 0.2
      type: scalar
    handle_y:
      binds_to:
      - mode: replace
        path: target.offset.y
      default: 0.18
      range:
      - 0.1
      - 0.25
      type: scalar
    handle_z:
      binds_to:
      - mode: replace
        path: target.offset.z
      default: 0.35
      range:
      - 0.25
      - 0.45
      type: scalar
    push_distance:
      binds_to:
      - mode: replace
        path: target.offset_along_axis.distance
      default: 0.3
      range:
      - 0.1
      - 0.6
      type: scalar
    push_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.1
      range:
      - 0.02
      - 0.2
      type: scalar
  retries:
    max_attempts: 0
  subtask_id: hinge_progress
  target:
    anchor: task_object
    offset:
      x: 0.1
      y: 0.18
      z: 0.35
    offset_along_axis:
      axis: task_goal_direction
      distance: 0.3
      mode: add_to_offset
      sign: positive
    orientation:
      mode: keep_current
    source: yaml
  termination: time_limit
  type: push
skill: door_push
subtasks:
- anchor: object
  id: tcp_contact
  metric: distance
  offset:
  - 0.0
  - 0.0
  - 0.9
  target_entity: tcp
  weight: 0.3
- id: hinge_progress
  metric: hinge_angle
  target_entity: hinge
  weight: 0.7
