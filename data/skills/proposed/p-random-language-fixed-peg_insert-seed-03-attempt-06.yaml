dsl_version: 2
phases:
- control: position_control
  generator: linear_cartesian
  id: approach_1
  parameters:
    approach_1.speed:
      binds_to:
      - mode: add
        path: generator.speed
      default: 0.35
      range:
      - 0.1
      - 0.6
      type: scalar
  subtask_id: approach
  target:
    anchor: task_object
    entity: _
    offset:
    - 0.0
    - 0.0
    - 0.12
    orientation:
      mode: keep_current
    source: yaml
    tolerance: 0.01
  termination: pose_tolerance
  type: approach
- control: impedance_control
  generator: linear_cartesian
  id: align_1
  parameters:
    align_1.lateral_x:
      binds_to:
      - mode: add
        path: target.offset.x
      default: 0.0
      range:
      - -0.05
      - 0.05
      type: scalar
    align_1.lateral_y:
      binds_to:
      - mode: add
        path: target.offset.y
      default: 0.0
      range:
      - -0.05
      - 0.05
      type: scalar
  subtask_id: align
  target:
    anchor: task_goal
    entity: _
    offset:
    - 0.0
    - 0.0
    - 0.0
    orientation:
      align_with: insertion_axis
      axis:
      - 0.0
      - 0.0
      - 1.0
      mode: align_axis
      tolerance: 0.05
    source: yaml
    tolerance: 0.005
  termination: pose_tolerance
  type: align
- control: force_threshold_switch
  generator: linear_cartesian
  guards:
  - args: {}
    id: force_guard
    on_failure: abort
    predicate: force_below
    threshold: 40.0
    when: during_phase
  id: contact_1
  parameters:
    contact_1.contact_force:
      binds_to:
      - mode: add
        path: termination.force_threshold
      default: 15.0
      range:
      - 5.0
      - 30.0
      type: scalar
    contact_1.speed:
      binds_to:
      - mode: add
        path: generator.speed
      default: 0.05
      range:
      - 0.01
      - 0.1
      type: scalar
  subtask_id: contact
  target:
    anchor: task_goal
    entity: _
    offset:
    - 0.0
    - 0.0
    - 0.0
    orientation:
      mode: keep_current
    source: yaml
  termination: force_exceeded
  type: contact
- control: impedance_control
  generator: linear_cartesian
  guards:
  - args: {}
    id: force_guard
    on_failure: abort
    predicate: force_below
    threshold: 40.0
    when: during_phase
  id: insert_1
  parameters:
    insert_1.insertion_depth:
      binds_to:
      - mode: add
        path: target.offset_along_axis.distance
      default: 0.045
      range:
      - 0.02
      - 0.06
      type: scalar
  retries:
    max_attempts: 1
    strategy: reduce_speed
  subtask_id: insert
  target:
    anchor: current_tcp
    entity: _
    offset:
    - 0.0
    - 0.0
    - 0.0
    offset_along_axis:
      axis: insertion_axis
      distance: 0.05
      mode: add_to_offset
      sign: positive
    orientation:
      mode: keep_current
    source: yaml
    tolerance: 0.005
  termination: pose_tolerance
  type: insert
skill: peg_insert
skill_type: arm
subtasks:
- anchor: object
  id: approach
  metric: distance
  offset:
  - 0.0
  - 0.0
  - 0.12
  target_entity: tcp
  weight: 1.0
- anchor: object
  id: align
  metric: distance
  offset:
  - 0.0
  - 0.0
  - 0.0
  target_entity: tcp
  weight: 1.0
- anchor: object
  id: contact
  metric: distance
  offset:
  - 0.0
  - 0.0
  - 0.07
  target_entity: tcp
  weight: 1.0
- anchor: object
  id: insert
  metric: distance
  offset:
  - 0.0
  - 0.0
  - 0.06
  target_entity: tcp
  weight: 1.0
