dsl_version: 2
phases:
- control: position_control
  generator: arc_cartesian
  id: approach_above_hole
  orientation:
    mode: keep_current
  parameters:
    approach_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.3
      range:
      - 0.1
      - 0.5
      type: scalar
    arc_height:
      binds_to:
      - mode: replace
        path: generator.arc_height
      default: 0.1
      range:
      - 0.05
      - 0.2
      type: scalar
  subtask_id: reach_above_hole
  target:
    anchor: task_goal
    offset:
    - 0.0
    - 0.0
    - 0.05
    source: yaml
    tolerance: 0.01
  termination: pose_tolerance
  type: approach
- control: position_control
  generator: linear_cartesian
  id: align_to_hole
  orientation:
    align_with: channel_axis
    axis:
    - 0
    - 0
    - -1
    mode: align_axis
    tolerance: 0.1
  subtask_id: reach_above_hole
  target:
    anchor: task_goal
    offset:
    - 0.0
    - 0.0
    - 0.05
    source: yaml
    tolerance: 0.005
  termination: pose_tolerance
  type: align
- control: impedance_control
  duration:
    max_time: 2.0
  generator: linear_cartesian
  id: descend_into_hole
  orientation:
    mode: keep_current
  parameters:
    descend_distance:
      binds_to:
      - mode: replace
        path: target.offset_along_axis.distance
      default: 0.05
      range:
      - 0.03
      - 0.07
      type: scalar
    descend_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.04
      range:
      - 0.02
      - 0.08
      type: scalar
  subtask_id: insert_peg
  target:
    anchor: task_goal
    offset:
    - 0.0
    - 0.0
    - 0.0
    offset_along_axis:
      axis: channel_axis
      distance: 0.05
      mode: replace_offset_projection
      sign: positive
    source: yaml
  termination: time_limit
  type: descend
- control: position_control
  generator: linear_cartesian
  id: lift_and_retract
  parameters:
    lift_height:
      binds_to:
      - mode: add
        path: target.offset.z
      default: 0.05
      range:
      - 0.02
      - 0.1
      type: scalar
  subtask_id: insert_peg
  target:
    anchor: current_tcp
    offset:
    - 0.0
    - 0.0
    - 0.05
    source: yaml
  termination: pose_tolerance
  type: retract
skill: peg_insert
subtasks:
- anchor: goal
  id: reach_above_hole
  metric: distance
  offset:
  - 0.0
  - 0.0
  - 0.05
  target_entity: tcp
  weight: 0.3
- anchor: goal
  id: insert_peg
  metric: goal_progress
  offset:
  - 0.0
  - 0.0
  - -0.04
  target_entity: object
  weight: 0.7
