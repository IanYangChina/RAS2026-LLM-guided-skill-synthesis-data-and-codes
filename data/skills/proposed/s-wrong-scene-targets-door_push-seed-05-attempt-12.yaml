dsl_version: 2
phases:
- control: position_control
  generator: linear_cartesian
  id: approach_handle
  parameters:
    approach_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.15
      range:
      - 0.05
      - 0.3
      type: scalar
  subtask_id: reach_handle
  target:
    anchor: site
    entity: door_handle
    offset:
    - 0.0
    - 0.0
    - 0.05
    orientation:
      mode: none
    source: yaml
    tolerance: 0.02
  termination: pose_tolerance
  type: approach
- control: force_threshold_switch
  generator: linear_cartesian
  id: descend_to_handle
  parameters:
    descend_force_threshold:
      binds_to:
      - mode: replace
        path: termination.force_threshold
      default: 6.0
      range:
      - 3.0
      - 10.0
      type: scalar
  subtask_id: reach_handle
  target:
    anchor: site
    entity: door_handle
    offset:
    - 0.0
    - 0.0
    - 0.0
    orientation:
      mode: none
    source: yaml
  termination: force_exceeded
  type: contact
- control: impedance_control
  generator: linear_cartesian
  guards:
  - id: contact_during_push
    on_failure: retry
    predicate: contact_detected
    threshold: 0.5
    when: during_phase
  id: push_door
  parameters:
    push_distance:
      binds_to:
      - mode: replace
        path: target.offset_along_axis.distance
      default: 0.25
      range:
      - 0.15
      - 0.35
      type: scalar
    push_force_threshold:
      binds_to:
      - mode: replace
        path: termination.force_threshold
      default: 22.0
      range:
      - 15.0
      - 30.0
      type: scalar
  retries:
    max_attempts: 2
    offset:
    - 0.0
    - 0.02
    - 0.0
    strategy: offset_target
  subtask_id: close_door
  target:
    anchor: current_tcp
    offset:
    - 0.0
    - 0.0
    - 0.0
    offset_along_axis:
      axis: world_y
      distance: 0.25
      mode: add_to_offset
      sign: positive
    orientation:
      align_with: world_y
      axis:
      - 1.0
      - 0.0
      - 0.0
      mode: align_axis
      tolerance: 0.15
    source: yaml
  termination: force_exceeded
  type: push
skill: door_push
skill_type: arm_gripper
subtasks:
- anchor: fixture
  id: reach_handle
  offset:
  - -0.4
  - -0.02
  - 0.35
  weight: 0.3
- anchor: fixture
  id: close_door
  metric: hinge_angle
  weight: 0.7
