dsl_version: 2
phases:
- control: position_control
  generator: linear_cartesian
  guards:
  - args: {}
    id: collision_guard
    on_failure: retry
    predicate: contact_detected
    threshold: 1.0
    when: during_phase
  id: approach_clearance
  parameters:
    approach_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.3
      range:
      - 0.1
      - 0.5
      type: scalar
    clearance_y:
      binds_to:
      - mode: replace
        path: target.offset.y
      default: 0.3
      range:
      - 0.2
      - 0.5
      type: scalar
    clearance_z:
      binds_to:
      - mode: replace
        path: target.offset.z
      default: 0.4
      range:
      - 0.3
      - 0.6
      type: scalar
  retries:
    max_attempts: 1
    offset:
    - 0.0
    - 0.05
    - 0.0
    strategy: offset_target
  subtask_id: reaching_clearance
  target:
    anchor: fixture
    offset:
    - 0.0
    - 0.3
    - 0.4
    orientation:
      mode: none
    source: yaml
    tolerance: 0.03
  termination: pose_tolerance
  type: approach
- control: position_control
  generator: linear_cartesian
  id: descend_to_goal
  parameters:
    descend_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.15
      range:
      - 0.05
      - 0.3
      type: scalar
    descend_tolerance:
      binds_to:
      - mode: replace
        path: termination.pose_tolerance
      default: 0.01
      range:
      - 0.003
      - 0.02
      type: scalar
  retries:
    max_attempts: 1
    offset:
    - 0.0
    - 0.0
    - -0.01
    strategy: offset_target
  subtask_id: reaching_goal
  target:
    anchor: task_goal
    offset:
    - 0.0
    - 0.0
    - 0.0
    orientation:
      mode: none
    source: yaml
    tolerance: 0.01
  termination: pose_tolerance
  type: descend
skill: obstacle_reach
subtasks:
- anchor: fixture
  id: reaching_clearance
  metric: distance
  offset:
  - 0.0
  - 0.3
  - 0.4
  target_entity: tcp
  weight: 0.3
- anchor: goal
  id: reaching_goal
  metric: distance
  offset:
  - 0.0
  - 0.0
  - 0.0
  target_entity: tcp
  weight: 0.7
