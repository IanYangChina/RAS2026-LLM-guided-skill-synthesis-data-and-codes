dsl_version: 2
phases:
- control: position_control
  generator: linear_cartesian
  guards: []
  id: approach_1
  parameters: {}
  retries:
    max_attempts: 0
    strategy: repeat
  subtask_id: approach
  target:
    anchor: task_object
    offset:
    - 0.0
    - 0.04
    - 0.05
    orientation:
      align_with: channel_axis
      axis:
      - 0
      - 0
      - 1
      mode: align_axis
      tolerance: 0.1
    source: yaml
  termination: pose_tolerance
  type: approach
- control: force_threshold_switch
  generator: linear_cartesian
  guards: []
  id: contact_1
  parameters:
    contact_force_threshold:
      binds_to:
      - mode: replace
        path: termination.force_threshold
      default: 5.0
      range:
      - 2.0
      - 8.0
      type: scalar
  retries:
    max_attempts: 0
    strategy: repeat
  subtask_id: contact
  target:
    anchor: task_object
    offset:
    - 0.0
    - 0.02
    - 0.0
    orientation:
      align_with: channel_axis
      axis:
      - 0
      - 0
      - 1
      mode: align_axis
      tolerance: 0.1
    source: yaml
  termination: force_exceeded
  type: contact
- control: impedance_control
  generator: linear_cartesian
  guards:
  - args: {}
    id: push_force
    on_failure: retry
    predicate: force_below
    threshold: 40.0
    when: during_phase
  id: push_1
  parameters:
    push_distance:
      binds_to:
      - mode: replace
        path: target.offset_along_axis.distance
      default: 0.16
      range:
      - 0.02
      - 0.2
      type: scalar
  retries:
    max_attempts: 2
    offset:
    - 0.003
    - 0.0
    - 0.0
    strategy: offset_target
  subtask_id: push
  target:
    anchor: task_object
    offset:
    - 0.0
    - 0.02
    - 0.0
    offset_along_axis:
      axis: channel_axis
      distance: 0.16
      mode: add_to_offset
      sign: positive
    orientation:
      align_with: channel_axis
      axis:
      - 0
      - 0
      - 1
      mode: align_axis
      tolerance: 0.08
    source: yaml
  termination: pose_tolerance
  type: push
- control: impedance_control
  generator: linear_cartesian
  guards: []
  id: final_align
  parameters:
    lateral_offset_x:
      binds_to:
      - mode: add
        path: target.offset.x
      default: 0.0
      range:
      - -0.01
      - 0.01
      type: scalar
  retries:
    max_attempts: 0
    strategy: repeat
  target:
    anchor: task_goal
    offset:
    - 0.0
    - 0.0
    - 0.0
    orientation:
      mode: keep_current
    source: yaml
  termination: pose_tolerance
  type: align
skill: peg_channel
