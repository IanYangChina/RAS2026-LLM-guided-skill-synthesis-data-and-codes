dsl_version: 2
phases:
- control: position_control
  generator: linear_cartesian
  id: approach_1
  orientation:
    align_with: insertion_axis
    axis:
    - 0
    - 0
    - 1
    mode: align_axis
    tolerance: 0.1
  parameters:
    approach_offset_x:
      binds_to:
      - mode: replace
        path: target.offset.x
      default: 0.01
      range:
      - -0.02
      - 0.04
      type: scalar
    approach_offset_z:
      binds_to:
      - mode: replace
        path: target.offset.z
      default: 0.12
      range:
      - 0.08
      - 0.16
      type: scalar
  target:
    anchor: fixture
    entity: peg_socket
    offset:
    - 0.01
    - 0.0
    - 0.12
    source: yaml
  termination: pose_tolerance
  type: approach
- control: position_control
  generator: linear_cartesian
  id: align_1
  orientation:
    align_with: insertion_axis
    axis:
    - 0
    - 0
    - 1
    mode: align_axis
    tolerance: 0.1
  parameters:
    align_offset_x:
      binds_to:
      - mode: replace
        path: target.offset.x
      default: 0.01
      range:
      - -0.01
      - 0.03
      type: scalar
    align_offset_y:
      binds_to:
      - mode: replace
        path: target.offset.y
      default: 0.0
      range:
      - -0.01
      - 0.01
      type: scalar
  target:
    anchor: fixture
    entity: peg_socket
    offset:
    - 0.01
    - 0.0
    - 0.08
    source: yaml
  termination: pose_tolerance
  type: align
- control: impedance_control
  generator: impedance_motion
  guards:
  - id: force_guard
    on_failure: abort
    predicate: force_below
    threshold: 40
    when: during_phase
  id: insert_1
  orientation:
    align_with: insertion_axis
    axis:
    - 0
    - 0
    - 1
    mode: align_axis
    tolerance: 0.1
  parameters:
    force_threshold:
      binds_to:
      - mode: replace
        path: termination.force_threshold
      default: 30
      range:
      - 20
      - 40
      type: scalar
    insert_depth:
      binds_to:
      - mode: replace
        path: target.offset_along_axis.distance
      default: 0.06
      range:
      - 0.04
      - 0.07
      type: scalar
  target:
    anchor: fixture
    entity: peg_socket
    offset:
    - 0.01
    - 0.0
    - 0.08
    offset_along_axis:
      axis: insertion_axis
      distance: 0.06
      mode: add_to_offset
      sign: positive
    source: yaml
  termination: force_exceeded
  type: insert
- control: position_control
  generator: linear_cartesian
  id: retract_1
  orientation:
    mode: keep_current
  parameters:
    retract_height:
      binds_to:
      - mode: replace
        path: target.offset.z
      default: 0.15
      range:
      - 0.12
      - 0.2
      type: scalar
  target:
    anchor: fixture
    entity: peg_socket
    offset:
    - 0.01
    - 0.0
    - 0.15
    source: yaml
  termination: pose_tolerance
  type: retract
skill: peg_insert
skill_type: arm
