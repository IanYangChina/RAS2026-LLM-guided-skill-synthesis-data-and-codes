dsl_version: 2
phases:
- control: position_control
  generator: arc_cartesian
  id: approach_arc
  parameters:
    arc_height:
      binds_to:
      - mode: scale
        path: generator.arc_height
      default: 0.1
      range:
      - 0.05
      - 0.2
      type: scalar
    speed:
      binds_to:
      - mode: add
        path: generator.speed
      default: 0.05
      range:
      - 0.01
      - 0.1
      type: scalar
  target:
    anchor: site
    entity: door_handle
    offset:
    - 0
    - 0
    - 0.2
    orientation:
      align_with: world_y
      axis:
      - 0
      - 0
      - 1
      mode: align_axis
      tolerance: 0.1
    source: yaml
    tolerance: 0.02
  termination: pose_tolerance
  type: approach
- control: position_control
  generator: linear_cartesian
  id: descend
  parameters:
    speed:
      binds_to:
      - mode: add
        path: generator.speed
      default: 0.02
      range:
      - 0.01
      - 0.1
      type: scalar
  target:
    anchor: site
    entity: door_handle
    offset:
    - 0
    - 0
    - 0
    orientation:
      mode: keep_current
    source: yaml
    tolerance: 0.02
  termination: pose_tolerance
  type: descend
- control: force_threshold_switch
  generator: linear_cartesian
  id: contact
  parameters:
    contact_force:
      binds_to:
      - mode: scale
        path: termination.force_threshold
      default: 5.0
      range:
      - 2.0
      - 15.0
      type: scalar
  target:
    anchor: site
    entity: door_handle
    offset:
    - 0
    - 0
    - 0
    orientation:
      mode: keep_current
    source: yaml
    tolerance: 0.05
  termination: force_exceeded
  type: contact
- control: impedance_control
  generator: linear_cartesian
  id: push
  parameters:
    max_time:
      binds_to:
      - mode: replace
        path: termination.duration.max_time
      default: 3.0
      range:
      - 1.0
      - 5.0
      type: scalar
    push_distance:
      binds_to:
      - mode: replace
        path: target.offset_along_axis.distance
      default: 0.15
      range:
      - 0.05
      - 0.3
      type: scalar
    push_speed:
      binds_to:
      - mode: add
        path: generator.speed
      default: 0.03
      range:
      - 0.01
      - 0.05
      type: scalar
  target:
    anchor: task_goal
    offset:
    - 0
    - 0
    - 0
    offset_along_axis:
      axis: world_y
      distance: 0.15
      mode: add_to_offset
      sign: negative
    orientation:
      mode: keep_current
    source: yaml
    tolerance: 0.1
  termination: time_limit
  type: push
- control: position_control
  generator: linear_cartesian
  id: retract
  parameters:
    speed:
      binds_to:
      - mode: add
        path: generator.speed
      default: 0.05
      range:
      - 0.01
      - 0.1
      type: scalar
  target:
    anchor: task_goal
    offset:
    - 0
    - 0.1
    - 0
    orientation:
      mode: keep_current
    source: yaml
    tolerance: 0.05
  termination: pose_tolerance
  type: retract
skill: door_push
subtasks:
- anchor: object
  id: hinge_progress
  metric: goal_progress
  offset:
  - 0
  - 0
  - 0
  target_entity: door_panel
  weight: 1.0
