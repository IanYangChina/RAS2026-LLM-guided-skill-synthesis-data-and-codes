dsl_version: 2
phases:
- control: position_control
  generator: linear_cartesian
  id: approach_peg
  subtask_id: align_at_entrance
  target:
    anchor: task_object
    entity: peg
    offset:
    - 0
    - 0
    - 0.12
    orientation:
      mode: keep_current
    source: yaml
    tolerance: 0.01
  termination: pose_tolerance
  type: approach
- control: position_control
  generator: linear_cartesian
  id: align_to_entrance
  parameters:
    lateral_offset:
      binds_to:
      - mode: replace
        path: target.offset_along_axis.distance
      default: 0.0
      range:
      - -0.04
      - 0.04
      type: scalar
  subtask_id: align_at_entrance
  target:
    anchor: task_object
    entity: peg
    offset:
    - 0
    - 0.03
    - 0.0
    offset_along_axis:
      axis: world_x
      distance: 0.0
      mode: replace_offset_projection
      sign: positive
    orientation:
      mode: none
    source: yaml
    tolerance: 0.01
  termination: pose_tolerance
  type: align
- control: impedance_control
  generator: linear_cartesian
  guards:
  - args: {}
    id: force_limit
    on_failure: retry
    predicate: force_below
    threshold: 40.0
    when: during_phase
  id: push_through_channel
  parameters:
    push_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.03
      range:
      - 0.01
      - 0.1
      type: scalar
  retries:
    max_attempts: 1
    offset:
    - 0
    - 0
    - 0
    strategy: reduce_speed
  subtask_id: push_to_goal
  target:
    anchor: task_goal
    entity: channel_exit
    offset:
    - 0
    - 0
    - 0
    orientation:
      mode: none
    source: yaml
    tolerance: 0.02
  termination: pose_tolerance
  type: push
skill: peg_channel
subtasks:
- anchor: object
  id: align_at_entrance
  metric: distance
  offset:
  - 0
  - 0.03
  - 0.12
  target_entity: tcp
  weight: 0.3
- anchor: goal
  id: push_to_goal
  metric: goal_progress
  offset:
  - 0
  - 0
  - 0
  target_entity: tcp
  weight: 0.7
