dsl_version: 2
phases:
- control: position_control
  generator: linear_cartesian
  guards: []
  id: approach
  parameters:
    approach_height:
      binds_to:
      - mode: add
        path: target.offset.z
      default: 0.1
      range:
      - 0.08
      - 0.15
      type: scalar
  retries:
    max_attempts: 0
    strategy: repeat
  target:
    anchor: task_object
    entity: push_box
    offset:
    - 0.0
    - 0.0
    - 0.1
    orientation:
      mode: keep_current
    source: yaml
    tolerance: 0.01
  termination: pose_tolerance
  type: approach
- control: force_threshold_switch
  generator: linear_cartesian
  guards: []
  id: descend_to_contact
  parameters:
    contact_offset:
      binds_to:
      - mode: replace
        path: target.offset_along_axis.distance
      default: 0.025
      range:
      - 0.02
      - 0.03
      type: scalar
    descend_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.1
      range:
      - 0.05
      - 0.2
      type: scalar
    termination.force_threshold:
      binds_to:
      - mode: replace
        path: termination.force_threshold
      default: 10
      range:
      - 5
      - 15
      type: scalar
  retries:
    max_attempts: 1
    strategy: reduce_speed
  subtask_id: reach_pre_contact
  target:
    anchor: task_object
    entity: push_box
    offset:
    - 0.0
    - 0.0
    - 0.025
    offset_along_axis:
      axis: task_goal_direction
      distance: 0.025
      mode: add_to_offset
      sign: positive
    orientation:
      mode: keep_current
    source: yaml
    tolerance: 0.005
  termination: force_exceeded
  type: descend
- control: impedance_control
  generator: linear_cartesian
  guards:
  - args: {}
    id: force_guard
    on_failure: retry
    predicate: force_below
    threshold: 25.0
    when: during_phase
  id: push_to_goal
  parameters:
    push_distance:
      binds_to:
      - mode: replace
        path: target.offset_along_axis.distance
      default: 0.11
      range:
      - 0.08
      - 0.14
      type: scalar
    push_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.05
      range:
      - 0.02
      - 0.1
      type: scalar
  retries:
    max_attempts: 2
    strategy: reduce_speed
  subtask_id: push_goal
  target:
    anchor: task_object
    entity: push_box
    offset:
    - 0.0
    - 0.0
    - 0.025
    offset_along_axis:
      axis: task_goal_direction
      distance: 0.11
      mode: add_to_offset
      sign: positive
    orientation:
      mode: keep_current
    source: yaml
    tolerance: 0.015
  termination: pose_tolerance
  type: push
skill: push_to_goal
subtasks:
- anchor: object
  id: reach_pre_contact
  metric: distance
  offset:
  - 0.0
  - 0.0
  - 0.1
  target_entity: tcp
  weight: 0.3
- anchor: goal
  id: push_goal
  metric: goal_progress
  target_entity: object
  weight: 0.7
