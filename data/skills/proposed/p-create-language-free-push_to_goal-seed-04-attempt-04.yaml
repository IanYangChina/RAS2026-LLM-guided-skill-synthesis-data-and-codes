dsl_version: 2
guards: null
phases:
- control: position_control
  generator: linear_cartesian
  id: approach_1
  target:
    anchor: task_object
    entity: push_box
    offset:
    - 0.04
    - 0.04
    - 0.1
    orientation:
      mode: keep_current
    source: yaml
  termination: pose_tolerance
  type: approach
- control: position_control
  generator: linear_cartesian
  id: descend_1
  subtask_id: reach_contact
  target:
    anchor: task_object
    entity: push_box
    offset:
    - 0.04
    - 0.04
    - 0.0
    orientation:
      mode: keep_current
    source: yaml
  termination: pose_tolerance
  type: descend
- control: force_threshold_switch
  generator: linear_cartesian
  id: contact_1
  target:
    anchor: task_object
    entity: push_box
    offset:
    - 0.03
    - 0.03
    - 0.0
    orientation:
      mode: keep_current
    source: yaml
  termination: force_exceeded
  type: contact
- control: impedance_control
  generator: linear_cartesian
  id: push_1
  parameters:
    push_distance:
      binds_to:
      - mode: add
        path: target.offset_along_axis.distance
      default: 0.15
      range:
      - 0.05
      - 0.3
      type: scalar
  subtask_id: push_complete
  target:
    anchor: task_goal
    entity: goal_marker
    offset:
    - 0.0
    - 0.0
    - 0.0
    offset_along_axis:
      axis: task_goal_direction
      distance: 0.15
      mode: add_to_offset
    orientation:
      mode: keep_current
    source: yaml
    tolerance: 0.02
  termination: pose_tolerance
  type: push
- control: position_control
  generator: linear_cartesian
  id: retract_1
  target:
    anchor: task_goal
    entity: goal_marker
    offset:
    - 0.0
    - 0.0
    - 0.1
    orientation:
      mode: keep_current
    source: yaml
  termination: pose_tolerance
  type: retract
skill: push_to_goal
subtasks:
- anchor: object
  id: reach_contact
  offset:
  - 0.04
  - 0.04
  - 0.0
  target_entity: tcp
  weight: 0.3
- anchor: goal
  id: push_complete
  offset:
  - 0.0
  - 0.0
  - 0.0
  target_entity: object
  weight: 0.7
