dsl_version: 2
phases:
- control: position_control
  generator: linear_cartesian
  id: lift_above
  parameters:
    lift_height:
      binds_to:
      - mode: replace
        path: target.offset_along_axis.distance
      default: 0.2
      range:
      - 0.15
      - 0.3
      type: scalar
  target:
    anchor: current_tcp
    offset:
    - 0.0
    - 0.0
    - 0.0
    offset_along_axis:
      axis: world_z
      distance: 0.2
      mode: add_to_offset
      sign: positive
    source: yaml
    tolerance: 0.01
  termination: pose_tolerance
  type: approach
- control: position_control
  generator: arc_cartesian
  guards:
  - id: guard_collision
    on_failure: retry
    predicate: contact_detected
    threshold: 1.0
    when: during_phase
  id: move_over_obstacle
  parameters:
    arc_height:
      binds_to:
      - mode: replace
        path: generator.arc_height
      default: 0.1
      range:
      - 0.05
      - 0.2
      type: scalar
    forward_height_offset:
      binds_to:
      - mode: replace
        path: target.offset.z
      default: 0.25
      range:
      - 0.2
      - 0.4
      type: scalar
  retries:
    max_attempts: 1
    offset:
    - 0.0
    - 0.02
    - 0.0
    strategy: offset_target
  target:
    anchor: task_goal
    offset:
    - 0.0
    - 0.0
    - 0.25
    source: yaml
    tolerance: 0.01
  termination: pose_tolerance
  type: approach
- control: impedance_control
  generator: linear_cartesian
  guards:
  - id: guard_force_limit
    on_failure: abort
    predicate: force_below
    threshold: 4.0
    when: during_phase
  id: descend_to_goal
  parameters:
    descend_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.03
      range:
      - 0.01
      - 0.05
      type: scalar
  target:
    anchor: task_goal
    offset:
    - 0.0
    - 0.0
    - 0.0
    source: yaml
    tolerance: 0.015
  termination: pose_tolerance
  type: descend
skill: obstacle_reach
skill_type: arm_gripper
subtasks:
- id: goal_reach
