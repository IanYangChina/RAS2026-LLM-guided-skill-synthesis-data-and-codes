dsl_version: 2
phases:
- control: position_control
  generator: linear_cartesian
  id: approach_socket
  parameters:
    speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.1
      range:
      - 0.02
      - 0.2
      type: scalar
  subtask_id: pre_approach
  target:
    anchor: fixture
    entity: null
    offset:
    - 0.0
    - 0.0
    - 0.12
    orientation:
      mode: keep_current
    source: yaml
    tolerance: 0.01
  termination: pose_tolerance
  type: approach
- control: position_control
  generator: linear_cartesian
  id: align_entry
  parameters:
    align_offset_z:
      binds_to:
      - mode: replace
        path: target.offset.z
      default: 0.055
      range:
      - 0.04
      - 0.07
      type: scalar
  subtask_id: pre_approach
  target:
    anchor: fixture
    entity: null
    offset:
    - 0.0
    - 0.0
    - 0.055
    orientation:
      align_with: world_z
      axis:
      - 0.0
      - 0.0
      - 1.0
      mode: align_axis
      tolerance: 0.05
    source: yaml
    tolerance: 0.005
  termination: pose_tolerance
  type: align
- control: impedance_control
  generator: linear_cartesian
  guards:
  - args: {}
    id: force_guard
    on_failure: abort
    predicate: force_below
    threshold: 40.0
    when: during_phase
  id: insert_down
  parameters:
    insertion_depth:
      binds_to:
      - mode: replace
        path: target.offset_along_axis.distance
      default: 0.055
      range:
      - 0.04
      - 0.07
      type: scalar
    insertion_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.02
      range:
      - 0.005
      - 0.05
      type: scalar
  retries:
    max_attempts: 2
    offset:
    - 0.003
    - 0.003
    - 0.0
    strategy: offset_target
  subtask_id: insertion
  target:
    anchor: fixture
    entity: null
    offset:
    - 0.0
    - 0.0
    - 0.055
    offset_along_axis:
      axis: channel_axis
      distance: 0.055
      mode: add_to_offset
      sign: positive
    orientation:
      align_with: world_z
      axis:
      - 0.0
      - 0.0
      - 1.0
      mode: align_axis
      tolerance: 0.05
    source: yaml
    tolerance: 0.02
  termination: pose_tolerance
  type: push
- control: position_control
  generator: linear_cartesian
  id: retract_safe
  parameters:
    retract_distance:
      binds_to:
      - mode: replace
        path: target.offset_along_axis.distance
      default: 0.05
      range:
      - 0.03
      - 0.1
      type: scalar
  target:
    anchor: current_tcp
    entity: null
    offset:
    - 0.0
    - 0.0
    - 0.0
    offset_along_axis:
      axis: world_z
      distance: 0.05
      mode: add_to_offset
      sign: positive
    orientation:
      mode: keep_current
    source: yaml
    tolerance: 0.01
  termination: pose_tolerance
  type: retract
skill: peg_insert
subtasks:
- anchor: fixture
  id: pre_approach
  metric: distance
  offset:
  - 0.0
  - 0.0
  - 0.12
  target_entity: tcp
  weight: 0.2
- anchor: goal
  id: insertion
  metric: distance
  offset:
  - 0.0
  - 0.0
  - 0.0
  target_entity: tcp
  weight: 0.8
