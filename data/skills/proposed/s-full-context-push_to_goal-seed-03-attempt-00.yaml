dsl_version: 2
phases:
- control: position_control
  generator: linear_cartesian
  id: approach_1
  parameters:
    approach_height:
      binds_to:
      - mode: replace
        path: target.offset.z
      default: 0.05
      range:
      - 0.03
      - 0.07
      type: scalar
  subtask_id: approach_target
  target:
    anchor: task_object
    entity: body
    offset:
    - -0.05
    - 0.118
    - 0.05
    orientation:
      mode: keep_current
    source: yaml
  termination: pose_tolerance
  type: approach
- control: position_control
  generator: linear_cartesian
  id: descend_1
  parameters:
    descend_lateral_x:
      binds_to:
      - mode: replace
        path: target.offset.x
      default: -0.05
      range:
      - -0.08
      - -0.02
      type: scalar
    descend_lateral_y:
      binds_to:
      - mode: replace
        path: target.offset.y
      default: 0.118
      range:
      - 0.08
      - 0.15
      type: scalar
  target:
    anchor: task_object
    entity: body
    offset:
    - -0.05
    - 0.118
    - 0.0
    orientation:
      mode: keep_current
    source: yaml
  termination: pose_tolerance
  type: descend
- control: admittance_control
  generator: linear_cartesian
  guards:
  - args: {}
    id: contact_lost_guard
    on_failure: retry
    predicate: contact_detected
    threshold: 0.5
    when: during_phase
  id: push_1
  parameters:
    push_distance:
      binds_to:
      - mode: replace
        path: target.offset_along_axis.distance
      default: 0.15
      range:
      - 0.08
      - 0.25
      type: scalar
    push_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.1
      range:
      - 0.05
      - 0.2
      type: scalar
  retries:
    max_attempts: 2
    offset:
    - 0.0
    - 0.0
    - 0.0
    strategy: offset_target
  subtask_id: push_goal
  target:
    anchor: task_object
    entity: body
    offset:
    - -0.05
    - 0.118
    - 0.0
    offset_along_axis:
      axis: task_goal_direction
      distance: 0.15
      mode: add_to_offset
      sign: positive
    orientation:
      mode: keep_current
    source: yaml
  termination: time_limit
  type: push
- control: position_control
  generator: arc_cartesian
  id: retract_1
  target:
    anchor: current_tcp
    offset:
    - 0.0
    - 0.0
    - 0.1
    orientation:
      mode: keep_current
    source: yaml
  termination: pose_tolerance
  type: retract
skill: push_to_goal
subtasks:
- anchor: object
  id: approach_target
  metric: distance
  offset:
  - -0.05
  - 0.118
  - 0.05
  target_entity: tcp
  weight: 0.3
- anchor: goal
  id: push_goal
  metric: distance
  offset:
  - 0.0
  - 0.0
  - 0.0
  target_entity: tcp
  weight: 0.7
