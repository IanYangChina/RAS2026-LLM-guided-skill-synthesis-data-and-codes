dsl_version: 2
phases:
- control: position_control
  generator: linear_cartesian
  guards: []
  id: approach_side
  parameters:
    approach_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.15
      range:
      - 0.05
      - 0.3
      type: scalar
    lateral_clearance:
      binds_to:
      - mode: replace
        path: target.offset.y
      default: 0.2
      range:
      - 0.16
      - 0.3
      type: scalar
  retries:
    max_attempts: 0
    strategy: repeat
  subtask_id: reach_clearance
  target:
    anchor: fixture
    entity: obstacle_block
    offset:
    - 0
    - 0.2
    - 0.17
    offset_along_axis: null
    orientation:
      mode: keep_current
    source: yaml
    tolerance: 0.015
  termination: pose_tolerance
  type: approach
- control: position_control
  generator: linear_cartesian
  guards: []
  id: approach_past
  parameters:
    approach_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.15
      range:
      - 0.05
      - 0.3
      type: scalar
    lateral_clearance:
      binds_to:
      - mode: replace
        path: target.offset.y
      default: 0.2
      range:
      - 0.16
      - 0.3
      type: scalar
  retries:
    max_attempts: 0
    strategy: repeat
  target:
    anchor: task_goal
    offset:
    - 0
    - 0.2
    - 0.17
    offset_along_axis: null
    orientation:
      mode: keep_current
    source: yaml
    tolerance: 0.015
  termination: pose_tolerance
  type: approach
- control: position_control
  generator: linear_cartesian
  guards: []
  id: descend_to_goal
  parameters:
    descend_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.08
      range:
      - 0.02
      - 0.2
      type: scalar
  retries:
    max_attempts: 0
    strategy: repeat
  subtask_id: reach_goal
  target:
    anchor: task_goal
    offset:
    - 0
    - 0
    - 0
    offset_along_axis: null
    orientation:
      mode: keep_current
    source: yaml
    tolerance: 0.015
  termination: pose_tolerance
  type: descend
skill: obstacle_reach
subtasks:
- anchor: fixture
  id: reach_clearance
  metric: distance
  offset:
  - 0
  - 0.2
  - 0.17
  target_entity: tcp
  weight: 0.3
- anchor: goal
  id: reach_goal
  metric: distance
  offset:
  - 0
  - 0
  - 0
  target_entity: tcp
  weight: 0.7
