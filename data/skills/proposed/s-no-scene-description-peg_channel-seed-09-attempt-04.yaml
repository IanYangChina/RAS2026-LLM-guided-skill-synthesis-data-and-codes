dsl_version: 2
phases:
- control: position_control
  generator: arc_cartesian
  id: approach_peg
  orientation:
    mode: keep_current
  parameters:
    approach_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.1
      range:
      - 0.05
      - 0.2
      type: scalar
  subtask_id: approach_peg
  target:
    anchor: task_object
    offset:
    - 0
    - 0
    - 0.12
    source: yaml
  termination: pose_tolerance
  type: approach
- control: position_control
  generator: joint_interpolation
  id: orient_gripper
  orientation:
    align_with: world_y
    axis:
    - 0
    - 0
    - 1
    mode: align_axis
    tolerance: 0.1
  parameters:
    align_tolerance:
      binds_to:
      - mode: replace
        path: termination.pose_tolerance
      default: 0.1
      range:
      - 0.01
      - 0.2
      type: scalar
  target:
    anchor: current_tcp
    offset:
    - 0
    - 0
    - 0
    source: yaml
  termination: pose_tolerance
  type: align
- control: admittance_control
  generator: linear_cartesian
  id: descend_grasp
  orientation:
    mode: keep_current
  parameters:
    contact_force_threshold:
      binds_to:
      - mode: replace
        path: termination.force_threshold
      default: 5.0
      range:
      - 2.0
      - 15.0
      type: scalar
  target:
    anchor: task_object
    offset:
    - 0
    - 0
    - 0.02
    source: yaml
  termination: force_exceeded
  type: descend
- end_effector_action: force_grasp
  generator: null
  id: grasp
  parameters:
    grip_force:
      default: 20.0
      range:
      - 5.0
      - 30.0
      type: scalar
  termination: grasp_success
  type: grasp
- control: position_control
  generator: linear_cartesian
  id: retract_clear
  orientation:
    mode: keep_current
  parameters:
    retract_height:
      binds_to:
      - mode: replace
        path: target.offset.z
      default: 0.1
      range:
      - 0.05
      - 0.15
      type: scalar
    retract_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.1
      range:
      - 0.05
      - 0.2
      type: scalar
  target:
    anchor: current_tcp
    offset:
    - 0
    - 0
    - 0.1
    source: yaml
  termination: pose_tolerance
  type: retract
- control: impedance_control
  generator: linear_cartesian
  guards:
  - args: {}
    id: force_guard
    on_failure: abort
    predicate: force_below
    threshold: 30.0
    when: during_phase
  id: push_channel
  orientation:
    mode: keep_current
  parameters:
    push_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.06
      range:
      - 0.03
      - 0.12
      type: scalar
    push_tolerance:
      binds_to:
      - mode: replace
        path: termination.pose_tolerance
      default: 0.015
      range:
      - 0.005
      - 0.03
      type: scalar
  subtask_id: push_through_channel
  target:
    anchor: task_goal
    offset:
    - 0
    - 0
    - 0.14
    source: yaml
  termination: pose_tolerance
  type: push
skill: peg_channel
skill_type: arm_gripper
subtasks:
- anchor: object
  id: approach_peg
  offset:
  - 0
  - 0
  - 0.12
  target_entity: tcp
  weight: 0.3
- anchor: goal
  id: push_through_channel
  offset:
  - 0
  - 0
  - 0.14
  target_entity: tcp
  weight: 0.7
