  guards: []
  id: grasp_1
  parameters: {}
  retries:
    max_attempts: 0
  subtask_id: null
  target:
    anchor: current_tcp
    offset:
    - 0.0
    - 0.0
    - 0.0
    orientation:
      mode: keep_current
    source: yaml
  termination: grasp_success
  type: grasp
- control: position_control
  generator: linear_cartesian
  guards: []
