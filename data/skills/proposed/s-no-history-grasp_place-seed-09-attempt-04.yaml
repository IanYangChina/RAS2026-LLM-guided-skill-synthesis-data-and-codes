  type: descend
- control: position_control
  end_effector_action: open
  generator: null
  guards: []
  id: release_1
  parameters: {}
  retries:
    max_attempts: 0
  subtask_id: null
  target:
    anchor: current_tcp
    offset:
    - 0.0
