dsl_version: 2
phases:
- control: position_control
  generator: linear_cartesian
  generator_speed: 0.1
  id: approach_object
  parameters:
    speed:
      binds_to:
      - mode: replace
        path: generator_speed
      default: 0.1
      range:
      - 0.05
      - 0.5
      type: scalar
  subtask_id: approach_object
  target:
    anchor: task_object
    offset:
    - 0.0
    - 0.0
    - 0.1
    orientation:
      align_with: world_z
      axis:
      - 0.0
      - 0.0
      - -1.0
      mode: align_axis
      tolerance: 0.1
    source: yaml
  termination: pose_tolerance
  termination_pose_tolerance: 0.02
  type: approach
- control: force_threshold_switch
  generator: linear_cartesian
  generator_speed: 0.1
  id: descend_to_object
  parameters:
    descending_force:
      binds_to:
      - mode: replace
        path: termination_force_threshold
      default: 4.0
      range:
      - 1.0
      - 10.0
      type: scalar
    speed:
      binds_to:
      - mode: replace
        path: generator_speed
      default: 0.1
      range:
      - 0.05
      - 0.3
      type: scalar
  subtask_id: approach_object
  target:
    anchor: task_object
    offset:
    - 0.0
    - 0.0
    - 0.0
    orientation:
      mode: keep_current
    source: yaml
  termination: force_exceeded
  termination_force_threshold: 4.0
  type: descend
- control: null
  end_effector_action: force_grasp
  generator: null
  guards:
  - args: {}
    id: grasp_check
    on_failure: retry
    predicate: bilateral_grasp
    threshold: 0.5
    when: after_phase
  id: grasp
  retries:
    max_attempts: 2
    offset:
    - 0.0
    - 0.0
    - 0.0
    strategy: offset_target
  target:
    anchor: current_tcp
    offset:
    - 0.0
    - 0.0
    - 0.0
    source: yaml
  termination: grasp_success
  type: grasp
- control: impedance_control
  generator: linear_cartesian
  generator_speed: 0.1
  id: lift
  parameters:
    lift_height:
      binds_to:
      - mode: replace
        path: target.offset.z
      default: 0.15
      range:
      - 0.1
      - 0.3
      type: scalar
    speed:
      binds_to:
      - mode: replace
        path: generator_speed
      default: 0.1
      range:
      - 0.05
      - 0.3
      type: scalar
  subtask_id: lift_object
  target:
    anchor: task_object
    offset:
    - 0.0
    - 0.0
    - 0.15
    orientation:
      mode: keep_current
    source: yaml
  termination: pose_tolerance
  termination_pose_tolerance: 0.02
  type: lift
- control: position_control
  generator: linear_cartesian
  generator_speed: 0.1
  id: approach_goal
  parameters:
    speed:
      binds_to:
      - mode: replace
        path: generator_speed
      default: 0.1
      range:
      - 0.05
      - 0.5
      type: scalar
  subtask_id: reach_goal
  target:
    anchor: task_goal
    offset:
    - 0.0
    - 0.0
    - 0.1
    orientation:
      mode: keep_current
    source: yaml
  termination: pose_tolerance
  termination_pose_tolerance: 0.02
  type: approach
- control: position_control
  generator: linear_cartesian
  generator_speed: 0.08
  id: descend_to_place
  parameters:
    speed:
      binds_to:
      - mode: replace
        path: generator_speed
      default: 0.08
      range:
      - 0.05
      - 0.3
      type: scalar
  subtask_id: place_at_goal
  target:
    anchor: task_goal
    offset:
    - 0.0
    - 0.0
    - 0.0
    orientation:
      mode: keep_current
    source: yaml
  termination: pose_tolerance
  termination_pose_tolerance: 0.01
  type: descend
- control: null
  duration:
    max_time: 0.5
  end_effector_action: open
  generator: null
  id: release
  target:
    anchor: current_tcp
    offset:
    - 0.0
    - 0.0
    - 0.0
    source: yaml
  termination: time_limit
  type: release
- control: position_control
  generator: linear_cartesian
  generator_speed: 0.2
  id: retract
  parameters:
    speed:
      binds_to:
      - mode: replace
        path: generator_speed
      default: 0.2
      range:
      - 0.05
      - 0.5
      type: scalar
  target:
    anchor: current_tcp
    offset:
    - 0.0
    - 0.0
    - 0.1
    orientation:
      mode: keep_current
    source: yaml
  termination: pose_tolerance
  termination_pose_tolerance: 0.02
  type: retract
skill: grasp_place
subtasks:
- anchor: object
  id: approach_object
  metric: distance
  offset:
  - 0.0
  - 0.0
  - 0.1
  target_entity: tcp
  weight: 0.15
- anchor: object
  id: lift_object
  metric: distance
  offset:
  - 0.0
  - 0.0
  - 0.15
  target_entity: tcp
  weight: 0.25
- anchor: goal
  id: reach_goal
  metric: distance
  offset:
  - 0.0
  - 0.0
  - 0.1
  target_entity: tcp
  weight: 0.25
- anchor: goal
  id: place_at_goal
  metric: distance
  offset:
  - 0.0
  - 0.0
  - 0.0
  target_entity: tcp
  weight: 0.35
