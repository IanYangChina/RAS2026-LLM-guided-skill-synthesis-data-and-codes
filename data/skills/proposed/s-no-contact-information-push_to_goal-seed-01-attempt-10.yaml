dsl_version: 2
phases:
- control: position_control
  generator: linear_cartesian
  id: approach_behind
  parameters:
    approach_offset_y:
      binds_to:
      - mode: replace
        path: target.offset.y
      default: 0.12
      range:
      - 0.06
      - 0.18
      type: scalar
  retries:
    max_attempts: 1
    offset:
    - 0.0
    - 0.02
    - 0.0
    strategy: offset_target
  subtask_id: reach_pre_push
  target:
    anchor: task_object
    entity: push_box
    offset:
    - 0.0
    - 0.12
    - 0.0
    orientation:
      mode: keep_current
    source: yaml
    tolerance: 0.015
  termination: pose_tolerance
  type: approach
- control: impedance_control
  generator: linear_cartesian
  id: push_to_goal
  parameters:
    push_tolerance:
      binds_to:
      - mode: replace
        path: termination.pose_tolerance
      default: 0.02
      range:
      - 0.015
      - 0.03
      type: scalar
  subtask_id: push_to_goal
  target:
    anchor: task_goal
    entity: goal_marker
    offset:
    - 0.0
    - 0.0
    - 0.0
    orientation:
      align_with: task_goal_direction
      axis:
      - 1
      - 0
      - 0
      mode: align_axis
      tolerance: 0.1
    source: yaml
    tolerance: 0.02
  termination: pose_tolerance
  type: push
skill: push_to_goal
subtasks:
- anchor: object
  id: reach_pre_push
  metric: distance
  offset:
  - 0.0
  - 0.1
  - 0.0
  target_entity: tcp
  weight: 0.3
- anchor: goal
  id: push_to_goal
  metric: distance
  offset:
  - 0.0
  - 0.0
  - 0.0
  target_entity: tcp
  weight: 0.7
