dsl_version: 2
phases:
- control: impedance_control
  generator: arc_cartesian
  id: approach_clearance
  parameters:
    approach_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.15
      range:
      - 0.05
      - 0.3
      type: scalar
    approach_time:
      binds_to:
      - mode: replace
        path: duration.max_time
      default: 2.0
      range:
      - 1.0
      - 5.0
      type: scalar
    arc_height:
      binds_to:
      - mode: replace
        path: generator.arc_height
      default: 0.1
      range:
      - 0.05
      - 0.2
      type: scalar
    lateral_y_offset_approach:
      binds_to:
      - mode: replace
        path: target.offset.y
      default: 0.155
      range:
      - 0.12
      - 0.25
      type: scalar
  target:
    anchor: task_goal
    offset:
    - -0.1
    - 0.155
    - 0.2
    orientation:
      mode: keep_current
    source: yaml
  termination: time_limit
  type: approach
- control: position_control
  generator: linear_cartesian
  id: descend
  parameters:
    descend_tolerance:
      binds_to:
      - mode: replace
        path: termination.pose_tolerance
      default: 0.015
      range:
      - 0.005
      - 0.02
      type: scalar
    lateral_y_offset_descend:
      binds_to:
      - mode: replace
        path: target.offset.y
      default: 0.155
      range:
      - 0.12
      - 0.25
      type: scalar
  target:
    anchor: task_goal
    offset:
    - -0.1
    - 0.155
    - 0.0
    orientation:
      mode: keep_current
    source: yaml
    tolerance: 0.01
  termination: pose_tolerance
  type: descend
- control: position_control
  generator: linear_cartesian
  id: push_to_goal
  parameters:
    final_push_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.05
      range:
      - 0.01
      - 0.1
      type: scalar
    push_tolerance:
      binds_to:
      - mode: replace
        path: termination.pose_tolerance
      default: 0.015
      range:
      - 0.005
      - 0.02
      type: scalar
  target:
    anchor: task_goal
    offset:
    - 0.0
    - 0.0
    - 0.0
    orientation:
      mode: keep_current
    source: yaml
    tolerance: 0.01
  termination: pose_tolerance
  type: push
skill: obstacle_reach
