dsl_version: 2
phases:
- control: position_control
  generator: linear_cartesian
  id: approach_1
  parameters:
    approach_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.05
      range:
      - 0.01
      - 0.2
      type: scalar
  subtask_id: reach_object
  target:
    anchor: task_object
    entity: push_box
    offset:
      x: 0.02
      y: 0.02
      z: 0.0
    offset_along_axis:
      axis: task_goal_direction
      distance:
        binds_to:
        - mode: replace
          path: target.offset_along_axis.distance
        default: 0.05
        range:
        - 0.03
        - 0.1
        type: scalar
      mode: replace_offset_projection
      sign: negative
    orientation:
      mode: keep_current
    source: yaml
    tolerance:
      binds_to:
      - mode: replace
        path: termination.pose_tolerance
      default: 0.02
      range:
      - 0.005
      - 0.05
      type: scalar
  termination: pose_tolerance
  type: approach
- control: impedance_control
  generator: impedance_motion
  guards:
  - args: {}
    id: push_contact_guard
    on_failure: retry
    predicate: contact_detected
    threshold: 1.0
    when: during_phase
  id: push_1
  parameters:
    push_force_threshold:
      binds_to:
      - mode: replace
        path: termination.force_threshold
      default: 20.0
      range:
      - 5.0
      - 25.0
      type: scalar
    push_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.04
      range:
      - 0.01
      - 0.1
      type: scalar
  retries:
    max_attempts: 2
    offset:
      x: 0.0
      y: 0.0
      z: 0.0
    strategy: offset_target
  subtask_id: push_to_goal
  target:
    anchor: task_goal
    entity: goal_marker
    offset:
      x: 0.0
      y: 0.0
      z: 0.0
    offset_along_axis:
      axis: task_goal_direction
      distance:
        binds_to:
        - mode: replace
          path: target.offset_along_axis.distance
        default: 0.18
        range:
        - 0.05
        - 0.3
        type: scalar
      mode: replace_offset_projection
      sign: positive
    orientation:
      mode: keep_current
    source: yaml
  termination: force_exceeded
  type: push
- control: position_control
  generator: linear_cartesian
  id: retract_1
  parameters:
    retract_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.05
      range:
      - 0.02
      - 0.2
      type: scalar
    retract_tolerance:
      binds_to:
      - mode: replace
        path: termination.pose_tolerance
      default: 0.02
      range:
      - 0.005
      - 0.05
      type: scalar
  target:
    anchor: current_tcp
    offset:
      x: 0.0
      y: 0.0
      z: 0.1
    orientation:
      mode: keep_current
    source: yaml
  termination: pose_tolerance
  type: retract
skill: push_to_goal
skill_type: arm
subtasks:
- anchor: object
  id: reach_object
  metric: distance
  offset:
  - 0.0
  - 0.0
  - 0.05
  target_entity: tcp
  weight: 0.3
- anchor: goal
  id: push_to_goal
  metric: goal_progress
  offset:
  - 0.0
  - 0.0
  - 0.0
  target_entity: tcp
  weight: 0.7
