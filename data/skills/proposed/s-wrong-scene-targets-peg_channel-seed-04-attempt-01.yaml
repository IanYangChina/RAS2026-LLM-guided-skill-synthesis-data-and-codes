dsl_version: 2
phases:
- control: position_control
  generator: linear_cartesian
  id: approach_behind
  parameters:
    approach_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.12
      range:
      - 0.05
      - 0.2
      type: scalar
  subtask_id: approach_contact
  target:
    anchor: task_object
    offset:
    - 0.0
    - 0.08
    - 0.06
    orientation:
      mode: keep_current
    source: yaml
    tolerance: 0.02
  termination: pose_tolerance
  type: approach
- control: force_threshold_switch
  generator: linear_cartesian
  id: contact_peg
  parameters:
    contact_force_threshold:
      binds_to:
      - mode: replace
        path: termination.force_threshold
      default: 15.0
      range:
      - 2.0
      - 30.0
      type: scalar
    contact_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.04
      range:
      - 0.01
      - 0.08
      type: scalar
  subtask_id: approach_contact
  target:
    anchor: task_object
    offset:
    - 0.0
    - 0.01
    - 0.0
    orientation:
      mode: keep_current
    source: yaml
    tolerance: 0.02
  termination: force_exceeded
  type: contact
- control: impedance_control
  generator: impedance_motion
  guards:
  - args: {}
    id: push_contact_guard
    on_failure: retry
    predicate: force_below
    threshold: 1.0
    when: during_phase
  id: push_through
  parameters:
    guard_force_below_threshold:
      binds_to:
      - mode: replace
        path: guards.push_contact_guard.threshold
      default: 1.0
      range:
      - 0.5
      - 5.0
      type: scalar
    push_distance:
      binds_to:
      - mode: replace
        path: target.offset_along_axis.distance
      default: 0.16
      range:
      - 0.05
      - 0.25
      type: scalar
    push_force_limit:
      binds_to:
      - mode: replace
        path: termination.force_threshold
      default: 25.0
      range:
      - 5.0
      - 40.0
      type: scalar
    push_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.03
      range:
      - 0.01
      - 0.08
      type: scalar
  retries:
    max_attempts: 2
    offset:
    - 0.0
    - -0.01
    - 0.0
    strategy: offset_target
  subtask_id: insertion
  target:
    anchor: task_object
    offset:
    - 0.0
    - 0.0
    - 0.0
    offset_along_axis:
      axis: channel_axis
      distance: 0.16
      mode: add_to_offset
      sign: negative
    orientation:
      align_with: channel_axis
      axis:
      - 0.0
      - 0.0
      - 1.0
      mode: align_axis
      tolerance: 0.1
    source: yaml
  termination: force_exceeded
  type: push
- control: position_control
  generator: linear_cartesian
  id: retract_after_push
  parameters:
    retract_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.12
      range:
      - 0.05
      - 0.2
      type: scalar
  subtask_id: insertion
  target:
    anchor: task_object
    offset:
    - 0.0
    - 0.08
    - 0.06
    orientation:
      mode: keep_current
    source: yaml
    tolerance: 0.02
  termination: pose_tolerance
  type: retract
skill: peg_channel
skill_type: arm_gripper
subtasks:
- anchor: object
  id: approach_contact
  offset:
  - 0.0
  - 0.08
  - 0.06
  target_entity: tcp
  weight: 0.3
- anchor: fixture
  id: insertion
  metric: goal_progress
  target_entity: object
  weight: 0.7
