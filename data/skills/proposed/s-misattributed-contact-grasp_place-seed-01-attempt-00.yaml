dsl_version: 2
phases:
- control: position_control
  generator: linear_cartesian
  id: approach_object
  parameters:
    approach_height:
      binds_to:
      - mode: replace
        path: target.offset.z
      default: 0.1
      range:
      - 0.08
      - 0.15
      type: scalar
  subtask_id: reach_object
  target:
    anchor: task_object
    offset:
    - 0
    - 0
    - 0.1
    source: yaml
    tolerance: 0.02
  termination: pose_tolerance
  type: approach
- control: position_control
  generator: linear_cartesian
  id: descend_to_grasp
  orientation:
    mode: keep_current
  parameters:
    descend_z_offset:
      binds_to:
      - mode: replace
        path: target.offset.z
      default: 0.03
      range:
      - 0.01
      - 0.05
      type: scalar
  subtask_id: grasp_object
  target:
    anchor: task_object
    offset:
    - 0
    - 0
    - 0.03
    source: yaml
    tolerance: 0.01
  termination: pose_tolerance
  type: descend
- control: impedance_control
  end_effector_action: force_grasp
  generator: null
  guards:
  - id: grasp_check
    on_failure: retry
    predicate: bilateral_grasp
    threshold: 0.5
    when: after_phase
  id: close_gripper
  retries:
    max_attempts: 2
    strategy: increase_force_limit
  target:
    anchor: current_tcp
    source: yaml
  termination: grasp_success
  type: grasp
- control: position_control
  generator: linear_cartesian
  id: lift_object
  orientation:
    align_with: world_z
    axis:
    - 0
    - 0
    - 1
    mode: align_axis
    tolerance: 0.1
  parameters:
    lift_height:
      binds_to:
      - mode: replace
        path: target.offset.z
      default: 0.15
      range:
      - 0.1
      - 0.2
      type: scalar
  subtask_id: lift_object
  target:
    anchor: task_object
    offset:
    - 0
    - 0
    - 0.15
    source: yaml
    tolerance: 0.02
  termination: pose_tolerance
  type: lift
- control: position_control
  generator: linear_cartesian
  id: place_at_goal
  orientation:
    align_with: world_z
    axis:
    - 0
    - 0
    - 1
    mode: align_axis
    tolerance: 0.1
  parameters:
    place_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.05
      range:
      - 0.02
      - 0.08
      type: scalar
    place_z_offset:
      binds_to:
      - mode: replace
        path: target.offset.z
      default: 0.03
      range:
      - 0.0
      - 0.06
      type: scalar
  subtask_id: place_goal
  target:
    anchor: task_goal
    offset:
    - 0
    - 0
    - 0.03
    source: yaml
    tolerance: 0.02
  termination: pose_tolerance
  type: push
skill: grasp_place
skill_type: arm_gripper
subtasks:
- anchor: object
  id: reach_object
  metric: distance
  offset:
  - 0
  - 0
  - 0.1
  target_entity: tcp
  weight: 0.2
- anchor: object
  id: grasp_object
  metric: distance
  offset:
  - 0
  - 0
  - 0.03
  target_entity: tcp
  weight: 0.2
- anchor: object
  id: lift_object
  metric: distance
  offset:
  - 0
  - 0
  - 0.15
  target_entity: tcp
  weight: 0.3
- anchor: goal
  id: place_goal
  metric: distance
  offset:
  - 0
  - 0
  - 0.03
  target_entity: tcp
  weight: 0.3
