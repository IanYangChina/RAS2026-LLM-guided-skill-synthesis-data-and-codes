dsl_version: 2
phases:
- control: position_control
  generator: linear_cartesian
  guards: []
  id: approach_behind
  parameters:
    approach_x_offset:
      binds_to:
      - mode: add
        path: target.offset.x
      default: 0.05
      range:
      - -0.05
      - 0.15
      type: scalar
    approach_y_offset:
      binds_to:
      - mode: add
        path: target.offset.y
      default: 0.08
      range:
      - -0.05
      - 0.2
      type: scalar
    approach_z_offset:
      binds_to:
      - mode: replace
        path: target.offset.z
      default: 0.15
      range:
      - 0.05
      - 0.25
      type: scalar
  retries:
    max_attempts: 1
    offset:
    - 0.02
    - 0.0
    - 0.0
    strategy: offset_target
  subtask_id: approach_object
  target:
    anchor: task_object
    offset:
    - 0.0
    - 0.0
    - 0.15
    orientation:
      mode: keep_current
    source: yaml
    tolerance: 0.02
  termination: pose_tolerance
  type: approach
- control: force_threshold_switch
  generator: linear_cartesian
  guards:
  - args: {}
    id: contact_detected_guard
    on_failure: retry
    predicate: contact_detected
    threshold: 0.5
    when: after_phase
  id: descend_contact
  parameters:
    descend_force_threshold:
      binds_to:
      - mode: replace
        path: termination.force_threshold
      default: 5.0
      range:
      - 1.0
      - 20.0
      type: scalar
    descend_z_offset:
      binds_to:
      - mode: add
        path: target.offset.z
      default: -0.02
      range:
      - -0.04
      - 0.0
      type: scalar
  retries:
    max_attempts: 2
    offset:
    - 0.0
    - 0.0
    - -0.01
    strategy: offset_target
  subtask_id: approach_object
  target:
    anchor: task_object
    offset:
    - 0.0
    - 0.0
    - 0.03
    orientation:
      mode: keep_current
    source: yaml
  termination: force_exceeded
  type: descend
- control: impedance_control
  generator: linear_cartesian
  guards:
  - args: {}
    id: force_exceeded_guard
    on_failure: abort
    predicate: force_below
    threshold: 25.0
    when: during_phase
  - args: {}
    id: progress_check
    on_failure: retry
    predicate: object_progress
    threshold: 0.01
    when: after_phase
  id: push_to_goal
  parameters:
    push_distance:
      binds_to:
      - mode: replace
        path: target.offset_along_axis.distance
      default: 0.15
      range:
      - 0.05
      - 0.25
      type: scalar
    push_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.05
      range:
      - 0.01
      - 0.1
      type: scalar
  retries:
    max_attempts: 2
    offset:
    - -0.01
    - -0.01
    - 0.0
    strategy: offset_target
  subtask_id: push_object_to_goal
  target:
    anchor: current_tcp
    offset:
    - 0.0
    - 0.0
    - 0.0
    offset_along_axis:
      axis: task_goal_direction
      distance: 0.15
      mode: replace_offset_projection
      sign: positive
    source: yaml
    tolerance: 0.02
  termination: pose_tolerance
  type: push
skill: push_to_goal
skill_type: arm_gripper
subtasks:
- anchor: object
  id: approach_object
  metric: distance
  offset:
  - 0.0
  - 0.0
  - 0.1
  target_entity: tcp
  weight: 0.3
- anchor: goal
  id: push_object_to_goal
  metric: goal_progress
  target_entity: object
  weight: 0.7
