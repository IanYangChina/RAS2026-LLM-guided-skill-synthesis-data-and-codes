dsl_version: 2
phases:
- control: position_control
  generator: impedance_motion
  id: rotate_1
  orientation:
    align_with: insertion_axis
    axis:
    - 0
    - 0
    - -1
    mode: align_axis
    tolerance: 0.05
  parameters:
    rotate_approach_z:
      binds_to:
      - mode: add
        path: target.offset.z
      default: 0.1
      range:
      - 0.05
      - 0.15
      type: scalar
  target:
    anchor: task_goal
    entity: null
    offset:
    - 0.0
    - 0.0
    - 0.0
    source: yaml
    tolerance: 0.02
  termination: pose_tolerance
  type: rotate
- control: position_control
  generator: arc_cartesian
  id: retract_1
  parameters:
    generator:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.6
      range:
      - 0.3
      - 1.0
      type: scalar
    retract_height:
      binds_to:
      - mode: add
        path: target.offset.z
      default: 0.15
      range:
      - 0.05
      - 0.2
      type: scalar
  target:
    anchor: task_goal
    entity: null
    offset:
    - 0.0
    - 0.0
    - 0.25
    source: yaml
    tolerance: 0.02
  termination: time_limit
  type: retract
- control: admittance_control
  generator: linear_cartesian
  guards:
  - args: {}
    id: approach_within_tolerance
    on_failure: continue
    predicate: pose_within_tolerance
    threshold: 0.02
    when: before_phase
  id: descend_1
  orientation:
    align_with: insertion_axis
    axis:
    - 0
    - 0
    - -1
    mode: align_axis
    tolerance: 0.05
  parameters:
    depth:
      binds_to:
      - mode: add
        path: target.offset.z
      default: 0.05
      range:
      - 0.01
      - 0.1
      type: scalar
  target:
    anchor: task_goal
    entity: null
    offset:
    - 0.0
    - 0.0
    - 0.1
    source: yaml
    tolerance: 0.02
  termination: pose_tolerance
  type: descend
- control: impedance_control
  generator: arc_cartesian
  id: pull_1
  orientation:
    align_with: insertion_axis
    axis:
    - 0
    - 0
    - -1
    mode: align_axis
    tolerance: 0.05
  parameters:
    pull_distance:
      binds_to:
      - mode: replace
        path: target.offset_along_axis.distance
      default: 0.12
      range:
      - 0.02
      - 0.2
      type: scalar
  target:
    anchor: fixture
    entity: peg_socket
    offset:
    - 0.0
    - 0.0
    - 0.08
    offset_along_axis:
      axis: insertion_axis
      distance: 0.1
      mode: add_to_offset
      sign: positive
    source: yaml
    tolerance: 0.05
  termination: time_limit
  type: pull
skill: peg_insert
