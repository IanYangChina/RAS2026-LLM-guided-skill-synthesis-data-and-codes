dsl_version: 2
phases:
- control: position_control
  generator: linear_cartesian
  id: approach_to_handle
  parameters:
    speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.1
      range:
      - 0.05
      - 0.2
      type: scalar
  target:
    anchor: site
    entity: door_handle
    offset:
    - 0
    - 0
    - 0.02
    source: yaml
    tolerance: 0.005
  termination: pose_tolerance
  type: approach
- control: position_control
  generator: linear_cartesian
  id: contact_handle
  target:
    anchor: site
    entity: door_handle
    offset:
    - 0
    - 0
    - 0
    source: yaml
    tolerance: 0.005
  termination: contact_detected
  type: descend
- control: impedance_control
  generator: linear_cartesian
  guards:
  - args: {}
    id: force_safety
    on_failure: abort
    predicate: force_below
    threshold: 29.0
    when: during_phase
  id: push_door
  parameters:
    push_distance:
      binds_to:
      - mode: replace
        path: target.offset_along_axis.distance
      default: 0.2
      range:
      - 0.1
      - 0.3
      type: scalar
    push_force_threshold:
      binds_to:
      - mode: replace
        path: termination.force_threshold
      default: 15
      range:
      - 5
      - 25
      type: scalar
  target:
    anchor: site
    entity: door_handle
    offset_along_axis:
      axis: world_y
      distance: 0.2
      mode: add_to_offset
      sign: negative
    source: yaml
    tolerance: 0.005
  termination: force_exceeded
  type: push
skill: door_push
skill_type: arm
