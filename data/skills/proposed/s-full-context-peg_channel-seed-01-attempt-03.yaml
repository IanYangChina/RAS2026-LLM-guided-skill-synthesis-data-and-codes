dsl_version: 2
phases:
- control: impedance_control
  generator: linear_cartesian
  id: approach_to_behind
  parameters:
    approach_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.2
      range:
      - 0.01
      - 0.5
      type: scalar
  retries:
    max_attempts: 1
    strategy: repeat
  subtask_id: reach_contact
  target:
    anchor: task_object
    entity: attachment_site
    offset:
    - 0.0
    - 0.02
    - 0.08
    orientation:
      align_with: channel_axis
      axis:
      - 0
      - 0
      - 1
      mode: align_axis
      tolerance: 0.1
    source: yaml
  termination: pose_tolerance
  type: approach
- control: impedance_control
  generator: linear_cartesian
  id: descend_to_contact
  parameters:
    descend_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.1
      range:
      - 0.01
      - 0.3
      type: scalar
  retries:
    max_attempts: 1
    strategy: repeat
  subtask_id: reach_contact
  target:
    anchor: task_object
    entity: attachment_site
    offset:
    - 0.0
    - 0.01
    - 0.04
    orientation:
      mode: keep_current
    source: yaml
  termination: pose_tolerance
  type: descend
- control: impedance_control
  generator: linear_cartesian
  guards:
  - args: {}
    id: force_guard
    on_failure: retry
    predicate: force_below
    threshold: 30.0
    when: during_phase
  - args: {}
    id: lateral_deviation_guard
    on_failure: retry
    predicate: pose_within_tolerance
    threshold: 0.02
    when: during_phase
  id: push_along_channel
  parameters:
    push_distance:
      binds_to:
      - mode: replace
        path: target.offset_along_axis.distance
      default: 0.16
      range:
      - 0.02
      - 0.2
      type: scalar
    push_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.05
      range:
      - 0.01
      - 0.3
      type: scalar
  retries:
    max_attempts: 2
    offset:
    - 0.0
    - 0.0
    - 0.0
    strategy: offset_target
  subtask_id: push_channel
  target:
    anchor: task_object
    entity: attachment_site
    offset:
    - 0.0
    - 0.0
    - 0.0
    offset_along_axis:
      axis: channel_axis
      distance: 0.16
      mode: replace_offset_projection
    orientation:
      mode: keep_current
    source: yaml
  termination: pose_tolerance
  type: push
- control: position_control
  generator: linear_cartesian
  id: retract_up
  parameters:
    retract_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.1
      range:
      - 0.01
      - 0.3
      type: scalar
  retries:
    max_attempts: 1
    strategy: repeat
  target:
    anchor: task_object
    entity: attachment_site
    offset:
    - 0.0
    - 0.02
    - 0.12
    orientation:
      mode: keep_current
    source: yaml
  termination: pose_tolerance
  type: retract
skill: peg_channel
subtasks:
- anchor: object
  id: reach_contact
  metric: distance
  offset:
  - 0.0
  - 0.01
  - 0.06
  target_entity: tcp
  weight: 0.3
- anchor: object
  id: push_channel
  metric: goal_progress
  offset:
  - 0.0
  - 0.0
  - 0.0
  target_entity: tcp
  weight: 0.7
