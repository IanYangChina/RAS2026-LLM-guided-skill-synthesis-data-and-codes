dsl_version: 2
phases:
- control: position_control
  generator: linear_cartesian
  id: align_1
  parameters:
    align_pose_tol:
      binds_to:
      - mode: replace
        path: termination.pose_tolerance
      default: 0.005
      range:
      - 0.001
      - 0.01
      type: scalar
    lateral_offset_x:
      binds_to:
      - mode: replace
        path: target.offset.x
      default: 0.0
      range:
      - -0.02
      - 0.02
      type: scalar
    lateral_offset_y:
      binds_to:
      - mode: replace
        path: target.offset.y
      default: 0.0
      range:
      - -0.02
      - 0.02
      type: scalar
  subtask_id: align_xy
  target:
    anchor: fixture
    offset:
    - 0.0
    - 0.0
    - 0.1
    orientation:
      align_with: channel_axis
      axis:
      - 0.0
      - 0.0
      - 1.0
      mode: align_axis
      tolerance: 0.1
    source: yaml
  termination: pose_tolerance
  type: align
- control: position_control
  generator: linear_cartesian
  id: approach_1
  parameters:
    approach_pose_tol:
      binds_to:
      - mode: replace
        path: termination.pose_tolerance
      default: 0.005
      range:
      - 0.001
      - 0.01
      type: scalar
    approach_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.1
      range:
      - 0.01
      - 0.2
      type: scalar
  subtask_id: approach_entry
  target:
    anchor: fixture
    offset:
    - 0.0
    - 0.0
    - 0.055
    orientation:
      mode: keep_current
    source: yaml
  termination: pose_tolerance
  type: approach
- control: force_threshold_switch
  generator: linear_cartesian
  id: contact_1
  parameters:
    contact_force_threshold:
      binds_to:
      - mode: replace
        path: termination.force_threshold
      default: 5.0
      range:
      - 2.0
      - 10.0
      type: scalar
  subtask_id: contact_rim
  target:
    anchor: fixture
    offset:
    - 0.0
    - 0.0
    - 0.05
    orientation:
      mode: keep_current
    source: yaml
  termination: force_exceeded
  type: contact
- control: impedance_control
  generator: linear_cartesian
  guards:
  - id: max_force
    on_failure: abort
    predicate: force_below
    threshold: 30.0
    when: during_phase
  id: insert_1
  parameters:
    insert_pose_tol:
      binds_to:
      - mode: replace
        path: termination.pose_tolerance
      default: 0.005
      range:
      - 0.001
      - 0.01
      type: scalar
    insertion_depth:
      binds_to:
      - mode: replace
        path: target.offset_along_axis.distance
      default: 0.05
      range:
      - 0.01
      - 0.1
      type: scalar
    insertion_force_limit:
      binds_to:
      - mode: replace
        path: guards.max_force.threshold
      default: 30.0
      range:
      - 5.0
      - 35.0
      type: scalar
  subtask_id: insert_depth
  target:
    anchor: fixture
    offset:
    - 0.0
    - 0.0
    - 0.055
    offset_along_axis:
      axis: channel_axis
      distance: 0.05
      mode: add_to_offset
      sign: positive
    orientation:
      mode: keep_current
    source: yaml
  termination: pose_tolerance
  type: insert
- control: position_control
  generator: linear_cartesian
  id: retract_1
  parameters:
    retract_pose_tol:
      binds_to:
      - mode: replace
        path: termination.pose_tolerance
      default: 0.005
      range:
      - 0.001
      - 0.01
      type: scalar
    retract_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.1
      range:
      - 0.01
      - 0.2
      type: scalar
  subtask_id: retract_up
  target:
    anchor: fixture
    offset:
    - 0.0
    - 0.0
    - 0.1
    orientation:
      mode: keep_current
    source: yaml
  termination: pose_tolerance
  type: retract
skill: peg_insert
subtasks:
- anchor: fixture
  id: align_xy
  metric: distance
  offset:
  - 0.0
  - 0.0
  - 0.1
  target_entity: tcp
  weight: 0.2
- anchor: fixture
  id: approach_entry
  metric: distance
  offset:
  - 0.0
  - 0.0
  - 0.055
  target_entity: tcp
  weight: 0.2
- anchor: fixture
  id: contact_rim
  metric: distance
  offset:
  - 0.0
  - 0.0
  - 0.05
  target_entity: tcp
  weight: 0.1
- anchor: fixture
  id: insert_depth
  metric: distance
  offset:
  - 0.0
  - 0.0
  - 0.005
  target_entity: tcp
  weight: 0.3
- anchor: fixture
  id: retract_up
  metric: distance
  offset:
  - 0.0
  - 0.0
  - 0.1
  target_entity: tcp
  weight: 0.2
