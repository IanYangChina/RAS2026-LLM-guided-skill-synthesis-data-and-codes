dsl_version: 2
phases:
- control: impedance_control
  generator: arc_cartesian
  guards:
  - id: above_obstacle
    on_failure: retry
    predicate: pose_within_tolerance
    threshold: 0.03
    when: after_phase
  id: approach_above_obstacle
  parameters:
    approach_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.3
      range:
      - 0.1
      - 0.5
      type: scalar
    arc_height:
      binds_to:
      - mode: add
        path: generator.arc_height
      default: 0.15
      range:
      - 0.1
      - 0.2
      type: scalar
  retries:
    max_attempts: 2
    offset:
    - 0.0
    - 0.01
    - 0.01
    strategy: offset_target
  subtask_id: approach_above
  target:
    anchor: world
    offset:
    - 0.5
    - 0.0
    - 0.4
    orientation:
      mode: keep_current
    source: yaml
    tolerance: 0.025
  termination: pose_tolerance
  type: approach
- control: impedance_control
  generator: arc_cartesian
  guards:
  - id: goal_reached
    on_failure: retry
    predicate: pose_within_tolerance
    threshold: 0.02
    when: after_phase
  id: descend_to_goal
  parameters:
    arc_height:
      binds_to:
      - mode: add
        path: generator.arc_height
      default: 0.05
      range:
      - 0.02
      - 0.1
      type: scalar
    descend_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.15
      range:
      - 0.1
      - 0.3
      type: scalar
  retries:
    max_attempts: 3
    offset:
    - 0.0
    - 0.01
    - 0.01
    strategy: offset_target
  subtask_id: reach_goal
  target:
    anchor: task_goal
    offset:
    - 0.0
    - 0.0
    - 0.0
    orientation:
      mode: keep_current
    source: yaml
    tolerance: 0.025
  termination: pose_tolerance
  type: descend
skill: obstacle_reach
subtasks:
- anchor: world
  id: approach_above
  offset:
  - 0.5
  - 0.0
  - 0.4
  weight: 0.3
- id: reach_goal
  weight: 0.7
