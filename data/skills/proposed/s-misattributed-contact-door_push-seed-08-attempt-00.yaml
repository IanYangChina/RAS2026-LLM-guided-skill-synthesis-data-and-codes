dsl_version: 2
phases:
- control: position_control
  generator: linear_cartesian
  id: approach_1
  parameters:
    approach_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.2
      range:
      - 0.05
      - 0.5
      type: scalar
  subtask_id: approach_handle
  target:
    anchor: fixture
    entity: door_panel
    offset:
    - -0.4
    - -0.02
    - 0.35
    orientation:
      mode: keep_current
    source: yaml
    tolerance: 0.02
  termination: pose_tolerance
  type: approach
- control: impedance_control
  generator: linear_cartesian
  guards:
  - args: {}
    id: goal_reached
    on_failure: continue
    predicate: hinge_delta_reached
    threshold: 0.524
    when: during_phase
  id: push_1
  parameters:
    push_distance:
      binds_to:
      - mode: replace
        path: target.offset_along_axis.distance
      default: 0.25
      range:
      - 0.1
      - 0.5
      type: scalar
    push_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.1
      range:
      - 0.02
      - 0.3
      type: scalar
    target_hinge_angle:
      binds_to:
      - mode: replace
        path: guards.goal_reached.threshold
      default: 0.524
      range:
      - 0.3
      - 0.6
      type: scalar
  retries:
    max_attempts: 2
    strategy: increase_force_limit
  subtask_id: push_door
  target:
    anchor: fixture
    entity: door_panel
    offset:
    - -0.4
    - -0.02
    - 0.35
    offset_along_axis:
      axis: task_goal_direction
      distance: 0.3
      mode: add_to_offset
      sign: positive
    orientation:
      mode: keep_current
    source: yaml
    tolerance: 0.05
  termination: time_limit
  type: push
skill: door_push
skill_type: arm
subtasks:
- anchor: fixture
  id: approach_handle
  metric: distance
  offset:
  - -0.4
  - -0.02
  - 0.35
  target_entity: tcp
  weight: 0.3
- anchor: fixture
  id: push_door
  metric: hinge_angle
  target_entity: hinge
  weight: 0.7
