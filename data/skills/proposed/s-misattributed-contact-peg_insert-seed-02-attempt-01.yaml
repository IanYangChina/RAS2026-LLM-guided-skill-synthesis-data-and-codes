dsl_version: 2
phases:
- control: position_control
  generator: linear_cartesian
  id: approach_entry
  parameters:
    approach_offset_z:
      binds_to:
      - mode: add
        path: target.offset.z
      default: 0.03
      range:
      - 0.01
      - 0.1
      type: scalar
    approach_tolerance:
      binds_to:
      - mode: replace
        path: termination.pose_tolerance
      default: 0.02
      range:
      - 0.005
      - 0.05
      type: scalar
  subtask_id: approach
  target:
    anchor: task_goal
    offset:
    - 0
    - 0
    - 0.03
    orientation:
      align_with: insertion_axis
      axis:
      - 0
      - 0
      - 1
      mode: align_axis
      tolerance: 0.05
    source: yaml
    tolerance: 0.02
  termination: pose_tolerance
  type: approach
- control: impedance_control
  generator: linear_cartesian
  guards:
  - args: {}
    id: force_safe
    on_failure: abort
    predicate: force_below
    threshold: 40.0
    when: during_phase
  id: descend_insert
  parameters:
    force_threshold:
      binds_to:
      - mode: replace
        path: termination.force_threshold
      default: 20.0
      range:
      - 5.0
      - 40.0
      type: scalar
    insertion_depth:
      binds_to:
      - mode: replace
        path: target.offset_along_axis.distance
      default: 0.055
      range:
      - 0.02
      - 0.08
      type: scalar
    insertion_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.02
      range:
      - 0.01
      - 0.05
      type: scalar
  retries:
    max_attempts: 2
    offset:
    - 0.005
    - 0.005
    - 0.0
    strategy: offset_target
  subtask_id: insertion
  target:
    anchor: task_goal
    offset:
    - 0
    - 0
    - 0.0
    offset_along_axis:
      axis: insertion_axis
      distance: 0.055
      mode: add_to_offset
      sign: positive
    orientation:
      align_with: insertion_axis
      axis:
      - 0
      - 0
      - 1
      mode: align_axis
      tolerance: 0.05
    source: yaml
  termination: force_exceeded
  type: insert
skill: peg_insert
subtasks:
- anchor: goal
  id: approach
  metric: distance
  offset:
  - 0
  - 0
  - 0.05
  target_entity: tcp
  weight: 0.3
- anchor: goal
  id: insertion
  metric: distance
  offset:
  - 0
  - 0
  - 0.0
  target_entity: object
  weight: 0.7
