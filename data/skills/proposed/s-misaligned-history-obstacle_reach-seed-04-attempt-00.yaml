dsl_version: 2
phases:
- control: position_control
  generator: linear_cartesian
  guards:
  - args: {}
    id: collision_guard
    on_failure: abort
    predicate: contact_detected
    threshold: 1.0
    when: during_phase
  id: lift_above
  parameters:
    approach_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.15
      range:
      - 0.05
      - 0.3
      type: scalar
    approach_x:
      binds_to:
      - mode: replace
        path: target.offset.x
      default: 0.5
      range:
      - 0.48
      - 0.55
      type: scalar
    approach_z:
      binds_to:
      - mode: replace
        path: target.offset.z
      default: 0.5
      range:
      - 0.45
      - 0.6
      type: scalar
  subtask_id: above_obstacle
  target:
    anchor: world
    offset:
    - 0.5
    - 0.0
    - 0.5
    orientation:
      mode: keep_current
    tolerance: 0.015
  termination: pose_tolerance
  type: approach
- control: position_control
  generator: linear_cartesian
  id: descend_to_goal
  parameters:
    descend_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.08
      range:
      - 0.02
      - 0.2
      type: scalar
  subtask_id: reach_goal
  target:
    anchor: task_goal
    offset:
    - 0.0
    - 0.0
    - 0.0
    orientation:
      mode: keep_current
    tolerance: 0.015
  termination: pose_tolerance
  type: descend
skill: obstacle_reach
skill_type: arm_gripper
subtasks:
- anchor: world
  id: above_obstacle
  metric: distance
  offset:
  - 0.5
  - 0.0
  - 0.5
  target_entity: tcp
  weight: 0.3
- anchor: goal
  id: reach_goal
  metric: goal_progress
  offset:
  - 0.0
  - 0.0
  - 0.0
  target_entity: tcp
  weight: 0.7
