dsl_version: 2
phases:
- control: position_control
  generator: arc_cartesian
  guards:
  - args: {}
    id: approach_pose_guard
    on_failure: retry
    predicate: pose_within_tolerance
    threshold: 0.03
    when: after_phase
  id: approach_1
  parameters:
    generator_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.1
      range:
      - 0.05
      - 0.2
      type: scalar
    pose_tolerance:
      binds_to:
      - mode: replace
        path: termination.pose_tolerance
      default: 0.02
      range:
      - 0.01
      - 0.05
      type: scalar
  retries:
    max_attempts: 1
    strategy: reduce_speed
  subtask_id: approach
  target:
    anchor: task_object
    entity: tcp
    offset:
    - 0.0
    - 0.08
    - 0.1
    orientation:
      mode: keep_current
    source: yaml
    tolerance: 0.02
  termination: pose_tolerance
  type: approach
- control: force_threshold_switch
  generator: linear_cartesian
  guards:
  - args: {}
    id: contact_guard
    on_failure: abort
    predicate: force_below
    threshold: 20.0
    when: during_phase
  id: contact_1
  parameters:
    contact_speed:
      binds_to:
      - mode: replace
        path: termination.pose_tolerance
      default: 0.02
      range:
      - 0.005
      - 0.05
      type: scalar
    force_threshold:
      binds_to:
      - mode: replace
        path: termination.force_threshold
      default: 2.0
      range:
      - 0.5
      - 5.0
      type: scalar
  subtask_id: contact
  target:
    anchor: task_object
    entity: tcp
    offset:
    - 0.0
    - 0.03
    - 0.005
    orientation:
      mode: keep_current
    source: yaml
    tolerance: 0.02
  termination: force_exceeded
  type: contact
- control: impedance_control
  generator: impedance_motion
  guards:
  - args: {}
    id: push_force_guard
    on_failure: abort
    predicate: force_below
    threshold: 25.0
    when: during_phase
  id: push_1
  parameters:
    push_depth:
      binds_to:
      - mode: replace
        path: target.offset_along_axis.distance
      default: 0.08
      range:
      - 0.01
      - 0.15
      type: scalar
    push_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.04
      range:
      - 0.01
      - 0.1
      type: scalar
  subtask_id: push
  target:
    anchor: task_goal
    entity: tcp
    offset:
    - 0.0
    - 0.03
    - 0.0
    offset_along_axis:
      axis: push_direction
      distance: 0.08
      mode: add_to_offset
      sign: positive
    orientation:
      align_with: push_direction
      axis:
      - 0
      - 0
      - 1
      mode: align_axis
      tolerance: 0.05
    source: yaml
    tolerance: 0.02
  termination: pose_tolerance
  type: push
- control: position_control
  generator: linear_cartesian
  guards:
  - args: {}
    id: retract_pose_guard
    on_failure: retry
    predicate: pose_within_tolerance
    threshold: 0.06
    when: after_phase
  id: retract_1
  parameters:
    retract_height:
      binds_to:
      - mode: replace
        path: target.offset_along_axis.distance
      default: 0.15
      range:
      - 0.05
      - 0.25
      type: scalar
    retract_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.1
      range:
      - 0.05
      - 0.2
      type: scalar
  retries:
    max_attempts: 1
    strategy: reduce_speed
  target:
    anchor: current_tcp
    offset:
    - 0.0
    - 0.0
    - 0.0
    offset_along_axis:
      axis: world_z
      distance: 0.15
      mode: add_to_offset
      sign: positive
    orientation:
      mode: keep_current
    source: yaml
    tolerance: 0.05
  termination: pose_tolerance
  type: retract
skill: push_to_goal
subtasks:
- anchor: object
  id: approach
  metric: distance
  offset:
  - 0.0
  - 0.08
  - 0.0
  target_entity: tcp
  weight: 1.0
- anchor: object
  id: contact
  metric: distance
  offset:
  - 0.0
  - 0.03
  - 0.0
  target_entity: tcp
  weight: 1.0
- anchor: goal
  id: push
  metric: goal_progress
  offset:
  - 0.0
  - 0.03
  - 0.0
  target_entity: tcp
  weight: 1.0
