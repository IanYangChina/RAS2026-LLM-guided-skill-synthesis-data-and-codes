dsl_version: 2
phases:
- control: position_control
  generator: linear_cartesian
  id: approach_above
  parameters:
    approach_speed:
      binds_to:
      - mode: add
        path: generator.speed
      default: 0.08
      range:
      - 0.04
      - 0.15
      type: scalar
  subtask_id: reach_above_socket
  target:
    anchor: fixture
    offset:
    - 0.0
    - 0.0
    - 0.12
    orientation:
      align_with: world_z
      axis:
      - 0.0
      - 0.0
      - 1.0
      mode: align_axis
      tolerance: 0.05
    tolerance: 0.02
  termination:
    pose_tolerance: 0.02
  type: approach
- control: impedance_control
  generator: linear_cartesian
  id: descend_to_entry
  parameters:
    entry_offset_z:
      binds_to:
      - mode: add
        path: target.offset.z
      default: 0.055
      range:
      - 0.04
      - 0.07
      type: scalar
    entry_speed:
      binds_to:
      - mode: add
        path: generator.speed
      default: 0.03
      range:
      - 0.01
      - 0.06
      type: scalar
    force_threshold:
      binds_to:
      - mode: add
        path: termination.force_threshold
      default: 5.0
      range:
      - 3.0
      - 15.0
      type: scalar
  subtask_id: insert_peg
  target:
    anchor: fixture
    offset:
    - 0.0
    - 0.0
    - 0.055
    orientation:
      align_with: channel_axis
      axis:
      - 0.0
      - 0.0
      - -1.0
      mode: align_axis
      tolerance: 0.05
    tolerance: 0.01
  termination:
    force_exceeded: true
    force_threshold: 5.0
  type: descend
- control: impedance_control
  generator: linear_cartesian
  id: insert_full
  parameters:
    insert_distance:
      binds_to:
      - mode: add
        path: target.offset_along_axis.distance
      default: 0.055
      range:
      - 0.04
      - 0.065
      type: scalar
    insert_speed:
      binds_to:
      - mode: add
        path: generator.speed
      default: 0.02
      range:
      - 0.01
      - 0.05
      type: scalar
  subtask_id: insert_peg
  target:
    anchor: fixture
    offset:
    - 0.0
    - 0.0
    - 0.0
    offset_along_axis:
      axis: channel_axis
      distance: 0.055
      mode: replace_offset_projection
      sign: positive
    orientation:
      align_with: channel_axis
      axis:
      - 0.0
      - 0.0
      - -1.0
      mode: align_axis
      tolerance: 0.05
    tolerance: 0.02
  termination:
    time_limit: true
  type: push
skill: peg_insert
skill_type: arm_gripper
subtasks:
- anchor: fixture
  id: reach_above_socket
  metric: distance
  offset:
  - 0.0
  - 0.0
  - 0.12
  target_entity: tcp
  weight: 0.3
- anchor: fixture
  id: insert_peg
  metric: goal_progress
  offset:
  - 0.0
  - 0.0
  - 0.0
  target_entity: tcp
  weight: 0.7
