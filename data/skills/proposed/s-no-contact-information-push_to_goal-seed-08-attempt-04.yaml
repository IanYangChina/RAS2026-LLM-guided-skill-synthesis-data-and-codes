dsl_version: 2
phases:
- control: position_control
  generator: linear_cartesian
  id: approach_1
  parameters:
    approach_speed:
      binds_to:
      - mode: add
        path: generator.speed
      default: 0.1
      range:
      - 0.01
      - 0.2
      type: scalar
    approach_tolerance:
      binds_to:
      - mode: replace
        path: termination.pose_tolerance
      default: 0.02
      range:
      - 0.005
      - 0.05
      type: scalar
  subtask_id: reach_object
  target:
    anchor: task_object
    offset:
    - 0.0
    - 0.0
    - 0.1
    orientation:
      mode: keep_current
    source: yaml
    tolerance: 0.02
  termination: pose_tolerance
  type: approach
- control: force_threshold_switch
  generator: linear_cartesian
  id: descend_1
  parameters:
    descend_speed:
      binds_to:
      - mode: add
        path: generator.speed
      default: 0.02
      range:
      - 0.005
      - 0.05
      type: scalar
    force_threshold:
      binds_to:
      - mode: replace
        path: termination.force_threshold
      default: 3.0
      range:
      - 1.0
      - 10.0
      type: scalar
  subtask_id: reach_object
  target:
    anchor: task_object
    offset:
    - 0.0
    - 0.0
    - 0.0
    orientation:
      mode: keep_current
    source: yaml
  termination: force_exceeded
  type: descend
- control: admittance_control
  generator: linear_cartesian
  guards:
  - args: {}
    id: push_progress
    on_failure: retry
    predicate: object_progress
    threshold: 0.5
    when: after_phase
  id: push_1
  parameters:
    push_distance:
      binds_to:
      - mode: replace
        path: target.offset_along_axis.distance
      default: 0.2
      range:
      - 0.1
      - 0.3
      type: scalar
    push_progress_threshold:
      binds_to:
      - mode: replace
        path: guards.push_progress.threshold
      default: 0.5
      range:
      - 0.3
      - 0.9
      type: scalar
    push_speed:
      binds_to:
      - mode: add
        path: generator.speed
      default: 0.03
      range:
      - 0.01
      - 0.1
      type: scalar
    push_time_limit:
      binds_to:
      - mode: replace
        path: duration.max_time
      default: 2.0
      range:
      - 1.0
      - 5.0
      type: scalar
  retries:
    max_attempts: 1
    offset:
    - 0.0
    - 0.01
    - 0.0
    strategy: offset_target
  subtask_id: push_to_goal
  target:
    anchor: task_object
    offset:
    - 0.0
    - 0.0
    - 0.0
    offset_along_axis:
      axis: task_goal_direction
      distance: 0.2
      mode: add_to_offset
      sign: positive
    orientation:
      mode: keep_current
    source: yaml
  termination: time_limit
  type: push
skill: push_to_goal
subtasks:
- anchor: object
  id: reach_object
  metric: distance
  offset:
  - 0.0
  - 0.0
  - 0.05
  target_entity: tcp
  weight: 0.3
- anchor: goal
  id: push_to_goal
  metric: goal_progress
  offset:
  - 0.0
  - 0.0
  - 0.0
  target_entity: object
  weight: 0.7
