dsl_version: 2
phases:
- control: position_control
  generator: linear_cartesian
  id: align_above
  parameters:
    align_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.05
      range:
      - 0.01
      - 0.1
      type: scalar
  subtask_id: approach
  target:
    anchor: task_object
    entity: peg
    offset:
    - 0.0
    - 0.04
    - 0.1
    source: yaml
  termination: pose_tolerance
  type: align
- control: position_control
  generator: linear_cartesian
  id: approach_contact
  parameters:
    contact_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.02
      range:
      - 0.005
      - 0.05
      type: scalar
  target:
    anchor: task_object
    entity: peg
    offset:
    - 0.0
    - 0.02
    - 0.04
    source: yaml
  termination: pose_tolerance
  type: descend
- control: impedance_control
  generator: linear_cartesian
  guards:
  - args: {}
    id: force_limit
    on_failure: abort
    predicate: force_below
    threshold: 40.0
    when: during_phase
  id: push_insert
  orientation:
    align_with: channel_axis
    axis:
    - 0
    - 0
    - 1
    mode: align_axis
    tolerance: 0.2
  parameters:
    push_depth_param:
      binds_to:
      - mode: replace
        path: target.offset.y
      default: -0.08
      range:
      - -0.2
      - -0.05
      type: scalar
    push_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.02
      range:
      - 0.005
      - 0.05
      type: scalar
  subtask_id: push
  target:
    anchor: world
    offset:
    - 0.5
    - -0.08
    - 0.04
    source: yaml
  termination: pose_tolerance
  type: push
- control: position_control
  generator: linear_cartesian
  id: retract_up
  parameters:
    retract_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.05
      range:
      - 0.01
      - 0.1
      type: scalar
  target:
    anchor: current_tcp
    offset:
    - 0.0
    - 0.0
    - 0.1
    source: yaml
  termination: pose_tolerance
  type: retract
skill: peg_channel
skill_type: arm
