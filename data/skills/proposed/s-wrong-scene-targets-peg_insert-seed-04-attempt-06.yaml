dsl_version: 2
phases:
- control: position_control
  generator: linear_cartesian
  guards:
  - args: {}
    id: pose_ok
    on_failure: continue
    predicate: pose_within_tolerance
    threshold: 0.02
    when: after_phase
  id: push_1
  orientation:
    align_with: world_z
    axis:
    - 0
    - 0
    - -1
    mode: align_axis
    tolerance: 0.08
  parameters:
    approach_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.05
      range:
      - 0.02
      - 0.1
      type: scalar
  subtask_id: reach_socket_entry
  target:
    anchor: task_object
    entity: attachment_site
    offset:
    - 0.0
    - 0.0
    - 0.04
    source: yaml
    tolerance: 0.015
  termination: pose_tolerance
  type: push
- control: impedance_control
  generator: impedance_motion
  guards:
  - args: {}
    id: force_guard
    on_failure: abort
    predicate: force_below
    threshold: 40.0
    when: during_phase
  id: insert_1
  orientation:
    align_with: channel_axis
    axis:
    - 0
    - 0
    - -1
    mode: align_axis
    tolerance: 0.05
  parameters:
    insertion_depth:
      binds_to:
      - mode: replace
        path: target.offset_along_axis.distance
      default: 0.06
      range:
      - 0.02
      - 0.1
      type: scalar
    insertion_force:
      binds_to:
      - mode: replace
        path: termination.force_threshold
      default: 12.0
      range:
      - 5.0
      - 25.0
      type: scalar
    insertion_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.015
      range:
      - 0.005
      - 0.04
      type: scalar
  retries:
    max_attempts: 2
    offset:
    - 0.0
    - 0.0
    - 0.0
    strategy: reduce_speed
  subtask_id: insertion_progress
  target:
    anchor: task_object
    entity: attachment_site
    offset:
    - 0.0
    - 0.0
    - -0.055
    offset_along_axis:
      axis: channel_axis
      distance: 0.06
      mode: replace_offset_projection
      sign: negative
    source: yaml
    tolerance: 0.01
  termination: force_exceeded
  type: insert
skill: peg_insert
skill_type: arm_gripper
subtasks:
- anchor: object
  id: reach_socket_entry
  metric: distance
  offset:
  - 0.0
  - 0.0
  - 0.0
  target_entity: tcp
  weight: 0.5
- anchor: goal
  id: insertion_progress
  metric: goal_progress
  offset:
  - 0.0
  - 0.0
  - 0.0
  target_entity: tcp
  weight: 0.7
