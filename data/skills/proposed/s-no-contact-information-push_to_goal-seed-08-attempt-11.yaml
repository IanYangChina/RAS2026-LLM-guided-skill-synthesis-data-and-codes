dsl_version: 2
phases:
- control: position_control
  generator: linear_cartesian
  id: approach_1
  parameters:
    approach_speed:
      binds_to:
      - mode: add
        path: generator.speed
      default: 0.1
      range:
      - 0.01
      - 0.2
      type: scalar
    approach_tolerance:
      binds_to:
      - mode: replace
        path: termination.pose_tolerance
      default: 0.02
      range:
      - 0.005
      - 0.05
      type: scalar
    lateral_offset_y:
      binds_to:
      - mode: replace
        path: target.offset.y
      default: 0.03
      range:
      - 0.01
      - 0.06
      type: scalar
  retries:
    max_attempts: 0
    strategy: repeat
  subtask_id: reach_object_side
  target:
    anchor: task_object
    offset:
    - 0.0
    - 0.03
    - 0.08
    orientation:
      mode: keep_current
    source: yaml
    tolerance: 0.02
  termination: pose_tolerance
  type: approach
- control: position_control
  generator: linear_cartesian
  id: descend_to_side
  parameters:
    descend_speed:
      binds_to:
      - mode: add
        path: generator.speed
      default: 0.02
      range:
      - 0.005
      - 0.05
      type: scalar
    descend_tolerance:
      binds_to:
      - mode: replace
        path: termination.pose_tolerance
      default: 0.01
      range:
      - 0.002
      - 0.02
      type: scalar
    lateral_offset_y:
      binds_to:
      - mode: replace
        path: target.offset.y
      default: 0.03
      range:
      - 0.01
      - 0.06
      type: scalar
  retries:
    max_attempts: 0
    strategy: repeat
  subtask_id: reach_object_side
  target:
    anchor: task_object
    offset:
    - 0.0
    - 0.03
    - 0.025
    orientation:
      mode: keep_current
    source: yaml
    tolerance: 0.01
  termination: pose_tolerance
  type: descend
- control: force_threshold_switch
  generator: linear_cartesian
  id: align_side_contact
  parameters:
    align_speed:
      binds_to:
      - mode: add
        path: generator.speed
      default: 0.015
      range:
      - 0.005
      - 0.05
      type: scalar
    side_contact_force:
      binds_to:
      - mode: replace
        path: termination.force_threshold
      default: 5.0
      range:
      - 1.0
      - 10.0
      type: scalar
  retries:
    max_attempts: 1
    offset:
    - 0.0
    - -0.005
    - 0.0
    strategy: offset_target
  subtask_id: reach_object_side
  target:
    anchor: task_object
    offset:
    - 0.0
    - 0.0
    - 0.025
    orientation:
      mode: keep_current
    source: yaml
  termination: force_exceeded
  type: align
- control: admittance_control
  generator: linear_cartesian
  id: push_1
  parameters:
    push_distance:
      binds_to:
      - mode: replace
        path: target.offset_along_axis.distance
      default: 0.25
      range:
      - 0.1
      - 0.35
      type: scalar
    push_duration:
      binds_to:
      - mode: replace
        path: duration.max_time
      default: 1500
      range:
      - 500.0
      - 3000.0
      type: scalar
    push_speed:
      binds_to:
      - mode: add
        path: generator.speed
      default: 0.06
      range:
      - 0.01
      - 0.2
      type: scalar
  retries:
    max_attempts: 1
    offset:
    - 0.0
    - 0.005
    - 0.0
    strategy: offset_target
  subtask_id: push_to_goal
  target:
    anchor: task_object
    offset:
    - 0.0
    - 0.0
    - 0.0
    offset_along_axis:
      axis: task_goal_direction
      distance: 0.25
      mode: replace_offset_projection
      sign: positive
    orientation:
      mode: keep_current
    source: yaml
    tolerance: 0.05
  termination: time_limit
  type: push
skill: push_to_goal
subtasks:
- anchor: object
  id: reach_object_side
  metric: distance
  offset:
  - 0.0
  - 0.0
  - 0.025
  target_entity: tcp
  weight: 0.3
- anchor: goal
  id: push_to_goal
  metric: goal_progress
  target_entity: object
  weight: 0.7
