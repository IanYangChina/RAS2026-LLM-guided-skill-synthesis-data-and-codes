dsl_version: 2
phases:
- control: position_control
  generator: linear_cartesian
  id: approach_object
  parameters:
    approach_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.08
      range:
      - 0.02
      - 0.15
      type: scalar
    approach_tolerance:
      binds_to:
      - mode: replace
        path: termination.pose_tolerance
      default: 0.02
      range:
      - 0.005
      - 0.05
      type: scalar
  subtask_id: approach_grasp
  target:
    anchor: task_object
    entity: grasp_target
    offset:
    - 0.0
    - 0.0
    - 0.1
    orientation:
      mode: keep_current
    source: yaml
  termination: pose_tolerance
  type: approach
- control: position_control
  generator: linear_cartesian
  id: descend_object
  parameters:
    descend_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.04
      range:
      - 0.01
      - 0.08
      type: scalar
  subtask_id: approach_grasp
  target:
    anchor: task_object
    entity: grasp_target
    offset:
    - 0.0
    - 0.0
    - 0.02
    orientation:
      mode: keep_current
    source: yaml
  termination: pose_tolerance
  type: descend
- control: position_control
  end_effector_action: force_grasp
  generator: null
  id: grasp
  parameters: {}
  subtask_id: approach_grasp
  termination: grasp_success
  type: grasp
- control: position_control
  generator: linear_cartesian
  guards:
  - args: {}
    id: grasp_check
    on_failure: abort
    predicate: bilateral_grasp
    threshold: 0.5
    when: before_phase
  id: lift_object
  parameters:
    lift_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.05
      range:
      - 0.02
      - 0.1
      type: scalar
  subtask_id: lift_clearance
  target:
    anchor: task_object
    entity: grasp_target
    offset:
    - 0.0
    - 0.0
    - 0.2
    orientation:
      mode: keep_current
    source: yaml
  termination: pose_tolerance
  type: lift
- control: position_control
  generator: arc_cartesian
  id: transport_place
  parameters:
    arc_height:
      binds_to:
      - mode: replace
        path: generator.arc_height
      default: 0.12
      range:
      - 0.05
      - 0.25
      type: scalar
    transport_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.08
      range:
      - 0.02
      - 0.15
      type: scalar
  subtask_id: transport_goal
  target:
    anchor: task_goal
    entity: place_target
    offset:
    - 0.0
    - 0.0
    - 0.1
    orientation:
      mode: keep_current
    source: yaml
  termination: pose_tolerance
  type: approach
- control: position_control
  generator: linear_cartesian
  id: descend_place
  parameters:
    place_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.04
      range:
      - 0.01
      - 0.08
      type: scalar
  subtask_id: place_goal
  target:
    anchor: task_goal
    entity: place_target
    offset:
    - 0.0
    - 0.0
    - 0.0
    orientation:
      mode: keep_current
    source: yaml
  termination: pose_tolerance
  type: descend
skill: grasp_place
skill_type: arm_gripper
subtasks:
- anchor: object
  id: approach_grasp
  metric: distance
  offset:
  - 0.0
  - 0.0
  - 0.1
  target_entity: tcp
  weight: 0.2
- anchor: object
  id: lift_clearance
  metric: distance
  offset:
  - 0.0
  - 0.0
  - 0.2
  target_entity: object
  weight: 0.2
- anchor: goal
  id: transport_goal
  metric: distance
  offset:
  - 0.0
  - 0.0
  - 0.1
  target_entity: tcp
  weight: 0.3
- anchor: goal
  id: place_goal
  metric: distance
  offset:
  - 0.0
  - 0.0
  - 0.0
  target_entity: object
  weight: 0.3
