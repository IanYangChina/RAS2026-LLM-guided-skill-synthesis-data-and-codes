dsl_version: 2
phases:
- control: position_control
  generator: arc_cartesian
  id: approach_1
  parameters:
    approach_arc_height:
      binds_to:
      - mode: replace
        path: generator.arc_height
      default: 0.08
      range:
      - 0.04
      - 0.18
      type: scalar
    approach_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.2
      range:
      - 0.1
      - 0.5
      type: scalar
  retries:
    max_attempts: 0
    strategy: repeat
  subtask_id: reach_standoff
  target:
    anchor: task_object
    entity: push_box
    offset:
    - 0.0
    - 0.0
    - 0.08
    orientation:
      mode: none
    source: yaml
    tolerance: 0.01
  termination: pose_tolerance
  type: approach
- control: position_control
  generator: linear_cartesian
  id: descend_1
  parameters:
    behind_distance:
      binds_to:
      - mode: replace
        path: target.offset_along_axis.distance
      default: 0.05
      range:
      - 0.02
      - 0.08
      type: scalar
    descend_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.15
      range:
      - 0.05
      - 0.3
      type: scalar
  retries:
    max_attempts: 0
    strategy: repeat
  subtask_id: reach_contact
  target:
    anchor: task_object
    entity: push_box
    offset:
    - 0.0
    - 0.0
    - 0.0
    offset_along_axis:
      axis: task_goal_direction
      distance: 0.05
      mode: replace_offset_projection
      sign: negative
    orientation:
      align_with: task_goal_direction
      axis:
      - 0.0
      - 0.0
      - -1.0
      mode: align_axis
      tolerance: 0.2
    source: yaml
    tolerance: 0.01
  termination: pose_tolerance
  type: descend
- control: impedance_control
  generator: linear_cartesian
  id: push_1
  parameters:
    push_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.2
      range:
      - 0.1
      - 0.5
      type: scalar
    push_tolerance:
      binds_to:
      - mode: replace
        path: termination.pose_tolerance
      default: 0.02
      range:
      - 0.01
      - 0.05
      type: scalar
  retries:
    max_attempts: 0
    strategy: repeat
  subtask_id: push_complete
  target:
    anchor: task_goal
    entity: goal_marker
    offset:
    - 0.0
    - 0.0
    - 0.0
    orientation:
      align_with: task_goal_direction
      axis:
      - 0.0
      - 0.0
      - -1.0
      mode: align_axis
      tolerance: 0.2
    source: yaml
    tolerance: 0.02
  termination: pose_tolerance
  type: push
skill: push_to_goal
subtasks:
- anchor: object
  id: reach_standoff
  offset:
  - 0.0
  - 0.0
  - 0.08
  weight: 0.2
- anchor: object
  id: reach_contact
  weight: 0.3
- id: push_complete
  target_entity: object
  weight: 0.5
