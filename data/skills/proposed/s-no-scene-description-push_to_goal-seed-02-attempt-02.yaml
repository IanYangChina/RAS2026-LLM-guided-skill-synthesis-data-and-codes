dsl_version: 2
phases:
- control: position_control
  generator: arc_cartesian
  guards:
  - args: {}
    id: no_force
    on_failure: continue
    predicate: force_below
    threshold: 5.0
    when: during_phase
  id: approach_high
  parameters:
    approach_y_behind:
      binds_to:
      - mode: replace
        path: target.offset.y
      default: 0.08
      range:
      - 0.05
      - 0.15
      type: scalar
    approach_z_high:
      binds_to:
      - mode: replace
        path: target.offset.z
      default: 0.1
      range:
      - 0.08
      - 0.15
      type: scalar
    arc_height:
      binds_to:
      - mode: replace
        path: generator.arc_height
      default: 0.1
      range:
      - 0.05
      - 0.15
      type: scalar
  retries:
    max_attempts: 0
  subtask_id: approach_pre_contact
  target:
    anchor: task_object
    offset:
    - 0.0
    - 0.0
    - 0.0
    orientation:
      mode: keep_current
    tolerance: 0.01
  termination: pose_tolerance
  type: approach
- control: force_threshold_switch
  generator: linear_cartesian
  guards:
  - args: {}
    id: early_contact
    on_failure: continue
    predicate: contact_detected
    threshold: 1.0
    when: during_phase
  id: contact_engage
  parameters:
    contact_force_threshold:
      binds_to:
      - mode: replace
        path: termination.force_threshold
      default: 10.0
      range:
      - 3.0
      - 18.0
      type: scalar
    contact_offset_y:
      binds_to:
      - mode: replace
        path: target.offset.y
      default: 0.03
      range:
      - -0.01
      - 0.06
      type: scalar
    contact_offset_z:
      binds_to:
      - mode: replace
        path: target.offset.z
      default: 0.025
      range:
      - 0.0
      - 0.04
      type: scalar
  retries:
    max_attempts: 1
    offset:
    - 0.0
    - 0.005
    - 0.0
    strategy: offset_target
  subtask_id: make_contact
  target:
    anchor: task_object
    offset:
    - 0.0
    - 0.0
    - 0.0
    orientation:
      mode: keep_current
    tolerance: 0.01
  termination: force_exceeded
  type: contact
- control: impedance_control
  generator: linear_cartesian
  guards:
  - args: {}
    id: object_near_goal
    on_failure: continue
    predicate: object_progress
    threshold: 0.02
    when: during_phase
  - args: {}
    id: force_high
    on_failure: retry
    predicate: force_below
    threshold: 20.0
    when: during_phase
  id: push_toward_goal
  parameters:
    impedance_stiffness:
      binds_to: []
      default: 150.0
      range:
      - 50.0
      - 300.0
      type: scalar
    max_push_time:
      binds_to:
      - mode: replace
        path: duration.max_time
      default: 10.0
      range:
      - 6.0
      - 15.0
      type: scalar
    push_distance:
      binds_to:
      - mode: replace
        path: target.offset_along_axis.distance
      default: 0.25
      range:
      - 0.15
      - 0.35
      type: scalar
  retries:
    max_attempts: 2
    offset:
    - 0.0
    - 0.0
    - 0.0
    strategy: reduce_speed
  subtask_id: push_to_goal
  target:
    anchor: current_tcp
    offset:
      x: 0.0
      y: 0.0
      z: 0.0
    offset_along_axis:
      axis: task_goal_direction
      distance: 0.25
      mode: add_to_offset
      sign: positive
    orientation:
      mode: keep_current
  termination: time_limit
  type: push
skill: push_to_goal
skill_type: arm_gripper
subtasks:
- anchor: object
  id: approach_pre_contact
  metric: distance
  offset:
  - 0.0
  - 0.08
  - 0.1
  target_entity: tcp
  weight: 0.3
- anchor: object
  id: make_contact
  metric: distance
  offset:
  - 0.0
  - 0.03
  - 0.025
  target_entity: tcp
  weight: 0.1
- anchor: goal
  id: push_to_goal
  metric: goal_progress
  target_entity: object
  weight: 0.6
