dsl_version: 2
phases:
- control: position_control
  generator: linear_cartesian
  guards: []
  id: approach_1
  parameters:
    speed:
      binds_to:
      - mode: add
        path: generator.speed
      default: 0.1
      range:
      - 0.05
      - 0.2
      type: scalar
  retries:
    max_attempts: 0
  subtask_id: approach_peg
  target:
    anchor: task_object
    entity: peg
    offset:
    - 0.0
    - 0.02
    - 0.0
    orientation:
      mode: keep_current
    source: yaml
    tolerance: 0.02
  termination: pose_tolerance
  type: approach
- control: impedance_control
  generator: linear_cartesian
  guards:
  - args: {}
    id: force_safe
    predicate: force_below
    threshold: 30.0
    when: during_phase
  id: push_1
  parameters:
    force_limit:
      binds_to:
      - mode: add
        path: guards.force_safe.threshold
      default: 30.0
      range:
      - 10.0
      - 40.0
      type: scalar
    max_time:
      binds_to:
      - mode: add
        path: duration.max_time
      default: 5.0
      range:
      - 2.0
      - 10.0
      type: scalar
    push_distance:
      binds_to:
      - mode: scale
        path: target.offset_along_axis.distance
      default: 0.16
      range:
      - 0.12
      - 0.2
      type: scalar
    push_speed:
      binds_to:
      - mode: add
        path: generator.speed
      default: 0.03
      range:
      - 0.01
      - 0.05
      type: scalar
  retries:
    max_attempts: 2
    strategy: reduce_speed
  subtask_id: insert_peg
  target:
    anchor: task_object
    entity: peg
    offset:
    - 0.0
    - 0.02
    - 0.0
    offset_along_axis:
      axis: channel_axis
      distance: 0.16
      mode: add_to_offset
      sign: positive
    orientation:
      align_with: channel_axis
      axis:
      - 0.0
      - 1.0
      - 0.0
      mode: align_axis
      tolerance: 0.2
    source: yaml
    tolerance: 0.05
  termination: time_limit
  type: push
- control: position_control
  generator: linear_cartesian
  guards: []
  id: retract_1
  parameters:
    retract_height:
      binds_to:
      - mode: add
        path: target.offset.z
      default: 0.12
      range:
      - 0.08
      - 0.2
      type: scalar
    retract_speed:
      binds_to:
      - mode: add
        path: generator.speed
      default: 0.1
      range:
      - 0.05
      - 0.15
      type: scalar
  retries:
    max_attempts: 0
  target:
    anchor: task_object
    entity: peg
    offset:
    - 0.0
    - 0.0
    - 0.1
    orientation:
      mode: keep_current
    source: yaml
    tolerance: 0.02
  termination: pose_tolerance
  type: retract
skill: peg_channel
subtasks:
- anchor: object
  id: approach_peg
  metric: distance
  offset:
  - 0.0
  - 0.02
  - 0.0
  target_entity: tcp
  weight: 0.3
- anchor: goal
  id: insert_peg
  metric: goal_progress
  offset:
  - 0.0
  - 0.0
  - 0.0
  target_entity: object
  weight: 0.7
