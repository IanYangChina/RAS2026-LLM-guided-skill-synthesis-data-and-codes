dsl_version: 2
phases:
- control: position_control
  generator: impedance_motion
  id: rotate_1
  parameters:
    rotate_tolerance:
      binds_to:
      - mode: replace
        path: termination.pose_tolerance
      default: 0.03
      range:
      - 0.01
      - 0.1
      type: scalar
  subtask_id: approach_hole
  target:
    anchor: current_tcp
    offset:
    - 0
    - 0
    - 0
    orientation:
      align_with: world_z
      axis:
      - 0
      - 0
      - -1
      mode: align_axis
      tolerance: 0.05
    source: yaml
  termination: pose_tolerance
  type: rotate
- control: position_control
  generator: arc_cartesian
  id: retract_1
  parameters:
    retract_height:
      binds_to:
      - mode: replace
        path: target.offset.z
      default: 0.1
      range:
      - 0.05
      - 0.2
      type: scalar
  subtask_id: approach_hole
  target:
    anchor: fixture
    entity: peg_socket
    offset:
    - 0
    - 0
    - 0.08
    orientation:
      mode: keep_current
      tolerance: 0.05
    source: yaml
  termination: pose_tolerance
  type: retract
- control: admittance_control
  generator: linear_cartesian
  id: descend_1
  parameters:
    depth:
      binds_to:
      - mode: replace
        path: target.offset_along_axis.distance
      default: 0.03
      range:
      - 0.01
      - 0.05
      type: scalar
  subtask_id: approach_hole
  target:
    anchor: fixture
    entity: peg_socket
    offset:
    - 0
    - 0
    - 0.0
    offset_along_axis:
      axis: channel_axis
      distance: 0.03
      mode: add_to_offset
      sign: negative
    orientation:
      mode: keep_current
      tolerance: 0.05
    source: yaml
  termination: pose_tolerance
  type: descend
- control: impedance_control
  generator: linear_cartesian
  id: pull_1
  parameters:
    pull_distance:
      binds_to:
      - mode: replace
        path: target.offset_along_axis.distance
      default: 0.05
      range:
      - 0.02
      - 0.1
      type: scalar
  subtask_id: insert_peg
  target:
    anchor: fixture
    entity: peg_socket
    offset:
    - 0
    - 0
    - -0.02
    offset_along_axis:
      axis: channel_axis
      distance: 0.05
      mode: add_to_offset
      sign: negative
    orientation:
      mode: keep_current
      tolerance: 0.05
    source: yaml
  termination: pose_tolerance
  type: pull
skill: peg_insert
subtasks:
- anchor: fixture
  id: approach_hole
  metric: distance
  offset:
  - 0
  - 0
  - 0.08
  target_entity: tcp
  weight: 0.3
- anchor: goal
  id: insert_peg
  metric: goal_progress
  offset:
  - 0
  - 0
  - 0
  target_entity: tcp
  weight: 0.7
