dsl_version: 2
phases:
- control: position_control
  generator: linear_cartesian
  id: approach_1
  parameters:
    approach_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.05
      range:
      - 0.01
      - 0.1
      type: scalar
  subtask_id: approach_peg
  target:
    anchor: task_object
    entity: peg
    offset:
    - 0.0
    - 0.0
    - 0.15
    orientation:
      mode: keep_current
    source: yaml
  termination: pose_tolerance
  type: approach
- control: position_control
  generator: linear_cartesian
  id: descend_1
  parameters:
    descend_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.02
      range:
      - 0.005
      - 0.05
      type: scalar
  subtask_id: approach_peg
  target:
    anchor: task_object
    entity: peg
    offset:
    - 0.0
    - 0.03
    - 0.0
    orientation:
      mode: keep_current
    source: yaml
  termination: pose_tolerance
  type: descend
- control: impedance_control
  generator: linear_cartesian
  id: push_1
  parameters:
    push_max_time:
      binds_to:
      - mode: replace
        path: duration.max_time
      default: 5.0
      range:
      - 2.0
      - 10.0
      type: scalar
    push_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.03
      range:
      - 0.005
      - 0.05
      type: scalar
  subtask_id: push_through_channel
  target:
    anchor: task_goal
    offset:
    - 0.0
    - 0.025
    - 0.0
    orientation:
      mode: keep_current
    source: yaml
  termination: time_limit
  type: push
skill: peg_channel
skill_type: arm_gripper
subtasks:
- anchor: object
  id: approach_peg
  offset:
  - 0.0
  - 0.0
  - 0.15
  target_entity: tcp
  weight: 0.3
- anchor: goal
  id: push_through_channel
  offset:
  - 0.0
  - 0.025
  - 0.0
  target_entity: tcp
  weight: 0.7
