dsl_version: 2
phases:
- control: position_control
  generator: linear_cartesian
  id: approach_peg
  orientation:
    mode: keep_current
  parameters:
    speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.05
      range:
      - 0.01
      - 0.1
      type: scalar
  subtask_id: approach_peg
  target:
    anchor: task_object
    offset:
    - 0.0
    - 0.0
    - 0.05
    source: yaml
    tolerance: 0.005
  termination: pose_tolerance
  type: approach
- control: position_control
  end_effector_action: force_grasp
  generator: null
  guards:
  - args: {}
    id: grasp_success_guard
    on_failure: retry
    predicate: bilateral_grasp
    threshold: 0.0
    when: during_phase
  id: grasp_peg
  retries:
    max_attempts: 2
    offset:
    - 0.0
    - 0.0
    - 0.0
    strategy: offset_target
  target:
    anchor: current_tcp
    source: yaml
  termination: grasp_success
  type: grasp
- control: position_control
  generator: linear_cartesian
  id: lift_peg
  orientation:
    mode: keep_current
  parameters:
    lift_height:
      binds_to:
      - mode: replace
        path: target.offset.z
      default: 0.05
      range:
      - 0.02
      - 0.08
      type: scalar
  target:
    anchor: current_tcp
    offset:
    - 0.0
    - 0.0
    - 0.05
    source: yaml
    tolerance: 0.005
  termination: pose_tolerance
  type: retract
- control: position_control
  generator: linear_cartesian
  id: approach_hole
  orientation:
    align_with: world_z
    axis:
    - 0
    - 0
    - 1
    mode: align_axis
    tolerance: 0.1
  parameters:
    speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.03
      range:
      - 0.01
      - 0.1
      type: scalar
  subtask_id: approach_hole
  target:
    anchor: task_goal
    offset:
    - 0.0
    - 0.0
    - 0.05
    source: yaml
    tolerance: 0.005
  termination: pose_tolerance
  type: approach
- control: impedance_control
  generator: linear_cartesian
  id: align_hole
  orientation:
    align_with: world_z
    axis:
    - 0
    - 0
    - 1
    mode: align_axis
    tolerance: 0.05
  parameters:
    lateral_offset_x:
      binds_to:
      - mode: add
        path: target.offset.x
      default: 0.0
      range:
      - -0.01
      - 0.01
      type: scalar
    lateral_offset_y:
      binds_to:
      - mode: add
        path: target.offset.y
      default: 0.0
      range:
      - -0.01
      - 0.01
      type: scalar
  target:
    anchor: task_goal
    offset:
    - 0.0
    - 0.0
    - 0.02
    source: yaml
    tolerance: 0.003
  termination: pose_tolerance
  type: align
- control: force_threshold_switch
  generator: linear_cartesian
  guards:
  - args: {}
    id: contact_guard
    on_failure: continue
    predicate: contact_detected
    threshold: 0.0
    when: during_phase
  id: descend_insert
  orientation:
    mode: keep_current
  parameters:
    force_threshold:
      binds_to:
      - mode: replace
        path: termination.force_threshold
      default: 15.0
      range:
      - 5.0
      - 30.0
      type: scalar
    insertion_depth:
      binds_to:
      - mode: replace
        path: target.offset_along_axis.distance
      default: 0.06
      range:
      - 0.02
      - 0.15
      type: scalar
  retries:
    max_attempts: 2
    offset:
    - 0.002
    - 0.002
    - 0.0
    strategy: offset_target
  subtask_id: insert_task
  target:
    anchor: task_goal
    offset:
    - 0.0
    - 0.0
    - 0.0
    offset_along_axis:
      axis: world_z
      distance: 0.06
      mode: replace_offset_projection
      sign: negative
    source: yaml
    tolerance: 0.005
  termination: force_exceeded
  type: descend
skill: peg_insert
skill_type: arm_gripper
subtasks:
- anchor: object
  id: approach_peg
  metric: distance
  offset:
  - 0.0
  - 0.0
  - 0.05
  target_entity: tcp
  weight: 0.2
- anchor: goal
  id: approach_hole
  metric: distance
  offset:
  - 0.0
  - 0.0
  - 0.05
  target_entity: tcp
  weight: 0.3
- anchor: goal
  id: insert_task
  metric: distance
  offset:
  - 0.0
  - 0.0
  - 0.0
  target_entity: tcp
  weight: 0.5
