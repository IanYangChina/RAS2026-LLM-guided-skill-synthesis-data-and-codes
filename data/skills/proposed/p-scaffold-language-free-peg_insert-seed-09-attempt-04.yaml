dsl_version: 2
phases:
- control: position_control
  generator: linear_cartesian
  id: approach_1
  orientation:
    mode: keep_current
  parameters:
    lateral_offset_x:
      binds_to:
      - mode: add
        path: target.offset.x
      default: 0.0
      range:
      - -0.02
      - 0.02
      type: scalar
    lateral_offset_y:
      binds_to:
      - mode: add
        path: target.offset.y
      default: 0.0
      range:
      - -0.02
      - 0.02
      type: scalar
    speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.05
      range:
      - 0.01
      - 0.1
      type: scalar
  subtask_id: approach_socket
  target:
    anchor: task_goal
    offset:
    - 0.0
    - 0.0
    - 0.04
    source: yaml
  termination: pose_tolerance
  type: approach
- control: force_threshold_switch
  generator: linear_cartesian
  id: descend_1
  orientation:
    align_with: insertion_axis
    axis:
    - 0.0
    - 0.0
    - 1.0
    mode: align_axis
  parameters:
    contact_force:
      binds_to:
      - mode: replace
        path: termination.force_threshold
      default: 5.0
      range:
      - 1.0
      - 15.0
      type: scalar
    speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.02
      range:
      - 0.005
      - 0.05
      type: scalar
  subtask_id: descend_socket
  target:
    anchor: task_goal
    offset:
    - 0.0
    - 0.0
    - 0.0
    source: yaml
  termination: force_exceeded
  type: descend
- control: admittance_control
  generator: linear_cartesian
  guards:
  - args: {}
    id: insert_force_limit
    on_failure: abort
    predicate: force_below
    threshold: 40.0
    when: during_phase
  id: insert_1
  orientation:
    align_with: channel_axis
    axis:
    - 0.0
    - 0.0
    - 1.0
    mode: align_axis
  parameters:
    insertion_depth:
      binds_to:
      - mode: replace
        path: target.offset_along_axis.distance
      default: 0.05
      range:
      - 0.02
      - 0.08
      type: scalar
  subtask_id: insert_into_socket
  target:
    anchor: fixture
    offset:
    - 0.0
    - 0.0
    - 0.055
    offset_along_axis:
      axis: channel_axis
      distance: 0.05
      mode: add_to_offset
      sign: positive
    source: yaml
  termination: pose_tolerance
  type: insert
- control: position_control
  generator: linear_cartesian
  id: retract_1
  orientation:
    mode: keep_current
  parameters:
    speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.05
      range:
      - 0.01
      - 0.1
      type: scalar
  target:
    anchor: task_goal
    offset:
    - 0.0
    - 0.0
    - 0.1
    source: yaml
  termination: pose_tolerance
  type: retract
skill: peg_insert
subtasks:
- anchor: goal
  id: approach_socket
  metric: distance
  offset:
  - 0.0
  - 0.0
  - 0.04
  target_entity: tcp
  weight: 0.3
- anchor: goal
  id: descend_socket
  metric: distance
  offset:
  - 0.0
  - 0.0
  - 0.0
  target_entity: tcp
  weight: 0.3
- anchor: fixture
  id: insert_into_socket
  metric: goal_progress
  offset:
  - 0.0
  - 0.0
  - -0.04
  target_entity: tcp
  weight: 0.4
