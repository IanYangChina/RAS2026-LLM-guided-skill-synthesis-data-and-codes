dsl_version: 2
phases:
- control: position_control
  generator: arc_cartesian
  guards: []
  id: approach_object
  parameters:
    approach_height:
      binds_to:
      - mode: replace
        path: target.offset.z
      default: 0.12
      range:
      - 0.08
      - 0.2
      type: scalar
    approach_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.15
      range:
      - 0.05
      - 0.3
      type: scalar
  retries:
    max_attempts: 1
    strategy: repeat
  subtask_id: reach_pre_grasp
  target:
    anchor: task_object
    offset:
    - 0.0
    - 0.0
    - 0.12
    orientation:
      align_with: world_z
      axis:
      - 0.0
      - 0.0
      - 1.0
      mode: align_axis
      tolerance: 0.1
    source: yaml
    tolerance: 0.01
  termination: pose_tolerance
  type: approach
- control: position_control
  generator: linear_cartesian
  guards:
  - args: {}
    id: grasp_contact
    on_failure: retry
    predicate: contact_detected
    threshold: 0.5
    when: after_phase
  id: descend_grasp
  parameters:
    descend_height:
      binds_to:
      - mode: replace
        path: target.offset.z
      default: 0.03
      range:
      - 0.02
      - 0.06
      type: scalar
    descend_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.05
      range:
      - 0.02
      - 0.1
      type: scalar
  retries:
    max_attempts: 2
    offset:
    - 0.0
    - 0.0
    - -0.003
    strategy: offset_target
  subtask_id: reach_pre_grasp
  target:
    anchor: task_object
    offset:
    - 0.0
    - 0.0
    - 0.03
    orientation:
      align_with: world_z
      axis:
      - 0.0
      - 0.0
      - 1.0
      mode: align_axis
      tolerance: 0.1
    source: yaml
    tolerance: 0.008
  termination: pose_tolerance
  type: descend
- control: position_control
  end_effector_action: force_grasp
  generator: null
  guards:
  - args: {}
    id: bilateral_grasp_check
    on_failure: retry
    predicate: bilateral_grasp
    threshold: 0.5
    when: after_phase
  id: grasp
  parameters:
    grasp_force:
      binds_to: []
      default: 2.0
      range:
      - 0.5
      - 5.0
      type: scalar
  retries:
    max_attempts: 2
    strategy: repeat
  target:
    anchor: current_tcp
    offset:
    - 0.0
    - 0.0
    - 0.0
    source: yaml
  termination: grasp_success
  type: grasp
- control: position_control
  generator: linear_cartesian
  guards:
  - args: {}
    id: object_lifted_check
    on_failure: retry
    predicate: object_lifted
    threshold: 0.03
    when: after_phase
  id: lift
  parameters:
    lift_height:
      binds_to:
      - mode: replace
        path: target.offset.z
      default: 0.15
      range:
      - 0.08
      - 0.25
      type: scalar
    lift_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.05
      range:
      - 0.02
      - 0.1
      type: scalar
  retries:
    max_attempts: 1
    strategy: repeat
  target:
    anchor: current_tcp
    offset:
    - 0.0
    - 0.0
    - 0.15
    orientation:
      mode: keep_current
    source: yaml
  termination: pose_tolerance
  type: lift
- control: position_control
  generator: arc_cartesian
  guards: []
  id: approach_goal
  parameters:
    goal_approach_offset_z:
      binds_to:
      - mode: replace
        path: target.offset.z
      default: 0.0
      range:
      - -0.05
      - 0.1
      type: scalar
    transport_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.15
      range:
      - 0.05
      - 0.3
      type: scalar
  retries:
    max_attempts: 1
    strategy: repeat
  subtask_id: reach_goal
  target:
    anchor: task_goal
    offset:
    - 0.0
    - 0.0
    - 0.0
    orientation:
      mode: keep_current
    source: yaml
    tolerance: 0.01
  termination: pose_tolerance
  type: approach
- control: position_control
  end_effector_action: open
  generator: null
  id: release
  parameters:
    release_duration:
      binds_to:
      - mode: replace
        path: duration.max_time
      default: 0.3
      range:
      - 0.1
      - 0.5
      type: scalar
  target:
    anchor: current_tcp
    offset:
    - 0.0
    - 0.0
    - 0.0
    source: yaml
  termination: time_limit
  type: release
- control: position_control
  generator: linear_cartesian
  guards: []
  id: retract
  parameters:
    retract_height:
      binds_to:
      - mode: replace
        path: target.offset.z
      default: 0.1
      range:
      - 0.05
      - 0.15
      type: scalar
    retract_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.15
      range:
      - 0.05
      - 0.3
      type: scalar
  retries:
    max_attempts: 0
  target:
    anchor: current_tcp
    offset:
    - 0.0
    - 0.0
    - 0.1
    orientation:
      mode: keep_current
    source: yaml
  termination: pose_tolerance
  type: retract
skill: grasp_place
skill_type: arm_gripper
subtasks:
- anchor: object
  id: reach_pre_grasp
  metric: distance
  offset:
  - 0.0
  - 0.0
  - 0.12
  target_entity: tcp
  weight: 0.3
- anchor: goal
  id: reach_goal
  metric: distance
  offset:
  - 0.0
  - 0.0
  - 0.0
  target_entity: tcp
  weight: 0.7
