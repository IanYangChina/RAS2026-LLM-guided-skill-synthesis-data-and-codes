dsl_version: 2
phases:
- control: position_control
  generator: linear_cartesian
  guards:
  - args: {}
    id: side_contact
    on_failure: retry
    predicate: contact_detected
    threshold: 1.0
    when: during_phase
  id: approach_side
  parameters:
    approach_speed:
      binds_to:
      - mode: scale
        path: generator.speed
      default: 0.05
      range:
      - 0.01
      - 0.2
      type: scalar
    height_z_offset:
      binds_to:
      - mode: add
        path: target.offset.z
      default: 0.17
      range:
      - 0.0
      - 0.3
      type: scalar
    lateral_y_offset:
      binds_to:
      - mode: add
        path: target.offset.y
      default: 0.25
      range:
      - -0.1
      - 0.4
      type: scalar
  retries:
    max_attempts: 2
    offset:
    - 0.0
    - 0.05
    - 0.0
    strategy: offset_target
  subtask_id: reach_side
  target:
    anchor: fixture
    entity: fixture
    offset:
    - 0.0
    - 0.25
    - 0.17
    orientation:
      mode: none
    source: yaml
    tolerance: 0.02
  termination: pose_tolerance
  type: approach
- control: position_control
  generator: linear_cartesian
  id: approach_above
  parameters:
    above_speed:
      binds_to:
      - mode: scale
        path: generator.speed
      default: 0.05
      range:
      - 0.01
      - 0.2
      type: scalar
    above_z_offset:
      binds_to:
      - mode: add
        path: target.offset.z
      default: 0.17
      range:
      - 0.0
      - 0.3
      type: scalar
  subtask_id: reach_above_goal
  target:
    anchor: task_goal
    offset:
    - 0.0
    - 0.0
    - 0.17
    orientation:
      mode: none
    source: yaml
    tolerance: 0.02
  termination: pose_tolerance
  type: approach
- control: position_control
  generator: linear_cartesian
  id: descend_goal
  parameters:
    descend_speed:
      binds_to:
      - mode: scale
        path: generator.speed
      default: 0.03
      range:
      - 0.01
      - 0.2
      type: scalar
    descend_tolerance:
      binds_to:
      - mode: add
        path: termination.pose_tolerance
      default: 0.02
      range:
      - 0.005
      - 0.05
      type: scalar
  subtask_id: reach_goal
  target:
    anchor: task_goal
    offset:
    - 0.0
    - 0.0
    - 0.0
    orientation:
      mode: none
    source: yaml
    tolerance: 0.02
  termination: pose_tolerance
  type: descend
skill: obstacle_reach
skill_type: arm_gripper
subtasks:
- anchor: fixture
  id: reach_side
  metric: distance
  offset:
  - 0.0
  - 0.25
  - 0.17
  target_entity: tcp
  weight: 0.2
- anchor: goal
  id: reach_above_goal
  metric: distance
  offset:
  - 0.0
  - 0.0
  - 0.17
  target_entity: tcp
  weight: 0.2
- anchor: goal
  id: reach_goal
  metric: distance
  offset:
  - 0.0
  - 0.0
  - 0.0
  target_entity: tcp
  weight: 0.6
