dsl_version: 2
phases:
- control: position_control
  generator: linear_cartesian
  guards:
  - args: {}
    id: wall_contact_avoid
    on_failure: abort
    predicate: force_below
    threshold: 35.0
    when: during_phase
  id: approach_peg
  parameters:
    approach_offset_y:
      binds_to:
      - path: target.offset.y
      default: 0.05
      range:
      - 0.02
      - 0.08
      type: scalar
    approach_speed:
      binds_to:
      - path: generator.speed
      default: 0.15
      range:
      - 0.05
      - 0.3
      type: scalar
  retries:
    max_attempts: 1
    offset:
    - 0.0
    - -0.01
    - 0.0
    strategy: offset_target
  subtask_id: reach_object
  target:
    anchor: task_object
    entity: peg
    offset:
    - 0.0
    - 0.05
    - 0.0
    orientation:
      mode: keep_current
    source: yaml
    tolerance: 0.01
  termination: pose_tolerance
  type: approach
- control: impedance_control
  generator: impedance_motion
  guards:
  - args: {}
    id: contact_force_guard
    on_failure: retry
    predicate: force_below
    threshold: 40.0
    when: during_phase
  id: push_through
  parameters:
    max_push_time:
      binds_to:
      - path: duration.max_time
      default: 6.0
      range:
      - 2.0
      - 10.0
      type: scalar
    push_distance:
      binds_to:
      - path: target.offset_along_axis.distance
      default: 0.16
      range:
      - 0.02
      - 0.2
      type: scalar
    push_force_threshold:
      binds_to:
      - path: termination.force_threshold
      default: 30.0
      range:
      - 5.0
      - 40.0
      type: scalar
    push_speed:
      binds_to:
      - path: generator.speed
      default: 0.03
      range:
      - 0.01
      - 0.1
      type: scalar
  retries:
    max_attempts: 2
    offset:
    - 0.005
    - 0.0
    - 0.0
    strategy: offset_target
  subtask_id: push_complete
  target:
    anchor: task_object
    entity: peg
    offset:
    - 0.0
    - 0.0
    - 0.0
    offset_along_axis:
      axis: channel_axis
      distance: 0.16
      mode: add_to_offset
    orientation:
      mode: keep_current
    source: yaml
  termination: force_exceeded
  type: push
skill: peg_channel
skill_type: arm_gripper
subtasks:
- anchor: object
  id: reach_object
  metric: distance
  offset:
  - 0.0
  - 0.05
  - 0.0
  target_entity: tcp
  weight: 0.3
- anchor: goal
  id: push_complete
  metric: goal_progress
  target_entity: object
  weight: 0.7
