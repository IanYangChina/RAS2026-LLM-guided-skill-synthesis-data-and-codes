dsl_version: 2
phases:
- control: position_control
  generator: linear_cartesian
  id: approach_1
  parameters:
    approach_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.07
      range:
      - 0.01
      - 0.1
      type: scalar
    lateral_x:
      binds_to:
      - mode: add
        path: target.offset.x
      default: 0.0
      range:
      - -0.03
      - 0.03
      type: scalar
    lateral_y:
      binds_to:
      - mode: add
        path: target.offset.y
      default: 0.0
      range:
      - -0.03
      - 0.03
      type: scalar
  subtask_id: reach_above_hole
  target:
    anchor: fixture
    entity: peg_socket
    offset:
    - 0.0
    - 0.0
    - 0.16
    orientation:
      mode: keep_current
    source: yaml
    tolerance: 0.015
  termination: pose_tolerance
  type: approach
- control: impedance_control
  generator: linear_cartesian
  id: insert_1
  parameters:
    force_threshold:
      binds_to:
      - mode: replace
        path: termination.force_threshold
      default: 25.0
      range:
      - 15.0
      - 40.0
      type: scalar
    insertion_depth:
      binds_to:
      - mode: replace
        path: target.offset_along_axis.distance
      default: 0.18
      range:
      - 0.1
      - 0.2
      type: scalar
  subtask_id: insertion_progress
  target:
    anchor: current_tcp
    offset:
    - 0.0
    - 0.0
    - 0.0
    offset_along_axis:
      axis: world_z
      distance: 0.18
      mode: replace_offset_projection
      sign: negative
    orientation:
      mode: keep_current
    source: yaml
  termination: force_exceeded
  type: push
- control: impedance_control
  generator: linear_cartesian
  id: retract_1
  parameters:
    retract_max_time:
      binds_to:
      - mode: replace
        path: duration.max_time
      default: 10.0
      range:
      - 5.0
      - 15.0
      type: scalar
    retract_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.04
      range:
      - 0.01
      - 0.08
      type: scalar
  target:
    anchor: current_tcp
    offset:
    - 0.0
    - 0.0
    - 0.0
    offset_along_axis:
      axis: world_z
      distance: 0.2
      mode: replace_offset_projection
      sign: positive
    orientation:
      mode: keep_current
    source: yaml
  termination: time_limit
  type: retract
skill: peg_insert
skill_type: arm_gripper
subtasks:
- anchor: fixture
  id: reach_above_hole
  metric: distance
  offset:
  - 0.0
  - 0.0
  - 0.16
  target_entity: tcp
  weight: 0.3
- anchor: goal
  id: insertion_progress
  metric: goal_progress
  offset:
  - 0.0
  - 0.0
  - 0.0
  target_entity: object
  weight: 0.7
