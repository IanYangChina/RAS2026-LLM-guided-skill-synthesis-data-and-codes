dsl_version: 2
phases:
- control: position_control
  generator: linear_cartesian
  id: approach_above_object
  parameters:
    approach_height:
      binds_to:
      - mode: replace
        path: target.offset.z
      default: 0.1
      range:
      - 0.05
      - 0.2
      type: scalar
    speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.1
      range:
      - 0.05
      - 0.2
      type: scalar
  subtask_id: reach_precontact
  target:
    anchor: task_object
    offset:
    - 0.0
    - 0.0
    - 0.1
    orientation:
      mode: keep_current
    tolerance: 0.01
  termination: pose_tolerance
  type: approach
- control: force_threshold_switch
  generator: linear_cartesian
  id: descend_to_grasp
  parameters:
    descend_force_threshold:
      binds_to:
      - mode: replace
        path: termination.force_threshold
      default: 5.0
      range:
      - 1.0
      - 20.0
      type: scalar
    speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.05
      range:
      - 0.02
      - 0.1
      type: scalar
  target:
    anchor: task_object
    offset:
    - 0.0
    - 0.0
    - 0.0
    orientation:
      mode: keep_current
  termination: force_exceeded
  type: descend
- control: position_control
  end_effector_action: force_grasp
  generator: null
  guards:
  - args: {}
    id: bilateral_grasp_check
    on_failure: retry
    predicate: bilateral_grasp
    threshold: 0.0
    when: after_phase
  id: grasp
  parameters: {}
  retries:
    max_attempts: 2
    strategy: reduce_speed
  target:
    anchor: current_tcp
    offset:
    - 0.0
    - 0.0
    - 0.0
  termination: time_limit
  type: grasp
- control: position_control
  generator: linear_cartesian
  id: lift_object
  parameters:
    lift_height:
      binds_to:
      - mode: replace
        path: target.offset_along_axis.distance
      default: 0.15
      range:
      - 0.05
      - 0.25
      type: scalar
    speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.1
      range:
      - 0.05
      - 0.2
      type: scalar
  target:
    anchor: current_tcp
    offset:
    - 0.0
    - 0.0
    - 0.0
    offset_along_axis:
      axis: world_z
      distance: 0.15
      mode: add_to_offset
      sign: positive
    orientation:
      mode: keep_current
    tolerance: 0.01
  termination: pose_tolerance
  type: lift
- control: position_control
  generator: linear_cartesian
  id: approach_goal_above
  parameters:
    place_approach_height:
      binds_to:
      - mode: replace
        path: target.offset.z
      default: 0.1
      range:
      - 0.05
      - 0.2
      type: scalar
    speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.1
      range:
      - 0.05
      - 0.2
      type: scalar
  subtask_id: reach_goal
  target:
    anchor: task_goal
    offset:
    - 0.0
    - 0.0
    - 0.1
    orientation:
      mode: keep_current
    tolerance: 0.01
  termination: pose_tolerance
  type: approach
- control: position_control
  generator: linear_cartesian
  id: descend_to_place
  parameters:
    place_z_offset:
      binds_to:
      - mode: replace
        path: target.offset.z
      default: 0.0
      range:
      - -0.02
      - 0.02
      type: scalar
    speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.05
      range:
      - 0.02
      - 0.1
      type: scalar
  subtask_id: reach_goal
  target:
    anchor: task_goal
    offset:
    - 0.0
    - 0.0
    - 0.0
    orientation:
      mode: keep_current
    tolerance: 0.005
  termination: pose_tolerance
  type: descend
- control: position_control
  end_effector_action: open
  generator: null
  guards:
  - args: {}
    id: object_deposited
    on_failure: retry
    predicate: object_lifted
    threshold: 0.0
    when: after_phase
  id: release
  parameters: {}
  retries:
    max_attempts: 1
    strategy: reduce_speed
  target:
    anchor: current_tcp
    offset:
    - 0.0
    - 0.0
    - 0.0
  termination: time_limit
  type: release
- control: position_control
  generator: linear_cartesian
  id: retract_after_place
  parameters:
    retract_height:
      binds_to:
      - mode: replace
        path: target.offset_along_axis.distance
      default: 0.1
      range:
      - 0.05
      - 0.2
      type: scalar
    speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.1
      range:
      - 0.05
      - 0.2
      type: scalar
  target:
    anchor: current_tcp
    offset:
    - 0.0
    - 0.0
    - 0.0
    offset_along_axis:
      axis: world_z
      distance: 0.1
      mode: add_to_offset
      sign: positive
    orientation:
      mode: keep_current
    tolerance: 0.01
  termination: pose_tolerance
  type: retract
skill: grasp_place
subtasks:
- anchor: object
  id: reach_precontact
  offset:
  - 0.0
  - 0.0
  - 0.1
  target_entity: tcp
  weight: 0.3
- anchor: goal
  id: reach_goal
  offset:
  - 0.0
  - 0.0
  - 0.0
  target_entity: tcp
  weight: 0.7
