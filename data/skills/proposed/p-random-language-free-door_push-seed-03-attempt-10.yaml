dsl_version: 2
phases:
- control: position_control
  generator: linear_cartesian
  id: approach_1
  orientation:
    mode: keep_current
  parameters:
    approach_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.1
      range:
      - 0.05
      - 0.5
      type: scalar
  subtask_id: approach_handle
  target:
    anchor: world
    entity: door_handle
    offset:
    - 0.0
    - 0.0
    - 0.0
    source: yaml
    tolerance: 0.02
  termination: pose_tolerance
  type: approach
- control: admittance_control
  generator: linear_cartesian
  guards:
  - id: push_goal
    on_failure: retry
    predicate: hinge_delta_reached
    threshold: 0.524
    when: after_phase
  id: push_1
  orientation:
    mode: keep_current
  parameters:
    push_distance:
      binds_to:
      - mode: replace
        path: target.offset_along_axis.distance
      default: 0.3
      range:
      - 0.1
      - 0.5
      type: scalar
    push_force_threshold:
      binds_to:
      - mode: replace
        path: guards.push_goal.threshold
      default: 20.0
      range:
      - 10.0
      - 30.0
      type: scalar
    push_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.05
      range:
      - 0.02
      - 0.2
      type: scalar
  retries:
    max_attempts: 2
    offset:
    - 0.0
    - -0.05
    - 0.0
    strategy: offset_target
  subtask_id: push_door
  target:
    anchor: world
    entity: door_handle
    offset:
    - 0.0
    - 0.0
    - 0.0
    offset_along_axis:
      axis: world_y
      distance: 0.3
      mode: add_to_offset
      sign: negative
    source: yaml
    tolerance: 0.05
  termination: pose_tolerance
  type: push
skill: door_push
subtasks:
- anchor: world
  id: approach_handle
  metric: distance
  offset:
  - 0.1
  - 0.18
  - 0.35
  target_entity: tcp
  weight: 0.3
- anchor: fixture
  id: push_door
  metric: hinge_angle
  target_entity: hinge
  weight: 0.7
