dsl_version: 2
phases:
- control: position_control
  generator: arc_cartesian
  id: approach_above
  parameters:
    approach_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.1
      range:
      - 0.07
      - 0.15
      type: scalar
    approach_tolerance:
      binds_to:
      - mode: replace
        path: termination.pose_tolerance
      default: 0.05
      range:
      - 0.03
      - 0.08
      type: scalar
    arc_height:
      binds_to:
      - mode: replace
        path: generator.arc_height
      default: 0.25
      range:
      - 0.12
      - 0.4
      type: scalar
  subtask_id: above_goal
  target:
    anchor: task_goal
    offset:
    - 0.0
    - 0.0
    - 0.5
    source: yaml
  termination: pose_tolerance
  type: approach
- control: position_control
  generator: linear_cartesian
  id: descend_to_goal
  parameters:
    descend_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.1
      range:
      - 0.05
      - 0.15
      type: scalar
    descend_tolerance:
      binds_to:
      - mode: replace
        path: termination.pose_tolerance
      default: 0.02
      range:
      - 0.01
      - 0.03
      type: scalar
  subtask_id: final_goal
  target:
    anchor: task_goal
    offset:
    - 0.0
    - 0.0
    - 0.0
    source: yaml
  termination: pose_tolerance
  type: descend
skill: obstacle_reach
subtasks:
- anchor: goal
  id: above_goal
  offset:
  - 0.0
  - 0.0
  - 0.5
  target_entity: tcp
  weight: 0.4
- anchor: goal
  id: final_goal
  offset:
  - 0.0
  - 0.0
  - 0.0
  target_entity: tcp
  weight: 0.6
