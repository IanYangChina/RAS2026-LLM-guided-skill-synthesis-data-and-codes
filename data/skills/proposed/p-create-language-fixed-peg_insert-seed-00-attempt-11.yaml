dsl_version: 2
phases:
- control: position_control
  generator: linear_cartesian
  id: align_1
  subtask_id: align
  target:
    anchor: fixture
    entity: peg_socket
    offset:
    - 0.0
    - 0.0
    - 0.12
    orientation:
      align_with: insertion_axis
      axis:
      - 0.0
      - 0.0
      - 1.0
      mode: align_axis
      tolerance: 0.01
    source: yaml
  termination: pose_tolerance
  type: align
- control: position_control
  generator: linear_cartesian
  id: approach_1
  subtask_id: approach
  target:
    anchor: fixture
    entity: peg_socket
    offset:
    - 0.0
    - 0.0
    - 0.09
    orientation:
      align_with: insertion_axis
      axis:
      - 0.0
      - 0.0
      - 1.0
      mode: align_axis
      tolerance: 0.01
    source: yaml
  termination: pose_tolerance
  type: approach
- control: position_control
  generator: linear_cartesian
  id: descend_1
  parameters:
    descend_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.015
      range:
      - 0.005
      - 0.05
      type: scalar
    descend_z:
      binds_to:
      - mode: replace
        path: target.offset.z
      default: 0.05
      range:
      - 0.035
      - 0.065
      type: scalar
  subtask_id: contact
  target:
    anchor: fixture
    entity: peg_socket
    offset:
    - 0.0
    - 0.0
    - 0.05
    orientation:
      align_with: insertion_axis
      axis:
      - 0.0
      - 0.0
      - 1.0
      mode: align_axis
      tolerance: 0.01
    source: yaml
  termination: pose_tolerance
  type: descend
- control: impedance_control
  generator: impedance_motion
  guards:
  - id: entry_contact
    on_failure: retry
    predicate: contact_detected
    threshold: 1.0
    when: during_phase
  id: insert_entry
  parameters:
    force_threshold_entry:
      binds_to:
      - mode: replace
        path: termination.force_threshold
      default: 12.0
      range:
      - 5.0
      - 20.0
      type: scalar
    insert_speed_entry:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.006
      range:
      - 0.002
      - 0.02
      type: scalar
  retries:
    max_attempts: 3
    offset:
    - 0.008
    - 0.008
    - 0.0
    strategy: offset_target
  subtask_id: insert
  target:
    anchor: fixture
    entity: peg_socket
    offset:
    - 0.0
    - 0.0
    - 0.01
    orientation:
      align_with: insertion_axis
      axis:
      - 0.0
      - 0.0
      - 1.0
      mode: align_axis
      tolerance: 0.01
    source: yaml
  termination: force_exceeded
  type: insert
- control: impedance_control
  generator: impedance_motion
  guards:
  - id: seat_contact
    on_failure: retry
    predicate: force_below
    threshold: 20.0
    when: during_phase
  id: insert_seat
  parameters:
    force_threshold_seat:
      binds_to:
      - mode: replace
        path: termination.force_threshold
      default: 30.0
      range:
      - 20.0
      - 45.0
      type: scalar
    seat_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.004
      range:
      - 0.001
      - 0.015
      type: scalar
  retries:
    max_attempts: 3
    offset:
    - 0.012
    - 0.012
    - 0.0
    strategy: offset_target
  target:
    anchor: fixture
    entity: peg_socket
    offset:
    - 0.0
    - 0.0
    - -0.01
    orientation:
      align_with: insertion_axis
      axis:
      - 0.0
      - 0.0
      - 1.0
      mode: align_axis
      tolerance: 0.01
    source: yaml
  termination: force_exceeded
  type: push
skill: peg_insert
