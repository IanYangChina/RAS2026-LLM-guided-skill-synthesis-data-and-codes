dsl_version: 2
phases:
- control: position_control
  generator: arc_cartesian
  id: align_to_entry
  parameters:
    arc_height:
      binds_to:
      - mode: replace
        path: generator.arc_height
      default: 0.08
      range:
      - 0.04
      - 0.12
      type: scalar
    speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.1
      range:
      - 0.05
      - 0.2
      type: scalar
  target:
    anchor: world
    offset:
    - 0.5
    - 0.15
    - 0.04
    orientation:
      align_with: channel_axis
      axis:
      - 1.0
      - 0.0
      - 0.0
      mode: align_axis
      tolerance: 0.1
    source: yaml
  termination: pose_tolerance
  type: approach
- control: impedance_control
  generator: linear_cartesian
  id: approach_peg
  parameters:
    approach_tolerance:
      binds_to:
      - mode: replace
        path: termination.pose_tolerance
      default: 0.02
      range:
      - 0.005
      - 0.03
      type: scalar
    speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.07
      range:
      - 0.03
      - 0.12
      type: scalar
  subtask_id: approach
  target:
    anchor: task_object
    entity: peg
    offset:
    - 0.0
    - 0.06
    - 0.0
    orientation:
      align_with: channel_axis
      axis:
      - 1.0
      - 0.0
      - 0.0
      mode: align_axis
      tolerance: 0.1
    source: yaml
  termination: pose_tolerance
  type: approach
- control: force_threshold_switch
  generator: linear_cartesian
  id: contact_peg
  parameters:
    contact_force:
      binds_to:
      - mode: replace
        path: termination.force_threshold
      default: 2.5
      range:
      - 1.0
      - 5.0
      type: scalar
    speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.02
      range:
      - 0.01
      - 0.04
      type: scalar
  subtask_id: contact
  target:
    anchor: task_object
    entity: peg
    offset:
    - 0.0
    - 0.01
    - 0.0
    orientation:
      align_with: channel_axis
      axis:
      - 1.0
      - 0.0
      - 0.0
      mode: align_axis
      tolerance: 0.1
    source: yaml
  termination: force_exceeded
  type: contact
- control: impedance_control
  generator: impedance_motion
  id: push_through
  parameters:
    push_max_time:
      binds_to:
      - mode: replace
        path: duration.max_time
      default: 8.0
      range:
      - 5.0
      - 12.0
      type: scalar
    push_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.04
      range:
      - 0.02
      - 0.08
      type: scalar
  subtask_id: push
  target:
    anchor: world
    offset:
    - 0.5
    - -0.08
    - 0.04
    orientation:
      align_with: channel_axis
      axis:
      - 1.0
      - 0.0
      - 0.0
      mode: align_axis
      tolerance: 0.1
    source: yaml
  termination: time_limit
  type: push
skill: peg_channel
