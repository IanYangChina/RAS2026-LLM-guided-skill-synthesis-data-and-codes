dsl_version: 2
phases:
- control: position_control
  generator: arc_cartesian
  id: approach_arc
  parameters:
    approach_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.08
      range:
      - 0.01
      - 0.2
      type: scalar
    arc_height:
      binds_to:
      - mode: replace
        path: generator.arc_height
      default: 0.35
      range:
      - 0.25
      - 0.5
      type: scalar
  subtask_id: clear_obstacle
  target:
    anchor: task_goal
    offset:
    - 0.0
    - 0.25
    - 0.35
    orientation:
      mode: none
    source: yaml
    tolerance: 0.02
  termination: pose_tolerance
  type: approach
- control: position_control
  generator: linear_cartesian
  id: align_lateral
  parameters:
    align_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.1
      range:
      - 0.01
      - 0.2
      type: scalar
    align_tolerance:
      binds_to:
      - mode: replace
        path: termination.pose_tolerance
      default: 0.015
      range:
      - 0.005
      - 0.03
      type: scalar
  subtask_id: final_reach
  target:
    anchor: task_goal
    offset:
    - 0.0
    - 0.0
    - 0.35
    orientation:
      mode: none
    source: yaml
    tolerance: 0.02
  termination: pose_tolerance
  type: align
- control: position_control
  generator: linear_cartesian
  id: descend_goal
  parameters:
    descend_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.06
      range:
      - 0.01
      - 0.15
      type: scalar
    descend_tolerance:
      binds_to:
      - mode: replace
        path: termination.pose_tolerance
      default: 0.01
      range:
      - 0.005
      - 0.02
      type: scalar
  subtask_id: final_reach
  target:
    anchor: task_goal
    offset:
    - 0.0
    - 0.0
    - 0.0
    orientation:
      mode: none
    source: yaml
    tolerance: 0.02
  termination: pose_tolerance
  type: descend
skill: obstacle_reach
subtasks:
- anchor: goal
  id: clear_obstacle
  metric: distance
  offset:
  - 0.0
  - 0.25
  - 0.35
  target_entity: tcp
  weight: 0.3
- anchor: goal
  id: final_reach
  metric: distance
  offset:
  - 0.0
  - 0.0
  - 0.0
  target_entity: tcp
  weight: 0.7
