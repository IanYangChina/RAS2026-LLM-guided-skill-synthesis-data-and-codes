dsl_version: 2
phases:
- control: position_control
  generator: linear_cartesian
  id: approach_1
  parameters:
    approach_height:
      binds_to:
      - mode: replace
        path: target.offset.z
      default: 0.15
      range:
      - 0.05
      - 0.3
      type: scalar
  subtask_id: reach_object
  target:
    anchor: task_object
    offset:
    - 0.0
    - 0.0
    - 0.15
    source: yaml
    tolerance: 0.01
  termination: pose_tolerance
  type: approach
- control: force_threshold_switch
  generator: impedance_motion
  id: contact_1
  parameters:
    speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.03
      range:
      - 0.005
      - 0.05
      type: scalar
  target:
    anchor: task_object
    offset:
    - 0.0
    - 0.0
    - 0.0
    source: yaml
  termination: force_exceeded
  type: contact
- control: position_control
  generator: linear_cartesian
  id: push_1
  parameters:
    push_tolerance:
      binds_to:
      - mode: replace
        path: termination.pose_tolerance
      default: 0.02
      range:
      - 0.01
      - 0.05
      type: scalar
  subtask_id: reach_goal
  target:
    anchor: task_goal
    offset:
    - 0.0
    - 0.0
    - 0.0
    source: yaml
    tolerance: 0.02
  termination: pose_tolerance
  type: push
skill: push_to_goal
subtasks:
- anchor: object
  id: reach_object
  metric: distance
  offset:
  - 0.0
  - 0.0
  - 0.1
  target_entity: tcp
  weight: 0.3
- anchor: goal
  id: reach_goal
  metric: distance
  offset:
  - 0.0
  - 0.0
  - 0.0
  target_entity: tcp
  weight: 0.7
