dsl_version: 2
phases:
- control: position_control
  generator: arc_cartesian
  id: approach_handle
  orientation:
    mode: keep_current
  parameters:
    approach_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.05
      range:
      - 0.02
      - 0.1
      type: scalar
  subtask_id: door_progress
  target:
    anchor: task_goal
    offset:
    - 0
    - 0
    - 0.1
    source: yaml
    tolerance: 0.01
  termination: pose_tolerance
  type: approach
- control: position_control
  generator: linear_cartesian
  id: descend_to_handle
  orientation:
    mode: keep_current
  subtask_id: door_progress
  target:
    anchor: site
    entity: door_handle
    offset:
    - 0
    - -0.03
    - 0
    source: yaml
    tolerance: 0.005
  termination: contact_detected
  type: descend
- control: impedance_control
  generator: linear_cartesian
  guards:
  - args: {}
    id: hinge_complete
    on_failure: abort
    predicate: hinge_delta_reached
    threshold: 0.524
    when: during_phase
  id: push_door
  orientation:
    mode: keep_current
  parameters:
    push_distance:
      binds_to:
      - mode: replace
        path: target.offset_along_axis.distance
      default: 0.2
      range:
      - 0.1
      - 0.3
      type: scalar
    push_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.05
      range:
      - 0.02
      - 0.1
      type: scalar
    target_angle:
      binds_to:
      - mode: replace
        path: guards.hinge_complete.threshold
      default: 0.524
      range:
      - 0.5
      - 0.55
      type: scalar
  retries:
    max_attempts: 2
    offset:
    - 0
    - -0.02
    - 0
    strategy: offset_target
  subtask_id: door_progress
  target:
    anchor: task_goal
    offset:
    - 0
    - 0
    - 0
    offset_along_axis:
      axis: world_y
      distance: 0.2
      mode: add_to_offset
      sign: negative
    source: yaml
  termination: time_limit
  type: push
skill: door_push
skill_type: arm
subtasks:
- anchor: fixture
  id: door_progress
  metric: hinge_angle
  offset:
  - 0
  - 0
  - 0
  target_entity: hinge
  weight: 1.0
