dsl_version: 2
phases:
- control: position_control
  generator: linear_cartesian
  id: approach_behind
  parameters:
    approach_y_offset:
      binds_to:
      - mode: replace
        path: target.offset.y
      default: 0.1
      range:
      - 0.05
      - 0.15
      type: scalar
  subtask_id: reach_prepush
  target:
    anchor: task_object
    offset:
    - 0.02
    - 0.1
    - 0.1
    orientation:
      mode: keep_current
    source: yaml
    tolerance: 0.02
  termination: time_limit
  type: approach
- control: position_control
  generator: linear_cartesian
  id: descend
  parameters:
    descend_z:
      binds_to:
      - mode: replace
        path: target.offset.z
      default: 0.02
      range:
      - 0.015
      - 0.03
      type: scalar
  subtask_id: reach_prepush
  target:
    anchor: task_object
    offset:
    - 0.02
    - 0.1
    - 0.02
    orientation:
      mode: keep_current
    source: yaml
    tolerance: 0.01
  termination: time_limit
  type: descend
- control: admittance_control
  generator: linear_cartesian
  id: push_to_goal
  subtask_id: push_to_goal
  target:
    anchor: task_goal
    offset:
    - 0.0
    - 0.0
    - 0.02
    orientation:
      mode: keep_current
    source: yaml
    tolerance: 0.02
  termination: pose_tolerance
  type: push
skill: push_to_goal
skill_type: arm_gripper
subtasks:
- anchor: object
  id: reach_prepush
  offset:
  - 0.02
  - 0.1
  - 0.02
  weight: 0.3
- anchor: goal
  id: push_to_goal
  offset:
  - 0.0
  - 0.0
  - 0.0
  weight: 0.7
