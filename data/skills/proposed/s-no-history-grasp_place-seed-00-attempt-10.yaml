dsl_version: 2
phases:
- control: position_control
  generator: linear_cartesian
  guards: []
  id: approach_object
  parameters:
    approach_height:
      binds_to:
      - mode: replace
        path: target.offset.z
      default: 0.1
      range:
      - 0.05
      - 0.25
      type: scalar
  retries:
    max_attempts: 0
  subtask_id: reach_object
  target:
    anchor: task_object
    entity: null
    offset:
    - 0.0
    - 0.0
    - 0.1
    orientation:
      mode: keep_current
    source: yaml
    tolerance: 0.02
  termination: pose_tolerance
  type: approach
- control: position_control
  generator: linear_cartesian
  guards: []
  id: descend_grasp
  parameters:
    descend_height:
      binds_to:
      - mode: replace
        path: target.offset.z
      default: 0.03
      range:
      - 0.01
      - 0.08
      type: scalar
  retries:
    max_attempts: 0
  subtask_id: grasp_contact
  target:
    anchor: task_object
    entity: null
    offset:
    - 0.0
    - 0.0
    - 0.03
    orientation:
      mode: keep_current
    source: yaml
    tolerance: 0.02
  termination: pose_tolerance
  type: descend
- control: position_control
  end_effector_action: force_grasp
  generator: null
  guards:
  - args: {}
    id: grasp_check
    on_failure: retry
    predicate: bilateral_grasp
    threshold: 0.0
    when: after_phase
  id: grasp_1
  parameters:
    grasp_time:
      binds_to:
      - mode: replace
        path: duration.max_time
      default: 0.5
      range:
      - 0.2
      - 2.0
      type: scalar
  retries:
    max_attempts: 1
    strategy: repeat
  subtask_id: grasp_contact
  target:
    anchor: current_tcp
    entity: null
    offset:
    - 0.0
    - 0.0
    - 0.0
    source: yaml
  termination: time_limit
  type: grasp
- control: impedance_control
  generator: linear_cartesian
  guards: []
  id: lift_object
  parameters:
    lift_distance:
      binds_to:
      - mode: replace
        path: target.offset_along_axis.distance
      default: 0.15
      range:
      - 0.08
      - 0.25
      type: scalar
  retries:
    max_attempts: 0
  subtask_id: lift_clear
  target:
    anchor: current_tcp
    entity: null
    offset:
    - 0.0
    - 0.0
    - 0.0
    offset_along_axis:
      axis: world_z
      distance: 0.15
      mode: add_to_offset
      sign: positive
    orientation:
      mode: keep_current
    source: yaml
    tolerance: 0.02
  termination: pose_tolerance
  type: lift
- control: position_control
  generator: linear_cartesian
  guards: []
  id: transport_to_goal
  parameters:
    transport_z:
      binds_to:
      - mode: replace
        path: target.offset.z
      default: 0.0
      range:
      - -0.05
      - 0.05
      type: scalar
  retries:
    max_attempts: 0
  subtask_id: place_goal
  target:
    anchor: task_goal
    entity: null
    offset:
    - 0.0
    - 0.0
    - 0.0
    orientation:
      mode: keep_current
    source: yaml
    tolerance: 0.02
  termination: pose_tolerance
  type: approach
- control: position_control
  end_effector_action: open
  generator: null
  guards: []
  id: place_release
  parameters:
    release_time:
      binds_to:
      - mode: replace
        path: duration.max_time
      default: 0.3
      range:
      - 0.1
      - 1.0
      type: scalar
  retries:
    max_attempts: 0
  target:
    anchor: current_tcp
    entity: null
    offset:
    - 0.0
    - 0.0
    - 0.0
    source: yaml
  termination: time_limit
  type: release
- control: position_control
  generator: linear_cartesian
  guards: []
  id: retract_after_place
  parameters:
    retract_distance:
      binds_to:
      - mode: replace
        path: target.offset_along_axis.distance
      default: 0.1
      range:
      - 0.05
      - 0.2
      type: scalar
  retries:
    max_attempts: 0
  target:
    anchor: current_tcp
    entity: null
    offset:
    - 0.0
    - 0.0
    - 0.0
    offset_along_axis:
      axis: world_z
      distance: 0.1
      mode: add_to_offset
      sign: positive
    orientation:
      mode: keep_current
    source: yaml
    tolerance: 0.02
  termination: pose_tolerance
  type: retract
skill: grasp_place
skill_type: arm_gripper
subtasks:
- anchor: object
  id: reach_object
  metric: distance
  offset:
  - 0.0
  - 0.0
  - 0.1
  target_entity: tcp
  weight: 0.2
- anchor: object
  id: grasp_contact
  metric: distance
  offset:
  - 0.0
  - 0.0
  - 0.03
  target_entity: tcp
  weight: 0.2
- anchor: goal
  id: lift_clear
  metric: distance
  offset:
  - 0.0
  - 0.0
  - 0.222
  target_entity: tcp
  weight: 0.1
- anchor: goal
  id: place_goal
  metric: goal_progress
  offset:
  - 0.0
  - 0.0
  - 0.0
  target_entity: object
  weight: 0.5
