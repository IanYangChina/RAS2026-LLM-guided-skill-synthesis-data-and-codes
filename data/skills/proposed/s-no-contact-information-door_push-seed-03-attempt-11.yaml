dsl_version: 2
phases:
- control: force_threshold_switch
  generator: linear_cartesian
  guards:
  - args: {}
    id: contact_verified
    on_failure: retry
    predicate: contact_detected
    threshold: 1.0
    when: after_phase
  id: contact_1
  parameters:
    contact_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.1
      range:
      - 0.01
      - 0.3
      type: scalar
    force_threshold:
      binds_to:
      - mode: replace
        path: termination.force_threshold
      default: 15.0
      range:
      - 5.0
      - 30.0
      type: scalar
  retries:
    max_attempts: 1
    offset:
    - 0.0
    - -0.02
    - 0.0
    strategy: offset_target
  subtask_id: hinge_progress
  target:
    anchor: site
    entity: door_handle
    offset:
    - 0.0
    - 0.0
    - 0.0
    orientation:
      mode: keep_current
    source: yaml
    tolerance: 0.07
  termination: force_exceeded
  type: contact
- control: admittance_control
  generator: linear_cartesian
  id: push_1
  parameters:
    push_distance:
      binds_to:
      - mode: replace
        path: target.offset_along_axis.distance
      default: 0.3
      range:
      - 0.1
      - 0.5
      type: scalar
    push_max_time:
      binds_to:
      - mode: replace
        path: duration.max_time
      default: 10.0
      range:
      - 5.0
      - 20.0
      type: scalar
    push_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.08
      range:
      - 0.01
      - 0.2
      type: scalar
  subtask_id: hinge_progress
  target:
    anchor: site
    entity: door_handle
    offset:
    - 0.0
    - 0.0
    - 0.0
    offset_along_axis:
      axis: world_y
      distance: 0.3
      mode: add_to_offset
      sign: negative
    orientation:
      mode: keep_current
    source: yaml
    tolerance: 0.02
  termination: time_limit
  type: push
skill: door_push
subtasks:
- anchor: fixture
  id: hinge_progress
  metric: hinge_angle
  target_entity: hinge
