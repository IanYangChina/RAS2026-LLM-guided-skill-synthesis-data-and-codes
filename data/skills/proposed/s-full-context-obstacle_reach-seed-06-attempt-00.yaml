dsl_version: 2
phases:
- control: impedance_control
  generator: linear_cartesian
  id: lift_to_clear
  parameters:
    lift_height:
      binds_to:
      - mode: add
        path: target.offset.z
      default: 0.3
      range:
      - 0.1
      - 0.4
      type: scalar
  subtask_id: approach_goal
  target:
    anchor: current_tcp
    offset:
    - 0
    - 0
    - 0
    orientation:
      mode: none
    tolerance: 0.02
  termination: pose_tolerance
  type: lift
- control: position_control
  generator: arc_cartesian
  id: approach_over
  parameters:
    approach_target_z_offset:
      binds_to:
      - mode: add
        path: target.offset.z
      default: 0.15
      range:
      - 0.05
      - 0.35
      type: scalar
    arc_height:
      binds_to:
      - mode: replace
        path: generator.arc_height
      default: 0.2
      range:
      - 0.05
      - 0.5
      type: scalar
    speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.1
      range:
      - 0.05
      - 0.2
      type: scalar
  target:
    anchor: task_goal
    offset:
    - 0
    - 0
    - 0
    orientation:
      mode: none
    tolerance: 0.02
  termination: pose_tolerance
  type: approach
- control: position_control
  generator: linear_cartesian
  id: descend_to_goal
  parameters:
    descend_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.05
      range:
      - 0.02
      - 0.15
      type: scalar
  subtask_id: approach_goal
  target:
    anchor: task_goal
    offset:
    - 0
    - 0
    - 0
    orientation:
      mode: none
    tolerance: 0.02
  termination: pose_tolerance
  type: descend
skill: obstacle_reach
skill_type: arm
subtasks:
- anchor: goal
  id: approach_goal
  metric: distance
  target_entity: tcp
  weight: 1.0
