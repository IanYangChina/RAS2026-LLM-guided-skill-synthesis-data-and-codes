dsl_version: 2
phases:
- control: position_control
  generator: linear_cartesian
  id: approach_peg
  orientation:
    mode: keep_current
  subtask_id: reach_peg
  target:
    anchor: task_object
    offset:
    - 0.0
    - 0.0
    - 0.1
    source: yaml
    tolerance: 0.02
  termination: pose_tolerance
  type: approach
- control: force_threshold_switch
  generator: linear_cartesian
  guards:
  - id: high_force
    on_failure: abort
    predicate: force_below
    threshold: 100.0
    when: during_phase
  id: descend_contact
  orientation:
    mode: keep_current
  parameters:
    contact_force_threshold:
      binds_to:
      - path: termination.force_threshold
      default: 12.0
      range:
      - 5.0
      - 25.0
      type: scalar
  target:
    anchor: task_object
    offset:
    - 0.0
    - 0.0
    - -0.005
    source: yaml
    tolerance: 0.01
  termination: force_exceeded
  type: descend
- control: admittance_control
  generator: linear_cartesian
  guards:
  - id: progress_guard
    on_failure: continue
    predicate: object_progress
    threshold: 0.85
    when: during_phase
  id: push_to_goal
  orientation:
    mode: keep_current
  parameters:
    lateral_x:
      binds_to:
      - path: target.offset.x
      default: 0.0
      range:
      - -0.01
      - 0.01
      type: scalar
    lateral_z:
      binds_to:
      - path: target.offset.z
      default: 0.0
      range:
      - -0.01
      - 0.01
      type: scalar
    push_distance:
      binds_to:
      - path: target.offset_along_axis.distance
      default: 0.16
      range:
      - 0.06
      - 0.2
      type: scalar
    push_speed:
      binds_to:
      - path: generator.speed
      default: 0.06
      range:
      - 0.02
      - 0.1
      type: scalar
  retries:
    max_attempts: 1
    offset:
    - 0.0
    - 0.0
    - 0.005
    strategy: offset_target
  subtask_id: push_progress
  target:
    anchor: task_object
    offset:
    - 0.0
    - 0.0
    - 0.0
    offset_along_axis:
      axis: channel_axis
      distance: 0.16
      mode: replace_offset_projection
      sign: negative
    source: yaml
    tolerance: 0.03
  termination: time_limit
  type: push
- control: admittance_control
  generator: linear_cartesian
  guards:
  - id: high_force_guard
    on_failure: abort
    predicate: force_below
    threshold: 50.0
    when: before_phase
  id: insert_goal
  orientation:
    align_with: channel_axis
    axis:
    - 0.0
    - 1.0
    - 0.0
    mode: align_axis
    tolerance: 0.15
  parameters:
    insert_force:
      binds_to:
      - path: termination.force_threshold
      default: 15.0
      range:
      - 5.0
      - 30.0
      type: scalar
    insert_speed:
      binds_to:
      - path: generator.speed
      default: 0.02
      range:
      - 0.01
      - 0.05
      type: scalar
  subtask_id: insert_final
  target:
    anchor: task_goal
    offset:
    - 0.0
    - 0.0
    - 0.0
    source: yaml
    tolerance: 0.01
  termination: force_exceeded
  type: insert
skill: peg_channel
skill_type: arm_gripper
subtasks:
- anchor: object
  id: reach_peg
  offset:
  - 0.0
  - 0.0
  - 0.1
  target_entity: tcp
  weight: 0.2
- anchor: goal
  id: push_progress
  metric: goal_progress
  target_entity: object
  weight: 0.5
- anchor: goal
  id: insert_final
  metric: distance
  offset:
  - 0.0
  - 0.0
  - 0.0
  target_entity: tcp
  weight: 0.3
