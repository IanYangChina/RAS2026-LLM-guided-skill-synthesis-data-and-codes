dsl_version: 2
phases:
- control: position_control
  generator: linear_cartesian
  id: approach_1
  parameters:
    approach_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.2
      range:
      - 0.05
      - 0.5
      type: scalar
    approach_tolerance:
      binds_to:
      - mode: replace
        path: termination.pose_tolerance
      default: 0.01
      range:
      - 0.005
      - 0.02
      type: scalar
  subtask_id: pre_contact
  target:
    anchor: world
    offset:
    - 0.5
    - 0.1
    - 0.09
    orientation:
      mode: none
    source: yaml
    tolerance: 0.01
  termination: pose_tolerance
  type: approach
- control: impedance_control
  generator: linear_cartesian
  id: descend_contact
  parameters:
    contact_force_threshold:
      binds_to:
      - mode: replace
        path: termination.force_threshold
      default: 5.0
      range:
      - 2.0
      - 15.0
      type: scalar
    contact_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.05
      range:
      - 0.01
      - 0.2
      type: scalar
  subtask_id: pre_contact
  target:
    anchor: world
    offset:
    - 0.5
    - 0.06
    - 0.04
    orientation:
      mode: none
    source: yaml
  termination: force_exceeded
  type: contact
- control: impedance_control
  generator: linear_cartesian
  id: push_1
  parameters:
    max_push_time:
      binds_to:
      - mode: replace
        path: duration.max_time
      default: 3.0
      range:
      - 1.0
      - 5.0
      type: scalar
    push_distance:
      binds_to:
      - mode: replace
        path: target.offset_along_axis.distance
      default: 0.2
      range:
      - 0.1
      - 0.25
      type: scalar
    push_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.03
      range:
      - 0.01
      - 0.1
      type: scalar
  subtask_id: push_progress
  target:
    anchor: current_tcp
    offset:
    - 0.0
    - 0.0
    - 0.0
    offset_along_axis:
      axis: channel_axis
      distance: 0.2
      mode: add_to_offset
      sign: positive
    orientation:
      align_with: channel_axis
      axis:
      - 0.0
      - 0.0
      - -1.0
      mode: align_axis
      tolerance: 0.1
    source: yaml
  termination: time_limit
  type: push
skill: peg_channel
subtasks:
- anchor: goal
  id: pre_contact
  metric: distance
  offset:
  - 0.0
  - 0.18
  - 0.05
  target_entity: tcp
  weight: 0.3
- anchor: goal
  id: push_progress
  metric: goal_progress
  target_entity: object
  weight: 0.7
