dsl_version: 2
phases:
- control: position_control
  generator: arc_cartesian
  id: approach_to_object
  orientation:
    mode: keep_current
  parameters:
    approach_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.1
      range:
      - 0.05
      - 0.2
      type: scalar
    arc_height:
      binds_to:
      - mode: replace
        path: generator.arc_height
      default: 0.05
      range:
      - 0.02
      - 0.1
      type: scalar
  subtask_id: approach
  target:
    anchor: task_object
    offset:
    - 0
    - 0.08
    - 0
    source: yaml
  termination: pose_tolerance
  type: approach
- control: force_threshold_switch
  generator: linear_cartesian
  id: descend_to_contact
  orientation:
    mode: keep_current
  parameters:
    contact_force_threshold:
      binds_to:
      - mode: replace
        path: termination.force_threshold
      default: 5.0
      range:
      - 1.0
      - 10.0
      type: scalar
  subtask_id: contact
  target:
    anchor: task_object
    offset:
    - 0
    - 0.03
    - 0
    source: yaml
  termination: force_exceeded
  type: descend
- control: impedance_control
  generator: impedance_motion
  guards:
  - args: {}
    id: contact_guard
    on_failure: retry
    predicate: force_below
    threshold: 2.0
    when: during_phase
  id: push_to_goal
  orientation:
    align_with: push_direction
    axis:
    - 0
    - 0
    - 1
    mode: align_axis
  parameters:
    push_depth:
      binds_to:
      - mode: replace
        path: target.offset_along_axis.distance
      default: 0.15
      range:
      - 0.05
      - 0.25
      type: scalar
    push_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.08
      range:
      - 0.02
      - 0.15
      type: scalar
  retries:
    max_attempts: 2
    offset:
    - -0.005
    - 0.005
    - 0
    strategy: offset_target
  subtask_id: push
  target:
    anchor: task_goal
    offset:
    - 0
    - 0.03
    - 0
    offset_along_axis:
      axis: push_direction
      distance: 0.15
      mode: add_to_offset
      sign: positive
    source: yaml
  termination: pose_tolerance
  type: push
skill: push_to_goal
skill_type: arm
