dsl_version: 2
phases:
- control: position_control
  generator: arc_cartesian
  id: approach_handle
  parameters:
    speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.08
      range:
      - 0.01
      - 0.15
      type: scalar
    termination:
      pose_tolerance: 0.02
  subtask_id: reach_handle
  target:
    anchor: site
    entity: door_handle
    offset:
    - 0.0
    - 0.0
    - 0.1
    orientation:
      mode: keep_current
    source: yaml
  termination: pose_tolerance
  type: approach
- control: position_control
  generator: linear_cartesian
  id: align_handle
  parameters:
    lateral_offset_x:
      binds_to:
      - mode: add
        path: target.offset.x
      default: 0.0
      range:
      - -0.02
      - 0.02
      type: scalar
    lateral_offset_y:
      binds_to:
      - mode: add
        path: target.offset.y
      default: 0.0
      range:
      - -0.02
      - 0.02
      type: scalar
  subtask_id: reach_handle
  target:
    anchor: site
    entity: door_handle
    offset:
    - 0.0
    - 0.0
    - 0.0
    orientation:
      mode: keep_current
    source: yaml
  termination: pose_tolerance
  type: align
- control: position_control
  end_effector_action: force_grasp
  generator: null
  id: grasp_handle
  parameters:
    grip_force:
      default: 15.0
      range:
      - 5.0
      - 30.0
      type: scalar
  target:
    anchor: current_tcp
    source: yaml
  termination: grasp_success
  type: grasp
- control: impedance_control
  generator: linear_cartesian
  guards:
  - args: {}
    id: force_limit
    on_failure: retry
    predicate: force_below
    threshold: 30.0
    when: during_phase
  - args: {}
    id: hinge_check
    on_failure: continue
    predicate: hinge_delta_reached
    threshold: 0.9
    when: after_phase
  id: push_handle
  parameters:
    push_distance:
      binds_to:
      - mode: replace
        path: target.offset_along_axis.distance
      default: 0.15
      range:
      - 0.05
      - 0.3
      type: scalar
    push_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.05
      range:
      - 0.01
      - 0.1
      type: scalar
    push_time:
      binds_to:
      - mode: replace
        path: duration.max_time
      default: 5.0
      range:
      - 2.0
      - 10.0
      type: scalar
  retries:
    max_attempts: 2
    strategy: reduce_speed
  subtask_id: push_door
  target:
    anchor: task_goal
    offset:
    - 0.0
    - 0.0
    - 0.0
    offset_along_axis:
      axis: task_goal_direction
      distance: 0.15
      mode: add_to_offset
      sign: positive
    orientation:
      mode: keep_current
    source: yaml
  termination: time_limit
  type: push
- control: position_control
  end_effector_action: open
  generator: null
  id: release_handle
  parameters: {}
  target:
    anchor: current_tcp
    source: yaml
  termination: time_limit
  type: release
skill: door_push
skill_type: arm_gripper
subtasks:
- anchor: goal
  id: reach_handle
  metric: distance
  target_entity: tcp
  weight: 0.3
- anchor: goal
  id: push_door
  metric: goal_progress
  target_entity: hinge
  weight: 1.0
