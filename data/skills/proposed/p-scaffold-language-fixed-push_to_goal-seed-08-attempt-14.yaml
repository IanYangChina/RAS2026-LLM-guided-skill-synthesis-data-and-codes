dsl_version: 2
phases:
- control: position_control
  generator: linear_cartesian
  guards: []
  id: approach_1
  parameters:
    approach_height:
      binds_to:
      - mode: add
        path: target.offset.z
      default: 0.15
      range:
      - 0.05
      - 0.3
      type: scalar
  retries:
    max_attempts: 1
    strategy: repeat
  subtask_id: approach
  target:
    anchor: task_object
    entity: push_box
    offset:
    - 0
    - 0
    - 0
    orientation:
      mode: keep_current
    source: yaml
  termination: pose_tolerance
  type: approach
- control: force_threshold_switch
  generator: linear_cartesian
  guards: []
  id: contact_1
  parameters:
    contact_force_threshold:
      binds_to:
      - mode: add
        path: termination.force_threshold
      default: 3.0
      range:
      - 1.0
      - 10.0
      type: scalar
  retries:
    max_attempts: 1
    strategy: repeat
  subtask_id: contact
  target:
    anchor: task_object
    entity: push_box
    offset:
    - 0
    - 0
    - 0
    orientation:
      mode: keep_current
    source: yaml
  termination: force_exceeded
  type: contact
- control: impedance_control
  generator: linear_cartesian
  guards:
  - args: {}
    id: maintain_contact
    on_failure: abort
    predicate: contact_detected
    threshold: 0.0
    when: during_phase
  id: push_1
  parameters:
    push_distance:
      binds_to:
      - mode: add
        path: target.offset_along_axis.distance
      default: 0.1
      range:
      - 0.02
      - 0.2
      type: scalar
    push_force_threshold:
      binds_to:
      - mode: add
        path: termination.force_threshold
      default: 15.0
      range:
      - 5.0
      - 25.0
      type: scalar
    push_speed:
      binds_to:
      - mode: add
        path: generator.speed
      default: 0.05
      range:
      - 0.01
      - 0.1
      type: scalar
  retries:
    max_attempts: 2
    offset:
    - 0
    - -0.01
    - 0
    strategy: offset_target
  subtask_id: push
  target:
    anchor: task_goal
    entity: task_goal
    offset:
    - 0
    - 0
    - 0
    offset_along_axis:
      axis: task_goal_direction
      distance: 0.1
      mode: add_to_offset
      sign: positive
    orientation:
      align_with: task_goal_direction
      axis:
      - 0
      - 0
      - 1
      mode: align_axis
      tolerance: 0.1
    source: yaml
  termination: force_exceeded
  type: push
- control: position_control
  generator: linear_cartesian
  guards: []
  id: retract_1
  parameters:
    retract_height:
      binds_to:
      - mode: add
        path: target.offset.z
      default: 0.1
      range:
      - 0.05
      - 0.2
      type: scalar
    retract_speed:
      binds_to:
      - mode: add
        path: generator.speed
      default: 0.05
      range:
      - 0.01
      - 0.1
      type: scalar
  retries:
    max_attempts: 1
    strategy: repeat
  target:
    anchor: current_tcp
    offset:
    - 0
    - 0
    - 0.1
    orientation:
      mode: keep_current
    source: yaml
  termination: pose_tolerance
  type: retract
skill: push_to_goal
subtasks:
- anchor: object
  id: approach
  metric: distance
  offset:
  - 0
  - 0.08
  - 0
  target_entity: push_box
  weight: 1.0
- anchor: object
  id: contact
  metric: distance
  offset:
  - 0
  - 0.03
  - 0
  target_entity: push_box
  weight: 1.0
- anchor: goal
  id: push
  metric: goal_progress
  offset:
  - 0
  - 0.03
  - 0
  target_entity: task_goal
  weight: 1.0
