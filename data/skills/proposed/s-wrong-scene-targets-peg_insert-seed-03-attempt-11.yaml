dsl_version: 2
phases:
- control: position_control
  generator: linear_cartesian
  id: retract_1
  parameters:
    lift_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.05
      range:
      - 0.02
      - 0.1
      type: scalar
  subtask_id: lift_peg
  target:
    anchor: task_object
    offset:
    - 0
    - 0
    - 0.25
    orientation:
      mode: keep_current
    source: yaml
  termination: pose_tolerance
  type: retract
- control: position_control
  generator: linear_cartesian
  id: approach_1
  parameters:
    approach_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.05
      range:
      - 0.02
      - 0.1
      type: scalar
  subtask_id: reach_above_socket
  target:
    anchor: fixture
    entity: peg_socket
    offset:
    - 0
    - 0
    - 0.1
    orientation:
      align_with: world_z
      axis:
      - 0
      - 0
      - 1
      mode: align_axis
      tolerance: 0.05
    source: yaml
  termination: pose_tolerance
  type: approach
- control: impedance_control
  generator: linear_cartesian
  guards:
  - args: {}
    id: insertion_force_guard
    on_failure: retry
    predicate: force_below
    threshold: 45
    when: during_phase
  id: descend_1
  parameters:
    descend_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.03
      range:
      - 0.01
      - 0.05
      type: scalar
    force_threshold:
      binds_to:
      - mode: replace
        path: termination.force_threshold
      default: 40
      range:
      - 30
      - 50
      type: scalar
    insertion_depth:
      binds_to:
      - mode: replace
        path: target.offset_along_axis.distance
      default: 0.05
      range:
      - 0.02
      - 0.08
      type: scalar
  retries:
    max_attempts: 2
    offset:
    - 0.005
    - 0.005
    - 0
    strategy: offset_target
  subtask_id: insert_peg
  target:
    anchor: fixture
    entity: peg_socket
    offset:
    - 0
    - 0
    - 0
    offset_along_axis:
      axis: channel_axis
      distance: 0.05
      mode: add_to_offset
      sign: negative
    orientation:
      align_with: world_z
      axis:
      - 0
      - 0
      - 1
      mode: align_axis
      tolerance: 0.05
    source: yaml
  termination: force_exceeded
  type: descend
skill: peg_insert
subtasks:
- anchor: object
  id: lift_peg
  offset:
  - 0
  - 0
  - 0.25
  target_entity: tcp
  weight: 0.3
- anchor: fixture
  id: reach_above_socket
  offset:
  - 0
  - 0
  - 0.1
  target_entity: tcp
  weight: 0.3
- anchor: goal
  id: insert_peg
  metric: goal_progress
  target_entity: object
  weight: 0.4
