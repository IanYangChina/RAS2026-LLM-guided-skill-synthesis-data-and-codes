dsl_version: 2
phases:
- control: position_control
  generator: linear_cartesian
  guards:
  - args: {}
    id: approach_pose_check
    on_failure: retry
    predicate: pose_within_tolerance
    threshold: 0.02
    when: after_phase
  id: approach_above_socket
  orientation:
    align_with: channel_axis
    axis:
    - 0
    - 0
    - 1
    mode: align_axis
    tolerance: 0.1
  parameters:
    approach_height:
      binds_to:
      - mode: replace
        path: target.offset.z
      default: 0.01
      range:
      - 0.0
      - 0.03
      type: scalar
  retries:
    max_attempts: 2
    offset:
    - 0.01
    - 0.01
    - 0.0
    strategy: offset_target
  subtask_id: reach_approach
  target:
    anchor: task_goal
    offset:
    - 0.0
    - 0.0
    - 0.01
    source: yaml
    tolerance: 0.02
  termination: pose_tolerance
  type: approach
- control: impedance_control
  generator: linear_cartesian
  guards:
  - args: {}
    id: insertion_force_limit
    on_failure: retry
    predicate: force_below
    threshold: 30.0
    when: during_phase
  id: insert_into_hole
  orientation:
    mode: keep_current
  parameters:
    insertion_depth:
      binds_to:
      - mode: replace
        path: target.offset_along_axis.distance
      default: 0.05
      range:
      - 0.02
      - 0.08
      type: scalar
    insertion_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.02
      range:
      - 0.01
      - 0.05
      type: scalar
    insertion_tolerance:
      binds_to:
      - mode: replace
        path: termination.pose_tolerance
      default: 0.01
      range:
      - 0.005
      - 0.02
      type: scalar
  retries:
    max_attempts: 2
    strategy: reduce_speed
  subtask_id: insert
  target:
    anchor: current_tcp
    offset:
    - 0.0
    - 0.0
    - 0.0
    offset_along_axis:
      axis: channel_axis
      distance: 0.05
      mode: add_to_offset
      sign: negative
    source: yaml
    tolerance: 0.01
  termination: pose_tolerance
  type: insert
skill: peg_insert
subtasks:
- anchor: goal
  id: reach_approach
  metric: distance
  offset:
  - 0.0
  - 0.0
  - 0.01
  target_entity: tcp
  weight: 0.3
- anchor: goal
  id: insert
  metric: goal_progress
  offset:
  - 0.0
  - 0.0
  - 0.0
  target_entity: tcp
  weight: 0.7
