dsl_version: 2
phases:
- control: position_control
  generator: linear_cartesian
  id: approach_peg
  parameters:
    approach_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.15
      range:
      - 0.05
      - 0.3
      type: scalar
  subtask_id: approach_peg
  target:
    anchor: task_object
    offset:
    - 0.0
    - 0.0
    - 0.1
    orientation:
      mode: keep_current
    source: yaml
    tolerance: 0.02
  termination: pose_tolerance
  type: approach
- control: position_control
  generator: linear_cartesian
  id: descend_to_peg
  parameters:
    descend_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.05
      range:
      - 0.02
      - 0.1
      type: scalar
    lateral_offset_x:
      binds_to:
      - mode: add
        path: target.offset.x
      default: 0.0
      range:
      - -0.02
      - 0.02
      type: scalar
  subtask_id: contact_peg
  target:
    anchor: task_object
    offset:
    - 0.0
    - 0.0
    - 0.0
    orientation:
      align_with: channel_axis
      axis:
      - 0.0
      - 0.0
      - 1.0
      mode: align_axis
      tolerance: 0.05
    source: yaml
    tolerance: 0.02
  termination: pose_tolerance
  type: descend
- control: position_control
  generator: linear_cartesian
  id: lateral_align
  parameters:
    lateral_offset_x:
      binds_to:
      - mode: add
        path: target.offset.x
      default: 0.0
      range:
      - -0.02
      - 0.02
      type: scalar
  subtask_id: contact_peg
  target:
    anchor: task_object
    offset:
    - 0.0
    - 0.0
    - 0.0
    orientation:
      mode: keep_current
    source: yaml
    tolerance: 0.02
  termination: pose_tolerance
  type: align
- control: impedance_control
  generator: impedance_motion
  guards:
  - args: {}
    id: contact_guard
    on_failure: retry
    predicate: contact_detected
    threshold: 40.0
    when: during_phase
  id: push_along_channel
  parameters:
    push_distance:
      binds_to:
      - mode: replace
        path: target.offset_along_axis.distance
      default: 0.16
      range:
      - 0.12
      - 0.2
      type: scalar
    push_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.07
      range:
      - 0.02
      - 0.12
      type: scalar
    push_tolerance:
      binds_to:
      - mode: replace
        path: termination.pose_tolerance
      default: 0.02
      range:
      - 0.01
      - 0.03
      type: scalar
    retry_lateral_x:
      binds_to:
      - mode: replace
        path: retry.offset.x
      default: 0.01
      range:
      - 0.005
      - 0.02
      type: scalar
  retries:
    max_attempts: 2
    offset:
    - 0.01
    - 0.0
    - 0.0
    strategy: offset_target
  subtask_id: push_through_channel
  target:
    anchor: task_goal
    offset:
    - 0.0
    - 0.0
    - 0.0
    offset_along_axis:
      axis: channel_axis
      distance: 0.16
      mode: replace_offset_projection
      sign: positive
    orientation:
      align_with: channel_axis
      axis:
      - 0.0
      - 0.0
      - 1.0
      mode: align_axis
      tolerance: 0.05
    source: yaml
    tolerance: 0.02
  termination: pose_tolerance
  type: push
skill: peg_channel
subtasks:
- anchor: object
  id: approach_peg
  metric: distance
  offset:
  - 0.0
  - 0.0
  - 0.1
  target_entity: tcp
  weight: 0.2
- anchor: object
  id: contact_peg
  metric: distance
  offset:
  - 0.0
  - 0.0
  - 0.0
  target_entity: tcp
  weight: 0.3
- anchor: goal
  id: push_through_channel
  metric: goal_progress
  target_entity: tcp
  weight: 0.5
