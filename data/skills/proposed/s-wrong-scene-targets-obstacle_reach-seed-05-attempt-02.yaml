dsl_version: 2
phases:
- control: position_control
  generator: arc_cartesian
  id: approach_fixture
  parameters:
    arc_height:
      binds_to:
      - mode: add
        path: generator.arc_height
      default: 0.15
      range:
      - 0.05
      - 0.3
      type: scalar
    speed:
      binds_to:
      - mode: add
        path: generator.speed
      default: 0.05
      range:
      - 0.01
      - 0.2
      type: scalar
    tolerance:
      binds_to:
      - mode: add
        path: termination.pose_tolerance
      default: 0.05
      range:
      - 0.02
      - 0.1
      type: scalar
  subtask_id: reach_goal
  target:
    anchor: fixture
    offset:
    - 0.0
    - 0.0
    - 0.0
    source: yaml
  termination: pose_tolerance
  type: approach
- control: position_control
  generator: linear_cartesian
  id: fine_align
  parameters:
    speed:
      binds_to:
      - mode: add
        path: generator.speed
      default: 0.03
      range:
      - 0.01
      - 0.1
      type: scalar
    tolerance:
      binds_to:
      - mode: add
        path: termination.pose_tolerance
      default: 0.01
      range:
      - 0.005
      - 0.02
      type: scalar
  subtask_id: reach_goal
  target:
    anchor: fixture
    offset:
    - 0.0
    - 0.0
    - 0.0
    source: yaml
  termination: pose_tolerance
  type: align
skill: obstacle_reach
subtasks:
- id: reach_goal
