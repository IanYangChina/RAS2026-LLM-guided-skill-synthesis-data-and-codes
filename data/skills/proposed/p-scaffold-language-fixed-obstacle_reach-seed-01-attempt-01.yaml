dsl_version: 2
phases:
- control: position_control
  generator: linear_cartesian
  id: rise_above_obstacle
  parameters:
    rise_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.08
      range:
      - 0.01
      - 0.2
      type: scalar
    rise_z:
      binds_to:
      - mode: replace
        path: target.offset.z
      default: 0.3
      range:
      - 0.15
      - 0.5
      type: scalar
  target:
    anchor: current_tcp
    offset:
    - 0.0
    - 0.0
    - 0.3
    orientation:
      mode: none
    source: yaml
    tolerance: 0.02
  termination: pose_tolerance
  type: approach
- control: position_control
  generator: arc_cartesian
  id: approach_over_obstacle
  parameters:
    approach_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.1
      range:
      - 0.01
      - 0.2
      type: scalar
    arc_height:
      binds_to:
      - mode: replace
        path: generator.arc_height
      default: 0.4
      range:
      - 0.1
      - 0.8
      type: scalar
    goal_approach_z:
      binds_to:
      - mode: replace
        path: target.offset.z
      default: 0.3
      range:
      - 0.2
      - 0.8
      type: scalar
  target:
    anchor: task_goal
    offset:
    - 0.0
    - 0.0
    - 0.3
    orientation:
      mode: none
    source: yaml
    tolerance: 0.02
  termination: pose_tolerance
  type: approach
- control: position_control
  generator: linear_cartesian
  guards:
  - args: {}
    id: guard_contact
    on_failure: retry
    predicate: contact_detected
    threshold: 1
    when: during_phase
  id: descend_to_goal
  parameters:
    descend_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.05
      range:
      - 0.01
      - 0.1
      type: scalar
    retreat_x:
      binds_to:
      - mode: replace
        path: retry.offset.x
      default: 0.05
      range:
      - 0.0
      - 0.1
      type: scalar
  retries:
    max_attempts: 2
    offset:
    - 0.05
    - 0.0
    - 0.0
    strategy: offset_target
  target:
    anchor: task_goal
    offset:
    - 0.0
    - 0.0
    - 0.0
    orientation:
      mode: none
    source: yaml
    tolerance: 0.02
  termination: pose_tolerance
  type: descend
skill: obstacle_reach
