dsl_version: 2
phases:
- control: position_control
  generator: arc_cartesian
  id: approach_to_door
  parameters:
    approach_height:
      binds_to:
      - mode: replace
        path: target.offset.z
      default: 0.4
      range:
      - 0.2
      - 0.6
      type: scalar
    speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.06
      range:
      - 0.02
      - 0.15
      type: scalar
  subtask_id: pre_push_position
  target:
    anchor: task_object
    offset:
    - 0.0
    - 0.0
    - 0.4
    orientation:
      mode: keep_current
    source: yaml
  termination: pose_tolerance
  type: approach
- control: impedance_control
  generator: linear_cartesian
  guards:
  - id: force_limit
    on_failure: retry
    predicate: force_below
    threshold: 28.0
    when: during_phase
  id: push_door_open
  parameters:
    push_contact_height:
      binds_to:
      - mode: replace
        path: target.offset.z
      default: 0.4
      range:
      - 0.2
      - 0.6
      type: scalar
    push_distance:
      binds_to:
      - mode: replace
        path: target.offset_along_axis.distance
      default: 0.35
      range:
      - 0.05
      - 0.6
      type: scalar
    push_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.03
      range:
      - 0.01
      - 0.08
      type: scalar
  retries:
    max_attempts: 2
    offset:
    - 0.0
    - 0.02
    - 0.0
    strategy: offset_target
  subtask_id: push_complete
  target:
    anchor: task_object
    offset:
    - 0.0
    - 0.0
    - 0.4
    offset_along_axis:
      axis: world_x
      distance: 0.35
      mode: add_to_offset
      sign: negative
    orientation:
      mode: keep_current
    source: yaml
  termination: pose_tolerance
  type: push
skill: door_push
subtasks:
- anchor: object
  id: pre_push_position
  metric: distance
  offset:
  - 0.0
  - 0.0
  - 0.4
  target_entity: tcp
  weight: 0.3
- anchor: goal
  id: push_complete
  metric: distance
  target_entity: tcp
  weight: 0.7
