dsl_version: 2
phases:
- control: position_control
  generator: linear_cartesian
  id: approach_1
  parameters:
    approach_height:
      binds_to:
      - mode: replace
        path: target.offset.z
      default: 0.2
      range:
      - 0.05
      - 0.3
      type: scalar
    approach_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.3
      range:
      - 0.1
      - 0.5
      type: scalar
    approach_tolerance:
      binds_to:
      - mode: replace
        path: termination.pose_tolerance
      default: 0.03
      range:
      - 0.01
      - 0.05
      type: scalar
  target:
    anchor: task_goal
    offset:
    - 0.0
    - 0.0
    - 0.2
    orientation:
      mode: keep_current
    source: yaml
    tolerance: 0.03
  termination: pose_tolerance
  type: approach
- control: position_control
  generator: linear_cartesian
  id: descend_1
  parameters:
    descend_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.25
      range:
      - 0.1
      - 0.5
      type: scalar
    descend_tolerance:
      binds_to:
      - mode: replace
        path: termination.pose_tolerance
      default: 0.025
      range:
      - 0.01
      - 0.03
      type: scalar
  target:
    anchor: task_goal
    offset:
    - 0.0
    - 0.0
    - 0.0
    orientation:
      mode: keep_current
    source: yaml
    tolerance: 0.025
  termination: pose_tolerance
  type: descend
- control: position_control
  generator: linear_cartesian
  id: refine_1
  parameters:
    refine_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.05
      range:
      - 0.02
      - 0.2
      type: scalar
    refine_tolerance:
      binds_to:
      - mode: replace
        path: termination.pose_tolerance
      default: 0.015
      range:
      - 0.005
      - 0.02
      type: scalar
  target:
    anchor: task_goal
    offset:
    - 0.0
    - 0.0
    - 0.0
    orientation:
      mode: keep_current
    source: yaml
    tolerance: 0.015
  termination: pose_tolerance
  type: descend
skill: obstacle_reach
