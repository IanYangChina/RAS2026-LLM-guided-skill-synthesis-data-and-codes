dsl_version: 2
phases:
- control: impedance_control
  generator: arc_cartesian
  id: lift_and_clear
  parameters:
    arc_height:
      binds_to:
      - mode: add
        path: generator.arc_height
      default: 0.3
      range:
      - 0.1
      - 0.5
      type: scalar
    speed_clear:
      binds_to:
      - mode: add
        path: generator.speed
      default: 0.2
      range:
      - 0.05
      - 0.5
      type: scalar
  subtask_id: pre_approach
  target:
    anchor: task_goal
    offset:
    - -0.137
    - -0.2
    - 0.35
    orientation:
      mode: keep_current
    tolerance: 0.02
  termination: pose_tolerance
  type: approach
- control: position_control
  generator: linear_cartesian
  id: approach_goal
  parameters:
    speed_approach:
      binds_to:
      - mode: add
        path: generator.speed
      default: 0.2
      range:
      - 0.05
      - 0.5
      type: scalar
  subtask_id: final_approach
  target:
    anchor: task_goal
    offset:
    - 0
    - 0
    - 0.05
    orientation:
      mode: keep_current
    tolerance: 0.02
  termination: pose_tolerance
  type: approach
- control: admittance_control
  generator: linear_cartesian
  id: descend_to_goal
  subtask_id: reach_goal
  target:
    anchor: task_goal
    offset:
    - 0
    - 0
    - 0
    orientation:
      mode: keep_current
    tolerance: 0.015
  termination: pose_tolerance
  type: descend
skill: obstacle_reach
skill_type: arm
subtasks:
- anchor: goal
  id: pre_approach
  metric: distance
  offset:
  - -0.137
  - -0.2
  - 0.35
  target_entity: tcp
  weight: 0.3
- anchor: goal
  id: final_approach
  metric: distance
  offset:
  - 0
  - 0
  - 0.05
  target_entity: tcp
  weight: 0.3
- anchor: goal
  id: reach_goal
  metric: distance
  offset:
  - 0
  - 0
  - 0
  target_entity: tcp
  weight: 0.4
