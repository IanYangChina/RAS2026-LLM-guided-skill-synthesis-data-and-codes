dsl_version: 2
parameters:
  approach_x:
    binds_to:
    - mode: add
      path: phases.0.target.offset.x
    - mode: add
      path: phases.1.target.offset.x
    - mode: add
      path: phases.2.target.offset.x
    default: 0.044
    range:
    - -0.1
    - 0.2
    type: scalar
  approach_y:
    binds_to:
    - mode: add
      path: phases.0.target.offset.y
    - mode: add
      path: phases.1.target.offset.y
    - mode: add
      path: phases.2.target.offset.y
    default: 0.124
    range:
    - -0.2
    - 0.2
    type: scalar
  approach_z:
    binds_to:
    - mode: add
      path: phases.0.target.offset.z
    default: 0.1
    range:
    - 0.05
    - 0.2
    type: scalar
  descend_z:
    binds_to:
    - mode: add
      path: phases.1.target.offset.z
    - mode: add
      path: phases.2.target.offset.z
    default: 0.025
    range:
    - 0.02
    - 0.05
    type: scalar
  push_distance:
    binds_to:
    - mode: add
      path: phases.2.target.offset_along_axis.distance
    default: 0.15
    range:
    - 0.05
    - 0.3
    type: scalar
  push_speed:
    binds_to:
    - mode: add
      path: phases.2.generator.speed
    default: 0.05
    range:
    - 0.01
    - 0.1
    type: scalar
  retract_height:
    binds_to:
    - mode: add
      path: phases.3.target.offset.z
    default: 0.1
    range:
    - 0.05
    - 0.2
    type: scalar
  termination_tolerance:
    binds_to:
    - mode: add
      path: phases.0.termination.pose_tolerance
    - mode: add
      path: phases.1.termination.pose_tolerance
    - mode: add
      path: phases.3.termination.pose_tolerance
    default: 0.01
    range:
    - 0.005
    - 0.05
    type: scalar
phases:
- control: position_control
  generator: linear_cartesian
  id: approach_object
  subtask_id: reach_object
  target:
    anchor: task_object
    offset:
    - 0.0
    - 0.0
    - 0.0
    orientation:
      mode: keep_current
    source: yaml
  termination: pose_tolerance
  type: approach
- control: position_control
  generator: linear_cartesian
  id: descend_to_contact
  target:
    anchor: task_object
    offset:
    - 0.0
    - 0.0
    - 0.0
    orientation:
      mode: keep_current
    source: yaml
  termination: pose_tolerance
  type: descend
- control: admittance_control
  generator: linear_cartesian
  id: push_to_goal
  parameters:
    push_timeout:
      binds_to:
      - mode: add
        path: phases.2.duration.max_time
      default: 5.0
      range:
      - 2.0
      - 10.0
      type: scalar
  subtask_id: push_to_goal
  target:
    anchor: task_object
    offset:
    - 0.0
    - 0.0
    - 0.0
    offset_along_axis:
      axis: task_goal_direction
      distance: 0.15
      mode: add_to_offset
      sign: positive
    orientation:
      align_with: task_goal_direction
      axis:
      - 1.0
      - 0.0
      - 0.0
      mode: align_axis
      tolerance: 0.1
    source: yaml
  termination: time_limit
  type: push
- control: position_control
  generator: linear_cartesian
  id: retract
  target:
    anchor: task_object
    offset:
    - 0.0
    - 0.0
    - 0.1
    orientation:
      mode: keep_current
    source: yaml
  termination: pose_tolerance
  type: retract
skill: push_to_goal
skill_type: arm
subtasks:
- anchor: object
  id: reach_object
  metric: distance
  offset:
  - 0.044
  - 0.124
  - 0.025
  target_entity: tcp
  weight: 0.3
- anchor: goal
  id: push_to_goal
  metric: distance
  offset:
  - 0.0
  - 0.0
  - 0.0
  target_entity: object
  weight: 0.7
