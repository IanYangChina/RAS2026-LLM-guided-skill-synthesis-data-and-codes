dsl_version: 2
phases:
- control: position_control
  generator: linear_cartesian
  id: approach_side
  parameters:
    approach_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.1
      range:
      - 0.02
      - 0.2
      type: scalar
    lateral_offset:
      binds_to:
      - mode: replace
        path: target.offset.y
      default: 0.06
      range:
      - 0.04
      - 0.08
      type: scalar
  subtask_id: contact_object
  target:
    anchor: task_object
    offset:
    - 0.0
    - 0.06
    - 0.0
    orientation:
      mode: keep_current
    source: yaml
    tolerance: 0.005
  termination: pose_tolerance
  type: approach
- control: impedance_control
  generator: linear_cartesian
  guards:
  - args: {}
    id: contact_force
    on_failure: retry
    predicate: force_below
    threshold: 20.0
    when: during_phase
  id: push
  parameters:
    push_distance:
      binds_to:
      - mode: replace
        path: target.offset_along_axis.distance
      default: 0.15
      range:
      - 0.1
      - 0.3
      type: scalar
    push_duration:
      binds_to:
      - mode: replace
        path: duration.max_time
      default: 5.0
      range:
      - 2.0
      - 10.0
      type: scalar
    push_height_offset:
      binds_to:
      - mode: replace
        path: target.offset.z
      default: 0.005
      range:
      - 0.0
      - 0.02
      type: scalar
    push_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.03
      range:
      - 0.005
      - 0.1
      type: scalar
  retries:
    max_attempts: 2
    offset:
    - 0.0
    - 0.0
    - 0.0
    strategy: reduce_speed
  subtask_id: move_to_goal
  target:
    anchor: task_object
    offset:
    - 0.0
    - 0.0
    - 0.005
    offset_along_axis:
      axis: task_goal_direction
      distance: 0.15
      mode: add_to_offset
      sign: positive
    orientation:
      mode: keep_current
    source: yaml
  termination: time_limit
  type: push
skill: push_to_goal
subtasks:
- anchor: object
  id: contact_object
  metric: distance
  offset:
  - 0.0
  - 0.06
  - 0.0
  target_entity: tcp
  weight: 0.3
- id: move_to_goal
  metric: goal_progress
  target_entity: object
  weight: 0.7
