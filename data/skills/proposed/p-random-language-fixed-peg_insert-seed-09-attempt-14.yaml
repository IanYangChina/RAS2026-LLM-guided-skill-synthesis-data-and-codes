dsl_version: 2
phases:
- control: position_control
  generator: linear_cartesian
  id: align_above
  parameters:
    align_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.05
      range:
      - 0.02
      - 0.1
      type: scalar
  subtask_id: align
  target:
    anchor: task_goal
    entity: peg_socket
    offset:
    - 0.0
    - 0.0
    - 0.12
    source: yaml
    tolerance: 0.01
  termination: pose_tolerance
  type: align
- control: position_control
  generator: linear_cartesian
  id: approach_entry
  parameters:
    descend_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.03
      range:
      - 0.01
      - 0.05
      type: scalar
  subtask_id: approach
  target:
    anchor: task_goal
    entity: peg_socket
    offset:
    - 0.0
    - 0.0
    - 0.01
    source: yaml
    tolerance: 0.01
  termination: pose_tolerance
  type: descend
- control: force_threshold_switch
  generator: linear_cartesian
  id: contact_rim
  parameters:
    probe_force:
      binds_to:
      - mode: add
        path: termination.force_threshold
      default: 6.0
      range:
      - 3.0
      - 12.0
      type: scalar
  retries:
    max_attempts: 1
    offset:
    - 0.004
    - 0.004
    - 0.0
    strategy: offset_target
  subtask_id: contact
  target:
    anchor: task_goal
    entity: peg_socket
    offset:
    - 0.0
    - 0.0
    - -0.005
    source: yaml
    tolerance: 0.005
  termination: force_exceeded
  type: contact
- control: position_control
  generator: linear_cartesian
  id: lift_off_contact
  target:
    anchor: current_tcp
    offset:
    - 0.0
    - 0.0
    - 0.015
    source: yaml
    tolerance: 0.005
  termination: pose_tolerance
  type: retract
- control: impedance_control
  generator: linear_cartesian
  guards:
  - id: time_guard
    on_failure: retry
    predicate: force_below
    threshold: 40.0
    when: during_phase
  id: insert_down
  parameters:
    insert_depth:
      binds_to:
      - mode: replace
        path: target.offset_along_axis.distance
      default: 0.05
      range:
      - 0.04
      - 0.07
      type: scalar
    insert_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.01
      range:
      - 0.005
      - 0.03
      type: scalar
    retry_offset_x:
      binds_to:
      - mode: replace
        path: retry.offset.x
      default: 0.008
      range:
      - -0.015
      - 0.015
      type: scalar
    retry_offset_y:
      binds_to:
      - mode: replace
        path: retry.offset.y
      default: 0.008
      range:
      - -0.015
      - 0.015
      type: scalar
  retries:
    max_attempts: 3
    offset:
    - 0.008
    - 0.008
    - 0.0
    strategy: offset_target
  subtask_id: insert
  target:
    anchor: task_goal
    entity: peg_socket
    offset:
    - 0.0
    - 0.0
    - 0.0
    offset_along_axis:
      axis: channel_axis
      distance: 0.05
      mode: add_to_offset
      sign: positive
    orientation:
      align_with: channel_axis
      axis:
      - 0.0
      - 0.0
      - 1.0
      mode: align_axis
      tolerance: 0.1
    source: yaml
    tolerance: 0.01
  termination: pose_tolerance
  type: insert
skill: peg_insert
