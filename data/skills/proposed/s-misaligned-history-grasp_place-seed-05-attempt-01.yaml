dsl_version: 2
phases:
- control: position_control
  generator: linear_cartesian
  id: approach_above_object
  parameters:
    approach_object_z:
      binds_to:
      - mode: replace
        path: target.offset.z
      default: 0.12
      range:
      - 0.08
      - 0.2
      type: scalar
  subtask_id: approach_object
  target:
    anchor: task_object
    offset:
    - 0.0
    - 0.0
    - 0.12
    source: yaml
    tolerance: 0.005
  termination: pose_tolerance
  type: approach
- control: force_threshold_switch
  generator: linear_cartesian
  id: descend_to_object
  parameters:
    descend_force_threshold:
      binds_to:
      - mode: replace
        path: termination.force_threshold
      default: 5.0
      range:
      - 1.0
      - 10.0
      type: scalar
  subtask_id: approach_object
  target:
    anchor: task_object
    offset:
    - 0.0
    - 0.0
    - 0.0
    source: yaml
  termination: force_exceeded
  type: descend
- end_effector_action: force_grasp
  generator: null
  guards:
  - args: {}
    id: grasp_check
    on_failure: retry
    predicate: bilateral_grasp
    threshold: 1
    when: after_phase
  id: grasp_object
  retries:
    max_attempts: 2
    strategy: repeat
  subtask_id: approach_object
  target:
    anchor: current_tcp
    offset:
    - 0.0
    - 0.0
    - 0.0
    source: yaml
  termination: grasp_success
  type: grasp
- control: position_control
  generator: linear_cartesian
  id: approach_goal_above
  parameters:
    approach_goal_z:
      binds_to:
      - mode: replace
        path: target.offset.z
      default: 0.15
      range:
      - 0.1
      - 0.25
      type: scalar
  subtask_id: place_at_goal
  target:
    anchor: task_goal
    offset:
    - 0.0
    - 0.0
    - 0.15
    source: yaml
    tolerance: 0.01
  termination: pose_tolerance
  type: approach
- control: position_control
  generator: linear_cartesian
  id: descend_to_place
  parameters:
    place_z_offset:
      binds_to:
      - mode: replace
        path: target.offset.z
      default: 0.03
      range:
      - -0.02
      - 0.06
      type: scalar
  subtask_id: place_at_goal
  target:
    anchor: task_goal
    offset:
    - 0.0
    - 0.0
    - 0.03
    source: yaml
    tolerance: 0.005
  termination: pose_tolerance
  type: descend
- end_effector_action: open
  generator: null
  id: release_object
  subtask_id: place_at_goal
  target:
    anchor: current_tcp
    offset:
    - 0.0
    - 0.0
    - 0.0
    source: yaml
  termination: time_limit
  type: release
- control: position_control
  generator: linear_cartesian
  id: retract_after_place
  parameters:
    retract_z:
      binds_to:
      - mode: replace
        path: target.offset.z
      default: 0.15
      range:
      - 0.1
      - 0.25
      type: scalar
  subtask_id: place_at_goal
  target:
    anchor: task_goal
    offset:
    - 0.0
    - 0.0
    - 0.15
    source: yaml
    tolerance: 0.01
  termination: pose_tolerance
  type: retract
skill: grasp_place
skill_type: arm_gripper
subtasks:
- anchor: object
  id: approach_object
  offset:
  - 0.0
  - 0.0
  - 0.12
  target_entity: tcp
  weight: 0.3
- anchor: goal
  id: place_at_goal
  metric: distance
  offset:
  - 0.0
  - 0.0
  - 0.0
  target_entity: object
  weight: 0.7
