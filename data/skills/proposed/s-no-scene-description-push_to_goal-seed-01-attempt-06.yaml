dsl_version: 2
phases:
- control: position_control
  generator: linear_cartesian
  guards:
  - args: {}
    id: contact_before_push
    on_failure: retry
    predicate: contact_detected
    threshold: 0.1
    when: before_phase
  id: approach_1
  parameters:
    approach_speed:
      binds_to:
      - path: generator.speed
      default: 0.3
      range:
      - 0.1
      - 0.5
      type: scalar
  retries:
    max_attempts: 2
    offset:
    - 0.0
    - 0.01
    - 0.0
    strategy: offset_target
  subtask_id: pre_contact
  target:
    anchor: task_object
    offset:
    - 0.0
    - -0.05
    - 0.025
    orientation:
      mode: none
    source: yaml
    tolerance: 0.01
  termination: pose_tolerance
  type: approach
- control: impedance_control
  generator: linear_cartesian
  guards:
  - args: {}
    id: contact_during_push
    on_failure: retry
    predicate: contact_detected
    threshold: 0.1
    when: during_phase
  id: push_1
  parameters:
    push_distance:
      binds_to:
      - path: target.offset_along_axis.distance
      default: 0.15
      range:
      - 0.05
      - 0.25
      type: scalar
  retries:
    max_attempts: 2
    offset:
    - 0.0
    - 0.01
    - 0.0
    strategy: offset_target
  subtask_id: goal
  target:
    anchor: task_goal
    offset_along_axis:
      axis: task_goal_direction
      distance: 0.15
      mode: replace_offset_projection
      sign: positive
    orientation:
      mode: none
    source: yaml
    tolerance: 0.03
  termination: pose_tolerance
  type: push
skill: push_to_goal
subtasks:
- anchor: object
  id: pre_contact
  metric: distance
  offset:
  - 0.0
  - -0.05
  - 0.025
  target_entity: tcp
  weight: 0.3
- anchor: goal
  id: goal
  metric: goal_progress
  target_entity: object
  weight: 0.7
