dsl_version: 2
phases:
- control: position_control
  generator: arc_cartesian
  id: approach_over_obstacle
  parameters:
    approach_arc_height:
      binds_to:
      - mode: add
        path: generator.arc_height
      default: 0.2
      range:
      - 0.1
      - 0.4
      type: scalar
    approach_speed:
      binds_to:
      - mode: add
        path: generator.speed
      default: 0.1
      range:
      - 0.05
      - 0.2
      type: scalar
  retries:
    max_attempts: 0
  subtask_id: reach_clearance
  target:
    anchor: world
    offset:
    - 0.5
    - 0.0
    - 0.45
    orientation:
      mode: keep_current
    source: yaml
    tolerance: 0.02
  termination: pose_tolerance
  type: approach
- control: impedance_control
  generator: linear_cartesian
  guards:
  - args: {}
    id: force_below_goal
    on_failure: abort
    predicate: force_below
    threshold: 5.0
    when: during_phase
  id: descend_to_goal
  parameters:
    descend_speed:
      binds_to:
      - mode: add
        path: generator.speed
      default: 0.05
      range:
      - 0.02
      - 0.1
      type: scalar
  retries:
    max_attempts: 1
    offset:
    - 0.0
    - 0.0
    - 0.01
    strategy: offset_target
  subtask_id: reach_goal
  target:
    anchor: task_goal
    offset:
    - 0.0
    - 0.0
    - 0.0
    orientation:
      mode: keep_current
    source: yaml
    tolerance: 0.02
  termination: pose_tolerance
  type: descend
skill: obstacle_reach
skill_type: arm
subtasks:
- anchor: world
  id: reach_clearance
  metric: distance
  offset:
  - 0.5
  - 0.0
  - 0.45
  target_entity: tcp
  weight: 0.3
- anchor: goal
  id: reach_goal
  metric: distance
  offset:
  - 0.0
  - 0.0
  - 0.0
  target_entity: tcp
  weight: 0.7
