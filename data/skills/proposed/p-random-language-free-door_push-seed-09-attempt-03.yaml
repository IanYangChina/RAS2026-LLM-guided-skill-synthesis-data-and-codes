dsl_version: 2
phases:
- control: position_control
  generator: linear_cartesian
  id: approach_handle
  parameters:
    approach_speed:
      binds_to:
      - mode: add
        path: generator.speed
      default: 0.15
      range:
      - 0.05
      - 0.3
      type: scalar
  subtask_id: reach_handle
  target:
    anchor: fixture
    entity: door_panel
    offset:
    - -0.39
    - -0.07
    - 0.45
    orientation:
      mode: keep_current
    source: yaml
    tolerance: 0.02
  termination: pose_tolerance
  type: approach
- control: force_threshold_switch
  generator: linear_cartesian
  id: descend_to_contact
  parameters:
    contact_force_threshold:
      binds_to:
      - mode: replace
        path: termination.force_threshold
      default: 5.0
      range:
      - 2.0
      - 15.0
      type: scalar
    descend_speed:
      binds_to:
      - mode: add
        path: generator.speed
      default: 0.04
      range:
      - 0.01
      - 0.08
      type: scalar
  subtask_id: reach_handle
  target:
    anchor: fixture
    entity: door_panel
    offset:
    - -0.39
    - -0.07
    - 0.33
    orientation:
      mode: keep_current
    source: yaml
  termination: force_exceeded
  type: descend
- control: impedance_control
  generator: linear_cartesian
  guards:
  - id: guard_hinge
    on_failure: continue
    predicate: hinge_delta_reached
    threshold: 0.3
    when: during_phase
  id: push_door
  parameters:
    push_distance:
      binds_to:
      - mode: replace
        path: target.offset_along_axis.distance
      default: 0.3
      range:
      - 0.1
      - 0.5
      type: scalar
    push_max_time:
      binds_to:
      - mode: replace
        path: duration.max_time
      default: 5.0
      range:
      - 2.0
      - 8.0
      type: scalar
    push_speed:
      binds_to:
      - mode: add
        path: generator.speed
      default: 0.08
      range:
      - 0.02
      - 0.15
      type: scalar
  retries:
    max_attempts: 1
    offset:
    - 0.0
    - -0.05
    - 0.0
    strategy: offset_target
  subtask_id: open_door
  target:
    anchor: fixture
    entity: door_panel
    offset:
    - -0.39
    - -0.07
    - 0.33
    offset_along_axis:
      axis: world_y
      distance: 0.3
      mode: add_to_offset
      sign: positive
    orientation:
      align_with: world_y
      axis:
      - 0.0
      - 1.0
      - 0.0
      mode: align_axis
      tolerance: 0.15
    source: yaml
  termination: time_limit
  type: push
skill: door_push
skill_type: arm_gripper
subtasks:
- anchor: fixture
  id: reach_handle
  metric: distance
  offset:
  - -0.39
  - -0.07
  - 0.35
  target_entity: tcp
  weight: 0.3
- anchor: fixture
  id: open_door
  metric: hinge_angle
  target_entity: hinge
  weight: 0.7
