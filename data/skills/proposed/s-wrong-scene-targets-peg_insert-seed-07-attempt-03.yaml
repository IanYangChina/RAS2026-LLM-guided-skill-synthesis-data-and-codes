dsl_version: 2
phases:
- control: position_control
  generator: linear_cartesian
  guards:
  - args: {}
    id: contact_check
    on_failure: abort
    predicate: contact_detected
    threshold: 1.0
    when: during_phase
  id: descend_to_socket
  parameters:
    approach_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.05
      range:
      - 0.01
      - 0.1
      type: scalar
  subtask_id: approach_socket
  target:
    anchor: fixture
    entity: peg_socket
    offset:
    - 0.006
    - 0.032
    - -0.26
    orientation:
      align_with: channel_axis
      axis:
      - 0
      - 0
      - 1
      mode: align_axis
      tolerance: 0.1
    source: yaml
    tolerance: 0.01
  termination: pose_tolerance
  type: descend
- control: impedance_control
  generator: linear_cartesian
  guards:
  - args: {}
    id: force_check
    on_failure: abort
    predicate: force_below
    threshold: 20.0
    when: during_phase
  id: insert_peg
  parameters:
    force_limit:
      binds_to:
      - mode: replace
        path: guards.force_check.threshold
      default: 20.0
      range:
      - 5.0
      - 35.0
      type: scalar
    insertion_depth:
      binds_to:
      - mode: replace
        path: target.offset_along_axis.distance
      default: 0.04
      range:
      - 0.01
      - 0.06
      type: scalar
    insertion_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.02
      range:
      - 0.005
      - 0.05
      type: scalar
  retries:
    max_attempts: 2
    offset:
    - 0.002
    - 0.002
    - 0.0
    strategy: offset_target
  subtask_id: insert_peg
  target:
    anchor: fixture
    entity: peg_socket
    offset:
    - 0.006
    - 0.032
    - -0.315
    offset_along_axis:
      axis: channel_axis
      distance: 0.04
      mode: add_to_offset
      sign: positive
    orientation:
      mode: keep_current
    source: yaml
    tolerance: 0.02
  termination: pose_tolerance
  type: insert
skill: peg_insert
skill_type: arm
subtasks:
- anchor: fixture
  id: approach_socket
  metric: distance
  offset:
  - 0.006
  - 0.032
  - -0.26
  target_entity: tcp
  weight: 0.3
- anchor: fixture
  id: insert_peg
  metric: distance
  offset:
  - 0.006
  - 0.032
  - -0.315
  target_entity: tcp
  weight: 0.7
