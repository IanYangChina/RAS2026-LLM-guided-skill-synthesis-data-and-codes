dsl_version: 2
phases:
- control: position_control
  generator: linear_cartesian
  id: align_1
  parameters:
    lateral_offset_x:
      binds_to:
      - mode: add
        path: target.offset.x
      default: 0.0
      range:
      - -0.02
      - 0.02
      type: scalar
    lateral_offset_y:
      binds_to:
      - mode: add
        path: target.offset.y
      default: 0.0
      range:
      - -0.02
      - 0.02
      type: scalar
  subtask_id: pre_contact
  target:
    anchor: task_object
    entity: peg
    offset:
    - 0.0
    - 0.04
    - 0.1
    orientation:
      mode: keep_current
    source: yaml
    tolerance: 0.01
  termination: pose_tolerance
  type: align
- control: position_control
  generator: arc_cartesian
  id: approach_1
  parameters:
    approach_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.05
      range:
      - 0.02
      - 0.08
      type: scalar
    arc_height:
      binds_to:
      - mode: replace
        path: generator.arc_height
      default: 0.03
      range:
      - 0.01
      - 0.05
      type: scalar
  subtask_id: pre_contact
  target:
    anchor: task_object
    entity: peg
    offset:
    - 0.0
    - 0.02
    - 0.0
    orientation:
      mode: keep_current
    source: yaml
    tolerance: 0.005
  termination: pose_tolerance
  type: approach
- control: force_threshold_switch
  generator: linear_cartesian
  guards:
  - args: {}
    id: excessive_contact
    on_failure: abort
    predicate: force_below
    threshold: 40.0
    when: during_phase
  id: contact_1
  parameters:
    contact_force_threshold:
      binds_to:
      - mode: replace
        path: termination.force_threshold
      default: 12.0
      range:
      - 5.0
      - 25.0
      type: scalar
  retries:
    max_attempts: 1
    strategy: reduce_speed
  target:
    anchor: task_object
    entity: peg
    offset:
    - 0.0
    - 0.005
    - 0.0
    orientation:
      mode: keep_current
    source: yaml
    tolerance: 0.005
  termination: force_exceeded
  type: contact
- control: impedance_control
  generator: impedance_motion
  guards:
  - args: {}
    id: peg_progress
    on_failure: retry
    predicate: object_progress
    threshold: 0.02
    when: during_phase
  - args: {}
    id: channel_force
    on_failure: abort
    predicate: force_below
    threshold: 40.0
    when: during_phase
  id: push_1
  parameters:
    push_depth:
      binds_to:
      - mode: replace
        path: target.offset_along_axis.distance
      default: 0.12
      range:
      - 0.02
      - 0.2
      type: scalar
    push_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.04
      range:
      - 0.01
      - 0.08
      type: scalar
  retries:
    max_attempts: 1
    strategy: reduce_speed
  subtask_id: push_progress
  target:
    anchor: task_object
    entity: peg
    offset:
    - 0.0
    - 0.0
    - 0.0
    offset_along_axis:
      axis: channel_axis
      distance: 0.12
      mode: replace_offset_projection
      sign: negative
    orientation:
      align_with: channel_axis
      axis:
      - 0.0
      - -1.0
      - 0.0
      mode: align_axis
      tolerance: 0.1
    source: yaml
    tolerance: 0.02
  termination: pose_tolerance
  type: push
- control: position_control
  generator: arc_cartesian
  id: retract_1
  parameters:
    retract_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.06
      range:
      - 0.03
      - 0.1
      type: scalar
  target:
    anchor: current_tcp
    offset:
    - 0.0
    - 0.0
    - 0.15
    orientation:
      mode: keep_current
    source: yaml
    tolerance: 0.01
  termination: pose_tolerance
  type: retract
skill: peg_channel
skill_type: arm
subtasks:
- anchor: object
  id: pre_contact
  metric: distance
  offset:
  - 0.0
  - 0.04
  - 0.1
  target_entity: tcp
  weight: 0.3
- anchor: goal
  id: push_progress
  metric: goal_progress
  target_entity: object
  weight: 0.7
