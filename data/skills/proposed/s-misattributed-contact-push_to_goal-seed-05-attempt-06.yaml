dsl_version: 2
phases:
- control: position_control
  generator: arc_cartesian
  id: approach_1
  parameters:
    approach_arc_height:
      binds_to:
      - mode: replace
        path: generator.arc_height
      default: 0.08
      range:
      - 0.02
      - 0.15
      type: scalar
    approach_behind:
      binds_to:
      - mode: replace
        path: target.offset_along_axis.distance
      default: 0.02
      range:
      - 0.01
      - 0.05
      type: scalar
    approach_duration:
      binds_to:
      - mode: replace
        path: duration.max_time
      default: 2.0
      range:
      - 0.5
      - 5.0
      type: scalar
    approach_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.1
      range:
      - 0.02
      - 0.2
      type: scalar
    approach_z:
      binds_to:
      - mode: replace
        path: target.offset.z
      default: 0.005
      range:
      - 0.0
      - 0.02
      type: scalar
  subtask_id: pre_contact
  target:
    anchor: task_object
    offset:
    - 0.0
    - 0.0
    - 0.005
    offset_along_axis:
      axis: task_goal_direction
      distance: 0.02
      mode: replace_offset_projection
      sign: negative
    orientation:
      mode: none
    source: yaml
  termination: time_limit
  type: approach
- control: impedance_control
  generator: linear_cartesian
  guards:
  - id: contact_check
    on_failure: retry
    predicate: contact_detected
    threshold: 1.0
    when: during_phase
  id: push_1
  parameters:
    push_distance:
      binds_to:
      - mode: replace
        path: target.offset_along_axis.distance
      default: 0.35
      range:
      - 0.2
      - 0.5
      type: scalar
    push_duration:
      binds_to:
      - mode: replace
        path: duration.max_time
      default: 2.0
      range:
      - 0.5
      - 5.0
      type: scalar
    push_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.1
      range:
      - 0.02
      - 0.2
      type: scalar
  retries:
    max_attempts: 2
    offset:
    - 0.0
    - 0.005
    - 0.0
    strategy: offset_target
  subtask_id: push_to_goal
  target:
    anchor: task_goal
    offset:
    - 0.0
    - 0.0
    - 0.0
    offset_along_axis:
      axis: task_goal_direction
      distance: 0.35
      mode: replace_offset_projection
      sign: positive
    orientation:
      mode: none
    source: yaml
  termination: time_limit
  type: push
skill: push_to_goal
subtasks:
- anchor: object
  id: pre_contact
  weight: 0.3
- id: push_to_goal
  metric: goal_progress
  target_entity: object
  weight: 0.7
