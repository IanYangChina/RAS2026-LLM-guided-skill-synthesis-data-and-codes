dsl_version: 2
phases:
- control: position_control
  generator: arc_cartesian
  id: approach_1
  parameters:
    approach_height:
      binds_to:
      - mode: replace
        path: target.offset.z
      default: 0.2
      range:
      - 0.1
      - 0.3
      type: scalar
    approach_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.2
      range:
      - 0.1
      - 0.5
      type: scalar
    arc_height:
      binds_to:
      - mode: replace
        path: generator.arc_height
      default: 0.15
      range:
      - 0.05
      - 0.25
      type: scalar
  subtask_id: reach_pre_contact
  target:
    anchor: task_goal
    offset:
    - 0.0
    - 0.0
    - 0.2
    orientation:
      mode: keep_current
    source: yaml
    tolerance: 0.02
  termination: pose_tolerance
  type: approach
- control: position_control
  generator: linear_cartesian
  guards:
  - id: tol_check
    on_failure: retry
    predicate: pose_within_tolerance
    threshold: 0.005
    when: after_phase
  id: descend_final
  parameters:
    descend_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.1
      range:
      - 0.05
      - 0.3
      type: scalar
    guard_tolerance:
      binds_to:
      - mode: replace
        path: guards.tol_check.threshold
      default: 0.005
      range:
      - 0.001
      - 0.01
      type: scalar
    retry_z_offset:
      binds_to:
      - mode: replace
        path: retry.offset.z
      default: -0.005
      range:
      - -0.01
      - 0.0
      type: scalar
  retries:
    max_attempts: 2
    offset:
    - 0.0
    - 0.0
    - -0.005
    strategy: offset_target
  subtask_id: reach_goal
  target:
    anchor: task_goal
    offset:
    - 0.0
    - 0.0
    - 0.0
    orientation:
      mode: keep_current
    source: yaml
    tolerance: 0.015
  termination: pose_tolerance
  type: descend
skill: obstacle_reach
subtasks:
- anchor: goal
  id: reach_pre_contact
  offset:
  - 0.0
  - 0.0
  - 0.2
  target_entity: tcp
  weight: 0.2
- anchor: goal
  id: reach_goal
  offset:
  - 0.0
  - 0.0
  - 0.0
  target_entity: tcp
  weight: 0.8
