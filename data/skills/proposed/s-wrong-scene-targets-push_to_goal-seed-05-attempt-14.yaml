dsl_version: 2
phases:
- control: impedance_control
  generator: arc_cartesian
  guards:
  - id: force_guard_approach
    on_failure: abort
    predicate: force_below
    threshold: 25.0
    when: during_phase
  id: arc_behind
  parameters:
    approach_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.05
      range:
      - 0.01
      - 0.2
      type: scalar
    approach_tolerance:
      binds_to:
      - mode: replace
        path: termination.pose_tolerance
      default: 0.01
      range:
      - 0.005
      - 0.03
      type: scalar
    arc_height:
      binds_to:
      - mode: replace
        path: generator.arc_height
      default: 0.08
      range:
      - 0.02
      - 0.15
      type: scalar
  retries:
    max_attempts: 1
    strategy: reduce_speed
  subtask_id: approach_pre_contact
  target:
    anchor: task_object
    offset:
    - 0.0
    - 0.0
    - 0.025
    offset_along_axis:
      axis: task_goal_direction
      distance: 0.04
      mode: replace_offset_projection
      sign: negative
    orientation:
      mode: none
    source: yaml
    tolerance: 0.01
  termination: pose_tolerance
  type: approach
- control: impedance_control
  generator: linear_cartesian
  guards:
  - id: force_guard_push
    on_failure: abort
    predicate: force_below
    threshold: 25.0
    when: during_phase
  id: push_forward
  parameters:
    push_distance:
      binds_to:
      - mode: replace
        path: target.offset_along_axis.distance
      default: 0.2
      range:
      - 0.05
      - 0.4
      type: scalar
    push_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.03
      range:
      - 0.01
      - 0.1
      type: scalar
    push_tolerance:
      binds_to:
      - mode: replace
        path: termination.pose_tolerance
      default: 0.02
      range:
      - 0.01
      - 0.05
      type: scalar
  retries:
    max_attempts: 1
    offset:
    - 0.0
    - 0.0
    - 0.0
    strategy: offset_target
  subtask_id: push_toward_goal
  target:
    anchor: task_goal
    offset:
    - 0.0
    - 0.0
    - 0.0
    offset_along_axis:
      axis: task_goal_direction
      distance: 0.2
      mode: add_to_offset
      sign: positive
    orientation:
      mode: none
    source: yaml
    tolerance: 0.02
  termination: pose_tolerance
  type: push
skill: push_to_goal
subtasks:
- anchor: object
  id: approach_pre_contact
  offset:
  - 0.0
  - 0.0
  - 0.025
  weight: 0.3
- id: push_toward_goal
  metric: goal_progress
  target_entity: object
  weight: 0.7
