dsl_version: 2
parameters:
  approach2_height:
    binds_to:
    - mode: replace
      path: target.offset.z
      phase: approach_2
    default: 0.1
    range:
    - 0.05
    - 0.2
    type: scalar
  approach2_speed:
    binds_to:
    - mode: replace
      path: generator.speed
      phase: approach_2
    default: 0.03
    range:
    - 0.01
    - 0.1
    type: scalar
  approach2_tolerance:
    binds_to:
    - mode: replace
      path: termination.pose_tolerance
      phase: approach_2
    default: 0.02
    range:
    - 0.01
    - 0.05
    type: scalar
  descend2_speed:
    binds_to:
    - mode: replace
      path: generator.speed
      phase: descend_2
    default: 0.03
    range:
    - 0.01
    - 0.1
    type: scalar
  descend2_tolerance:
    binds_to:
    - mode: replace
      path: termination.pose_tolerance
      phase: descend_2
    default: 0.02
    range:
    - 0.01
    - 0.05
    type: scalar
  lift_height:
    binds_to:
    - mode: replace
      path: target.offset.z
      phase: lift_1
    default: 0.15
    range:
    - 0.1
    - 0.25
    type: scalar
phases:
- control: position_control
  generator: linear_cartesian
  id: approach_1
  subtask_id: reach_object
  target:
    anchor: task_object
    entity: grasp_target
    offset:
    - 0.0
    - 0.0
    - 0.05
    orientation:
      mode: keep_current
    source: yaml
  termination: pose_tolerance
  type: approach
- control: position_control
  generator: linear_cartesian
  id: descend_1
  target:
    anchor: task_object
    entity: grasp_target
    offset:
    - 0.0
    - 0.0
    - 0.0
    orientation:
      mode: keep_current
    source: yaml
  termination: pose_tolerance
  type: descend
- control: position_control
  end_effector_action: force_grasp
  id: grasp_1
  target:
    anchor: current_tcp
    offset:
    - 0.0
    - 0.0
    - 0.0
    orientation:
      mode: keep_current
    source: yaml
  termination: grasp_success
  type: grasp
- control: position_control
  generator: linear_cartesian
  id: lift_1
  target:
    anchor: task_object
    entity: grasp_target
    offset:
    - 0.0
    - 0.0
    - 0.15
    orientation:
      mode: keep_current
    source: yaml
  termination: pose_tolerance
  type: lift
- control: impedance_control
  generator: linear_cartesian
  guards:
  - args: {}
    id: check_grasp_before
    on_failure: abort
    predicate: bilateral_grasp
    threshold: 0.5
    when: before_phase
  - args: {}
    id: monitor_grasp
    on_failure: abort
    predicate: bilateral_grasp
    threshold: 0.5
    when: during_phase
  id: approach_2
  subtask_id: reach_goal
  target:
    anchor: task_goal
    offset:
    - 0.0
    - 0.0
    - 0.1
    orientation:
      mode: keep_current
    source: yaml
  termination: pose_tolerance
  type: approach
- control: impedance_control
  generator: linear_cartesian
  id: descend_2
  subtask_id: reach_goal
  target:
    anchor: task_goal
    offset:
    - 0.0
    - 0.0
    - 0.0
    orientation:
      mode: keep_current
    source: yaml
  termination: pose_tolerance
  type: descend
- control: position_control
  end_effector_action: open
  id: release_1
  target:
    anchor: current_tcp
    offset:
    - 0.0
    - 0.0
    - 0.0
    orientation:
      mode: keep_current
    source: yaml
  termination: time_limit
  type: release
- control: position_control
  generator: linear_cartesian
  id: retract_1
  target:
    anchor: task_goal
    offset:
    - 0.0
    - 0.0
    - 0.15
    orientation:
      mode: keep_current
    source: yaml
  termination: pose_tolerance
  type: retract
skill: grasp_place
skill_type: arm_gripper
subtasks:
- anchor: object
  id: reach_object
  metric: distance
  offset:
  - 0.0
  - 0.0
  - 0.05
  target_entity: tcp
  weight: 0.3
- anchor: goal
  id: reach_goal
  metric: distance
  offset:
  - 0.0
  - 0.0
  - 0.0
  target_entity: tcp
  weight: 0.7
