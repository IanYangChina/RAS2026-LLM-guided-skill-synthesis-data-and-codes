dsl_version: 2
phases:
- control: impedance_control
  generator: impedance_motion
  id: push_1
  parameters:
    push_distance:
      binds_to:
      - mode: replace
        path: target.offset_along_axis.distance
      default: 0.05
      range:
      - 0.02
      - 0.2
      type: scalar
    push_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.04
      range:
      - 0.01
      - 0.1
      type: scalar
  subtask_id: reach_entry
  target:
    anchor: task_goal
    offset:
    - 0.0
    - 0.0
    - 0.0
    offset_along_axis:
      axis: channel_axis
      distance: 0.05
      mode: add_to_offset
    orientation:
      align_with: channel_axis
      mode: align_axis
    source: yaml
  termination: time_limit
  type: push
- control: position_control
  generator: linear_cartesian
  id: align_1
  parameters:
    align_tolerance:
      binds_to:
      - mode: replace
        path: termination.pose_tolerance
      default: 0.005
      range:
      - 0.001
      - 0.01
      type: scalar
    lateral_offset_x:
      binds_to:
      - mode: replace
        path: target.offset.x
      default: 0.0
      range:
      - -0.01
      - 0.01
      type: scalar
    lateral_offset_y:
      binds_to:
      - mode: replace
        path: target.offset.y
      default: 0.0
      range:
      - -0.01
      - 0.01
      type: scalar
  subtask_id: reach_entry
  target:
    anchor: current_tcp
    offset:
    - 0.0
    - 0.0
    - 0.0
    orientation:
      mode: keep_current
    source: yaml
  termination: pose_tolerance
  type: align
- control: impedance_control
  generator: impedance_motion
  id: insert_1
  parameters:
    insertion_depth:
      binds_to:
      - mode: replace
        path: target.offset_along_axis.distance
      default: 0.05
      range:
      - 0.01
      - 0.15
      type: scalar
    insertion_force:
      binds_to:
      - mode: replace
        path: termination.force_threshold
      default: 10.0
      range:
      - 1.0
      - 20.0
      type: scalar
  subtask_id: insertion_depth
  target:
    anchor: task_goal
    offset:
    - 0.0
    - 0.0
    - 0.0
    offset_along_axis:
      axis: channel_axis
      distance: 0.05
      mode: add_to_offset
    orientation:
      align_with: channel_axis
      mode: align_axis
    source: yaml
  termination: force_exceeded
  type: insert
skill: peg_insert
skill_type: arm_gripper
subtasks:
- anchor: fixture
  id: reach_entry
  metric: distance
  offset:
  - 0.0
  - 0.0
  - 0.08
  target_entity: tcp
  weight: 0.3
- anchor: fixture
  id: insertion_depth
  metric: goal_progress
  offset:
  - 0.0
  - 0.0
  - 0.0
  target_entity: object
  weight: 0.7
