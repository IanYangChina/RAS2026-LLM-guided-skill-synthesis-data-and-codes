dsl_version: 2
phases:
- control: position_control
  generator: arc_cartesian
  id: approach_arc
  parameters:
    approach_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.05
      range:
      - 0.01
      - 0.1
      type: scalar
    arc_height:
      binds_to:
      - mode: replace
        path: generator.arc_height
      default: 0.15
      range:
      - 0.08
      - 0.25
      type: scalar
    pos_tolerance:
      binds_to:
      - mode: replace
        path: termination.pose_tolerance
      default: 0.005
      range:
      - 0.001
      - 0.01
      type: scalar
  retries:
    max_attempts: 1
    strategy: repeat
  subtask_id: approach_sub
  target:
    anchor: task_goal
    offset:
    - 0.0
    - 0.0
    - 0.1
    orientation:
      align_with: insertion_axis
      axis:
      - 0.0
      - 0.0
      - -1.0
      mode: align_axis
      tolerance: 0.05
    source: yaml
  termination: pose_tolerance
  type: approach
- control: position_control
  generator: linear_cartesian
  id: align_to_hole
  parameters:
    align_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.04
      range:
      - 0.01
      - 0.1
      type: scalar
    align_tolerance:
      binds_to:
      - mode: replace
        path: termination.pose_tolerance
      default: 0.003
      range:
      - 0.001
      - 0.008
      type: scalar
  retries:
    max_attempts: 1
    strategy: repeat
  subtask_id: approach_sub
  target:
    anchor: task_goal
    offset:
    - 0.0
    - 0.0
    - 0.05
    orientation:
      mode: keep_current
    source: yaml
  termination: pose_tolerance
  type: align
- control: position_control
  generator: linear_cartesian
  id: descend_to_entry
  parameters:
    descend_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.03
      range:
      - 0.01
      - 0.1
      type: scalar
    descend_tolerance:
      binds_to:
      - mode: replace
        path: termination.pose_tolerance
      default: 0.002
      range:
      - 0.001
      - 0.005
      type: scalar
  retries:
    max_attempts: 1
    strategy: repeat
  subtask_id: approach_sub
  target:
    anchor: task_goal
    offset:
    - 0.0
    - 0.0
    - 0.055
    orientation:
      mode: keep_current
    source: yaml
  termination: pose_tolerance
  type: descend
- control: admittance_control
  generator: impedance_motion
  guards:
  - id: insert_contact
    on_failure: retry
    predicate: contact_detected
    threshold: 1.0
    when: during_phase
  id: insert_into_hole
  parameters:
    entry_z_offset:
      binds_to:
      - mode: replace
        path: target.offset.z
      default: 0.055
      range:
      - 0.045
      - 0.065
      type: scalar
    insert_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.015
      range:
      - 0.005
      - 0.04
      type: scalar
    insertion_distance:
      binds_to:
      - mode: replace
        path: target.offset_along_axis.distance
      default: 0.05
      range:
      - 0.03
      - 0.07
      type: scalar
  retries:
    max_attempts: 3
    offset:
    - 0.01
    - 0.01
    - 0.0
    strategy: offset_target
  subtask_id: insert_sub
  target:
    anchor: task_goal
    offset:
    - 0.0
    - 0.0
    - 0.055
    offset_along_axis:
      axis: channel_axis
      distance: 0.05
      mode: add_to_offset
      sign: positive
    orientation:
      mode: keep_current
    source: yaml
  termination: pose_tolerance
  type: insert
- control: position_control
  generator: linear_cartesian
  id: retract_after_insert
  parameters:
    retract_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.05
      range:
      - 0.01
      - 0.1
      type: scalar
  retries:
    max_attempts: 1
    strategy: repeat
  target:
    anchor: current_tcp
    offset:
    - 0.0
    - 0.0
    - 0.1
    orientation:
      mode: keep_current
    source: yaml
  termination: pose_tolerance
  type: retract
skill: peg_insert
subtasks:
- anchor: object
  id: approach_sub
  metric: distance
  offset:
  - 0.0
  - 0.0
  - 0.1
  target_entity: tcp
  weight: 0.3
- anchor: fixture
  id: insert_sub
  metric: distance
  target_entity: tcp
  weight: 0.7
