dsl_version: 2
phases:
- control: position_control
  generator: linear_cartesian
  id: approach_behind
  parameters:
    approach_height:
      binds_to:
      - mode: replace
        path: target.offset.z
      default: 0.1
      range:
      - 0.08
      - 0.2
      type: scalar
  subtask_id: approach_peg
  target:
    anchor: task_object
    entity: peg
    offset:
    - 0.0
    - 0.03
    - 0.1
    orientation:
      mode: none
    tolerance: 0.02
  termination: pose_tolerance
  type: approach
- control: force_threshold_switch
  generator: linear_cartesian
  id: descend_to_contact
  parameters:
    descend_force_threshold:
      binds_to:
      - mode: replace
        path: termination.force_threshold
      default: 5.0
      range:
      - 2.0
      - 10.0
      type: scalar
  subtask_id: approach_peg
  target:
    anchor: task_object
    entity: peg
    offset:
    - 0.0
    - 0.03
    - 0.0
    orientation:
      mode: none
    tolerance: 0.01
  termination: force_exceeded
  type: descend
- control: impedance_control
  generator: linear_cartesian
  id: push_lateral
  parameters:
    lateral_offset:
      binds_to:
      - mode: replace
        path: target.offset.x
      default: 0.04
      range:
      - 0.02
      - 0.06
      type: scalar
  subtask_id: lateral_align
  target:
    anchor: task_object
    entity: peg
    offset:
    - 0.04
    - 0.03
    - 0.0
    orientation:
      mode: keep_current
    tolerance: 0.02
  termination: pose_tolerance
  type: push
- control: impedance_control
  generator: linear_cartesian
  id: push_along_channel
  subtask_id: push_to_goal
  target:
    anchor: task_goal
    offset:
    - 0.0
    - 0.0
    - 0.0
    orientation:
      mode: keep_current
    tolerance: 0.02
  termination: pose_tolerance
  type: push
skill: peg_channel
subtasks:
- anchor: object
  id: approach_peg
  metric: distance
  offset:
  - 0.0
  - 0.03
  - 0.1
  target_entity: tcp
  weight: 0.3
- anchor: world
  id: lateral_align
  metric: distance
  offset:
  - 0.5
  - 0.0
  - 0.035
  target_entity: object
  weight: 0.3
- anchor: goal
  id: push_to_goal
  metric: goal_progress
  target_entity: tcp
  weight: 0.4
