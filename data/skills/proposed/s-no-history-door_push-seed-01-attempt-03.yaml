dsl_version: 2
phases:
- control: position_control
  generator: linear_cartesian
  id: approach_to_push_start
  parameters:
    approach_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.1
      range:
      - 0.05
      - 0.15
      type: scalar
  subtask_id: door_progress
  target:
    anchor: fixture
    entity: door_panel
    offset:
    - -0.4
    - -0.05
    - 0.35
    source: yaml
    tolerance: 0.05
  termination: pose_tolerance
  type: approach
- control: impedance_control
  generator: linear_cartesian
  guards:
  - args: {}
    id: progress_check
    on_failure: continue
    predicate: hinge_delta_reached
    threshold: 0.03
    when: during_phase
  id: push_door
  parameters:
    max_push_time:
      binds_to:
      - mode: replace
        path: duration.max_time
      default: 5.0
      range:
      - 2.0
      - 8.0
      type: scalar
    push_distance:
      binds_to:
      - mode: replace
        path: target.offset.y
      default: 0.25
      range:
      - 0.15
      - 0.35
      type: scalar
    push_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.08
      range:
      - 0.05
      - 0.15
      type: scalar
  retries:
    max_attempts: 3
    offset:
    - 0.0
    - -0.05
    - 0.0
    strategy: offset_target
  subtask_id: door_progress
  target:
    anchor: site
    entity: door_handle
    offset:
    - 0.0
    - -0.2
    - 0.0
    source: yaml
    tolerance: 0.05
  termination: time_limit
  type: push
skill: door_push
subtasks:
- anchor: fixture
  id: door_progress
  metric: hinge_angle
  target_entity: hinge
