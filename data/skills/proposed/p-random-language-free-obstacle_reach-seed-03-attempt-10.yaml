dsl_version: 2
phases:
- control: position_control
  generator: arc_cartesian
  id: arc_over_obstacle
  parameters:
    approach_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.4
      range:
      - 0.2
      - 0.5
      type: scalar
    arc_height:
      binds_to:
      - mode: replace
        path: generator.arc_height
      default: 0.25
      range:
      - 0.15
      - 0.3
      type: scalar
  subtask_id: approach_clear
  target:
    anchor: task_goal
    offset:
    - 0.0
    - 0.2
    - 0.3
    orientation:
      mode: none
    source: yaml
    tolerance: 0.03
  termination: pose_tolerance
  type: approach
- control: position_control
  generator: linear_cartesian
  id: lateral_shift
  parameters:
    lateral_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.3
      range:
      - 0.1
      - 0.4
      type: scalar
  subtask_id: lateral_clearance
  target:
    anchor: task_goal
    offset:
    - 0.0
    - 0.0
    - 0.3
    orientation:
      mode: none
    source: yaml
    tolerance: 0.03
  termination: pose_tolerance
  type: push
- control: position_control
  generator: linear_cartesian
  id: descend_to_goal
  parameters:
    descend_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.1
      range:
      - 0.05
      - 0.2
      type: scalar
  subtask_id: reach_goal
  target:
    anchor: task_goal
    offset:
    - 0.0
    - 0.0
    - 0.0
    orientation:
      mode: none
    source: yaml
    tolerance: 0.02
  termination: pose_tolerance
  type: descend
skill: obstacle_reach
subtasks:
- id: approach_clear
  offset:
  - 0.0
  - 0.2
  - 0.3
  weight: 0.2
- id: lateral_clearance
  offset:
  - 0.0
  - 0.0
  - 0.3
  weight: 0.1
- id: reach_goal
  weight: 0.7
