dsl_version: 2
phases:
- control: position_control
  generator: arc_cartesian
  id: approach_1
  parameters:
    approach_height:
      binds_to:
      - mode: scale
        path: target.offset.z
      default: 0.15
      range:
      - 0.05
      - 0.3
      type: scalar
    approach_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.05
      range:
      - 0.01
      - 0.1
      type: scalar
  subtask_id: approach
  target:
    anchor: task_object
    entity: push_box
    offset:
    - 0.0
    - 0.08
    - 0.15
    orientation:
      mode: none
    source: yaml
    tolerance: 0.02
  termination: pose_tolerance
  type: approach
- control: admittance_control
  generator: linear_cartesian
  id: contact_1
  parameters:
    contact_force_threshold:
      binds_to:
      - mode: replace
        path: termination.force_threshold
      default: 5.0
      range:
      - 2.0
      - 10.0
      type: scalar
    contact_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.02
      range:
      - 0.005
      - 0.05
      type: scalar
  subtask_id: contact
  target:
    anchor: task_object
    entity: push_box
    offset:
    - 0.0
    - 0.03
    - 0.025
    orientation:
      mode: none
    source: yaml
  termination: force_exceeded
  type: contact
- control: admittance_control
  generator: linear_cartesian
  guards:
  - args: {}
    id: force_guard
    on_failure: retry
    predicate: force_below
    threshold: 25.0
    when: during_phase
  - args: {}
    id: contact_check
    on_failure: abort
    predicate: contact_detected
    threshold: 1.0
    when: before_phase
  id: push_1
  parameters:
    push_depth:
      binds_to:
      - mode: replace
        path: target.offset_along_axis.distance
      default: 0.15
      range:
      - 0.05
      - 0.3
      type: scalar
    push_duration:
      binds_to:
      - mode: replace
        path: duration.max_time
      default: 2.0
      range:
      - 0.5
      - 5.0
      type: scalar
    push_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.05
      range:
      - 0.01
      - 0.1
      type: scalar
  retries:
    max_attempts: 2
    offset:
    - 0.0
    - -0.005
    - 0.0
    strategy: offset_target
  subtask_id: push
  target:
    anchor: current_tcp
    offset:
    - 0.0
    - 0.0
    - 0.0
    offset_along_axis:
      axis: push_direction
      distance: 0.15
      mode: add_to_offset
      sign: positive
    orientation:
      align_with: task_goal_direction
      axis:
      - 1.0
      - 0.0
      - 0.0
      mode: align_axis
      tolerance: 0.1
    source: yaml
  termination: time_limit
  type: push
- control: position_control
  generator: linear_cartesian
  id: retract_1
  parameters:
    retract_height:
      binds_to:
      - mode: scale
        path: target.offset.z
      default: 0.1
      range:
      - 0.05
      - 0.2
      type: scalar
    retract_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.05
      range:
      - 0.01
      - 0.1
      type: scalar
  target:
    anchor: current_tcp
    offset:
    - 0.0
    - 0.0
    - 0.1
    orientation:
      mode: keep_current
    source: yaml
    tolerance: 0.05
  termination: pose_tolerance
  type: retract
skill: push_to_goal
subtasks:
- anchor: object
  id: approach
  metric: distance
  offset:
  - 0.0
  - 0.08
  - 0.0
  target_entity: tcp
  weight: 1.0
- anchor: object
  id: contact
  metric: distance
  offset:
  - 0.0
  - 0.03
  - 0.0
  target_entity: tcp
  weight: 1.0
- anchor: goal
  id: push
  metric: goal_progress
  offset:
  - 0.0
  - 0.03
  - 0.0
  target_entity: tcp
  weight: 1.0
