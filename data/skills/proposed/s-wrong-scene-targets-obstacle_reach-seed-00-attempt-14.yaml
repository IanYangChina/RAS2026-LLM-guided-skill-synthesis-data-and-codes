skill: obstacle_reach
dsl_version: 2
subtasks:
- id: reach_above_goal
  anchor: goal
  target_entity: tcp
  metric: distance
  offset:
  - 0.0
  - 0.0
  - 0.05
  weight: 0.3
- id: reach_goal
  anchor: goal
  target_entity: tcp
  metric: distance
  offset:
  - 0.0
  - 0.0
  - 0.0
  weight: 0.7
phases:
- id: arc_approach_above
  type: approach
  generator: arc_cartesian
  control: position_control
  termination: pose_tolerance
  target:
    source: yaml
    anchor: task_goal
    offset:
    - 0.0
    - 0.0
    - 0.05
    tolerance: 0.05
    orientation:
      mode: none
  parameters:
    arc_height:
      type: scalar
      range:
      - 0.05
      - 0.35
      default: 0.12
      binds_to:
      - path: generator.arc_height
        mode: replace
    speed_arc:
      type: scalar
      range:
      - 0.02
      - 0.25
      default: 0.15
      binds_to:
      - path: generator.speed
        mode: replace
  retries:
    max_attempts: 2
    strategy: offset_target
    offset:
    - 0.0
    - 0.0
    - 0.02
  subtask_id: reach_above_goal
- id: linear_descend_to_goal
  type: descend
  generator: linear_cartesian
  control: position_control
  termination: pose_tolerance
  target:
    source: yaml
    anchor: task_goal
    offset:
    - 0.0
    - 0.0
    - 0.0
    tolerance: 0.02
    orientation:
      mode: none
  parameters:
    speed_descend:
      type: scalar
      range:
      - 0.02
      - 0.25
      default: 0.08
      binds_to:
      - path: generator.speed
        mode: replace
  subtask_id: reach_goal
