dsl_version: 2
phases:
- control: position_control
  generator: arc_cartesian
  id: approach_over
  parameters:
    approach_duration:
      binds_to:
      - mode: replace
        path: duration.max_time
      default: 4.0
      range:
      - 1.0
      - 8.0
      type: scalar
    arc_height:
      binds_to:
      - mode: replace
        path: generator.arc_height
      default: 0.08
      range:
      - 0.02
      - 0.15
      type: scalar
    arc_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.1
      range:
      - 0.02
      - 0.5
      type: scalar
  subtask_id: above_goal
  target:
    anchor: task_goal
    offset:
    - 0.0
    - 0.0
    - 0.17
    orientation:
      mode: none
    source: yaml
  termination: time_limit
  type: approach
- control: position_control
  generator: linear_cartesian
  id: descend_to_goal
  parameters:
    descend_duration:
      binds_to:
      - mode: replace
        path: duration.max_time
      default: 2.0
      range:
      - 0.5
      - 4.0
      type: scalar
    descend_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.08
      range:
      - 0.02
      - 0.4
      type: scalar
  subtask_id: goal
  target:
    anchor: task_goal
    offset:
    - 0.0
    - 0.0
    - 0.0
    orientation:
      mode: none
    source: yaml
    tolerance: 0.02
  termination: time_limit
  type: descend
skill: obstacle_reach
subtasks:
- anchor: goal
  id: above_goal
  offset:
  - 0.0
  - 0.0
  - 0.17
  target_entity: tcp
  weight: 0.3
- anchor: goal
  id: goal
  offset:
  - 0.0
  - 0.0
  - 0.0
  target_entity: tcp
  weight: 0.7
