dsl_version: 2
phases:
- control: position_control
  generator: linear_cartesian
  id: align_1
  retries:
    max_attempts: 0
    strategy: repeat
  subtask_id: approach
  target:
    anchor: task_object
    entity: peg
    offset:
    - 0.0
    - 0.04
    - 0.05
    orientation:
      mode: keep_current
    source: yaml
    tolerance: 0.02
  termination: pose_tolerance
  type: approach
- control: impedance_control
  generator: linear_cartesian
  id: approach_1
  parameters:
    lateral_offset_x:
      binds_to:
      - mode: replace
        path: target.offset.x
      default: 0.0
      range:
      - -0.01
      - 0.01
      type: scalar
    lateral_offset_y:
      binds_to:
      - mode: replace
        path: target.offset.y
      default: 0.0
      range:
      - -0.01
      - 0.01
      type: scalar
    speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.025
      range:
      - 0.01
      - 0.04
      type: scalar
  target:
    anchor: task_object
    entity: peg
    offset:
    - 0.0
    - 0.02
    - -0.01
    orientation:
      mode: keep_current
    source: yaml
    tolerance: 0.01
  termination: pose_tolerance
  type: approach
- control: impedance_control
  generator: linear_cartesian
  id: push_1
  parameters:
    force_thresh:
      binds_to:
      - mode: replace
        path: termination.force_threshold
      default: 40.0
      range:
      - 30.0
      - 40.0
      type: scalar
    push_depth:
      binds_to:
      - mode: add
        path: target.offset.y
      default: 0.0
      range:
      - -0.04
      - 0.04
      type: scalar
    speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.05
      range:
      - 0.02
      - 0.08
      type: scalar
  retries:
    max_attempts: 2
    offset:
    - 0.005
    - 0.0
    - 0.0
    strategy: offset_target
  subtask_id: push
  target:
    anchor: world
    offset:
    - 0.5
    - -0.08
    - 0.04
    orientation:
      mode: keep_current
    source: yaml
    tolerance: 0.02
  termination: force_exceeded
  type: push
- control: position_control
  generator: arc_cartesian
  id: retract_1
  parameters:
    retract_height:
      binds_to:
      - mode: replace
        path: target.offset.z
      default: 0.15
      range:
      - 0.05
      - 0.2
      type: scalar
    speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.05
      range:
      - 0.01
      - 0.1
      type: scalar
  target:
    anchor: current_tcp
    offset:
    - 0.0
    - 0.0
    - 0.15
    orientation:
      mode: none
    source: yaml
    tolerance: 0.05
  termination: pose_tolerance
  type: retract
skill: peg_channel
subtasks:
- anchor: object
  id: approach
  offset:
  - 0.0
  - 0.04
  - 0.0
- anchor: object
  id: contact
  offset:
  - 0.0
  - 0.02
  - 0.0
- anchor: world
  id: push
  offset:
  - 0.5
  - -0.08
  - 0.04
