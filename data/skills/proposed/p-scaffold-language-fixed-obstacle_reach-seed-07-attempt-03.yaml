dsl_version: 2
phases:
- control: position_control
  generator: arc_cartesian
  id: approach_over_obstacle
  parameters:
    approach_tolerance:
      binds_to:
      - mode: replace
        path: termination.pose_tolerance
      default: 0.04
      range:
      - 0.03
      - 0.05
      type: scalar
    arc_height:
      binds_to:
      - mode: add
        path: generator.arc_height
      default: 0.15
      range:
      - 0.08
      - 0.25
      type: scalar
    speed:
      binds_to:
      - mode: scale
        path: generator.speed
      default: 0.35
      range:
      - 0.1
      - 0.5
      type: scalar
  target:
    anchor: task_goal
    offset:
    - 0.0
    - 0.0
    - 0.2
    orientation:
      mode: keep_current
    source: yaml
    tolerance: 0.04
  termination: pose_tolerance
  type: approach
- control: position_control
  generator: linear_cartesian
  id: descend_to_goal
  parameters:
    descend_tolerance:
      binds_to:
      - mode: replace
        path: termination.pose_tolerance
      default: 0.03
      range:
      - 0.025
      - 0.04
      type: scalar
    speed:
      binds_to:
      - mode: scale
        path: generator.speed
      default: 0.25
      range:
      - 0.1
      - 0.5
      type: scalar
  target:
    anchor: task_goal
    offset:
    - 0.0
    - 0.0
    - 0.0
    orientation:
      mode: keep_current
    source: yaml
    tolerance: 0.03
  termination: pose_tolerance
  type: descend
- control: position_control
  generator: linear_cartesian
  id: fine_adjust
  parameters:
    fine_tolerance:
      binds_to:
      - mode: replace
        path: termination.pose_tolerance
      default: 0.015
      range:
      - 0.01
      - 0.02
      type: scalar
    speed:
      binds_to:
      - mode: scale
        path: generator.speed
      default: 0.015
      range:
      - 0.005
      - 0.05
      type: scalar
  target:
    anchor: task_goal
    offset:
    - 0.0
    - 0.0
    - 0.0
    orientation:
      mode: keep_current
    source: yaml
    tolerance: 0.015
  termination: pose_tolerance
  type: descend
skill: obstacle_reach
