dsl_version: 2
phases:
- control: position_control
  generator: linear_cartesian
  guards:
  - args: {}
    id: contact_before_push
    on_failure: retry
    predicate: contact_detected
    threshold: 1
    when: after_phase
  id: approach_1
  orientation:
    mode: none
  parameters:
    approach_speed:
      binds_to:
      - mode: add
        path: generator.speed
      default: 0.15
      range:
      - 0.05
      - 0.3
      type: scalar
  retries:
    max_attempts: 1
    strategy: reduce_speed
  subtask_id: pre_contact
  target:
    anchor: fixture
    entity: door_panel
    offset:
    - -0.4
    - -0.02
    - 0.35
    source: yaml
    tolerance: 0.02
  termination: pose_tolerance
  type: approach
- control: impedance_control
  generator: linear_cartesian
  id: push_1
  orientation:
    mode: keep_current
  parameters:
    push_distance:
      binds_to:
      - mode: add
        path: target.offset_along_axis.distance
      default: 0.15
      range:
      - 0.05
      - 0.5
      type: scalar
    push_speed:
      binds_to:
      - mode: add
        path: generator.speed
      default: 0.08
      range:
      - 0.02
      - 0.15
      type: scalar
    time_limit_max:
      binds_to:
      - mode: add
        path: duration.max_time
      default: 2.0
      range:
      - 1.0
      - 5.0
      type: scalar
  retries:
    max_attempts: 1
    strategy: reduce_speed
  subtask_id: push_door
  target:
    anchor: fixture
    entity: door_panel
    offset:
    - -0.4
    - -0.02
    - 0.35
    offset_along_axis:
      axis: task_goal_direction
      distance: 0.15
      mode: add_to_offset
      sign: positive
    source: yaml
  termination: time_limit
  type: push
skill: door_push
skill_type: arm
subtasks:
- anchor: fixture
  id: pre_contact
  metric: distance
  offset:
  - -0.4
  - -0.02
  - 0.35
  target_entity: tcp
  weight: 0.3
- anchor: fixture
  id: push_door
  metric: hinge_angle
  offset:
  - 0.0
  - 0.0
  - 0.0
  target_entity: hinge
  weight: 1.0
