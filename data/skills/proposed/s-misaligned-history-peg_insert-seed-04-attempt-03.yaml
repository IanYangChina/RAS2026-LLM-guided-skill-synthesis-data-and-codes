dsl_version: 2
phases:
- control: force_threshold_switch
  generator: impedance_motion
  guards: []
  id: push_1
  parameters:
    push_distance:
      binds_to:
      - mode: replace
        path: target.offset_along_axis.distance
      default: 0.10063
      range:
      - 0.02
      - 0.2
      type: scalar
    push_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.04052
      range:
      - 0.01
      - 0.1
      type: scalar
  retries:
    max_attempts: 0
    offset:
    - 0.0
    - 0.0
    - 0.0
    strategy: repeat
  subtask_id: reach_approach
  target:
    anchor: task_goal
    entity: null
    offset:
    - 0.0
    - 0.0
    - 0.055
    offset_along_axis:
      axis: insertion_axis
      distance: 0.1
      mode: add_to_offset
      sign: positive
    orientation:
      align_with: channel_axis
      axis:
      - 0.0
      - 0.0
      - 1.0
      mode: align_axis
      tolerance: 0.1
    source: yaml
    tolerance: 0.02
  termination: force_exceeded
  type: push
- control: position_control
  generator: linear_cartesian
  guards: []
  id: align_1
  parameters:
    lateral_offset_x:
      binds_to:
      - mode: replace
        path: target.offset.x
      default: 0.00651
      range:
      - -0.01
      - 0.01
      type: scalar
    lateral_offset_y:
      binds_to:
      - mode: replace
        path: target.offset.y
      default: -0.00495
      range:
      - -0.01
      - 0.01
      type: scalar
  retries:
    max_attempts: 0
    offset:
    - 0.0
    - 0.0
    - 0.0
    strategy: repeat
  subtask_id: reach_approach
  target:
    anchor: task_goal
    entity: null
    offset:
    - 0.006
    - -0.005
    - 0.055
    offset_along_axis:
      axis: insertion_axis
      distance: 0.0
      mode: add_to_offset
      sign: positive
    orientation:
      align_with: channel_axis
      axis:
      - 0.0
      - 0.0
      - 1.0
      mode: align_axis
      tolerance: 0.1
    source: yaml
    tolerance: 0.02
  termination: pose_tolerance
  type: align
- control: admittance_control
  end_effector_action: null
  generator: impedance_motion
  guards:
  - args: {}
    id: contact_guard
    on_failure: continue
    predicate: contact_detected
    threshold: 0.5
    when: during_phase
  id: release_1
  parameters: []
  retries:
    max_attempts: 0
    offset:
    - 0.0
    - 0.0
    - 0.0
    strategy: repeat
  subtask_id: reach_insertion
  target:
    anchor: task_goal
    entity: null
    offset:
    - 0.0
    - 0.0
    - 0.0
    offset_along_axis:
      axis: insertion_axis
      distance: 0.04
      mode: add_to_offset
      sign: positive
    orientation:
      align_with: channel_axis
      axis:
      - 0.0
      - 0.0
      - 1.0
      mode: align_axis
      tolerance: 0.1
    source: yaml
    tolerance: 0.02
  termination: time_limit
  type: push
- control: impedance_control
  generator: impedance_motion
  guards:
  - args: {}
    id: force_guard
    on_failure: abort
    predicate: force_below
    threshold: 40.0
    when: during_phase
  - args: {}
    id: progress_guard
    on_failure: retry
    predicate: object_progress
    threshold: 0.5
    when: after_phase
  id: insert_1
  parameters:
    insertion_depth:
      binds_to:
      - mode: replace
        path: target.offset_along_axis.distance
      default: 0.06376
      range:
      - 0.01
      - 0.15
      type: scalar
    insertion_force:
      binds_to:
      - mode: replace
        path: guards.force_guard.threshold
      default: 6.9046
      range:
      - 1.0
      - 20.0
      type: scalar
  retries:
    max_attempts: 2
    offset:
    - 0.003
    - 0.003
    - 0.0
    strategy: offset_target
  subtask_id: reach_insertion
  target:
    anchor: task_goal
    entity: null
    offset:
    - 0.0
    - 0.0
    - 0.0
    offset_along_axis:
      axis: insertion_axis
      distance: 0.064
      mode: add_to_offset
      sign: positive
    orientation:
      align_with: channel_axis
      axis:
      - 0.0
      - 0.0
      - 1.0
      mode: align_axis
      tolerance: 0.05
    source: yaml
    tolerance: 0.02
  termination: time_limit
  type: insert
skill: peg_insert
skill_type: arm_gripper
subtasks:
- anchor: goal
  id: reach_approach
  metric: distance
  offset:
  - 0.0
  - 0.0
  - 0.055
  target_entity: tcp
  weight: 0.3
- anchor: goal
  id: reach_insertion
  metric: distance
  offset:
  - 0.0
  - 0.0
  - 0.0
  target_entity: tcp
  weight: 0.7
