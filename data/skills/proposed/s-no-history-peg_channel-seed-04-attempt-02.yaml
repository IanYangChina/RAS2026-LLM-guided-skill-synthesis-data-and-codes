dsl_version: 2
phases:
- control: position_control
  generator: linear_cartesian
  guards:
  - args: {}
    id: approach_contact
    on_failure: abort
    predicate: contact_detected
    threshold: 0.0
    when: during_phase
  id: approach_peg
  parameters:
    approach_height_z:
      binds_to:
      - mode: add
        path: target.offset.z
      default: 0.08
      range:
      - 0.05
      - 0.15
      type: scalar
    approach_offset_y:
      binds_to:
      - mode: add
        path: target.offset.y
      default: 0.02
      range:
      - 0.0
      - 0.05
      type: scalar
  subtask_id: reach_peg
  target:
    anchor: task_object
    offset:
    - 0.0
    - 0.02
    - 0.08
    source: yaml
    tolerance: 0.02
  termination: pose_tolerance
  type: approach
- control: position_control
  generator: linear_cartesian
  id: descend_align
  orientation:
    align_with: channel_axis
    axis:
    - 0.0
    - 0.0
    - 1.0
    mode: align_axis
    tolerance: 0.1
  parameters:
    descend_offset_z:
      binds_to:
      - mode: add
        path: target.offset.z
      default: 0.02
      range:
      - 0.01
      - 0.05
      type: scalar
  subtask_id: reach_peg
  target:
    anchor: task_object
    offset:
    - 0.0
    - 0.0
    - 0.02
    source: yaml
    tolerance: 0.02
  termination: pose_tolerance
  type: align
- control: impedance_control
  generator: impedance_motion
  guards:
  - args: {}
    id: force_limit_guard
    on_failure: retry
    predicate: force_below
    threshold: 40.0
    when: during_phase
  id: push_channel
  orientation:
    align_with: channel_axis
    axis:
    - 0.0
    - 0.0
    - 1.0
    mode: align_axis
    tolerance: 0.1
  parameters:
    push_distance:
      binds_to:
      - mode: replace
        path: target.offset_along_axis.distance
      default: 0.16
      range:
      - 0.12
      - 0.2
      type: scalar
    push_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.03
      range:
      - 0.01
      - 0.08
      type: scalar
    push_time:
      binds_to:
      - mode: replace
        path: duration.max_time
      default: 5.0
      range:
      - 2.0
      - 10.0
      type: scalar
  retries:
    max_attempts: 2
    offset:
    - 0.005
    - 0.0
    - 0.0
    strategy: offset_target
  subtask_id: push_channel
  target:
    anchor: current_tcp
    offset:
    - 0.0
    - 0.0
    - 0.0
    offset_along_axis:
      axis: channel_axis
      distance: 0.16
      mode: add_to_offset
      sign: positive
    source: yaml
  termination: time_limit
  type: push
- control: position_control
  generator: linear_cartesian
  id: retract_tcp
  target:
    anchor: current_tcp
    offset:
    - 0.0
    - 0.0
    - 0.1
    source: yaml
    tolerance: 0.02
  termination: pose_tolerance
  type: retract
skill: peg_channel
skill_type: arm_gripper
subtasks:
- anchor: object
  id: reach_peg
  metric: distance
  offset:
  - 0.0
  - 0.02
  - 0.08
  target_entity: tcp
  weight: 0.3
- anchor: goal
  id: push_channel
  metric: distance
  offset:
  - 0.0
  - 0.0
  - 0.0
  target_entity: tcp
  weight: 0.7
