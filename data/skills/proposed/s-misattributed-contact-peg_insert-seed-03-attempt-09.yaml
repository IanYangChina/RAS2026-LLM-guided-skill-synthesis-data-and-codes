dsl_version: 2
phases:
- control: position_control
  generator: linear_cartesian
  guards:
  - args: {}
    id: check_pose
    on_failure: retry
    predicate: pose_within_tolerance
    threshold: 0.015
    when: after_phase
  id: approach_above_socket
  parameters:
    approach_speed:
      binds_to:
      - mode: scale
        path: generator.speed
      default: 0.1
      range:
      - 0.05
      - 0.2
      type: scalar
  retries:
    max_attempts: 2
    offset:
    - 0.005
    - 0.005
    - 0.0
    strategy: offset_target
  subtask_id: reach_above_entry
  target:
    anchor: task_goal
    offset:
    - 0.0
    - 0.0
    - 0.12
    orientation:
      align_with: insertion_axis
      axis:
      - 0.0
      - 0.0
      - 1.0
      mode: align_axis
      tolerance: 0.15
    source: yaml
    tolerance: 0.015
  termination: pose_tolerance
  type: approach
- control: position_control
  generator: linear_cartesian
  guards:
  - args: {}
    id: check_alignment
    on_failure: retry
    predicate: pose_within_tolerance
    threshold: 0.01
    when: after_phase
  id: align_above_entry
  parameters:
    align_speed:
      binds_to:
      - mode: scale
        path: generator.speed
      default: 0.05
      range:
      - 0.02
      - 0.1
      type: scalar
  retries:
    max_attempts: 2
    offset:
    - 0.003
    - 0.003
    - 0.0
    strategy: offset_target
  subtask_id: align_entry
  target:
    anchor: task_goal
    offset:
    - 0.0
    - 0.0
    - 0.08
    orientation:
      mode: keep_current
    source: yaml
    tolerance: 0.01
  termination: pose_tolerance
  type: align
- control: impedance_control
  generator: linear_cartesian
  guards:
  - args: {}
    id: lateral_force_guard
    on_failure: abort
    predicate: force_below
    threshold: 35.0
    when: during_phase
  id: descend_to_channel
  parameters:
    contact_force_threshold:
      binds_to:
      - mode: replace
        path: termination.force_threshold
      default: 15.0
      range:
      - 5.0
      - 25.0
      type: scalar
    init_insert_depth:
      binds_to:
      - mode: replace
        path: target.offset_along_axis.distance
      default: 0.03
      range:
      - 0.01
      - 0.05
      type: scalar
    insertion_speed:
      binds_to:
      - mode: scale
        path: generator.speed
      default: 0.02
      range:
      - 0.01
      - 0.05
      type: scalar
  retries:
    max_attempts: 1
    offset:
    - 0.005
    - 0.005
    - 0.0
    strategy: offset_target
  subtask_id: insert_into_hole
  target:
    anchor: fixture
    entity: peg_socket
    offset:
    - 0.0
    - 0.0
    - 0.0
    offset_along_axis:
      axis: channel_axis
      distance: 0.03
      mode: replace_offset_projection
      sign: positive
    orientation:
      mode: keep_current
    source: yaml
  termination: force_exceeded
  type: descend
- control: impedance_control
  generator: linear_cartesian
  guards:
  - args: {}
    id: force_limit
    on_failure: abort
    predicate: force_below
    threshold: 35.0
    when: during_phase
  - args: {}
    id: inserted
    on_failure: retry
    predicate: pose_within_tolerance
    threshold: 0.02
    when: after_phase
  id: push_full_insertion
  parameters:
    final_insert_depth:
      binds_to:
      - mode: replace
        path: target.offset_along_axis.distance
      default: 0.04
      range:
      - 0.02
      - 0.08
      type: scalar
    push_speed:
      binds_to:
      - mode: scale
        path: generator.speed
      default: 0.015
      range:
      - 0.005
      - 0.04
      type: scalar
  retries:
    max_attempts: 1
    offset:
    - 0.003
    - 0.003
    - 0.0
    strategy: offset_target
  subtask_id: insert_into_hole
  target:
    anchor: fixture
    entity: peg_socket
    offset:
    - 0.0
    - 0.0
    - 0.0
    offset_along_axis:
      axis: channel_axis
      distance: 0.04
      mode: replace_offset_projection
      sign: positive
    orientation:
      mode: keep_current
    source: yaml
    tolerance: 0.02
  termination: pose_tolerance
  type: push
skill: peg_insert
subtasks:
- anchor: goal
  id: reach_above_entry
  metric: distance
  offset:
  - 0.0
  - 0.0
  - 0.12
  target_entity: tcp
  weight: 0.2
- anchor: goal
  id: align_entry
  metric: distance
  offset:
  - 0.0
  - 0.0
  - 0.08
  target_entity: tcp
  weight: 0.3
- anchor: goal
  id: insert_into_hole
  metric: goal_progress
  offset:
  - 0.0
  - 0.0
  - 0.0
  target_entity: tcp
  weight: 0.5
