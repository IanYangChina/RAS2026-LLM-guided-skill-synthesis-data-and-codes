skill: grasp_place
dsl_version: 2
skill_type: arm_gripper
subtasks:
  - id: reach_object
    anchor: object
    target_entity: tcp
    metric: distance
    offset: [0.0, 0.0, 0.0]
    weight: 0.3
  - id: place_at_goal
    anchor: goal
    target_entity: object
    metric: distance
    offset: [0.0, 0.0, 0.0]
    weight: 0.7
phases:
  - id: approach_above
    type: approach
    generator: linear_cartesian
    control: position_control
    termination: pose_tolerance
    subtask_id: reach_object
    target:
      source: yaml
      anchor: task_object
      offset: [0.0, 0.0, 0.12]
      tolerance: 0.02
      orientation:
        mode: keep_current
    parameters:
      approach_height:
        type: scalar
        range: [0.08, 0.15]
        default: 0.12
        binds_to:
          - {path: target.offset.z, mode: add}
      approach_speed:
        type: scalar
        range: [0.01, 0.1]
        default: 0.05
        binds_to:
          - {path: generator.speed, mode: replace}
    guards: []
    retries:
      max_attempts: 1
      strategy: offset_target
      offset: [0.0, 0.0, 0.02]
  - id: descend_to_grasp
    type: descend
    generator: linear_cartesian
    control: impedance_control
    termination: force_exceeded
    target:
      source: yaml
      anchor: task_object
      offset: [0.0, 0.0, 0.0]
      offset_along_axis:
        distance: 0.05
        axis: world_z
        mode: replace_offset_projection
        sign: negative
      orientation:
        mode: keep_current
    parameters:
      descend_distance:
        type: scalar
        range: [0.03, 0.08]
        default: 0.05
        binds_to:
          - {path: target.offset_along_axis.distance, mode: replace}
      descend_speed:
        type: scalar
        range: [0.005, 0.03]
        default: 0.01
        binds_to:
          - {path: generator.speed, mode: replace}
      force_threshold:
        type: scalar
        range: [1.0, 10.0]
        default: 3.0
        binds_to:
          - {path: termination.force_threshold, mode: replace}
    guards:
      - id: contact_detected_guard
        when: after_phase
        predicate: contact_detected
        args: {}
        threshold: 1
        on_failure: retry
    retries:
      max_attempts: 1
      strategy: repeat
  - id: grasp
    type: grasp
    generator: null
    control: position_control
    termination: grasp_success
    end_effector_action: force_grasp
    target:
      source: yaml
      anchor: current_tcp
    parameters: {}
    guards:
      - id: bilateral_grasp_check
        when: after_phase
        predicate: bilateral_grasp
        args: {}
        threshold: 1
        on_failure: retry
    retries:
      max_attempts: 1
      strategy: repeat
  - id: lift
    type: lift
    generator: linear_cartesian
    control: position_control
    termination: pose_tolerance
    target:
      source: yaml
      anchor: current_tcp
      offset: [0.0, 0.0, 0.15]
      orientation:
        mode: keep_current
    parameters:
      lift_height:
        type: scalar
        range: [0.1, 0.25]
        default: 0.15
        binds_to:
          - {path: target.offset.z, mode: replace}
      lift_speed:
        type: scalar
        range: [0.01, 0.1]
        default: 0.05
        binds_to:
          - {path: generator.speed, mode: replace}
    guards: []
    retries:
      max_attempts: 1
      strategy: repeat
  - id: move_to_goal_above
    type: approach
    generator: linear_cartesian
    control: position_control
    termination: pose_tolerance
    subtask_id: place_at_goal
    target:
      source: yaml
      anchor: task_goal
      offset: [0.0, 0.0, 0.1]
      orientation:
        mode: keep_current
    parameters:
      goal_approach_height:
        type: scalar
        range: [0.05, 0.15]
        default: 0.1
        binds_to:
          - {path: target.offset.z, mode: replace}
      goal_speed:
        type: scalar
        range: [0.01, 0.1]
        default: 0.05
        binds_to:
          - {path: generator.speed, mode: replace}
    guards: []
    retries:
      max_attempts: 1
      strategy: repeat
  - id: descend_to_place
    type: descend
    generator: linear_cartesian
    control: impedance_control
    termination: pose_tolerance
    target:
      source: yaml
      anchor: task_goal
      offset: [0.0, 0.0, 0.0]
      offset_along_axis:
        distance: 0.03
        axis: world_z
        mode: replace_offset_projection
        sign: negative
      orientation:
        mode: keep_current
    parameters:
      descend_distance_2:
        type: scalar
        range: [0.01, 0.05]
        default: 0.03
        binds_to:
          - {path: target.offset_along_axis.distance, mode: replace}
      speed_place:
        type: scalar
        range: [0.005, 0.03]
        default: 0.01
        binds_to:
          - {path: generator.speed, mode: replace}
    guards: []
    retries:
      max_attempts: 1
      strategy: repeat
  - id: release
    type: release
    generator: null
    control: position_control
    termination: time_limit
    end_effector_action: open
    target:
      source: yaml
      anchor: current_tcp
    parameters:
      release_duration:
        type: scalar
        range: [0.5, 2.0]
        default: 1.0
        binds_to:
          - {path: duration.max_time, mode: replace}
    guards: []
    retries:
      max_attempts: 0
  - id: retract
    type: retract
    generator: linear_cartesian
    control: position_control
    termination: pose_tolerance
    target:
      source: yaml
      anchor: current_tcp
      offset: [0.0, 0.0, 0.1]
      orientation:
        mode: keep_current
    parameters:
      retract_height:
        type: scalar
        range: [0.05, 0.2]
        default: 0.1
        binds_to:
          - {path: target.offset.z, mode: replace}
      retract_speed:
        type: scalar
        range: [0.01, 0.1]
        default: 0.05
        binds_to:
          - {path: generator.speed, mode: replace}
    guards: []
    retries:
      max_attempts: 0
```