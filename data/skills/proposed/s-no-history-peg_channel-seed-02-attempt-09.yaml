dsl_version: 2
phases:
- control: position_control
  generator: linear_cartesian
  id: approach_above_peg
  parameters:
    approach_x_offset:
      binds_to:
      - mode: add
        path: target.offset.x
      default: 0.0
      range:
      - -0.02
      - 0.02
      type: scalar
    approach_y_offset:
      binds_to:
      - mode: add
        path: target.offset.y
      default: 0.06
      range:
      - 0.04
      - 0.08
      type: scalar
    approach_z_offset:
      binds_to:
      - mode: add
        path: target.offset.z
      default: 0.15
      range:
      - 0.1
      - 0.2
      type: scalar
    pose_tolerance:
      binds_to:
      - mode: replace
        path: termination.pose_tolerance
      default: 0.02
      range:
      - 0.01
      - 0.05
      type: scalar
  target:
    anchor: task_object
    entity: peg
    offset:
    - 0.0
    - 0.06
    - 0.15
    orientation:
      mode: keep_current
    source: yaml
  termination: pose_tolerance
  type: approach
- control: position_control
  generator: linear_cartesian
  id: descend_behind_peg
  parameters:
    approach_x_offset:
      binds_to:
      - mode: add
        path: target.offset.x
      default: 0.0
      range:
      - -0.02
      - 0.02
      type: scalar
    behind_y_offset:
      binds_to:
      - mode: add
        path: target.offset.y
      default: 0.06
      range:
      - 0.04
      - 0.08
      type: scalar
    descend_z_offset:
      binds_to:
      - mode: add
        path: target.offset.z
      default: 0.0
      range:
      - -0.01
      - 0.01
      type: scalar
    pose_tolerance:
      binds_to:
      - mode: replace
        path: termination.pose_tolerance
      default: 0.02
      range:
      - 0.01
      - 0.05
      type: scalar
  subtask_id: reach_peg
  target:
    anchor: task_object
    entity: peg
    offset:
    - 0.0
    - 0.06
    - 0.0
    orientation:
      mode: keep_current
    source: yaml
  termination: pose_tolerance
  type: descend
- control: force_threshold_switch
  generator: linear_cartesian
  id: contact_peg
  parameters:
    approach_x_offset:
      binds_to:
      - mode: add
        path: target.offset.x
      default: 0.0
      range:
      - -0.02
      - 0.02
      type: scalar
    contact_behind_y:
      binds_to:
      - mode: add
        path: target.offset.y
      default: 0.01
      range:
      - 0.0
      - 0.03
      type: scalar
    contact_offset_z:
      binds_to:
      - mode: add
        path: target.offset.z
      default: 0.0
      range:
      - -0.01
      - 0.01
      type: scalar
    force_threshold:
      binds_to:
      - mode: replace
        path: termination.force_threshold
      default: 15.0
      range:
      - 5.0
      - 30.0
      type: scalar
  subtask_id: reach_peg
  target:
    anchor: task_object
    entity: peg
    offset:
    - 0.0
    - 0.01
    - 0.0
    orientation:
      mode: keep_current
    source: yaml
  termination: force_exceeded
  type: contact
- control: impedance_control
  generator: linear_cartesian
  guards:
  - args: {}
    id: progress_check
    on_failure: retry
    predicate: object_progress
    threshold: 0.005
    when: during_phase
  id: push_through_channel
  parameters:
    max_time:
      binds_to:
      - mode: replace
        path: duration.max_time
      default: 5.0
      range:
      - 2.0
      - 15.0
      type: scalar
    progress_threshold:
      binds_to:
      - mode: replace
        path: guards.progress_check.threshold
      default: 0.005
      range:
      - 0.001
      - 0.01
      type: scalar
    push_distance:
      binds_to:
      - mode: replace
        path: target.offset_along_axis.distance
      default: 0.16
      range:
      - 0.1
      - 0.2
      type: scalar
    push_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.08
      range:
      - 0.05
      - 0.1
      type: scalar
    retry_offset_x:
      binds_to:
      - mode: add
        path: retry.offset.x
      default: 0.0
      range:
      - -0.01
      - 0.01
      type: scalar
    retry_offset_y:
      binds_to:
      - mode: add
        path: retry.offset.y
      default: 0.0
      range:
      - -0.01
      - 0.01
      type: scalar
  retries:
    max_attempts: 2
    offset:
    - 0.0
    - 0.0
    - 0.0
    strategy: offset_target
  subtask_id: push_complete
  target:
    anchor: current_tcp
    offset:
    - 0.0
    - 0.0
    - 0.0
    offset_along_axis:
      axis: channel_axis
      distance: 0.16
      mode: add_to_offset
      sign: positive
    orientation:
      mode: keep_current
    source: yaml
  termination: time_limit
  type: push
- control: position_control
  generator: linear_cartesian
  id: retract_after_push
  target:
    anchor: current_tcp
    offset:
    - 0.0
    - 0.0
    - 0.1
    orientation:
      mode: keep_current
    source: yaml
  termination: pose_tolerance
  type: retract
skill: peg_channel_new
subtasks:
- anchor: object
  id: reach_peg
  metric: distance
  offset:
  - 0.0
  - 0.06
  - 0.0
  target_entity: tcp
  weight: 0.3
- anchor: goal
  id: push_complete
  metric: goal_progress
  target_entity: object
  weight: 0.7
