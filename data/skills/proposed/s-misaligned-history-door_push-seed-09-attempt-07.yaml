dsl_version: 2
phases:
- control: position_control
  generator: linear_cartesian
  id: approach_push_point
  parameters:
    approach_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.15
      range:
      - 0.08
      - 0.25
      type: scalar
    approach_tolerance:
      binds_to:
      - mode: replace
        path: termination.pose_tolerance
      default: 0.05
      range:
      - 0.02
      - 0.08
      type: scalar
  subtask_id: reach_push_point
  target:
    anchor: body
    entity: door_panel
    offset:
    - 0.2
    - 0.15
    - 0.4
    orientation:
      mode: keep_current
    source: yaml
    tolerance: 0.05
  termination: pose_tolerance
  type: approach
- control: admittance_control
  generator: linear_cartesian
  id: descend_contact
  parameters:
    contact_force_threshold:
      binds_to:
      - mode: replace
        path: termination.force_threshold
      default: 10.0
      range:
      - 5.0
      - 20.0
      type: scalar
    descend_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.03
      range:
      - 0.01
      - 0.06
      type: scalar
  subtask_id: reach_push_point
  target:
    anchor: body
    entity: door_panel
    offset:
    - 0.2
    - -0.01
    - 0.3
    orientation:
      mode: keep_current
    source: yaml
    tolerance: 0.02
  termination: force_exceeded
  type: descend
- control: admittance_control
  generator: linear_cartesian
  guards:
  - id: hinge_movement
    on_failure: retry
    predicate: hinge_delta_reached
    threshold: 0.4
    when: during_phase
  id: push_door_open
  parameters:
    push_distance:
      binds_to:
      - mode: replace
        path: target.offset_along_axis.distance
      default: 0.4
      range:
      - 0.2
      - 0.6
      type: scalar
    push_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.05
      range:
      - 0.02
      - 0.08
      type: scalar
  retries:
    max_attempts: 2
    strategy: reduce_speed
  subtask_id: push_door
  target:
    anchor: body
    entity: door_panel
    offset:
    - 0.2
    - -0.01
    - 0.3
    offset_along_axis:
      axis: world_y
      distance: 0.4
      mode: add_to_offset
      sign: positive
    orientation:
      mode: keep_current
    source: yaml
  termination: time_limit
  type: push
skill: door_push
subtasks:
- anchor: fixture
  id: reach_push_point
  offset:
  - 0.2
  - -0.01
  - 0.2
  weight: 0.3
- anchor: fixture
  id: push_door
  metric: hinge_angle
  target_entity: hinge
  weight: 0.7
