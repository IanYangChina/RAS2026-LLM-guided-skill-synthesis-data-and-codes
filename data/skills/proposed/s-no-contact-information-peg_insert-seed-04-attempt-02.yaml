dsl_version: 2
phases:
- control: impedance_control
  end_effector_action: null
  generator: impedance_motion
  guards: []
  id: push_1
  orientation:
    align_with: insertion_axis
    axis:
    - 0.0
    - 0.0
    - 1.0
    mode: align_axis
  parameters:
    push_distance:
      binds_to:
      - mode: add
        path: target.offset_along_axis.distance
      default: 0.095
      range:
      - 0.02
      - 0.2
      type: scalar
    push_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.04
      range:
      - 0.01
      - 0.1
      type: scalar
  retries:
    max_attempts: 0
  target:
    anchor: task_object
    entity: null
    offset:
    - 0.0
    - 0.0
    - 0.0
    offset_along_axis:
      axis: insertion_axis
      distance: 0.0
      mode: add_to_offset
      sign: negative
    tolerance: null
  termination: time_limit
  type: push
- control: position_control
  end_effector_action: null
  generator: linear_cartesian
  guards: []
  id: align_1
  orientation:
    align_with: insertion_axis
    axis:
    - 0.0
    - 0.0
    - 1.0
    mode: align_axis
  parameters:
    lateral_offset_x:
      binds_to:
      - mode: add
        path: target.offset.x
      default: 0.0
      range:
      - -0.01
      - 0.01
      type: scalar
    lateral_offset_y:
      binds_to:
      - mode: add
        path: target.offset.y
      default: 0.0
      range:
      - -0.01
      - 0.01
      type: scalar
  retries:
    max_attempts: 0
  target:
    anchor: fixture
    entity: null
    offset:
    - 0.0
    - 0.0
    - 0.055
    offset_along_axis: null
    tolerance: 0.005
  termination:
    pose_tolerance: 0.01
  type: align
- control: admittance_control
  end_effector_action: open
  generator: linear_cartesian
  guards: []
  id: release_1
  orientation:
    align_with: insertion_axis
    axis:
    - 0.0
    - 0.0
    - 1.0
    mode: align_axis
  parameters:
    push_distance_2:
      binds_to:
      - mode: add
        path: target.offset_along_axis.distance
      default: 0.08
      range:
      - 0.02
      - 0.2
      type: scalar
    push_speed_2:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.03
      range:
      - 0.01
      - 0.1
      type: scalar
  retries:
    max_attempts: 0
  target:
    anchor: fixture
    entity: null
    offset:
    - 0.0
    - 0.0
    - 0.055
    offset_along_axis:
      axis: insertion_axis
      distance: 0.0
      mode: add_to_offset
      sign: negative
    tolerance: null
  termination: pose_tolerance
  type: release
- control: impedance_control
  end_effector_action: null
  generator: impedance_motion
  guards:
  - args: {}
    id: contact_check
    on_failure: retry
    predicate: contact_detected
    when: during_phase
  id: insert_1
  orientation:
    align_with: insertion_axis
    axis:
    - 0.0
    - 0.0
    - 1.0
    mode: align_axis
  parameters:
    insertion_depth:
      binds_to:
      - mode: add
        path: target.offset_along_axis.distance
      default: 0.05
      range:
      - 0.01
      - 0.15
      type: scalar
    insertion_force:
      binds_to:
      - mode: replace
        path: termination.force_threshold
      default: 12.0
      range:
      - 1.0
      - 20.0
      type: scalar
  retries:
    max_attempts: 2
    offset:
    - 0.005
    - 0.005
    - 0.0
    strategy: offset_target
  target:
    anchor: fixture
    entity: null
    offset:
    - 0.0
    - 0.0
    - 0.055
    offset_along_axis:
      axis: insertion_axis
      distance: 0.0
      mode: add_to_offset
      sign: positive
    tolerance: null
  termination: force_exceeded
  type: insert
skill: peg_insert
skill_type: arm_gripper
subtasks:
- anchor: fixture
  id: pre_insert
  metric: distance
  offset:
  - 0.0
  - 0.0
  - 0.055
  target_entity: tcp
  weight: 0.4
- anchor: goal
  id: at_entry
  metric: distance
  offset:
  - 0.0
  - 0.0
  - 0.0
  target_entity: tcp
  weight: 0.6
