dsl_version: 2
phases:
- control: position_control
  generator: linear_cartesian
  id: approach_obj
  parameters:
    height_approach_obj:
      binds_to:
      - mode: replace
        path: target.offset.z
      default: 0.15
      range:
      - 0.05
      - 0.25
      type: scalar
    speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.2
      range:
      - 0.05
      - 0.5
      type: scalar
  subtask_id: reach_obj
  target:
    anchor: task_object
    entity: null
    offset:
    - 0.0
    - 0.0
    - 0.0
    orientation:
      mode: none
    source: yaml
  termination: pose_tolerance
  type: approach
- control: position_control
  generator: linear_cartesian
  id: descend_obj
  parameters:
    height_descend_obj:
      binds_to:
      - mode: replace
        path: target.offset.z
      default: 0.03
      range:
      - 0.0
      - 0.05
      type: scalar
  subtask_id: reach_obj
  target:
    anchor: task_object
    entity: null
    offset:
    - 0.0
    - 0.0
    - 0.0
    orientation:
      mode: none
    source: yaml
  termination: pose_tolerance
  type: descend
- control: impedance_control
  end_effector_action: force_grasp
  generator: null
  guards:
  - args: {}
    id: check_grasp
    on_failure: retry
    predicate: bilateral_grasp
    threshold: 0.002
    when: during_phase
  id: grasp_obj
  retries:
    max_attempts: 2
    strategy: repeat
  termination: grasp_success
  type: grasp
- control: position_control
  generator: linear_cartesian
  id: lift_obj
  parameters:
    height_lift:
      binds_to:
      - mode: replace
        path: target.offset.z
      default: 0.2
      range:
      - 0.1
      - 0.3
      type: scalar
  subtask_id: reach_obj
  target:
    anchor: task_object
    entity: null
    offset:
    - 0.0
    - 0.0
    - 0.0
    orientation:
      mode: none
    source: yaml
  termination: pose_tolerance
  type: lift
- control: position_control
  generator: linear_cartesian
  id: approach_goal
  parameters:
    height_approach_goal:
      binds_to:
      - mode: replace
        path: target.offset.z
      default: 0.15
      range:
      - 0.05
      - 0.25
      type: scalar
  subtask_id: reach_goal
  target:
    anchor: task_goal
    entity: null
    offset:
    - 0.0
    - 0.0
    - 0.0
    orientation:
      mode: none
    source: yaml
  termination: pose_tolerance
  type: approach
- control: position_control
  generator: linear_cartesian
  id: descend_goal
  parameters:
    height_descend_goal:
      binds_to:
      - mode: replace
        path: target.offset.z
      default: 0.0
      range:
      - 0.0
      - 0.1
      type: scalar
  subtask_id: reach_goal
  target:
    anchor: task_goal
    entity: null
    offset:
    - 0.0
    - 0.0
    - 0.0
    orientation:
      mode: none
    source: yaml
  termination: pose_tolerance
  type: descend
- control: impedance_control
  end_effector_action: open
  generator: null
  id: release
  termination: time_limit
  type: release
- control: position_control
  generator: linear_cartesian
  id: retract
  target:
    anchor: world
    entity: null
    offset:
    - 0.5
    - 0.0
    - 0.5
    orientation:
      mode: none
    source: yaml
  termination: pose_tolerance
  type: retract
skill: grasp_place
skill_type: arm_gripper
subtasks:
- anchor: object
  id: reach_obj
  metric: distance
  offset:
  - 0.0
  - 0.0
  - 0.0
  target_entity: tcp
  weight: 0.3
- anchor: goal
  id: reach_goal
  metric: distance
  offset:
  - 0.0
  - 0.0
  - 0.0
  target_entity: tcp
  weight: 0.7
