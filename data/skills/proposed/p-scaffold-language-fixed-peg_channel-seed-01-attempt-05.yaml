dsl_version: 2
phases:
- control: position_control
  generator: linear_cartesian
  id: align_1
  parameters:
    lateral_offset_x:
      binds_to:
      - mode: add
        path: target.offset.x
      default: 0.0
      range:
      - -0.01
      - 0.01
      type: scalar
    speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.08
      range:
      - 0.02
      - 0.15
      type: scalar
  subtask_id: approach
  target:
    anchor: task_object
    offset:
    - 0.0
    - 0.05
    - 0.03
    source: yaml
    tolerance: 0.01
  termination: pose_tolerance
  type: align
- control: force_threshold_switch
  generator: linear_cartesian
  id: contact_1
  parameters:
    speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.02
      range:
      - 0.005
      - 0.04
      type: scalar
  subtask_id: contact
  target:
    anchor: task_object
    offset:
    - 0.0
    - 0.02
    - 0.0
    orientation:
      align_with: channel_axis
      axis:
      - 0
      - 0
      - 1
      mode: align_axis
      tolerance: 0.05
    source: yaml
    tolerance: 0.005
  termination: contact_detected
  type: contact
- control: impedance_control
  generator: linear_cartesian
  guards:
  - args: {}
    id: push_force_guard
    on_failure: abort
    predicate: force_below
    threshold: 30.0
    when: during_phase
  id: push_1
  parameters:
    force_guard_threshold:
      binds_to:
      - mode: replace
        path: guards.push_force_guard.threshold
      default: 30.0
      range:
      - 20.0
      - 40.0
      type: scalar
    push_distance:
      binds_to:
      - mode: add
        path: target.offset.y
      default: 0.08
      range:
      - 0.02
      - 0.2
      type: scalar
    push_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.04
      range:
      - 0.01
      - 0.08
      type: scalar
  retries:
    max_attempts: 1
    offset:
    - 0.0
    - 0.005
    - 0.0
    strategy: offset_target
  subtask_id: push
  target:
    anchor: world
    offset:
    - 0.5
    - -0.16
    - 0.04
    orientation:
      align_with: channel_axis
      axis:
      - 0
      - 0
      - 1
      mode: align_axis
      tolerance: 0.05
    source: yaml
    tolerance: 0.02
  termination: pose_tolerance
  type: push
- control: position_control
  generator: linear_cartesian
  id: retract_1
  parameters:
    retract_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.1
      range:
      - 0.05
      - 0.2
      type: scalar
  target:
    anchor: current_tcp
    offset:
    - 0.0
    - 0.0
    - 0.15
    source: yaml
    tolerance: 0.02
  termination: pose_tolerance
  type: retract
skill: peg_channel
skill_type: arm
