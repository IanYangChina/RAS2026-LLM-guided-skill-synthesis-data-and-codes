dsl_version: 2
phases:
- control: position_control
  generator: linear_cartesian
  id: lift_above_obstacle
  parameters:
    lift_height:
      binds_to:
      - mode: replace
        path: target.offset.z
      default: 0.25
      range:
      - 0.15
      - 0.35
      type: scalar
    lift_tolerance:
      binds_to:
      - mode: replace
        path: termination.pose_tolerance
      default: 0.03
      range:
      - 0.02
      - 0.05
      type: scalar
  retries:
    max_attempts: 0
    strategy: repeat
  target:
    anchor: current_tcp
    offset:
    - 0.0
    - 0.0
    - 0.25
    orientation:
      mode: none
    source: yaml
    tolerance: 0.03
  termination: pose_tolerance
  type: lift
- control: position_control
  generator: arc_cartesian
  id: arc_to_goal
  parameters:
    approach_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.08
      range:
      - 0.02
      - 0.15
      type: scalar
    arc_height:
      binds_to:
      - mode: replace
        path: generator.arc_height
      default: 0.1
      range:
      - 0.05
      - 0.2
      type: scalar
  retries:
    max_attempts: 1
    offset:
    - 0.01
    - 0.01
    - 0.0
    strategy: offset_target
  subtask_id: reach_goal
  target:
    anchor: world
    offset:
    - 0.35
    - 0.0
    - 0.42
    orientation:
      mode: none
    source: yaml
    tolerance: 0.025
  termination: pose_tolerance
  type: approach
- control: position_control
  generator: linear_cartesian
  id: descend_to_goal
  parameters:
    descend_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.03
      range:
      - 0.01
      - 0.05
      type: scalar
    descend_tolerance:
      binds_to:
      - mode: replace
        path: termination.pose_tolerance
      default: 0.02
      range:
      - 0.01
      - 0.03
      type: scalar
  retries:
    max_attempts: 1
    offset:
    - 0.005
    - 0.005
    - 0.0
    strategy: offset_target
  subtask_id: reach_goal
  target:
    anchor: world
    offset:
    - 0.35
    - 0.0
    - 0.32
    orientation:
      mode: none
    source: yaml
    tolerance: 0.02
  termination: pose_tolerance
  type: descend
skill: obstacle_reach
skill_type: arm_gripper
subtasks:
- anchor: world
  id: reach_goal
  metric: distance
  offset:
  - 0.35
  - 0.0
  - 0.32
  target_entity: tcp
  weight: 1.0
