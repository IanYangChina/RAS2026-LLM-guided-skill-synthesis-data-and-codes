dsl_version: 2
phases:
- control: position_control
  generator: linear_cartesian
  id: approach_overhead
  parameters:
    overhead_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.2
      range:
      - 0.1
      - 0.35
      type: scalar
    overhead_tolerance:
      binds_to:
      - mode: replace
        path: termination.pose_tolerance
      default: 0.03
      range:
      - 0.015
      - 0.05
      type: scalar
  subtask_id: reach_peg
  target:
    anchor: task_object
    offset:
    - 0.0
    - 0.08
    - 0.15
    source: yaml
    tolerance: 0.03
  termination: pose_tolerance
  type: approach
- control: force_threshold_switch
  generator: linear_cartesian
  id: descend_to_contact
  parameters:
    contact_force:
      binds_to:
      - mode: replace
        path: termination.force_threshold
      default: 5.0
      range:
      - 2.0
      - 10.0
      type: scalar
    descend_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.08
      range:
      - 0.03
      - 0.15
      type: scalar
  subtask_id: reach_peg
  target:
    anchor: task_object
    offset:
    - 0.0
    - 0.03
    - 0.005
    source: yaml
    tolerance: 0.02
  termination: force_exceeded
  type: descend
- control: impedance_control
  generator: linear_cartesian
  id: push_through_channel
  parameters:
    lateral_offset_x:
      binds_to:
      - mode: add
        path: target.offset.x
      default: 0.0
      range:
      - -0.03
      - 0.03
      type: scalar
    push_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.1
      range:
      - 0.04
      - 0.2
      type: scalar
    push_tolerance:
      binds_to:
      - mode: replace
        path: termination.pose_tolerance
      default: 0.02
      range:
      - 0.01
      - 0.04
      type: scalar
  retries:
    max_attempts: 2
    offset:
    - 0.0
    - -0.005
    - 0.0
    strategy: offset_target
  subtask_id: push_to_exit
  target:
    anchor: task_goal
    offset:
    - 0.0
    - 0.0
    - 0.0
    orientation:
      align_with: channel_axis
      axis:
      - 0.0
      - 0.0
      - 1.0
      mode: align_axis
      tolerance: 0.1
    source: yaml
    tolerance: 0.02
  termination: pose_tolerance
  type: push
skill: peg_channel
subtasks:
- anchor: object
  id: reach_peg
  offset:
  - 0.0
  - 0.025
  - 0.01
  weight: 0.3
- id: push_to_exit
  metric: goal_progress
  weight: 0.7
