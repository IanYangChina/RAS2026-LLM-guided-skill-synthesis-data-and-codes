dsl_version: 2
phases:
- control: position_control
  generator: linear_cartesian
  id: approach_1
  orientation:
    mode: none
  parameters:
    approach_height:
      binds_to:
      - mode: replace
        path: target.offset.z
      default: 0.1
      range:
      - 0.05
      - 0.3
      type: scalar
    speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.05
      range:
      - 0.01
      - 0.1
      type: scalar
  subtask_id: approach
  target:
    anchor: task_object
    offset:
    - 0
    - 0.08
    - 0
  termination: pose_tolerance
  type: approach
- control: position_control
  generator: linear_cartesian
  id: contact_1
  orientation:
    mode: none
  parameters:
    contact_z:
      binds_to:
      - mode: replace
        path: target.offset.z
      default: 0.025
      range:
      - 0.02
      - 0.05
      type: scalar
  subtask_id: contact
  target:
    anchor: task_object
    offset:
    - 0
    - 0.03
    - 0
  termination: pose_tolerance
  type: descend
- control: admittance_control
  generator: linear_cartesian
  guards:
  - args: {}
    id: progress_check
    on_failure: retry
    predicate: object_progress
    threshold: 0.001
    when: during_phase
  id: push_1
  orientation:
    mode: none
  parameters:
    push_distance:
      binds_to:
      - mode: replace
        path: target.offset_along_axis.distance
      default: 0.15
      range:
      - 0.02
      - 0.2
      type: scalar
  retries:
    max_attempts: 2
    offset:
    - 0
    - -0.005
    - 0
    strategy: offset_target
  subtask_id: push
  target:
    anchor: task_goal
    offset_along_axis:
      axis: task_goal_direction
      mode: add_to_offset
  termination: pose_tolerance
  type: push
- control: position_control
  generator: arc_cartesian
  id: retract_1
  orientation:
    mode: none
  subtask_id: approach
  termination: pose_tolerance
  type: retract
skill: push_to_goal
