dsl_version: 2
phases:
- control: position_control
  end_effector_action: null
  generator: linear_cartesian
  guards: []
  id: approach_1
  parameters:
    approach_height:
      binds_to:
      - mode: replace
        path: target.offset.z
      default: 0.15
      range:
      - 0.1
      - 0.2
      type: scalar
    lateral_x_offset:
      binds_to:
      - mode: add
        path: target.offset.x
      default: 0.0
      range:
      - -0.05
      - 0.05
      type: scalar
    lateral_y_offset:
      binds_to:
      - mode: add
        path: target.offset.y
      default: 0.0
      range:
      - -0.05
      - 0.05
      type: scalar
  retries:
    max_attempts: 0
    strategy: repeat
  subtask_id: reach_approach
  target:
    anchor: task_goal
    offset:
    - 0.0
    - 0.0
    - 0.15
    orientation:
      align_with: world_z
      axis:
      - 0.0
      - 0.0
      - 1.0
      mode: align_axis
      tolerance: 0.1
    source: yaml
    tolerance: 0.01
  termination: pose_tolerance
  type: approach
- control: admittance_control
  end_effector_action: null
  generator: linear_cartesian
  guards: []
  id: descend_1
  parameters:
    descent_force_threshold:
      binds_to:
      - mode: replace
        path: termination.force_threshold
      default: 10.0
      range:
      - 5.0
      - 20.0
      type: scalar
  retries:
    max_attempts: 0
    strategy: repeat
  subtask_id: null
  target:
    anchor: task_goal
    offset:
    - 0.0
    - 0.0
    - -0.01
    orientation:
      align_with: world_z
      axis:
      - 0.0
      - 0.0
      - 1.0
      mode: align_axis
      tolerance: 0.1
    source: yaml
  termination: force_exceeded
  type: descend
- control: admittance_control
  end_effector_action: null
  generator: linear_cartesian
  guards: []
  id: insert_1
  parameters:
    insertion_depth:
      binds_to:
      - mode: replace
        path: target.offset_along_axis.distance
      default: 0.1
      range:
      - 0.05
      - 0.2
      type: scalar
    insertion_force_threshold:
      binds_to:
      - mode: replace
        path: termination.force_threshold
      default: 35.0
      range:
      - 20.0
      - 50.0
      type: scalar
  retries:
    max_attempts: 2
    offset:
    - 0.005
    - 0.005
    - 0.0
    strategy: offset_target
  subtask_id: reach_insertion
  target:
    anchor: task_goal
    offset:
    - 0.0
    - 0.0
    - 0.0
    offset_along_axis:
      axis: world_z
      distance: 0.1
      mode: add_to_offset
      sign: negative
    orientation:
      align_with: world_z
      axis:
      - 0.0
      - 0.0
      - 1.0
      mode: align_axis
      tolerance: 0.1
    source: yaml
  termination: force_exceeded
  type: push
skill: peg_insert
skill_type: arm_gripper
subtasks:
- anchor: goal
  id: reach_approach
  metric: distance
  offset:
  - 0.0
  - 0.0
  - 0.15
  target_entity: tcp
  weight: 0.3
- anchor: goal
  id: reach_insertion
  metric: goal_progress
  target_entity: object
  weight: 0.7
