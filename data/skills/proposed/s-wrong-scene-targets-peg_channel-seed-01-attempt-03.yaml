dsl_version: 2
phases:
- control: position_control
  generator: linear_cartesian
  id: approach_peg
  parameters:
    approach_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.05
      range:
      - 0.02
      - 0.2
      type: scalar
  subtask_id: pre_push_align
  target:
    anchor: task_object
    offset:
    - 0
    - 0
    - 0.08
    source: yaml
    tolerance: 0.02
  termination: pose_tolerance
  type: approach
- control: position_control
  generator: linear_cartesian
  id: align_lateral
  orientation:
    mode: keep_current
  parameters:
    lateral_x:
      binds_to:
      - mode: add
        path: target.offset.x
      default: 0.0
      range:
      - -0.02
      - 0.02
      type: scalar
    lateral_y:
      binds_to:
      - mode: add
        path: target.offset.y
      default: 0.0
      range:
      - -0.02
      - 0.02
      type: scalar
  subtask_id: pre_push_align
  target:
    anchor: task_object
    offset:
    - 0
    - 0
    - 0.04
    source: yaml
    tolerance: 0.005
  termination: pose_tolerance
  type: align
- control: force_threshold_switch
  generator: linear_cartesian
  id: descend_contact
  orientation:
    mode: keep_current
  parameters:
    contact_force_threshold:
      binds_to:
      - mode: replace
        path: termination.force_threshold
      default: 5
      range:
      - 1
      - 10
      type: scalar
  subtask_id: pre_push_align
  target:
    anchor: task_object
    offset:
    - 0
    - 0
    - 0.0
    source: yaml
    tolerance: 0.01
  termination: force_exceeded
  type: contact
- control: impedance_control
  generator: impedance_motion
  guards:
  - args: {}
    id: guard_force
    on_failure: abort
    predicate: force_below
    threshold: 40
    when: during_phase
  id: push_channel
  orientation:
    mode: keep_current
  parameters:
    force_limit:
      binds_to:
      - mode: replace
        path: guards.guard_force.threshold
      default: 30
      range:
      - 20
      - 40
      type: scalar
    phase_timeout:
      binds_to:
      - mode: replace
        path: duration.max_time
      default: 15
      range:
      - 5
      - 30
      type: scalar
    push_distance:
      binds_to:
      - mode: replace
        path: target.offset_along_axis.distance
      default: 0.16
      range:
      - 0.1
      - 0.2
      type: scalar
    push_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.03
      range:
      - 0.01
      - 0.05
      type: scalar
  subtask_id: insertion_progress
  target:
    anchor: current_tcp
    offset:
    - 0
    - 0
    - 0
    offset_along_axis:
      axis:
      - 0
      - -1
      - 0
      distance: 0.16
      mode: add_to_offset
    source: yaml
  termination: time_limit
  type: push
- control: position_control
  generator: linear_cartesian
  id: lift_retract
  orientation:
    mode: keep_current
  target:
    anchor: current_tcp
    offset:
    - 0
    - 0
    - 0.05
    source: yaml
    tolerance: 0.02
  termination: pose_tolerance
  type: retract
skill: peg_channel
subtasks:
- anchor: object
  id: pre_push_align
  metric: distance
  offset:
  - 0
  - 0
  - 0.08
  target_entity: tcp
  weight: 0.3
- anchor: fixture
  id: insertion_progress
  metric: goal_progress
  target_entity: object
  weight: 0.7
