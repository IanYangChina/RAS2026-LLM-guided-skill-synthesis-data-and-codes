dsl_version: 2
phases:
- control: position_control
  generator: linear_cartesian
  id: approach_1
  parameters:
    approach_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.05
      range:
      - 0.01
      - 0.1
      type: scalar
    approach_z_offset:
      binds_to:
      - mode: replace
        path: target.offset.z
      default: 0.1
      range:
      - 0.05
      - 0.15
      type: scalar
  subtask_id: pre_push
  target:
    anchor: task_object
    entity: peg
    offset:
    - 0.0
    - 0.05
    - 0.1
    orientation:
      mode: keep_current
    source: yaml
    tolerance: 0.01
  termination: pose_tolerance
  type: approach
- control: force_threshold_switch
  generator: linear_cartesian
  id: descend_1
  parameters:
    descend_force_threshold:
      binds_to:
      - mode: replace
        path: termination.force_threshold
      default: 5.0
      range:
      - 2.0
      - 20.0
      type: scalar
    descend_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.02
      range:
      - 0.01
      - 0.05
      type: scalar
  target:
    anchor: task_object
    entity: peg
    offset:
    - 0.0
    - 0.05
    - 0.02
    orientation:
      mode: keep_current
    source: yaml
    tolerance: 0.005
  termination: force_exceeded
  type: descend
- control: impedance_control
  generator: impedance_motion
  guards:
  - args: {}
    id: force_limit_guard
    on_failure: abort
    predicate: force_below
    threshold: 40.0
    when: during_phase
  id: push_1
  parameters:
    push_distance:
      binds_to:
      - mode: replace
        path: target.offset_along_axis.distance
      default: 0.16
      range:
      - 0.05
      - 0.2
      type: scalar
    push_force_threshold:
      binds_to:
      - mode: replace
        path: termination.force_threshold
      default: 25.0
      range:
      - 5.0
      - 40.0
      type: scalar
    push_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.05
      range:
      - 0.01
      - 0.1
      type: scalar
  retries:
    max_attempts: 1
    offset:
    - 0.0
    - 0.005
    - 0.0
    strategy: offset_target
  subtask_id: push_through
  target:
    anchor: current_tcp
    offset:
    - 0.0
    - 0.0
    - 0.0
    offset_along_axis:
      axis: task_goal_direction
      distance: 0.16
      mode: add_to_offset
      sign: positive
    orientation:
      align_with: task_goal_direction
      axis:
      - 1.0
      - 0.0
      - 0.0
      mode: align_axis
      tolerance: 0.1
    source: yaml
    tolerance: 0.01
  termination: force_exceeded
  type: push
- control: position_control
  generator: linear_cartesian
  id: retract_1
  parameters:
    retract_height:
      binds_to:
      - mode: replace
        path: target.offset.z
      default: 0.1
      range:
      - 0.05
      - 0.15
      type: scalar
    retract_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.05
      range:
      - 0.01
      - 0.1
      type: scalar
  target:
    anchor: current_tcp
    offset:
    - 0.0
    - 0.0
    - 0.1
    orientation:
      mode: keep_current
    source: yaml
    tolerance: 0.01
  termination: pose_tolerance
  type: retract
skill: peg_channel
subtasks:
- anchor: object
  id: pre_push
  metric: distance
  offset:
  - 0.0
  - 0.05
  - 0.02
  target_entity: tcp
  weight: 0.3
- anchor: goal
  id: push_through
  metric: goal_progress
  offset:
  - 0.0
  - 0.0
  - 0.0
  target_entity: object
  weight: 0.7
