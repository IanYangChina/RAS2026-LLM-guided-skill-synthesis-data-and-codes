dsl_version: 2
phases:
- control: position_control
  generator: linear_cartesian
  guards: []
  id: approach_above_socket
  parameters:
    approach_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.05
      range:
      - 0.02
      - 0.1
      type: scalar
  retries:
    max_attempts: 1
    offset:
    - 0
    - 0
    - 0.01
    strategy: offset_target
  subtask_id: approach_socket
  target:
    anchor: task_goal
    entity: null
    offset:
    - 0
    - 0
    - 0.06
    orientation:
      align_with: channel_axis
      axis:
      - 0
      - 0
      - -1
      mode: align_axis
      tolerance: 0.05
    source: yaml
    tolerance: 0.005
  termination: pose_tolerance
  type: approach
- control: position_control
  generator: linear_cartesian
  guards: []
  id: align_lateral
  parameters:
    lateral_x_offset:
      binds_to:
      - mode: add
        path: target.offset.x
      default: 0.0
      range:
      - -0.01
      - 0.01
      type: scalar
    lateral_y_offset:
      binds_to:
      - mode: add
        path: target.offset.y
      default: 0.0
      range:
      - -0.01
      - 0.01
      type: scalar
  retries:
    max_attempts: 1
    offset:
    - 0.005
    - 0.005
    - 0
    strategy: offset_target
  subtask_id: approach_socket
  target:
    anchor: task_goal
    entity: null
    offset:
    - 0
    - 0
    - 0.06
    orientation:
      align_with: channel_axis
      axis:
      - 0
      - 0
      - -1
      mode: align_axis
      tolerance: 0.02
    source: yaml
    tolerance: 0.002
  termination: pose_tolerance
  type: align
- control: impedance_control
  generator: linear_cartesian
  guards:
  - args: {}
    id: lateral_force_guard
    on_failure: retry
    predicate: force_below
    threshold: 40
    when: during_phase
  id: insert_into_hole
  parameters:
    force_threshold:
      binds_to:
      - mode: replace
        path: termination.force_threshold
      default: 20
      range:
      - 5
      - 35
      type: scalar
    insert_depth:
      binds_to:
      - mode: replace
        path: target.offset_along_axis.distance
      default: 0.055
      range:
      - 0.03
      - 0.07
      type: scalar
    insert_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.02
      range:
      - 0.005
      - 0.05
      type: scalar
  retries:
    max_attempts: 2
    offset:
    - 0.003
    - 0.003
    - 0
    strategy: offset_target
  subtask_id: insert_peg
  target:
    anchor: task_goal
    entity: null
    offset:
    - 0
    - 0
    - 0.06
    offset_along_axis:
      axis: channel_axis
      distance: 0.055
      mode: add_to_offset
      sign: positive
    orientation:
      align_with: channel_axis
      axis:
      - 0
      - 0
      - -1
      mode: align_axis
      tolerance: 0.02
    source: yaml
    tolerance: 0.01
  termination: force_exceeded
  type: insert
skill: peg_insert
skill_type: arm
subtasks:
- anchor: goal
  id: approach_socket
  metric: distance
  offset:
  - 0
  - 0
  - 0.04
  target_entity: tcp
  weight: 0.3
- anchor: goal
  id: insert_peg
  metric: distance
  offset:
  - 0
  - 0
  - -0.06
  target_entity: tcp
  weight: 0.7
