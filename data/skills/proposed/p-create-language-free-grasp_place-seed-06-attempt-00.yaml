dsl_version: 2
phases:
- control: position_control
  generator: linear_cartesian
  id: approach_1
  subtask_id: reach_object
  target:
    anchor: task_object
    offset:
    - 0.0
    - 0.0
    - 0.05
    orientation:
      mode: keep_current
    source: yaml
  termination: pose_tolerance
  type: approach
- control: position_control
  generator: linear_cartesian
  id: descend_1
  subtask_id: touch_object
  target:
    anchor: task_object
    offset:
    - 0.0
    - 0.0
    - 0.0
    orientation:
      mode: keep_current
    source: yaml
  termination: pose_tolerance
  type: descend
- control: position_control
  end_effector_action: force_grasp
  id: grasp
  target:
    anchor: current_tcp
    offset:
    - 0.0
    - 0.0
    - 0.0
    orientation:
      mode: keep_current
    source: yaml
  termination: time_limit
  type: grasp
- control: position_control
  generator: linear_cartesian
  id: lift
  parameters:
    lift_height:
      binds_to:
      - mode: replace
        path: target.offset.z
      default: 0.18
      range:
      - 0.15
      - 0.25
      type: scalar
  subtask_id: lift_object
  target:
    anchor: task_object
    offset:
    - 0.0
    - 0.0
    - 0.18
    orientation:
      mode: keep_current
    source: yaml
  termination: pose_tolerance
  type: lift
- control: position_control
  generator: arc_cartesian
  guards:
  - args: {}
    id: object_still_lifted
    on_failure: retry
    predicate: object_lifted
    threshold: 0.02
    when: during_phase
  id: approach_2
  parameters:
    approach_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.08
      range:
      - 0.02
      - 0.2
      type: scalar
    approach_time:
      binds_to:
      - mode: replace
        path: duration.max_time
      default: 5.0
      range:
      - 2.0
      - 10.0
      type: scalar
    arc_height:
      binds_to:
      - mode: replace
        path: generator.arc_height
      default: 0.15
      range:
      - 0.05
      - 0.3
      type: scalar
  retries:
    max_attempts: 2
    offset:
    - 0.0
    - 0.0
    - 0.02
    strategy: offset_target
  subtask_id: pre_place
  target:
    anchor: task_goal
    offset:
    - 0.0
    - 0.0
    - 0.05
    orientation:
      mode: keep_current
    source: yaml
  termination: time_limit
  type: approach
- control: position_control
  generator: linear_cartesian
  id: descend_2
  subtask_id: place
  target:
    anchor: task_goal
    offset:
    - 0.0
    - 0.0
    - 0.0
    orientation:
      mode: keep_current
    source: yaml
  termination: pose_tolerance
  type: descend
- control: position_control
  end_effector_action: open
  id: release
  target:
    anchor: current_tcp
    offset:
    - 0.0
    - 0.0
    - 0.0
    orientation:
      mode: keep_current
    source: yaml
  termination: time_limit
  type: release
skill: grasp_place
skill_type: arm_gripper
subtasks:
- anchor: object
  id: reach_object
  offset:
  - 0.0
  - 0.0
  - 0.05
  weight: 0.3
- anchor: object
  id: touch_object
  offset:
  - 0.0
  - 0.0
  - 0.0
  weight: 0.2
- anchor: object
  id: lift_object
  offset:
  - 0.0
  - 0.0
  - 0.18
  weight: 0.1
- anchor: goal
  id: pre_place
  offset:
  - 0.0
  - 0.0
  - 0.05
  weight: 0.2
- anchor: goal
  id: place
  offset:
  - 0.0
  - 0.0
  - 0.0
  weight: 0.2
