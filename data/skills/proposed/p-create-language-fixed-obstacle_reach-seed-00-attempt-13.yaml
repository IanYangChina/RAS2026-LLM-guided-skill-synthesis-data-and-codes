dsl_version: 2
phases:
- control: position_control
  generator: linear_cartesian
  id: approach_via
  parameters:
    speed_approach_via:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.5
      range:
      - 0.2
      - 0.7
      type: scalar
    via_height:
      binds_to:
      - mode: replace
        path: target.offset.z
      default: 0.5
      range:
      - 0.35
      - 0.7
      type: scalar
    via_tolerance:
      binds_to:
      - mode: replace
        path: termination.pose_tolerance
      default: 0.15
      range:
      - 0.05
      - 0.3
      type: scalar
  target:
    anchor: world
    offset:
      x: 0.5
      y: 0.0
      z: 0.5
    orientation:
      mode: keep_current
    source: yaml
    tolerance: 0.1
  termination: pose_tolerance
  type: approach
- control: position_control
  generator: linear_cartesian
  id: approach_goal
  parameters:
    approach_goal_z_offset:
      binds_to:
      - mode: replace
        path: target.offset.z
      default: 0.25
      range:
      - 0.1
      - 0.4
      type: scalar
    speed_approach_goal:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.3
      range:
      - 0.1
      - 0.5
      type: scalar
  target:
    anchor: task_goal
    entity: goal_marker
    offset:
      x: 0.0
      y: 0.0
      z: 0.25
    orientation:
      mode: keep_current
    source: yaml
    tolerance: 0.05
  termination: pose_tolerance
  type: approach
- control: position_control
  generator: linear_cartesian
  id: fine_approach
  parameters:
    speed_fine:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.08
      range:
      - 0.02
      - 0.15
      type: scalar
  target:
    anchor: task_goal
    entity: goal_marker
    offset:
      x: 0.0
      y: 0.0
      z: 0.0
    orientation:
      mode: keep_current
    source: yaml
    tolerance: 0.005
  termination: pose_tolerance
  type: approach
skill: obstacle_reach
