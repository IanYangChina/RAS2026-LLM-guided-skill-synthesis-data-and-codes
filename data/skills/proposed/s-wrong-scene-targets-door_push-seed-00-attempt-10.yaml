dsl_version: 2
phases:
- control: force_threshold_switch
  generator: linear_cartesian
  id: contact_approach
  parameters:
    approach_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.08
      range:
      - 0.01
      - 0.15
      type: scalar
    contact_force_threshold:
      binds_to:
      - mode: replace
        path: termination.force_threshold
      default: 8.0
      range:
      - 3.0
      - 15.0
      type: scalar
  subtask_id: reach_contact
  target:
    anchor: fixture
    entity: door_panel
    offset:
    - -0.2
    - 0.0
    - 0.35
    orientation:
      mode: none
    source: yaml
    tolerance: 0.02
  termination: force_exceeded
  type: approach
- control: impedance_control
  generator: linear_cartesian
  guards:
  - id: hinge_reached
    on_failure: continue
    predicate: hinge_delta_reached
    threshold: 0.05
    when: during_phase
  - id: force_ok
    on_failure: retry
    predicate: force_below
    threshold: 25.0
    when: during_phase
  id: push_door
  parameters:
    push_distance:
      binds_to:
      - mode: replace
        path: target.offset_along_axis.distance
      default: 0.3
      range:
      - 0.1
      - 0.6
      type: scalar
    push_duration:
      binds_to:
      - mode: replace
        path: duration.max_time
      default: 2.5
      range:
      - 1.0
      - 5.0
      type: scalar
    push_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.05
      range:
      - 0.01
      - 0.15
      type: scalar
  retries:
    max_attempts: 2
    offset:
    - 0.0
    - -0.01
    - 0.0
    strategy: offset_target
  subtask_id: push_door
  target:
    anchor: current_tcp
    offset:
    - 0.0
    - 0.0
    - 0.0
    offset_along_axis:
      axis: world_y
      distance: 0.3
      mode: add_to_offset
      sign: positive
    orientation:
      mode: none
    source: yaml
    tolerance: 0.05
  termination: time_limit
  type: push
skill: door_push
subtasks:
- anchor: fixture
  id: reach_contact
  offset:
  - -0.2
  - 0.0
  - 0.35
  weight: 0.3
- anchor: fixture
  id: push_door
  metric: hinge_angle
  target_entity: hinge
  weight: 0.7
