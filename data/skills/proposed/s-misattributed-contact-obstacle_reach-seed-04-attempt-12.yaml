dsl_version: 2
phases:
- control: position_control
  generator: arc_cartesian
  id: approach_over
  parameters:
    approach_speed:
      binds_to:
      - mode: scale
        path: generator.speed
      default: 0.15
      range:
      - 0.05
      - 0.3
      type: scalar
    arc_height:
      binds_to:
      - mode: add
        path: generator.arc_height
      default: 0.25
      range:
      - 0.15
      - 0.35
      type: scalar
  subtask_id: reach_over
  target:
    anchor: task_goal
    offset:
    - 0.0
    - 0.0
    - 0.25
    orientation:
      mode: none
    source: yaml
    tolerance: 0.02
  termination: pose_tolerance
  type: approach
- control: position_control
  generator: linear_cartesian
  guards:
  - args: {}
    id: contact_guard
    on_failure: retry
    predicate: force_below
    threshold: 4.5
    when: during_phase
  id: descend_to_goal
  parameters:
    descend_speed:
      binds_to:
      - mode: scale
        path: generator.speed
      default: 0.1
      range:
      - 0.05
      - 0.2
      type: scalar
    force_threshold:
      binds_to:
      - mode: replace
        path: guards.contact_guard.threshold
      default: 4.5
      range:
      - 2.0
      - 5.0
      type: scalar
  retries:
    max_attempts: 2
    offset:
    - 0.015
    - 0.0
    - 0.0
    strategy: offset_target
  subtask_id: reach_goal
  target:
    anchor: task_goal
    offset:
    - 0.0
    - 0.0
    - 0.0
    orientation:
      mode: none
    source: yaml
    tolerance: 0.02
  termination: pose_tolerance
  type: descend
skill: obstacle_reach
subtasks:
- anchor: goal
  id: reach_over
  metric: distance
  offset:
  - 0.0
  - 0.0
  - 0.25
  target_entity: tcp
  weight: 0.3
- anchor: goal
  id: reach_goal
  metric: distance
  offset:
  - 0.0
  - 0.0
  - 0.0
  target_entity: tcp
  weight: 0.7
