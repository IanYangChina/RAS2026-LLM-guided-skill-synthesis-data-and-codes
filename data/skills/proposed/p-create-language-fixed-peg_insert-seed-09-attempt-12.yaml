dsl_version: 2
phases:
- control: position_control
  generator: linear_cartesian
  id: align_1
  subtask_id: align
  target:
    anchor: fixture
    entity: peg_socket
    offset:
    - 0.0
    - 0.0
    - 0.12
    orientation:
      align_with: insertion_axis
      axis:
      - 0.0
      - 0.0
      - 1.0
      mode: align_axis
    source: yaml
  termination: pose_tolerance
  type: align
- control: position_control
  generator: linear_cartesian
  id: approach_1
  subtask_id: approach
  target:
    anchor: fixture
    entity: peg_socket
    offset:
    - 0.0
    - 0.0
    - 0.095
    orientation:
      align_with: insertion_axis
      axis:
      - 0.0
      - 0.0
      - 1.0
      mode: align_axis
    source: yaml
  termination: pose_tolerance
  type: approach
- control: impedance_control
  generator: impedance_motion
  guards:
  - id: force_limit
    on_failure: retry
    predicate: force_below
    threshold: 40.0
    when: during_phase
  id: insert_1
  parameters:
    insert_depth:
      binds_to:
      - mode: replace
        path: target.offset_along_axis.distance
      default: 0.04
      range:
      - 0.03
      - 0.05
      type: scalar
    insert_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.008
      range:
      - 0.005
      - 0.015
      type: scalar
    insert_tol:
      binds_to:
      - mode: replace
        path: termination.pose_tolerance
      default: 0.01
      range:
      - 0.005
      - 0.015
      type: scalar
    max_insert_time:
      binds_to:
      - mode: replace
        path: duration.max_time
      default: 5.0
      range:
      - 3.0
      - 8.0
      type: scalar
  retries:
    max_attempts: 2
    offset:
    - 0.015
    - 0.015
    - 0.0
    strategy: offset_target
  subtask_id: insert
  target:
    anchor: fixture
    entity: peg_socket
    offset:
    - 0.0
    - 0.0
    - 0.04
    offset_along_axis:
      axis: channel_axis
      distance: 0.04
      mode: add_to_offset
      sign: positive
    orientation:
      align_with: insertion_axis
      axis:
      - 0.0
      - 0.0
      - 1.0
      mode: align_axis
    source: yaml
  termination:
  - pose_tolerance
  - time_limit
  type: insert
skill: peg_insert
