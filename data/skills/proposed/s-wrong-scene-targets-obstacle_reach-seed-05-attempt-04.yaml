dsl_version: 2
phases:
- control: position_control
  generator: arc_cartesian
  id: approach_over_target
  parameters:
    arc_height:
      binds_to:
      - mode: add
        path: generator.arc_height
      default: 0.15
      range:
      - 0.05
      - 0.3
      type: scalar
    max_time:
      binds_to:
      - mode: add
        path: duration.max_time
      default: 2.0
      range:
      - 0.5
      - 5.0
      type: scalar
    speed:
      binds_to:
      - mode: add
        path: generator.speed
      default: 0.08
      range:
      - 0.01
      - 0.2
      type: scalar
  subtask_id: reach_goal
  target:
    anchor: fixture
    offset:
    - 0.0
    - 0.0
    - 0.1
    source: yaml
  termination: time_limit
  type: approach
- control: position_control
  generator: linear_cartesian
  guards:
  - args: {}
    id: contact_force_limit
    on_failure: abort
    predicate: force_below
    threshold: 5.0
    when: during_phase
  id: descend_to_goal
  parameters:
    descend_speed:
      binds_to:
      - mode: add
        path: generator.speed
      default: 0.05
      range:
      - 0.01
      - 0.15
      type: scalar
    descend_tolerance:
      binds_to:
      - mode: add
        path: termination.pose_tolerance
      default: 0.02
      range:
      - 0.01
      - 0.05
      type: scalar
  subtask_id: reach_goal
  target:
    anchor: fixture
    offset:
    - 0.0
    - 0.0
    - 0.0
    source: yaml
  termination: pose_tolerance
  type: descend
skill: obstacle_reach
subtasks:
- anchor: fixture
  id: reach_goal
  metric: distance
  offset:
  - 0.0
  - 0.0
  - 0.05
  target_entity: tcp
  weight: 1.0
