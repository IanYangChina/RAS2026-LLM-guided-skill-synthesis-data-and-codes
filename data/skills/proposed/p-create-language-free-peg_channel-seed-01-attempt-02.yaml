dsl_version: 2
phases:
- control: position_control
  generator: linear_cartesian
  id: approach_to_precontact
  parameters:
    approach_height:
      binds_to:
      - mode: replace
        path: target.offset.z
      default: 0.065
      range:
      - 0.04
      - 0.1
      type: scalar
  subtask_id: reach_approach
  target:
    anchor: task_object
    entity: peg
    offset:
    - 0.0
    - 0.02
    - 0.065
    orientation:
      align_with: channel_axis
      axis:
      - 0.0
      - 0.0
      - 1.0
      mode: align_axis
      tolerance: 0.05
    source: yaml
    tolerance: 0.005
  termination: pose_tolerance
  type: approach
- control: position_control
  generator: linear_cartesian
  id: contact_peg
  parameters:
    contact_distance:
      binds_to:
      - mode: replace
        path: target.offset_along_axis.distance
      default: 0.025
      range:
      - 0.01
      - 0.04
      type: scalar
  subtask_id: reach_approach
  target:
    anchor: current_tcp
    offset:
    - 0.0
    - 0.0
    - 0.0
    offset_along_axis:
      axis: channel_axis
      distance: 0.025
      mode: replace_offset_projection
      sign: positive
    source: yaml
    tolerance: 0.005
  termination: pose_tolerance
  type: approach
- control: impedance_control
  generator: impedance_motion
  guards:
  - args: {}
    id: peg_progress_check
    on_failure: retry
    predicate: object_progress
    threshold: 0.05
    when: during_phase
  id: push_through_channel
  parameters:
    push_distance:
      binds_to:
      - mode: replace
        path: target.offset_along_axis.distance
      default: 0.16
      range:
      - 0.14
      - 0.2
      type: scalar
    push_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.02
      range:
      - 0.01
      - 0.05
      type: scalar
  retries:
    max_attempts: 2
    offset:
    - 0.0
    - 0.0
    - 0.0
    strategy: offset_target
  subtask_id: reach_goal
  target:
    anchor: current_tcp
    offset:
    - 0.0
    - 0.0
    - 0.0
    offset_along_axis:
      axis: channel_axis
      distance: 0.16
      mode: replace_offset_projection
      sign: positive
    source: yaml
    tolerance: 0.02
  termination: pose_tolerance
  type: push
skill: peg_channel
subtasks:
- anchor: object
  id: reach_approach
  metric: distance
  offset:
  - 0.0
  - 0.02
  - 0.065
  target_entity: tcp
  weight: 0.3
- anchor: goal
  id: reach_goal
  metric: distance
  offset:
  - 0.0
  - 0.0
  - 0.025
  target_entity: tcp
  weight: 0.7
