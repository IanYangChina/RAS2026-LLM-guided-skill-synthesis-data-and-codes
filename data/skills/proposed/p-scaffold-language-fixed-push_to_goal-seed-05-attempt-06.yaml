dsl_version: 2
phases:
- control: position_control
  generator: arc_cartesian
  id: approach_1
  orientation:
    mode: keep_current
  subtask_id: approach
  target:
    anchor: task_object
    offset:
    - 0
    - 0.08
    - 0.05
    source: yaml
    tolerance: 0.02
  termination: pose_tolerance
  type: approach
- control: force_threshold_switch
  generator: linear_cartesian
  id: contact_1
  orientation:
    mode: keep_current
  parameters:
    speed:
      binds_to:
      - mode: scale
        path: generator.speed
      default: 0.02
      range:
      - 0.005
      - 0.05
      type: scalar
  subtask_id: contact
  target:
    anchor: task_object
    offset:
    - 0
    - 0.03
    - 0
    source: yaml
    tolerance: 0.02
  termination: contact_detected
  type: contact
- control: impedance_control
  generator: impedance_motion
  guards:
  - id: force_limit
    on_failure: continue
    predicate: force_below
    threshold: 25.0
    when: during_phase
  id: push_1
  orientation:
    align_with: task_goal_direction
    axis:
    - 1
    - 0
    - 0
    mode: align_axis
    tolerance: 0.1
  parameters:
    push_depth:
      binds_to:
      - mode: replace
        path: target.offset_along_axis.distance
      default: 0.08
      range:
      - 0.01
      - 0.15
      type: scalar
  subtask_id: push
  target:
    anchor: task_goal
    offset:
    - 0
    - 0.03
    - 0
    offset_along_axis:
      axis: task_goal_direction
      distance: 0.08
      mode: replace_offset_projection
    source: yaml
    tolerance: 0.02
  termination: pose_tolerance
  type: push
- control: position_control
  generator: linear_cartesian
  id: retract_1
  orientation:
    mode: keep_current
  parameters:
    retract_height:
      binds_to:
      - mode: replace
        path: target.offset.z
      default: 0.1
      range:
      - 0.05
      - 0.2
      type: scalar
  target:
    anchor: current_tcp
    offset:
    - 0
    - 0
    - 0.1
    source: yaml
    tolerance: 0.02
  termination: pose_tolerance
  type: retract
skill: push_to_goal
