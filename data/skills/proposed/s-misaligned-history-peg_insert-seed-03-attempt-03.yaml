dsl_version: 2
phases:
- control: position_control
  generator: arc_cartesian
  id: approach_entry
  parameters:
    arc_height:
      binds_to:
      - mode: add
        path: generator.arc_height
      default: 0.08
      range:
      - 0.02
      - 0.15
      type: scalar
  subtask_id: pre_insert
  target:
    anchor: task_goal
    offset:
    - 0
    - 0
    - 0.05
    orientation:
      align_with: insertion_axis
      axis:
      - 0
      - 0
      - 1
      mode: align_axis
      tolerance: 0.1
    source: yaml
  termination: pose_tolerance
  type: approach
- control: position_control
  generator: linear_cartesian
  id: align_entry
  subtask_id: pre_insert
  target:
    anchor: task_goal
    offset:
    - 0
    - 0
    - 0.02
    orientation:
      mode: keep_current
    source: yaml
    tolerance: 0.005
  termination: pose_tolerance
  type: align
- control: impedance_control
  generator: linear_cartesian
  id: descend_insert
  parameters:
    insertion_force:
      binds_to:
      - mode: replace
        path: termination.force_threshold
      default: 15
      range:
      - 5
      - 30
      type: scalar
  target:
    anchor: task_goal
    offset:
    - 0
    - 0
    - -0.01
    orientation:
      mode: keep_current
    source: yaml
  termination: force_exceeded
  type: descend
- control: impedance_control
  generator: linear_cartesian
  guards:
  - id: force_guard
    on_failure: abort
    predicate: force_below
    threshold: 40
    when: during_phase
  id: push_insert
  parameters:
    insert_depth:
      binds_to:
      - mode: replace
        path: target.offset_along_axis.distance
      default: 0.03
      range:
      - 0.01
      - 0.06
      type: scalar
  subtask_id: inserted
  target:
    anchor: task_goal
    offset_along_axis:
      axis: insertion_axis
      distance: 0.04
      mode: add_to_offset
      sign: positive
    orientation:
      mode: keep_current
    source: yaml
  termination: time_limit
  type: push
skill: peg_insert
subtasks:
- anchor: goal
  id: pre_insert
  offset:
  - 0
  - 0
  - 0.02
  target_entity: tcp
  weight: 0.3
- anchor: goal
  id: inserted
  metric: goal_progress
  offset:
  - 0
  - 0
  - -0.03
  target_entity: tcp
  weight: 0.7
