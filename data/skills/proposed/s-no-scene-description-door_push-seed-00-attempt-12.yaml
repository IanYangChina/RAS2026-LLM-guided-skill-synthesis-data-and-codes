dsl_version: 2
phases:
- control: position_control
  generator: arc_cartesian
  id: approach_to_handle
  parameters:
    approach_height:
      binds_to:
      - mode: replace
        path: target.offset.z
      default: 0.25
      range:
      - 0.15
      - 0.45
      type: scalar
    approach_x_offset:
      binds_to:
      - mode: replace
        path: target.offset.x
      default: 0.0
      range:
      - -0.05
      - 0.05
      type: scalar
    approach_y_offset:
      binds_to:
      - mode: replace
        path: target.offset.y
      default: 0.0
      range:
      - -0.05
      - 0.05
      type: scalar
    arc_height:
      binds_to:
      - mode: replace
        path: generator.arc_height
      default: 0.1
      range:
      - 0.05
      - 0.2
      type: scalar
    speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.06
      range:
      - 0.02
      - 0.15
      type: scalar
  subtask_id: reach_handle
  target:
    anchor: task_object
    offset:
    - 0.0
    - 0.0
    - 0.25
    orientation:
      mode: keep_current
    source: yaml
  termination: pose_tolerance
  type: approach
- control: position_control
  generator: linear_cartesian
  id: align_to_door
  parameters:
    align_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.03
      range:
      - 0.01
      - 0.08
      type: scalar
    align_x_offset:
      binds_to:
      - mode: replace
        path: target.offset.x
      default: 0.0
      range:
      - -0.05
      - 0.05
      type: scalar
    align_y_offset:
      binds_to:
      - mode: replace
        path: target.offset.y
      default: -0.05
      range:
      - -0.12
      - 0.0
      type: scalar
    align_z_offset:
      binds_to:
      - mode: replace
        path: target.offset.z
      default: -0.1
      range:
      - -0.2
      - 0.0
      type: scalar
    tolerance:
      binds_to:
      - mode: replace
        path: termination.pose_tolerance
      default: 0.05
      range:
      - 0.01
      - 0.1
      type: scalar
  subtask_id: reach_handle
  target:
    anchor: task_goal
    offset:
    - 0.0
    - -0.05
    - -0.1
    orientation:
      mode: keep_current
    source: yaml
  termination: pose_tolerance
  type: align
- control: impedance_control
  generator: linear_cartesian
  guards:
  - args: {}
    id: force_limit
    on_failure: retry
    predicate: force_below
    threshold: 25.0
    when: during_phase
  id: push_door_open
  parameters:
    push_distance:
      binds_to:
      - mode: replace
        path: target.offset_along_axis.distance
      default: 0.25
      range:
      - 0.05
      - 0.5
      type: scalar
    push_force_threshold:
      binds_to:
      - mode: replace
        path: guards.force_limit.threshold
      default: 25.0
      range:
      - 15.0
      - 30.0
      type: scalar
    push_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.03
      range:
      - 0.01
      - 0.08
      type: scalar
    tolerance:
      binds_to:
      - mode: replace
        path: termination.pose_tolerance
      default: 0.02
      range:
      - 0.01
      - 0.05
      type: scalar
  retries:
    max_attempts: 2
    offset:
    - 0.0
    - 0.01
    - 0.0
    strategy: offset_target
  subtask_id: push_complete
  target:
    anchor: current_tcp
    offset:
    - 0.0
    - 0.0
    - 0.0
    offset_along_axis:
      axis: task_goal_direction
      distance: 0.25
      mode: add_to_offset
      sign: positive
    orientation:
      mode: keep_current
    source: yaml
  termination: pose_tolerance
  type: push
skill: door_push
subtasks:
- anchor: object
  id: reach_handle
  offset:
  - 0.0
  - 0.0
  - 0.35
  weight: 0.3
- id: push_complete
  target_entity: hinge
  weight: 0.7
