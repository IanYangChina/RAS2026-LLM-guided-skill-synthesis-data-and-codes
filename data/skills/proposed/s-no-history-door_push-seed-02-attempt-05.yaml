dsl_version: 2
phases:
- control: force_threshold_switch
  generator: linear_cartesian
  guards:
  - args: {}
    id: contact_made
    on_failure: retry
    predicate: contact_detected
    threshold: 0.0
    when: after_phase
  id: contact_handle
  parameters:
    force_threshold:
      binds_to:
      - mode: replace
        path: termination.force_threshold
      default: 5.0
      range:
      - 1.0
      - 20.0
      type: scalar
    speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.05
      range:
      - 0.01
      - 0.2
      type: scalar
  retries:
    max_attempts: 2
    offset:
    - 0.0
    - 0.03
    - 0.0
    strategy: offset_target
  subtask_id: hinge_progress
  target:
    anchor: body
    entity: door_panel
    offset:
    - -0.4
    - -0.02
    - 0.35
    source: yaml
  termination: force_exceeded
  type: contact
- control: impedance_control
  generator: linear_cartesian
  guards:
  - args: {}
    id: hinge_reached
    on_failure: abort
    predicate: hinge_delta_reached
    threshold: 0.5
    when: during_phase
  id: push_door
  parameters:
    hinge_delta_threshold:
      binds_to:
      - mode: replace
        path: guards.hinge_reached.threshold
      default: 0.5
      range:
      - 0.2
      - 1.0
      type: scalar
    max_push_time:
      binds_to:
      - mode: replace
        path: duration.max_time
      default: 4.0
      range:
      - 0.5
      - 8.0
      type: scalar
    push_target_x:
      binds_to:
      - mode: replace
        path: target.offset.x
      default: -0.3364
      range:
      - -0.4364
      - -0.2364
      type: scalar
    push_target_y:
      binds_to:
      - mode: replace
        path: target.offset.y
      default: -0.21732
      range:
      - -0.31732
      - -0.11732
      type: scalar
    speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.05
      range:
      - 0.01
      - 0.2
      type: scalar
  subtask_id: hinge_progress
  target:
    anchor: fixture
    entity: door_panel
    offset:
    - -0.3364
    - -0.21732
    - 0.35
    source: yaml
  termination: time_limit
  type: push
skill: door_push
subtasks:
- anchor: fixture
  id: hinge_progress
  metric: hinge_angle
  target_entity: hinge
