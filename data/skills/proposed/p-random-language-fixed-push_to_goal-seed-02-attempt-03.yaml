dsl_version: 2
phases:
- control: position_control
  generator: linear_cartesian
  id: approach
  parameters:
    approach_speed:
      binds_to:
      - mode: add
        path: generator.speed
      default: 0.5
      range:
      - 0.05
      - 1.0
      type: scalar
  subtask_id: approach
  target:
    anchor: task_object
    entity: push_box
    offset:
    - 0.0
    - 0.08
    - 0.0
    orientation:
      mode: keep_current
    source: yaml
    tolerance: 0.01
  termination: pose_tolerance
  type: approach
- control: force_threshold_switch
  generator: linear_cartesian
  id: contact
  parameters:
    contact_force_threshold:
      binds_to:
      - mode: add
        path: termination.force_threshold
      default: 5.0
      range:
      - 1.0
      - 20.0
      type: scalar
    contact_speed:
      binds_to:
      - mode: add
        path: generator.speed
      default: 0.1
      range:
      - 0.02
      - 0.3
      type: scalar
  subtask_id: contact
  target:
    anchor: task_object
    entity: push_box
    offset:
    - 0.0
    - 0.03
    - 0.0
    orientation:
      mode: keep_current
    source: yaml
    tolerance: 0.01
  termination: force_exceeded
  type: contact
- control: impedance_control
  generator: linear_cartesian
  id: push
  parameters:
    push_depth:
      binds_to:
      - mode: add
        path: target.offset_along_axis.distance
      default: 0.15
      range:
      - 0.05
      - 0.3
      type: scalar
    push_speed:
      binds_to:
      - mode: add
        path: generator.speed
      default: 0.1
      range:
      - 0.02
      - 0.3
      type: scalar
  subtask_id: push
  target:
    anchor: task_object
    entity: push_box
    offset:
    - 0.0
    - 0.03
    - 0.0
    offset_along_axis:
      axis: task_goal_direction
      distance: 0.15
      mode: add_to_offset
      sign: positive
    orientation:
      align_with: task_goal_direction
      axis:
      - 1.0
      - 0.0
      - 0.0
      mode: align_axis
      tolerance: 0.2
    source: yaml
    tolerance: 0.02
  termination: pose_tolerance
  type: push
skill: push_to_goal
subtasks:
- anchor: object
  id: approach
  offset:
  - 0.0
  - 0.08
  - 0.0
- anchor: object
  id: contact
  offset:
  - 0.0
  - 0.03
  - 0.0
- id: push
  metric: goal_progress
  offset:
  - 0.0
  - 0.03
  - 0.0
