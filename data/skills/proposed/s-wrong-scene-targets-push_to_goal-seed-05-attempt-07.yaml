dsl_version: 2
phases:
- control: position_control
  generator: linear_cartesian
  id: approach_behind
  parameters:
    approach_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.05
      range:
      - 0.01
      - 0.2
      type: scalar
  subtask_id: approach_pre_contact
  target:
    anchor: task_object
    offset:
    - 0.0
    - 0.0
    - 0.0
    offset_along_axis:
      axis: task_goal_direction
      distance: 0.05
      mode: replace_offset_projection
      sign: negative
    orientation:
      align_with: task_goal_direction
      axis:
      - 0.0
      - 0.0
      - 1.0
      mode: align_axis
    source: yaml
    tolerance: 0.02
  termination: pose_tolerance
  type: approach
- control: impedance_control
  generator: linear_cartesian
  guards:
  - args: {}
    id: force_guard
    on_failure: continue
    predicate: force_below
    threshold: 25.0
    when: during_phase
  id: push_forward
  parameters:
    push_distance:
      binds_to:
      - mode: replace
        path: target.offset_along_axis.distance
      default: 0.2
      range:
      - 0.05
      - 0.4
      type: scalar
    push_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.03
      range:
      - 0.01
      - 0.1
      type: scalar
  subtask_id: push_toward_goal
  target:
    anchor: task_object
    offset:
    - 0.0
    - 0.0
    - 0.0
    offset_along_axis:
      axis: task_goal_direction
      distance: 0.2
      mode: add_to_offset
      sign: positive
    orientation:
      mode: none
    source: yaml
  termination: time_limit
  type: push
skill: push_to_goal
subtasks:
- anchor: object
  id: approach_pre_contact
  offset:
  - 0.0
  - 0.0
  - 0.025
  weight: 0.3
- id: push_toward_goal
  metric: goal_progress
  target_entity: object
  weight: 0.7
