dsl_version: 2
phases:
- control: position_control
  generator: linear_cartesian
  id: approach_entry
  parameters:
    height_offset:
      binds_to:
      - mode: replace
        path: target.offset.z
      default: 0.04
      range:
      - 0.02
      - 0.08
      type: scalar
    speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.05
      range:
      - 0.03
      - 0.1
      type: scalar
    tolerance:
      binds_to:
      - mode: replace
        path: termination.pose_tolerance
      default: 0.003
      range:
      - 0.001
      - 0.01
      type: scalar
  subtask_id: approach_entry
  target:
    anchor: site
    entity: socket_entry
    offset:
    - 0.0
    - 0.0
    - 0.04
    orientation:
      align_with: insertion_axis
      axis:
      - 0.0
      - 0.0
      - 1.0
      mode: align_axis
      tolerance: 0.1
    source: yaml
    tolerance: 0.005
  termination: pose_tolerance
  type: approach
- control: impedance_control
  generator: linear_cartesian
  guards:
  - args: {}
    id: excessive_force
    on_failure: abort
    predicate: force_below
    threshold: 40.0
    when: during_phase
  id: insertion
  parameters:
    insertion_depth:
      binds_to:
      - mode: replace
        path: target.offset_along_axis.distance
      default: 0.05
      range:
      - 0.03
      - 0.06
      type: scalar
    insertion_force:
      binds_to:
      - mode: replace
        path: termination.force_threshold
      default: 15.0
      range:
      - 5.0
      - 30.0
      type: scalar
    speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.01
      range:
      - 0.005
      - 0.03
      type: scalar
  retries:
    max_attempts: 2
    offset:
    - 0.0
    - 0.0
    - 0.0
    strategy: reduce_speed
  subtask_id: insertion_depth
  target:
    anchor: site
    entity: socket_entry
    offset:
    - 0.0
    - 0.0
    - 0.0
    offset_along_axis:
      axis: insertion_axis
      distance: 0.05
      mode: replace_offset_projection
      sign: negative
    orientation:
      mode: keep_current
    source: yaml
  termination: force_exceeded
  type: insert
skill: peg_insert
subtasks:
- anchor: goal
  id: approach_entry
  metric: distance
  offset:
  - 0.0
  - 0.0
  - 0.04
  target_entity: tcp
  weight: 0.4
- anchor: fixture
  id: insertion_depth
  metric: distance
  offset:
  - 0.0
  - 0.0
  - 0.0
  target_entity: tcp
  weight: 0.6
