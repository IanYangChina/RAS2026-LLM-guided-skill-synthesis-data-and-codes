dsl_version: 2
phases:
- control: position_control
  generator: linear_cartesian
  id: rise_above_obstacle
  parameters:
    speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.25
      range:
      - 0.05
      - 0.4
      type: scalar
    tolerance:
      binds_to:
      - mode: replace
        path: termination.pose_tolerance
      default: 0.05
      range:
      - 0.03
      - 0.08
      type: scalar
  retries:
    max_attempts: 0
    strategy: repeat
  subtask_id: reach_high
  target:
    anchor: current_tcp
    offset:
    - 0.0
    - 0.0
    - 0.4
    orientation:
      mode: keep_current
      tolerance: 0.05
    source: yaml
    tolerance: 0.02
  termination: pose_tolerance
  type: lift
- control: position_control
  generator: linear_cartesian
  id: approach_over_obstacle
  parameters:
    speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.25
      range:
      - 0.05
      - 0.4
      type: scalar
    tolerance:
      binds_to:
      - mode: replace
        path: termination.pose_tolerance
      default: 0.05
      range:
      - 0.03
      - 0.08
      type: scalar
  retries:
    max_attempts: 2
    offset:
    - 0.0
    - 0.02
    - 0.0
    strategy: offset_target
  subtask_id: reach_high
  target:
    anchor: task_goal
    offset:
    - 0.0
    - 0.0
    - 0.4
    orientation:
      mode: none
    source: yaml
    tolerance: 0.02
  termination: pose_tolerance
  type: approach
- control: position_control
  generator: linear_cartesian
  id: descend_to_goal
  parameters:
    descend_z_offset:
      binds_to:
      - mode: replace
        path: target.offset.z
      default: -0.02
      range:
      - -0.04
      - 0.0
      type: scalar
    speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.15
      range:
      - 0.02
      - 0.3
      type: scalar
    tolerance:
      binds_to:
      - mode: replace
        path: termination.pose_tolerance
      default: 0.05
      range:
      - 0.03
      - 0.08
      type: scalar
  retries:
    max_attempts: 2
    offset:
    - 0.0
    - 0.0
    - -0.01
    strategy: offset_target
  subtask_id: reach_goal
  target:
    anchor: task_goal
    offset:
    - 0.0
    - 0.0
    - -0.02
    orientation:
      mode: none
    source: yaml
    tolerance: 0.03
  termination: pose_tolerance
  type: descend
skill: obstacle_reach
subtasks:
- anchor: goal
  id: reach_high
  offset:
  - 0.0
  - 0.0
  - 0.4
  weight: 0.3
- anchor: goal
  id: reach_goal
  weight: 0.7
