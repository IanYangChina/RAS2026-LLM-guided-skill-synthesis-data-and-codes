dsl_version: 2
phases:
- control: position_control
  generator: linear_cartesian
  id: lift_z
  parameters:
    lift_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.08
      range:
      - 0.02
      - 0.15
      type: scalar
  subtask_id: lift_clear
  target:
    anchor: world
    offset:
    - 0.35
    - 0.0
    - 0.5
    source: yaml
    tolerance: 0.02
  termination: pose_tolerance
  type: lift
- control: position_control
  generator: arc_cartesian
  id: approach_over_obstacle
  parameters:
    approach_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.07
      range:
      - 0.03
      - 0.15
      type: scalar
    arc_height:
      binds_to:
      - mode: replace
        path: generator.arc_height
      default: 0.12
      range:
      - 0.05
      - 0.2
      type: scalar
  subtask_id: approach_side
  target:
    anchor: task_goal
    offset:
    - 0.0
    - 0.0
    - 0.3
    source: yaml
    tolerance: 0.02
  termination: pose_tolerance
  type: approach
- control: position_control
  generator: linear_cartesian
  guards:
  - id: obstacle_contact
    on_failure: abort
    predicate: contact_detected
    threshold: 0.01
    when: during_phase
  id: descend_to_goal
  parameters:
    descend_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.04
      range:
      - 0.02
      - 0.1
      type: scalar
  subtask_id: final_goal
  target:
    anchor: task_goal
    offset:
    - 0.0
    - 0.0
    - 0.0
    source: yaml
    tolerance: 0.02
  termination: pose_tolerance
  type: descend
skill: obstacle_reach
subtasks:
- anchor: world
  id: lift_clear
  offset:
  - 0.35
  - 0.0
  - 0.5
  weight: 0.15
- anchor: world
  id: approach_side
  offset:
  - 0.6
  - 0.0
  - 0.5
  weight: 0.3
- id: final_goal
  weight: 0.55
