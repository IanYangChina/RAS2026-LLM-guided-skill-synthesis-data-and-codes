dsl_version: 2
phases:
- control: position_control
  generator: arc_cartesian
  id: approach_1
  parameters:
    approach_arc_height:
      binds_to:
      - mode: replace
        path: generator.arc_height
      default: 0.3
      range:
      - 0.2
      - 0.5
      type: scalar
    approach_offset_z:
      binds_to:
      - mode: replace
        path: target.offset.z
      default: 0.35
      range:
      - 0.2
      - 0.5
      type: scalar
    approach_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 1.0
      range:
      - 0.5
      - 2.0
      type: scalar
  target:
    anchor: task_goal
    entity: goal_marker
    offset:
    - 0.0
    - 0.0
    - 0.35
    orientation:
      mode: keep_current
      tolerance: 0.2
    source: yaml
    tolerance: 0.05
  termination: pose_tolerance
  type: approach
- control: position_control
  generator: linear_cartesian
  id: descend_1
  parameters:
    descend_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.8
      range:
      - 0.3
      - 1.5
      type: scalar
  target:
    anchor: task_goal
    entity: goal_marker
    offset:
    - 0.0
    - 0.0
    - 0.0
    orientation:
      mode: keep_current
      tolerance: 0.1
    source: yaml
    tolerance: 0.02
  termination: pose_tolerance
  type: descend
skill: obstacle_reach
