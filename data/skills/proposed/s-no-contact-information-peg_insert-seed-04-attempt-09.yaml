dsl_version: 2
phases:
- control: position_control
  generator: linear_cartesian
  id: approach_1
  parameters:
    speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.07
      range:
      - 0.02
      - 0.15
      type: scalar
  subtask_id: reach_pre_insert
  target:
    anchor: task_goal
    offset:
    - 0.0
    - 0.0
    - 0.1
    orientation:
      align_with: world_z
      axis:
      - 0.0
      - 0.0
      - 1.0
      mode: align_axis
      tolerance: 0.1
    source: yaml
    tolerance: 0.01
  termination: pose_tolerance
  type: approach
- control: position_control
  generator: linear_cartesian
  id: align_1
  parameters:
    align_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.05
      range:
      - 0.02
      - 0.1
      type: scalar
    lateral_x:
      binds_to:
      - mode: add
        path: target.offset.x
      default: 0.0
      range:
      - -0.01
      - 0.01
      type: scalar
    lateral_y:
      binds_to:
      - mode: add
        path: target.offset.y
      default: 0.0
      range:
      - -0.01
      - 0.01
      type: scalar
  subtask_id: reach_pre_insert
  target:
    anchor: task_goal
    offset:
    - 0.0
    - 0.0
    - 0.055
    orientation:
      align_with: world_z
      axis:
      - 0.0
      - 0.0
      - 1.0
      mode: align_axis
      tolerance: 0.05
    source: yaml
    tolerance: 0.005
  termination: pose_tolerance
  type: align
- control: impedance_control
  generator: impedance_motion
  guards:
  - args: {}
    id: force_guard
    on_failure: abort
    predicate: force_below
    threshold: 40.0
    when: during_phase
  id: insert_1
  parameters:
    insert_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.02
      range:
      - 0.01
      - 0.05
      type: scalar
    insertion_depth:
      binds_to:
      - mode: replace
        path: target.offset_along_axis.distance
      default: 0.03
      range:
      - 0.01
      - 0.05
      type: scalar
    insertion_force:
      binds_to:
      - mode: replace
        path: termination.force_threshold
      default: 15.0
      range:
      - 5.0
      - 30.0
      type: scalar
  retries:
    max_attempts: 1
    offset:
    - 0.003
    - 0.003
    - 0.0
    strategy: offset_target
  subtask_id: reach_inserted
  target:
    anchor: task_goal
    offset:
    - 0.0
    - 0.0
    - 0.055
    offset_along_axis:
      axis: insertion_axis
      distance: 0.04
      mode: add_to_offset
      sign: positive
    orientation:
      align_with: world_z
      axis:
      - 0.0
      - 0.0
      - 1.0
      mode: align_axis
      tolerance: 0.05
    source: yaml
  termination: force_exceeded
  type: insert
skill: peg_insert
skill_type: arm
subtasks:
- anchor: goal
  id: reach_pre_insert
  metric: distance
  offset:
  - 0.0
  - 0.0
  - 0.055
  target_entity: tcp
  weight: 0.3
- anchor: goal
  id: reach_inserted
  metric: distance
  offset:
  - 0.0
  - 0.0
  - 0.005
  target_entity: tcp
  weight: 0.7
