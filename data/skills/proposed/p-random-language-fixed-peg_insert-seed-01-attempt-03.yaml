dsl_version: 2
phases:
- control: impedance_control
  generator: impedance_motion
  id: rotate_to_goal
  target:
    anchor: task_goal
    offset:
    - 0
    - 0
    - 0.1
    orientation:
      align_with: channel_axis
      axis:
      - 0
      - 0
      - -1
      mode: align_axis
      tolerance: 0.15
    source: yaml
  termination: time_limit
  type: rotate
- control: position_control
  generator: linear_cartesian
  id: align_lateral
  parameters:
    lateral_offset_x:
      binds_to:
      - mode: add
        path: target.offset.x
      default: 0.0
      range:
      - -0.01
      - 0.01
      type: scalar
    lateral_offset_y:
      binds_to:
      - mode: add
        path: target.offset.y
      default: 0.0
      range:
      - -0.01
      - 0.01
      type: scalar
  target:
    anchor: task_goal
    offset:
    - 0
    - 0
    - 0.08
    orientation:
      align_with: channel_axis
      axis:
      - 0
      - 0
      - -1
      mode: align_axis
      tolerance: 0.1
    source: yaml
    tolerance: 0.005
  termination: pose_tolerance
  type: align
- control: impedance_control
  generator: impedance_motion
  id: insert_core
  parameters:
    push_depth:
      binds_to:
      - mode: replace
        path: target.offset_along_axis.distance
      default: 0.08
      range:
      - 0.02
      - 0.12
      type: scalar
  target:
    anchor: task_goal
    offset:
    - 0
    - 0
    - 0
    offset_along_axis:
      axis: channel_axis
      distance: 0.08
      mode: add_to_offset
      sign: positive
    orientation:
      align_with: channel_axis
      axis:
      - 0
      - 0
      - -1
      mode: align_axis
      tolerance: 0.1
    source: yaml
  termination: pose_tolerance
  type: push
- control: position_control
  generator: linear_cartesian
  id: retract_after_insert
  target:
    anchor: current_tcp
    offset:
    - 0
    - 0
    - 0.1
    source: yaml
  termination: pose_tolerance
  type: retract
skill: peg_insert
