dsl_version: 2
phases:
- control: position_control
  generator: linear_cartesian
  id: approach_behind
  parameters:
    approach_height:
      binds_to:
      - mode: replace
        path: target.offset.z
      default: 0.1
      range:
      - 0.05
      - 0.2
      type: scalar
  subtask_id: approach_object
  target:
    anchor: task_object
    entity: push_box
    offset:
    - 0.03
    - -0.13
    - 0.1
    orientation:
      mode: none
    source: yaml
    tolerance: 0.02
  termination: pose_tolerance
  type: approach
- control: position_control
  generator: linear_cartesian
  id: descend_contact
  parameters:
    descend_x:
      binds_to:
      - mode: replace
        path: target.offset.x
      default: 0.03
      range:
      - -0.02
      - 0.08
      type: scalar
    descend_y:
      binds_to:
      - mode: replace
        path: target.offset.y
      default: -0.13
      range:
      - -0.18
      - -0.08
      type: scalar
  subtask_id: approach_object
  target:
    anchor: task_object
    entity: push_box
    offset:
    - 0.03
    - -0.13
    - 0.025
    orientation:
      mode: none
    source: yaml
    tolerance: 0.02
  termination: pose_tolerance
  type: descend
- control: impedance_control
  generator: linear_cartesian
  id: push_forward
  parameters:
    push_distance:
      binds_to:
      - mode: replace
        path: target.offset_along_axis.distance
      default: 0.15
      range:
      - 0.05
      - 0.35
      type: scalar
  subtask_id: push_to_goal
  target:
    anchor: task_goal
    entity: goal_marker
    offset:
    - 0.0
    - 0.0
    - 0.0
    offset_along_axis:
      axis: task_goal_direction
      distance: 0.15
      mode: add_to_offset
      sign: positive
    orientation:
      mode: none
    source: yaml
    tolerance: 0.02
  termination: pose_tolerance
  type: push
skill: push_to_goal
skill_type: arm
subtasks:
- anchor: object
  id: approach_object
  metric: distance
  offset:
  - 0.0
  - 0.0
  - 0.1
  target_entity: tcp
  weight: 0.3
- anchor: goal
  id: push_to_goal
  metric: goal_progress
  offset:
  - 0.0
  - 0.0
  - 0.0
  target_entity: object
  weight: 0.7
