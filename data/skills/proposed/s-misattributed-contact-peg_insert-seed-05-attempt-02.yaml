dsl_version: 2
phases:
- control: position_control
  generator: linear_cartesian
  id: approach_above_entry
  parameters:
    approach_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.08
      range:
      - 0.01
      - 0.2
      type: scalar
  retries:
    max_attempts: 0
  subtask_id: approach_hole
  target:
    anchor: task_goal
    offset:
    - 0.0
    - 0.0
    - 0.07
    orientation:
      align_with: insertion_axis
      axis:
      - 0.0
      - 0.0
      - 1.0
      mode: align_axis
      tolerance: 0.1
    source: yaml
    tolerance: 0.01
  termination: pose_tolerance
  type: approach
- control: impedance_control
  generator: linear_cartesian
  guards:
  - args: {}
    id: contact_guard
    on_failure: retry
    predicate: contact_detected
    threshold: 1.0
    when: during_phase
  id: insert_peg
  parameters:
    force_threshold:
      binds_to:
      - mode: replace
        path: termination.force_threshold
      default: 30.0
      range:
      - 10.0
      - 40.0
      type: scalar
    insert_depth:
      binds_to:
      - mode: replace
        path: target.offset_along_axis.distance
      default: 0.04
      range:
      - 0.01
      - 0.06
      type: scalar
    insert_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.015
      range:
      - 0.005
      - 0.05
      type: scalar
  retries:
    max_attempts: 2
    offset:
    - 0.0
    - 0.0
    - 0.0
    strategy: reduce_speed
  subtask_id: insertion
  target:
    anchor: task_goal
    offset:
    - 0.0
    - 0.0
    - 0.0
    offset_along_axis:
      axis: insertion_axis
      distance: 0.05
      mode: add_to_offset
      sign: negative
    orientation:
      align_with: insertion_axis
      axis:
      - 0.0
      - 0.0
      - 1.0
      mode: align_axis
      tolerance: 0.1
    source: yaml
    tolerance: 0.005
  termination: force_exceeded
  type: insert
skill: peg_insert
skill_type: arm
subtasks:
- anchor: fixture
  id: approach_hole
  metric: distance
  offset:
  - 0.0
  - 0.0
  - 0.07
  target_entity: tcp
  weight: 0.3
- anchor: fixture
  id: insertion
  metric: goal_progress
  offset:
  - 0.0
  - 0.0
  - 0.0
  target_entity: tcp
  weight: 0.7
