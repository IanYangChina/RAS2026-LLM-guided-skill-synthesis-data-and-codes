skill: peg_insert
dsl_version: 2
subtasks:
- id: pre_insert_pose
  anchor: fixture
  target_entity: tcp
  metric: distance
  offset: [0.0, 0.0, 0.05]
  weight: 0.3
- id: insert_goal
  anchor: goal
  target_entity: object
  metric: goal_progress
  weight: 0.7
phases:
- id: approach_1
  type: approach
  generator: linear_cartesian
  control: position_control
  termination: pose_tolerance
  target:
    source: yaml
    anchor: task_goal
    offset: [0.0, 0.0, 0.05]
    tolerance: 0.01
    orientation:
      mode: keep_current
  parameters:
    approach_height:
      type: scalar
      range: [0.02, 0.08]
      default: 0.05
      binds_to:
      - path: target.offset.z
        mode: replace
    approach_speed:
      type: scalar
      range: [0.03, 0.12]
      default: 0.08
      binds_to:
      - path: generator.speed
        mode: replace
  subtask_id: pre_insert_pose
- id: align_1
  type: align
  generator: linear_cartesian
  control: position_control
  termination: pose_tolerance
  target:
    source: yaml
    anchor: task_goal
    offset: [0.0, 0.0, 0.05]
    tolerance: 0.005
    orientation:
      mode: keep_current
  parameters:
    align_height:
      type: scalar
      range: [0.02, 0.08]
      default: 0.05
      binds_to:
      - path: target.offset.z
        mode: replace
    align_speed:
      type: scalar
      range: [0.02, 0.08]
      default: 0.04
      binds_to:
      - path: generator.speed
        mode: replace
  subtask_id: pre_insert_pose
- id: insert_1
  type: insert
  generator: linear_cartesian
  control: impedance_control
  termination: force_exceeded
  target:
    source: yaml
    anchor: task_goal
    offset: [0.0, 0.0, 0.0]
    offset_along_axis:
      distance: 0.05
      axis: channel_axis
      mode: add_to_offset
      sign: positive
    orientation:
      mode: align_axis
      axis: [0.0, 0.0, 1.0]
      align_with: channel_axis
      tolerance: 0.1
  parameters:
    insertion_depth:
      type: scalar
      range: [0.02, 0.1]
      default: 0.05
      binds_to:
      - path: target.offset_along_axis.distance
        mode: replace
    insertion_speed:
      type: scalar
      range: [0.01, 0.05]
      default: 0.02
      binds_to:
      - path: generator.speed
        mode: replace
    force_threshold:
      type: scalar
      range: [5.0, 30.0]
      default: 15.0
      binds_to:
      - path: termination.force_threshold
        mode: replace
  guards:
    - id: contact_check
      when: during_phase
      predicate: force_below
      args: {}
      threshold: 3.0
      on_failure: retry
  retries:
    max_attempts: 2
    strategy: offset_target
    offset: [0.005, 0.005, 0.0]
  subtask_id: insert_goal
- id: retract_1
  type: retract
  generator: linear_cartesian
  control: position_control
  termination: pose_tolerance
  target:
    source: yaml
    anchor: task_goal
    offset: [0.0, 0.0, 0.12]
    tolerance: 0.01
    orientation:
      mode: keep_current
  parameters:
    retract_height:
      type: scalar
      range: [0.05, 0.2]
      default: 0.12
      binds_to:
      - path: target.offset.z
        mode: replace
    retract_speed:
      type: scalar
      range: [0.01, 0.1]
      default: 0.05
      binds_to:
      - path: generator.speed
        mode: replace
```