dsl_version: 2
phases:
- control: position_control
  generator: linear_cartesian
  id: approach
  parameters:
    speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.05
      range:
      - 0.01
      - 0.1
      type: scalar
  subtask_id: approach
  target:
    anchor: task_object
    entity: push_box
    offset:
    - 0.0
    - 0.08
    - 0.0
    orientation:
      mode: keep_current
    source: yaml
  termination: pose_tolerance
  type: approach
- control: force_threshold_switch
  generator: linear_cartesian
  guards:
  - args: {}
    id: contact_timeout
    on_failure: retry
    predicate: pose_within_tolerance
    threshold: 0.02
    when: during_phase
  id: contact
  parameters:
    contact_force:
      binds_to:
      - mode: replace
        path: termination.force_threshold
      default: 5.0
      range:
      - 1.0
      - 20.0
      type: scalar
    speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.03
      range:
      - 0.01
      - 0.06
      type: scalar
  retries:
    max_attempts: 2
    offset:
    - 0.0
    - -0.02
    - 0.0
    strategy: offset_target
  subtask_id: contact
  target:
    anchor: task_object
    entity: push_box
    offset:
    - 0.0
    - 0.03
    - 0.0
    orientation:
      mode: keep_current
    source: yaml
  termination: force_exceeded
  type: contact
- control: impedance_control
  generator: linear_cartesian
  guards:
  - args: {}
    id: force_limit
    on_failure: abort
    predicate: force_below
    threshold: 25.0
    when: during_phase
  id: push
  parameters:
    max_push_time:
      binds_to:
      - mode: replace
        path: termination.duration.max_time
      default: 4.0
      range:
      - 2.0
      - 8.0
      type: scalar
    push_depth:
      binds_to:
      - mode: replace
        path: target.offset_along_axis.distance
      default: 0.2
      range:
      - 0.05
      - 0.3
      type: scalar
    push_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.04
      range:
      - 0.01
      - 0.1
      type: scalar
  subtask_id: push
  target:
    anchor: task_goal
    entity: goal_marker
    offset:
    - 0.0
    - 0.0
    - 0.0
    offset_along_axis:
      axis: task_goal_direction
      distance: 0.0
      mode: replace_offset_projection
      sign: positive
    orientation:
      mode: keep_current
    source: yaml
  termination: time_limit
  type: push
skill: push_to_goal
skill_type: arm
