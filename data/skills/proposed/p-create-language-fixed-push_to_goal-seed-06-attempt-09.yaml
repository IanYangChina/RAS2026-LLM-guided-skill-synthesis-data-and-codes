dsl_version: 2
phases:
- control: position_control
  generator: linear_cartesian
  id: approach_1
  subtask_id: approach
  target:
    anchor: task_object
    offset:
    - 0.0
    - 0.08
    - 0.0
    source: yaml
  termination: pose_tolerance
  type: approach
- control: force_threshold_switch
  generator: linear_cartesian
  id: contact_1
  parameters:
    contact_force:
      binds_to:
      - mode: replace
        path: termination.force_threshold
      default: 5.0
      range:
      - 1.0
      - 10.0
      type: scalar
  subtask_id: contact
  target:
    anchor: task_object
    offset:
    - 0.0
    - 0.03
    - 0.0
    source: yaml
  termination: force_exceeded
  type: contact
- control: admittance_control
  generator: linear_cartesian
  guards:
  - args: {}
    id: push_contact
    on_failure: retry
    predicate: contact_detected
    threshold: 0
    when: during_phase
  id: push_1
  parameters:
    push_depth:
      binds_to:
      - mode: replace
        path: target.offset_along_axis.distance
      default: 0.05
      range:
      - 0.01
      - 0.15
      type: scalar
    push_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.04
      range:
      - 0.02
      - 0.08
      type: scalar
  retries:
    max_attempts: 1
    offset:
    - 0.0
    - 0.0
    - 0.0
    strategy: reduce_speed
  target:
    anchor: task_object
    offset:
    - 0.0
    - 0.0
    - 0.0
    offset_along_axis:
      axis: task_goal_direction
      distance: 0.05
      mode: add_to_offset
      sign: positive
    source: yaml
  termination: pose_tolerance
  type: push
- control: position_control
  generator: linear_cartesian
  id: retract_1
  target:
    anchor: task_goal
    offset:
    - 0.0
    - 0.0
    - 0.2
    source: yaml
  termination: pose_tolerance
  type: retract
skill: push_to_goal
subtasks:
- anchor: object
  id: approach
  metric: distance
  offset:
  - 0.0
  - 0.08
  - 0.0
  target_entity: tcp
  weight: 1.0
- anchor: object
  id: contact
  metric: distance
  offset:
  - 0.0
  - 0.03
  - 0.0
  target_entity: tcp
  weight: 1.0
- anchor: goal
  id: push
  metric: distance
  offset:
  - 0.0
  - 0.03
  - 0.0
  target_entity: tcp
  weight: 1.0
