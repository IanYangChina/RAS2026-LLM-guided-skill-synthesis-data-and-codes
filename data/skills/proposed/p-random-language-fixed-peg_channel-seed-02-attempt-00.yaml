dsl_version: 2
phases:
- control: position_control
  generator: linear_cartesian
  id: approach
  subtask_id: approach
  target:
    anchor: task_object
    offset:
    - 0
    - 0.04
    - 0
    orientation:
      align_with: channel_axis
      axis:
      - 0
      - 0
      - 1
      mode: align_axis
      tolerance: 0.1
    source: yaml
    tolerance: 0.02
  termination: pose_tolerance
  type: approach
- control: position_control
  generator: linear_cartesian
  id: contact
  subtask_id: contact
  target:
    anchor: task_object
    offset:
    - 0
    - 0.02
    - 0
    orientation:
      align_with: channel_axis
      axis:
      - 0
      - 0
      - 1
      mode: align_axis
      tolerance: 0.1
    source: yaml
    tolerance: 0.015
  termination: pose_tolerance
  type: align
- control: impedance_control
  generator: linear_cartesian
  id: push
  parameters:
    push_depth:
      binds_to:
      - mode: replace
        path: target.offset_along_axis.distance
      default: 0.04
      range:
      - 0.0
      - 0.08
      type: scalar
  subtask_id: push
  target:
    anchor: world
    offset:
    - 0.5
    - -0.08
    - 0.04
    offset_along_axis:
      axis: channel_axis
      distance: 0.04
      mode: add_to_offset
      sign: positive
    orientation:
      align_with: channel_axis
      axis:
      - 0
      - 0
      - 1
      mode: align_axis
      tolerance: 0.1
    source: yaml
    tolerance: 0.02
  termination: pose_tolerance
  type: pull
skill: peg_channel
skill_type: arm
subtasks:
- anchor: object
  id: approach
  metric: distance
  offset:
  - 0
  - 0.04
  - 0
  target_entity: tcp
  weight: 1.0
- anchor: object
  id: contact
  metric: distance
  offset:
  - 0
  - 0.02
  - 0
  target_entity: tcp
  weight: 1.0
- anchor: world
  id: push
  metric: distance
  offset:
  - 0.5
  - -0.08
  - 0.04
  target_entity: tcp
  weight: 1.0
