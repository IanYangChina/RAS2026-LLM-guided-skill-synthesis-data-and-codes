dsl_version: 2
phases:
- control: position_control
  end_effector_action: null
  generator: linear_cartesian
  guards: []
  id: approach
  orientation:
    mode: keep_current
  parameters:
    lateral_offset:
      binds_to:
      - mode: add
        path: target.offset.y
      default: 0.0
      range:
      - -0.02
      - 0.02
      type: scalar
    speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.05
      range:
      - 0.02
      - 0.15
      type: scalar
  retries:
    max_attempts: 0
    offset:
    - 0
    - 0
    - 0
    strategy: repeat
  subtask_id: approach
  target:
    anchor: task_object
    entity: peg
    offset:
    - 0.0
    - 0.04
    - 0.03
    source: yaml
    tolerance: 0.01
  termination: pose_tolerance
  type: approach
- control: admittance_control
  end_effector_action: null
  generator: linear_cartesian
  guards: []
  id: contact
  orientation:
    mode: keep_current
  parameters:
    contact_force:
      binds_to:
      - mode: replace
        path: termination.force_threshold
      default: 5.0
      range:
      - 1.0
      - 15.0
      type: scalar
    speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.01
      range:
      - 0.005
      - 0.04
      type: scalar
  retries:
    max_attempts: 1
    offset:
    - 0
    - 0.005
    - 0
    strategy: offset_target
  subtask_id: contact
  target:
    anchor: task_object
    entity: peg
    offset:
    - 0.0
    - 0.02
    - 0.0
    source: yaml
    tolerance: 0.005
  termination: force_exceeded
  type: contact
- control: impedance_control
  end_effector_action: null
  generator: impedance_motion
  guards:
  - args: {}
    id: low_force
    on_failure: abort
    predicate: force_below
    threshold: 1.0
    when: during_phase
  id: push
  orientation:
    align_with: channel_axis
    axis:
    - 0
    - 0
    - 1
    mode: align_axis
    tolerance: 0.1
  parameters:
    min_push_force:
      binds_to:
      - mode: replace
        path: guards.low_force.threshold
      default: 1.0
      range:
      - 0.5
      - 5.0
      type: scalar
    push_distance:
      binds_to:
      - mode: replace
        path: target.offset_along_axis.distance
      default: 0.16
      range:
      - 0.05
      - 0.2
      type: scalar
    push_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.03
      range:
      - 0.005
      - 0.08
      type: scalar
  retries:
    max_attempts: 2
    offset:
    - 0
    - 0.005
    - 0
    strategy: offset_target
  subtask_id: push
  target:
    anchor: current_tcp
    entity: null
    offset:
    - 0
    - 0
    - 0
    offset_along_axis:
      axis: channel_axis
      distance: 0.16
      mode: add_to_offset
      sign: negative
    source: yaml
    tolerance: 0.02
  termination: pose_tolerance
  type: push
- control: position_control
  end_effector_action: null
  generator: linear_cartesian
  guards: []
  id: retract
  orientation:
    mode: keep_current
  parameters:
    speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.05
      range:
      - 0.02
      - 0.1
      type: scalar
  retries:
    max_attempts: 0
    offset:
    - 0
    - 0
    - 0
    strategy: repeat
  target:
    anchor: world
    entity: null
    offset:
    - 0.5
    - 0.2
    - 0.3
    source: yaml
    tolerance: 0.01
  termination: pose_tolerance
  type: retract
skill: peg_channel
