dsl_version: 2
phases:
- control: position_control
  generator: linear_cartesian
  guards:
  - id: approach_force_guard
    on_failure: retry
    predicate: force_below
    threshold: 60.0
    when: during_phase
  id: approach_high
  parameters:
    approach_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.07
      range:
      - 0.02
      - 0.15
      type: scalar
  retries:
    max_attempts: 1
    strategy: reduce_speed
  subtask_id: approach_high
  target:
    anchor: task_object
    entity: peg
    offset:
    - 0.0
    - 0.03
    - 0.08
    orientation:
      align_with: channel_axis
      axis:
      - 1.0
      - 0.0
      - 0.0
      mode: align_axis
      tolerance: 0.05
    source: yaml
    tolerance: 0.02
  termination: pose_tolerance
  type: approach
- control: position_control
  generator: linear_cartesian
  guards:
  - id: descend_force_guard
    on_failure: abort
    predicate: force_below
    threshold: 40.0
    when: during_phase
  id: descend_to_peg
  parameters:
    descend_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.015
      range:
      - 0.005
      - 0.04
      type: scalar
    descend_tolerance:
      binds_to:
      - mode: replace
        path: termination.pose_tolerance
      default: 0.02
      range:
      - 0.01
      - 0.04
      type: scalar
  subtask_id: descend_to_contact
  target:
    anchor: task_object
    entity: peg
    offset:
    - 0.0
    - 0.03
    - 0.0
    orientation:
      align_with: channel_axis
      axis:
      - 1.0
      - 0.0
      - 0.0
      mode: align_axis
      tolerance: 0.05
    source: yaml
    tolerance: 0.02
  termination: pose_tolerance
  type: descend
- control: impedance_control
  generator: impedance_motion
  guards:
  - id: push_force_guard
    on_failure: retry
    predicate: force_below
    threshold: 45.0
    when: during_phase
  id: push_through
  parameters:
    push_distance:
      binds_to:
      - mode: replace
        path: target.offset_along_axis.distance
      default: 0.14
      range:
      - 0.12
      - 0.16
      type: scalar
    push_force_guard_threshold:
      binds_to:
      - mode: replace
        path: guards.push_force_guard.threshold
      default: 45.0
      range:
      - 30.0
      - 60.0
      type: scalar
    push_max_time:
      binds_to:
      - mode: replace
        path: duration.max_time
      default: 600
      range:
      - 400
      - 800
      type: scalar
    push_retry_offset_x:
      binds_to:
      - mode: replace
        path: retry.offset.x
      default: -0.008
      range:
      - -0.015
      - 0.015
      type: scalar
    push_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.01
      range:
      - 0.005
      - 0.03
      type: scalar
  retries:
    max_attempts: 2
    offset:
    - -0.008
    - 0.0
    - 0.0
    strategy: offset_target
  subtask_id: push_through_channel
  target:
    anchor: task_object
    entity: peg
    offset:
    - 0.0
    - 0.0
    - 0.0
    offset_along_axis:
      axis: channel_axis
      distance: 0.16
      mode: add_to_offset
      sign: positive
    orientation:
      align_with: channel_axis
      axis:
      - 1.0
      - 0.0
      - 0.0
      mode: align_axis
      tolerance: 0.05
    source: yaml
  termination: time_limit
  type: push
- control: position_control
  generator: linear_cartesian
  id: retract_after_push
  parameters:
    retract_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.05
      range:
      - 0.02
      - 0.1
      type: scalar
    retract_tolerance:
      binds_to:
      - mode: replace
        path: termination.pose_tolerance
      default: 0.02
      range:
      - 0.01
      - 0.05
      type: scalar
  target:
    anchor: current_tcp
    offset:
    - 0.0
    - 0.0
    - 0.05
    orientation:
      mode: keep_current
    source: yaml
    tolerance: 0.02
  termination: pose_tolerance
  type: retract
skill: peg_channel
skill_type: arm_gripper
subtasks:
- anchor: object
  id: approach_high
  offset:
  - 0.0
  - 0.03
  - 0.08
  weight: 0.1
- anchor: object
  id: descend_to_contact
  offset:
  - 0.0
  - 0.03
  - 0.0
  weight: 0.1
- id: push_through_channel
  metric: goal_progress
  weight: 0.8
