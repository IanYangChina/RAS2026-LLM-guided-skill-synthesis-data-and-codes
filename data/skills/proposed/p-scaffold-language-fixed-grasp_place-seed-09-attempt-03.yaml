phases:
- control: position_control
  generator: arc_cartesian
  guards: []
  id: approach_1
  orientation:
    mode: keep_current
  parameters:
    approach_height:
      binds_to:
      - mode: replace
        path: generator.arc_height
      default: 0.1
      range:
      - 0.05
      - 0.3
      type: scalar
    approach_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.05
      range:
      - 0.01
      - 0.1
      type: scalar
  retries:
    max_attempts: 0
  target:
    anchor: task_object
    offset:
    - 0.0
    - 0.0
    - 0.12
    source: yaml
    tolerance: 0.02
  termination: pose_tolerance
  type: approach
- control: position_control
  generator: linear_cartesian
  guards: []
  id: descend_1
  orientation:
    mode: keep_current
  parameters:
    descend_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.03
      range:
      - 0.01
      - 0.1
      type: scalar
  retries:
    max_attempts: 0
  target:
    anchor: task_object
    offset:
    - 0.0
    - 0.0
    - 0.03
    source: yaml
    tolerance: 0.01
  termination: pose_tolerance
  type: descend
- control: position_control
  end_effector_action: force_grasp
  generator: null
  guards:
  - args: {}
    id: check_grasp
    on_failure: retry
    predicate: bilateral_grasp
    threshold: 0.01
    when: after_phase
  id: grasp_1
  parameters:
    grasp_timeout:
      default: 50
      range:
      - 20
      - 100
      type: scalar
  retries:
    max_attempts: 2
    offset:
    - 0.0
    - 0.0
    - -0.01
    strategy: offset_target
  subtask_id: grasp_1
  target:
    anchor: current_tcp
    offset:
    - 0.0
    - 0.0
    - 0.0
    source: yaml
  termination: time_limit
  type: grasp
- control: position_control
  generator: linear_cartesian
  guards: []
  id: lift_1
  orientation:
    mode: keep_current
  parameters:
    lift_height:
      binds_to:
      - mode: replace
        path: target.offset.z
      default: 0.15
      range:
      - 0.05
      - 0.3
      type: scalar
    lift_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.05
      range:
      - 0.01
      - 0.1
      type: scalar
  retries:
    max_attempts: 0
  target:
    anchor: task_object
    offset:
    - 0.0
    - 0.0
    - 0.25
    source: yaml
    tolerance: 0.02
  termination: pose_tolerance
  type: lift
- control: position_control
  generator: arc_cartesian
  guards: []
  id: transport_1
  orientation:
    mode: keep_current
  parameters:
    arc_height:
      binds_to:
      - mode: replace
        path: generator.arc_height
      default: 0.1
      range:
      - 0.05
      - 0.3
      type: scalar
    transport_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.03
      range:
      - 0.01
      - 0.1
      type: scalar
  retries:
    max_attempts: 0
  subtask_id: transport_arc
  target:
    anchor: task_goal
    offset:
    - 0.0
    - 0.0
    - 0.0
    source: yaml
    tolerance: 0.02
  termination: pose_tolerance
  type: approach
- control: position_control
  end_effector_action: open
  generator: null
  guards: []
  id: release_1
  parameters:
    release_timeout:
      default: 20
      range:
      - 10
      - 60
      type: scalar
  retries:
    max_attempts: 0
  subtask_id: release_1
  target:
    anchor: current_tcp
    offset:
    - 0.0
    - 0.0
    - 0.0
    source: yaml
  termination: time_limit
  type: release
skill: grasp_place
skill_type: arm_gripper
