dsl_version: 2
phases:
- control: position_control
  generator: linear_cartesian
  guards:
  - args: {}
    id: lift_force
    on_failure: abort
    predicate: force_below
    threshold: 5.0
    when: during_phase
  id: lift_up
  parameters:
    lift_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.15
      range:
      - 0.05
      - 0.3
      type: scalar
  retries:
    max_attempts: 2
    offset:
    - 0
    - 0
    - 0.02
    strategy: offset_target
  target:
    anchor: current_tcp
    offset:
    - 0
    - 0
    - 0.2
    orientation:
      mode: keep_current
    source: yaml
    tolerance: 0.01
  termination: pose_tolerance
  type: approach
- control: impedance_control
  generator: arc_cartesian
  guards:
  - args: {}
    id: approach_force
    on_failure: abort
    predicate: force_below
    threshold: 5.0
    when: during_phase
  id: approach_side
  parameters:
    approach_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.12
      range:
      - 0.05
      - 0.3
      type: scalar
    arc_height:
      binds_to:
      - mode: add
        path: generator.arc_height
      default: 0.2
      range:
      - 0.1
      - 0.3
      type: scalar
    lateral_offset_y:
      binds_to:
      - mode: replace
        path: target.offset.y
      default: 0.22
      range:
      - 0.18
      - 0.3
      type: scalar
    vertical_offset_z:
      binds_to:
      - mode: replace
        path: target.offset.z
      default: 0.55
      range:
      - 0.4
      - 0.6
      type: scalar
  retries:
    max_attempts: 2
    offset:
    - 0
    - 0.03
    - 0.05
    strategy: offset_target
  target:
    anchor: task_goal
    offset:
    - 0
    - 0.22
    - 0.55
    orientation:
      mode: keep_current
    source: yaml
    tolerance: 0.01
  termination: pose_tolerance
  type: approach
- control: position_control
  generator: linear_cartesian
  guards:
  - args: {}
    id: lateral_force
    on_failure: abort
    predicate: force_below
    threshold: 5.0
    when: during_phase
  id: lateral_move
  parameters:
    lateral_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.1
      range:
      - 0.05
      - 0.2
      type: scalar
  retries:
    max_attempts: 1
    strategy: reduce_speed
  target:
    anchor: task_goal
    offset:
    - 0
    - 0
    - 0.55
    orientation:
      mode: keep_current
    source: yaml
    tolerance: 0.01
  termination: pose_tolerance
  type: approach
- control: position_control
  generator: linear_cartesian
  guards:
  - args: {}
    id: descend_force
    on_failure: abort
    predicate: force_below
    threshold: 5.0
    when: during_phase
  id: final_descend
  parameters:
    descend_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.05
      range:
      - 0.02
      - 0.1
      type: scalar
  retries:
    max_attempts: 1
    strategy: reduce_speed
  target:
    anchor: task_goal
    offset:
    - 0
    - 0
    - 0
    orientation:
      mode: none
    source: yaml
    tolerance: 0.005
  termination: pose_tolerance
  type: descend
skill: obstacle_reach
