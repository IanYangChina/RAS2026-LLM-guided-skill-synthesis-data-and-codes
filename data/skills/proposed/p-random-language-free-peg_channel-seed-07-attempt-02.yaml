dsl_version: 2
phases:
- control: position_control
  generator: linear_cartesian
  id: approach_peg
  orientation:
    mode: keep_current
  parameters:
    approach_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.05
      range:
      - 0.01
      - 0.1
      type: scalar
  subtask_id: reach_peg
  target:
    anchor: task_object
    entity: peg
    offset:
    - 0.0
    - 0.03
    - 0.06
    source: yaml
  termination: pose_tolerance
  type: approach
- control: force_threshold_switch
  generator: linear_cartesian
  id: descend_peg
  orientation:
    mode: keep_current
  parameters:
    contact_force_threshold:
      binds_to:
      - mode: replace
        path: termination.force_threshold
      default: 5.0
      range:
      - 2.0
      - 10.0
      type: scalar
    descend_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.015
      range:
      - 0.005
      - 0.05
      type: scalar
  subtask_id: reach_peg
  target:
    anchor: task_object
    entity: peg
    offset:
    - 0.0
    - 0.01
    - 0.05
    source: yaml
  termination: force_exceeded
  type: descend
- control: impedance_control
  generator: linear_cartesian
  guards:
  - args: {}
    id: force_limit
    on_failure: retry
    predicate: force_below
    threshold: 30.0
    when: during_phase
  id: push_peg
  orientation:
    align_with: channel_axis
    axis:
    - 1
    - 0
    - 0
    mode: align_axis
    tolerance: 0.1
  parameters:
    push_distance:
      binds_to:
      - mode: replace
        path: target.offset_along_axis.distance
      default: 0.16
      range:
      - 0.05
      - 0.2
      type: scalar
    push_force_limit:
      binds_to:
      - mode: replace
        path: guards.force_limit.threshold
      default: 30.0
      range:
      - 10.0
      - 40.0
      type: scalar
    push_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.02
      range:
      - 0.005
      - 0.05
      type: scalar
  retries:
    max_attempts: 1
    offset:
    - 0.0
    - 0.005
    - 0.0
    strategy: offset_target
  subtask_id: insert_peg
  target:
    anchor: task_object
    entity: peg
    offset:
    - 0.0
    - 0.0
    - 0.0
    offset_along_axis:
      axis: channel_axis
      distance: 0.16
      mode: add_to_offset
      sign: positive
    source: yaml
  termination: pose_tolerance
  type: push
skill: peg_channel
skill_type: arm_gripper
subtasks:
- anchor: object
  id: reach_peg
  metric: distance
  offset:
  - 0.0
  - 0.02
  - 0.06
  target_entity: tcp
  weight: 0.3
- anchor: goal
  id: insert_peg
  metric: distance
  offset:
  - 0.0
  - 0.0
  - 0.0
  target_entity: tcp
  weight: 0.7
