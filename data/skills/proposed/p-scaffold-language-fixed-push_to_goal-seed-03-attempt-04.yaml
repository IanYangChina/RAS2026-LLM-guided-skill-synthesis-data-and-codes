dsl_version: 2
phases:
- control: position_control
  generator: linear_cartesian
  id: approach_1
  parameters:
    approach_speed:
      binds_to:
      - mode: add
        path: generator.speed
      default: 0.05
      range:
      - 0.01
      - 0.15
      type: scalar
    approach_tolerance:
      binds_to:
      - mode: add
        path: termination.pose_tolerance
      default: 0.02
      range:
      - 0.005
      - 0.05
      type: scalar
  subtask_id: approach
  target:
    anchor: task_object
    offset:
    - 0.0
    - 0.0
    - 0.0
    offset_along_axis:
      axis: task_goal_direction
      distance: 0.1
      mode: add_to_offset
      sign: negative
    orientation:
      align_with: world_z
      axis:
      - 0.0
      - 0.0
      - 1.0
      mode: align_axis
      tolerance: 0.1
    source: yaml
    tolerance: 0.02
  termination: pose_tolerance
  type: approach
- control: force_threshold_switch
  generator: linear_cartesian
  guards:
  - args: {}
    id: contact_force_limit
    on_failure: retry
    predicate: force_below
    threshold: 10.0
    when: during_phase
  id: contact_1
  parameters:
    contact_force_threshold:
      binds_to:
      - mode: add
        path: termination.force_threshold
      default: 3.0
      range:
      - 1.0
      - 10.0
      type: scalar
    contact_speed:
      binds_to:
      - mode: add
        path: generator.speed
      default: 0.02
      range:
      - 0.005
      - 0.05
      type: scalar
  retries:
    max_attempts: 2
    strategy: reduce_speed
  subtask_id: contact
  target:
    anchor: task_object
    offset:
    - 0.0
    - 0.0
    - 0.0
    offset_along_axis:
      axis: task_goal_direction
      distance: 0.025
      mode: add_to_offset
      sign: negative
    orientation:
      align_with: world_z
      axis:
      - 0.0
      - 0.0
      - 1.0
      mode: align_axis
      tolerance: 0.1
    source: yaml
    tolerance: 0.02
  termination: force_exceeded
  type: contact
- control: impedance_control
  generator: linear_cartesian
  guards:
  - args: {}
    id: push_force_limit
    on_failure: retry
    predicate: force_below
    threshold: 25.0
    when: during_phase
  id: push_1
  parameters:
    push_distance:
      binds_to:
      - mode: add
        path: target.offset_along_axis.distance
      default: 0.1
      range:
      - 0.02
      - 0.2
      type: scalar
    push_speed:
      binds_to:
      - mode: add
        path: generator.speed
      default: 0.03
      range:
      - 0.01
      - 0.1
      type: scalar
    push_tolerance:
      binds_to:
      - mode: add
        path: termination.pose_tolerance
      default: 0.02
      range:
      - 0.005
      - 0.05
      type: scalar
  retries:
    max_attempts: 2
    strategy: reduce_speed
  subtask_id: push
  target:
    anchor: task_goal
    offset:
    - 0.0
    - 0.0
    - 0.0
    offset_along_axis:
      axis: task_goal_direction
      distance: 0.06
      mode: add_to_offset
      sign: negative
    orientation:
      align_with: world_z
      axis:
      - 0.0
      - 0.0
      - 1.0
      mode: align_axis
      tolerance: 0.1
    source: yaml
    tolerance: 0.02
  termination: pose_tolerance
  type: push
- control: position_control
  generator: linear_cartesian
  id: lift_1
  parameters:
    lift_speed:
      binds_to:
      - mode: add
        path: generator.speed
      default: 0.05
      range:
      - 0.01
      - 0.1
      type: scalar
  target:
    anchor: current_tcp
    offset:
    - 0.0
    - 0.0
    - 0.1
    orientation:
      align_with: world_z
      axis:
      - 0.0
      - 0.0
      - 1.0
      mode: align_axis
      tolerance: 0.1
    source: yaml
    tolerance: 0.02
  termination: pose_tolerance
  type: lift
skill: push_to_goal
skill_type: arm
