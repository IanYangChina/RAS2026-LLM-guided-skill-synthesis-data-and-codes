dsl_version: 2
phases:
- control: position_control
  generator: linear_cartesian
  id: approach_above
  parameters:
    speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.2
      range:
      - 0.05
      - 0.5
      type: scalar
    tolerance:
      binds_to:
      - mode: replace
        path: termination.pose_tolerance
      default: 0.03
      range:
      - 0.01
      - 0.05
      type: scalar
  subtask_id: pre_contact
  target:
    anchor: task_object
    offset:
    - 0.0
    - 0.0
    - 0.1
    source: yaml
  termination: pose_tolerance
  type: approach
- control: force_threshold_switch
  generator: linear_cartesian
  guards:
  - args: {}
    id: contact_confirmed
    on_failure: retry
    predicate: contact_detected
    threshold: 1.0
    when: after_phase
  id: descend_contact
  parameters:
    force_threshold:
      binds_to:
      - mode: replace
        path: termination.force_threshold
      default: 5.0
      range:
      - 2.0
      - 15.0
      type: scalar
    speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.03
      range:
      - 0.01
      - 0.1
      type: scalar
  retries:
    max_attempts: 1
    strategy: reduce_speed
  subtask_id: pre_contact
  target:
    anchor: task_object
    offset:
    - 0.0
    - 0.0
    - 0.0
    source: yaml
  termination: force_exceeded
  type: descend
- control: position_control
  generator: linear_cartesian
  guards:
  - args: {}
    id: object_moving
    on_failure: retry
    predicate: object_progress
    threshold: 0.01
    when: during_phase
  id: push_to_goal
  orientation:
    mode: keep_current
  parameters:
    speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.1
      range:
      - 0.02
      - 0.3
      type: scalar
    stroke_distance:
      binds_to:
      - mode: replace
        path: target.offset_along_axis.distance
      default: 0.05
      range:
      - 0.02
      - 0.1
      type: scalar
    tolerance:
      binds_to:
      - mode: replace
        path: termination.pose_tolerance
      default: 0.02
      range:
      - 0.01
      - 0.03
      type: scalar
  retries:
    max_attempts: 2
    offset:
    - 0.0
    - 0.005
    - 0.0
    strategy: offset_target
  subtask_id: push_goal
  target:
    anchor: task_goal
    offset:
    - 0.0
    - 0.0
    - 0.0
    offset_along_axis:
      axis: task_goal_direction
      distance: 0.05
      mode: add_to_offset
      sign: positive
    source: yaml
  termination: pose_tolerance
  type: push
skill: push_to_goal
subtasks:
- anchor: object
  id: pre_contact
  offset:
  - 0.0
  - 0.0
  - 0.1
  weight: 0.3
- id: push_goal
  metric: goal_progress
  target_entity: object
  weight: 0.7
