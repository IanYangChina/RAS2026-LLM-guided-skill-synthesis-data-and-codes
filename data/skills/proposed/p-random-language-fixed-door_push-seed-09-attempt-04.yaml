dsl_version: 2
phases:
- control: position_control
  generator: linear_cartesian
  id: approach_handle
  parameters:
    approach_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.15
      range:
      - 0.05
      - 0.3
      type: scalar
    approach_tolerance:
      binds_to:
      - mode: replace
        path: termination.pose_tolerance
      default: 0.02
      range:
      - 0.01
      - 0.04
      type: scalar
  target:
    anchor: body
    entity: door_panel
    offset:
    - -0.4
    - -0.02
    - 0.35
    orientation:
      align_with: world_y
      axis:
      - 1
      - 0
      - 0
      mode: align_axis
      tolerance: 0.1
  termination: pose_tolerance
  type: approach
- control: position_control
  generator: linear_cartesian
  id: contact_handle
  parameters:
    contact_force_threshold:
      binds_to:
      - mode: replace
        path: termination.force_threshold
      default: 12.0
      range:
      - 5.0
      - 25.0
      type: scalar
    contact_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.02
      range:
      - 0.005
      - 0.06
      type: scalar
  target:
    anchor: body
    entity: door_panel
    offset:
    - -0.4
    - -0.02
    - 0.35
    offset_along_axis:
      axis: world_y
      distance: 0.01
      mode: add_to_offset
      sign: positive
    orientation:
      align_with: world_y
      axis:
      - 1
      - 0
      - 0
      mode: align_axis
      tolerance: 0.1
  termination: force_exceeded
  type: descend
- control: impedance_control
  generator: linear_cartesian
  guards:
  - args: {}
    id: force_guard
    on_failure: retry
    predicate: force_below
    threshold: 20.0
    when: during_phase
  id: push_door
  parameters:
    push_distance:
      binds_to:
      - mode: replace
        path: target.offset_along_axis.distance
      default: 0.2
      range:
      - 0.05
      - 0.3
      type: scalar
    push_force_limit:
      binds_to:
      - mode: replace
        path: guards.force_guard.threshold
      default: 20.0
      range:
      - 10.0
      - 28.0
      type: scalar
    push_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.06
      range:
      - 0.02
      - 0.12
      type: scalar
    push_tolerance:
      binds_to:
      - mode: replace
        path: termination.pose_tolerance
      default: 0.025
      range:
      - 0.01
      - 0.04
      type: scalar
  retries:
    max_attempts: 2
    offset:
    - 0.0
    - 0.0
    - 0.0
    strategy: offset_target
  target:
    anchor: body
    entity: door_panel
    offset:
    - -0.4
    - -0.02
    - 0.35
    offset_along_axis:
      axis: world_y
      distance: 0.2
      mode: add_to_offset
      sign: positive
    orientation:
      align_with: world_y
      axis:
      - 1
      - 0
      - 0
      mode: align_axis
      tolerance: 0.1
  termination: pose_tolerance
  type: push
skill: door_push
