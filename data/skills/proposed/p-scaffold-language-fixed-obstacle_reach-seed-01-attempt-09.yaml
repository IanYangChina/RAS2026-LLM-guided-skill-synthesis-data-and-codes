dsl_version: 2
phases:
- control: position_control
  generator: linear_cartesian
  id: rise_above_obstacle
  parameters:
    rise_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.05
      range:
      - 0.01
      - 0.1
      type: scalar
    rise_z:
      binds_to:
      - mode: replace
        path: target.offset.z
      default: 0.2
      range:
      - 0.1
      - 0.4
      type: scalar
  target:
    anchor: current_tcp
    offset:
    - 0.0
    - 0.0
    - 0.2
    orientation:
      mode: none
    source: yaml
    tolerance: 0.02
  termination: pose_tolerance
  type: approach
- control: position_control
  generator: linear_cartesian
  id: lateral_clear_approach
  parameters:
    lateral_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.05
      range:
      - 0.01
      - 0.1
      type: scalar
    lateral_x_offset:
      binds_to:
      - mode: replace
        path: target.offset.x
      default: 0.15
      range:
      - 0.05
      - 0.2
      type: scalar
    lateral_y_offset:
      binds_to:
      - mode: replace
        path: target.offset.y
      default: 0.2
      range:
      - 0.1
      - 0.3
      type: scalar
    lateral_z_offset:
      binds_to:
      - mode: replace
        path: target.offset.z
      default: 0.35
      range:
      - 0.25
      - 0.5
      type: scalar
  target:
    anchor: task_goal
    offset:
    - 0.15
    - 0.2
    - 0.35
    orientation:
      mode: none
    source: yaml
    tolerance: 0.02
  termination: pose_tolerance
  type: approach
- control: position_control
  generator: linear_cartesian
  id: descend_to_goal
  parameters:
    descend_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.03
      range:
      - 0.01
      - 0.1
      type: scalar
  target:
    anchor: task_goal
    offset:
    - 0.0
    - 0.0
    - 0.0
    orientation:
      mode: none
    source: yaml
    tolerance: 0.01
  termination: pose_tolerance
  type: descend
skill: obstacle_reach
