dsl_version: 2
phases:
- control: position_control
  generator: arc_cartesian
  id: approach_1
  parameters:
    approach_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.08
      range:
      - 0.05
      - 0.15
      type: scalar
    arc_height:
      binds_to:
      - mode: replace
        path: generator.arc_height
      default: 0.07
      range:
      - 0.04
      - 0.12
      type: scalar
  subtask_id: approach_peg
  target:
    anchor: task_object
    entity: peg
    offset:
    - 0.0
    - 0.1
    - 0.04
    orientation:
      mode: keep_current
    source: yaml
    tolerance: 0.02
  termination: pose_tolerance
  type: approach
- control: impedance_control
  generator: linear_cartesian
  guards:
  - id: force_limit_guard
    on_failure: retry
    predicate: force_below
    threshold: 50.0
    when: during_phase
  id: push_1
  parameters:
    push_distance:
      binds_to:
      - mode: replace
        path: target.offset_along_axis.distance
      default: 0.18
      range:
      - 0.16
      - 0.22
      type: scalar
    push_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.012
      range:
      - 0.008
      - 0.02
      type: scalar
    push_timeout:
      binds_to:
      - mode: replace
        path: duration.max_time
      default: 4.0
      range:
      - 2.0
      - 6.0
      type: scalar
  retries:
    max_attempts: 2
    offset:
    - 0.0
    - 0.008
    - 0.0
    strategy: offset_target
  subtask_id: push_to_goal
  target:
    anchor: task_object
    entity: peg
    offset:
    - 0.0
    - 0.1
    - 0.0
    offset_along_axis:
      axis: channel_axis
      distance: 0.18
      mode: add_to_offset
      sign: positive
    orientation:
      mode: keep_current
    source: yaml
    tolerance: 0.04
  termination: time_limit
  type: push
skill: peg_channel
subtasks:
- anchor: object
  id: approach_peg
  offset:
  - 0.0
  - 0.1
  - 0.04
  weight: 0.3
- id: push_to_goal
  metric: goal_progress
  target_entity: object
  weight: 0.7
