dsl_version: 2
phases:
- control: position_control
  generator: linear_cartesian
  id: approach_socket
  orientation:
    align_with: insertion_axis
    axis:
    - 0
    - 0
    - 1
    mode: align_axis
  parameters:
    approach_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.05
      range:
      - 0.02
      - 0.1
      type: scalar
    approach_tolerance:
      binds_to:
      - mode: replace
        path: termination.pose_tolerance
      default: 0.01
      range:
      - 0.005
      - 0.02
      type: scalar
  subtask_id: reach_approach
  target:
    anchor: fixture
    entity: peg_socket
    offset:
    - 0
    - 0
    - 0.055
    source: yaml
  termination: pose_tolerance
  type: approach
- control: impedance_control
  generator: linear_cartesian
  id: insert_peg
  orientation:
    mode: keep_current
  parameters:
    insertion_distance:
      binds_to:
      - mode: replace
        path: target.offset_along_axis.distance
      default: 0.1
      range:
      - 0.05
      - 0.15
      type: scalar
    insertion_force_threshold:
      binds_to:
      - mode: replace
        path: termination.force_threshold
      default: 10
      range:
      - 5
      - 20
      type: scalar
  subtask_id: reach_insertion
  target:
    anchor: fixture
    entity: peg_socket
    offset:
    - 0
    - 0
    - 0.055
    offset_along_axis:
      axis: insertion_axis
      distance: 0.1
      mode: add_to_offset
      sign: positive
    source: yaml
  termination: force_exceeded
  type: descend
skill: peg_insert
skill_type: arm
subtasks:
- anchor: fixture
  id: reach_approach
  metric: distance
  offset:
  - 0
  - 0
  - 0.055
  target_entity: tcp
  weight: 0.3
- anchor: goal
  id: reach_insertion
  metric: goal_progress
  target_entity: tcp
  weight: 0.7
