dsl_version: 2
phases:
- control: position_control
  generator: linear_cartesian
  id: approach_peg
  orientation:
    align_with: channel_axis
    axis:
    - 0
    - 0
    - 1
    mode: align_axis
  parameters:
    approach_offset_y:
      binds_to:
      - mode: replace
        path: target.offset.y
      default: -0.01
      range:
      - -0.03
      - 0.03
      type: scalar
    approach_offset_z:
      binds_to:
      - mode: replace
        path: target.offset.z
      default: 0.04
      range:
      - 0.02
      - 0.08
      type: scalar
    approach_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.1
      range:
      - 0.02
      - 0.2
      type: scalar
  subtask_id: approach_sub
  target:
    anchor: task_object
    offset:
    - 0
    - -0.01
    - 0.04
  termination: pose_tolerance
  type: approach
- control: force_threshold_switch
  generator: linear_cartesian
  guards:
  - args: {}
    id: contact_guard
    on_failure: retry
    predicate: contact_detected
    threshold: 0.5
    when: during_phase
  id: contact_peg
  orientation:
    align_with: channel_axis
    axis:
    - 0
    - 0
    - 1
    mode: align_axis
  parameters:
    contact_force_threshold:
      binds_to:
      - mode: replace
        path: termination.force_threshold
      default: 5.0
      range:
      - 2.0
      - 15.0
      type: scalar
  subtask_id: approach_sub
  target:
    anchor: task_object
    offset:
    - 0
    - -0.01
    - 0.0
  termination: force_exceeded
  type: descend
- control: admittance_control
  generator: linear_cartesian
  guards:
  - args: {}
    id: force_guard
    on_failure: retry
    predicate: force_below
    threshold: 30.0
    when: during_phase
  id: push_through
  orientation:
    align_with: channel_axis
    axis:
    - 0
    - 0
    - 1
    mode: align_axis
  parameters:
    push_distance:
      binds_to:
      - mode: replace
        path: target.offset_along_axis.distance
      default: 0.16
      range:
      - 0.05
      - 0.2
      type: scalar
    push_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.03
      range:
      - 0.01
      - 0.1
      type: scalar
  retries:
    max_attempts: 2
    offset:
    - 0
    - 0.005
    - 0
    strategy: offset_target
  subtask_id: push_sub
  target:
    anchor: task_goal
    offset:
    - 0
    - 0
    - 0
    offset_along_axis:
      axis: channel_axis
      distance: 0.16
      mode: replace_offset_projection
      sign: positive
  termination: pose_tolerance
  type: push
skill: peg_channel
skill_type: arm_gripper
subtasks:
- anchor: object
  id: approach_sub
  offset:
  - 0
  - -0.01
  - 0.04
  target_entity: tcp
  weight: 0.3
- anchor: goal
  id: push_sub
  metric: goal_progress
  offset:
  - 0
  - 0
  - 0
  target_entity: object
  weight: 0.7
