dsl_version: 2
phases:
- control: position_control
  generator: linear_cartesian
  guards:
  - id: guard_approach_contact
    on_failure: continue
    predicate: contact_detected
    threshold: 1.0
    when: during_phase
  id: approach_door
  parameters:
    approach_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.1
      range:
      - 0.05
      - 0.2
      type: scalar
  retries:
    max_attempts: 1
    strategy: reduce_speed
  subtask_id: reach_contact
  target:
    anchor: fixture
    entity: door_panel
    offset:
    - 0.0
    - -0.05
    - 0.3
    orientation:
      mode: keep_current
    source: yaml
    tolerance: 0.01
  termination: pose_tolerance
  type: approach
- control: admittance_control
  generator: impedance_motion
  guards:
  - id: guard_force_limit
    on_failure: continue
    predicate: force_below
    threshold: 30.0
    when: during_phase
  id: push_door
  parameters:
    max_time:
      binds_to:
      - mode: replace
        path: termination.time_limit
      default: 3.0
      range:
      - 1.0
      - 5.0
      type: scalar
    push_distance:
      binds_to:
      - mode: replace
        path: target.offset_along_axis.distance
      default: 0.15
      range:
      - 0.05
      - 0.3
      type: scalar
    push_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.05
      range:
      - 0.01
      - 0.1
      type: scalar
  retries:
    max_attempts: 1
    strategy: reduce_speed
  subtask_id: open_door
  target:
    anchor: current_tcp
    offset:
    - 0.0
    - 0.0
    - 0.0
    offset_along_axis:
      axis: channel_axis
      distance: 0.15
      mode: add_to_offset
      sign: positive
    orientation:
      mode: keep_current
    source: yaml
  termination: time_limit
  type: push
skill: door_push
subtasks:
- anchor: fixture
  id: reach_contact
  metric: distance
  offset:
  - 0.0
  - -0.05
  - 0.3
  target_entity: tcp
  weight: 0.3
- anchor: goal
  id: open_door
  metric: hinge_angle
  offset:
  - 0.0
  - 0.0
  - 0.0
  target_entity: hinge
  weight: 0.7
