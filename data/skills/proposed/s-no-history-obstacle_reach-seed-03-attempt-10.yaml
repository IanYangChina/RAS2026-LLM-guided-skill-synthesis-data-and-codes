dsl_version: 2
phases:
- control: position_control
  generator: arc_cartesian
  id: clearance_arc
  orientation:
    mode: none
  parameters:
    arc_height:
      binds_to:
      - mode: replace
        path: generator.arc_height
      default: 0.3
      range:
      - 0.1
      - 0.5
      type: scalar
    arc_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.5
      range:
      - 0.1
      - 1.0
      type: scalar
  subtask_id: clear_obstacle
  target:
    anchor: world
    offset:
    - 0.5
    - 0.2
    - 0.5
    source: yaml
  termination: pose_tolerance
  type: approach
- control: position_control
  generator: linear_cartesian
  id: goal_approach
  orientation:
    mode: none
  parameters:
    final_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.3
      range:
      - 0.1
      - 1.0
      type: scalar
  subtask_id: reach_goal
  target:
    anchor: task_goal
    offset:
    - 0.0
    - 0.0
    - 0.0
    source: yaml
  termination: pose_tolerance
  type: approach
skill: obstacle_reach
subtasks:
- anchor: fixture
  id: clear_obstacle
  metric: distance
  offset:
  - 0.0
  - 0.2
  - 0.35
  target_entity: tcp
  weight: 0.4
- anchor: goal
  id: reach_goal
  metric: distance
  offset:
  - 0.0
  - 0.0
  - 0.0
  target_entity: tcp
  weight: 0.6
