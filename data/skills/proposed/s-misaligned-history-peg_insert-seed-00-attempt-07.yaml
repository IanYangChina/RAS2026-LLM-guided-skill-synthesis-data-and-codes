dsl_version: 2
phases:
- control: position_control
  generator: linear_cartesian
  id: approach_1
  parameters:
    approach_speed:
      binds_to:
      - mode: scale
        path: generator.speed
      default: 0.08
      range:
      - 0.05
      - 0.15
      type: scalar
    approach_tolerance:
      binds_to:
      - mode: replace
        path: termination.pose_tolerance
      default: 0.01
      range:
      - 0.005
      - 0.02
      type: scalar
  subtask_id: approach
  target:
    anchor: task_goal
    offset:
    - 0.0
    - 0.0
    - 0.15
    orientation:
      mode: keep_current
    source: yaml
    tolerance: 0.01
  termination: pose_tolerance
  type: approach
- control: impedance_control
  generator: linear_cartesian
  guards:
  - args: {}
    id: contact_check
    on_failure: retry
    predicate: contact_detected
    threshold: 0.5
    when: after_phase
  id: descend_to_entry
  parameters:
    descend_speed:
      binds_to:
      - mode: scale
        path: generator.speed
      default: 0.05
      range:
      - 0.02
      - 0.1
      type: scalar
  retries:
    max_attempts: 2
    offset:
    - 0.005
    - 0.005
    - 0.0
    strategy: offset_target
  subtask_id: contact
  target:
    anchor: task_goal
    offset:
    - 0.0
    - 0.0
    - 0.055
    orientation:
      align_with: channel_axis
      axis:
      - 0.0
      - 0.0
      - 1.0
      mode: align_axis
      tolerance: 0.05
    source: yaml
    tolerance: 0.008
  termination: pose_tolerance
  type: descend
- control: impedance_control
  generator: impedance_motion
  guards:
  - args: {}
    id: contact_maintained
    on_failure: retry
    predicate: contact_detected
    threshold: 0.5
    when: after_phase
  id: insert_1
  parameters:
    insert_distance:
      binds_to:
      - mode: replace
        path: target.offset_along_axis.distance
      default: 0.05
      range:
      - 0.03
      - 0.06
      type: scalar
    insert_force_threshold:
      binds_to:
      - mode: replace
        path: termination.force_threshold
      default: 40.0
      range:
      - 30.0
      - 50.0
      type: scalar
    insert_speed:
      binds_to:
      - mode: scale
        path: generator.speed
      default: 0.02
      range:
      - 0.01
      - 0.04
      type: scalar
  retries:
    max_attempts: 2
    offset:
    - 0.005
    - 0.005
    - 0.0
    strategy: offset_target
  subtask_id: insertion
  target:
    anchor: task_goal
    offset:
    - 0.0
    - 0.0
    - 0.055
    offset_along_axis:
      axis: channel_axis
      distance: 0.05
      mode: replace_offset_projection
      sign: negative
    orientation:
      align_with: channel_axis
      axis:
      - 0.0
      - 0.0
      - 1.0
      mode: align_axis
      tolerance: 0.05
    source: yaml
  termination: force_exceeded
  type: insert
skill: peg_insert
subtasks:
- anchor: goal
  id: approach
  metric: distance
  offset:
  - 0.0
  - 0.0
  - 0.15
  target_entity: tcp
  weight: 0.2
- anchor: goal
  id: contact
  metric: distance
  offset:
  - 0.0
  - 0.0
  - 0.055
  target_entity: tcp
  weight: 0.3
- anchor: goal
  id: insertion
  metric: goal_progress
  offset:
  - 0.0
  - 0.0
  - 0.0
  target_entity: tcp
  weight: 0.5
