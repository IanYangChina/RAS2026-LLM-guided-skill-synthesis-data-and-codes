dsl_version: 2
phases:
- control: position_control
  generator: linear_cartesian
  id: approach_object
  subtask_id: approach_objective
  target:
    anchor: task_object
    offset:
    - 0.0
    - 0.0
    - 0.05
    orientation:
      mode: keep_current
    source: yaml
    tolerance: 0.01
  termination: pose_tolerance
  type: approach
- control: position_control
  generator: linear_cartesian
  id: descend_to_grasp
  target:
    anchor: task_object
    offset:
    - 0.0
    - 0.0
    - 0.03
    orientation:
      mode: keep_current
    source: yaml
    tolerance: 0.01
  termination: pose_tolerance
  type: descend
- control: position_control
  end_effector_action: force_grasp
  guards:
  - id: grasp_closed
    on_failure: retry
    predicate: bilateral_grasp
    threshold: 0.5
    when: after_phase
  id: grasp
  retries:
    max_attempts: 2
    strategy: repeat
  target:
    anchor: current_tcp
    offset:
    - 0.0
    - 0.0
    - 0.0
    source: yaml
  termination: time_limit
  type: grasp
- control: position_control
  generator: linear_cartesian
  guards:
  - id: object_lifted
    on_failure: retry
    predicate: object_lifted
    threshold: 0.05
    when: after_phase
  id: lift
  parameters:
    lift_height:
      binds_to:
      - mode: replace
        path: target.offset_along_axis.distance
      default: 0.18
      range:
      - 0.12
      - 0.25
      type: scalar
  retries:
    max_attempts: 1
    strategy: repeat
  target:
    anchor: current_tcp
    offset:
    - 0.0
    - 0.0
    - 0.0
    offset_along_axis:
      axis: world_z
      distance: 0.18
      mode: add_to_offset
    orientation:
      mode: keep_current
    source: yaml
    tolerance: 0.01
  termination: pose_tolerance
  type: lift
- control: position_control
  generator: arc_cartesian
  guards:
  - id: retain_grasp
    on_failure: retry
    predicate: bilateral_grasp
    threshold: 0.5
    when: before_phase
  id: transport_to_goal
  parameters:
    arc_height:
      binds_to:
      - mode: replace
        path: generator.arc_height
      default: 0.1
      range:
      - 0.05
      - 0.2
      type: scalar
    transport_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.12
      range:
      - 0.05
      - 0.25
      type: scalar
  retries:
    max_attempts: 1
    strategy: repeat
  target:
    anchor: task_goal
    offset:
    - 0.0
    - 0.0
    - 0.15
    orientation:
      mode: keep_current
    source: yaml
    tolerance: 0.02
  termination: pose_tolerance
  type: approach
- control: position_control
  generator: linear_cartesian
  id: descend_to_place
  parameters:
    place_offset_z:
      binds_to:
      - mode: replace
        path: target.offset.z
      default: 0.02
      range:
      - 0.01
      - 0.04
      type: scalar
  subtask_id: placement_objective
  target:
    anchor: task_goal
    offset:
    - 0.0
    - 0.0
    - 0.02
    orientation:
      mode: keep_current
    source: yaml
    tolerance: 0.01
  termination: pose_tolerance
  type: descend
- control: position_control
  end_effector_action: open
  id: release
  target:
    anchor: current_tcp
    offset:
    - 0.0
    - 0.0
    - 0.0
    source: yaml
  termination: time_limit
  type: release
- control: position_control
  generator: linear_cartesian
  id: retract
  target:
    anchor: current_tcp
    offset:
    - 0.0
    - 0.0
    - 0.1
    orientation:
      mode: keep_current
    source: yaml
    tolerance: 0.01
  termination: pose_tolerance
  type: retract
skill: grasp_place
skill_type: arm_gripper
subtasks:
- anchor: object
  id: approach_objective
  offset:
  - 0.0
  - 0.0
  - 0.05
  weight: 0.3
- anchor: goal
  id: placement_objective
  metric: goal_progress
  target_entity: object
  weight: 0.7
