dsl_version: 2
phases:
- control: position_control
  generator: linear_cartesian
  id: approach_to_peg
  parameters:
    speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.05
      range:
      - 0.01
      - 0.1
      type: scalar
  subtask_id: approach
  target:
    anchor: task_object
    offset:
    - 0
    - 0.04
    - 0.08
    orientation:
      mode: none
    source: yaml
    tolerance: 0.01
  termination: pose_tolerance
  type: approach
- control: position_control
  generator: linear_cartesian
  id: descend_to_contact
  subtask_id: contact
  target:
    anchor: task_object
    offset:
    - 0
    - 0.02
    - 0.0
    orientation:
      mode: none
    source: yaml
    tolerance: 0.005
  termination: pose_tolerance
  type: descend
- control: impedance_control
  generator: linear_cartesian
  guards:
  - id: force_guard
    on_failure: retry
    predicate: force_below
    threshold: 30.0
    when: during_phase
  id: push_through_channel
  parameters:
    force_threshold:
      binds_to:
      - mode: replace
        path: guards.force_guard.threshold
      default: 30.0
      range:
      - 10.0
      - 40.0
      type: scalar
    push_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.02
      range:
      - 0.005
      - 0.05
      type: scalar
  retries:
    max_attempts: 1
    offset:
    - 0
    - 0.005
    - 0
    strategy: offset_target
  target:
    anchor: task_goal
    offset:
    - 0
    - 0
    - 0
    orientation:
      mode: keep_current
    source: yaml
    tolerance: 0.02
  termination: pose_tolerance
  type: push
- control: position_control
  generator: linear_cartesian
  id: retract_from_channel
  target:
    anchor: task_goal
    offset:
    - 0
    - 0
    - 0.05
    orientation:
      mode: none
    source: yaml
    tolerance: 0.01
  termination: pose_tolerance
  type: retract
skill: peg_channel
skill_type: arm
