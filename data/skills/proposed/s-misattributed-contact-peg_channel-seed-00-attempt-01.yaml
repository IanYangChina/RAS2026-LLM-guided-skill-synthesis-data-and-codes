dsl_version: 2
phases:
- control: position_control
  generator: linear_cartesian
  id: approach_1
  parameters:
    speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.08
      range:
      - 0.02
      - 0.15
      type: scalar
  subtask_id: reach_contact
  target:
    anchor: task_object
    entity: peg
    offset:
    - 0.0
    - 0.02
    - 0.1
    orientation:
      mode: none
    source: yaml
    tolerance: 0.01
  termination: pose_tolerance
  type: approach
- control: force_threshold_switch
  generator: linear_cartesian
  id: descend_1
  parameters:
    force_threshold:
      binds_to:
      - mode: replace
        path: termination.force_threshold
      default: 5.0
      range:
      - 2.0
      - 20.0
      type: scalar
    speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.04
      range:
      - 0.01
      - 0.08
      type: scalar
  subtask_id: reach_contact
  target:
    anchor: task_object
    entity: peg
    offset:
    - 0.0
    - 0.02
    - 0.02
    orientation:
      mode: none
    source: yaml
    tolerance: 0.005
  termination: force_exceeded
  type: descend
- control: impedance_control
  generator: linear_cartesian
  id: push_1
  parameters:
    push_distance:
      binds_to:
      - mode: replace
        path: target.offset_along_axis.distance
      default: 0.16
      range:
      - 0.05
      - 0.22
      type: scalar
    speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.02
      range:
      - 0.005
      - 0.06
      type: scalar
  subtask_id: reach_goal
  target:
    anchor: task_object
    entity: peg
    offset:
    - 0.0
    - 0.02
    - 0.0
    offset_along_axis:
      axis: channel_axis
      distance: 0.16
      mode: add_to_offset
      sign: positive
    orientation:
      mode: none
    source: yaml
    tolerance: 0.02
  termination: pose_tolerance
  type: push
- control: position_control
  generator: linear_cartesian
  id: retract_1
  parameters:
    speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.08
      range:
      - 0.02
      - 0.15
      type: scalar
  subtask_id: reach_goal
  target:
    anchor: task_goal
    entity: channel_exit
    offset:
    - 0.0
    - 0.0
    - 0.1
    orientation:
      mode: none
    source: yaml
    tolerance: 0.01
  termination: pose_tolerance
  type: retract
skill: peg_channel
subtasks:
- anchor: object
  id: reach_contact
  metric: distance
  offset:
  - 0.0
  - 0.02
  - 0.05
  target_entity: tcp
  weight: 0.3
- anchor: goal
  id: reach_goal
  metric: distance
  offset:
  - 0.0
  - 0.0
  - 0.0
  target_entity: tcp
  weight: 0.7
