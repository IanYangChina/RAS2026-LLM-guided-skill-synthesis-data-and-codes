dsl_version: 2
phases:
- control: position_control
  generator: linear_cartesian
  id: approach_1
  parameters:
    speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.05
      range:
      - 0.01
      - 0.1
      type: scalar
  target:
    anchor: site
    entity: door_handle
    offset:
    - 0
    - 0.05
    - 0
    orientation:
      mode: keep_current
    source: yaml
  termination: pose_tolerance
  type: approach
- control: force_threshold_switch
  generator: linear_cartesian
  id: contact_1
  parameters:
    speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.02
      range:
      - 0.005
      - 0.05
      type: scalar
  target:
    anchor: site
    entity: door_handle
    offset:
    - 0
    - 0
    - 0
    orientation:
      mode: keep_current
    source: yaml
  termination: contact_detected
  type: contact
- control: impedance_control
  generator: linear_cartesian
  guards:
  - args: {}
    id: push_contact
    on_failure: abort
    predicate: contact_detected
    threshold: 0
    when: during_phase
  id: push_1
  parameters:
    force_threshold:
      binds_to:
      - mode: replace
        path: termination.force_threshold
      default: 20.0
      range:
      - 10.0
      - 30.0
      type: scalar
    push_distance:
      binds_to:
      - mode: replace
        path: target.offset_along_axis.distance
      default: 0.3
      range:
      - 0.15
      - 0.4
      type: scalar
    speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.05
      range:
      - 0.01
      - 0.1
      type: scalar
  target:
    anchor: site
    entity: door_handle
    offset:
    - 0
    - 0
    - 0
    offset_along_axis:
      axis: world_y
      distance: 0.3
      mode: replace_offset_projection
      sign: negative
    orientation:
      mode: keep_current
    source: yaml
  termination: force_exceeded
  type: push
- control: position_control
  generator: linear_cartesian
  id: retract_1
  parameters:
    speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.05
      range:
      - 0.01
      - 0.1
      type: scalar
  target:
    anchor: site
    entity: door_handle
    offset:
    - 0
    - 0.05
    - 0
    orientation:
      mode: keep_current
    source: yaml
  termination: pose_tolerance
  type: retract
skill: door_push
skill_type: arm
subtasks:
- anchor: fixture
  id: hinge_progress
  metric: hinge_angle
  offset:
  - 0
  - 0
  - 0
  target_entity: hinge
  weight: 1.0
