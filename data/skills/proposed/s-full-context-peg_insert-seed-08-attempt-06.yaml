dsl_version: 2
phases:
- control: position_control
  generator: linear_cartesian
  id: approach_socket
  parameters:
    approach_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.12
      range:
      - 0.05
      - 0.2
      type: scalar
  subtask_id: approach_subtask
  target:
    anchor: task_goal
    offset:
    - 0.0
    - 0.0
    - 0.055
    orientation:
      mode: none
    source: yaml
    tolerance: 0.015
  termination: pose_tolerance
  type: approach
- control: position_control
  generator: linear_cartesian
  id: align_entry
  parameters:
    align_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.05
      range:
      - 0.02
      - 0.1
      type: scalar
  subtask_id: approach_subtask
  target:
    anchor: task_goal
    offset:
    - 0.0
    - 0.0
    - 0.055
    orientation:
      align_with: channel_axis
      axis:
      - 0.0
      - 0.0
      - 1.0
      mode: align_axis
      tolerance: 0.1
    source: yaml
    tolerance: 0.01
  termination: pose_tolerance
  type: align
- control: impedance_control
  generator: linear_cartesian
  guards:
  - id: insert_force_limit
    on_failure: retry
    predicate: force_below
    threshold: 30.0
    when: during_phase
  id: insert_down
  parameters:
    insertion_force_threshold:
      binds_to:
      - mode: replace
        path: guards.insert_force_limit.threshold
      default: 30.0
      range:
      - 20.0
      - 40.0
      type: scalar
    insertion_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.015
      range:
      - 0.005
      - 0.04
      type: scalar
    retry_lateral_offset:
      binds_to:
      - mode: replace
        path: retries.offset.x
      default: 0.005
      range:
      - 0.0
      - 0.01
      type: scalar
  retries:
    max_attempts: 2
    offset:
    - 0.005
    - 0.0
    - 0.0
    strategy: offset_target
  subtask_id: insert_subtask
  target:
    anchor: task_goal
    offset:
    - 0.0
    - 0.0
    - 0.0
    orientation:
      mode: keep_current
    source: yaml
    tolerance: 0.02
  termination: pose_tolerance
  type: insert
skill: peg_insert
subtasks:
- anchor: fixture
  id: approach_subtask
  metric: distance
  offset:
  - 0.0
  - 0.0
  - 0.055
  target_entity: tcp
  weight: 0.3
- anchor: goal
  id: insert_subtask
  metric: goal_progress
  target_entity: object
  weight: 0.7
