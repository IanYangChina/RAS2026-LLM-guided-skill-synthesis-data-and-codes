dsl_version: 2
phases:
- control: position_control
  generator: linear_cartesian
  id: approach_1
  orientation:
    mode: none
  parameters:
    speed:
      binds_to:
      - mode: scale
        path: generator.speed
      default: 0.08
      range:
      - 0.01
      - 0.2
      type: scalar
  subtask_id: pre_contact
  target:
    anchor: site
    entity: door_handle
    offset:
    - 0
    - 0.03
    - 0.1
    source: yaml
    tolerance: 0.01
  termination: pose_tolerance
  type: approach
- control: force_threshold_switch
  generator: linear_cartesian
  id: contact_1
  orientation:
    mode: none
  parameters:
    contact_force_threshold:
      binds_to:
      - mode: add
        path: termination.force_threshold
      default: 15.0
      range:
      - 5.0
      - 25.0
      type: scalar
  subtask_id: push_goal
  target:
    anchor: site
    entity: door_handle
    offset:
    - 0
    - 0.03
    - 0
    source: yaml
  termination: force_exceeded
  type: contact
- control: impedance_control
  generator: linear_cartesian
  guards:
  - id: force_limit
    on_failure: abort
    predicate: force_below
    threshold: 30.0
    when: during_phase
  id: push_1
  orientation:
    mode: none
  parameters:
    push_distance:
      binds_to:
      - mode: replace
        path: target.offset_along_axis.distance
      default: 0.15
      range:
      - 0.05
      - 0.3
      type: scalar
  retries:
    max_attempts: 2
    strategy: reduce_speed
  subtask_id: push_goal
  target:
    anchor: current_tcp
    offset:
    - 0
    - 0
    - 0
    offset_along_axis:
      axis: world_y
      distance: 0.15
      mode: replace_offset_projection
      sign: negative
    source: yaml
    tolerance: 0.01
  termination: pose_tolerance
  type: push
- control: position_control
  generator: linear_cartesian
  id: retract_1
  orientation:
    mode: none
  target:
    anchor: current_tcp
    offset:
    - 0
    - 0
    - 0.05
    source: yaml
    tolerance: 0.01
  termination: pose_tolerance
  type: retract
skill: door_push
skill_type: arm_gripper
subtasks:
- anchor: fixture
  id: pre_contact
  offset:
  - -0.4
  - 0.01
  - 0.45
  target_entity: tcp
  weight: 0.3
- anchor: fixture
  id: push_goal
  offset:
  - -0.4
  - -0.02
  - 0.35
  target_entity: tcp
  weight: 0.7
