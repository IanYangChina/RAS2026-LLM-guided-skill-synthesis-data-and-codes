dsl_version: 2
phases:
- control: position_control
  generator: linear_cartesian
  id: approach_to_above
  parameters:
    approach_height:
      binds_to:
      - mode: replace
        path: target.offset.z
      default: 0.085
      range:
      - 0.07
      - 0.1
      type: scalar
  subtask_id: above_entry
  target:
    anchor: fixture
    offset:
    - 0.0
    - 0.0
    - 0.085
    orientation:
      align_with: channel_axis
      axis:
      - 0
      - 0
      - 1
      mode: align_axis
      tolerance: 0.05
    source: yaml
    tolerance: 0.01
  termination: pose_tolerance
  type: approach
- control: position_control
  generator: linear_cartesian
  id: descend_to_entry
  parameters:
    descend_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.02
      range:
      - 0.005
      - 0.05
      type: scalar
  subtask_id: at_entry
  target:
    anchor: fixture
    offset:
    - 0.0
    - 0.0
    - 0.055
    orientation:
      align_with: channel_axis
      axis:
      - 0
      - 0
      - 1
      mode: align_axis
      tolerance: 0.02
    source: yaml
    tolerance: 0.005
  termination: pose_tolerance
  type: descend
- control: impedance_control
  generator: linear_cartesian
  guards:
  - args: {}
    id: force_guard
    on_failure: abort
    predicate: force_below
    threshold: 35.0
    when: during_phase
  id: insert_into_hole
  parameters:
    insertion_depth:
      binds_to:
      - mode: replace
        path: target.offset_along_axis.distance
      default: 0.045
      range:
      - 0.03
      - 0.055
      type: scalar
  subtask_id: inserted
  target:
    anchor: fixture
    offset:
    - 0.0
    - 0.0
    - 0.055
    offset_along_axis:
      axis: channel_axis
      distance: 0.045
      mode: add_to_offset
      sign: positive
    orientation:
      align_with: channel_axis
      axis:
      - 0
      - 0
      - 1
      mode: align_axis
      tolerance: 0.02
    source: yaml
    tolerance: 0.005
  termination: pose_tolerance
  type: insert
skill: peg_insert
skill_type: arm
subtasks:
- anchor: fixture
  id: above_entry
  metric: distance
  offset:
  - 0.0
  - 0.0
  - 0.085
  target_entity: tcp
  weight: 0.2
- anchor: fixture
  id: at_entry
  metric: distance
  offset:
  - 0.0
  - 0.0
  - 0.055
  target_entity: tcp
  weight: 0.3
- anchor: fixture
  id: inserted
  metric: goal_progress
  offset:
  - 0.0
  - 0.0
  - 0.01
  target_entity: tcp
  weight: 0.5
