dsl_version: 2
phases:
- control: position_control
  end_effector_action: null
  generator: arc_cartesian
  id: approach_to_socket
  orientation:
    align_with: channel_axis
    axis:
    - 0.0
    - 0.0
    - -1.0
    mode: align_axis
    tolerance: 0.1
  parameters:
    approach_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.2
      range:
      - 0.02
      - 0.5
      type: scalar
    arc_height:
      binds_to:
      - mode: replace
        path: generator.arc_height
      default: 0.02
      range:
      - 0.005
      - 0.1
      type: scalar
  retries: null
  subtask_id: reach_entry
  target:
    anchor: fixture
    entity: peg_socket
    offset:
    - 0.0
    - 0.0
    - 0.083
    orientation: null
    tolerance: 0.005
  termination: pose_tolerance
  type: approach
- control: impedance_control
  end_effector_action: null
  generator: linear_cartesian
  id: descend_to_entry
  orientation:
    align_with: channel_axis
    axis:
    - 0.0
    - 0.0
    - -1.0
    mode: align_axis
    tolerance: 0.05
  parameters:
    descend_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.05
      range:
      - 0.01
      - 0.2
      type: scalar
  retries: null
  subtask_id: reach_entry
  target:
    anchor: fixture
    entity: peg_socket
    offset:
    - 0.0
    - 0.0
    - 0.055
    orientation: null
    tolerance: 0.005
  termination: pose_tolerance
  type: descend
- control: impedance_control
  end_effector_action: null
  generator: linear_cartesian
  id: insert_peg
  orientation:
    align_with: channel_axis
    axis:
    - 0.0
    - 0.0
    - -1.0
    mode: align_axis
    tolerance: 0.05
  parameters:
    insert_depth:
      binds_to:
      - mode: replace
        path: target.offset_along_axis.distance
      default: 0.04
      range:
      - 0.01
      - 0.08
      type: scalar
    insert_force_threshold:
      binds_to:
      - mode: replace
        path: termination.force_threshold
      default: 30.0
      range:
      - 10.0
      - 45.0
      type: scalar
    insert_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.04
      range:
      - 0.01
      - 0.15
      type: scalar
  retries:
    max_attempts: 2
    offset:
    - 0.005
    - 0.0
    - 0.0
    strategy: offset_target
  subtask_id: insertion
  target:
    anchor: fixture
    entity: peg_socket
    offset:
    - 0.0
    - 0.0
    - 0.055
    offset_along_axis:
      axis: channel_axis
      distance: 0.04
      mode: add_to_offset
      sign: negative
    orientation: null
    tolerance: 0.01
  termination: force_exceeded
  type: insert
- control: position_control
  end_effector_action: null
  generator: arc_cartesian
  id: retract_from_hole
  orientation:
    mode: keep_current
  parameters:
    retract_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.1
      range:
      - 0.02
      - 0.3
      type: scalar
  retries: null
  target:
    anchor: fixture
    entity: peg_socket
    offset:
    - 0.0
    - 0.0
    - 0.083
    orientation: null
    tolerance: 0.005
  termination: pose_tolerance
  type: retract
skill: peg_insert
subtasks:
- anchor: goal
  id: reach_entry
  metric: distance
  offset:
  - 0.0
  - 0.0
  - 0.055
  target_entity: tcp
  weight: 0.3
- anchor: goal
  id: insertion
  metric: goal_progress
  offset:
  - 0.0
  - 0.0
  - 0.0
  target_entity: object
  weight: 0.7
