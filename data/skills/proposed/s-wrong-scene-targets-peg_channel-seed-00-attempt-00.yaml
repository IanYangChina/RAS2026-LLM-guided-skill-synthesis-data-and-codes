dsl_version: 2
phases:
- control: position_control
  generator: linear_cartesian
  guards:
  - args: {}
    id: force_check
    on_failure: continue
    predicate: force_below
    threshold: 30.0
    when: during_phase
  id: approach_peg
  parameters:
    approach_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.1
      range:
      - 0.05
      - 0.2
      type: scalar
  retries:
    max_attempts: 1
    strategy: reduce_speed
  subtask_id: reach_peg
  target:
    anchor: task_object
    entity: peg
    offset:
    - 0.0
    - 0.0
    - 0.1
    orientation:
      mode: keep_current
    source: yaml
    tolerance: 0.02
  termination: pose_tolerance
  type: approach
- control: impedance_control
  generator: linear_cartesian
  guards:
  - args: {}
    id: force_limit
    on_failure: continue
    predicate: force_below
    threshold: 40.0
    when: during_phase
  id: push_through_channel
  parameters:
    push_distance:
      binds_to:
      - mode: replace
        path: target.offset_along_axis.distance
      default: 0.16
      range:
      - 0.12
      - 0.2
      type: scalar
    push_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.04
      range:
      - 0.01
      - 0.08
      type: scalar
  subtask_id: push_channel
  target:
    anchor: task_object
    entity: peg
    offset:
    - 0.0
    - 0.0
    - 0.0
    offset_along_axis:
      axis: channel_axis
      distance: 0.16
      mode: replace_offset_projection
      sign: positive
    orientation:
      mode: keep_current
    source: yaml
    tolerance: 0.015
  termination: pose_tolerance
  type: push
skill: peg_channel
skill_type: arm
subtasks:
- anchor: object
  id: reach_peg
  offset:
  - 0.0
  - 0.0
  - 0.1
  target_entity: tcp
  weight: 0.3
- anchor: object
  id: push_channel
  metric: goal_progress
  offset:
  - 0.0
  - -0.16
  - 0.0
  target_entity: object
  weight: 0.7
