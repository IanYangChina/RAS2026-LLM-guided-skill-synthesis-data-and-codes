dsl_version: 2
phases:
- control: position_control
  generator: linear_cartesian
  id: approach_socket
  parameters:
    approach_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.05
      range:
      - 0.01
      - 0.1
      type: scalar
  subtask_id: approach_task
  target:
    anchor: task_goal
    offset:
    - 0.0
    - 0.0
    - 0.1
    orientation:
      mode: keep_current
    tolerance: 0.01
  termination: pose_tolerance
  type: approach
- control: position_control
  generator: linear_cartesian
  id: align_hole
  parameters:
    lateral_offset_x:
      binds_to:
      - mode: add
        path: target.offset.x
      default: 0.0
      range:
      - -0.02
      - 0.02
      type: scalar
    lateral_offset_y:
      binds_to:
      - mode: add
        path: target.offset.y
      default: 0.0
      range:
      - -0.02
      - 0.02
      type: scalar
  subtask_id: align_task
  target:
    anchor: task_goal
    offset:
    - 0.0
    - 0.0
    - 0.0
    orientation:
      mode: keep_current
    tolerance: 0.01
  termination: pose_tolerance
  type: align
- control: impedance_control
  generator: impedance_motion
  id: insert_peg
  parameters:
    insertion_depth:
      binds_to:
      - mode: replace
        path: target.offset_along_axis.distance
      default: 0.055
      range:
      - 0.01
      - 0.1
      type: scalar
    insertion_force:
      binds_to:
      - mode: replace
        path: termination.force_threshold
      default: 10.0
      range:
      - 1.0
      - 20.0
      type: scalar
  subtask_id: insert_task
  target:
    anchor: task_goal
    offset:
    - 0.0
    - 0.0
    - 0.0
    offset_along_axis:
      axis: insertion_axis
      distance: 0.055
      mode: replace_offset_projection
      sign: positive
    orientation:
      align_with: insertion_axis
      axis:
      - 0.0
      - 0.0
      - 1.0
      mode: align_axis
      tolerance: 0.05
  termination: force_exceeded
  type: insert
skill: peg_insert
skill_type: arm_gripper
subtasks:
- anchor: fixture
  id: approach_task
  metric: distance
  offset:
  - 0.0
  - 0.0
  - 0.1
  target_entity: tcp
  weight: 0.3
- anchor: fixture
  id: align_task
  metric: distance
  offset:
  - 0.0
  - 0.0
  - 0.0
  target_entity: tcp
  weight: 0.3
- anchor: fixture
  id: insert_task
  metric: distance
  offset:
  - 0.0
  - 0.0
  - -0.055
  target_entity: tcp
  weight: 0.4
