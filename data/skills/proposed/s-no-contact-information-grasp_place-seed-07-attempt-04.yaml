dsl_version: 2
phases:
- control: position_control
  generator: linear_cartesian
  id: approach_above_object
  parameters:
    approach_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.05
      range:
      - 0.01
      - 0.1
      type: scalar
  subtask_id: reach_object
  target:
    anchor: task_object
    offset:
    - 0.0
    - 0.0
    - 0.15
    orientation:
      mode: keep_current
  termination: pose_tolerance
  type: approach
- control: force_threshold_switch
  generator: linear_cartesian
  id: descend_to_object
  parameters:
    descend_force_threshold:
      binds_to:
      - mode: replace
        path: termination.force_threshold
      default: 4.0
      range:
      - 1.0
      - 10.0
      type: scalar
  subtask_id: reach_object
  target:
    anchor: task_object
    offset:
    - 0.0
    - 0.0
    - 0.03
    orientation:
      mode: keep_current
  termination: force_exceeded
  type: descend
- control: position_control
  end_effector_action: force_grasp
  generator: null
  guards:
  - args: {}
    id: check_grasp
    on_failure: retry
    predicate: bilateral_grasp
    threshold: 0.5
    when: after_phase
  id: grasp_object
  parameters:
    grasp_duration:
      binds_to:
      - mode: replace
        path: duration.max_time
      default: 1.0
      range:
      - 0.5
      - 2.0
      type: scalar
  retries:
    max_attempts: 2
    offset:
    - 0.0
    - 0.0
    - -0.005
    strategy: offset_target
  target:
    anchor: current_tcp
    offset:
    - 0.0
    - 0.0
    - 0.0
    orientation:
      mode: none
  termination: time_limit
  type: grasp
- control: position_control
  generator: linear_cartesian
  id: lift_object
  parameters:
    lift_height:
      binds_to:
      - mode: replace
        path: target.offset.z
      - mode: replace
        path: target.offset_along_axis.distance
      default: 0.15
      range:
      - 0.05
      - 0.2
      type: scalar
  subtask_id: reach_object
  target:
    anchor: task_object
    offset:
    - 0.0
    - 0.0
    - 0.15
    offset_along_axis:
      axis: world_z
      distance: 0.12
      mode: add_to_offset
      sign: positive
    orientation:
      mode: keep_current
  termination: pose_tolerance
  type: lift
- control: position_control
  generator: linear_cartesian
  id: approach_to_goal
  parameters:
    lateral_offset_x:
      binds_to:
      - mode: add
        path: target.offset.x
      default: 0.0
      range:
      - -0.02
      - 0.02
      type: scalar
    lateral_offset_y:
      binds_to:
      - mode: add
        path: target.offset.y
      default: 0.0
      range:
      - -0.02
      - 0.02
      type: scalar
    transport_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.05
      range:
      - 0.01
      - 0.1
      type: scalar
  subtask_id: approach_goal
  target:
    anchor: task_goal
    offset:
    - 0.0
    - 0.0
    - 0.12
    orientation:
      mode: keep_current
  termination: pose_tolerance
  type: approach
- control: force_threshold_switch
  generator: linear_cartesian
  id: descend_to_goal
  parameters:
    place_z_offset:
      binds_to:
      - mode: replace
        path: target.offset.z
      default: 0.01
      range:
      - -0.02
      - 0.04
      type: scalar
  subtask_id: place_goal
  target:
    anchor: task_goal
    offset:
    - 0.0
    - 0.0
    - 0.0
    orientation:
      mode: keep_current
  termination: force_exceeded
  type: descend
- control: position_control
  end_effector_action: open
  generator: null
  id: release_object
  parameters:
    release_duration:
      binds_to:
      - mode: replace
        path: duration.max_time
      default: 1.0
      range:
      - 0.5
      - 2.0
      type: scalar
  target:
    anchor: current_tcp
    offset:
    - 0.0
    - 0.0
    - 0.0
    orientation:
      mode: none
  termination: time_limit
  type: release
- control: position_control
  generator: linear_cartesian
  id: retract_from_goal
  target:
    anchor: task_goal
    offset:
    - 0.0
    - 0.0
    - 0.2
    orientation:
      mode: keep_current
  termination: pose_tolerance
  type: retract
skill: grasp_place
skill_type: arm_gripper
subtasks:
- anchor: object
  id: reach_object
  metric: distance
  offset:
  - 0.0
  - 0.0
  - 0.15
  target_entity: tcp
  weight: 0.3
- anchor: goal
  id: approach_goal
  metric: distance
  offset:
  - 0.0
  - 0.0
  - 0.12
  target_entity: tcp
  weight: 0.3
- anchor: goal
  id: place_goal
  metric: goal_progress
  offset:
  - 0.0
  - 0.0
  - 0.0
  target_entity: object
  weight: 0.4
