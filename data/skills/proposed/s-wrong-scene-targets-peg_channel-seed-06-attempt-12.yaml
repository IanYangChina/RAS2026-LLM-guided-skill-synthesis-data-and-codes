dsl_version: 2
phases:
- control: position_control
  generator: linear_cartesian
  id: approach_peg
  parameters:
    approach_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.04
      range:
      - 0.02
      - 0.08
      type: scalar
    approach_tolerance:
      binds_to:
      - mode: replace
        path: termination.pose_tolerance
      default: 0.03
      range:
      - 0.01
      - 0.05
      type: scalar
  subtask_id: reach_peg
  target:
    anchor: task_object
    offset:
    - 0.0
    - 0.01
    - 0.02
    orientation:
      align_with: channel_axis
      axis:
      - 0.0
      - -1.0
      - 0.0
      mode: align_axis
      tolerance: 0.1
    source: yaml
  termination: pose_tolerance
  type: approach
- control: impedance_control
  generator: linear_cartesian
  id: contact_peg
  parameters:
    contact_tolerance:
      binds_to:
      - mode: replace
        path: termination.pose_tolerance
      default: 0.01
      range:
      - 0.005
      - 0.02
      type: scalar
  subtask_id: reach_peg
  target:
    anchor: task_object
    offset:
    - 0.0
    - 0.005
    - 0.0
    orientation:
      align_with: channel_axis
      axis:
      - 0.0
      - -1.0
      - 0.0
      mode: align_axis
      tolerance: 0.1
    source: yaml
  termination: pose_tolerance
  type: contact
- control: impedance_control
  generator: linear_cartesian
  id: push_through_channel
  parameters:
    push_distance:
      binds_to:
      - mode: replace
        path: target.offset_along_axis.distance
      default: 0.25
      range:
      - 0.15
      - 0.3
      type: scalar
    push_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.03
      range:
      - 0.01
      - 0.06
      type: scalar
    push_time:
      binds_to:
      - mode: replace
        path: duration.max_time
      default: 5.0
      range:
      - 3.0
      - 7.0
      type: scalar
  retries:
    max_attempts: 2
    offset:
    - 0.02
    - 0.01
    - 0.0
    strategy: offset_target
  subtask_id: insert_peg
  target:
    anchor: current_tcp
    offset:
    - 0.0
    - 0.0
    - 0.0
    offset_along_axis:
      axis: channel_axis
      distance: 0.25
      mode: add_to_offset
      sign: positive
    orientation:
      mode: keep_current
    source: yaml
  termination: time_limit
  type: push
skill: peg_channel
subtasks:
- anchor: object
  id: reach_peg
  offset:
  - 0.0
  - 0.01
  - 0.02
  weight: 0.3
- anchor: fixture
  id: insert_peg
  metric: goal_progress
  offset:
  - 0.0
  - -0.16
  - 0.0
  weight: 0.7
