dsl_version: 2
phases:
- control: position_control
  generator: linear_cartesian
  id: approach_precontact
  orientation:
    mode: keep_current
  parameters:
    approach_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.05
      range:
      - 0.01
      - 0.1
      type: scalar
    pre_push_offset_x:
      binds_to:
      - mode: add
        path: target.offset.x
      default: 0.05
      range:
      - -0.05
      - 0.2
      type: scalar
    pre_push_offset_y:
      binds_to:
      - mode: add
        path: target.offset.y
      default: 0.1
      range:
      - -0.05
      - 0.2
      type: scalar
  subtask_id: reach_pre_contact
  target:
    anchor: task_object
    entity: push_box
    offset:
    - 0.05
    - 0.1
    - 0.0
    source: yaml
  termination: pose_tolerance
  type: approach
- control: admittance_control
  generator: linear_cartesian
  id: push_to_goal
  orientation:
    mode: keep_current
  parameters:
    push_distance:
      binds_to:
      - mode: replace
        path: target.offset_along_axis.distance
      default: 0.2
      range:
      - 0.1
      - 0.3
      type: scalar
    push_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.05
      range:
      - 0.01
      - 0.1
      type: scalar
  subtask_id: reach_goal
  target:
    anchor: current_tcp
    offset:
    - 0.0
    - 0.0
    - 0.0
    offset_along_axis:
      axis: push_direction
      distance: 0.2
      mode: add_to_offset
      sign: positive
    source: yaml
  termination: time_limit
  type: push
skill: push_to_goal
skill_type: arm_gripper
subtasks:
- anchor: object
  id: reach_pre_contact
  metric: distance
  offset:
  - 0.05
  - 0.1
  - 0.0
  target_entity: tcp
  weight: 0.3
- anchor: goal
  id: reach_goal
  metric: goal_progress
  target_entity: object
  weight: 1.0
