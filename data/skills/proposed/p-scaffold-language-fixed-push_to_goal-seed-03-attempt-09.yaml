dsl_version: 2
phases:
- control: position_control
  generator: linear_cartesian
  id: approach
  parameters:
    approach_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.08
      range:
      - 0.02
      - 0.15
      type: scalar
    approach_tolerance:
      binds_to:
      - mode: replace
        path: termination.pose_tolerance
      default: 0.02
      range:
      - 0.005
      - 0.05
      type: scalar
  subtask_id: approach
  target:
    anchor: task_object
    offset:
    - 0
    - 0.08
    - 0.15
    orientation:
      mode: keep_current
    source: yaml
    tolerance: 0.02
  termination: pose_tolerance
  type: approach
- control: impedance_control
  generator: linear_cartesian
  id: descend
  parameters:
    contact_force_threshold:
      binds_to:
      - mode: replace
        path: termination.force_threshold
      default: 8
      range:
      - 3
      - 15
      type: scalar
    descend_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.02
      range:
      - 0.005
      - 0.05
      type: scalar
  subtask_id: contact
  target:
    anchor: task_object
    offset:
    - 0
    - 0.03
    - 0.025
    orientation:
      mode: keep_current
    source: yaml
  termination: force_exceeded
  type: descend
- control: admittance_control
  generator: linear_cartesian
  guards:
  - id: push_force_guard
    on_failure: retry
    predicate: force_below
    threshold: 20
    when: during_phase
  id: push
  parameters:
    force_guard_threshold:
      binds_to:
      - mode: replace
        path: guards.push_force_guard.threshold
      default: 20
      range:
      - 15
      - 25
      type: scalar
    push_depth:
      binds_to:
      - mode: replace
        path: target.offset_along_axis.distance
      default: 0.12
      range:
      - 0.03
      - 0.25
      type: scalar
    push_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.02
      range:
      - 0.005
      - 0.05
      type: scalar
    push_tolerance:
      binds_to:
      - mode: replace
        path: termination.pose_tolerance
      default: 0.02
      range:
      - 0.01
      - 0.05
      type: scalar
  retries:
    max_attempts: 2
    strategy: reduce_speed
  subtask_id: push
  target:
    anchor: task_goal
    offset:
    - 0
    - 0.03
    - 0
    offset_along_axis:
      axis: task_goal_direction
      distance: 0.1
      mode: add_to_offset
      sign: positive
    orientation:
      align_with: task_goal_direction
      axis:
      - 1
      - 0
      - 0
      mode: align_axis
      tolerance: 0.1
    source: yaml
    tolerance: 0.02
  termination: pose_tolerance
  type: push
- control: position_control
  generator: linear_cartesian
  id: retract
  parameters:
    retract_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.08
      range:
      - 0.02
      - 0.15
      type: scalar
    retract_tolerance:
      binds_to:
      - mode: replace
        path: termination.pose_tolerance
      default: 0.02
      range:
      - 0.01
      - 0.05
      type: scalar
  target:
    anchor: task_goal
    offset:
    - 0
    - 0.03
    - 0.15
    orientation:
      mode: none
    source: yaml
    tolerance: 0.02
  termination: pose_tolerance
  type: retract
skill: push_to_goal
skill_type: arm
