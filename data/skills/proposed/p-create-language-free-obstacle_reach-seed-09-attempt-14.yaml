dsl_version: 2
phases:
- control: position_control
  generator: linear_cartesian
  id: approach_1
  parameters:
    approach_height:
      binds_to:
      - mode: replace
        path: target.offset.z
      default: 0.25
      range:
      - 0.15
      - 0.35
      type: scalar
    approach_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.04
      range:
      - 0.02
      - 0.06
      type: scalar
  target:
    anchor: task_goal
    offset:
    - 0.0
    - 0.0
    - 0.25
    orientation:
      mode: keep_current
    source: yaml
    tolerance: 0.05
  termination: pose_tolerance
  type: approach
- control: position_control
  generator: linear_cartesian
  id: descend_1
  parameters:
    descent_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.015
      range:
      - 0.005
      - 0.03
      type: scalar
  target:
    anchor: task_goal
    offset:
    - 0.0
    - 0.0
    - 0.03
    orientation:
      mode: keep_current
    source: yaml
    tolerance: 0.02
  termination: pose_tolerance
  type: descend
- control: impedance_control
  generator: linear_cartesian
  id: descend_2
  parameters:
    fine_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.008
      range:
      - 0.003
      - 0.015
      type: scalar
  subtask_id: reach_goal
  target:
    anchor: task_goal
    offset:
    - 0.0
    - 0.0
    - 0.0
    orientation:
      mode: keep_current
    source: yaml
    tolerance: 0.015
  termination: pose_tolerance
  type: descend
skill: obstacle_reach
subtasks:
- id: reach_goal
