dsl_version: 2
phases:
- control: position_control
  generator: linear_cartesian
  id: approach_peg
  parameters:
    approach_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.05
      range:
      - 0.02
      - 0.1
      type: scalar
  subtask_id: above_peg
  target:
    anchor: task_object
    offset:
    - 0.0
    - 0.0
    - 0.12
    orientation:
      mode: keep_current
    source: yaml
    tolerance: 0.02
  termination: pose_tolerance
  type: approach
- control: position_control
  end_effector_action: force_grasp
  generator: null
  id: grasp_peg
  target:
    anchor: current_tcp
    offset:
    - 0.0
    - 0.0
    - 0.0
    source: yaml
  termination: grasp_success
  type: grasp
- control: impedance_control
  generator: linear_cartesian
  id: lift_peg
  parameters:
    lift_height:
      binds_to:
      - mode: replace
        path: target.offset.z
      default: 0.08
      range:
      - 0.05
      - 0.15
      type: scalar
  target:
    anchor: current_tcp
    offset:
    - 0.0
    - 0.0
    - 0.08
    orientation:
      mode: keep_current
    source: yaml
    tolerance: 0.02
  termination: pose_tolerance
  type: lift
- control: position_control
  generator: linear_cartesian
  id: approach_hole
  parameters:
    approach_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.05
      range:
      - 0.02
      - 0.1
      type: scalar
  subtask_id: above_hole
  target:
    anchor: task_goal
    offset:
    - 0.0
    - 0.0
    - 0.1
    orientation:
      align_with: world_z
      axis:
      - 0
      - 0
      - 1
      mode: align_axis
    source: yaml
    tolerance: 0.02
  termination: pose_tolerance
  type: approach
- control: position_control
  generator: linear_cartesian
  id: align_hole
  parameters:
    lateral_offset_x:
      binds_to:
      - mode: add
        path: target.offset.x
      default: 0.0
      range:
      - -0.015
      - 0.015
      type: scalar
    lateral_offset_y:
      binds_to:
      - mode: add
        path: target.offset.y
      default: 0.0
      range:
      - -0.015
      - 0.015
      type: scalar
  subtask_id: above_hole
  target:
    anchor: task_goal
    offset:
    - 0.0
    - 0.0
    - 0.05
    orientation:
      align_with: world_z
      axis:
      - 0
      - 0
      - 1
      mode: align_axis
      tolerance: 0.05
    source: yaml
    tolerance: 0.01
  termination: pose_tolerance
  type: align
- control: impedance_control
  generator: impedance_motion
  guards:
  - args: {}
    id: max_insertion_force
    on_failure: abort
    predicate: force_below
    threshold: 40.0
    when: during_phase
  id: insert_peg
  parameters:
    insertion_depth:
      binds_to:
      - mode: replace
        path: target.offset_along_axis.distance
      default: 0.08
      range:
      - 0.03
      - 0.12
      type: scalar
    insertion_force_threshold:
      binds_to:
      - mode: replace
        path: termination.force_threshold
      default: 15.0
      range:
      - 5.0
      - 30.0
      type: scalar
  retries:
    max_attempts: 2
    offset:
    - 0.005
    - 0.005
    - 0.0
    strategy: offset_target
  subtask_id: inserted
  target:
    anchor: task_goal
    offset:
    - 0.0
    - 0.0
    - 0.0
    offset_along_axis:
      axis: world_z
      distance: 0.08
      mode: replace_offset_projection
      sign: negative
    orientation:
      align_with: world_z
      axis:
      - 0
      - 0
      - 1
      mode: align_axis
      tolerance: 0.05
    source: yaml
    tolerance: 0.02
  termination: force_exceeded
  type: insert
- control: position_control
  end_effector_action: open
  generator: null
  id: release_peg
  parameters:
    release_duration:
      binds_to:
      - mode: replace
        path: duration.max_time
      default: 0.5
      range:
      - 0.2
      - 1.0
      type: scalar
  target:
    anchor: current_tcp
    offset:
    - 0.0
    - 0.0
    - 0.0
    source: yaml
  termination: time_limit
  type: release
skill: peg_insert
skill_type: arm_gripper
subtasks:
- anchor: object
  id: above_peg
  metric: distance
  offset:
  - 0.0
  - 0.0
  - 0.12
  target_entity: tcp
  weight: 0.2
- anchor: goal
  id: above_hole
  metric: distance
  offset:
  - 0.0
  - 0.0
  - 0.1
  target_entity: tcp
  weight: 0.3
- anchor: goal
  id: inserted
  metric: distance
  offset:
  - 0.0
  - 0.0
  - 0.0
  target_entity: tcp
  weight: 0.5
