dsl_version: 2
phases:
- control: position_control
  duration:
    max_time: 1.0
  generator: linear_cartesian
  id: approach_side
  parameters:
    approach_max_time:
      binds_to:
      - mode: replace
        path: duration.max_time
      default: 1.0
      range:
      - 0.5
      - 3.0
      type: scalar
    approach_offset_x:
      binds_to:
      - mode: add
        path: target.offset.x
      default: 0.0
      range:
      - -0.03
      - 0.03
      type: scalar
    approach_offset_y:
      binds_to:
      - mode: add
        path: target.offset.y
      default: 0.025
      range:
      - 0.0
      - 0.05
      type: scalar
    approach_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.5
      range:
      - 0.1
      - 1.0
      type: scalar
  subtask_id: approach_side
  target:
    anchor: task_object
    offset:
    - 0.0
    - 0.025
    - 0.025
    orientation:
      mode: none
    source: yaml
  termination: time_limit
  type: approach
- control: impedance_control
  duration:
    max_time: 3.0
  generator: linear_cartesian
  guards:
  - args: {}
    id: force_limit
    on_failure: abort
    predicate: force_below
    threshold: 25.0
    when: during_phase
  - args: {}
    id: goal_reached
    on_failure: abort
    predicate: object_progress
    threshold: 0.95
    when: during_phase
  id: push_toward_goal
  parameters:
    force_threshold:
      binds_to:
      - mode: replace
        path: guards.force_limit.threshold
      default: 25.0
      range:
      - 15.0
      - 30.0
      type: scalar
    goal_progress_threshold:
      binds_to:
      - mode: replace
        path: guards.goal_reached.threshold
      default: 0.95
      range:
      - 0.8
      - 0.99
      type: scalar
    push_distance:
      binds_to:
      - mode: replace
        path: target.offset_along_axis.distance
      default: 0.15
      range:
      - 0.05
      - 0.25
      type: scalar
    push_max_time:
      binds_to:
      - mode: replace
        path: duration.max_time
      default: 3.0
      range:
      - 1.0
      - 5.0
      type: scalar
    push_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.2
      range:
      - 0.05
      - 0.5
      type: scalar
  retries:
    max_attempts: 0
  subtask_id: goal_progress
  target:
    anchor: task_object
    offset:
    - 0.0
    - 0.025
    - 0.025
    offset_along_axis:
      axis: task_goal_direction
      distance: 0.15
      mode: replace_offset_projection
      sign: positive
    orientation:
      mode: none
    source: yaml
  termination: time_limit
  type: push
skill: push_to_goal
subtasks:
- anchor: object
  id: approach_side
  metric: distance
  offset:
  - 0.0
  - 0.025
  - 0.025
  target_entity: tcp
  weight: 0.3
- anchor: goal
  id: goal_progress
  metric: goal_progress
  offset:
  - 0.0
  - 0.0
  - 0.0
  target_entity: tcp
  weight: 0.7
