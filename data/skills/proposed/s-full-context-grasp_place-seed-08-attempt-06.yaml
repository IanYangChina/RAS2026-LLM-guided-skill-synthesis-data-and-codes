dsl_version: 2
phases:
- control: position_control
  generator: linear_cartesian
  id: approach_obj
  parameters:
    pre_grasp_z_offset:
      binds_to:
      - mode: replace
        path: target.offset.z
      default: 0.12
      range:
      - 0.05
      - 0.2
      type: scalar
  subtask_id: approach_subtask
  target:
    anchor: task_object
    offset:
    - 0.0
    - 0.0
    - 0.12
    source: yaml
    tolerance: 0.02
  termination: pose_tolerance
  type: approach
- control: impedance_control
  generator: linear_cartesian
  id: descend_grasp
  parameters:
    contact_force_threshold:
      binds_to:
      - mode: replace
        path: termination.force_threshold
      default: 8.0
      range:
      - 5.0
      - 20.0
      type: scalar
    grasp_z_offset:
      binds_to:
      - mode: replace
        path: target.offset.z
      default: 0.02
      range:
      - 0.0
      - 0.06
      type: scalar
  target:
    anchor: task_object
    offset:
    - 0.0
    - 0.0
    - 0.02
    orientation:
      align_with: world_z
      axis:
      - 0.0
      - 0.0
      - 1.0
      mode: align_axis
      tolerance: 0.05
    source: yaml
    tolerance: 0.01
  termination: force_exceeded
  type: descend
- control: position_control
  end_effector_action: force_grasp
  guards:
  - id: check_grasp
    on_failure: retry
    predicate: bilateral_grasp
    threshold: 1.0
    when: after_phase
  id: grasp_phase
  parameters:
    grasp_time:
      binds_to:
      - mode: replace
        path: duration.max_time
      default: 0.6
      range:
      - 0.3
      - 1.5
      type: scalar
  retries:
    max_attempts: 2
    offset:
    - 0.005
    - 0.005
    - 0.0
    strategy: offset_target
  target:
    anchor: current_tcp
    offset:
    - 0.0
    - 0.0
    - 0.0
    source: yaml
    tolerance: 0.02
  termination: time_limit
  type: grasp
- control: position_control
  generator: linear_cartesian
  id: lift_obj
  parameters:
    lift_z_offset:
      binds_to:
      - mode: replace
        path: target.offset.z
      default: 0.15
      range:
      - 0.08
      - 0.25
      type: scalar
  target:
    anchor: task_object
    offset:
    - 0.0
    - 0.0
    - 0.0
    source: yaml
    tolerance: 0.02
  termination: pose_tolerance
  type: lift
- control: position_control
  generator: linear_cartesian
  id: approach_goal
  parameters:
    approach_goal_z_offset:
      binds_to:
      - mode: replace
        path: target.offset.z
      default: 0.1
      range:
      - 0.05
      - 0.2
      type: scalar
  target:
    anchor: task_goal
    offset:
    - 0.0
    - 0.0
    - 0.1
    source: yaml
    tolerance: 0.02
  termination: pose_tolerance
  type: approach
- control: position_control
  generator: linear_cartesian
  id: descend_place
  parameters:
    place_z_offset:
      binds_to:
      - mode: replace
        path: target.offset.z
      default: -0.01
      range:
      - -0.03
      - 0.02
      type: scalar
  subtask_id: place_subtask
  target:
    anchor: task_goal
    offset:
    - 0.0
    - 0.0
    - 0.0
    source: yaml
    tolerance: 0.02
  termination: pose_tolerance
  type: descend
skill: grasp_place
skill_type: arm_gripper
subtasks:
- anchor: object
  id: approach_subtask
  offset:
  - 0.0
  - 0.0
  - 0.12
  weight: 0.2
- anchor: goal
  id: place_subtask
  offset:
  - 0.0
  - 0.0
  - 0.0
  target_entity: object
  weight: 0.8
