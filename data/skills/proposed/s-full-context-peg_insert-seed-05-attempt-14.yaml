dsl_version: 2
phases:
- control: position_control
  generator: linear_cartesian
  id: approach
  parameters:
    speed:
      binds_to:
      - mode: add
        path: generator.speed
      default: 0.05
      range:
      - 0.01
      - 0.1
      type: scalar
    tolerance:
      binds_to:
      - mode: add
        path: termination.pose_tolerance
      default: 0.01
      range:
      - 0.001
      - 0.02
      type: scalar
  subtask_id: reach_entry
  target:
    anchor: fixture
    offset:
    - 0
    - 0
    - 0.055
  termination: pose_tolerance
  type: approach
- control: impedance_control
  generator: linear_cartesian
  guards:
  - args: {}
    id: force_limit
    on_failure: retry
    predicate: force_below
    threshold: 40.0
    when: during_phase
  id: insert
  parameters:
    force_threshold:
      binds_to:
      - mode: add
        path: guards.force_limit.threshold
      default: 40
      range:
      - 10
      - 40
      type: scalar
    speed:
      binds_to:
      - mode: add
        path: generator.speed
      default: 0.02
      range:
      - 0.005
      - 0.05
      type: scalar
    tolerance:
      binds_to:
      - mode: add
        path: termination.pose_tolerance
      default: 0.01
      range:
      - 0.001
      - 0.02
      type: scalar
  retries:
    max_attempts: 2
    offset:
    - 0.005
    - 0
    - 0
    strategy: offset_target
  subtask_id: final_insert
  target:
    anchor: fixture
    offset:
    - 0
    - 0
    - 0.055
    orientation:
      align_with: insertion_axis
      axis:
      - 0
      - 0
      - 1
      mode: align_axis
      tolerance: 0.05
  termination: pose_tolerance
  type: insert
- control: position_control
  generator: linear_cartesian
  id: retract
  parameters:
    speed:
      binds_to:
      - mode: add
        path: generator.speed
      default: 0.05
      range:
      - 0.01
      - 0.1
      type: scalar
  target:
    anchor: fixture
    offset:
    - 0
    - 0
    - 0.1
  termination: pose_tolerance
  type: retract
skill: peg_insert
skill_type: arm
subtasks:
- anchor: fixture
  id: reach_entry
  metric: distance
  offset:
  - 0
  - 0
  - 0.055
  target_entity: tcp
  weight: 0.5
- anchor: fixture
  id: final_insert
  metric: distance
  offset:
  - 0
  - 0
  - 0.055
  target_entity: tcp
  weight: 0.5
