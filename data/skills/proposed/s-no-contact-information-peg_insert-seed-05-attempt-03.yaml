dsl_version: 2
phases:
- control: position_control
  generator: linear_cartesian
  id: push_1
  parameters:
    push_depth:
      binds_to:
      - mode: replace
        path: termination.pose_tolerance
      default: 0.05
      range:
      - 0.01
      - 0.1
      type: scalar
  retries:
    max_attempts: 2
    offset:
    - 0
    - 0
    - -0.005
    strategy: offset_target
  subtask_id: reach_entry
  target:
    anchor: task_goal
    entity: null
    offset:
    - 0
    - 0
    - 0
    orientation:
      align_with: insertion_axis
      axis:
      - 0
      - 0
      - -1
      mode: align_axis
      tolerance: 0.1
    source: yaml
    tolerance: 0.02
  termination: pose_tolerance
  type: push
- control: position_control
  end_effector_action: open
  id: release_1
  target:
    anchor: current_tcp
    entity: null
    offset:
    - 0
    - 0
    - 0
    source: yaml
    tolerance: 0.01
  termination: pose_tolerance
  type: release
- control: impedance_control
  generator: arc_cartesian
  id: pull_1
  parameters:
    pull_distance:
      binds_to:
      - mode: replace
        path: target.offset.z
      default: 0.1
      range:
      - 0.02
      - 0.2
      type: scalar
  subtask_id: reach_entry
  target:
    anchor: task_goal
    entity: null
    offset:
    - 0
    - 0
    - 0.15
    source: yaml
    tolerance: 0.02
  termination: pose_tolerance
  type: pull
- control: admittance_control
  end_effector_action: open
  generator: linear_cartesian
  id: release_2
  target:
    anchor: task_goal
    entity: null
    offset:
    - 0
    - 0
    - 0
    source: yaml
    tolerance: 0.02
  termination: pose_tolerance
  type: release
- control: position_control
  end_effector_action: open
  generator: linear_cartesian
  id: release_3
  target:
    anchor: current_tcp
    entity: null
    offset:
    - 0
    - 0
    - 0
    source: yaml
    tolerance: 0.005
  termination: pose_tolerance
  type: release
- control: position_control
  end_effector_action: force_grasp
  id: grasp_1
  target:
    anchor: current_tcp
    entity: null
    offset:
    - 0
    - 0
    - 0
    source: yaml
    tolerance: 0.005
  termination: pose_tolerance
  type: grasp
- control: position_control
  generator: linear_cartesian
  id: retract_1
  parameters:
    speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.05
      range:
      - 0.01
      - 0.1
      type: scalar
  target:
    anchor: task_goal
    entity: null
    offset:
    - 0
    - 0
    - 0.2
    source: yaml
    tolerance: 0.02
  termination: pose_tolerance
  type: retract
skill: peg_insert
skill_type: arm
subtasks:
- anchor: fixture
  id: reach_entry
  metric: distance
  offset:
  - 0
  - 0
  - 0.055
  target_entity: tcp
  weight: 0.3
- anchor: fixture
  id: insert_goal
  metric: distance
  offset:
  - 0
  - 0
  - 0
  target_entity: object
  weight: 0.7
