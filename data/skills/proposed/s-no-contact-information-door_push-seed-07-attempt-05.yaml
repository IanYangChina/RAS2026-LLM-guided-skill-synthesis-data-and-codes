dsl_version: 2
phases:
- control: position_control
  generator: linear_cartesian
  id: approach_handle
  parameters:
    speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.05
      range:
      - 0.01
      - 0.1
      type: scalar
  subtask_id: reach_handle
  target:
    anchor: site
    entity: door_handle
    offset:
    - 0.0
    - 0.0
    - 0.0
    orientation:
      mode: keep_current
    source: yaml
    tolerance: 0.01
  termination: pose_tolerance
  type: approach
- control: impedance_control
  generator: linear_cartesian
  guards:
  - id: hinge_progress
    on_failure: continue
    predicate: hinge_delta_reached
    threshold: 0.5
    when: during_phase
  - id: max_force
    on_failure: abort
    predicate: force_below
    threshold: 28.0
    when: during_phase
  id: push_door
  parameters:
    hinge_target:
      binds_to:
      - mode: replace
        path: guards.hinge_progress.threshold
      default: 0.5
      range:
      - 0.4
      - 0.6
      type: scalar
    max_force_limit:
      binds_to:
      - mode: replace
        path: guards.max_force.threshold
      default: 28.0
      range:
      - 25.0
      - 30.0
      type: scalar
    push_distance:
      binds_to:
      - mode: replace
        path: target.offset_along_axis.distance
      default: 0.3
      range:
      - 0.1
      - 0.5
      type: scalar
    push_time:
      binds_to:
      - mode: replace
        path: termination.max_time
      default: 5.0
      range:
      - 2.0
      - 10.0
      type: scalar
  subtask_id: push_door
  target:
    anchor: site
    entity: door_handle
    offset:
    - 0.0
    - 0.0
    - 0.0
    offset_along_axis:
      axis: world_y
      distance: 0.3
      mode: add_to_offset
      sign: negative
    orientation:
      mode: keep_current
    source: yaml
  termination: time_limit
  type: push
skill: door_push
subtasks:
- anchor: fixture
  id: reach_handle
  offset:
  - -0.4
  - -0.02
  - 0.35
  weight: 0.3
- anchor: fixture
  id: push_door
  metric: hinge_angle
  target_entity: hinge
