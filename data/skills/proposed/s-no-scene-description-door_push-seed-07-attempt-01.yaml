dsl_version: 2
phases:
- control: position_control
  generator: linear_cartesian
  id: descend_1
  parameters:
    desc_y:
      binds_to:
      - mode: replace
        path: target.offset.y
      default: -0.15
      range:
      - -0.3
      - 0.0
      type: scalar
  subtask_id: reach_door
  target:
    anchor: task_object
    entity: door_panel
    offset:
    - 0.0
    - -0.15
    - 0.0
    offset_along_axis: null
    orientation:
      mode: none
    source: yaml
    tolerance: 0.01
  termination: contact_detected
  type: descend
- control: impedance_control
  generator: linear_cartesian
  guards:
  - args: {}
    id: ensure_contact
    on_failure: retry
    predicate: contact_detected
    threshold: 0.5
    when: before_phase
  - args: {}
    id: safe_force
    on_failure: retry
    predicate: force_below
    threshold: 30.0
    when: during_phase
  id: push_1
  parameters:
    force_limit:
      binds_to:
      - mode: replace
        path: guards.safe_force.threshold
      default: 30.0
      range:
      - 5.0
      - 30.0
      type: scalar
    push_dist:
      binds_to:
      - mode: replace
        path: target.offset_along_axis.distance
      default: 0.15
      range:
      - 0.02
      - 0.3
      type: scalar
    retry_x:
      binds_to:
      - mode: replace
        path: retry.offset.x
      default: 0.0
      range:
      - -0.05
      - 0.05
      type: scalar
    speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.05
      range:
      - 0.01
      - 0.1
      type: scalar
  retries:
    max_attempts: 2
    offset:
    - 0.0
    - 0.0
    - 0.0
    strategy: offset_target
  subtask_id: push_open
  target:
    anchor: task_object
    entity: door_panel
    offset:
    - 0.0
    - -0.15
    - 0.0
    offset_along_axis:
      axis: world_x
      distance: 0.15
      mode: add_to_offset
      sign: positive
    orientation:
      mode: keep_current
    source: yaml
    tolerance: 0.02
  termination: pose_tolerance
  type: push
skill: door_push
skill_type: arm_gripper
subtasks:
- anchor: object
  id: reach_door
  metric: distance
  offset:
  - 0.0
  - -0.15
  - 0.0
  target_entity: tcp
  weight: 0.3
- anchor: goal
  id: push_open
  metric: goal_progress
  offset:
  - 0.0
  - 0.0
  - 0.0
  target_entity: tcp
  weight: 0.7
