dsl_version: 2
phases:
- control: position_control
  generator: arc_cartesian
  id: arc_over
  orientation:
    mode: keep_current
  parameters:
    arc_height:
      binds_to:
      - mode: replace
        path: generator.arc_height
      default: 0.45
      range:
      - 0.3
      - 0.6
      type: scalar
    speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.1
      range:
      - 0.05
      - 0.15
      type: scalar
  subtask_id: approach_clear
  target:
    anchor: task_goal
    offset:
    - 0.0
    - 0.0
    - 0.2
    source: yaml
  termination: pose_tolerance
  type: approach
- control: impedance_control
  generator: linear_cartesian
  guards:
  - id: check_force
    on_failure: retry
    predicate: force_below
    threshold: 5.0
    when: during_phase
  id: compliant_descend
  orientation:
    mode: keep_current
  parameters:
    force_threshold:
      binds_to:
      - mode: replace
        path: termination.force_threshold
      default: 4.0
      range:
      - 2.0
      - 6.0
      type: scalar
    speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.02
      range:
      - 0.01
      - 0.05
      type: scalar
  retries:
    max_attempts: 1
    strategy: reduce_speed
  subtask_id: goal_contact
  target:
    anchor: task_goal
    offset:
    - 0.0
    - 0.0
    - 0.0
    source: yaml
  termination: force_exceeded
  type: descend
skill: obstacle_reach
skill_type: arm_gripper
subtasks:
- anchor: goal
  id: approach_clear
  metric: distance
  offset:
  - 0.0
  - 0.0
  - 0.2
  target_entity: tcp
  weight: 0.3
- anchor: goal
  id: goal_contact
  metric: distance
  offset:
  - 0.0
  - 0.0
  - 0.0
  target_entity: tcp
  weight: 0.7
