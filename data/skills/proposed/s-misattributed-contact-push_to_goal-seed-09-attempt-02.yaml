dsl_version: 2
phases:
- control: position_control
  generator: linear_cartesian
  id: approach_1
  orientation:
    mode: keep_current
  parameters:
    approach_height:
      binds_to:
      - mode: replace
        path: target.offset.z
      default: 0.1
      range:
      - 0.05
      - 0.2
      type: scalar
    approach_lateral:
      binds_to:
      - mode: add
        path: target.offset.y
      default: 0.05
      range:
      - -0.05
      - 0.15
      type: scalar
  subtask_id: reach_object
  target:
    anchor: task_object
    entity: push_box
    offset:
    - 0.05
    - 0.05
    - 0.1
    source: yaml
    tolerance: 0.02
  termination: pose_tolerance
  type: approach
- control: force_threshold_switch
  generator: linear_cartesian
  id: descend_contact
  parameters:
    contact_force_threshold:
      binds_to:
      - mode: replace
        path: termination.force_threshold
      default: 3.0
      range:
      - 1.0
      - 10.0
      type: scalar
    descend_approach_y:
      binds_to:
      - mode: replace
        path: target.offset.y
      default: 0.05
      range:
      - -0.05
      - 0.15
      type: scalar
  target:
    anchor: task_object
    entity: push_box
    offset:
    - 0.0
    - 0.05
    - 0.025
    source: yaml
    tolerance: 0.005
  termination: force_exceeded
  type: descend
- control: impedance_control
  generator: linear_cartesian
  guards:
  - args: {}
    id: over_force
    on_failure: abort
    predicate: force_below
    threshold: 20.0
    when: during_phase
  id: push_to_goal
  orientation:
    mode: keep_current
  parameters:
    push_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.05
      range:
      - 0.02
      - 0.2
      type: scalar
    push_stroke:
      binds_to:
      - mode: replace
        path: target.offset_along_axis.distance
      default: 0.25
      range:
      - 0.1
      - 0.4
      type: scalar
    push_time:
      binds_to:
      - mode: replace
        path: duration.max_time
      default: 5.0
      range:
      - 2.0
      - 10.0
      type: scalar
  subtask_id: push_to_goal
  target:
    anchor: task_object
    entity: push_box
    offset:
    - 0.0
    - 0.05
    - 0.025
    offset_along_axis:
      axis: task_goal_direction
      distance: 0.25
      mode: replace_offset_projection
      sign: positive
    source: yaml
    tolerance: 0.02
  termination: time_limit
  type: push
skill: push_to_goal
skill_type: arm
subtasks:
- anchor: object
  id: reach_object
  offset:
  - 0.0
  - 0.0
  - 0.1
  target_entity: tcp
  weight: 0.2
- anchor: goal
  id: push_to_goal
  metric: goal_progress
  target_entity: object
  weight: 0.8
