dsl_version: 2
phases:
- control: position_control
  generator: linear_cartesian
  guards:
  - args: {}
    id: contact_guard
    on_failure: retry
    predicate: contact_detected
    threshold: 1
    when: during_phase
  id: approach_side
  parameters:
    approach_tolerance:
      binds_to:
      - mode: replace
        path: termination.pose_tolerance
      default: 0.02
      range:
      - 0.005
      - 0.05
      type: scalar
    y_offset:
      binds_to:
      - mode: replace
        path: target.offset.y
      default: 0.05
      range:
      - 0.03
      - 0.08
      type: scalar
    z_offset:
      binds_to:
      - mode: replace
        path: target.offset.z
      default: 0.025
      range:
      - 0.02
      - 0.03
      type: scalar
  retries:
    max_attempts: 1
    offset:
    - 0.0
    - -0.01
    - 0.0
    strategy: offset_target
  subtask_id: approach_obj
  target:
    anchor: task_object
    offset:
    - 0
    - 0.05
    - 0.025
    source: yaml
    tolerance: 0.02
  termination: pose_tolerance
  type: approach
- control: impedance_control
  generator: linear_cartesian
  guards:
  - args: {}
    id: force_limit_guard
    predicate: force_below
    threshold: 25.0
    when: during_phase
  id: push_to_goal
  parameters:
    force_threshold:
      binds_to:
      - mode: replace
        path: termination.force_threshold
      default: 12.0
      range:
      - 5.0
      - 20.0
      type: scalar
    push_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.05
      range:
      - 0.01
      - 0.1
      type: scalar
  retries:
    max_attempts: 1
    offset:
    - 0.0
    - -0.01
    - 0.0
    strategy: offset_target
  subtask_id: push_goal
  target:
    anchor: task_goal
    offset:
    - 0
    - -0.2
    - 0.025
    source: yaml
    tolerance: 0.02
  termination: force_exceeded
  type: push
- control: position_control
  generator: linear_cartesian
  id: retract_up
  parameters:
    speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.05
      range:
      - 0.02
      - 0.1
      type: scalar
  target:
    anchor: task_goal
    offset:
    - 0
    - 0
    - 0.1
    source: yaml
    tolerance: 0.02
  termination: pose_tolerance
  type: retract
skill: push_to_goal
subtasks:
- anchor: object
  id: approach_obj
  metric: distance
  offset:
  - 0
  - 0.05
  - 0.025
  target_entity: tcp
  weight: 0.3
- anchor: goal
  id: push_goal
  metric: goal_progress
  target_entity: object
  weight: 0.7
