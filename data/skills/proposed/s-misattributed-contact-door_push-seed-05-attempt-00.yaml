dsl_version: 2
phases:
- control: position_control
  generator: linear_cartesian
  guards:
  - args: {}
    id: handle_reached
    on_failure: retry
    predicate: pose_within_tolerance
    threshold: 0.02
    when: before_phase
  id: approach_handle
  parameters:
    approach_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.15
      range:
      - 0.05
      - 0.3
      type: scalar
  retries:
    max_attempts: 2
    offset:
    - 0
    - 0
    - 0.005
    strategy: offset_target
  subtask_id: hinge_goal
  target:
    anchor: site
    entity: door_handle
    offset:
    - 0
    - 0
    - 0.05
    offset_along_axis:
      axis: world_z
      distance: 0.0
      mode: add_to_offset
      sign: positive
    orientation:
      mode: keep_current
    source: yaml
    tolerance: 0.02
  termination: pose_tolerance
  type: approach
- control: impedance_control
  generator: linear_cartesian
  id: push_door
  parameters:
    push_distance:
      binds_to:
      - mode: replace
        path: target.offset_along_axis.distance
      default: 0.2
      range:
      - 0.1
      - 0.35
      type: scalar
    push_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.1
      range:
      - 0.05
      - 0.25
      type: scalar
  retries:
    max_attempts: 2
    offset:
    - 0
    - 0.01
    - 0
    strategy: offset_target
  subtask_id: hinge_goal
  target:
    anchor: site
    entity: door_handle
    offset:
    - 0
    - 0
    - 0
    offset_along_axis:
      axis: world_y
      distance: 0.2
      mode: replace_offset_projection
      sign: negative
    orientation:
      mode: keep_current
    source: yaml
    tolerance: 0.03
  termination: pose_tolerance
  type: push
skill: door_push
skill_type: arm_gripper
subtasks:
- anchor: world
  id: hinge_goal
  metric: hinge_angle
  offset:
  - 0
  - 0
  - 0
  target_entity: hinge
  weight: 1.0
