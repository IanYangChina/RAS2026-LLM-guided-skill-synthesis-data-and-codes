dsl_version: 2
phases:
- control: position_control
  generator: linear_cartesian
  id: approach_behind
  parameters:
    approach_height:
      binds_to:
      - mode: replace
        path: target.offset.z
      default: 0.15
      range:
      - 0.1
      - 0.2
      type: scalar
  subtask_id: approach_peg
  target:
    anchor: task_object
    entity: peg
    offset:
    - 0.0
    - 0.05
    - 0.15
    orientation:
      mode: none
    source: yaml
    tolerance: 0.02
  termination: pose_tolerance
  type: approach
- control: force_threshold_switch
  generator: linear_cartesian
  id: descend_to_contact
  parameters:
    descend_force_threshold:
      binds_to:
      - mode: replace
        path: termination.force_threshold
      default: 5.0
      range:
      - 2.0
      - 10.0
      type: scalar
  subtask_id: approach_peg
  target:
    anchor: task_object
    entity: peg
    offset:
    - 0.0
    - 0.02
    - 0.0
    orientation:
      mode: none
    source: yaml
    tolerance: 0.01
  termination: force_exceeded
  type: descend
- control: impedance_control
  generator: linear_cartesian
  id: push_along_channel
  parameters:
    push_distance:
      binds_to:
      - mode: replace
        path: target.offset_along_axis.distance
      default: 0.16
      range:
      - 0.08
      - 0.2
      type: scalar
  retries:
    max_attempts: 1
    strategy: repeat
  subtask_id: push_to_goal
  target:
    anchor: task_object
    entity: peg
    offset:
    - 0.0
    - 0.02
    - 0.0
    offset_along_axis:
      axis: channel_axis
      distance: 0.16
      mode: add_to_offset
      sign: positive
    orientation:
      align_with: channel_axis
      axis:
      - 0
      - 0
      - 1
      mode: align_axis
      tolerance: 0.1
    source: yaml
    tolerance: 0.02
  termination: pose_tolerance
  type: push
skill: peg_channel
skill_type: arm
subtasks:
- anchor: object
  id: approach_peg
  metric: distance
  offset:
  - 0.0
  - 0.05
  - 0.15
  target_entity: tcp
  weight: 0.3
- anchor: goal
  id: push_to_goal
  metric: goal_progress
  offset:
  - 0.0
  - 0.0
  - 0.0
  target_entity: tcp
  weight: 0.7
