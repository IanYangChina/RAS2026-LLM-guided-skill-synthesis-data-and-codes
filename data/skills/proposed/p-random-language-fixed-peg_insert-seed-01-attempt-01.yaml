dsl_version: 2
phases:
- control: position_control
  generator: linear_cartesian
  id: approach_above
  orientation:
    align_with: insertion_axis
    axis:
    - 0
    - 0
    - 1
    mode: align_axis
    tolerance: 0.05
  parameters:
    approach_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.05
      range:
      - 0.02
      - 0.1
      type: scalar
    approach_z:
      binds_to:
      - mode: replace
        path: target.offset.z
      default: 0.1
      range:
      - 0.06
      - 0.15
      type: scalar
  target:
    anchor: task_goal
    offset:
    - 0.0
    - 0.0
    - 0.1
    source: yaml
    tolerance: 0.005
  termination: pose_tolerance
  type: approach
- control: position_control
  generator: linear_cartesian
  id: align_over_hole
  orientation:
    mode: keep_current
  parameters:
    align_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.04
      range:
      - 0.01
      - 0.08
      type: scalar
    lateral_x:
      binds_to:
      - mode: add
        path: target.offset.x
      default: 0.0
      range:
      - -0.02
      - 0.02
      type: scalar
    lateral_y:
      binds_to:
      - mode: add
        path: target.offset.y
      default: 0.0
      range:
      - -0.02
      - 0.02
      type: scalar
  target:
    anchor: task_goal
    offset:
    - 0.0
    - 0.0
    - 0.02
    source: yaml
    tolerance: 0.003
  termination: pose_tolerance
  type: align
- control: force_threshold_switch
  generator: linear_cartesian
  id: descend_for_contact
  orientation:
    mode: keep_current
  parameters:
    contact_force_threshold:
      binds_to:
      - mode: replace
        path: termination.force_threshold
      default: 10
      range:
      - 5
      - 20
      type: scalar
    descent_offset_z:
      binds_to:
      - mode: replace
        path: target.offset.z
      default: -0.02
      range:
      - -0.04
      - -0.01
      type: scalar
  target:
    anchor: task_goal
    offset:
    - 0.0
    - 0.0
    - -0.02
    source: yaml
    tolerance: 0.01
  termination: force_exceeded
  type: contact
- control: impedance_control
  generator: impedance_motion
  id: insert_into_hole
  orientation:
    mode: keep_current
  parameters:
    insert_depth:
      binds_to:
      - mode: replace
        path: target.offset_along_axis.distance
      default: 0.05
      range:
      - 0.03
      - 0.07
      type: scalar
    insert_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.01
      range:
      - 0.005
      - 0.025
      type: scalar
  target:
    anchor: fixture
    entity: peg_socket
    offset:
    - 0.0
    - 0.0
    - 0.0
    offset_along_axis:
      axis: insertion_axis
      distance: 0.05
      mode: replace_offset_projection
      sign: positive
    source: yaml
    tolerance: 0.02
  termination: pose_tolerance
  type: insert
skill: peg_insert
