dsl_version: 2
phases:
- control: position_control
  generator: linear_cartesian
  id: approach_peg
  parameters:
    approach_z_offset:
      binds_to:
      - mode: replace
        path: target.offset.z
      default: 0.08
      range:
      - 0.05
      - 0.15
      type: scalar
  subtask_id: approach_peg
  target:
    anchor: task_object
    offset:
    - 0.0
    - 0.0
    - 0.08
    orientation:
      mode: keep_current
    source: yaml
    tolerance: 0.01
  termination: pose_tolerance
  type: approach
- control: position_control
  generator: linear_cartesian
  id: descend_to_peg
  parameters:
    descend_y_offset:
      binds_to:
      - mode: replace
        path: target.offset.y
      default: 0.02
      range:
      - 0.0
      - 0.05
      type: scalar
  target:
    anchor: task_object
    offset:
    - 0.0
    - 0.02
    - 0.0
    orientation:
      mode: keep_current
    source: yaml
    tolerance: 0.01
  termination: pose_tolerance
  type: descend
- control: impedance_control
  generator: linear_cartesian
  guards:
  - args: {}
    id: force_guard
    on_failure: abort
    predicate: force_below
    threshold: 35.0
    when: during_phase
  id: push_channel
  parameters:
    push_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.04
      range:
      - 0.01
      - 0.1
      type: scalar
    push_target_y_offset:
      binds_to:
      - mode: replace
        path: target.offset.y
      default: -0.01
      range:
      - -0.03
      - 0.01
      type: scalar
  subtask_id: push_goal
  target:
    anchor: task_goal
    offset:
    - 0.0
    - -0.01
    - 0.0
    orientation:
      mode: keep_current
    source: yaml
    tolerance: 0.02
  termination: time_limit
  type: push
- control: position_control
  generator: linear_cartesian
  id: retract
  target:
    anchor: current_tcp
    offset:
    - 0.0
    - 0.0
    - 0.15
    orientation:
      mode: keep_current
    source: yaml
    tolerance: 0.02
  termination: pose_tolerance
  type: retract
skill: peg_channel
subtasks:
- anchor: object
  id: approach_peg
  offset:
  - 0.0
  - 0.0
  - 0.08
  target_entity: tcp
  weight: 0.3
- anchor: goal
  id: push_goal
  metric: goal_progress
  offset:
  - 0.0
  - 0.0
  - 0.0
  target_entity: tcp
  weight: 0.7
