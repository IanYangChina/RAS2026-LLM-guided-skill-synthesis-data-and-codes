dsl_version: 2
phases:
- control: position_control
  generator: linear_cartesian
  id: approach
  parameters:
    approach_offset_y:
      binds_to:
      - mode: replace
        path: target.offset.y
      default: 0.15
      range:
      - 0.08
      - 0.2
      type: scalar
    approach_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.1
      range:
      - 0.05
      - 0.15
      type: scalar
  subtask_id: approach_box
  target:
    anchor: task_object
    offset:
    - 0.0
    - 0.15
    - 0.1
    source: yaml
  termination: pose_tolerance
  type: approach
- control: impedance_control
  generator: linear_cartesian
  guards:
  - id: contact_check
    on_failure: retry
    predicate: contact_detected
    threshold: 1.0
    when: after_phase
  id: align_contact
  parameters:
    align_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.02
      range:
      - 0.01
      - 0.05
      type: scalar
    force_threshold:
      binds_to:
      - mode: replace
        path: termination.force_threshold
      default: 10.0
      range:
      - 5.0
      - 18.0
      type: scalar
    lateral_offset:
      binds_to:
      - mode: replace
        path: target.offset.y
      default: 0.15
      range:
      - 0.08
      - 0.2
      type: scalar
  retries:
    max_attempts: 2
    offset:
    - 0.0
    - 0.02
    - -0.01
    strategy: offset_target
  subtask_id: contact_side
  target:
    anchor: task_object
    offset:
    - 0.0
    - 0.15
    - 0.0
    source: yaml
  termination: force_exceeded
  type: align
- control: admittance_control
  generator: linear_cartesian
  id: push_to_goal
  parameters:
    push_distance:
      binds_to:
      - mode: replace
        path: target.offset_along_axis.distance
      default: 0.17
      range:
      - 0.1
      - 0.3
      type: scalar
    push_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.03
      range:
      - 0.01
      - 0.05
      type: scalar
    push_timeout:
      binds_to:
      - mode: replace
        path: duration.max_time
      default: 5.0
      range:
      - 2.0
      - 8.0
      type: scalar
  subtask_id: push_to_goal
  target:
    anchor: task_object
    offset:
    - 0.0
    - 0.0
    - 0.0
    offset_along_axis:
      axis: task_goal_direction
      distance: 0.17
      mode: replace_offset_projection
      sign: positive
    source: yaml
  termination:
  - pose_tolerance
  - time_limit
  type: push
skill: push_to_goal
skill_type: arm_gripper
subtasks:
- anchor: object
  id: approach_box
  offset:
  - 0.0
  - 0.15
  - 0.1
  target_entity: tcp
  weight: 0.3
- anchor: object
  id: contact_side
  offset:
  - 0.0
  - 0.15
  - 0.0
  target_entity: tcp
  weight: 0.2
- anchor: goal
  id: push_to_goal
  metric: goal_progress
  target_entity: object
  weight: 0.5
