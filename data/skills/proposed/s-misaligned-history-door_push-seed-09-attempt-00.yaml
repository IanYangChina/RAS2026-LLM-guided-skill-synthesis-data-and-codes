dsl_version: 2
phases:
- control: position_control
  generator: linear_cartesian
  id: approach_handle
  orientation:
    mode: keep_current
  parameters:
    approach_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.1
      range:
      - 0.05
      - 0.2
      type: scalar
  subtask_id: approach_handle
  target:
    anchor: fixture
    entity: door_panel
    offset:
    - -0.4
    - -0.02
    - 0.4
    source: yaml
    tolerance: 0.03
  termination: pose_tolerance
  type: approach
- control: position_control
  generator: linear_cartesian
  guards:
  - id: contact_assured
    on_failure: retry
    predicate: contact_detected
    threshold: 1.0
  id: descend_to_handle
  orientation:
    mode: keep_current
  parameters:
    descend_force:
      binds_to:
      - mode: replace
        path: termination.force_threshold
      default: 10.0
      range:
      - 5.0
      - 30.0
      type: scalar
  retries:
    max_attempts: 1
    offset:
    - 0.0
    - 0.0
    - 0.01
    strategy: offset_target
  subtask_id: approach_handle
  target:
    anchor: fixture
    entity: door_panel
    offset:
    - -0.4
    - -0.02
    - 0.35
    source: yaml
    tolerance: 0.02
  termination:
    force_threshold: 10.0
  type: descend
- control: impedance_control
  generator: linear_cartesian
  guards:
  - id: push_angle_reached
    on_failure: abort
    predicate: hinge_delta_reached
    threshold: 0.4
  id: push_door
  orientation:
    mode: keep_current
  parameters:
    hinge_delta_threshold:
      binds_to:
      - mode: replace
        path: guards.push_angle_reached.threshold
      default: 0.4
      range:
      - 0.3
      - 0.5
      type: scalar
    push_distance:
      binds_to:
      - mode: replace
        path: target.offset_along_axis.distance
      default: 0.16
      range:
      - 0.1
      - 0.25
      type: scalar
    push_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.05
      range:
      - 0.02
      - 0.15
      type: scalar
  subtask_id: push_door
  target:
    anchor: fixture
    entity: door_panel
    offset:
    - -0.4
    - -0.02
    - 0.35
    offset_along_axis:
      axis: world_y
      distance: 0.16
      mode: replace_offset_projection
      sign: negative
    source: yaml
    tolerance: 0.01
  termination:
    max_time: 5.0
  type: push
skill: door_push_v2
skill_type: arm
subtasks:
- anchor: fixture
  id: approach_handle
  metric: distance
  offset:
  - -0.4
  - -0.02
  - 0.4
  target_entity: tcp
  weight: 0.3
- anchor: fixture
  id: push_door
  metric: hinge_angle
  offset:
  - 0.0
  - 0.0
  - 0.0
  target_entity: hinge
  weight: 0.7
