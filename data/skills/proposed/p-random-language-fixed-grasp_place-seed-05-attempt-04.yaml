dsl_version: 2
phases:
- control: position_control
  generator: linear_cartesian
  id: approach_1
  parameters:
    approach_height:
      binds_to:
      - mode: replace
        path: target.offset.z
      default: 0.15
      range:
      - 0.08
      - 0.25
      type: scalar
  subtask_id: approach_1
  target:
    anchor: task_object
    offset:
    - 0
    - 0
    - 0.15
    orientation:
      align_with: world_z
      axis:
      - 0
      - 0
      - 1
      mode: align_axis
      tolerance: 0.1
    source: yaml
  termination: pose_tolerance
  type: approach
- control: force_threshold_switch
  generator: linear_cartesian
  id: descend_1
  parameters:
    descend_force_threshold:
      binds_to:
      - mode: replace
        path: termination.force_threshold
      default: 3.0
      range:
      - 1.0
      - 8.0
      type: scalar
    grasp_z_offset:
      binds_to:
      - mode: replace
        path: target.offset.z
      default: 0.02
      range:
      - 0.0
      - 0.05
      type: scalar
  retries:
    max_attempts: 2
    offset:
    - 0
    - 0
    - 0.003
    strategy: offset_target
  subtask_id: descend_1
  target:
    anchor: task_object
    offset:
    - 0
    - 0
    - 0.02
    orientation:
      mode: keep_current
    source: yaml
  termination: force_exceeded
  type: descend
- control: position_control
  end_effector_action: force_grasp
  generator: null
  guards:
  - args: {}
    id: bilateral_grasp
    on_failure: retry
    predicate: bilateral_grasp
    threshold: null
    when: after_phase
  id: grasp_1
  retries:
    max_attempts: 2
    strategy: increase_force_limit
  subtask_id: grasp_1
  target:
    anchor: task_object
    offset:
    - 0
    - 0
    - 0.02
    orientation:
      mode: keep_current
    source: yaml
  termination: grasp_success
  type: grasp
- control: impedance_control
  generator: arc_cartesian
  guards:
  - args: {}
    id: object_lifted
    on_failure: retry
    predicate: object_lifted
    threshold: null
    when: after_phase
  id: lift_transport
  parameters:
    transport_height:
      binds_to:
      - mode: replace
        path: target.offset.z
      default: 0.15
      range:
      - 0.1
      - 0.2
      type: scalar
    transport_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.2
      range:
      - 0.1
      - 0.4
      type: scalar
  retries:
    max_attempts: 1
    strategy: reduce_speed
  subtask_id: transport_arc
  target:
    anchor: task_goal
    offset:
    - 0
    - 0
    - 0.15
    orientation:
      mode: keep_current
    source: yaml
  termination: pose_tolerance
  type: approach
- control: position_control
  generator: linear_cartesian
  id: descend_to_place
  parameters:
    release_z_offset:
      binds_to:
      - mode: replace
        path: target.offset.z
      default: 0.02
      range:
      - 0.0
      - 0.05
      type: scalar
  subtask_id: release_1
  target:
    anchor: task_goal
    offset:
    - 0
    - 0
    - 0.02
    orientation:
      mode: keep_current
    source: yaml
  termination: pose_tolerance
  type: descend
- control: position_control
  end_effector_action: open
  generator: null
  id: release_2
  target:
    anchor: task_goal
    offset:
    - 0
    - 0
    - 0.02
    orientation:
      mode: keep_current
    source: yaml
  termination: pose_tolerance
  type: release
- control: position_control
  generator: linear_cartesian
  id: retract_1
  target:
    anchor: current_tcp
    offset:
    - 0
    - 0
    - 0.1
    orientation:
      mode: keep_current
    source: yaml
  termination: pose_tolerance
  type: retract
skill: grasp_place
skill_type: arm_gripper
