dsl_version: 2
phases:
- control: position_control
  generator: linear_cartesian
  guards: []
  id: approach_peg
  parameters:
    approach_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.05
      range:
      - 0.01
      - 0.1
      type: scalar
  retries:
    max_attempts: 0
  subtask_id: approach
  target:
    anchor: task_object
    entity: peg
    offset:
    - 0.0
    - 0.05
    - 0.02
    orientation:
      mode: keep_current
    source: yaml
    tolerance: 0.01
  termination: pose_tolerance
  type: approach
- control: admittance_control
  generator: linear_cartesian
  guards:
  - args: {}
    id: contact_force_check
    on_failure: retry
    predicate: force_below
    threshold: 5.0
    when: during_phase
  id: contact_peg
  parameters:
    contact_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.02
      range:
      - 0.005
      - 0.05
      type: scalar
  retries:
    max_attempts: 2
    offset:
    - 0.0
    - -0.005
    - 0.0
    strategy: offset_target
  subtask_id: contact
  target:
    anchor: task_object
    entity: peg
    offset:
    - 0.0
    - 0.02
    - 0.01
    orientation:
      mode: keep_current
    source: yaml
    tolerance: 0.01
  termination: contact_detected
  type: contact
- control: impedance_control
  generator: linear_cartesian
  guards:
  - args: {}
    id: push_force_guard
    on_failure: abort
    predicate: force_below
    threshold: 40.0
    when: during_phase
  id: push_channel
  parameters:
    push_distance:
      binds_to:
      - mode: replace
        path: target.offset_along_axis.distance
      default: 0.16
      range:
      - 0.12
      - 0.2
      type: scalar
    push_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.04
      range:
      - 0.01
      - 0.08
      type: scalar
  retries:
    max_attempts: 1
    strategy: reduce_speed
  subtask_id: push
  target:
    anchor: current_tcp
    offset:
    - 0.0
    - 0.0
    - 0.0
    offset_along_axis:
      axis: channel_axis
      distance: 0.16
      mode: replace_offset_projection
      sign: positive
    orientation:
      align_with: channel_axis
      axis:
      - 0.0
      - 0.0
      - 1.0
      mode: align_axis
      tolerance: 0.05
    source: yaml
    tolerance: 0.02
  termination: pose_tolerance
  type: push
- control: position_control
  generator: linear_cartesian
  guards: []
  id: retract_up
  parameters:
    retract_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.06
      range:
      - 0.02
      - 0.1
      type: scalar
  retries:
    max_attempts: 0
  target:
    anchor: current_tcp
    offset:
    - 0.0
    - 0.0
    - 0.12
    orientation:
      mode: keep_current
    source: yaml
    tolerance: 0.01
  termination: pose_tolerance
  type: retract
skill: peg_channel
skill_type: arm
subtasks:
- anchor: object
  id: approach
  metric: distance
  offset:
  - 0.0
  - 0.04
  - 0.0
  target_entity: tcp
  weight: 1.0
- anchor: object
  id: contact
  metric: distance
  offset:
  - 0.0
  - 0.02
  - 0.0
  target_entity: tcp
  weight: 1.0
- anchor: world
  id: push
  metric: goal_progress
  offset:
  - 0.5
  - -0.08
  - 0.04
  target_entity: tcp
  weight: 1.0
