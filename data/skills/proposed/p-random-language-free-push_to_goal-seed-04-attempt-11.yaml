dsl_version: 2
phases:
- control: position_control
  generator: linear_cartesian
  id: approach
  orientation:
    mode: keep_current
  parameters:
    approach_speed:
      binds_to:
      - mode: add
        path: generator.speed
      default: 0.1
      range:
      - 0.05
      - 0.2
      type: scalar
  retries:
    max_attempts: 1
    offset:
    - 0.0
    - 0.0
    - 0.01
    strategy: offset_target
  subtask_id: pre_push
  target:
    anchor: task_object
    entity: push_box
    offset:
    - 0.0
    - 0.0
    - 0.15
    source: yaml
    tolerance: 0.01
  termination: pose_tolerance
  type: approach
- control: impedance_control
  generator: linear_cartesian
  guards:
  - args: {}
    id: force_limit
    on_failure: abort
    predicate: force_below
    threshold: 25.0
    when: during_phase
  id: push
  orientation:
    mode: keep_current
  parameters:
    push_distance:
      binds_to:
      - mode: replace
        path: target.offset_along_axis.distance
      default: 0.12
      range:
      - 0.05
      - 0.2
      type: scalar
    push_speed:
      binds_to:
      - mode: add
        path: generator.speed
      default: 0.05
      range:
      - 0.02
      - 0.08
      type: scalar
  retries:
    max_attempts: 1
    offset:
    - 0.0
    - 0.0
    - 0.0
    strategy: offset_target
  subtask_id: push_to_goal
  target:
    anchor: task_object
    entity: push_box
    offset_along_axis:
      axis: task_goal_direction
      distance: 0.12
      mode: add_to_offset
      sign: positive
    source: yaml
    tolerance: 0.05
  termination: time_limit
  type: push
- control: position_control
  generator: linear_cartesian
  id: retract
  orientation:
    mode: keep_current
  parameters:
    retract_speed:
      binds_to:
      - mode: add
        path: generator.speed
      default: 0.1
      range:
      - 0.05
      - 0.2
      type: scalar
  target:
    anchor: current_tcp
    offset:
    - 0.0
    - 0.0
    - 0.1
    source: yaml
  termination: pose_tolerance
  type: retract
skill: push_to_goal
skill_type: arm_gripper
subtasks:
- anchor: object
  id: pre_push
  metric: distance
  offset:
  - 0.0
  - 0.0
  - 0.15
  target_entity: tcp
  weight: 0.3
- anchor: goal
  id: push_to_goal
  metric: goal_progress
  offset:
  - 0.0
  - 0.0
  - 0.0
  target_entity: tcp
  weight: 0.7
