dsl_version: 2
phases:
- control: position_control
  generator: linear_cartesian
  id: approach_1
  orientation:
    align_with: world_x
    axis:
    - 0
    - 0
    - 1
    mode: align_axis
    tolerance: 0.1
  parameters:
    approach_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.1
      range:
      - 0.02
      - 0.2
      type: scalar
  subtask_id: reach_door
  target:
    anchor: task_goal
    offset:
    - 0.0
    - 0.0
    - 0.05
    source: yaml
    tolerance: 0.02
  termination: pose_tolerance
  type: approach
- control: admittance_control
  generator: linear_cartesian
  guards:
  - args: {}
    id: force_guard
    on_failure: continue
    predicate: force_below
    threshold: 30.0
    when: during_phase
  id: push_1
  orientation:
    align_with: world_x
    axis:
    - 0
    - 0
    - 1
    mode: align_axis
    tolerance: 0.1
  parameters:
    push_distance:
      binds_to:
      - mode: replace
        path: target.offset_along_axis.distance
      default: 0.2
      range:
      - 0.05
      - 0.5
      type: scalar
    push_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.08
      range:
      - 0.02
      - 0.2
      type: scalar
  retries:
    max_attempts: 1
    strategy: reduce_speed
  subtask_id: open_door
  target:
    anchor: current_tcp
    offset:
    - 0.0
    - 0.0
    - 0.0
    offset_along_axis:
      axis: world_x
      distance: 0.2
      mode: replace_offset_projection
      sign: positive
    source: yaml
    tolerance: 0.1
  termination: pose_tolerance
  type: push
skill: door_push
skill_type: arm_gripper
subtasks:
- anchor: goal
  id: reach_door
  metric: distance
  offset:
  - 0.0
  - 0.0
  - 0.05
  target_entity: tcp
  weight: 0.3
- anchor: fixture
  id: open_door
  metric: hinge_angle
  target_entity: hinge
  weight: 0.7
