dsl_version: 2
phases:
- control: position_control
  generator: linear_cartesian
  id: approach
  parameters:
    speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.05
      range:
      - 0.02
      - 0.1
      type: scalar
  subtask_id: reach_above_hole
  target:
    anchor: task_goal
    entity: null
    offset:
    - 0
    - 0
    - 0.12
    source: yaml
    tolerance: 0.02
  termination: pose_tolerance
  type: approach
- control: position_control
  generator: linear_cartesian
  id: align
  parameters:
    align_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.03
      range:
      - 0.01
      - 0.06
      type: scalar
    lateral_offset_x:
      binds_to:
      - mode: add
        path: target.offset.x
      default: 0.0
      range:
      - -0.02
      - 0.02
      type: scalar
    lateral_offset_y:
      binds_to:
      - mode: add
        path: target.offset.y
      default: 0.0
      range:
      - -0.02
      - 0.02
      type: scalar
  subtask_id: reach_above_hole
  target:
    anchor: task_goal
    entity: null
    offset:
    - 0
    - 0
    - 0.02
    orientation:
      align_with: insertion_axis
      axis:
      - 0
      - 0
      - 1
      mode: align_axis
      tolerance: 0.05
    source: yaml
    tolerance: 0.01
  termination: pose_tolerance
  type: align
- control: force_threshold_switch
  generator: linear_cartesian
  guards:
  - args: {}
    id: force_guard
    on_failure: abort
    predicate: force_below
    threshold: 30.0
    when: during_phase
  id: descend
  parameters:
    descend_offset_z:
      binds_to:
      - mode: replace
        path: target.offset.z
      default: -0.08
      range:
      - -0.12
      - -0.02
      type: scalar
    descend_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.01
      range:
      - 0.005
      - 0.03
      type: scalar
  retries:
    max_attempts: 2
    offset:
    - 0.005
    - 0.005
    - 0
    strategy: offset_target
  subtask_id: reach_insertion
  target:
    anchor: task_goal
    entity: null
    offset:
    - 0
    - 0
    - -0.1
    source: yaml
  termination: contact_detected
  type: descend
- control: impedance_control
  generator: linear_cartesian
  guards:
  - args: {}
    id: force_guard_insert
    on_failure: abort
    predicate: force_below
    threshold: 35.0
    when: during_phase
  id: insert
  parameters:
    insert_distance:
      binds_to:
      - mode: replace
        path: target.offset_along_axis.distance
      default: 0.08
      range:
      - 0.04
      - 0.12
      type: scalar
    insert_force_threshold:
      binds_to:
      - mode: replace
        path: termination.force_threshold
      default: 25.0
      range:
      - 10.0
      - 40.0
      type: scalar
    insert_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.015
      range:
      - 0.005
      - 0.04
      type: scalar
  subtask_id: reach_insertion
  target:
    anchor: task_goal
    entity: null
    offset:
    - 0
    - 0
    - -0.02
    offset_along_axis:
      axis: insertion_axis
      distance: 0.08
      mode: replace_offset_projection
      sign: positive
    source: yaml
  termination: force_exceeded
  type: insert
skill: peg_insert
subtasks:
- anchor: goal
  id: reach_above_hole
  offset:
  - 0
  - 0
  - 0.12
  target_entity: tcp
  weight: 0.3
- anchor: goal
  id: reach_insertion
  offset:
  - 0
  - 0
  - 0
  target_entity: tcp
  weight: 0.7
