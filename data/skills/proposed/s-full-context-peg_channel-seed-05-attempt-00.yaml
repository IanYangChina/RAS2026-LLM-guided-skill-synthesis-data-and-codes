dsl_version: 2
phases:
- control: position_control
  generator: linear_cartesian
  id: approach_behind_peg
  orientation:
    mode: none
  parameters:
    approach_offset:
      binds_to:
      - mode: add
        path: target.offset.y
      default: 0.05
      range:
      - 0.03
      - 0.08
      type: scalar
  subtask_id: reach_prepush
  target:
    anchor: task_object
    entity: peg
    offset:
    - 0
    - 0.05
    - 0
    source: yaml
    tolerance: 0.01
  termination: pose_tolerance
  type: approach
- control: impedance_control
  generator: linear_cartesian
  id: push_through_channel
  orientation:
    align_with: channel_axis
    axis:
    - 0
    - 0
    - 1
    mode: align_axis
    tolerance: 0.2
  parameters:
    push_distance:
      binds_to:
      - mode: add
        path: target.offset_along_axis.distance
      default: 0.18
      range:
      - 0.14
      - 0.22
      type: scalar
    speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.05
      range:
      - 0.02
      - 0.1
      type: scalar
  subtask_id: push_goal
  target:
    anchor: current_tcp
    offset_along_axis:
      axis: channel_axis
      distance: 0.18
      mode: add_to_offset
      sign: negative
    source: yaml
    tolerance: 0.02
  termination: time_limit
  type: push
skill: peg_channel
skill_type: arm
subtasks:
- anchor: object
  id: reach_prepush
  metric: distance
  offset:
  - 0
  - 0.05
  - 0
  target_entity: tcp
  weight: 0.3
- anchor: goal
  id: push_goal
  metric: goal_progress
  target_entity: object
  weight: 0.7
