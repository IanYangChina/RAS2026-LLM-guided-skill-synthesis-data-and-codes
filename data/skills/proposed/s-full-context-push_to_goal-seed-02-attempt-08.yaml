dsl_version: 2
phases:
- control: position_control
  generator: linear_cartesian
  id: approach_from_behind
  parameters:
    approach_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.6
      range:
      - 0.1
      - 1.0
      type: scalar
    approach_x_offset:
      binds_to:
      - mode: replace
        path: target.offset.x
      default: 0.0
      range:
      - -0.05
      - 0.05
      type: scalar
    approach_y_offset:
      binds_to:
      - mode: replace
        path: target.offset.y
      default: 0.08
      range:
      - 0.04
      - 0.15
      type: scalar
    approach_z_offset:
      binds_to:
      - mode: replace
        path: target.offset.z
      default: 0.06
      range:
      - 0.03
      - 0.12
      type: scalar
  target:
    anchor: task_object
    entity: push_box
    offset:
    - 0.0
    - 0.08
    - 0.06
    orientation:
      mode: none
    source: yaml
    tolerance: 0.05
  termination: pose_tolerance
  type: approach
- control: impedance_control
  generator: linear_cartesian
  guards:
  - args: {}
    id: contact_guard
    on_failure: continue
    predicate: contact_detected
    threshold: 0.0
    when: during_phase
  id: push_to_goal
  parameters:
    push_distance:
      binds_to:
      - mode: replace
        path: target.offset_along_axis.distance
      default: 0.15
      range:
      - 0.08
      - 0.25
      type: scalar
    push_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.1
      range:
      - 0.02
      - 0.3
      type: scalar
    push_z_offset:
      binds_to:
      - mode: replace
        path: target.offset.z
      default: 0.02
      range:
      - 0.0
      - 0.04
      type: scalar
  retries:
    max_attempts: 2
    offset:
    - 0.0
    - 0.01
    - 0.01
    strategy: offset_target
  target:
    anchor: task_goal
    entity: task_goal
    offset:
    - 0.0
    - 0.0
    - 0.02
    offset_along_axis:
      axis: task_goal_direction
      distance: 0.15
      mode: add_to_offset
      sign: positive
    orientation:
      align_with: task_goal_direction
      axis:
      - 1.0
      - 0.0
      - 0.0
      mode: align_axis
      tolerance: 0.15
    source: yaml
    tolerance: 0.05
  termination: pose_tolerance
  type: push
skill: push_to_goal
subtasks:
- anchor: object
  id: reach_approach_target
  metric: distance
  offset:
  - 0.0
  - 0.08
  - 0.06
  target_entity: tcp
  weight: 0.3
- anchor: goal
  id: push_object_to_goal
  metric: goal_progress
  offset:
  - 0.0
  - 0.0
  - 0.0
  target_entity: object
  weight: 0.7
