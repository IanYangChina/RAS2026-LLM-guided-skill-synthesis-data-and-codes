dsl_version: 2
phases:
- control: position_control
  generator: linear_cartesian
  id: approach_peg
  orientation:
    mode: none
  parameters:
    approach_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.1
      range:
      - 0.01
      - 0.2
      type: scalar
  target:
    anchor: task_object
    offset:
    - 0.0
    - 0.0
    - 0.1
    source: yaml
  termination: pose_tolerance
  type: approach
- control: impedance_control
  generator: linear_cartesian
  id: descend_to_contact
  orientation:
    mode: none
  parameters:
    contact_force_threshold:
      binds_to:
      - mode: replace
        path: termination.force_threshold
      default: 5.0
      range:
      - 2.0
      - 10.0
      type: scalar
  subtask_id: reach_peg
  target:
    anchor: task_object
    offset:
    - 0.0
    - 0.0
    - 0.0
    source: yaml
  termination: force_exceeded
  type: descend
- control: impedance_control
  generator: linear_cartesian
  guards:
  - args: {}
    id: high_force_guard
    on_failure: abort
    predicate: force_below
    threshold: 45.0
    when: during_phase
  id: push_to_goal
  orientation:
    mode: keep_current
  parameters:
    push_force_limit:
      binds_to:
      - mode: replace
        path: termination.force_threshold
      default: 30.0
      range:
      - 10.0
      - 40.0
      type: scalar
    push_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.05
      range:
      - 0.01
      - 0.15
      type: scalar
  retries:
    max_attempts: 2
    offset:
    - 0.0
    - 0.0
    - 0.0
    strategy: reduce_speed
  subtask_id: push_peg
  target:
    anchor: task_goal
    offset:
    - 0.0
    - 0.0
    - 0.0
    source: yaml
  termination: force_exceeded
  type: push
- control: position_control
  generator: linear_cartesian
  id: retract_from_channel
  orientation:
    mode: none
  target:
    anchor: current_tcp
    offset:
    - 0.0
    - 0.0
    - 0.1
    source: yaml
  termination: pose_tolerance
  type: retract
skill: peg_channel
skill_type: arm
subtasks:
- anchor: object
  id: reach_peg
  metric: distance
  offset:
  - 0.0
  - 0.0
  - 0.0
  target_entity: tcp
  weight: 0.3
- anchor: goal
  id: push_peg
  metric: goal_progress
  offset:
  - 0.0
  - 0.0
  - 0.0
  target_entity: object
  weight: 0.7
