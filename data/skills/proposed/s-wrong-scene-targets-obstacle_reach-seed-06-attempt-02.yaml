dsl_version: 2
phases:
- control: position_control
  generator: linear_cartesian
  id: lift_from_start
  parameters:
    lift_height:
      binds_to:
      - mode: replace
        path: target.offset.z
      default: 0.35
      range:
      - 0.25
      - 0.5
      type: scalar
    lift_tolerance:
      binds_to:
      - mode: replace
        path: termination.pose_tolerance
      default: 0.03
      range:
      - 0.02
      - 0.06
      type: scalar
  retries:
    max_attempts: 0
    strategy: repeat
  target:
    anchor: current_tcp
    offset:
    - 0.0
    - 0.0
    - 0.35
    orientation:
      mode: none
    source: yaml
    tolerance: 0.03
  termination: pose_tolerance
  type: lift
- control: position_control
  generator: arc_cartesian
  id: approach_above_goal
  parameters:
    approach_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.08
      range:
      - 0.02
      - 0.15
      type: scalar
    approach_tolerance:
      binds_to:
      - mode: replace
        path: termination.pose_tolerance
      default: 0.03
      range:
      - 0.02
      - 0.06
      type: scalar
    arc_height:
      binds_to:
      - mode: replace
        path: generator.arc_height
      default: 0.12
      range:
      - 0.05
      - 0.2
      type: scalar
  retries:
    max_attempts: 0
    strategy: repeat
  subtask_id: approach_above_goal
  target:
    anchor: task_goal
    offset:
    - 0.0
    - 0.0
    - 0.2
    orientation:
      mode: none
    source: yaml
    tolerance: 0.03
  termination: pose_tolerance
  type: approach
- control: position_control
  generator: linear_cartesian
  guards:
  - args: {}
    id: contact_guard
    on_failure: retry
    predicate: contact_detected
    threshold: 1.0
    when: during_phase
  id: descend_to_goal
  parameters:
    descend_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.05
      range:
      - 0.01
      - 0.1
      type: scalar
    descend_tolerance:
      binds_to:
      - mode: replace
        path: termination.pose_tolerance
      default: 0.02
      range:
      - 0.01
      - 0.04
      type: scalar
  retries:
    max_attempts: 2
    offset:
    - 0.0
    - 0.05
    - 0.0
    strategy: offset_target
  subtask_id: reach_goal
  target:
    anchor: task_goal
    offset:
    - 0.0
    - 0.0
    - 0.0
    orientation:
      mode: none
    source: yaml
    tolerance: 0.02
  termination: pose_tolerance
  type: descend
skill: obstacle_reach
skill_type: arm_gripper
subtasks:
- anchor: goal
  id: approach_above_goal
  offset:
  - 0.0
  - 0.0
  - 0.2
  target_entity: tcp
  weight: 0.3
- anchor: goal
  id: reach_goal
  offset:
  - 0.0
  - 0.0
  - 0.0
  target_entity: tcp
  weight: 0.7
