dsl_version: 2
phases:
- control: position_control
  generator: arc_cartesian
  id: lift_clear
  orientation:
    mode: keep_current
  parameters:
    arc_height:
      binds_to:
      - mode: replace
        path: generator.arc_height
      default: 0.25
      range:
      - 0.1
      - 0.4
      type: scalar
  retries:
    max_attempts: 2
    strategy: reduce_speed
  subtask_id: clear_obstacle
  target:
    anchor: task_goal
    offset:
    - 0.0
    - 0.0
    - 0.35
    source: yaml
    tolerance: 0.02
  termination: pose_tolerance
  type: approach
- control: position_control
  generator: linear_cartesian
  id: descend_goal
  orientation:
    mode: keep_current
  parameters:
    descend_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.05
      range:
      - 0.01
      - 0.1
      type: scalar
  subtask_id: reach_goal
  target:
    anchor: task_goal
    offset:
    - 0.0
    - 0.0
    - 0.0
    source: yaml
    tolerance: 0.02
  termination: pose_tolerance
  type: descend
skill: obstacle_reach
skill_type: arm
subtasks:
- anchor: goal
  id: clear_obstacle
  metric: distance
  offset:
  - 0.0
  - 0.0
  - 0.35
  target_entity: tcp
  weight: 0.4
- anchor: goal
  id: reach_goal
  metric: distance
  offset:
  - 0.0
  - 0.0
  - 0.0
  target_entity: tcp
  weight: 0.6
