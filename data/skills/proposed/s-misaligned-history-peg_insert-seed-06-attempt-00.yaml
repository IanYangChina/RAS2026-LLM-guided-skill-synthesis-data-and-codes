dsl_version: 2
phases:
- control: position_control
  generator: linear_cartesian
  id: approach_hole
  orientation:
    align_with: channel_axis
    axis:
    - 0
    - 0
    - 1
    mode: align_axis
    tolerance: 0.05
  parameters:
    approach_height:
      binds_to:
      - mode: replace
        path: target.offset.z
      default: 0.1
      range:
      - 0.05
      - 0.2
      type: scalar
    speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.1
      range:
      - 0.05
      - 0.3
      type: scalar
  subtask_id: reach_approach
  target:
    anchor: task_goal
    entity: null
    offset:
    - 0
    - 0
    - 0.1
    orientation:
      align_with: channel_axis
      axis:
      - 0
      - 0
      - 1
      mode: align_axis
      tolerance: 0.05
    source: yaml
  termination: pose_tolerance
  type: approach
- control: impedance_control
  generator: linear_cartesian
  guards:
  - args: {}
    id: force_guard
    on_failure: abort
    predicate: force_below
    threshold: 40.0
    when: during_phase
  id: descend_contact
  orientation:
    mode: keep_current
  parameters:
    descend_distance:
      binds_to:
      - mode: replace
        path: target.offset_along_axis.distance
      default: 0.15
      range:
      - 0.05
      - 0.2
      type: scalar
    force_threshold:
      binds_to:
      - mode: replace
        path: termination.force_threshold
      default: 10.0
      range:
      - 5.0
      - 20.0
      type: scalar
    speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.03
      range:
      - 0.01
      - 0.05
      type: scalar
  retries:
    max_attempts: 2
    offset:
    - 0
    - 0
    - 0
    strategy: reduce_speed
  subtask_id: reach_insertion
  target:
    anchor: current_tcp
    entity: null
    offset:
    - 0
    - 0
    - 0
    offset_along_axis:
      axis: channel_axis
      distance: 0.15
      mode: add_to_offset
      sign: negative
    source: yaml
  termination: force_exceeded
  type: descend
- control: impedance_control
  generator: impedance_motion
  guards:
  - args: {}
    id: force_guard
    on_failure: abort
    predicate: force_below
    threshold: 40.0
    when: during_phase
  id: insert_deep
  orientation:
    mode: keep_current
  parameters:
    insertion_depth:
      binds_to:
      - mode: replace
        path: target.offset_along_axis.distance
      default: 0.05
      range:
      - 0.02
      - 0.06
      type: scalar
    push_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.01
      range:
      - 0.005
      - 0.03
      type: scalar
  subtask_id: reach_insertion
  target:
    anchor: current_tcp
    entity: null
    offset:
    - 0
    - 0
    - 0
    offset_along_axis:
      axis: channel_axis
      distance: 0.05
      mode: add_to_offset
      sign: negative
    source: yaml
  termination: pose_tolerance
  type: push
skill: peg_insert
skill_type: arm_gripper
subtasks:
- anchor: goal
  id: reach_approach
  metric: distance
  offset:
  - 0
  - 0
  - 0.1
  target_entity: tcp
  weight: 0.3
- anchor: goal
  id: reach_insertion
  metric: goal_progress
  offset:
  - 0
  - 0
  - -0.025
  target_entity: object
  weight: 0.7
