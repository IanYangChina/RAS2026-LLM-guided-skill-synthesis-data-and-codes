dsl_version: 2
phases:
- control: position_control
  generator: arc_cartesian
  id: approach_above
  parameters:
    speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.2
      range:
      - 0.05
      - 0.5
      type: scalar
  subtask_id: pre_contact
  target:
    anchor: task_object
    offset:
    - 0.0
    - 0.03
    - 0.1
    source: yaml
  termination: pose_tolerance
  type: approach
- control: position_control
  generator: linear_cartesian
  id: descend_contact
  parameters:
    offset_x:
      binds_to:
      - mode: replace
        path: target.offset.x
      default: 0.01
      range:
      - -0.02
      - 0.04
      type: scalar
    speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.03
      range:
      - 0.01
      - 0.1
      type: scalar
  subtask_id: pre_contact
  target:
    anchor: task_object
    offset:
    - 0.01
    - 0.03
    - 0.0
    source: yaml
  termination: pose_tolerance
  type: descend
- control: impedance_control
  generator: linear_cartesian
  guards:
  - args: {}
    id: check_goal
    on_failure: retry
    predicate: object_progress
    threshold: 0.02
    when: after_phase
  id: push_to_goal
  parameters:
    max_time:
      binds_to:
      - mode: replace
        path: duration.max_time
      default: 2.0
      range:
      - 0.5
      - 5.0
      type: scalar
    push_extra:
      binds_to:
      - mode: replace
        path: target.offset_along_axis.distance
      default: 0.015
      range:
      - 0.0
      - 0.04
      type: scalar
    speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.1
      range:
      - 0.02
      - 0.3
      type: scalar
  retries:
    max_attempts: 2
    offset:
    - 0.01
    - -0.04
    - 0
    strategy: offset_target
  subtask_id: push_goal
  target:
    anchor: task_goal
    offset:
    - 0.0
    - 0.0
    - 0.0
    offset_along_axis:
      axis: task_goal_direction
      distance: 0.015
      mode: add_to_offset
      sign: positive
    source: yaml
  termination: time_limit
  type: push
skill: push_to_goal
subtasks:
- anchor: object
  id: pre_contact
  offset:
  - 0.0
  - 0.03
  - 0.05
  weight: 0.3
- id: push_goal
  metric: goal_progress
  target_entity: object
  weight: 0.7
