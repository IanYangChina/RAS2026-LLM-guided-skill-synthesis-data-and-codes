dsl_version: 2
phases:
- control: position_control
  generator: linear_cartesian
  guards: []
  id: approach_behind
  parameters:
    approach_speed:
      binds_to:
      - mode: add
        path: generator.speed
      default: 0.1
      range:
      - 0.05
      - 0.2
      type: scalar
  retries:
    max_attempts: 1
    offset:
    - 0.0
    - 0.0
    - 0.0
    strategy: offset_target
  subtask_id: pre_push_approach
  target:
    anchor: task_object
    offset:
    - 0.0
    - 0.0
    - 0.02
    offset_along_axis:
      axis: push_direction
      distance: 0.05
      mode: add_to_offset
      sign: negative
    orientation:
      mode: keep_current
    source: yaml
    tolerance: 0.01
  termination: pose_tolerance
  type: approach
- control: impedance_control
  generator: linear_cartesian
  guards:
  - id: guard_force_ok
    on_failure: retry
    predicate: force_below
    threshold: 25.0
    when: during_phase
  id: push_to_goal
  parameters:
    push_distance:
      binds_to:
      - mode: replace
        path: target.offset_along_axis.distance
      default: 0.15
      range:
      - 0.05
      - 0.3
      type: scalar
    push_speed:
      binds_to:
      - mode: add
        path: generator.speed
      default: 0.04
      range:
      - 0.01
      - 0.08
      type: scalar
  retries:
    max_attempts: 2
    strategy: reduce_speed
  subtask_id: push_forward
  target:
    anchor: current_tcp
    offset:
    - 0.0
    - 0.0
    - 0.0
    offset_along_axis:
      axis: push_direction
      distance: 0.15
      mode: add_to_offset
      sign: positive
    orientation:
      mode: keep_current
    source: yaml
    tolerance: 0.02
  termination: time_limit
  type: push
- control: position_control
  generator: linear_cartesian
  guards: []
  id: retract_up
  parameters: {}
  retries:
    max_attempts: 0
    strategy: repeat
  target:
    anchor: current_tcp
    offset:
    - 0.0
    - 0.0
    - 0.08
    orientation:
      mode: keep_current
    source: yaml
  termination: pose_tolerance
  type: retract
skill: push_to_goal
skill_type: arm_gripper
subtasks:
- anchor: object
  id: pre_push_approach
  metric: distance
  offset:
  - 0.0
  - 0.0
  - 0.05
  target_entity: tcp
  weight: 0.3
- anchor: goal
  id: push_forward
  metric: distance
  offset:
  - 0.0
  - 0.0
  - 0.0
  target_entity: tcp
  weight: 0.7
