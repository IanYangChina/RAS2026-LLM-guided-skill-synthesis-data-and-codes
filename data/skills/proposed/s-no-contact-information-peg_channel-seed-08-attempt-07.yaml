dsl_version: 2
phases:
- control: position_control
  generator: linear_cartesian
  id: approach_1
  parameters:
    approach_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.15
      range:
      - 0.05
      - 0.3
      type: scalar
  subtask_id: reach_approach
  target:
    anchor: task_object
    entity: peg
    offset:
    - 0.0
    - 0.05
    - 0.1
    orientation:
      mode: keep_current
    source: yaml
    tolerance: 0.01
  termination: pose_tolerance
  type: approach
- control: position_control
  generator: linear_cartesian
  id: descend_1
  parameters:
    descend_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.05
      range:
      - 0.02
      - 0.1
      type: scalar
  subtask_id: reach_descent
  target:
    anchor: task_object
    entity: peg
    offset:
    - 0.0
    - 0.05
    - 0.0
    orientation:
      mode: keep_current
    source: yaml
    tolerance: 0.005
  termination: pose_tolerance
  type: descend
- control: force_threshold_switch
  generator: linear_cartesian
  id: contact_1
  parameters:
    contact_force_threshold:
      binds_to:
      - mode: replace
        path: termination.force_threshold
      default: 10.0
      range:
      - 5.0
      - 20.0
      type: scalar
    contact_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.03
      range:
      - 0.01
      - 0.06
      type: scalar
  retries:
    max_attempts: 2
    offset:
    - 0.0
    - 0.003
    - 0.0
    strategy: offset_target
  target:
    anchor: task_object
    entity: peg
    offset:
    - 0.0
    - -0.02
    - 0.0
    orientation:
      mode: keep_current
    source: yaml
    tolerance: 0.005
  termination: force_exceeded
  type: contact
- control: impedance_control
  generator: linear_cartesian
  guards:
  - id: object_progress
    on_failure: retry
    predicate: object_progress
    threshold: 0.02
    when: after_phase
  id: push_1
  parameters:
    push_force_threshold:
      binds_to:
      - mode: replace
        path: termination.force_threshold
      default: 38.0
      range:
      - 30.0
      - 45.0
      type: scalar
    push_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.04
      range:
      - 0.01
      - 0.1
      type: scalar
  retries:
    max_attempts: 2
    offset:
    - 0.008
    - 0.0
    - 0.0
    strategy: offset_target
  subtask_id: reach_goal
  target:
    anchor: current_tcp
    offset:
    - 0.0
    - 0.0
    - 0.0
    offset_along_axis:
      axis: channel_axis
      distance: 0.2
      mode: add_to_offset
      sign: negative
    orientation:
      align_with: channel_axis
      axis:
      - 0.0
      - 0.0
      - 1.0
      mode: align_axis
      tolerance: 0.1
    source: yaml
    tolerance: 0.02
  termination: force_exceeded
  type: push
skill: peg_channel
subtasks:
- anchor: object
  id: reach_approach
  metric: distance
  offset:
  - 0.0
  - 0.05
  - 0.1
  target_entity: tcp
  weight: 0.2
- anchor: object
  id: reach_descent
  metric: distance
  offset:
  - 0.0
  - 0.05
  - 0.0
  target_entity: tcp
  weight: 0.3
- anchor: goal
  id: reach_goal
  metric: goal_progress
  offset:
  - 0.0
  - 0.0
  - 0.0
  target_entity: tcp
  weight: 0.5
