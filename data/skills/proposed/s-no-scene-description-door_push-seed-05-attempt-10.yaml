dsl_version: 2
phases:
- control: position_control
  generator: arc_cartesian
  guards:
  - id: approach_pose_guard
    on_failure: retry
    predicate: pose_within_tolerance
    threshold: 0.03
    when: after_phase
  id: approach_1
  parameters:
    approach_height:
      binds_to:
      - mode: replace
        path: target.offset.z
      default: 0.5
      range:
      - 0.3
      - 0.7
      type: scalar
    approach_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.5
      range:
      - 0.1
      - 1.0
      type: scalar
    arc_height:
      binds_to:
      - mode: replace
        path: generator.arc_height
      default: 0.25
      range:
      - 0.1
      - 0.5
      type: scalar
  retries:
    max_attempts: 1
    offset:
    - 0.0
    - 0.0
    - 0.05
    strategy: offset_target
  subtask_id: reach_above
  target:
    anchor: task_object
    offset:
    - 0.0
    - 0.0
    - 0.5
    orientation:
      mode: keep_current
    source: yaml
    tolerance: 0.02
  termination: pose_tolerance
  type: approach
- control: force_threshold_switch
  generator: linear_cartesian
  id: descend_1
  parameters:
    contact_force_threshold:
      binds_to:
      - mode: replace
        path: termination.force_threshold
      default: 15.0
      range:
      - 5.0
      - 30.0
      type: scalar
    contact_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.05
      range:
      - 0.01
      - 0.1
      type: scalar
  subtask_id: contact_handle
  target:
    anchor: task_object
    offset:
    - 0.0
    - 0.0
    - 0.0
    orientation:
      mode: keep_current
    source: yaml
  termination: force_exceeded
  type: descend
- control: impedance_control
  generator: linear_cartesian
  guards:
  - id: hinge_progress_guard
    on_failure: continue
    predicate: hinge_delta_reached
    threshold: 0.5
    when: during_phase
  id: push_1
  parameters:
    push_distance:
      binds_to:
      - mode: replace
        path: target.offset_along_axis.distance
      default: 0.25
      range:
      - 0.1
      - 0.5
      type: scalar
    push_pose_tol:
      binds_to:
      - mode: replace
        path: termination.pose_tolerance
      default: 0.1
      range:
      - 0.05
      - 0.2
      type: scalar
    push_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.08
      range:
      - 0.02
      - 0.2
      type: scalar
  subtask_id: hinge_progress
  target:
    anchor: task_goal
    offset:
    - 0.0
    - 0.0
    - 0.0
    offset_along_axis:
      axis: task_goal_direction
      distance: 0.2
      mode: add_to_offset
      sign: positive
    orientation:
      mode: none
    source: yaml
    tolerance: 0.1
  termination: pose_tolerance
  type: push
skill: door_push
subtasks:
- anchor: object
  id: reach_above
  metric: distance
  offset:
  - 0.0
  - 0.0
  - 0.5
  target_entity: tcp
  weight: 0.2
- anchor: object
  id: contact_handle
  metric: distance
  offset:
  - 0.0
  - 0.0
  - 0.0
  target_entity: tcp
  weight: 0.3
- id: hinge_progress
  metric: hinge_angle
  target_entity: hinge
  weight: 0.5
