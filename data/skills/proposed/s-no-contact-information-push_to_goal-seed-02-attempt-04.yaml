dsl_version: 2
phases:
- control: position_control
  generator: linear_cartesian
  id: approach_behind
  orientation:
    mode: keep_current
  parameters:
    approach_offset_y:
      binds_to:
      - mode: replace
        path: target.offset.y
      default: -0.06
      range:
      - -0.15
      - -0.02
      type: scalar
  subtask_id: approach_behind
  target:
    anchor: task_object
    offset:
    - 0.0
    - -0.06
    - 0.05
    source: yaml
    tolerance: 0.02
  termination: pose_tolerance
  type: approach
- control: impedance_control
  generator: linear_cartesian
  id: descend_to_contact
  orientation:
    mode: keep_current
  parameters:
    descend_offset_y:
      binds_to:
      - mode: replace
        path: target.offset.y
      default: -0.06
      range:
      - -0.15
      - -0.02
      type: scalar
  retries:
    max_attempts: 1
    offset:
    - 0.0
    - 0.005
    - 0.0
    strategy: offset_target
  target:
    anchor: task_object
    offset:
    - 0.0
    - -0.06
    - 0.0
    source: yaml
  termination: contact_detected
  type: descend
- control: impedance_control
  generator: linear_cartesian
  guards:
  - args: {}
    id: push_force_guard
    on_failure: abort
    predicate: force_below
    threshold: 22.0
    when: during_phase
  - args: {}
    id: object_progress_guard
    on_failure: abort
    predicate: object_progress
    threshold: 0.5
    when: during_phase
  id: push_to_goal
  orientation:
    align_with: task_goal_direction
    axis:
    - 1
    - 0
    - 0
    mode: align_axis
    tolerance: 0.1
  parameters:
    force_threshold_guard:
      binds_to:
      - mode: replace
        path: guards.push_force_guard.threshold
      default: 22.0
      range:
      - 10.0
      - 25.0
      type: scalar
    push_distance:
      binds_to:
      - mode: replace
        path: target.offset_along_axis.distance
      default: 0.12
      range:
      - 0.05
      - 0.25
      type: scalar
  retries:
    max_attempts: 1
    offset:
    - 0.0
    - 0.005
    - 0.0
    strategy: offset_target
  subtask_id: push_object
  target:
    anchor: task_goal
    offset:
    - 0.0
    - 0.0
    - 0.0
    offset_along_axis:
      axis: task_goal_direction
      distance: 0.12
      mode: add_to_offset
      sign: negative
    source: yaml
    tolerance: 0.02
  termination: pose_tolerance
  type: push
skill: push_to_goal
subtasks:
- anchor: object
  id: approach_behind
  offset:
  - 0.0
  - -0.06
  - 0.05
  target_entity: tcp
  weight: 0.3
- anchor: goal
  id: push_object
  metric: goal_progress
  target_entity: object
  weight: 0.7
