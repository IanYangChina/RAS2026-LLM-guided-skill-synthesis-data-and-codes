dsl_version: 2
phases:
- control: position_control
  generator: linear_cartesian
  id: approach_1
  parameters:
    approach_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.5
      range:
      - 0.1
      - 1.0
      type: scalar
    approach_z_offset:
      binds_to:
      - mode: replace
        path: target.offset.z
      default: 0.1
      range:
      - 0.05
      - 0.15
      type: scalar
  subtask_id: pre_grasp
  target:
    anchor: task_object
    entity: grasp_target
    offset:
    - 0.0
    - 0.0
    - 0.1
    orientation:
      mode: keep_current
    source: yaml
    tolerance: 0.005
  termination: pose_tolerance
  type: approach
- control: force_threshold_switch
  generator: linear_cartesian
  id: descend_1
  parameters:
    descend_force_threshold:
      binds_to:
      - mode: replace
        path: termination.force_threshold
      default: 8.0
      range:
      - 2.0
      - 15.0
      type: scalar
    descend_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.3
      range:
      - 0.1
      - 0.5
      type: scalar
    descend_z_offset:
      binds_to:
      - mode: replace
        path: target.offset.z
      default: 0.0
      range:
      - -0.02
      - 0.03
      type: scalar
  subtask_id: pre_grasp
  target:
    anchor: task_object
    entity: grasp_target
    offset:
    - 0.0
    - 0.0
    - 0.0
    orientation:
      mode: keep_current
    source: yaml
    tolerance: 0.005
  termination: force_exceeded
  type: descend
- control: position_control
  end_effector_action: force_grasp
  guards:
  - id: bilateral_grasp_check
    on_failure: retry
    predicate: bilateral_grasp
    threshold: 1.0
    when: after_phase
  id: grasp_1
  parameters:
    grasp_retry_offset_z:
      binds_to:
      - mode: replace
        path: retry.offset.z
      default: -0.005
      range:
      - -0.02
      - 0.0
      type: scalar
    grasp_timeout:
      binds_to:
      - mode: replace
        path: duration.max_time
      default: 1.0
      range:
      - 0.5
      - 2.0
      type: scalar
  retries:
    max_attempts: 2
    offset:
    - 0.0
    - 0.0
    - -0.005
    strategy: offset_target
  target:
    anchor: current_tcp
    offset:
    - 0.0
    - 0.0
    - 0.0
    source: yaml
  termination: time_limit
  type: grasp
- control: position_control
  generator: linear_cartesian
  guards:
  - id: object_lifted_check
    on_failure: retry
    predicate: object_lifted
    threshold: 0.02
    when: after_phase
  id: lift_1
  parameters:
    lift_height_offset:
      binds_to:
      - mode: replace
        path: target.offset.z
      default: 0.15
      range:
      - 0.08
      - 0.2
      type: scalar
    lift_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.4
      range:
      - 0.2
      - 0.8
      type: scalar
  retries:
    max_attempts: 2
    offset:
    - 0.0
    - 0.0
    - 0.02
    strategy: offset_target
  subtask_id: lift
  target:
    anchor: task_object
    entity: grasp_target
    offset:
    - 0.0
    - 0.0
    - 0.15
    orientation:
      mode: keep_current
    source: yaml
    tolerance: 0.01
  termination: pose_tolerance
  type: lift
- control: position_control
  generator: linear_cartesian
  id: transport_1
  parameters:
    transport_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.4
      range:
      - 0.2
      - 0.8
      type: scalar
    transport_z_offset:
      binds_to:
      - mode: replace
        path: target.offset.z
      default: 0.15
      range:
      - 0.05
      - 0.2
      type: scalar
  subtask_id: place_goal
  target:
    anchor: task_goal
    entity: placement_surface
    offset:
    - 0.0
    - 0.0
    - 0.15
    orientation:
      mode: keep_current
    source: yaml
    tolerance: 0.01
  termination: pose_tolerance
  type: approach
- control: position_control
  end_effector_action: open
  id: release_1
  parameters:
    release_timeout:
      binds_to:
      - mode: replace
        path: duration.max_time
      default: 1.0
      range:
      - 0.5
      - 2.0
      type: scalar
  target:
    anchor: current_tcp
    offset:
    - 0.0
    - 0.0
    - 0.0
    source: yaml
  termination: time_limit
  type: release
- control: position_control
  generator: linear_cartesian
  id: retract_1
  parameters:
    retract_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.5
      range:
      - 0.2
      - 1.0
      type: scalar
    retract_z_offset:
      binds_to:
      - mode: replace
        path: target.offset.z
      default: 0.15
      range:
      - 0.1
      - 0.2
      type: scalar
  target:
    anchor: current_tcp
    offset:
    - 0.0
    - 0.0
    - 0.15
    orientation:
      mode: keep_current
    source: yaml
    tolerance: 0.01
  termination: pose_tolerance
  type: retract
skill: grasp_place
skill_type: arm_gripper
subtasks:
- anchor: object
  id: pre_grasp
  offset:
  - 0.0
  - 0.0
  - 0.06
  weight: 0.3
- anchor: object
  id: lift
  offset:
  - 0.0
  - 0.0
  - 0.15
  weight: 0.3
- anchor: goal
  id: place_goal
  metric: goal_progress
  weight: 0.4
