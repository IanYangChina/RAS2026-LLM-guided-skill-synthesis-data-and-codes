dsl_version: 2
phases:
- control: position_control
  generator: linear_cartesian
  id: approach_entry
  orientation:
    mode: keep_current
  parameters:
    speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.07
      range:
      - 0.01
      - 0.2
      type: scalar
  subtask_id: reach_entry
  target:
    anchor: fixture
    offset:
    - 0
    - 0
    - 0.055
    source: yaml
  termination: time_limit
  type: approach
- control: position_control
  generator: linear_cartesian
  id: align_xy
  orientation:
    mode: keep_current
  parameters:
    lateral_offset_x:
      binds_to:
      - mode: add
        path: target.offset.x
      default: 0.0
      range:
      - -0.05
      - 0.05
      type: scalar
    lateral_offset_y:
      binds_to:
      - mode: add
        path: target.offset.y
      default: 0.0
      range:
      - -0.05
      - 0.05
      type: scalar
  subtask_id: reach_entry
  target:
    anchor: fixture
    offset:
    - 0
    - 0
    - 0.055
    source: yaml
  termination: time_limit
  type: align
- control: position_control
  generator: linear_cartesian
  id: descend_to_entry
  orientation:
    mode: keep_current
  parameters:
    speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.06
      range:
      - 0.01
      - 0.2
      type: scalar
  subtask_id: reach_entry
  target:
    anchor: fixture
    offset:
    - 0
    - 0
    - 0.055
    source: yaml
  termination: time_limit
  type: descend
- control: impedance_control
  generator: linear_cartesian
  id: insert_into_hole
  orientation:
    mode: keep_current
  parameters:
    force_threshold:
      binds_to:
      - mode: replace
        path: termination.force_threshold
      default: 30.0
      range:
      - 10
      - 40
      type: scalar
    insertion_depth:
      binds_to:
      - mode: replace
        path: target.offset_along_axis.distance
      default: 0.05
      range:
      - 0.01
      - 0.1
      type: scalar
  subtask_id: insert
  target:
    anchor: fixture
    offset:
    - 0
    - 0
    - 0.0
    offset_along_axis:
      axis: insertion_axis
      distance: 0.05
      mode: replace_offset_projection
      sign: positive
    source: yaml
  termination: force_exceeded
  type: insert
- control: position_control
  generator: linear_cartesian
  id: retract
  orientation:
    mode: keep_current
  parameters:
    retract_height:
      binds_to:
      - mode: replace
        path: target.offset.z
      default: 0.07
      range:
      - 0.01
      - 0.15
      type: scalar
  target:
    anchor: fixture
    offset:
    - 0
    - 0
    - 0.08
    source: yaml
  termination: time_limit
  type: retract
skill: peg_insert
skill_type: arm_gripper
subtasks:
- anchor: fixture
  id: reach_entry
  metric: distance
  offset:
  - 0
  - 0
  - 0.055
  target_entity: tcp
  weight: 0.5
- anchor: fixture
  id: insert
  metric: distance
  offset:
  - 0
  - 0
  - 0.0
  target_entity: tcp
  weight: 0.5
