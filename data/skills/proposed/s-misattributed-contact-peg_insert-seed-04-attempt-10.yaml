dsl_version: 2
phases:
- control: position_control
  generator: linear_cartesian
  id: approach_1
  parameters:
    approach_speed:
      binds_to:
      - mode: add
        path: generator.speed
      default: 0.03
      range:
      - 0.01
      - 0.05
      type: scalar
  subtask_id: approach_above_socket
  target:
    anchor: fixture
    entity: peg_socket
    offset:
    - 0.0
    - 0.0
    - 0.12
    orientation:
      align_with: insertion_axis
      axis:
      - 0
      - 0
      - 1
      mode: align_axis
      tolerance: 0.1
    tolerance: 0.02
  termination: pose_tolerance
  type: approach
- control: position_control
  generator: linear_cartesian
  id: align_1
  parameters:
    align_speed:
      binds_to:
      - mode: add
        path: generator.speed
      default: 0.02
      range:
      - 0.01
      - 0.04
      type: scalar
    lateral_x:
      binds_to:
      - mode: add
        path: target.offset.x
      default: 0.0
      range:
      - -0.01
      - 0.01
      type: scalar
    lateral_y:
      binds_to:
      - mode: add
        path: target.offset.y
      default: 0.0
      range:
      - -0.01
      - 0.01
      type: scalar
  subtask_id: align_to_entry
  target:
    anchor: fixture
    entity: peg_socket
    offset:
    - 0.0
    - 0.0
    - 0.055
    orientation:
      align_with: insertion_axis
      axis:
      - 0
      - 0
      - 1
      mode: align_axis
      tolerance: 0.05
    tolerance: 0.01
  termination: pose_tolerance
  type: align
- control: admittance_control
  end_effector_action: open
  generator: linear_cartesian
  id: release_1
  parameters:
    release_speed:
      binds_to:
      - mode: add
        path: generator.speed
      default: 0.01
      range:
      - 0.005
      - 0.02
      type: scalar
  subtask_id: align_to_entry
  target:
    anchor: fixture
    entity: peg_socket
    offset:
    - 0.0
    - 0.0
    - 0.04
    orientation:
      align_with: insertion_axis
      axis:
      - 0
      - 0
      - 1
      mode: align_axis
      tolerance: 0.05
    tolerance: 0.015
  termination: pose_tolerance
  type: release
- control: impedance_control
  generator: impedance_motion
  id: insert_1
  parameters:
    insertion_depth:
      binds_to:
      - mode: replace
        path: target.offset_along_axis.distance
      default: 0.05
      range:
      - 0.03
      - 0.06
      type: scalar
    insertion_force:
      binds_to:
      - mode: replace
        path: termination.force_threshold
      default: 10.0
      range:
      - 5.0
      - 20.0
      type: scalar
  subtask_id: insert_peg
  target:
    anchor: fixture
    entity: peg_socket
    offset:
    - 0.0
    - 0.0
    - 0.005
    offset_along_axis:
      axis: channel_axis
      distance: 0.05
      mode: add_to_offset
      sign: positive
    orientation:
      align_with: insertion_axis
      axis:
      - 0
      - 0
      - 1
      mode: align_axis
      tolerance: 0.05
    tolerance: 0.02
  termination: force_exceeded
  type: insert
skill: peg_insert
skill_type: arm_gripper
subtasks:
- anchor: fixture
  id: approach_above_socket
  metric: distance
  offset:
  - 0.0
  - 0.0
  - 0.12
  target_entity: tcp
  weight: 0.2
- anchor: fixture
  id: align_to_entry
  metric: distance
  offset:
  - 0.0
  - 0.0
  - 0.055
  target_entity: tcp
  weight: 0.3
- anchor: goal
  id: insert_peg
  metric: goal_progress
  offset:
  - 0.0
  - 0.0
  - 0.0
  target_entity: object
  weight: 0.5
