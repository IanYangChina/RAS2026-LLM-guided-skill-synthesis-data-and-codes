dsl_version: 2
phases:
- control: position_control
  generator: linear_cartesian
  guards: []
  id: approach_entrance
  parameters: {}
  retries:
    max_attempts: 0
  subtask_id: approach_entrance
  target:
    anchor: fixture
    entity: channel
    offset:
    - 0.0
    - 0.0
    - 0.04
    orientation:
      align_with: channel_axis
      axis:
      - 0
      - 0
      - 1
      mode: align_axis
      tolerance: 0.05
    source: yaml
    tolerance: 0.01
  termination: pose_tolerance
  type: approach
- control: impedance_control
  generator: linear_cartesian
  guards:
  - args: {}
    id: force_stall
    on_failure: retry
    predicate: force_below
    threshold: 5.0
    when: during_phase
  id: push_along_channel
  parameters:
    push_distance:
      binds_to:
      - mode: replace
        path: target.offset_along_axis.distance
      default: 0.16
      range:
      - 0.08
      - 0.2
      type: scalar
    push_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.03
      range:
      - 0.01
      - 0.05
      type: scalar
  retries:
    max_attempts: 2
    offset:
    - 0.0
    - 0.0
    - 0.0
    strategy: reduce_speed
  subtask_id: push_through_channel
  target:
    anchor: fixture
    entity: channel
    offset:
    - 0.0
    - 0.0
    - 0.0
    offset_along_axis:
      axis: channel_axis
      distance: 0.16
      mode: add_to_offset
      sign: positive
    orientation:
      mode: keep_current
    source: yaml
    tolerance: 0.02
  termination: time_limit
  type: push
skill: peg_channel
skill_type: arm_gripper
subtasks:
- anchor: fixture
  id: approach_entrance
  metric: distance
  offset:
  - 0.0
  - 0.0
  - 0.04
  target_entity: tcp
  weight: 0.3
- anchor: goal
  id: push_through_channel
  metric: goal_progress
  target_entity: object
  weight: 0.7
