dsl_version: 2
phases:
- control: position_control
  generator: arc_cartesian
  id: approach_1
  parameters:
    arc_height:
      binds_to:
      - mode: replace
        path: generator.arc_height
      default: 0.05
      range:
      - 0.02
      - 0.1
      type: scalar
    speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.08
      range:
      - 0.02
      - 0.15
      type: scalar
  subtask_id: approach
  target:
    anchor: task_object
    entity: push_box
    offset:
    - 0
    - 0
    - 0.08
    orientation:
      mode: keep_current
    source: yaml
    tolerance: 0.01
  termination: pose_tolerance
  type: approach
- control: force_threshold_switch
  generator: linear_cartesian
  id: contact_1
  parameters:
    speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.02
      range:
      - 0.005
      - 0.05
      type: scalar
  subtask_id: contact
  target:
    anchor: task_object
    entity: push_box
    offset:
    - 0
    - 0
    - 0.03
    orientation:
      mode: keep_current
    source: yaml
    tolerance: 0.01
  termination: contact_detected
  type: contact
- control: impedance_control
  generator: impedance_motion
  guards:
  - args: {}
    id: force_limit_guard
    on_failure: retry
    predicate: force_below
    threshold: 20.0
    when: during_phase
  id: push_1
  parameters:
    force_limit:
      binds_to:
      - mode: replace
        path: guards.force_limit_guard.threshold
      default: 20.0
      range:
      - 10.0
      - 25.0
      type: scalar
    push_depth:
      binds_to:
      - mode: replace
        path: target.offset_along_axis.distance
      default: 0.1
      range:
      - 0.02
      - 0.15
      type: scalar
  retries:
    max_attempts: 2
    offset:
    - 0
    - 0.01
    - 0
    strategy: offset_target
  subtask_id: push
  target:
    anchor: task_goal
    entity: goal_marker
    offset:
    - 0
    - 0
    - 0
    offset_along_axis:
      axis: task_goal_direction
      distance: 0.1
      mode: add_to_offset
      sign: positive
    orientation:
      mode: none
    source: yaml
    tolerance: 0.02
  termination: pose_tolerance
  type: push
- control: position_control
  generator: linear_cartesian
  id: retract_1
  parameters:
    retract_height:
      binds_to:
      - mode: replace
        path: target.offset.z
      default: 0.1
      range:
      - 0.05
      - 0.2
      type: scalar
  target:
    anchor: current_tcp
    offset:
    - 0
    - 0
    - 0.1
    orientation:
      mode: keep_current
    source: yaml
    tolerance: 0.01
  termination: pose_tolerance
  type: retract
skill: push_to_goal
