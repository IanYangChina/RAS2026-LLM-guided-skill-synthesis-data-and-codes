dsl_version: 2
phases:
- control: position_control
  generator: linear_cartesian
  id: approach_side
  orientation:
    mode: keep_current
  parameters:
    speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.35
      range:
      - 0.2
      - 0.5
      type: scalar
  subtask_id: reach_side
  target:
    anchor: task_goal
    offset:
    - 0.0
    - 0.3
    - 0.45
    source: yaml
    tolerance: 0.03
  termination: pose_tolerance
  type: approach
- control: position_control
  generator: arc_cartesian
  id: arc_above_goal
  orientation:
    mode: keep_current
  parameters:
    arc_height:
      binds_to:
      - mode: replace
        path: generator.arc_height
      default: 0.2
      range:
      - 0.1
      - 0.3
      type: scalar
    speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.2
      range:
      - 0.1
      - 0.3
      type: scalar
  subtask_id: above_goal
  target:
    anchor: task_goal
    offset:
    - 0.0
    - 0.0
    - 0.45
    source: yaml
    tolerance: 0.03
  termination: pose_tolerance
  type: align
- control: position_control
  generator: linear_cartesian
  guards:
  - args: {}
    id: low_force
    on_failure: retry
    predicate: force_below
    threshold: 4.0
    when: during_phase
  id: descend_to_goal
  orientation:
    mode: keep_current
  parameters:
    retry_offset_y:
      binds_to:
      - mode: replace
        path: retry.offset.y
      default: 0.03
      range:
      - 0.01
      - 0.05
      type: scalar
  retries:
    max_attempts: 1
    offset:
    - 0.0
    - 0.03
    - 0.0
    strategy: offset_target
  subtask_id: reach_goal
  target:
    anchor: task_goal
    offset:
    - 0.0
    - 0.0
    - 0.0
    source: yaml
    tolerance: 0.03
  termination: pose_tolerance
  type: descend
skill: obstacle_reach
subtasks:
- anchor: goal
  id: reach_side
  offset:
  - 0.0
  - 0.3
  - 0.45
  target_entity: tcp
  weight: 0.15
- anchor: goal
  id: above_goal
  offset:
  - 0.0
  - 0.0
  - 0.45
  target_entity: tcp
  weight: 0.15
- anchor: goal
  id: reach_goal
  offset:
  - 0.0
  - 0.0
  - 0.0
  target_entity: tcp
  weight: 0.7
