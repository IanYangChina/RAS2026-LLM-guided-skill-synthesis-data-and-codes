dsl_version: 2
phases:
- control: position_control
  generator: linear_cartesian
  id: approach_1
  parameters:
    approach_speed:
      binds_to:
      - mode: add
        path: generator.speed
      default: 0.1
      range:
      - 0.05
      - 0.2
      type: scalar
  subtask_id: reach_contact
  target:
    anchor: task_object
    entity: tcp
    offset:
    - 0.15
    - 0.15
    - 0.42
    orientation:
      align_with: world_z
      axis:
      - 0
      - 0
      - -1
      mode: align_axis
    source: yaml
    tolerance: 0.02
  termination: pose_tolerance
  type: approach
- control: force_threshold_switch
  generator: linear_cartesian
  id: contact_1
  parameters:
    contact_force_threshold:
      binds_to:
      - mode: add
        path: termination.force_threshold
      default: 10.0
      range:
      - 5.0
      - 20.0
      type: scalar
  subtask_id: reach_contact
  target:
    anchor: current_tcp
    offset:
    - 0.0
    - -0.02
    - 0.0
    source: yaml
  termination: force_exceeded
  type: contact
- control: impedance_control
  generator: linear_cartesian
  guards:
  - args: {}
    id: force_check
    on_failure: retry
    predicate: force_below
    threshold: 25.0
    when: during_phase
  id: push_1
  parameters:
    push_distance:
      binds_to:
      - mode: add
        path: target.offset_along_axis.distance
      default: 0.15
      range:
      - 0.05
      - 0.3
      type: scalar
    push_speed:
      binds_to:
      - mode: add
        path: generator.speed
      default: 0.05
      range:
      - 0.02
      - 0.1
      type: scalar
  subtask_id: push_result
  target:
    anchor: task_goal
    entity: tcp
    offset:
    - 0.0
    - 0.0
    - 0.0
    offset_along_axis:
      axis: task_goal_direction
      distance: 0.2
      sign: positive
    orientation:
      align_with: task_goal_direction
      axis:
      - 0
      - 0
      - -1
      mode: align_axis
    source: yaml
    tolerance: 0.05
  termination: contact_lost
  type: push
skill: door_push
subtasks:
- anchor: object
  id: reach_contact
  offset:
  - 0.15
  - 0.15
  - 0.42
  target_entity: tcp
  weight: 0.3
- anchor: goal
  id: push_result
  offset:
  - 0.0
  - 0.0
  - 0.0
  target_entity: tcp
  weight: 0.7
