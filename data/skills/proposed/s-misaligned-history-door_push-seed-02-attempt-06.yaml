dsl_version: 2
phases:
- control: position_control
  generator: linear_cartesian
  id: approach_handle
  parameters:
    approach_tol:
      binds_to:
      - mode: replace
        path: termination.pose_tolerance
      default: 0.06
      range:
      - 0.02
      - 0.12
      type: scalar
    speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.05
      range:
      - 0.01
      - 0.15
      type: scalar
  subtask_id: approach_handle
  target:
    anchor: body
    entity: door_handle
    offset:
    - 0.0
    - 0.0
    - 0.05
    orientation:
      mode: keep_current
    source: yaml
  termination: pose_tolerance
  type: approach
- control: position_control
  generator: linear_cartesian
  id: align_push
  parameters:
    align_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.04
      range:
      - 0.01
      - 0.1
      type: scalar
    align_tol:
      binds_to:
      - mode: replace
        path: termination.pose_tolerance
      default: 0.04
      range:
      - 0.01
      - 0.08
      type: scalar
  subtask_id: approach_handle
  target:
    anchor: body
    entity: door_handle
    offset:
    - 0.0
    - 0.0
    - 0.0
    orientation:
      align_with: world_y
      axis:
      - 1.0
      - 0.0
      - 0.0
      mode: align_axis
      tolerance: 0.1
    source: yaml
  termination: pose_tolerance
  type: align
- control: impedance_control
  generator: linear_cartesian
  guards:
  - id: hinge_check
    on_failure: continue
    predicate: hinge_delta_reached
    threshold: 0.5
    when: after_phase
  - id: force_limit
    on_failure: abort
    predicate: force_below
    threshold: 30.0
    when: during_phase
  id: push_door
  parameters:
    force_threshold:
      binds_to:
      - mode: replace
        path: termination.force_threshold
      default: 25.0
      range:
      - 15.0
      - 30.0
      type: scalar
    push_dist:
      binds_to:
      - mode: replace
        path: target.offset_along_axis.distance
      default: 0.15
      range:
      - 0.05
      - 0.35
      type: scalar
    push_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.08
      range:
      - 0.02
      - 0.15
      type: scalar
  retries:
    max_attempts: 1
    offset:
    - 0.0
    - -0.01
    - 0.0
    strategy: reduce_speed
  subtask_id: push_task
  target:
    anchor: body
    entity: door_handle
    offset:
    - 0.0
    - 0.0
    - 0.0
    offset_along_axis:
      axis: world_y
      distance: 0.15
      mode: add_to_offset
      sign: negative
    orientation:
      mode: none
    source: yaml
  termination: force_exceeded
  type: push
skill: door_push
subtasks:
- anchor: fixture
  id: approach_handle
  metric: distance
  offset:
  - -0.4
  - 0.0
  - 0.35
  target_entity: tcp
  weight: 0.2
- anchor: fixture
  id: push_task
  metric: hinge_angle
  target_entity: hinge
  weight: 0.8
