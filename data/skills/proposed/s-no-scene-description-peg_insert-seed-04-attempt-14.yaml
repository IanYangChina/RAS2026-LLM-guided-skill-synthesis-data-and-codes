skill: peg_insert
dsl_version: 2
skill_type: arm_gripper
subtasks:
  - id: approach_hole
    anchor: goal
    target_entity: tcp
    metric: distance
    offset: [0, 0, 0.02]
    weight: 0.3
  - id: insert_to_goal
    anchor: goal
    target_entity: tcp
    metric: distance
    offset: [0, 0, -0.03]
    weight: 0.7
phases:
  - id: push_1
    type: push
    subtask_id: approach_hole
    generator: linear_cartesian
    control: position_control
    termination: time_limit
    target:
      source: yaml
      anchor: task_goal
      offset: [0, 0, 0.02]
      offset_along_axis:
        distance: 0.08
        axis: world_z
        mode: replace_offset_projection
        sign: negative
      orientation:
        mode: keep_current
    parameters:
      push_distance:
        type: scalar
        range: [0.02, 0.2]
        default: 0.08
        binds_to:
          - path: target.offset_along_axis.distance
            mode: replace
      push_speed:
        type: scalar
        range: [0.01, 0.1]
        default: 0.05
        binds_to:
          - path: generator.speed
            mode: replace
  - id: align_1
    type: align
    subtask_id: approach_hole
    generator: linear_cartesian
    control: position_control
    termination: pose_tolerance
    target:
      source: yaml
      anchor: task_goal
      offset: [0, 0, 0.0]
      orientation:
        mode: align_axis
        axis: [0, 0, 1]
        align_with: world_z
        tolerance: 0.05
    parameters:
      lateral_offset_x:
        type: scalar
        range: [-0.01, 0.01]
        default: 0.0
        binds_to:
          - path: target.offset.x
            mode: replace
      lateral_offset_y:
        type: scalar
        range: [-0.01, 0.01]
        default: 0.0
        binds_to:
          - path: target.offset.y
            mode: replace
  - id: insert_1
    type: insert
    subtask_id: insert_to_goal
    generator: impedance_motion
    control: impedance_control
    termination: force_exceeded
    target:
      source: yaml
      anchor: task_goal
      offset: [0, 0, 0.0]
      offset_along_axis:
        distance: 0.06
        axis: world_z
        mode: replace_offset_projection
        sign: negative
      orientation:
        mode: align_axis
        axis: [0, 0, 1]
        align_with: world_z
        tolerance: 0.05
    parameters:
      insertion_depth:
        type: scalar
        range: [0.01, 0.15]
        default: 0.06
        binds_to:
          - path: target.offset_along_axis.distance
            mode: replace
      insertion_force:
        type: scalar
        range: [1.0, 20.0]
        default: 10.0
        binds_to:
          - path: termination.force_threshold
            mode: replace
  - id: release_1
    type: release
    generator: null
    control: position_control
    termination: time_limit
    end_effector_action: open
    target:
      source: yaml
      anchor: current_tcp
      offset: [0, 0, 0]
  - id: retract_1
    type: retract
    generator: linear_cartesian
    control: position_control
    termination: pose_tolerance
    target:
      source: yaml
      anchor: task_goal
      offset: [0, 0, 0.1]
      orientation:
        mode: keep_current
