dsl_version: 2
phases:
- control: position_control
  generator: impedance_motion
  id: rotate_1
  parameters:
    descent_offset:
      binds_to:
      - mode: scale
        path: target.offset.z
      default: -0.2
      range:
      - -0.25
      - -0.15
      type: scalar
  target:
    anchor: current_tcp
    entity: null
    offset:
    - 0.0
    - 0.0
    - -0.2
    orientation:
      mode: keep_current
    source: yaml
  termination: pose_tolerance
  type: rotate
- control: position_control
  generator: arc_cartesian
  id: retract_1
  parameters:
    retract_height:
      binds_to:
      - mode: scale
        path: target.offset.z
      default: 0.16
      range:
      - 0.12
      - 0.2
      type: scalar
  subtask_id: approach_socket
  target:
    anchor: current_tcp
    entity: null
    offset:
    - 0.0
    - 0.024
    - 0.16
    orientation:
      mode: keep_current
    source: yaml
  termination: pose_tolerance
  type: retract
- control: admittance_control
  generator: linear_cartesian
  id: descend_1
  parameters:
    depth:
      binds_to:
      - mode: scale
        path: target.offset.z
      default: 0.11
      range:
      - 0.08
      - 0.14
      type: scalar
  target:
    anchor: current_tcp
    entity: null
    offset:
    - 0.0
    - 0.0
    - 0.11
    orientation:
      mode: keep_current
    source: yaml
  termination: pose_tolerance
  type: descend
- control: impedance_control
  generator: arc_cartesian
  id: pull_1
  parameters:
    pull_distance:
      binds_to:
      - mode: scale
        path: target.offset.z
      default: 0.22
      range:
      - 0.18
      - 0.24
      type: scalar
  target:
    anchor: current_tcp
    entity: null
    offset:
    - 0.0
    - 0.003
    - -0.22
    orientation:
      mode: keep_current
    source: yaml
  termination: time_limit
  type: pull
- control: impedance_control
  generator: linear_cartesian
  guards:
  - args: {}
    id: force_guard
    on_failure: retry
    predicate: force_below
    threshold: 35.0
    when: during_phase
  id: insert_1
  parameters:
    insertion_depth:
      binds_to:
      - mode: scale
        path: target.offset_along_axis.distance
      default: 0.04
      range:
      - 0.02
      - 0.06
      type: scalar
    insertion_speed:
      binds_to:
      - mode: scale
        path: generator.speed
      default: 0.015
      range:
      - 0.005
      - 0.025
      type: scalar
  retries:
    max_attempts: 2
    offset:
    - 0.005
    - 0.005
    - 0.0
    strategy: offset_target
  subtask_id: insertion_progress
  target:
    anchor: fixture
    entity: null
    offset:
    - 0.0
    - 0.0
    - 0.0
    offset_along_axis:
      axis: insertion_axis
      distance: 0.04
      mode: replace_offset_projection
      sign: negative
    orientation:
      align_with: insertion_axis
      axis:
      - 0.0
      - 0.0
      - 1.0
      mode: align_axis
    source: yaml
  termination: time_limit
  type: insert
skill: peg_insert
subtasks:
- anchor: fixture
  id: approach_socket
  metric: distance
  offset:
  - 0.0
  - 0.0
  - 0.055
  target_entity: tcp
  weight: 0.3
- anchor: fixture
  id: insertion_progress
  metric: goal_progress
  offset:
  - 0.0
  - 0.0
  - 0.0
  target_entity: object
  weight: 0.7
