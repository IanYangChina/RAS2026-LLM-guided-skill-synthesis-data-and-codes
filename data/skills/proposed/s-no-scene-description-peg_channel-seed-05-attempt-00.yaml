dsl_version: 2
phases:
- control: position_control
  generator: linear_cartesian
  id: approach_peg
  parameters:
    approach_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.05
      range:
      - 0.02
      - 0.08
      type: scalar
  subtask_id: reach_peg
  target:
    anchor: task_object
    offset:
    - 0.0
    - 0.0
    - 0.1
    orientation:
      align_with: world_y
      axis:
      - 0.0
      - 0.0
      - 1.0
      mode: align_axis
      tolerance: 0.1
    source: yaml
    tolerance: 0.005
  termination: pose_tolerance
  type: approach
- control: position_control
  end_effector_action: force_grasp
  generator: null
  guards:
  - args: {}
    id: grasp_check
    on_failure: retry
    predicate: bilateral_grasp
    threshold: 1.0
    when: after_phase
  id: grasp_peg
  retries:
    max_attempts: 2
    strategy: repeat
  subtask_id: grasp_peg
  target:
    anchor: current_tcp
    source: yaml
  termination: time_limit
  type: grasp
- control: position_control
  generator: linear_cartesian
  id: lift_peg
  parameters:
    lift_height:
      binds_to:
      - mode: replace
        path: target.offset.z
      default: 0.03
      range:
      - 0.01
      - 0.06
      type: scalar
    lift_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.03
      range:
      - 0.01
      - 0.05
      type: scalar
  target:
    anchor: current_tcp
    offset:
    - 0.0
    - 0.0
    - 0.03
    orientation:
      mode: keep_current
    source: yaml
    tolerance: 0.005
  termination: pose_tolerance
  type: lift
- control: impedance_control
  generator: linear_cartesian
  guards:
  - args: {}
    id: force_limit
    on_failure: abort
    predicate: force_below
    threshold: 40.0
    when: during_phase
  id: insert_peg
  parameters:
    insert_distance:
      binds_to:
      - mode: replace
        path: target.offset_along_axis.distance
      default: 0.16
      range:
      - 0.08
      - 0.2
      type: scalar
    insert_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.02
      range:
      - 0.005
      - 0.04
      type: scalar
  subtask_id: insert_peg
  target:
    anchor: current_tcp
    offset_along_axis:
      axis: task_goal_direction
      distance: 0.16
      mode: replace_offset_projection
      sign: negative
    orientation:
      mode: keep_current
    source: yaml
    tolerance: 0.008
  termination: pose_tolerance
  type: push
- control: position_control
  generator: linear_cartesian
  id: retract_peg
  parameters:
    retract_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.05
      range:
      - 0.02
      - 0.08
      type: scalar
  target:
    anchor: current_tcp
    offset:
    - 0.0
    - 0.0
    - 0.1
    orientation:
      mode: keep_current
    source: yaml
    tolerance: 0.01
  termination: pose_tolerance
  type: retract
skill: peg_channel
skill_type: arm_gripper
subtasks:
- anchor: object
  id: reach_peg
  metric: distance
  offset:
  - 0.0
  - 0.0
  - 0.1
  target_entity: tcp
  weight: 0.2
- anchor: object
  id: grasp_peg
  metric: contact
  offset:
  - 0.0
  - 0.0
  - 0.0
  target_entity: tcp
  weight: 0.1
- anchor: goal
  id: insert_peg
  metric: goal_progress
  offset:
  - 0.0
  - 0.0
  - 0.0
  target_entity: tcp
  weight: 0.7
