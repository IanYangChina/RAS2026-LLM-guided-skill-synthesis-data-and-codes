skill: obstacle_reach
dsl_version: 2
subtasks:
- id: reach_pre_goal
  anchor: goal
  target_entity: tcp
  metric: distance
  offset:
  - 0.0
  - 0.0
  - 0.08
  weight: 0.3
- id: reach_goal
  anchor: goal
  target_entity: tcp
  metric: distance
  offset:
  - 0.0
  - 0.0
  - 0.0
  weight: 0.7
phases:
- id: approach_over_obstacle
  type: approach
  generator: arc_cartesian
  control: position_control
  termination: pose_tolerance
  target:
    source: yaml
    anchor: task_goal
    offset:
    - 0.0
    - 0.0
    - 0.08
    tolerance: 0.02
    orientation:
      mode: keep_current
  parameters:
    approach_speed:
      type: scalar
      range:
      - 0.15
      - 0.8
      default: 0.3
      binds_to:
      - path: generator.speed
        mode: replace
    arc_height:
      type: scalar
      range:
      - 0.15
      - 0.4
      default: 0.22
      binds_to:
      - path: generator.arc_height
        mode: replace
  subtask_id: reach_pre_goal
- id: descend_to_goal
  type: descend
  generator: linear_cartesian
  control: position_control
  termination: pose_tolerance
  target:
    source: yaml
    anchor: task_goal
    offset:
    - 0.0
    - 0.0
    - 0.0
    tolerance: 0.02
    orientation:
      mode: keep_current
  parameters:
    descend_speed:
      type: scalar
      range:
      - 0.1
      - 0.5
      default: 0.2
      binds_to:
      - path: generator.speed
        mode: replace
  subtask_id: reach_goal
