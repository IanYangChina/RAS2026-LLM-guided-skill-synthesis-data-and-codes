dsl_version: 2
phases:
- control: position_control
  generator: linear_cartesian
  id: approach_1
  parameters:
    approach_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.05
      range:
      - 0.02
      - 0.1
      type: scalar
  subtask_id: reach_above
  target:
    anchor: task_goal
    offset:
    - 0.0
    - 0.0
    - 0.08
    orientation:
      align_with: world_z
      axis:
      - 0.0
      - 0.0
      - 1.0
      mode: align_axis
      tolerance: 0.05
    source: yaml
    tolerance: 0.01
  termination: pose_tolerance
  type: approach
- control: position_control
  generator: linear_cartesian
  id: align_1
  parameters:
    align_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.02
      range:
      - 0.01
      - 0.05
      type: scalar
    lateral_offset_x:
      binds_to:
      - mode: add
        path: target.offset.x
      default: 0.0
      range:
      - -0.02
      - 0.02
      type: scalar
    lateral_offset_y:
      binds_to:
      - mode: add
        path: target.offset.y
      default: 0.0
      range:
      - -0.02
      - 0.02
      type: scalar
  subtask_id: align_over_socket
  target:
    anchor: task_goal
    offset:
    - 0.0
    - 0.0
    - 0.0
    orientation:
      align_with: world_z
      axis:
      - 0.0
      - 0.0
      - 1.0
      mode: align_axis
      tolerance: 0.05
    source: yaml
    tolerance: 0.005
  termination: pose_tolerance
  type: align
- control: force_threshold_switch
  generator: linear_cartesian
  id: descend_1
  parameters:
    descend_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.01
      range:
      - 0.005
      - 0.03
      type: scalar
    descent_force_threshold:
      binds_to:
      - mode: replace
        path: termination.force_threshold
      default: 5.0
      range:
      - 1.0
      - 15.0
      type: scalar
  subtask_id: contact_socket
  target:
    anchor: task_goal
    offset:
    - 0.0
    - 0.0
    - 0.0
    orientation:
      align_with: world_z
      axis:
      - 0.0
      - 0.0
      - 1.0
      mode: align_axis
      tolerance: 0.05
    source: yaml
  termination: force_exceeded
  type: descend
- control: impedance_control
  generator: impedance_motion
  guards:
  - args: {}
    id: force_limit
    on_failure: abort
    predicate: force_below
    threshold: 40.0
    when: during_phase
  id: insert_1
  parameters:
    insertion_depth:
      binds_to:
      - mode: replace
        path: target.offset_along_axis.distance
      default: 0.04
      range:
      - 0.02
      - 0.06
      type: scalar
    insertion_force_threshold:
      binds_to:
      - mode: replace
        path: termination.force_threshold
      default: 10.0
      range:
      - 1.0
      - 20.0
      type: scalar
    insertion_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.01
      range:
      - 0.005
      - 0.02
      type: scalar
  subtask_id: full_insertion
  target:
    anchor: task_goal
    offset:
    - 0.0
    - 0.0
    - 0.0
    offset_along_axis:
      axis: insertion_axis
      distance: 0.04
      mode: replace_offset_projection
      sign: positive
    orientation:
      align_with: world_z
      axis:
      - 0.0
      - 0.0
      - 1.0
      mode: align_axis
      tolerance: 0.05
    source: yaml
  termination: force_exceeded
  type: insert
- control: position_control
  generator: linear_cartesian
  id: retract_1
  target:
    anchor: current_tcp
    offset:
    - 0.0
    - 0.0
    - 0.05
    orientation:
      mode: keep_current
    source: yaml
    tolerance: 0.01
  termination: pose_tolerance
  type: retract
skill: peg_insert
skill_type: arm
subtasks:
- anchor: goal
  id: reach_above
  metric: distance
  offset:
  - 0.0
  - 0.0
  - 0.08
  target_entity: tcp
  weight: 0.2
- anchor: goal
  id: align_over_socket
  metric: distance
  target_entity: tcp
  weight: 0.3
- anchor: fixture
  id: contact_socket
  metric: distance
  offset:
  - 0.0
  - 0.0
  - 0.055
  target_entity: tcp
  weight: 0.15
- anchor: fixture
  id: full_insertion
  metric: goal_progress
  target_entity: object
  weight: 0.35
