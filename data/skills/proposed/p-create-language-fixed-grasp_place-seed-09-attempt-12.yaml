dsl_version: 2
phases:
- control: position_control
  generator: linear_cartesian
  id: approach_1
  parameters:
    approach_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.3
      range:
      - 0.1
      - 1.0
      type: scalar
  subtask_id: approach_1
  target:
    anchor: task_object
    entity: grasp_target
    offset:
    - 0.0
    - 0.0
    - 0.1
    orientation:
      mode: keep_current
    source: yaml
    tolerance: 0.01
  termination: pose_tolerance
  type: approach
- control: position_control
  generator: linear_cartesian
  id: descend_1
  subtask_id: descend_1
  target:
    anchor: task_object
    entity: grasp_target
    offset:
    - 0.0
    - 0.0
    - 0.01
    orientation:
      mode: keep_current
    source: yaml
    tolerance: 0.01
  termination: pose_tolerance
  type: descend
- control: position_control
  end_effector_action: force_grasp
  generator: null
  guards:
  - args: {}
    id: bilateral_grasp_check
    on_failure: retry
    predicate: bilateral_grasp
    threshold: 0.5
    when: after_phase
  id: grasp_1
  retries:
    max_attempts: 2
    offset:
    - 0.005
    - 0.0
    - 0.0
    strategy: offset_target
  target:
    anchor: current_tcp
    offset:
    - 0.0
    - 0.0
    - 0.0
    orientation:
      mode: keep_current
    source: yaml
  termination: time_limit
  type: grasp
- control: position_control
  generator: linear_cartesian
  id: lift_1
  parameters:
    lift_height:
      binds_to:
      - mode: replace
        path: target.offset_along_axis.distance
      default: 0.12
      range:
      - 0.05
      - 0.3
      type: scalar
  target:
    anchor: current_tcp
    offset:
    - 0.0
    - 0.0
    - 0.0
    offset_along_axis:
      axis: world_z
      distance: 0.12
      mode: add_to_offset
      sign: positive
    orientation:
      mode: keep_current
    source: yaml
    tolerance: 0.01
  termination: pose_tolerance
  type: lift
- control: position_control
  generator: arc_cartesian
  id: transport_1
  parameters:
    arc_height:
      binds_to:
      - mode: replace
        path: generator.arc_height
      default: 0.15
      range:
      - 0.05
      - 0.3
      type: scalar
    transport_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.3
      range:
      - 0.1
      - 1.0
      type: scalar
  subtask_id: transport_arc
  target:
    anchor: task_goal
    offset:
    - 0.0
    - 0.0
    - 0.08
    orientation:
      mode: keep_current
    source: yaml
    tolerance: 0.01
  termination: pose_tolerance
  type: approach
- control: position_control
  generator: linear_cartesian
  id: place_descend
  target:
    anchor: task_goal
    offset:
    - 0.0
    - 0.0
    - 0.0
    orientation:
      mode: keep_current
    source: yaml
    tolerance: 0.005
  termination: pose_tolerance
  type: descend
- control: position_control
  end_effector_action: open
  generator: null
  id: release_1
  subtask_id: release_1
  target:
    anchor: current_tcp
    offset:
    - 0.0
    - 0.0
    - 0.0
    orientation:
      mode: keep_current
    source: yaml
  termination: time_limit
  type: release
- control: position_control
  generator: linear_cartesian
  id: retract_1
  target:
    anchor: task_goal
    offset:
    - 0.0
    - 0.0
    - 0.1
    orientation:
      mode: keep_current
    source: yaml
    tolerance: 0.01
  termination: pose_tolerance
  type: retract
skill: grasp_place
skill_type: arm_gripper
