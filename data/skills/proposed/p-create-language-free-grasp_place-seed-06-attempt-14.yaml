dsl_version: 2
phases:
- control: position_control
  generator: linear_cartesian
  id: approach_1
  subtask_id: reach_object
  target:
    anchor: task_object
    offset:
    - 0.0
    - 0.0
    - 0.05
    orientation:
      mode: keep_current
    source: yaml
  termination: pose_tolerance
  type: approach
- control: position_control
  generator: linear_cartesian
  id: descend_1
  subtask_id: touch_object
  target:
    anchor: task_object
    offset:
    - 0.0
    - 0.0
    - 0.0
    orientation:
      mode: keep_current
    source: yaml
  termination: pose_tolerance
  type: descend
- control: position_control
  end_effector_action: force_grasp
  guards:
  - id: grasp_ok
    on_failure: retry
    predicate: bilateral_grasp
    threshold: 1.0
    when: after_phase
  id: grasp
  retries:
    max_attempts: 2
    strategy: repeat
  target:
    anchor: current_tcp
    offset:
    - 0.0
    - 0.0
    - 0.0
    orientation:
      mode: keep_current
    source: yaml
  termination: time_limit
  type: grasp
- control: impedance_control
  generator: linear_cartesian
  guards:
  - id: object_raised
    on_failure: abort
    predicate: object_lifted
    threshold: 0.05
    when: after_phase
  id: lift
  parameters:
    lift_height:
      binds_to:
      - mode: replace
        path: target.offset_along_axis.distance
      default: 0.2
      range:
      - 0.1
      - 0.3
      type: scalar
    lift_tolerance:
      binds_to:
      - mode: replace
        path: termination.pose_tolerance
      default: 0.03
      range:
      - 0.01
      - 0.1
      type: scalar
  subtask_id: lift_object
  target:
    anchor: current_tcp
    offset:
    - 0.0
    - 0.0
    - 0.0
    offset_along_axis:
      axis: world_z
      distance: 0.2
      mode: add_to_offset
      sign: positive
    orientation:
      mode: keep_current
    source: yaml
    tolerance: 0.03
  termination: pose_tolerance
  type: lift
- control: impedance_control
  generator: linear_cartesian
  guards:
  - id: object_still_lifted
    on_failure: abort
    predicate: object_lifted
    threshold: 0.05
    when: before_phase
  - id: object_during_transport
    on_failure: retry
    predicate: object_lifted
    threshold: 0.01
    when: during_phase
  id: transport
  parameters:
    transport_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.035
      range:
      - 0.01
      - 0.1
      type: scalar
  retries:
    max_attempts: 1
    strategy: reduce_speed
  subtask_id: pre_place
  target:
    anchor: task_goal
    offset:
    - 0.0
    - 0.0
    - 0.05
    orientation:
      mode: keep_current
    source: yaml
    tolerance: 0.03
  termination: pose_tolerance
  type: approach
- control: impedance_control
  generator: linear_cartesian
  guards:
  - id: object_still_lifted_before_descend
    on_failure: abort
    predicate: object_lifted
    threshold: 0.05
    when: before_phase
  id: descend_2
  parameters:
    descend_z_offset:
      binds_to:
      - mode: replace
        path: target.offset.z
      default: 0.01
      range:
      - 0.0
      - 0.05
      type: scalar
  subtask_id: place
  target:
    anchor: task_goal
    offset:
    - 0.0
    - 0.0
    - 0.01
    orientation:
      mode: keep_current
    source: yaml
    tolerance: 0.02
  termination: pose_tolerance
  type: descend
skill: grasp_place
skill_type: arm_gripper
subtasks:
- anchor: object
  id: reach_object
  offset:
  - 0.0
  - 0.0
  - 0.05
  target_entity: tcp
  weight: 0.2
- anchor: object
  id: touch_object
  target_entity: tcp
  weight: 0.2
- anchor: object
  id: lift_object
  offset:
  - 0.0
  - 0.0
  - 0.15
  target_entity: object
  weight: 0.2
- anchor: goal
  id: pre_place
  offset:
  - 0.0
  - 0.0
  - 0.05
  target_entity: tcp
  weight: 0.2
- anchor: goal
  id: place
  target_entity: object
  weight: 0.2
