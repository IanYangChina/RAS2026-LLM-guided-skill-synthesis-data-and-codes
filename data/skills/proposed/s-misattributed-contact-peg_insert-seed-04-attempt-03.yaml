dsl_version: 2
phases:
- control: impedance_control
  generator: linear_cartesian
  guards:
  - args: {}
    id: contact_guard_push
    on_failure: abort
    predicate: contact_detected
    threshold: 0.5
    when: during_phase
  id: push_1
  parameters:
    push_distance:
      binds_to:
      - mode: replace
        path: target.offset_along_axis.distance
      default: 0.1
      range:
      - 0.02
      - 0.2
      type: scalar
    push_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.05
      range:
      - 0.01
      - 0.1
      type: scalar
  subtask_id: reach_approach
  target:
    anchor: fixture
    entity: peg_socket
    offset:
    - 0
    - 0
    - 0.08
    offset_along_axis:
      axis: world_z
      distance: 0.1
      mode: add_to_offset
      sign: negative
    orientation:
      align_with: insertion_axis
      axis:
      - 0
      - 0
      - 1
      mode: align_axis
      tolerance: 0.1
    tolerance: 0.02
  termination: time_limit
  type: push
- control: position_control
  generator: linear_cartesian
  id: align_1
  parameters:
    lateral_offset_x:
      binds_to:
      - mode: replace
        path: target.offset.x
      default: 0.0
      range:
      - -0.01
      - 0.01
      type: scalar
    lateral_offset_y:
      binds_to:
      - mode: replace
        path: target.offset.y
      default: 0.0
      range:
      - -0.01
      - 0.01
      type: scalar
  retries:
    max_attempts: 1
    offset:
    - 0.005
    - 0.005
    - 0
    strategy: offset_target
  subtask_id: reach_approach
  target:
    anchor: fixture
    entity: peg_socket
    offset:
    - 0
    - 0
    - 0.08
    offset_along_axis:
      axis: insertion_axis
      distance: 0.01
      mode: replace_offset_projection
      sign: positive
    orientation:
      align_with: insertion_axis
      axis:
      - 0
      - 0
      - 1
      mode: align_axis
      tolerance: 0.05
    tolerance: 0.01
  termination: pose_tolerance
  type: align
- control: admittance_control
  end_effector_action: open
  generator: linear_cartesian
  id: release_1
  parameters:
    release_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.04
      range:
      - 0.01
      - 0.1
      type: scalar
  subtask_id: reach_goal
  target:
    anchor: fixture
    entity: peg_socket
    offset:
    - 0
    - 0
    - 0.08
    offset_along_axis:
      axis: insertion_axis
      distance: 0.04
      mode: replace_offset_projection
      sign: negative
    orientation:
      align_with: insertion_axis
      axis:
      - 0
      - 0
      - 1
      mode: align_axis
      tolerance: 0.1
    tolerance: 0.02
  termination: pose_tolerance
  type: release
- control: impedance_control
  generator: impedance_motion
  guards:
  - args: {}
    id: force_guard_insert
    on_failure: retry
    predicate: force_below
    threshold: 15.0
    when: during_phase
  id: insert_1
  parameters:
    insertion_depth:
      binds_to:
      - mode: replace
        path: target.offset_along_axis.distance
      default: 0.06
      range:
      - 0.01
      - 0.15
      type: scalar
    insertion_force:
      binds_to:
      - mode: replace
        path: termination.force_threshold
      default: 10.0
      range:
      - 1.0
      - 20.0
      type: scalar
  retries:
    max_attempts: 1
    offset:
    - 0.003
    - 0.003
    - 0
    strategy: offset_target
  subtask_id: reach_goal
  target:
    anchor: fixture
    entity: peg_socket
    offset:
    - 0
    - 0
    - 0
    offset_along_axis:
      axis: insertion_axis
      distance: 0.06
      mode: replace_offset_projection
      sign: negative
    orientation:
      align_with: insertion_axis
      axis:
      - 0
      - 0
      - 1
      mode: align_axis
      tolerance: 0.08
    tolerance: 0.02
  termination: force_exceeded
  type: insert
skill: peg_insert
skill_type: arm_gripper
subtasks:
- anchor: fixture
  id: reach_approach
  metric: distance
  offset:
  - 0
  - 0
  - 0.08
  target_entity: tcp
  weight: 0.3
- anchor: goal
  id: reach_goal
  metric: distance
  offset:
  - 0
  - 0
  - 0
  target_entity: tcp
  weight: 0.7
