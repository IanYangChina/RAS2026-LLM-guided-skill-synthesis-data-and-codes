dsl_version: 2
phases:
- control: position_control
  generator: linear_cartesian
  id: approach_to_handle
  parameters:
    approach_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.07
      range:
      - 0.02
      - 0.1
      type: scalar
  subtask_id: door_progress
  target:
    anchor: fixture
    entity: door_panel
    offset:
    - -0.4
    - -0.03
    - 0.15
    source: yaml
    tolerance: 0.05
  termination: pose_tolerance
  type: approach
- control: impedance_control
  generator: linear_cartesian
  id: push_door
  parameters:
    max_push_time:
      binds_to:
      - mode: replace
        path: duration.max_time
      default: 4.0
      range:
      - 2.0
      - 6.0
      type: scalar
    push_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.05
      range:
      - 0.02
      - 0.1
      type: scalar
    push_y_offset:
      binds_to:
      - mode: replace
        path: target.offset.y
      default: -0.25
      range:
      - -0.35
      - -0.1
      type: scalar
  retries:
    max_attempts: 2
    offset:
    - 0.0
    - -0.02
    - 0.0
    strategy: offset_target
  subtask_id: door_progress
  target:
    anchor: fixture
    entity: door_panel
    offset:
    - -0.4
    - 0.0
    - 0.35
    source: yaml
    tolerance: 0.05
  termination: time_limit
  type: push
skill: door_push
subtasks:
- anchor: fixture
  id: door_progress
  metric: hinge_angle
  target_entity: hinge
