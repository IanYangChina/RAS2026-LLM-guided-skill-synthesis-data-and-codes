dsl_version: 2
phases:
- control: position_control
  generator: linear_cartesian
  id: approach_behind
  orientation:
    mode: none
  parameters:
    speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.15
      range:
      - 0.05
      - 0.3
      type: scalar
    tolerance:
      binds_to:
      - mode: replace
        path: termination.pose_tolerance
      default: 0.02
      range:
      - 0.005
      - 0.04
      type: scalar
  subtask_id: approach_obj
  target:
    anchor: task_object
    entity: push_box
    offset:
    - 0
    - 0
    - 0.12
    offset_along_axis:
      axis: push_direction
      distance: 0.08
      mode: add_to_offset
      sign: negative
    source: yaml
  termination: pose_tolerance
  type: approach
- control: position_control
  generator: linear_cartesian
  guards:
  - args: {}
    id: contact_made
    on_failure: continue
    predicate: contact_detected
    threshold: 1.0
    when: before_phase
  id: contact_position
  orientation:
    mode: none
  parameters:
    speed2:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.05
      range:
      - 0.02
      - 0.15
      type: scalar
    tolerance2:
      binds_to:
      - mode: replace
        path: termination.pose_tolerance
      default: 0.02
      range:
      - 0.005
      - 0.04
      type: scalar
  target:
    anchor: task_object
    entity: push_box
    offset:
    - 0
    - 0
    - 0.025
    offset_along_axis:
      axis: push_direction
      distance: 0.08
      mode: add_to_offset
      sign: negative
    source: yaml
  termination: pose_tolerance
  type: descend
- control: impedance_control
  generator: linear_cartesian
  guards:
  - args: {}
    id: force_contact
    on_failure: abort
    predicate: force_below
    threshold: 2.0
    when: during_phase
  - args: {}
    id: force_limit
    on_failure: abort
    predicate: force_below
    threshold: 20.0
    when: during_phase
  - args: {}
    id: object_lifted
    on_failure: abort
    predicate: object_lifted
    threshold: 0.005
    when: during_phase
  id: push_forward
  orientation:
    mode: none
  parameters:
    contact_loss_threshold:
      binds_to:
      - mode: replace
        path: guards.force_contact.threshold
      default: 2.0
      range:
      - 0.5
      - 5.0
      type: scalar
    force_limit_threshold:
      binds_to:
      - mode: replace
        path: guards.force_limit.threshold
      default: 20.0
      range:
      - 15.0
      - 24.0
      type: scalar
    lift_threshold:
      binds_to:
      - mode: replace
        path: guards.object_lifted.threshold
      default: 0.005
      range:
      - 0.003
      - 0.01
      type: scalar
    push_distance:
      binds_to:
      - mode: replace
        path: target.offset_along_axis.distance
      default: 0.05
      range:
      - 0.02
      - 0.15
      type: scalar
    push_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.05
      range:
      - 0.02
      - 0.15
      type: scalar
    push_tolerance:
      binds_to:
      - mode: replace
        path: termination.pose_tolerance
      default: 0.02
      range:
      - 0.005
      - 0.04
      type: scalar
  retries:
    max_attempts: 2
    offset:
    - 0.01
    - 0.0
    - 0.0
    strategy: offset_target
  subtask_id: push_to_goal
  target:
    anchor: task_goal
    entity: goal_marker
    offset:
    - 0
    - 0
    - 0.025
    offset_along_axis:
      axis: push_direction
      distance: 0.05
      mode: add_to_offset
      sign: positive
    source: yaml
  termination: pose_tolerance
  type: push
skill: push_to_goal
subtasks:
- anchor: object
  id: approach_obj
  offset:
  - 0
  - 0
  - 0.12
  target_entity: tcp
  weight: 0.2
- anchor: goal
  id: push_to_goal
  metric: goal_progress
  offset:
  - 0
  - 0
  - 0
  target_entity: tcp
  weight: 0.8
