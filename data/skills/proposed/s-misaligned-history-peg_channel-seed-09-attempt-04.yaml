dsl_version: 2
phases:
- control: position_control
  generator: linear_cartesian
  id: approach_1
  parameters:
    approach_height:
      binds_to:
      - mode: replace
        path: target.offset.z
      default: 0.1
      range:
      - 0.05
      - 0.15
      type: scalar
  retries:
    max_attempts: 1
    offset:
    - 0.0
    - 0.0
    - -0.02
    strategy: offset_target
  subtask_id: pre_contact
  target:
    anchor: task_object
    offset:
    - -0.02
    - 0.03
    - 0.1
    orientation:
      mode: keep_current
    source: yaml
  termination: pose_tolerance
  type: approach
- control: impedance_control
  generator: linear_cartesian
  guards:
  - args: {}
    id: contact_force_limit
    on_failure: abort
    predicate: force_below
    threshold: 40.0
    when: during_phase
  id: descend_1
  parameters:
    descend_offset_y:
      binds_to:
      - mode: replace
        path: target.offset.y
      default: 0.03
      range:
      - 0.01
      - 0.06
      type: scalar
  retries:
    max_attempts: 1
    offset:
    - 0.0
    - 0.0
    - -0.01
    strategy: offset_target
  subtask_id: contact
  target:
    anchor: task_object
    offset:
    - -0.02
    - 0.03
    - 0.0
    orientation:
      mode: keep_current
    source: yaml
  termination: contact_detected
  type: descend
- control: impedance_control
  generator: impedance_motion
  id: push_1
  parameters:
    push_distance:
      binds_to:
      - mode: replace
        path: target.offset_along_axis.distance
      default: 0.16
      range:
      - 0.1
      - 0.2
      type: scalar
    push_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.03
      range:
      - 0.01
      - 0.1
      type: scalar
  subtask_id: push_goal
  target:
    anchor: task_object
    offset_along_axis:
      axis: channel_axis
      distance: 0.16
      mode: add_to_offset
      sign: positive
    orientation:
      mode: none
    source: yaml
  termination: time_limit
  type: push
skill: peg_channel
skill_type: arm
subtasks:
- anchor: object
  id: pre_contact
  metric: distance
  offset:
  - -0.02
  - 0.03
  - 0.1
  target_entity: tcp
  weight: 0.2
- anchor: object
  id: contact
  metric: distance
  offset:
  - -0.02
  - 0.03
  - 0.0
  target_entity: tcp
  weight: 0.2
- anchor: goal
  id: push_goal
  metric: goal_progress
  target_entity: object
  weight: 0.6
