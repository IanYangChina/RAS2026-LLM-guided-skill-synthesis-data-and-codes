dsl_version: 2
phases:
- control: position_control
  generator: linear_cartesian
  guards:
  - args: {}
    id: approach_overshoot
    on_failure: continue
    predicate: pose_within_tolerance
    threshold: 0.02
    when: during_phase
  id: approach_1
  parameters:
    speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.1
      range:
      - 0.05
      - 0.2
      type: scalar
  retries:
    max_attempts: 2
    strategy: repeat
  subtask_id: approach_entry
  target:
    anchor: task_goal
    entity: null
    offset:
    - 0
    - 0
    - 0.15
    orientation:
      align_with: world_z
      axis:
      - 0
      - 0
      - 1
      mode: align_axis
      tolerance: 0.1
    source: yaml
    tolerance: 0.01
  termination: pose_tolerance
  type: approach
- control: impedance_control
  generator: null
  id: align_1
  parameters:
    lateral_offset_x:
      binds_to:
      - mode: add
        path: target.offset.x
      default: 0.0
      range:
      - -0.02
      - 0.02
      type: scalar
    lateral_offset_y:
      binds_to:
      - mode: add
        path: target.offset.y
      default: 0.0
      range:
      - -0.02
      - 0.02
      type: scalar
  retries:
    max_attempts: 2
    strategy: repeat
  subtask_id: approach_entry
  target:
    anchor: task_goal
    entity: null
    offset:
    - 0
    - 0
    - 0.15
    orientation:
      align_with: world_z
      axis:
      - 0
      - 0
      - 1
      mode: align_axis
      tolerance: 0.05
    source: yaml
    tolerance: 0.005
  termination: pose_tolerance
  type: align
- control: impedance_control
  generator: linear_cartesian
  guards:
  - args: {}
    id: descend_contact
    on_failure: continue
    predicate: contact_detected
    threshold: 1.0
    when: during_phase
  id: descend_1
  parameters:
    speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.03
      range:
      - 0.01
      - 0.08
      type: scalar
  subtask_id: approach_entry
  target:
    anchor: task_goal
    entity: null
    offset:
    - 0
    - 0
    - 0.03
    orientation:
      mode: keep_current
    source: yaml
    tolerance: 0.008
  termination: pose_tolerance
  type: descend
- control: impedance_control
  generator: linear_cartesian
  guards:
  - args: {}
    id: insert_force_guard
    on_failure: retry
    predicate: force_below
    threshold: 25.0
    when: during_phase
  id: insert_1
  parameters:
    depth_tolerance:
      binds_to:
      - mode: replace
        path: termination.pose_tolerance
      default: 0.005
      range:
      - 0.002
      - 0.01
      type: scalar
    force_guard_threshold:
      binds_to:
      - mode: replace
        path: guards.insert_force_guard.threshold
      default: 25.0
      range:
      - 10.0
      - 35.0
      type: scalar
    insert_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.02
      range:
      - 0.005
      - 0.05
      type: scalar
  retries:
    max_attempts: 2
    offset:
    - 0.005
    - 0.005
    - 0.0
    strategy: offset_target
  subtask_id: insertion_depth
  target:
    anchor: task_goal
    entity: null
    offset:
    - 0
    - 0
    - 0.0
    offset_along_axis:
      axis: channel_axis
      distance: 0.05
      mode: replace_offset_projection
      sign: positive
    orientation:
      align_with: channel_axis
      axis:
      - 0
      - 0
      - 1
      mode: align_axis
      tolerance: 0.05
    source: yaml
    tolerance: 0.005
  termination: pose_tolerance
  type: insert
skill: peg_insert
subtasks:
- anchor: goal
  id: approach_entry
  metric: distance
  offset:
  - 0
  - 0
  - 0.1
  target_entity: tcp
  weight: 0.3
- anchor: goal
  id: insertion_depth
  metric: goal_progress
  offset:
  - 0
  - 0
  - 0
  target_entity: object
  weight: 0.7
