dsl_version: 2
phases:
- control: position_control
  generator: arc_cartesian
  id: approach_handle
  parameters:
    approach_time:
      binds_to:
      - mode: replace
        path: duration.max_time
      default: 8.0
      range:
      - 2.0
      - 10.0
      type: scalar
    arc_height:
      binds_to:
      - mode: replace
        path: generator.arc_height
      default: 0.1
      range:
      - 0.02
      - 0.2
      type: scalar
    speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.05
      range:
      - 0.01
      - 0.1
      type: scalar
  target:
    anchor: fixture
    entity: door_panel
    offset:
    - -0.4
    - -0.02
    - 0.35
    orientation:
      mode: keep_current
    source: yaml
  termination: time_limit
  type: approach
- control: impedance_control
  generator: linear_cartesian
  id: push_door
  parameters:
    push_distance:
      binds_to:
      - mode: replace
        path: target.offset_along_axis.distance
      default: 0.25
      range:
      - 0.1
      - 0.4
      type: scalar
    push_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.05
      range:
      - 0.01
      - 0.15
      type: scalar
    push_time:
      binds_to:
      - mode: replace
        path: duration.max_time
      default: 9.0
      range:
      - 2.0
      - 10.0
      type: scalar
  target:
    anchor: fixture
    entity: door_panel
    offset:
    - -0.4
    - -0.02
    - 0.35
    offset_along_axis:
      axis: world_y
      distance: 0.25
      mode: add_to_offset
      sign: negative
    orientation:
      mode: keep_current
    source: yaml
  termination: time_limit
  type: push
skill: door_push
