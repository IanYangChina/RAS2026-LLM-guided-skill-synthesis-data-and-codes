dsl_version: 2
phases:
- control: position_control
  generator: linear_cartesian
  id: approach_1
  parameters:
    approach_height:
      binds_to:
      - mode: replace
        path: target.offset.z
      default: 0.1
      range:
      - 0.05
      - 0.3
      type: scalar
    approach_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.05
      range:
      - 0.01
      - 0.1
      type: scalar
  subtask_id: reach_object
  target:
    anchor: task_object
    offset:
    - 0.0
    - 0.0
    - 0.1
    orientation:
      mode: none
    source: yaml
  termination: pose_tolerance
  type: approach
- control: position_control
  end_effector_action: force_grasp
  generator: null
  guards:
  - args: {}
    id: bilateral_grasp
    on_failure: retry
    predicate: bilateral_grasp
    threshold: 1.0
    when: after_phase
  id: grasp_1
  retries:
    max_attempts: 2
    offset:
    - 0.0
    - 0.0
    - -0.005
    strategy: offset_target
  subtask_id: grasp_object
  target:
    anchor: task_object
    offset:
    - 0.0
    - 0.0
    - 0.0
    orientation:
      mode: none
    source: yaml
  termination: grasp_success
  type: grasp
- control: position_control
  generator: linear_cartesian
  guards:
  - args: {}
    id: object_lifted
    on_failure: retry
    predicate: object_lifted
    threshold: 0.05
    when: after_phase
  id: lift_1
  parameters:
    lift_height:
      binds_to:
      - mode: replace
        path: target.offset.z
      default: 0.2
      range:
      - 0.1
      - 0.3
      type: scalar
    lift_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.04
      range:
      - 0.01
      - 0.1
      type: scalar
  subtask_id: lift_object
  target:
    anchor: task_object
    offset:
    - 0.0
    - 0.0
    - 0.2
    orientation:
      mode: none
    source: yaml
  termination: pose_tolerance
  type: lift
- control: position_control
  generator: linear_cartesian
  id: transport_1
  parameters:
    transport_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.05
      range:
      - 0.01
      - 0.1
      type: scalar
  subtask_id: transport_to_goal
  target:
    anchor: task_goal
    offset:
    - 0.0
    - 0.0
    - 0.15
    orientation:
      mode: none
    source: yaml
  termination: pose_tolerance
  type: approach
- control: position_control
  generator: linear_cartesian
  id: descend_1
  parameters:
    descend_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.03
      range:
      - 0.01
      - 0.08
      type: scalar
  subtask_id: place_at_goal
  target:
    anchor: task_goal
    offset:
    - 0.0
    - 0.0
    - 0.0
    orientation:
      mode: none
    source: yaml
  termination: pose_tolerance
  type: descend
- control: position_control
  end_effector_action: open
  generator: null
  id: release_1
  target:
    anchor: current_tcp
    offset:
    - 0.0
    - 0.0
    - 0.0
    orientation:
      mode: keep_current
    source: yaml
  termination: time_limit
  type: release
- control: position_control
  generator: linear_cartesian
  id: retract_1
  parameters:
    retract_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.05
      range:
      - 0.01
      - 0.1
      type: scalar
  subtask_id: retract
  target:
    anchor: task_goal
    offset:
    - 0.0
    - 0.0
    - 0.1
    orientation:
      mode: none
    source: yaml
  termination: pose_tolerance
  type: retract
skill: grasp_place
subtasks:
- anchor: object
  id: reach_object
  metric: distance
  offset:
  - 0.0
  - 0.0
  - 0.1
  target_entity: tcp
  weight: 0.15
- anchor: object
  id: grasp_object
  metric: distance
  offset:
  - 0.0
  - 0.0
  - 0.0
  target_entity: tcp
  weight: 0.1
- anchor: object
  id: lift_object
  metric: distance
  offset:
  - 0.0
  - 0.0
  - 0.2
  target_entity: tcp
  weight: 0.1
- anchor: goal
  id: transport_to_goal
  metric: distance
  offset:
  - 0.0
  - 0.0
  - 0.15
  target_entity: tcp
  weight: 0.25
- anchor: goal
  id: place_at_goal
  metric: distance
  offset:
  - 0.0
  - 0.0
  - 0.0
  target_entity: tcp
  weight: 0.2
- anchor: goal
  id: retract
  metric: distance
  offset:
  - 0.0
  - 0.0
  - 0.1
  target_entity: tcp
  weight: 0.1
