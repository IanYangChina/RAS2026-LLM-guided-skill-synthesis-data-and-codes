dsl_version: 2
phases:
- control: position_control
  generator: arc_cartesian
  id: clear_obstacle
  parameters:
    arc_height:
      binds_to:
      - mode: add
        path: generator.arc_height
      default: 0.3
      range:
      - 0.1
      - 0.5
      type: scalar
    speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.05
      range:
      - 0.01
      - 0.1
      type: scalar
  subtask_id: clear_obstacle
  target:
    anchor: body
    entity: obstacle_block
    offset:
    - 0.0
    - 0.0
    - 0.25
    orientation:
      mode: keep_current
    tolerance: 0.02
  termination: pose_tolerance
  type: approach
- control: position_control
  generator: linear_cartesian
  id: reach_over
  parameters:
    speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.05
      range:
      - 0.01
      - 0.1
      type: scalar
  subtask_id: reach_goal
  target:
    anchor: task_goal
    offset:
    - 0.0
    - 0.0
    - 0.2
    orientation:
      mode: keep_current
    tolerance: 0.02
  termination: pose_tolerance
  type: approach
- control: position_control
  generator: linear_cartesian
  id: descend_goal
  parameters:
    speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.05
      range:
      - 0.01
      - 0.1
      type: scalar
  subtask_id: reach_goal
  target:
    anchor: task_goal
    offset:
    - 0.0
    - 0.0
    - 0.0
    orientation:
      mode: keep_current
    tolerance: 0.02
  termination: pose_tolerance
  type: descend
skill: obstacle_reach
skill_type: arm
subtasks:
- anchor: fixture
  id: clear_obstacle
  metric: distance
  offset:
  - 0.0
  - 0.0
  - 0.25
  target_entity: tcp
  weight: 0.3
- anchor: goal
  id: reach_goal
  metric: distance
  offset:
  - 0.0
  - 0.0
  - 0.0
  target_entity: tcp
  weight: 0.7
