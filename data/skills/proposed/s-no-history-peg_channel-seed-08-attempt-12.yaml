dsl_version: 2
phases:
- control: position_control
  generator: arc_cartesian
  id: approach_1
  parameters:
    approach_arc_height:
      binds_to:
      - mode: replace
        path: generator.arc_height
      default: 0.08
      range:
      - 0.04
      - 0.15
      type: scalar
    approach_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.08
      range:
      - 0.05
      - 0.15
      type: scalar
  subtask_id: approach_peg
  target:
    anchor: task_object
    entity: peg
    offset:
    - 0.0
    - 0.0
    - 0.12
    orientation:
      mode: keep_current
    source: yaml
    tolerance: 0.02
  termination: pose_tolerance
  type: approach
- control: impedance_control
  generator: linear_cartesian
  id: descend_1
  parameters:
    descend_force_threshold:
      binds_to:
      - mode: replace
        path: termination.force_threshold
      default: 2.0
      range:
      - 1.0
      - 5.0
      type: scalar
    descend_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.02
      range:
      - 0.01
      - 0.04
      type: scalar
  subtask_id: approach_peg
  target:
    anchor: task_object
    entity: peg
    offset:
    - 0.0
    - 0.0
    - 0.0
    orientation:
      mode: keep_current
    source: yaml
  termination: force_exceeded
  type: descend
- control: impedance_control
  generator: linear_cartesian
  guards:
  - id: contact_guard
    on_failure: retry
    predicate: contact_detected
    threshold: 0
    when: during_phase
  - id: force_guard
    on_failure: abort
    predicate: force_below
    threshold: 40.0
    when: during_phase
  id: push_1
  parameters:
    push_distance:
      binds_to:
      - mode: replace
        path: target.offset_along_axis.distance
      default: 0.18
      range:
      - 0.16
      - 0.22
      type: scalar
    push_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.01
      range:
      - 0.005
      - 0.015
      type: scalar
    push_tolerance:
      binds_to:
      - mode: replace
        path: termination.pose_tolerance
      default: 0.03
      range:
      - 0.02
      - 0.05
      type: scalar
  retries:
    max_attempts: 2
    offset:
    - 0.0
    - 0.005
    - 0.0
    strategy: offset_target
  subtask_id: push_to_goal
  target:
    anchor: task_object
    entity: peg
    offset:
    - 0.0
    - 0.0
    - 0.0
    offset_along_axis:
      axis: channel_axis
      distance: 0.18
      mode: add_to_offset
      sign: positive
    orientation:
      mode: keep_current
    source: yaml
    tolerance: 0.03
  termination: pose_tolerance
  type: push
skill: peg_channel
subtasks:
- anchor: object
  id: approach_peg
  offset:
  - 0.0
  - 0.0
  - 0.12
  weight: 0.3
- id: push_to_goal
  metric: goal_progress
  target_entity: object
  weight: 0.7
