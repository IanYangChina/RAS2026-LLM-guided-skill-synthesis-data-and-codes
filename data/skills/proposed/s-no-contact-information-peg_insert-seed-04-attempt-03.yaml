dsl_version: 2
phases:
- control: position_control
  generator: linear_cartesian
  id: push_1
  parameters:
    push_distance:
      binds_to:
      - mode: replace
        path: target.offset_along_axis.distance
      default: 0.02
      range:
      - 0.0
      - 0.05
      type: scalar
    push_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.04
      range:
      - 0.01
      - 0.1
      type: scalar
  subtask_id: approach_entry
  target:
    anchor: task_goal
    offset:
    - 0
    - 0
    - 0.035
    offset_along_axis:
      axis: world_z
      distance: 0.02
      mode: add_to_offset
      sign: negative
    orientation:
      mode: none
    source: yaml
    tolerance: 0.01
  termination: pose_tolerance
  type: approach
- control: position_control
  generator: linear_cartesian
  id: align_1
  parameters:
    lateral_offset_x:
      binds_to:
      - mode: add
        path: target.offset.x
      default: 0.0
      range:
      - -0.015
      - 0.015
      type: scalar
    lateral_offset_y:
      binds_to:
      - mode: add
        path: target.offset.y
      default: 0.0
      range:
      - -0.015
      - 0.015
      type: scalar
  subtask_id: approach_entry
  target:
    anchor: task_goal
    offset:
    - 0
    - 0
    - 0.04
    orientation:
      align_with: world_z
      axis:
      - 0
      - 0
      - 1
      mode: align_axis
    source: yaml
    tolerance: 0.005
  termination: pose_tolerance
  type: align
- control: impedance_control
  generator: linear_cartesian
  guards:
  - args: {}
    id: contact_check
    on_failure: continue
    predicate: contact_detected
    threshold: 0.0
    when: during_phase
  id: release_1
  parameters:
    descend_force_threshold:
      binds_to:
      - mode: replace
        path: termination.force_threshold
      default: 5.0
      range:
      - 1.0
      - 20.0
      type: scalar
  subtask_id: insertion_goal
  target:
    anchor: task_goal
    offset:
    - 0
    - 0
    - 0.02
    orientation:
      align_with: world_z
      axis:
      - 0
      - 0
      - 1
      mode: align_axis
    source: yaml
  termination: force_exceeded
  type: descend
- control: impedance_control
  generator: impedance_motion
  guards:
  - args: {}
    id: force_limit
    on_failure: abort
    predicate: force_below
    threshold: 40.0
    when: during_phase
  id: insert_1
  parameters:
    insertion_depth:
      binds_to:
      - mode: replace
        path: target.offset_along_axis.distance
      default: 0.05
      range:
      - 0.01
      - 0.08
      type: scalar
    insertion_force:
      binds_to:
      - mode: replace
        path: termination.force_threshold
      default: 10.0
      range:
      - 1.0
      - 30.0
      type: scalar
  subtask_id: insertion_goal
  target:
    anchor: fixture
    entity: peg_socket
    offset:
    - 0
    - 0
    - 0.0
    offset_along_axis:
      axis: world_z
      distance: 0.05
      mode: replace_offset_projection
      sign: negative
    orientation:
      align_with: world_z
      axis:
      - 0
      - 0
      - 1
      mode: align_axis
      tolerance: 0.05
    source: yaml
  termination: force_exceeded
  type: insert
skill: peg_insert
skill_type: arm_gripper
subtasks:
- anchor: goal
  id: approach_entry
  metric: distance
  offset:
  - 0
  - 0
  - 0.04
  target_entity: tcp
  weight: 0.3
- anchor: fixture
  id: insertion_goal
  metric: distance
  offset:
  - 0
  - 0
  - -0.02
  target_entity: tcp
  weight: 0.7
