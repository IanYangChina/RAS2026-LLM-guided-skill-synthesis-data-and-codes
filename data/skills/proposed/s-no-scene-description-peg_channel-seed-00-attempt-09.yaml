dsl_version: 2
phases:
- control: position_control
  generator: linear_cartesian
  id: approach_peg
  parameters:
    approach_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.06
      range:
      - 0.02
      - 0.1
      type: scalar
    approach_y_offset:
      binds_to:
      - mode: replace
        path: target.offset.y
      default: 0.05
      range:
      - 0.03
      - 0.08
      type: scalar
  subtask_id: reach_entrance
  target:
    anchor: task_object
    offset:
    - 0
    - 0.05
    - 0.02
    orientation:
      mode: none
    source: yaml
    tolerance: 0.01
  termination: pose_tolerance
  type: approach
- control: impedance_control
  generator: linear_cartesian
  guards:
  - args: {}
    id: contact_force_ok
    on_failure: abort
    predicate: force_below
    threshold: 40
    when: during_phase
  id: push_through_channel
  parameters:
    push_distance:
      binds_to:
      - mode: replace
        path: target.offset_along_axis.distance
      default: 0.16
      range:
      - 0.1
      - 0.2
      type: scalar
    push_force_threshold:
      binds_to:
      - mode: replace
        path: termination.force_threshold
      default: 35
      range:
      - 25
      - 40
      type: scalar
    push_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.04
      range:
      - 0.01
      - 0.08
      type: scalar
    wiggle_offset:
      binds_to:
      - mode: replace
        path: retry.offset.x
      default: 0.005
      range:
      - 0.002
      - 0.01
      type: scalar
  retries:
    max_attempts: 2
    offset:
    - 0.005
    - 0
    - 0
    strategy: offset_target
  subtask_id: traverse_channel
  target:
    anchor: current_tcp
    offset:
    - 0
    - 0
    - 0
    offset_along_axis:
      axis: task_goal_direction
      distance: 0.16
      mode: add_to_offset
      sign: positive
    orientation:
      align_with: channel_axis
      axis:
      - 0
      - 0
      - 1
      mode: align_axis
      tolerance: 0.1
    source: yaml
    tolerance: 0.02
  termination: force_exceeded
  type: push
skill: peg_channel
skill_type: arm
subtasks:
- anchor: object
  id: reach_entrance
  metric: distance
  offset:
  - 0
  - 0.05
  - 0.02
  target_entity: tcp
  weight: 0.3
- anchor: goal
  id: traverse_channel
  metric: goal_progress
  offset:
  - 0
  - 0
  - 0
  target_entity: object
  weight: 0.7
