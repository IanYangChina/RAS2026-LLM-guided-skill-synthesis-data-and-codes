dsl_version: 2
phases:
- control: position_control
  generator: linear_cartesian
  id: approach_1
  parameters:
    approach_y_offset:
      binds_to:
      - mode: replace
        path: target.offset.y
      default: 0.15
      range:
      - 0.1
      - 0.2
      type: scalar
    speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.08
      range:
      - 0.02
      - 0.2
      type: scalar
  subtask_id: approach_peg
  target:
    anchor: task_object
    entity: null
    offset:
    - 0.0
    - 0.15
    - 0.0
    orientation:
      mode: keep_current
    source: yaml
    tolerance: 0.01
  termination: pose_tolerance
  type: approach
- control: impedance_control
  generator: linear_cartesian
  guards:
  - args: {}
    id: force_guard
    on_failure: abort
    predicate: force_below
    threshold: 45.0
    when: during_phase
  id: push_1
  parameters:
    force_threshold:
      binds_to:
      - mode: replace
        path: termination.force_threshold
      default: 35.0
      range:
      - 20.0
      - 40.0
      type: scalar
    push_distance:
      binds_to:
      - mode: replace
        path: target.offset_along_axis.distance
      default: 0.2
      range:
      - 0.08
      - 0.25
      type: scalar
    push_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.04
      range:
      - 0.01
      - 0.08
      type: scalar
  retries:
    max_attempts: 1
    offset:
    - 0.0
    - 0.0
    - 0.01
    strategy: offset_target
  subtask_id: insert_peg
  target:
    anchor: task_object
    entity: null
    offset:
    - 0.0
    - 0.0
    - 0.0
    offset_along_axis:
      axis: channel_axis
      distance: 0.2
      mode: replace_offset_projection
      sign: positive
    orientation:
      align_with: channel_axis
      axis:
      - 0.0
      - -1.0
      - 0.0
      mode: align_axis
      tolerance: 0.1
    source: yaml
    tolerance: 0.02
  termination: force_exceeded
  type: push
- control: position_control
  generator: linear_cartesian
  id: retract_1
  parameters:
    retract_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.08
      range:
      - 0.02
      - 0.15
      type: scalar
  target:
    anchor: current_tcp
    entity: null
    offset:
    - 0.0
    - -0.05
    - 0.05
    orientation:
      mode: keep_current
    source: yaml
  termination: pose_tolerance
  type: retract
skill: peg_channel
subtasks:
- anchor: object
  id: approach_peg
  metric: distance
  offset:
  - 0.0
  - 0.15
  - 0.0
  target_entity: tcp
  weight: 0.3
- anchor: goal
  id: insert_peg
  metric: goal_progress
  offset:
  - 0.0
  - 0.0
  - 0.0
  target_entity: object
  weight: 0.7
