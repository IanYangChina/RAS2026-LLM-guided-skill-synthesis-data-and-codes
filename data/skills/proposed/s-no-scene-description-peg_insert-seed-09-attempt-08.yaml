dsl_version: 2
phases:
- control: position_control
  generator: linear_cartesian
  id: approach_high
  parameters:
    approach_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.1
      range:
      - 0.02
      - 0.2
      type: scalar
  subtask_id: reach_above_hole
  target:
    anchor: task_goal
    offset:
    - 0.0
    - 0.0
    - 0.3
    orientation:
      mode: keep_current
    source: yaml
    tolerance: 0.02
  termination: pose_tolerance
  type: approach
- control: position_control
  generator: linear_cartesian
  id: align_high
  parameters:
    align_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.1
      range:
      - 0.02
      - 0.2
      type: scalar
  subtask_id: reach_above_hole
  target:
    anchor: task_goal
    offset:
    - 0.0
    - 0.0
    - 0.3
    orientation:
      align_with: world_z
      axis:
      - 0.0
      - 0.0
      - 1.0
      mode: align_axis
      tolerance: 0.05
    source: yaml
    tolerance: 0.01
  termination: pose_tolerance
  type: align
- control: admittance_control
  generator: linear_cartesian
  guards:
  - id: contact_guard
    on_failure: continue
    predicate: contact_detected
    threshold: 1.0
    when: during_phase
  id: descend_to_entry
  parameters:
    contact_force_threshold:
      binds_to:
      - mode: replace
        path: termination.force_threshold
      default: 20.0
      range:
      - 10.0
      - 30.0
      type: scalar
    descend_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.02
      range:
      - 0.005
      - 0.04
      type: scalar
  retries:
    max_attempts: 2
    offset:
    - 0.005
    - 0.005
    - 0.0
    strategy: offset_target
  subtask_id: insert_peg
  target:
    anchor: task_goal
    offset:
    - 0.0
    - 0.0
    - 0.0
    offset_along_axis:
      axis: world_z
      distance: 0.2
      mode: replace_offset_projection
      sign: negative
    orientation:
      mode: keep_current
    source: yaml
  termination: force_exceeded
  type: descend
- control: admittance_control
  generator: linear_cartesian
  guards:
  - id: insert_contact_guard
    on_failure: continue
    predicate: contact_detected
    threshold: 1.0
    when: during_phase
  id: insert_deep
  parameters:
    insert_depth:
      binds_to:
      - mode: replace
        path: target.offset_along_axis.distance
      default: 0.08
      range:
      - 0.03
      - 0.12
      type: scalar
    insert_force_threshold:
      binds_to:
      - mode: replace
        path: termination.force_threshold
      default: 35.0
      range:
      - 25.0
      - 40.0
      type: scalar
    insert_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.015
      range:
      - 0.005
      - 0.03
      type: scalar
  retries:
    max_attempts: 1
    offset:
    - 0.003
    - 0.003
    - 0.0
    strategy: offset_target
  subtask_id: insert_peg
  target:
    anchor: task_goal
    offset:
    - 0.0
    - 0.0
    - 0.0
    offset_along_axis:
      axis: world_z
      distance: 0.1
      mode: replace_offset_projection
      sign: negative
    orientation:
      mode: keep_current
    source: yaml
  termination: force_exceeded
  type: insert
- control: position_control
  end_effector_action: open
  id: release_peg
  target:
    anchor: current_tcp
    offset:
    - 0.0
    - 0.0
    - 0.0
    source: yaml
  termination: time_limit
  type: release
skill: peg_insert
skill_type: arm_gripper
subtasks:
- anchor: goal
  id: reach_above_hole
  metric: distance
  offset:
  - 0.0
  - 0.0
  - 0.3
  target_entity: tcp
  weight: 0.3
- anchor: goal
  id: insert_peg
  metric: goal_progress
  offset:
  - 0.0
  - 0.0
  - 0.0
  target_entity: object
  weight: 0.7
