dsl_version: 2
phases:
- control: position_control
  generator: linear_cartesian
  id: approach_above
  parameters:
    approach_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.08
      range:
      - 0.01
      - 0.2
      type: scalar
  subtask_id: approach_above
  target:
    anchor: fixture
    entity: peg_socket
    offset:
    - 0.0
    - 0.0
    - 0.25
    orientation:
      align_with: insertion_axis
      axis:
      - 0
      - 0
      - 1
      mode: align_axis
      tolerance: 0.1
    source: yaml
    tolerance: 0.01
  termination: pose_tolerance
  type: approach
- control: impedance_control
  generator: linear_cartesian
  id: insert_into_hole
  parameters:
    force_threshold:
      binds_to:
      - mode: replace
        path: termination.force_threshold
      default: 20.0
      range:
      - 5.0
      - 35.0
      type: scalar
    insert_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.02
      range:
      - 0.005
      - 0.05
      type: scalar
    insertion_depth:
      binds_to:
      - mode: replace
        path: target.offset_along_axis.distance
      default: 0.04
      range:
      - 0.01
      - 0.08
      type: scalar
  subtask_id: insertion
  target:
    anchor: fixture
    entity: peg_socket
    offset:
    - 0.0
    - 0.0
    - 0.0
    offset_along_axis:
      axis: insertion_axis
      distance: 0.04
      mode: add_to_offset
      sign: positive
    orientation:
      mode: keep_current
    source: yaml
    tolerance: 0.005
  termination: force_exceeded
  type: push
skill: peg_insert
subtasks:
- anchor: fixture
  id: approach_above
  metric: distance
  offset:
  - 0.0
  - 0.0
  - 0.25
  target_entity: tcp
  weight: 0.3
- anchor: fixture
  id: insertion
  metric: distance
  offset:
  - 0.0
  - 0.0
  - -0.04
  target_entity: tcp
  weight: 0.7
