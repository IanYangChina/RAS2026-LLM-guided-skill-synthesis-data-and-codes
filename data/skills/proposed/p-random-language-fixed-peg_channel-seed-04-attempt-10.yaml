dsl_version: 2
phases:
- control: position_control
  generator: linear_cartesian
  id: approach_peg
  orientation:
    mode: none
  parameters:
    approach_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.05
      range:
      - 0.02
      - 0.1
      type: scalar
    approach_time:
      binds_to:
      - mode: replace
        path: duration.max_time
      default: 3.0
      range:
      - 1.0
      - 5.0
      type: scalar
  subtask_id: approach
  target:
    anchor: task_object
    offset:
    - 0.0
    - 0.04
    - 0.12
  termination: time_limit
  type: approach
- control: impedance_control
  generator: linear_cartesian
  id: contact_peg
  orientation:
    mode: none
  parameters:
    contact_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.02
      range:
      - 0.01
      - 0.05
      type: scalar
    contact_time:
      binds_to:
      - mode: replace
        path: duration.max_time
      default: 3.0
      range:
      - 1.0
      - 5.0
      type: scalar
  subtask_id: contact
  target:
    anchor: task_object
    offset:
    - 0.0
    - 0.02
    - 0.04
  termination: time_limit
  type: contact
- control: impedance_control
  generator: linear_cartesian
  id: push_peg
  orientation:
    mode: none
  parameters:
    push_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.05
      range:
      - 0.02
      - 0.1
      type: scalar
    push_time:
      binds_to:
      - mode: replace
        path: duration.max_time
      default: 10.0
      range:
      - 5.0
      - 15.0
      type: scalar
  subtask_id: push
  target:
    anchor: world
    offset:
    - 0.5
    - -0.08
    - 0.04
  termination: time_limit
  type: push
skill: peg_channel
skill_type: arm_gripper
