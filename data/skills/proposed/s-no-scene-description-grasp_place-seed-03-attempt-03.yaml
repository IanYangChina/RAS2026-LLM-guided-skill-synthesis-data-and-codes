dsl_version: 2
phases:
- control: position_control
  generator: linear_cartesian
  id: approach_object
  parameters:
    approach_height:
      binds_to:
      - mode: replace
        path: target.offset.z
      default: 0.12
      range:
      - 0.08
      - 0.2
      type: scalar
  subtask_id: reach_object
  target:
    anchor: task_object
    entity: grasp_target
    offset:
    - 0.0
    - 0.0
    - 0.12
    orientation:
      align_with: world_z
      axis:
      - 0
      - 0
      - 1
      mode: align_axis
      tolerance: 0.1
    source: yaml
  termination: pose_tolerance
  type: approach
- control: admittance_control
  generator: linear_cartesian
  guards:
  - args: {}
    id: contact_guard
    on_failure: continue
    predicate: contact_detected
    threshold: 10.0
    when: during_phase
  id: descend_grasp
  parameters:
    descend_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.05
      range:
      - 0.01
      - 0.1
      type: scalar
  subtask_id: reach_object
  target:
    anchor: task_object
    entity: grasp_target
    offset:
    - 0.0
    - 0.0
    - 0.0
    orientation:
      mode: keep_current
    source: yaml
  termination: contact_detected
  type: descend
- control: null
  end_effector_action: force_grasp
  generator: null
  guards:
  - args: {}
    id: bilateral_grasp
    on_failure: retry
    predicate: bilateral_grasp
    threshold: 0.5
    when: after_phase
  id: grasp_object
  retries:
    max_attempts: 2
    strategy: repeat
  target:
    anchor: current_tcp
    entity: null
    offset:
    - 0
    - 0
    - 0
    source: yaml
  termination: grasp_success
  type: grasp
- control: impedance_control
  generator: linear_cartesian
  guards:
  - args: {}
    id: object_lifted
    on_failure: abort
    predicate: object_lifted
    threshold: 0.05
    when: after_phase
  id: lift_object
  parameters:
    lift_height:
      binds_to:
      - mode: replace
        path: target.offset_along_axis.distance
      default: 0.15
      range:
      - 0.08
      - 0.25
      type: scalar
  target:
    anchor: current_tcp
    entity: null
    offset_along_axis:
      axis: world_z
      distance: 0.15
      mode: add_to_offset
      sign: positive
    orientation:
      mode: keep_current
    source: yaml
  termination: pose_tolerance
  type: lift
- control: position_control
  generator: arc_cartesian
  id: approach_goal
  parameters:
    approach_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.15
      range:
      - 0.05
      - 0.3
      type: scalar
    arc_height:
      binds_to:
      - mode: replace
        path: generator.arc_height
      default: 0.1
      range:
      - 0.05
      - 0.2
      type: scalar
  subtask_id: reach_goal
  target:
    anchor: task_goal
    entity: goal
    offset:
    - 0.0
    - 0.0
    - 0.1
    orientation:
      mode: keep_current
    source: yaml
  termination: pose_tolerance
  type: approach
- control: admittance_control
  generator: linear_cartesian
  id: place_object
  parameters:
    place_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.03
      range:
      - 0.01
      - 0.05
      type: scalar
  subtask_id: reach_goal
  target:
    anchor: task_goal
    entity: goal
    offset:
    - 0.0
    - 0.0
    - 0.0
    orientation:
      mode: keep_current
    source: yaml
  termination: pose_tolerance
  type: descend
- control: null
  end_effector_action: open
  generator: null
  id: release_object
  target:
    anchor: current_tcp
    entity: null
    offset:
    - 0
    - 0
    - 0
    source: yaml
  termination: pose_tolerance
  type: release
- control: position_control
  generator: linear_cartesian
  id: retract_after_place
  parameters:
    retract_height:
      binds_to:
      - mode: replace
        path: target.offset.z
      default: 0.1
      range:
      - 0.05
      - 0.2
      type: scalar
  target:
    anchor: task_goal
    entity: goal
    offset:
    - 0.0
    - 0.0
    - 0.15
    orientation:
      mode: keep_current
    source: yaml
  termination: pose_tolerance
  type: retract
skill: grasp_place
subtasks:
- anchor: object
  id: reach_object
  metric: distance
  offset:
  - 0.0
  - 0.0
  - 0.1
  target_entity: tcp
  weight: 0.3
- anchor: goal
  id: reach_goal
  metric: distance
  offset:
  - 0.0
  - 0.0
  - 0.05
  target_entity: tcp
  weight: 0.7
