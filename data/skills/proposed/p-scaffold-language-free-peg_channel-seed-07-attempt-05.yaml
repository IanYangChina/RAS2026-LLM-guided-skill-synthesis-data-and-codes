dsl_version: 2
phases:
- control: position_control
  generator: linear_cartesian
  id: align_1
  orientation:
    mode: keep_current
  parameters:
    align_y_offset:
      binds_to:
      - mode: replace
        path: target.offset.y
      default: 0.15
      range:
      - 0.08
      - 0.2
      type: scalar
    align_z_offset:
      binds_to:
      - mode: replace
        path: target.offset.z
      default: 0.1
      range:
      - 0.05
      - 0.15
      type: scalar
    speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.1
      range:
      - 0.05
      - 0.2
      type: scalar
  subtask_id: reach_prepush
  target:
    anchor: task_object
    offset:
    - 0
    - 0.15
    - 0.1
    source: yaml
    tolerance: 0.01
  termination: pose_tolerance
  type: align
- control: position_control
  generator: linear_cartesian
  id: approach_1
  orientation:
    mode: keep_current
  parameters:
    speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.02
      range:
      - 0.01
      - 0.05
      type: scalar
  subtask_id: reach_prepush
  target:
    anchor: task_object
    offset:
    - 0
    - 0.0
    - 0.04
    source: yaml
    tolerance: 0.005
  termination: pose_tolerance
  type: approach
- control: impedance_control
  generator: impedance_motion
  guards:
  - id: force_guard
    on_failure: retry
    predicate: force_below
    threshold: 40.0
    when: during_phase
  id: push_1
  orientation:
    align_with: channel_axis
    axis:
    - 0
    - -1
    - 0
    mode: align_axis
    tolerance: 0.1
  parameters:
    speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.02
      range:
      - 0.005
      - 0.05
      type: scalar
  retries:
    max_attempts: 2
    offset:
    - 0.005
    - 0
    - 0
    strategy: offset_target
  subtask_id: push_through
  target:
    anchor: task_goal
    offset:
    - 0
    - 0
    - 0.04
    source: yaml
    tolerance: 0.02
  termination: pose_tolerance
  type: push
- control: position_control
  generator: linear_cartesian
  id: retract_1
  orientation:
    mode: keep_current
  parameters:
    speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.05
      range:
      - 0.02
      - 0.1
      type: scalar
  target:
    anchor: current_tcp
    offset:
    - 0
    - 0
    - 0.15
    source: yaml
    tolerance: 0.01
  termination: pose_tolerance
  type: retract
skill: peg_channel
subtasks:
- anchor: object
  id: reach_prepush
  metric: distance
  offset:
  - 0
  - 0.15
  - 0.1
  target_entity: tcp
  weight: 0.3
- anchor: goal
  id: push_through
  metric: goal_progress
  offset:
  - 0
  - 0
  - 0
  target_entity: tcp
  weight: 0.7
