dsl_version: 2
phases:
- control: position_control
  generator: linear_cartesian
  id: approach_above
  parameters:
    approach_distance:
      binds_to:
      - mode: replace
        path: target.offset_along_axis.distance
      default: 0.03
      range:
      - 0.02
      - 0.06
      type: scalar
    approach_height:
      binds_to:
      - mode: replace
        path: target.offset.z
      default: 0.05
      range:
      - 0.03
      - 0.08
      type: scalar
    approach_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.08
      range:
      - 0.02
      - 0.15
      type: scalar
  subtask_id: reach_object
  target:
    anchor: task_object
    offset:
    - 0.0
    - 0.0
    - 0.05
    offset_along_axis:
      axis: task_goal_direction
      distance: 0.03
      mode: add_to_offset
      sign: negative
    source: yaml
    tolerance: 0.005
  termination: pose_tolerance
  type: approach
- control: force_threshold_switch
  generator: linear_cartesian
  id: contact_descend
  parameters:
    contact_distance:
      binds_to:
      - mode: replace
        path: target.offset_along_axis.distance
      default: 0.02
      range:
      - 0.01
      - 0.04
      type: scalar
    contact_force_threshold:
      binds_to:
      - mode: replace
        path: termination.force_threshold
      default: 10.0
      range:
      - 5.0
      - 20.0
      type: scalar
    descend_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.05
      range:
      - 0.02
      - 0.1
      type: scalar
  subtask_id: reach_object
  target:
    anchor: task_object
    offset:
    - 0.0
    - 0.0
    - 0.0
    offset_along_axis:
      axis: task_goal_direction
      distance: 0.02
      mode: add_to_offset
      sign: negative
    source: yaml
    tolerance: 0.005
  termination: force_exceeded
  type: contact
- control: impedance_control
  generator: linear_cartesian
  guards:
  - id: ensure_contact
    on_failure: retry
    predicate: contact_detected
    threshold: 1.0
    when: during_phase
  id: push_to_goal
  parameters:
    push_extra:
      binds_to:
      - mode: replace
        path: target.offset_along_axis.distance
      default: 0.05
      range:
      - 0.02
      - 0.08
      type: scalar
    push_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.05
      range:
      - 0.02
      - 0.12
      type: scalar
  retries:
    max_attempts: 2
    strategy: reduce_speed
  subtask_id: push_to_goal
  target:
    anchor: task_goal
    offset:
    - 0.0
    - 0.0
    - 0.0
    offset_along_axis:
      axis: task_goal_direction
      distance: 0.05
      mode: add_to_offset
      sign: positive
    source: yaml
    tolerance: 0.02
  termination: pose_tolerance
  type: push
skill: push_to_goal
subtasks:
- anchor: object
  id: reach_object
  metric: distance
  offset:
  - 0.0
  - 0.0
  - 0.0
  target_entity: tcp
  weight: 0.3
- anchor: goal
  id: push_to_goal
  metric: goal_progress
  target_entity: object
  weight: 0.7
