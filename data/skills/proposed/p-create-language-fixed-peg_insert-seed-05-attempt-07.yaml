dsl_version: 2
phases:
- control: position_control
  generator: linear_cartesian
  id: align_1
  parameters:
    lateral_offset_x:
      binds_to:
      - mode: add
        path: target.offset.x
      default: 0.0
      range:
      - -0.01
      - 0.01
      type: scalar
    lateral_offset_y:
      binds_to:
      - mode: add
        path: target.offset.y
      default: 0.0
      range:
      - -0.01
      - 0.01
      type: scalar
  subtask_id: align
  target:
    anchor: fixture
    entity: peg_socket
    offset:
    - 0.0
    - 0.0
    - 0.12
    orientation:
      align_with: channel_axis
      axis:
      - 0.0
      - 0.0
      - 1.0
      mode: align_axis
    source: yaml
    tolerance: 0.01
  termination: pose_tolerance
  type: align
- control: position_control
  generator: linear_cartesian
  id: approach_1
  parameters:
    approach_height:
      binds_to:
      - mode: replace
        path: target.offset.z
      default: 0.09
      range:
      - 0.05
      - 0.15
      type: scalar
  subtask_id: approach
  target:
    anchor: fixture
    entity: peg_socket
    offset:
    - 0.0
    - 0.0
    - 0.09
    orientation:
      align_with: channel_axis
      axis:
      - 0.0
      - 0.0
      - 1.0
      mode: align_axis
    source: yaml
    tolerance: 0.01
  termination: pose_tolerance
  type: approach
- control: force_threshold_switch
  generator: linear_cartesian
  id: contact_1
  parameters:
    contact_force:
      binds_to:
      - mode: replace
        path: termination.force_threshold
      default: 2.0
      range:
      - 1.0
      - 10.0
      type: scalar
    contact_lateral_x:
      binds_to:
      - mode: add
        path: target.offset.x
      default: 0.0
      range:
      - -0.01
      - 0.01
      type: scalar
    contact_lateral_y:
      binds_to:
      - mode: add
        path: target.offset.y
      default: 0.0
      range:
      - -0.01
      - 0.01
      type: scalar
  subtask_id: contact
  target:
    anchor: fixture
    entity: peg_socket
    offset:
    - 0.0
    - 0.0
    - 0.055
    orientation:
      align_with: channel_axis
      axis:
      - 0.0
      - 0.0
      - 1.0
      mode: align_axis
    source: yaml
  termination: force_exceeded
  type: contact
- control: impedance_control
  generator: impedance_motion
  guards:
  - id: force_below_guard
    on_failure: retry
    predicate: force_below
    threshold: 40.0
    when: during_phase
  id: insert_1
  parameters:
    insert_lateral_x:
      binds_to:
      - mode: add
        path: target.offset.x
      default: 0.0
      range:
      - -0.008
      - 0.008
      type: scalar
    insert_lateral_y:
      binds_to:
      - mode: add
        path: target.offset.y
      default: 0.0
      range:
      - -0.008
      - 0.008
      type: scalar
    insertion_depth:
      binds_to:
      - mode: replace
        path: target.offset_along_axis.distance
      default: 0.06
      range:
      - 0.03
      - 0.15
      type: scalar
    retry_offset_x:
      binds_to:
      - mode: replace
        path: retry.offset.x
      default: 0.01
      range:
      - 0.001
      - 0.02
      type: scalar
    retry_offset_y:
      binds_to:
      - mode: replace
        path: retry.offset.y
      default: 0.01
      range:
      - 0.001
      - 0.02
      type: scalar
    speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.02
      range:
      - 0.01
      - 0.08
      type: scalar
  retries:
    max_attempts: 3
    offset:
    - 0.01
    - 0.01
    - 0.0
    strategy: offset_target
  subtask_id: insert
  target:
    anchor: fixture
    entity: peg_socket
    offset:
    - 0.0
    - 0.0
    - 0.06
    offset_along_axis:
      axis: channel_axis
      distance: 0.06
      mode: add_to_offset
      sign: positive
    orientation:
      align_with: channel_axis
      axis:
      - 0.0
      - 0.0
      - 1.0
      mode: align_axis
    source: yaml
    tolerance: 0.01
  termination: pose_tolerance
  type: insert
- control: position_control
  generator: linear_cartesian
  id: retract_1
  target:
    anchor: fixture
    entity: peg_socket
    offset:
    - 0.0
    - 0.0
    - 0.15
    orientation:
      mode: keep_current
    source: yaml
    tolerance: 0.02
  termination: pose_tolerance
  type: retract
skill: peg_insert
