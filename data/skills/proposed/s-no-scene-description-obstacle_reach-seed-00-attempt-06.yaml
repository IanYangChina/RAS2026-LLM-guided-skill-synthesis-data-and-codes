dsl_version: 2
phases:
- control: position_control
  generator: linear_cartesian
  id: approach_high
  parameters:
    approach_height:
      binds_to:
      - mode: replace
        path: target.offset.z
      default: 0.4
      range:
      - 0.2
      - 0.5
      type: scalar
    speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.15
      range:
      - 0.02
      - 0.5
      type: scalar
  retries:
    max_attempts: 0
    strategy: repeat
  subtask_id: reach_high
  target:
    anchor: task_goal
    offset:
    - 0.0
    - 0.0
    - 0.4
    orientation:
      mode: keep_current
      tolerance: 3.14159
    source: yaml
    tolerance: 0.05
  termination: pose_tolerance
  type: approach
- control: position_control
  generator: linear_cartesian
  id: descend_to_goal
  parameters:
    descent_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.05
      range:
      - 0.01
      - 0.2
      type: scalar
  retries:
    max_attempts: 0
    strategy: repeat
  subtask_id: reach_goal
  target:
    anchor: task_goal
    offset:
    - 0.0
    - 0.0
    - 0.0
    orientation:
      mode: keep_current
      tolerance: 3.14159
    source: yaml
    tolerance: 0.02
  termination: pose_tolerance
  type: descend
skill: obstacle_reach
subtasks:
- anchor: goal
  id: reach_high
  metric: distance
  offset:
  - 0.0
  - 0.0
  - 0.4
  target_entity: tcp
  weight: 0.3
- anchor: goal
  id: reach_goal
  metric: distance
  offset:
  - 0.0
  - 0.0
  - 0.0
  target_entity: tcp
  weight: 0.7
