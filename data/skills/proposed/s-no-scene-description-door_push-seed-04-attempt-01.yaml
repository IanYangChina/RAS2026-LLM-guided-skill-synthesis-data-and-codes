dsl_version: 2
phases:
- control: position_control
  generator: linear_cartesian
  id: approach_door
  parameters:
    approach_x:
      binds_to:
      - mode: replace
        path: target.offset.x
      default: 0.15
      range:
      - 0.1
      - 0.2
      type: scalar
    approach_y:
      binds_to:
      - mode: replace
        path: target.offset.y
      default: 0.15
      range:
      - 0.1
      - 0.2
      type: scalar
    approach_z:
      binds_to:
      - mode: replace
        path: target.offset.z
      default: 0.4
      range:
      - 0.35
      - 0.45
      type: scalar
  subtask_id: contact_door
  target:
    anchor: world
    offset:
    - 0.15
    - 0.15
    - 0.4
    orientation:
      align_with: world_x
      axis:
      - 0
      - 0
      - 1
      mode: align_axis
      tolerance: 0.1
    source: yaml
  termination: pose_tolerance
  type: approach
- control: admittance_control
  generator: linear_cartesian
  guards:
  - args: {}
    id: high_force
    on_failure: abort
    predicate: force_below
    threshold: 30.0
    when: during_phase
  id: push_door
  parameters:
    push_distance:
      binds_to:
      - mode: replace
        path: target.offset_along_axis.distance
      default: 0.15
      range:
      - 0.05
      - 0.3
      type: scalar
    push_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.05
      range:
      - 0.01
      - 0.1
      type: scalar
  retries:
    max_attempts: 1
    strategy: reduce_speed
  subtask_id: push_open
  target:
    anchor: current_tcp
    offset_along_axis:
      axis: world_x
      distance: 0.15
      mode: add_to_offset
      sign: positive
    orientation:
      mode: keep_current
    source: yaml
  termination: time_limit
  type: push
- control: position_control
  generator: linear_cartesian
  id: retract
  target:
    anchor: current_tcp
    offset:
    - -0.05
    - 0.0
    - 0.05
    orientation:
      mode: keep_current
    source: yaml
  termination: pose_tolerance
  type: retract
skill: door_push
skill_type: arm
subtasks:
- anchor: world
  id: contact_door
  metric: distance
  offset:
  - 0.15
  - 0.15
  - 0.4
  target_entity: tcp
  weight: 0.3
- anchor: world
  id: push_open
  metric: hinge_angle
  offset:
  - 0.0
  - 0.0
  - 0.0
  target_entity: hinge
  weight: 1.0
