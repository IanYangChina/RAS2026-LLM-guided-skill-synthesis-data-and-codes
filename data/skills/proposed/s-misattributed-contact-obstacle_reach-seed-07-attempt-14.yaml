dsl_version: 2
phases:
- control: impedance_control
  generator: arc_cartesian
  guards:
  - args: {}
    id: collision_avoid
    on_failure: retry
    predicate: force_below
    threshold: 5.0
    when: during_phase
  id: approach_over_obstacle
  parameters:
    arc_height:
      binds_to:
      - mode: replace
        path: generator.arc_height
      default: 0.25
      range:
      - 0.1
      - 0.4
      type: scalar
    speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.1
      range:
      - 0.02
      - 0.2
      type: scalar
  retries:
    max_attempts: 1
    offset:
    - 0.0
    - 0.05
    - 0.0
    strategy: offset_target
  subtask_id: pre_goal
  target:
    anchor: fixture
    offset:
    - 0.0
    - 0.0
    - 0.45
    orientation:
      mode: none
    source: yaml
    tolerance: 0.02
  termination: pose_tolerance
  type: approach
- control: impedance_control
  generator: linear_cartesian
  id: descend_to_goal
  parameters:
    speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.08
      range:
      - 0.02
      - 0.15
      type: scalar
  subtask_id: reach_goal
  target:
    anchor: task_goal
    offset:
    - 0.0
    - 0.0
    - 0.0
    orientation:
      mode: none
    source: yaml
    tolerance: 0.02
  termination: pose_tolerance
  type: descend
skill: obstacle_reach
subtasks:
- anchor: fixture
  id: pre_goal
  metric: distance
  offset:
  - 0.0
  - 0.0
  - 0.45
  target_entity: tcp
  weight: 0.3
- anchor: goal
  id: reach_goal
  metric: distance
  offset:
  - 0.0
  - 0.0
  - 0.0
  target_entity: tcp
  weight: 0.7
