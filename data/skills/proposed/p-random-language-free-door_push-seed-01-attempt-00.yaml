dsl_version: 2
phases:
- control: position_control
  generator: arc_cartesian
  id: approach_handle
  parameters:
    approach_speed:
      binds_to:
      - mode: scale
        path: generator.speed
      default: 0.1
      range:
      - 0.05
      - 0.2
      type: scalar
    arc_height:
      binds_to:
      - mode: replace
        path: generator.arc_height
      default: 0.05
      range:
      - 0.02
      - 0.1
      type: scalar
  subtask_id: approach_handle
  target:
    anchor: fixture
    entity: door_panel
    offset:
    - 0.1
    - 0.18
    - 0.35
    orientation:
      mode: keep_current
    source: yaml
    tolerance: 0.02
  termination: pose_tolerance
  type: approach
- control: impedance_control
  generator: linear_cartesian
  guards:
  - args: {}
    id: force_guard
    on_failure: retry
    predicate: force_below
    threshold: 25.0
    when: during_phase
  id: push_handle
  parameters:
    push_distance:
      binds_to:
      - mode: replace
        path: target.offset_along_axis.distance
      default: 0.3
      range:
      - 0.1
      - 0.5
      type: scalar
    push_speed:
      binds_to:
      - mode: scale
        path: generator.speed
      default: 0.05
      range:
      - 0.02
      - 0.15
      type: scalar
  retries:
    max_attempts: 2
    strategy: reduce_speed
  subtask_id: push_door
  target:
    anchor: current_tcp
    offset:
    - 0
    - 0
    - 0
    offset_along_axis:
      axis: world_y
      distance: 0.3
      mode: add_to_offset
      sign: positive
    orientation:
      mode: keep_current
    source: yaml
  termination: time_limit
  type: push
skill: door_push
subtasks:
- anchor: fixture
  id: approach_handle
  metric: distance
  offset:
  - 0.1
  - 0.18
  - 0.35
  target_entity: tcp
  weight: 0.3
- anchor: fixture
  id: push_door
  metric: hinge_angle
  target_entity: hinge
  weight: 0.7
