dsl_version: 2
phases:
- control: position_control
  generator: arc_cartesian
  id: approach_1
  parameters:
    approach_arc_height:
      binds_to:
      - mode: replace
        path: generator.arc_height
      default: 0.08
      range:
      - 0.04
      - 0.15
      type: scalar
    approach_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.08
      range:
      - 0.05
      - 0.15
      type: scalar
  subtask_id: approach_entrance
  target:
    anchor: world
    offset:
    - 0.5
    - 0.15
    - 0.12
    orientation:
      mode: keep_current
    source: yaml
    tolerance: 0.02
  termination: pose_tolerance
  type: approach
- control: impedance_control
  generator: linear_cartesian
  id: descend_1
  parameters:
    descend_force_threshold:
      binds_to:
      - mode: replace
        path: termination.force_threshold
      default: 5.0
      range:
      - 3.0
      - 10.0
      type: scalar
    descend_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.02
      range:
      - 0.01
      - 0.04
      type: scalar
  subtask_id: approach_entrance
  target:
    anchor: world
    offset:
    - 0.5
    - 0.15
    - 0.04
    orientation:
      mode: keep_current
    source: yaml
    tolerance: 0.01
  termination: force_exceeded
  type: descend
- control: impedance_control
  generator: linear_cartesian
  guards:
  - id: force_limit
    on_failure: retry
    predicate: force_below
    threshold: 40.0
    when: during_phase
  id: push_1
  parameters:
    push_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.01
      range:
      - 0.005
      - 0.015
      type: scalar
    push_tolerance:
      binds_to:
      - mode: replace
        path: termination.pose_tolerance
      default: 0.02
      range:
      - 0.02
      - 0.05
      type: scalar
  retries:
    max_attempts: 2
    offset:
    - 0.005
    - 0.0
    - 0.0
    strategy: offset_target
  subtask_id: push_to_goal
  target:
    anchor: task_goal
    offset:
    - 0.0
    - 0.0
    - 0.026
    orientation:
      align_with: channel_axis
      axis:
      - 0.0
      - 0.0
      - 1.0
      mode: align_axis
      tolerance: 0.1
    source: yaml
    tolerance: 0.02
  termination: pose_tolerance
  type: push
skill: peg_channel
subtasks:
- anchor: world
  id: approach_entrance
  metric: distance
  offset:
  - 0.5
  - 0.15
  - 0.12
  target_entity: tcp
  weight: 0.3
- id: push_to_goal
  metric: goal_progress
  target_entity: object
  weight: 0.7
