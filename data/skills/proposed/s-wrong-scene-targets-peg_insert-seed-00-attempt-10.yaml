dsl_version: 2
phases:
- control: position_control
  generator: linear_cartesian
  id: align_over_hole
  parameters:
    align_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.1
      range:
      - 0.05
      - 0.2
      type: scalar
    approach_height_offset:
      binds_to:
      - mode: replace
        path: target.offset.z
      default: 0.26
      range:
      - 0.22
      - 0.3
      type: scalar
  retries:
    max_attempts: 0
    strategy: repeat
  subtask_id: approach_socket
  target:
    anchor: task_object
    offset:
    - 0.0
    - 0.0
    - 0.26
    orientation:
      align_with: world_z
      axis:
      - 0.0
      - 0.0
      - 1.0
      mode: align_axis
      tolerance: 0.03
    source: yaml
    tolerance: 0.008
  termination: pose_tolerance
  type: align
- control: force_threshold_switch
  generator: linear_cartesian
  id: descend_to_contact
  parameters:
    contact_force_threshold:
      binds_to:
      - mode: replace
        path: termination.force_threshold
      default: 15.0
      range:
      - 5.0
      - 25.0
      type: scalar
    descend_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.05
      range:
      - 0.02
      - 0.1
      type: scalar
  retries:
    max_attempts: 0
    strategy: repeat
  subtask_id: insert_into_socket
  target:
    anchor: task_object
    offset:
    - 0.0
    - 0.0
    - -0.055
    orientation:
      mode: keep_current
    source: yaml
    tolerance: 0.01
  termination: force_exceeded
  type: approach
- control: admittance_control
  generator: linear_cartesian
  id: insert_into_hole
  parameters:
    insert_force_threshold:
      binds_to:
      - mode: replace
        path: termination.force_threshold
      default: 25.0
      range:
      - 10.0
      - 40.0
      type: scalar
    insert_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.03
      range:
      - 0.01
      - 0.05
      type: scalar
  retries:
    max_attempts: 2
    offset:
    - 0.008
    - 0.008
    - 0.0
    strategy: offset_target
  subtask_id: insert_into_socket
  target:
    anchor: current_tcp
    offset_along_axis:
      axis: channel_axis
      distance: 0.06
      mode: replace_offset_projection
      sign: positive
    orientation:
      mode: keep_current
    source: yaml
  termination: force_exceeded
  type: insert
- control: position_control
  generator: linear_cartesian
  id: lift_after_insert
  parameters:
    lift_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.05
      range:
      - 0.02
      - 0.1
      type: scalar
  retries:
    max_attempts: 0
    strategy: repeat
  target:
    anchor: current_tcp
    offset:
    - 0.0
    - 0.0
    - 0.1
    orientation:
      mode: keep_current
    source: yaml
  termination: pose_tolerance
  type: lift
skill: peg_insert
subtasks:
- anchor: object
  id: approach_socket
  metric: distance
  offset:
  - 0.0
  - 0.0
  - 0.26
  target_entity: tcp
  weight: 0.3
- anchor: goal
  id: insert_into_socket
  metric: goal_progress
  target_entity: object
  weight: 0.7
