dsl_version: 2
phases:
- control: impedance_control
  generator: arc_cartesian
  id: approach_handle
  parameters:
    approach_height:
      binds_to:
      - mode: replace
        path: target.offset.z
      default: 0.43
      range:
      - 0.38
      - 0.48
      type: scalar
    approach_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.05
      range:
      - 0.02
      - 0.1
      type: scalar
  subtask_id: reach_handle
  target:
    anchor: task_object
    entity: door_panel
    offset:
    - -0.35
    - 0.0
    - 0.43
    orientation:
      mode: keep_current
    source: yaml
    tolerance: 0.01
  termination: pose_tolerance
  type: approach
- control: admittance_control
  generator: linear_cartesian
  guards:
  - args: {}
    id: contact_lost_guard
    on_failure: retry
    predicate: contact_detected
    threshold: 0
    when: during_phase
  id: pull_door
  parameters:
    pull_distance:
      binds_to:
      - mode: replace
        path: target.offset_along_axis.distance
      default: 0.15
      range:
      - 0.05
      - 0.25
      type: scalar
    pull_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.05
      range:
      - 0.01
      - 0.1
      type: scalar
  retries:
    max_attempts: 2
    offset:
    - -0.02
    - 0.0
    - 0.0
    strategy: offset_target
  subtask_id: pull_door
  target:
    anchor: task_object
    entity: door_panel
    offset:
    - -0.35
    - 0.0
    - 0.43
    offset_along_axis:
      axis: world_y
      distance: 0.1
      mode: add_to_offset
      sign: negative
    orientation:
      mode: keep_current
    source: yaml
    tolerance: 0.05
  termination: time_limit
  type: pull
skill: door_push
skill_type: arm
subtasks:
- anchor: object
  id: reach_handle
  metric: distance
  offset:
  - -0.35
  - 0.0
  - 0.43
  target_entity: tcp
  weight: 0.3
- anchor: object
  id: pull_door
  metric: distance
  offset:
  - -0.35
  - -0.1
  - 0.43
  target_entity: tcp
  weight: 0.7
