dsl_version: 2
phases:
- control: position_control
  generator: linear_cartesian
  id: approach_1
  parameters:
    approach_height:
      binds_to:
      - mode: replace
        path: target.offset.z
      default: 0.12
      range:
      - 0.05
      - 0.3
      type: scalar
  subtask_id: subtask_approach
  target:
    anchor: task_object
    entity: grasp_target
    offset:
    - 0.0
    - 0.0
    - 0.12
    orientation:
      mode: keep_current
    source: yaml
    tolerance: 0.02
  termination: pose_tolerance
  type: approach
- control: admittance_control
  generator: linear_cartesian
  id: descend_contact
  parameters:
    descend_force_threshold:
      binds_to:
      - mode: replace
        path: termination.force_threshold
      default: 2.0
      range:
      - 0.5
      - 5.0
      type: scalar
  subtask_id: subtask_approach
  target:
    anchor: task_object
    entity: grasp_target
    offset:
    - 0.0
    - 0.0
    - 0.01
    orientation:
      mode: keep_current
    source: yaml
    tolerance: 0.01
  termination: force_exceeded
  type: descend
- control: position_control
  end_effector_action: force_grasp
  guards:
  - args: {}
    id: grasp_check
    on_failure: retry
    predicate: bilateral_grasp
    threshold: 1.0
    when: after_phase
  id: grasp_1
  retries:
    max_attempts: 2
    strategy: repeat
  target:
    anchor: current_tcp
    offset:
    - 0.0
    - 0.0
    - 0.0
    source: yaml
  termination: grasp_success
  type: grasp
- control: admittance_control
  generator: linear_cartesian
  id: lift_1
  parameters:
    lift_height:
      binds_to:
      - mode: replace
        path: target.offset.z
      default: 0.25
      range:
      - 0.15
      - 0.4
      type: scalar
    lift_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.06
      range:
      - 0.03
      - 0.15
      type: scalar
  subtask_id: subtask_lift
  target:
    anchor: task_object
    entity: grasp_target
    offset:
    - 0.0
    - 0.0
    - 0.25
    orientation:
      mode: keep_current
    source: yaml
    tolerance: 0.02
  termination: pose_tolerance
  type: lift
- control: admittance_control
  generator: linear_cartesian
  id: transport_goal
  parameters:
    transport_z_offset:
      binds_to:
      - mode: replace
        path: target.offset.z
      default: 0.12
      range:
      - 0.05
      - 0.25
      type: scalar
  subtask_id: subtask_place
  target:
    anchor: task_goal
    offset:
    - 0.0
    - 0.0
    - 0.1
    orientation:
      mode: keep_current
    source: yaml
    tolerance: 0.02
  termination: pose_tolerance
  type: approach
- control: admittance_control
  generator: linear_cartesian
  id: descend_place
  parameters:
    place_force_threshold:
      binds_to:
      - mode: replace
        path: termination.force_threshold
      default: 2.0
      range:
      - 0.5
      - 5.0
      type: scalar
  subtask_id: subtask_place
  target:
    anchor: task_goal
    offset:
    - 0.0
    - 0.0
    - 0.0
    orientation:
      mode: keep_current
    source: yaml
    tolerance: 0.01
  termination: force_exceeded
  type: descend
- control: position_control
  end_effector_action: open
  generator: null
  id: release_1
  parameters:
    release_duration:
      binds_to:
      - mode: replace
        path: duration.max_time
      default: 0.5
      range:
      - 0.3
      - 1.0
      type: scalar
  target:
    anchor: current_tcp
    offset:
    - 0.0
    - 0.0
    - 0.0
    source: yaml
  termination: time_limit
  type: release
skill: grasp_place
skill_type: arm_gripper
subtasks:
- anchor: object
  id: subtask_approach
  offset:
  - 0.0
  - 0.0
  - 0.1
  weight: 0.2
- anchor: object
  id: subtask_lift
  offset:
  - 0.0
  - 0.0
  - 0.2
  target_entity: object
  weight: 0.3
- id: subtask_place
  metric: goal_progress
  target_entity: object
  weight: 0.5
