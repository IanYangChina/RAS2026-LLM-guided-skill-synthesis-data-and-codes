dsl_version: 2
phases:
- control: position_control
  generator: linear_cartesian
  id: approach_behind_peg
  parameters:
    approach_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.1
      range:
      - 0.05
      - 0.2
      type: scalar
    approach_y:
      binds_to:
      - mode: replace
        path: target.offset.y
      default: 0.1
      range:
      - 0.05
      - 0.15
      type: scalar
    approach_z:
      binds_to:
      - mode: replace
        path: target.offset.z
      default: 0.1
      range:
      - 0.06
      - 0.15
      type: scalar
  subtask_id: position_behind_peg
  target:
    anchor: task_object
    offset:
    - 0.0
    - 0.1
    - 0.1
    orientation:
      mode: keep_current
    source: yaml
    tolerance: 0.01
  termination: pose_tolerance
  type: approach
- control: position_control
  generator: linear_cartesian
  guards:
  - args: {}
    id: contact_before_push
    on_failure: retry
    predicate: contact_detected
    threshold: 1.0
    when: after_phase
  id: descend_to_push
  parameters:
    descend_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.05
      range:
      - 0.02
      - 0.1
      type: scalar
    descend_y:
      binds_to:
      - mode: replace
        path: target.offset.y
      default: 0.02
      range:
      - -0.01
      - 0.05
      type: scalar
    descend_z:
      binds_to:
      - mode: replace
        path: target.offset.z
      default: 0.04
      range:
      - 0.02
      - 0.07
      type: scalar
  retries:
    max_attempts: 2
    offset:
    - 0.0
    - -0.005
    - -0.002
    strategy: offset_target
  subtask_id: position_behind_peg
  target:
    anchor: task_object
    offset:
    - 0.0
    - 0.02
    - 0.04
    orientation:
      mode: keep_current
    source: yaml
    tolerance: 0.01
  termination: pose_tolerance
  type: descend
- control: impedance_control
  generator: impedance_motion
  guards:
  - args: {}
    id: object_progress_monitor
    on_failure: continue
    predicate: object_progress
    threshold: 0.02
    when: during_phase
  id: push_through_channel
  parameters:
    insertion_depth:
      binds_to:
      - mode: replace
        path: target.offset_along_axis.distance
      default: 0.16
      range:
      - 0.05
      - 0.2
      type: scalar
    push_force_threshold:
      binds_to:
      - mode: replace
        path: termination.force_threshold
      default: 25.0
      range:
      - 10.0
      - 35.0
      type: scalar
    push_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.04
      range:
      - 0.01
      - 0.08
      type: scalar
    push_y_offset:
      binds_to:
      - mode: replace
        path: target.offset.y
      default: 0.02
      range:
      - -0.02
      - 0.05
      type: scalar
    push_z_offset:
      binds_to:
      - mode: replace
        path: target.offset.z
      default: 0.04
      range:
      - 0.02
      - 0.07
      type: scalar
  retries:
    max_attempts: 1
    strategy: reduce_speed
  subtask_id: push_through_channel
  target:
    anchor: task_object
    offset:
    - 0.0
    - 0.02
    - 0.04
    offset_along_axis:
      axis: channel_axis
      distance: 0.16
      mode: add_to_offset
      sign: positive
    orientation:
      align_with: channel_axis
      axis:
      - 0.0
      - 0.0
      - 1.0
      mode: align_axis
      tolerance: 0.1
    source: yaml
  termination: force_exceeded
  type: push
skill: peg_channel
skill_type: arm_gripper
subtasks:
- anchor: object
  id: position_behind_peg
  metric: distance
  offset:
  - 0.0
  - 0.15
  - 0.1
  target_entity: tcp
  weight: 0.3
- anchor: goal
  id: push_through_channel
  metric: goal_progress
  target_entity: object
  weight: 0.7
