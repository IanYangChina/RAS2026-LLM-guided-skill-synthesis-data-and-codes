dsl_version: 2
phases:
- control: position_control
  generator: linear_cartesian
  id: approach
  parameters:
    approach_height:
      binds_to:
      - mode: replace
        path: target.offset.z
      default: 0.04
      range:
      - 0.02
      - 0.06
      type: scalar
    approach_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.05
      range:
      - 0.01
      - 0.1
      type: scalar
  subtask_id: contact_object
  target:
    anchor: task_object
    offset:
    - 0.0
    - 0.0
    - 0.04
    orientation:
      mode: keep_current
    source: yaml
    tolerance: 0.005
  termination: pose_tolerance
  type: approach
- control: force_threshold_switch
  generator: linear_cartesian
  id: descend
  parameters:
    descend_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.03
      range:
      - 0.01
      - 0.1
      type: scalar
    force_threshold:
      binds_to:
      - mode: replace
        path: termination.force_threshold
      default: 5.0
      range:
      - 1.0
      - 25.0
      type: scalar
  subtask_id: contact_object
  target:
    anchor: task_object
    offset:
    - 0.0
    - 0.0
    - 0.0
    orientation:
      mode: keep_current
    source: yaml
  termination: force_exceeded
  type: descend
- control: impedance_control
  generator: linear_cartesian
  id: push
  parameters:
    push_distance:
      binds_to:
      - mode: replace
        path: target.offset_along_axis.distance
      default: 0.15
      range:
      - 0.1
      - 0.2
      type: scalar
    push_height_offset:
      binds_to:
      - mode: replace
        path: target.offset.z
      default: 0.027
      range:
      - 0.02
      - 0.04
      type: scalar
    push_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.01
      range:
      - 0.005
      - 0.05
      type: scalar
  subtask_id: move_to_goal
  target:
    anchor: task_object
    offset:
    - 0.0
    - 0.0
    - 0.027
    offset_along_axis:
      axis: task_goal_direction
      distance: 0.15
      mode: add_to_offset
      sign: positive
    orientation:
      mode: keep_current
    source: yaml
  termination: time_limit
  type: push
skill: push_to_goal
subtasks:
- anchor: object
  id: contact_object
  weight: 0.3
- id: move_to_goal
  metric: goal_progress
  target_entity: object
  weight: 0.7
