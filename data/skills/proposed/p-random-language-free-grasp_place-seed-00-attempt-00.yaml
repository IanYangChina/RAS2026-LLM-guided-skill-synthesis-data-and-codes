dsl_version: 2
phases:
- control: position_control
  generator: linear_cartesian
  id: approach_1
  parameters:
    approach_height:
      binds_to:
      - mode: replace
        path: target.offset.z
      default: 0.1
      range:
      - 0.05
      - 0.3
      type: scalar
    approach_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.05
      range:
      - 0.02
      - 0.1
      type: scalar
  subtask_id: reach_object
  target:
    anchor: task_object
    offset:
    - 0
    - 0
    - 0.1
    orientation:
      mode: keep_current
    source: yaml
    tolerance: 0.02
  termination: pose_tolerance
  type: approach
- control: position_control
  generator: linear_cartesian
  id: descend_1
  parameters:
    descend_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.02
      range:
      - 0.01
      - 0.05
      type: scalar
    grasp_offset_z:
      binds_to:
      - mode: replace
        path: target.offset.z
      default: 0.03
      range:
      - 0.02
      - 0.05
      type: scalar
  subtask_id: grasp_object
  target:
    anchor: task_object
    offset:
    - 0
    - 0
    - 0.03
    orientation:
      mode: keep_current
    source: yaml
    tolerance: 0.01
  termination: pose_tolerance
  type: descend
- control: null
  end_effector_action: force_grasp
  generator: null
  guards:
  - args: {}
    id: grip_check
    on_failure: retry
    predicate: bilateral_grasp
    threshold: 0.5
    when: before_phase
  id: grasp_1
  retries:
    max_attempts: 2
    offset:
    - 0
    - 0
    - -0.005
    strategy: offset_target
  subtask_id: grasp_object
  target:
    anchor: current_tcp
    offset:
    - 0
    - 0
    - 0
    source: yaml
  termination: time_limit
  type: grasp
- control: position_control
  generator: linear_cartesian
  guards:
  - args: {}
    id: object_lifted_check
    on_failure: abort
    predicate: object_lifted
    threshold: 0.02
    when: after_phase
  id: lift_1
  parameters:
    lift_height:
      binds_to:
      - mode: replace
        path: target.offset.z
      default: 0.15
      range:
      - 0.08
      - 0.25
      type: scalar
    lift_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.05
      range:
      - 0.02
      - 0.1
      type: scalar
  subtask_id: grasp_object
  target:
    anchor: task_object
    offset:
    - 0
    - 0
    - 0.15
    orientation:
      mode: keep_current
    source: yaml
    tolerance: 0.02
  termination: pose_tolerance
  type: lift
- control: position_control
  generator: linear_cartesian
  id: approach_goal_1
  parameters:
    approach_speed_2:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.05
      range:
      - 0.02
      - 0.1
      type: scalar
    goal_offset_z:
      binds_to:
      - mode: replace
        path: target.offset.z
      default: 0
      range:
      - -0.05
      - 0.05
      type: scalar
  subtask_id: place_goal
  target:
    anchor: task_goal
    offset:
    - 0
    - 0
    - 0
    orientation:
      mode: keep_current
    source: yaml
    tolerance: 0.02
  termination: pose_tolerance
  type: approach
- control: null
  end_effector_action: open
  generator: null
  guards:
  - args: {}
    id: gripper_open_check
    on_failure: retry
    predicate: gripper_closed
    threshold: 0.5
    when: after_phase
  id: release_1
  retries:
    max_attempts: 1
    offset:
    - 0
    - 0
    - 0
    strategy: offset_target
  subtask_id: place_goal
  target:
    anchor: current_tcp
    offset:
    - 0
    - 0
    - 0
    source: yaml
  termination: time_limit
  type: release
- control: position_control
  generator: linear_cartesian
  id: retract_1
  parameters:
    retract_distance:
      binds_to:
      - mode: replace
        path: target.offset.z
      default: 0.05
      range:
      - 0.02
      - 0.1
      type: scalar
    retract_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.05
      range:
      - 0.02
      - 0.1
      type: scalar
  subtask_id: place_goal
  target:
    anchor: task_goal
    offset:
    - 0
    - 0
    - -0.05
    orientation:
      mode: keep_current
    source: yaml
    tolerance: 0.02
  termination: pose_tolerance
  type: retract
skill: grasp_place
skill_type: arm_gripper
subtasks:
- anchor: object
  id: reach_object
  metric: distance
  offset:
  - 0
  - 0
  - 0.1
  target_entity: tcp
  weight: 0.3
- anchor: object
  id: grasp_object
  metric: distance
  offset:
  - 0
  - 0
  - 0
  target_entity: object
  weight: 0.2
- anchor: goal
  id: place_goal
  metric: goal_progress
  offset:
  - 0
  - 0
  - 0
  target_entity: tcp
  weight: 0.5
