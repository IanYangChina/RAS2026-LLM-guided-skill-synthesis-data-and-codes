dsl_version: 2
phases:
- control: position_control
  generator: linear_cartesian
  id: approach_1
  parameters:
    speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.05
      range:
      - 0.01
      - 0.1
      type: scalar
  subtask_id: reach_entry
  target:
    anchor: fixture
    entity: peg_socket
    offset:
    - 0
    - 0
    - 0.05
    orientation:
      align_with: insertion_axis
      axis:
      - 0
      - 0
      - 1
      mode: align_axis
      tolerance: 0.05
    source: yaml
    tolerance: 0.005
  termination: pose_tolerance
  type: approach
- control: position_control
  generator: linear_cartesian
  id: align_1
  parameters:
    lateral_offset_x:
      binds_to:
      - mode: add
        path: target.offset.x
      default: 0.0
      range:
      - -0.01
      - 0.01
      type: scalar
    lateral_offset_y:
      binds_to:
      - mode: add
        path: target.offset.y
      default: 0.0
      range:
      - -0.01
      - 0.01
      type: scalar
  subtask_id: reach_entry
  target:
    anchor: fixture
    entity: peg_socket
    offset:
    - 0
    - 0
    - 0
    orientation:
      align_with: insertion_axis
      axis:
      - 0
      - 0
      - 1
      mode: align_axis
      tolerance: 0.02
    source: yaml
    tolerance: 0.002
  termination: pose_tolerance
  type: align
- control: force_threshold_switch
  generator: linear_cartesian
  id: probe_1
  parameters:
    contact_force_threshold:
      binds_to:
      - mode: replace
        path: termination.force_threshold
      default: 5.0
      range:
      - 1.0
      - 15.0
      type: scalar
  subtask_id: insertion
  target:
    anchor: fixture
    entity: peg_socket
    offset:
    - 0
    - 0
    - -0.01
    orientation:
      mode: keep_current
    source: yaml
    tolerance: 0.002
  termination: force_exceeded
  type: contact
- control: impedance_control
  generator: linear_cartesian
  id: insert_1
  parameters:
    insertion_depth:
      binds_to:
      - mode: replace
        path: target.offset_along_axis.distance
      default: 0.04
      range:
      - 0.02
      - 0.05
      type: scalar
  subtask_id: insertion
  target:
    anchor: fixture
    entity: peg_socket
    offset:
    - 0
    - 0
    - 0
    offset_along_axis:
      axis: insertion_axis
      distance: 0.04
      mode: add_to_offset
      sign: positive
    orientation:
      mode: keep_current
    source: yaml
    tolerance: 0.003
  termination: pose_tolerance
  type: insert
- control: position_control
  generator: linear_cartesian
  id: retract_1
  subtask_id: insertion
  target:
    anchor: current_tcp
    offset:
    - 0
    - 0
    - 0.05
    orientation:
      mode: keep_current
    source: yaml
    tolerance: 0.01
  termination: pose_tolerance
  type: retract
skill: peg_insert
skill_type: arm
subtasks:
- anchor: fixture
  id: reach_entry
  metric: distance
  offset:
  - 0
  - 0
  - 0
  target_entity: tcp
  weight: 0.4
- anchor: goal
  id: insertion
  metric: goal_progress
  offset:
  - 0
  - 0
  - 0
  target_entity: tcp
  weight: 0.6
