dsl_version: 2
phases:
- control: position_control
  generator: linear_cartesian
  id: approach_handle
  parameters:
    speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.05
      range:
      - 0.01
      - 0.1
      type: scalar
  subtask_id: reach_handle
  target:
    anchor: fixture
    entity: door_panel
    offset:
    - -0.4
    - -0.02
    - 0.4
    source: yaml
    tolerance: 0.01
  termination: pose_tolerance
  type: approach
- control: position_control
  generator: linear_cartesian
  id: descend_to_handle
  subtask_id: reach_handle
  target:
    anchor: fixture
    entity: door_panel
    offset:
    - -0.4
    - -0.02
    - 0.35
    source: yaml
    tolerance: 0.01
  termination: contact_detected
  type: descend
- control: impedance_control
  generator: impedance_motion
  id: push_door
  parameters:
    orient_tolerance:
      binds_to:
      - mode: replace
        path: target.orientation.tolerance
      default: 0.05
      range:
      - 0.01
      - 0.1
      type: angle
    push_distance:
      binds_to:
      - mode: replace
        path: target.offset_along_axis.distance
      default: 0.15
      range:
      - 0.05
      - 0.3
      type: scalar
    push_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.05
      range:
      - 0.01
      - 0.1
      type: scalar
  subtask_id: push_door
  target:
    anchor: fixture
    entity: door_panel
    offset:
    - -0.4
    - -0.02
    - 0.35
    offset_along_axis:
      axis: world_x
      distance: 0.15
      mode: add_to_offset
      sign: positive
    orientation:
      align_with: world_x
      axis:
      - 1
      - 0
      - 0
      mode: align_axis
      tolerance: 0.05
    source: yaml
    tolerance: 0.02
  termination: pose_tolerance
  type: push
skill: door_push
skill_type: arm
subtasks:
- anchor: fixture
  id: reach_handle
  metric: distance
  offset:
  - -0.4
  - -0.02
  - 0.35
  target_entity: tcp
  weight: 0.2
- anchor: fixture
  id: push_door
  metric: hinge_angle
  target_entity: hinge
  weight: 0.8
