dsl_version: 2
phases:
- control: position_control
  generator: linear_cartesian
  id: approach_entry
  parameters:
    approach_speed:
      binds_to:
      - mode: add
        path: generator.speed
      default: 0.05
      range:
      - 0.01
      - 0.1
      type: scalar
    lateral_offset_x:
      binds_to:
      - mode: add
        path: target.offset.x
      default: 0.0
      range:
      - -0.02
      - 0.02
      type: scalar
    lateral_offset_y:
      binds_to:
      - mode: add
        path: target.offset.y
      default: 0.0
      range:
      - -0.02
      - 0.02
      type: scalar
  subtask_id: reach_entry
  target:
    anchor: fixture
    entity: peg_socket
    offset:
    - 0.0
    - 0.0
    - 0.08
    orientation:
      align_with: insertion_axis
      axis:
      - 0.0
      - 0.0
      - 1.0
      mode: align_axis
      tolerance: 0.1
    source: yaml
    tolerance: 0.005
  termination: pose_tolerance
  type: approach
- control: force_threshold_switch
  generator: linear_cartesian
  guards:
  - args: {}
    id: force_limit
    on_failure: abort
    predicate: force_below
    threshold: 40.0
    when: during_phase
  id: contact_verify
  parameters:
    contact_force:
      binds_to:
      - mode: replace
        path: termination.force_threshold
      default: 8.0
      range:
      - 1.0
      - 15.0
      type: scalar
    contact_speed:
      binds_to:
      - mode: add
        path: generator.speed
      default: 0.02
      range:
      - 0.005
      - 0.05
      type: scalar
  retries:
    max_attempts: 1
    offset:
    - 0.002
    - 0.002
    - 0.0
    strategy: offset_target
  subtask_id: reach_entry
  target:
    anchor: fixture
    entity: peg_socket
    offset:
    - 0.0
    - 0.0
    - 0.03
    orientation:
      mode: keep_current
    source: yaml
  termination: force_exceeded
  type: contact
- control: impedance_control
  generator: impedance_motion
  guards:
  - args: {}
    id: max_force_guard
    on_failure: abort
    predicate: force_below
    threshold: 40.0
    when: during_phase
  id: insert_1
  parameters:
    insertion_depth:
      binds_to:
      - mode: replace
        path: target.offset_along_axis.distance
      default: 0.03
      range:
      - 0.01
      - 0.04
      type: scalar
    insertion_force_threshold:
      binds_to:
      - mode: replace
        path: termination.force_threshold
      default: 20.0
      range:
      - 5.0
      - 35.0
      type: scalar
    insertion_speed:
      binds_to:
      - mode: add
        path: generator.speed
      default: 0.02
      range:
      - 0.005
      - 0.05
      type: scalar
  retries:
    max_attempts: 1
    offset:
    - 0.002
    - 0.002
    - 0.0
    strategy: offset_target
  subtask_id: insertion_complete
  target:
    anchor: fixture
    entity: peg_socket
    offset:
    - 0.0
    - 0.0
    - 0.0
    offset_along_axis:
      axis: insertion_axis
      distance: 0.03
      mode: add_to_offset
      sign: positive
    orientation:
      mode: keep_current
    source: yaml
  termination: force_exceeded
  type: insert
skill: peg_insert
skill_type: arm_gripper
subtasks:
- anchor: fixture
  id: reach_entry
  metric: distance
  offset:
  - 0.0
  - 0.0
  - 0.08
  target_entity: tcp
  weight: 0.3
- anchor: goal
  id: insertion_complete
  metric: goal_progress
  target_entity: object
  weight: 0.7
