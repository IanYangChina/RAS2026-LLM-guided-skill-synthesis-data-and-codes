dsl_version: 2
phases:
- control: position_control
  generator: linear_cartesian
  id: approach_over
  parameters:
    speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.05
      range:
      - 0.01
      - 0.15
      type: scalar
  subtask_id: reach_goal
  target:
    anchor: world
    offset:
    - 0.35
    - 0.0
    - 0.35
    orientation:
      mode: keep_current
    source: yaml
    tolerance: 0.02
  termination: pose_tolerance
  type: approach
- control: position_control
  generator: linear_cartesian
  id: descend_to_goal
  parameters:
    speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.04
      range:
      - 0.01
      - 0.1
      type: scalar
  retries:
    max_attempts: 2
    offset:
    - 0.0
    - 0.0
    - 0.02
    strategy: offset_target
  subtask_id: reach_goal
  target:
    anchor: world
    offset:
    - 0.35
    - 0.0
    - 0.32
    orientation:
      mode: keep_current
    source: yaml
    tolerance: 0.02
  termination: pose_tolerance
  type: descend
skill: obstacle_reach
subtasks:
- anchor: world
  id: reach_goal
  metric: distance
  offset:
  - 0.35
  - 0.0
  - 0.32
  target_entity: tcp
  weight: 1.0
