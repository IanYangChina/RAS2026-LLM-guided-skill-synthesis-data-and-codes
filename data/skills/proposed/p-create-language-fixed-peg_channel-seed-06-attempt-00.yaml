dsl_version: 2
phases:
- control: position_control
  generator: linear_cartesian
  id: approach_behind
  parameters:
    approach_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.05
      range:
      - 0.01
      - 0.1
      type: scalar
  target:
    anchor: task_object
    entity: peg
    offset:
    - 0.0
    - 0.03
    - 0.06
    orientation:
      align_with: channel_axis
      axis:
      - 0.0
      - 0.0
      - 1.0
      mode: align_axis
      tolerance: 0.1
    source: yaml
    tolerance: 0.02
  termination: pose_tolerance
  type: approach
- control: position_control
  generator: linear_cartesian
  id: descend_to_peg
  parameters:
    descend_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.02
      range:
      - 0.01
      - 0.05
      type: scalar
  target:
    anchor: task_object
    entity: peg
    offset:
    - 0.0
    - 0.03
    - 0.04
    orientation:
      mode: keep_current
    source: yaml
    tolerance: 0.01
  termination: pose_tolerance
  type: descend
- control: impedance_control
  generator: impedance_motion
  guards:
  - args: {}
    id: force_guard
    on_failure: retry
    predicate: force_below
    threshold: 40.0
    when: during_phase
  id: push_along_channel
  parameters:
    push_distance:
      binds_to:
      - mode: replace
        path: target.offset_along_axis.distance
      default: 0.18
      range:
      - 0.14
      - 0.22
      type: scalar
    push_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.02
      range:
      - 0.005
      - 0.05
      type: scalar
  retries:
    max_attempts: 2
    offset:
    - 0.005
    - 0.0
    - 0.0
    strategy: offset_target
  target:
    anchor: current_tcp
    offset:
    - 0.0
    - 0.0
    - 0.0
    offset_along_axis:
      axis: channel_axis
      distance: 0.18
      mode: add_to_offset
      sign: positive
    orientation:
      mode: keep_current
    source: yaml
  termination: contact_lost
  type: push
skill: peg_channel
