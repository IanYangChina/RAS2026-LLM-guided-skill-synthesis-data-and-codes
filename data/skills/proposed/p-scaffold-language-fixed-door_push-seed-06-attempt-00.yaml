dsl_version: 2
phases:
- control: position_control
  generator: linear_cartesian
  guards: []
  id: approach_1
  parameters:
    approach_height:
      binds_to:
      - mode: replace
        path: target.offset.z
      default: 0.35
      range:
      - 0.3
      - 0.5
      type: scalar
    speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.05
      range:
      - 0.01
      - 0.1
      type: scalar
  retries:
    max_attempts: 0
    offset:
    - 0.0
    - 0.0
    - 0.0
    strategy: repeat
  target:
    anchor: fixture
    entity: door_panel
    offset:
    - -0.4
    - 0.03
    - 0.35
    orientation:
      mode: keep_current
    source: yaml
    tolerance: 0.02
  termination: pose_tolerance
  type: approach
- control: force_threshold_switch
  generator: linear_cartesian
  guards: []
  id: contact_1
  parameters:
    contact_force:
      binds_to:
      - mode: replace
        path: termination.force_threshold
      default: 10.0
      range:
      - 5.0
      - 20.0
      type: scalar
    speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.01
      range:
      - 0.005
      - 0.03
      type: scalar
  retries:
    max_attempts: 0
    offset:
    - 0.0
    - 0.0
    - 0.0
    strategy: repeat
  target:
    anchor: fixture
    entity: door_panel
    offset:
    - -0.4
    - -0.02
    - 0.35
    orientation:
      mode: keep_current
    source: yaml
  termination: force_exceeded
  type: contact
- control: impedance_control
  generator: linear_cartesian
  guards:
  - args: {}
    id: force_guard
    on_failure: retry
    predicate: force_below
    threshold: 30.0
    when: during_phase
  id: push_1
  parameters:
    max_time:
      binds_to:
      - mode: replace
        path: duration.max_time
      default: 5.0
      range:
      - 2.0
      - 10.0
      type: scalar
    push_depth:
      binds_to:
      - mode: replace
        path: target.offset_along_axis.distance
      default: 0.2
      range:
      - 0.1
      - 0.4
      type: scalar
    push_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.02
      range:
      - 0.01
      - 0.05
      type: scalar
  retries:
    max_attempts: 2
    offset:
    - 0.0
    - 0.0
    - 0.0
    strategy: reduce_speed
  subtask_id: door_push_progress
  target:
    anchor: fixture
    entity: door_panel
    offset:
    - -0.4
    - -0.02
    - 0.35
    offset_along_axis:
      axis: world_y
      distance: 0.2
      mode: add_to_offset
      sign: negative
    orientation:
      mode: keep_current
    source: yaml
  termination: time_limit
  type: push
- control: position_control
  generator: arc_cartesian
  guards: []
  id: retract_1
  parameters:
    retract_height:
      binds_to:
      - mode: replace
        path: target.offset.z
      default: 0.1
      range:
      - 0.05
      - 0.2
      type: scalar
    speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.05
      range:
      - 0.01
      - 0.1
      type: scalar
  retries:
    max_attempts: 0
    offset:
    - 0.0
    - 0.0
    - 0.0
    strategy: repeat
  target:
    anchor: current_tcp
    offset:
    - 0.0
    - 0.05
    - 0.1
    orientation:
      mode: keep_current
    source: yaml
  termination: pose_tolerance
  type: retract
skill: door_push
skill_type: arm
subtasks:
- anchor: goal
  id: door_push_progress
  metric: hinge_angle
  offset:
  - 0.0
  - 0.0
  - 0.0
  target_entity: hinge
  weight: 1.0
