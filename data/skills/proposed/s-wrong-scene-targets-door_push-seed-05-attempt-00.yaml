dsl_version: 2
phases:
- control: position_control
  generator: linear_cartesian
  id: approach_handle
  parameters:
    approach_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.1
      range:
      - 0.02
      - 0.2
      type: scalar
  subtask_id: push_handle
  target:
    anchor: fixture
    entity: door_panel
    offset:
    - -0.4
    - 0.01
    - 0.35
    orientation:
      mode: keep_current
    source: yaml
    tolerance: 0.01
  termination: pose_tolerance
  type: approach
- control: impedance_control
  generator: linear_cartesian
  guards:
  - args: {}
    id: hinge_check
    on_failure: continue
    predicate: hinge_delta_reached
    threshold: 0.9
    when: during_phase
  id: push_door
  parameters:
    hinge_threshold:
      binds_to:
      - mode: replace
        path: guards.hinge_check.threshold
      default: 0.9
      range:
      - 0.5
      - 1.0
      type: scalar
    push_distance:
      binds_to:
      - mode: replace
        path: target.offset_along_axis.distance
      default: 0.15
      range:
      - 0.05
      - 0.2
      type: scalar
    push_force_threshold:
      binds_to:
      - mode: replace
        path: termination.force_threshold
      default: 25
      range:
      - 10
      - 30
      type: scalar
  subtask_id: push_handle
  target:
    anchor: fixture
    entity: door_panel
    offset:
    - -0.4
    - 0.01
    - 0.35
    offset_along_axis:
      axis: world_y
      distance: 0.15
      mode: add_to_offset
      sign: negative
    orientation:
      mode: keep_current
    source: yaml
    tolerance: 0.02
  termination: force_exceeded
  type: push
skill: door_push
skill_type: arm
subtasks:
- anchor: fixture
  id: push_handle
  metric: hinge_angle
  offset:
  - 0
  - 0
  - 0
  target_entity: hinge
  weight: 1.0
