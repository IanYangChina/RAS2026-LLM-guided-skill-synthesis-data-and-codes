dsl_version: 2
phases:
- control: position_control
  generator: arc_cartesian
  guards:
  - id: goal_reached
    on_failure: retry
    predicate: pose_within_tolerance
    threshold: 0.02
    when: after_phase
  id: approach_to_goal
  parameters:
    approach_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.2
      range:
      - 0.1
      - 0.5
      type: scalar
    arc_height:
      binds_to:
      - mode: replace
        path: generator.arc_height
      default: 0.2
      range:
      - 0.1
      - 0.4
      type: scalar
    goal_x_offset:
      binds_to:
      - mode: add
        path: target.offset.x
      default: 0.0
      range:
      - -0.05
      - 0.05
      type: scalar
    goal_y_offset:
      binds_to:
      - mode: add
        path: target.offset.y
      default: 0.0
      range:
      - -0.05
      - 0.05
      type: scalar
  retries:
    max_attempts: 2
    offset:
    - 0.0
    - 0.02
    - 0.02
    strategy: offset_target
  subtask_id: reach_goal
  target:
    anchor: world
    offset:
    - 0.35
    - 0.0
    - 0.32
    orientation:
      mode: keep_current
    source: yaml
    tolerance: 0.02
  termination: pose_tolerance
  type: approach
skill: obstacle_reach
skill_type: arm
subtasks:
- anchor: world
  id: reach_goal
  metric: distance
  offset:
  - 0.35
  - 0.0
  - 0.32
  target_entity: tcp
  weight: 1.0
