dsl_version: 2
phases:
- control: position_control
  generator: linear_cartesian
  id: approach_above
  parameters:
    approach_height:
      binds_to:
      - mode: replace
        path: target.offset.z
      default: 0.06
      range:
      - 0.04
      - 0.09
      type: scalar
  subtask_id: approach_target
  target:
    anchor: task_object
    entity: body
    offset:
    - 0.0
    - 0.0
    - 0.06
    orientation:
      mode: keep_current
    source: yaml
  termination: time_limit
  type: approach
- control: position_control
  generator: linear_cartesian
  id: descend_behind
  parameters:
    behind_distance:
      binds_to:
      - mode: replace
        path: target.offset_along_axis.distance
      default: 0.06
      range:
      - 0.03
      - 0.09
      type: scalar
  subtask_id: approach_target
  target:
    anchor: task_object
    entity: body
    offset:
    - 0.0
    - 0.0
    - 0.0
    offset_along_axis:
      axis: task_goal_direction
      distance: 0.05
      mode: add_to_offset
      sign: negative
    orientation:
      mode: keep_current
    source: yaml
  termination: time_limit
  type: descend
- control: admittance_control
  generator: linear_cartesian
  guards:
  - args: {}
    id: force_check
    on_failure: retry
    predicate: force_below
    threshold: 22.0
    when: during_phase
  id: push_to_goal
  parameters:
    push_distance:
      binds_to:
      - mode: replace
        path: target.offset_along_axis.distance
      default: 0.2
      range:
      - 0.1
      - 0.4
      type: scalar
    push_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.08
      range:
      - 0.05
      - 0.15
      type: scalar
  retries:
    max_attempts: 1
    offset:
    - 0.01
    - 0.01
    - 0.0
    strategy: offset_target
  subtask_id: push_goal
  target:
    anchor: task_object
    entity: body
    offset:
    - 0.0
    - 0.0
    - 0.0
    offset_along_axis:
      axis: task_goal_direction
      distance: 0.2
      mode: add_to_offset
      sign: positive
    orientation:
      mode: keep_current
    source: yaml
  termination: time_limit
  type: push
- control: position_control
  generator: arc_cartesian
  id: retract_up
  target:
    anchor: current_tcp
    offset:
    - 0.0
    - 0.0
    - 0.1
    orientation:
      mode: keep_current
    source: yaml
  termination: pose_tolerance
  type: retract
skill: push_to_goal
subtasks:
- anchor: object
  id: approach_target
  metric: distance
  offset:
  - 0.0
  - 0.0
  - 0.05
  target_entity: tcp
  weight: 0.3
- anchor: goal
  id: push_goal
  metric: goal_progress
  target_entity: object
  weight: 0.7
