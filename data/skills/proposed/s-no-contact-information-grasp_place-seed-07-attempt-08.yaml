dsl_version: 2
phases:
- control: position_control
  generator: linear_cartesian
  id: approach_to_object
  orientation:
    mode: keep_current
  parameters:
    approach_height:
      binds_to:
      - mode: add
        path: target.offset.z
      default: 0.15
      range:
      - 0.05
      - 0.2
      type: scalar
    approach_speed:
      binds_to:
      - mode: scale
        path: generator.speed
      default: 0.05
      range:
      - 0.02
      - 0.15
      type: scalar
  subtask_id: reach_object
  target:
    anchor: task_object
    entity: grasp_target
    offset:
    - 0.0
    - 0.0
    - 0.1
    source: yaml
    tolerance: 0.02
  termination: pose_tolerance
  type: approach
- control: admittance_control
  generator: linear_cartesian
  guards:
  - args: {}
    id: contact_object
    on_failure: continue
    predicate: contact_detected
    threshold: 0.5
    when: during_phase
  id: descend_to_object
  orientation:
    mode: keep_current
  parameters:
    descend_speed:
      binds_to:
      - mode: scale
        path: generator.speed
      default: 0.03
      range:
      - 0.01
      - 0.08
      type: scalar
    grasp_offset_z:
      binds_to:
      - mode: replace
        path: target.offset.z
      default: 0.06
      range:
      - 0.02
      - 0.1
      type: scalar
  subtask_id: reach_object
  target:
    anchor: task_object
    entity: grasp_target
    offset:
    - 0.0
    - 0.0
    - 0.06
    source: yaml
    tolerance: 0.01
  termination: pose_tolerance
  type: descend
- control: position_control
  end_effector_action: force_grasp
  generator: null
  guards:
  - args: {}
    id: bilateral_grasp
    on_failure: retry
    predicate: bilateral_grasp
    threshold: 0.5
    when: after_phase
  id: grasp_object
  orientation:
    mode: keep_current
  retries:
    max_attempts: 2
    offset:
    - 0.0
    - 0.0
    - -0.005
    strategy: offset_target
  target:
    anchor: current_tcp
    offset:
    - 0.0
    - 0.0
    - 0.0
    source: yaml
  termination: grasp_success
  type: grasp
- control: position_control
  generator: linear_cartesian
  guards:
  - args: {}
    id: object_lifted
    on_failure: retry
    predicate: object_lifted
    threshold: 0.05
    when: after_phase
  id: lift_object
  orientation:
    mode: keep_current
  parameters:
    lift_height:
      binds_to:
      - mode: replace
        path: target.offset_along_axis.distance
      default: 0.15
      range:
      - 0.08
      - 0.25
      type: scalar
    lift_speed:
      binds_to:
      - mode: scale
        path: generator.speed
      default: 0.05
      range:
      - 0.02
      - 0.12
      type: scalar
  retries:
    max_attempts: 1
    offset:
    - 0.0
    - 0.0
    - 0.0
    strategy: increase_force_limit
  subtask_id: grasp_lift
  target:
    anchor: current_tcp
    offset_along_axis:
      axis: world_z
      distance: 0.15
      mode: add_to_offset
      sign: positive
    source: yaml
    tolerance: 0.02
  termination: pose_tolerance
  type: lift
- control: position_control
  generator: linear_cartesian
  id: approach_to_goal
  orientation:
    mode: keep_current
  parameters:
    approach_goal_speed:
      binds_to:
      - mode: scale
        path: generator.speed
      default: 0.05
      range:
      - 0.02
      - 0.12
      type: scalar
  subtask_id: reach_goal
  target:
    anchor: task_goal
    entity: place_target
    offset:
    - 0.0
    - 0.0
    - 0.15
    source: yaml
    tolerance: 0.02
  termination: pose_tolerance
  type: approach
- control: admittance_control
  generator: linear_cartesian
  guards:
  - args: {}
    id: placement_force_ok
    on_failure: retry
    predicate: force_below
    threshold: 10.0
    when: during_phase
  id: descend_to_goal
  orientation:
    mode: keep_current
  parameters:
    descend_goal_speed:
      binds_to:
      - mode: scale
        path: generator.speed
      default: 0.03
      range:
      - 0.01
      - 0.08
      type: scalar
    placement_force_threshold:
      binds_to:
      - mode: replace
        path: termination.force_threshold
      default: 5.0
      range:
      - 1.0
      - 10.0
      type: scalar
    placement_z:
      binds_to:
      - mode: replace
        path: target.offset.z
      default: 0.01
      range:
      - -0.02
      - 0.05
      type: scalar
  retries:
    max_attempts: 1
    offset:
    - 0.0
    - 0.0
    - 0.005
    strategy: offset_target
  subtask_id: reach_goal
  target:
    anchor: task_goal
    entity: place_target
    offset:
    - 0.0
    - 0.0
    - 0.01
    source: yaml
    tolerance: 0.01
  termination: force_exceeded
  type: descend
- control: position_control
  end_effector_action: open
  generator: null
  id: release_at_goal
  orientation:
    mode: keep_current
  target:
    anchor: current_tcp
    offset:
    - 0.0
    - 0.0
    - 0.0
    source: yaml
  termination: time_limit
  type: release
- control: position_control
  generator: linear_cartesian
  id: retract_from_goal
  orientation:
    mode: keep_current
  parameters:
    retract_height:
      binds_to:
      - mode: replace
        path: target.offset_along_axis.distance
      default: 0.2
      range:
      - 0.08
      - 0.3
      type: scalar
    retract_speed:
      binds_to:
      - mode: scale
        path: generator.speed
      default: 0.08
      range:
      - 0.02
      - 0.15
      type: scalar
  target:
    anchor: current_tcp
    offset_along_axis:
      axis: world_z
      distance: 0.15
      mode: add_to_offset
      sign: positive
    source: yaml
    tolerance: 0.02
  termination: pose_tolerance
  type: retract
skill: grasp_place
skill_type: arm_gripper
subtasks:
- anchor: object
  id: reach_object
  metric: distance
  offset:
  - 0.0
  - 0.0
  - 0.1
  target_entity: tcp
  weight: 0.3
- anchor: object
  id: grasp_lift
  metric: distance
  offset:
  - 0.0
  - 0.0
  - 0.15
  target_entity: object
  weight: 0.3
- anchor: goal
  id: reach_goal
  metric: distance
  offset:
  - 0.0
  - 0.0
  - 0.0
  target_entity: tcp
  weight: 0.4
