dsl_version: 2
phases:
- control: position_control
  generator: linear_cartesian
  id: approach_socket
  parameters:
    approach_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.08
      range:
      - 0.03
      - 0.15
      type: scalar
    approach_x_offset:
      binds_to:
      - mode: add
        path: target.offset.x
      default: 0.0
      range:
      - -0.04
      - 0.04
      type: scalar
    approach_y_offset:
      binds_to:
      - mode: add
        path: target.offset.y
      default: 0.0
      range:
      - -0.04
      - 0.04
      type: scalar
  subtask_id: approach_subtask
  target:
    anchor: task_goal
    offset:
    - 0.0
    - 0.0
    - 0.12
    orientation:
      align_with: channel_axis
      axis:
      - 0.0
      - 0.0
      - 1.0
      mode: align_axis
      tolerance: 0.1
    source: yaml
    tolerance: 0.025
  termination: pose_tolerance
  type: approach
- control: impedance_control
  generator: linear_cartesian
  guards:
  - id: insert_force_guard
    on_failure: retry
    predicate: force_below
    threshold: 40.0
    when: during_phase
  - id: insert_contact_guard
    on_failure: retry
    predicate: contact_detected
    threshold: 0
    when: during_phase
  id: insert_down
  parameters:
    force_threshold:
      binds_to:
      - mode: replace
        path: termination.force_threshold
      default: 18.0
      range:
      - 10.0
      - 25.0
      type: scalar
    insertion_depth:
      binds_to:
      - mode: replace
        path: target.offset_along_axis.distance
      default: 0.075
      range:
      - 0.05
      - 0.1
      type: scalar
    insertion_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.01
      range:
      - 0.005
      - 0.015
      type: scalar
    retry_offset_x:
      binds_to:
      - mode: add
        path: retry.offset.x
      default: 0.0
      range:
      - -0.03
      - 0.03
      type: scalar
    retry_offset_y:
      binds_to:
      - mode: add
        path: retry.offset.y
      default: 0.0
      range:
      - -0.03
      - 0.03
      type: scalar
  retries:
    max_attempts: 2
    offset:
    - 0.0
    - 0.0
    - 0.0
    strategy: offset_target
  subtask_id: insert_subtask
  target:
    anchor: task_goal
    offset:
    - 0.0
    - 0.0
    - 0.0
    offset_along_axis:
      axis: channel_axis
      distance: 0.075
      mode: replace_offset_projection
      sign: positive
    orientation:
      align_with: channel_axis
      axis:
      - 0.0
      - 0.0
      - 1.0
      mode: align_axis
      tolerance: 0.1
    source: yaml
    tolerance: 0.015
  termination: force_exceeded
  type: insert
skill: peg_insert
subtasks:
- id: approach_subtask
  offset:
  - 0.0
  - 0.0
  - 0.12
  weight: 0.3
- id: insert_subtask
  metric: goal_progress
  weight: 0.7
