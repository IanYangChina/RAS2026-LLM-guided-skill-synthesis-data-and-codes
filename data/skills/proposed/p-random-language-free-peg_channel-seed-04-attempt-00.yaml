dsl_version: 2
phases:
- control: position_control
  generator: linear_cartesian
  id: approach_entrance
  parameters:
    approach_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.1
      range:
      - 0.02
      - 0.2
      type: scalar
  subtask_id: approach_pre_contact
  target:
    anchor: fixture
    entity: channel_left_wall
    offset:
    - -0.005
    - 0.08
    - 0.035
    orientation:
      mode: keep_current
    source: yaml
    tolerance: 0.02
  termination: pose_tolerance
  type: approach
- control: force_threshold_switch
  generator: linear_cartesian
  guards:
  - args: {}
    id: force_guard_contact
    on_failure: abort
    predicate: force_below
    threshold: 40.0
    when: during_phase
  id: contact_peg
  parameters:
    contact_force_threshold:
      binds_to:
      - mode: replace
        path: termination.force_threshold
      default: 5.0
      range:
      - 1.0
      - 20.0
      type: scalar
    contact_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.03
      range:
      - 0.01
      - 0.05
      type: scalar
  subtask_id: contact_peg
  target:
    anchor: fixture
    entity: channel_left_wall
    offset:
    - -0.005
    - 0.08
    - 0.005
    orientation:
      mode: keep_current
    source: yaml
    tolerance: 0.02
  termination: contact_detected
  type: contact
- control: impedance_control
  generator: impedance_motion
  guards:
  - args: {}
    id: force_guard_push
    on_failure: abort
    predicate: force_below
    threshold: 40.0
    when: during_phase
  id: push_through
  parameters:
    push_distance:
      binds_to:
      - mode: replace
        path: target.offset_along_axis.distance
      default: 0.16
      range:
      - 0.12
      - 0.22
      type: scalar
    push_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.04
      range:
      - 0.01
      - 0.08
      type: scalar
  retries:
    max_attempts: 1
    offset:
    - 0.0
    - 0.005
    - 0.0
    strategy: offset_target
  subtask_id: push_through
  target:
    anchor: fixture
    entity: channel_left_wall
    offset:
    - -0.005
    - 0.08
    - 0.005
    offset_along_axis:
      axis: channel_axis
      distance: 0.16
      mode: replace_offset_projection
      sign: negative
    orientation:
      mode: keep_current
    source: yaml
    tolerance: 0.02
  termination: pose_tolerance
  type: push
skill: peg_channel
skill_type: arm
subtasks:
- anchor: fixture
  id: approach_pre_contact
  metric: distance
  offset:
  - -0.005
  - 0.08
  - 0.035
  target_entity: tcp
  weight: 0.2
- anchor: fixture
  id: contact_peg
  metric: distance
  offset:
  - -0.005
  - 0.08
  - 0.005
  target_entity: tcp
  weight: 0.2
- anchor: goal
  id: push_through
  metric: goal_progress
  offset:
  - 0.0
  - 0.0
  - 0.0
  target_entity: tcp
  weight: 0.6
