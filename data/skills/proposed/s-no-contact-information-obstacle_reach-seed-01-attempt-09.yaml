dsl_version: 2
phases:
- control: impedance_control
  generator: arc_cartesian
  id: approach_side
  parameters:
    arc_height:
      binds_to:
      - mode: replace
        path: generator.arc_height
      default: 0.2
      range:
      - 0.1
      - 0.3
      type: scalar
    side_offset_y:
      binds_to:
      - mode: replace
        path: target.offset.y
      default: 0.15
      range:
      - 0.1
      - 0.25
      type: scalar
    speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.12
      range:
      - 0.05
      - 0.5
      type: scalar
    tolerance:
      binds_to:
      - mode: replace
        path: termination.pose_tolerance
      default: 0.02
      range:
      - 0.005
      - 0.1
      type: scalar
  subtask_id: over_obstacle_side
  target:
    anchor: task_goal
    offset:
    - 0.0
    - 0.15
    - 0.25
    orientation:
      mode: keep_current
    source: yaml
  termination: pose_tolerance
  type: approach
- control: impedance_control
  generator: linear_cartesian
  id: move_to_goal
  parameters:
    speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.15
      range:
      - 0.05
      - 0.5
      type: scalar
    tolerance:
      binds_to:
      - mode: replace
        path: termination.pose_tolerance
      default: 0.015
      range:
      - 0.005
      - 0.025
      type: scalar
  subtask_id: reach_goal
  target:
    anchor: task_goal
    offset:
    - 0.0
    - 0.0
    - 0.0
    orientation:
      mode: keep_current
    source: yaml
  termination: pose_tolerance
  type: approach
skill: obstacle_reach
subtasks:
- anchor: goal
  id: over_obstacle_side
  offset:
  - 0.0
  - 0.15
  - 0.25
  target_entity: tcp
  weight: 0.3
- anchor: goal
  id: reach_goal
  offset:
  - 0.0
  - 0.0
  - 0.0
  target_entity: tcp
  weight: 0.7
