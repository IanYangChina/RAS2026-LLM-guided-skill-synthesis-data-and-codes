dsl_version: 2
phases:
- control: position_control
  generator: arc_cartesian
  id: lift_and_clear
  parameters:
    approach_speed:
      binds_to:
      - mode: add
        path: generator.speed
      default: 0.08
      range:
      - 0.02
      - 0.15
      type: scalar
    approach_tolerance:
      binds_to:
      - mode: add
        path: termination.pose_tolerance
      default: 0.03
      range:
      - 0.01
      - 0.05
      type: scalar
    arc_height:
      binds_to:
      - mode: add
        path: generator.arc_height
      default: 0.25
      range:
      - 0.1
      - 0.4
      type: scalar
  subtask_id: reach_goal
  target:
    anchor: task_goal
    offset:
    - 0.0
    - 0.0
    - 0.2
    offset_along_axis:
      axis: world_z
      distance: 0.15
      mode: replace_offset_projection
      sign: positive
    source: yaml
  termination: pose_tolerance
  type: approach
- control: position_control
  generator: linear_cartesian
  id: descend_to_goal
  parameters:
    descend_speed:
      binds_to:
      - mode: add
        path: generator.speed
      default: 0.04
      range:
      - 0.01
      - 0.1
      type: scalar
    descend_tolerance:
      binds_to:
      - mode: add
        path: termination.pose_tolerance
      default: 0.01
      range:
      - 0.005
      - 0.02
      type: scalar
  subtask_id: reach_goal
  target:
    anchor: task_goal
    offset:
    - 0.0
    - 0.0
    - 0.0
    orientation:
      align_with: world_z
      axis:
      - 0.0
      - 0.0
      - 1.0
      mode: align_axis
      tolerance: 0.1
    source: yaml
  termination: pose_tolerance
  type: descend
skill: obstacle_reach
subtasks:
- anchor: goal
  id: reach_goal
  metric: distance
  offset:
  - 0.0
  - 0.0
  - 0.0
  target_entity: tcp
  weight: 1.0
