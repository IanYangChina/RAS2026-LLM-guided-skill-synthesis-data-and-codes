dsl_version: 2
phases:
- control: position_control
  generator: linear_cartesian
  id: approach_above
  parameters:
    approach_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.1
      range:
      - 0.05
      - 0.2
      type: scalar
  subtask_id: approach_peg
  target:
    anchor: task_object
    offset:
    - 0.0
    - -0.02
    - 0.08
    orientation:
      mode: keep_current
    source: yaml
    tolerance: 0.01
  termination: pose_tolerance
  type: approach
- control: force_threshold_switch
  generator: linear_cartesian
  id: contact_side
  parameters:
    contact_force_threshold:
      binds_to:
      - mode: replace
        path: termination.force_threshold
      default: 5.0
      range:
      - 3.0
      - 10.0
      type: scalar
  subtask_id: approach_peg
  target:
    anchor: task_object
    offset:
    - 0.0
    - -0.01
    - 0.0
    orientation:
      align_with: channel_axis
      axis:
      - 0.0
      - 0.0
      - 1.0
      mode: align_axis
      tolerance: 0.05
    source: yaml
    tolerance: 0.01
  termination: force_exceeded
  type: contact
- control: impedance_control
  generator: linear_cartesian
  id: push_channel
  parameters:
    push_duration:
      binds_to:
      - mode: replace
        path: duration.max_time
      default: 2.0
      range:
      - 1.0
      - 3.0
      type: scalar
    push_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.08
      range:
      - 0.05
      - 0.15
      type: scalar
  subtask_id: push_through
  target:
    anchor: task_object
    offset:
    - 0.0
    - 0.0
    - 0.0
    offset_along_axis:
      axis: channel_axis
      distance: 0.16
      mode: add_to_offset
    orientation:
      mode: keep_current
    source: yaml
    tolerance: 0.02
  termination: time_limit
  type: push
- control: position_control
  generator: linear_cartesian
  id: retract_away
  parameters:
    retract_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.06
      range:
      - 0.03
      - 0.12
      type: scalar
  target:
    anchor: current_tcp
    offset:
    - 0.0
    - 0.0
    - 0.1
    orientation:
      mode: keep_current
    source: yaml
    tolerance: 0.01
  termination: pose_tolerance
  type: retract
skill: peg_channel
subtasks:
- anchor: object
  id: approach_peg
  metric: distance
  offset:
  - 0.0
  - 0.0
  - 0.08
  target_entity: tcp
  weight: 0.2
- anchor: goal
  id: push_through
  metric: goal_progress
  target_entity: object
  weight: 0.8
