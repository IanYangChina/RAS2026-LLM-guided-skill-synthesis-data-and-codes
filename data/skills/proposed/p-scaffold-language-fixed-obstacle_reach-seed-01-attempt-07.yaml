dsl_version: 2
phases:
- control: position_control
  generator: linear_cartesian
  id: rise_above_obstacle
  parameters:
    rise_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.05
      range:
      - 0.01
      - 0.1
      type: scalar
    rise_z:
      binds_to:
      - mode: replace
        path: target.offset.z
      default: 0.2
      range:
      - 0.1
      - 0.4
      type: scalar
  target:
    anchor: current_tcp
    offset:
    - 0.0
    - 0.0
    - 0.2
    orientation:
      mode: none
    source: yaml
    tolerance: 0.02
  termination: pose_tolerance
  type: approach
- control: position_control
  generator: linear_cartesian
  id: lateral_clear
  parameters:
    lateral_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.05
      range:
      - 0.01
      - 0.1
      type: scalar
    lateral_y:
      binds_to:
      - mode: replace
        path: target.offset.y
      default: 0.2
      range:
      - 0.1
      - 0.3
      type: scalar
  target:
    anchor: current_tcp
    offset:
    - 0.0
    - 0.2
    - 0.0
    orientation:
      mode: none
    source: yaml
    tolerance: 0.02
  termination: pose_tolerance
  type: approach
- control: position_control
  generator: linear_cartesian
  id: forward_approach
  parameters:
    forward_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.05
      range:
      - 0.01
      - 0.1
      type: scalar
    forward_z:
      binds_to:
      - mode: replace
        path: target.offset.z
      default: 0.4
      range:
      - 0.3
      - 0.5
      type: scalar
  target:
    anchor: task_goal
    offset:
    - 0.0
    - 0.0
    - 0.4
    orientation:
      mode: none
    source: yaml
    tolerance: 0.02
  termination: pose_tolerance
  type: approach
- control: position_control
  generator: linear_cartesian
  guards:
  - args: {}
    id: obstacle_contact
    on_failure: retry
    predicate: contact_detected
    threshold: 1.0
    when: during_phase
  id: descend_to_goal
  parameters:
    descend_retry_y:
      binds_to:
      - mode: add
        path: retry.offset.y
      default: 0.03
      range:
      - 0.01
      - 0.1
      type: scalar
    descend_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.03
      range:
      - 0.01
      - 0.1
      type: scalar
  retries:
    max_attempts: 2
    offset:
    - 0.0
    - 0.03
    - 0.0
    strategy: offset_target
  target:
    anchor: task_goal
    offset:
    - 0.0
    - 0.0
    - 0.0
    orientation:
      mode: none
    source: yaml
    tolerance: 0.01
  termination: pose_tolerance
  type: descend
skill: obstacle_reach
