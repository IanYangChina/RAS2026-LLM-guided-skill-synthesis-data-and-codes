dsl_version: 2
phases:
- control: position_control
  generator: arc_cartesian
  id: approach_1
  parameters:
    arc_height:
      binds_to:
      - mode: replace
        path: generator.arc_height
      default: 0.05
      range:
      - 0.02
      - 0.08
      type: scalar
    speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.1
      range:
      - 0.05
      - 0.3
      type: scalar
  subtask_id: approach_handle
  target:
    anchor: site
    entity: door_handle
    offset:
    - -0.02
    - 0.0
    - 0.0
    orientation:
      mode: keep_current
    source: yaml
    tolerance: 0.03
  termination: pose_tolerance
  type: approach
- control: force_threshold_switch
  generator: linear_cartesian
  id: contact_1
  parameters:
    max_time:
      binds_to:
      - mode: replace
        path: duration.max_time
      default: 3.0
      range:
      - 1.0
      - 5.0
      type: scalar
    speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.02
      range:
      - 0.005
      - 0.05
      type: scalar
  subtask_id: approach_handle
  target:
    anchor: site
    entity: door_handle
    offset:
    - 0.0
    - 0.0
    - 0.0
    orientation:
      mode: keep_current
    source: yaml
    tolerance: 0.005
  termination: time_limit
  type: contact
- control: impedance_control
  generator: linear_cartesian
  guards:
  - id: door_opened
    on_failure: continue
    predicate: hinge_delta_reached
    threshold: 0.3
    when: during_phase
  id: push_1
  parameters:
    max_time:
      binds_to:
      - mode: replace
        path: duration.max_time
      default: 3.0
      range:
      - 1.0
      - 5.0
      type: scalar
    push_distance:
      binds_to:
      - mode: replace
        path: target.offset_along_axis.distance
      default: 0.15
      range:
      - 0.05
      - 0.3
      type: scalar
    speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.05
      range:
      - 0.02
      - 0.1
      type: scalar
  subtask_id: push_door
  target:
    anchor: site
    entity: door_handle
    offset:
    - 0.0
    - 0.0
    - 0.0
    offset_along_axis:
      axis: world_x
      distance: 0.15
      mode: add_to_offset
      sign: positive
    orientation:
      mode: keep_current
    source: yaml
    tolerance: 0.02
  termination: time_limit
  type: push
- control: position_control
  generator: linear_cartesian
  id: retract_1
  parameters:
    speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.1
      range:
      - 0.05
      - 0.2
      type: scalar
  target:
    anchor: world
    offset:
    - 0.1
    - 0.4
    - 0.35
    orientation:
      mode: keep_current
    source: yaml
    tolerance: 0.03
  termination: pose_tolerance
  type: retract
skill: door_push
subtasks:
- anchor: fixture
  id: approach_handle
  offset:
  - -0.4
  - -0.02
  - 0.35
  weight: 0.3
- anchor: world
  id: push_door
  metric: hinge_angle
  target_entity: hinge
  weight: 0.7
