dsl_version: 2
phases:
- control: position_control
  generator: linear_cartesian
  guards: []
  id: approach_entry
  parameters:
    speed:
      binds_to:
      - mode: add
        path: generator.speed
      default: 0.05
      range:
      - 0.01
      - 0.2
      type: scalar
  retries:
    max_attempts: 0
  subtask_id: reach_entry
  target:
    anchor: fixture
    entity: peg_socket
    offset:
    - 0.0
    - 0.0
    - 0.085
    orientation:
      mode: keep_current
    source: yaml
    tolerance: 0.02
  termination: pose_tolerance
  type: approach
- control: position_control
  generator: linear_cartesian
  guards: []
  id: align_entry
  parameters:
    tolerance:
      binds_to:
      - mode: replace
        path: termination.pose_tolerance
      default: 0.005
      range:
      - 0.001
      - 0.02
      type: scalar
  retries:
    max_attempts: 0
  subtask_id: reach_entry
  target:
    anchor: fixture
    entity: peg_socket
    offset:
    - 0.0
    - 0.0
    - 0.055
    orientation:
      mode: keep_current
    source: yaml
    tolerance: 0.005
  termination: pose_tolerance
  type: align
- control: impedance_control
  generator: linear_cartesian
  guards: []
  id: insert_down
  parameters:
    force_threshold:
      binds_to:
      - mode: replace
        path: termination.force_threshold
      default: 20
      range:
      - 10
      - 40
      type: scalar
  retries:
    max_attempts: 0
  subtask_id: insert_bottom
  target:
    anchor: fixture
    entity: peg_socket
    offset:
    - 0.0
    - 0.0
    - 0.055
    offset_along_axis:
      axis: channel_axis
      distance: 0.055
      mode: add_to_offset
      sign: positive
    orientation:
      mode: keep_current
    source: yaml
    tolerance: 0.01
  termination: force_exceeded
  type: insert
skill: peg_insert
skill_type: arm
subtasks:
- anchor: fixture
  id: reach_entry
  metric: distance
  offset:
  - 0.0
  - 0.0
  - 0.055
  target_entity: tcp
  weight: 0.3
- anchor: fixture
  id: insert_bottom
  metric: distance
  offset:
  - 0.0
  - 0.0
  - 0.0
  target_entity: tcp
  weight: 0.7
