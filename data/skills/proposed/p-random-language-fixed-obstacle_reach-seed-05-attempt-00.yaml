dsl_version: 2
phases:
- control: position_control
  generator: linear_cartesian
  id: clear_side
  orientation:
    mode: keep_current
  parameters:
    approach_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.3
      range:
      - 0.1
      - 0.5
      type: scalar
    lateral_offset_y:
      binds_to:
      - mode: replace
        path: target.offset.y
      default: 0.2
      range:
      - 0.15
      - 0.25
      type: scalar
  target:
    anchor: current_tcp
    entity: null
    offset:
    - 0
    - 0.2
    - 0
    source: yaml
    tolerance: 0.005
  termination: pose_tolerance
  type: approach
- control: position_control
  generator: linear_cartesian
  id: approach_above_goal
  orientation:
    mode: keep_current
  parameters:
    approach_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.3
      range:
      - 0.1
      - 0.5
      type: scalar
    z_clearance:
      binds_to:
      - mode: replace
        path: target.offset.z
      default: 0.17
      range:
      - 0.12
      - 0.22
      type: scalar
  target:
    anchor: task_goal
    entity: null
    offset:
    - 0
    - 0
    - 0.17
    offset_along_axis:
      axis: world_z
      distance: 0.0
      mode: replace_offset_projection
      sign: positive
    source: yaml
    tolerance: 0.005
  termination: pose_tolerance
  type: approach
- control: impedance_control
  generator: linear_cartesian
  id: descend_to_goal
  orientation:
    mode: keep_current
  parameters:
    descend_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.1
      range:
      - 0.05
      - 0.2
      type: scalar
  subtask_id: goal_proximity
  target:
    anchor: task_goal
    entity: null
    offset:
    - 0
    - 0
    - 0
    source: yaml
    tolerance: 0.005
  termination: pose_tolerance
  type: descend
skill: obstacle_reach
skill_type: arm_gripper
subtasks:
- anchor: goal
  id: goal_proximity
  metric: distance
  offset:
  - 0
  - 0
  - 0
  target_entity: tcp
  weight: 1.0
