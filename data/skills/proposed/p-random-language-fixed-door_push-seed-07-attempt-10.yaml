dsl_version: 2
phases:
- control: position_control
  generator: linear_cartesian
  id: approach_handle
  parameters:
    speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.1
      range:
      - 0.05
      - 0.2
      type: scalar
  target:
    anchor: site
    entity: door_handle
    offset:
    - 0.0
    - 0.0
    - 0.02
    source: yaml
    tolerance: 0.005
  termination: pose_tolerance
  type: approach
- control: position_control
  generator: linear_cartesian
  id: align_to_handle
  parameters:
    align_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.05
      range:
      - 0.02
      - 0.1
      type: scalar
  target:
    anchor: site
    entity: door_handle
    offset:
    - 0.0
    - 0.0
    - 0.0
    source: yaml
    tolerance: 0.01
  termination: pose_tolerance
  type: align
- control: impedance_control
  generator: linear_cartesian
  id: push_door
  parameters:
    push_distance:
      binds_to:
      - mode: replace
        path: target.offset_along_axis.distance
      default: 0.3
      range:
      - 0.15
      - 0.5
      type: scalar
    push_force_threshold:
      binds_to:
      - mode: replace
        path: termination.force_threshold
      default: 25.0
      range:
      - 10.0
      - 30.0
      type: scalar
  target:
    anchor: site
    entity: door_handle
    offset:
    - 0.0
    - 0.0
    - 0.0
    offset_along_axis:
      axis: world_y
      distance: 0.3
      mode: add_to_offset
      sign: positive
    source: yaml
    tolerance: 0.005
  termination: force_exceeded
  type: push
skill: door_push
subtasks:
- anchor: object
  id: hinge_progress
  metric: hinge_angle
  target_entity: door_panel
  weight: 1.0
