dsl_version: 2
phases:
- control: position_control
  generator: linear_cartesian
  id: approach_1
  parameters:
    approach_height:
      binds_to:
      - mode: replace
        path: target.offset_along_axis.distance
      default: 0.1
      range:
      - 0.06
      - 0.15
      type: scalar
  subtask_id: approach_1
  target:
    anchor: task_object
    offset:
    - 0.0
    - 0.0
    - 0.0
    offset_along_axis:
      axis: world_z
      distance: 0.1
      mode: add_to_offset
      sign: positive
    orientation:
      align_with: world_z
      axis:
      - 0.0
      - 0.0
      - -1.0
      mode: align_axis
      tolerance: 0.1
    source: yaml
    tolerance: 0.01
  termination: pose_tolerance
  type: approach
- control: position_control
  generator: linear_cartesian
  id: descend_1
  parameters:
    grasp_z_offset:
      binds_to:
      - mode: replace
        path: target.offset.z
      default: 0.02
      range:
      - 0.0
      - 0.03
      type: scalar
  subtask_id: descend_1
  target:
    anchor: task_object
    offset:
    - 0.0
    - 0.0
    - 0.02
    orientation:
      mode: keep_current
    source: yaml
    tolerance: 0.005
  termination: pose_tolerance
  type: descend
- control: null
  end_effector_action: force_grasp
  generator: null
  guards:
  - args: {}
    id: bilateral_check
    on_failure: retry
    predicate: bilateral_grasp
    threshold: 0.01
    when: during_phase
  id: grasp_1
  parameters:
    grasp_force_threshold:
      binds_to:
      - mode: replace
        path: guards.bilateral_check.threshold
      default: 0.01
      range:
      - 0.005
      - 0.02
      type: scalar
  retries:
    max_attempts: 2
    strategy: repeat
  subtask_id: grasp_1
  target:
    anchor: current_tcp
    offset:
    - 0.0
    - 0.0
    - 0.0
    source: yaml
  termination: grasp_success
  type: grasp
- control: position_control
  generator: linear_cartesian
  guards:
  - args: {}
    id: lift_clearance
    on_failure: retry
    predicate: object_lifted
    threshold: 0.05
    when: after_phase
  id: lift_1
  parameters:
    lift_height:
      binds_to:
      - mode: replace
        path: target.offset.z
      default: 0.12
      range:
      - 0.08
      - 0.18
      type: scalar
  retries:
    max_attempts: 2
    strategy: repeat
  target:
    anchor: task_object
    offset:
    - 0.0
    - 0.0
    - 0.12
    orientation:
      mode: keep_current
    source: yaml
    tolerance: 0.01
  termination: pose_tolerance
  type: lift
- control: position_control
  generator: arc_cartesian
  id: transport_arc
  parameters:
    arc_height:
      binds_to:
      - mode: replace
        path: generator.arc_height
      default: 0.1
      range:
      - 0.05
      - 0.15
      type: scalar
  subtask_id: transport_arc
  target:
    anchor: task_goal
    offset:
    - 0.0
    - 0.0
    - 0.12
    orientation:
      mode: keep_current
    source: yaml
    tolerance: 0.01
  termination: pose_tolerance
  type: approach
- control: position_control
  generator: linear_cartesian
  id: descend_to_goal
  subtask_id: release_1
  target:
    anchor: task_goal
    offset:
    - 0.0
    - 0.0
    - 0.0
    orientation:
      mode: keep_current
    source: yaml
    tolerance: 0.005
  termination: pose_tolerance
  type: descend
- control: null
  end_effector_action: open
  generator: null
  id: release_1
  parameters:
    release_duration:
      binds_to:
      - mode: replace
        path: termination.max_time
      default: 0.3
      range:
      - 0.1
      - 0.5
      type: scalar
  target:
    anchor: current_tcp
    offset:
    - 0.0
    - 0.0
    - 0.0
    source: yaml
  termination: time_limit
  type: release
- control: position_control
  generator: linear_cartesian
  id: retract_1
  target:
    anchor: task_goal
    offset:
    - 0.0
    - 0.0
    - 0.1
    orientation:
      mode: keep_current
    source: yaml
    tolerance: 0.01
  termination: pose_tolerance
  type: retract
skill: grasp_place
subtasks:
- anchor: object
  id: approach_1
  metric: distance
  offset:
  - 0.0
  - 0.0
  - 0.0
  target_entity: tcp
  weight: 1.0
- anchor: object
  id: descend_1
  metric: distance
  offset:
  - 0.0
  - 0.0
  - 0.02
  target_entity: tcp
  weight: 1.0
- anchor: object
  id: grasp_1
  metric: contact
  offset:
  - 0.0
  - 0.0
  - 0.02
  target_entity: tcp
  weight: 1.0
- anchor: goal
  id: transport_arc
  metric: distance
  offset:
  - 0.0
  - 0.0
  - 0.0
  target_entity: tcp
  weight: 1.0
- anchor: goal
  id: release_1
  metric: distance
  offset:
  - 0.0
  - 0.0
  - 0.0
  target_entity: tcp
  weight: 1.0
