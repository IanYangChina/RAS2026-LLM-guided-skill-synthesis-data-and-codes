dsl_version: 2
phases:
- control: position_control
  end_effector_action: null
  generator: linear_cartesian
  guards: []
  id: approach_1
  parameters:
    approach_height:
      binds_to:
      - mode: replace
        path: target.offset.z
      default: 0.15
      range:
      - 0.05
      - 0.3
      type: scalar
  retries:
    max_attempts: 0
    offset: null
    strategy: repeat
  subtask_id: approach
  target:
    anchor: task_object
    entity: null
    offset:
    - 0.0
    - 0.08
    - 0.15
    offset_along_axis: null
    orientation:
      mode: keep_current
    source: yaml
    tolerance: 0.01
  termination: pose_tolerance
  type: approach
- control: force_threshold_switch
  end_effector_action: null
  generator: impedance_motion
  guards: []
  id: contact_1
  parameters:
    speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.025
      range:
      - 0.005
      - 0.05
      type: scalar
  retries:
    max_attempts: 0
    offset: null
    strategy: repeat
  subtask_id: contact
  target:
    anchor: task_object
    entity: null
    offset:
    - 0.0
    - 0.03
    - 0.0
    offset_along_axis: null
    orientation:
      mode: keep_current
    source: yaml
    tolerance: 0.01
  termination: force_exceeded
  type: contact
- control: position_control
  end_effector_action: null
  generator: linear_cartesian
  guards:
  - args: {}
    id: object_progress_check
    on_failure: retry
    predicate: object_progress
    threshold: 0.02
    when: after_phase
  id: push_1
  parameters:
    push_distance:
      binds_to:
      - mode: replace
        path: target.offset_along_axis.distance
      default: 0.15
      range:
      - 0.02
      - 0.2
      type: scalar
  retries:
    max_attempts: 2
    offset:
    - 0.0
    - 0.01
    - 0.0
    strategy: offset_target
  subtask_id: push
  target:
    anchor: task_goal
    entity: null
    offset:
    - 0.0
    - 0.03
    - 0.0
    offset_along_axis:
      axis: task_goal_direction
      distance: 0.15
      mode: add_to_offset
      sign: negative
    orientation:
      align_with: task_goal_direction
      axis:
      - 1.0
      - 0.0
      - 0.0
      mode: align_axis
      tolerance: 0.1
    source: yaml
    tolerance: 0.015
  termination: pose_tolerance
  type: push
- control: position_control
  end_effector_action: null
  generator: arc_cartesian
  guards:
  - args: {}
    id: retract_clear
    on_failure: retry
    predicate: pose_within_tolerance
    threshold: 0.05
    when: before_phase
  id: retract_1
  parameters:
    arc_height:
      binds_to:
      - mode: replace
        path: generator.arc_height
      default: 0.1
      range:
      - 0.05
      - 0.2
      type: scalar
    speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.05
      range:
      - 0.01
      - 0.1
      type: scalar
  retries:
    max_attempts: 1
    offset:
    - 0.0
    - 0.0
    - 0.02
    strategy: offset_target
  subtask_id: null
  target:
    anchor: task_goal
    entity: null
    offset:
    - 0.0
    - 0.0
    - 0.15
    offset_along_axis: null
    orientation:
      mode: keep_current
    source: yaml
    tolerance: 0.01
  termination: pose_tolerance
  type: retract
skill: push_to_goal
skill_type: arm
subtasks:
- anchor: object
  id: approach
  metric: distance
  offset:
  - 0.0
  - 0.08
  - 0.0
  target_entity: tcp
  weight: 1.0
- anchor: object
  id: contact
  metric: distance
  offset:
  - 0.0
  - 0.03
  - 0.0
  target_entity: tcp
  weight: 1.0
- anchor: goal
  id: push
  metric: distance
  offset:
  - 0.0
  - 0.03
  - 0.0
  target_entity: tcp
  weight: 1.0
