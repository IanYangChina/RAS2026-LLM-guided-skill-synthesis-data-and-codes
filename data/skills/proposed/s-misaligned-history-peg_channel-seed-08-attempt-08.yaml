dsl_version: 2
phases:
- control: position_control
  generator: linear_cartesian
  guards:
  - args: {}
    id: approach_force_guard
    on_failure: retry
    predicate: force_below
    threshold: 10.0
    when: during_phase
  id: approach_1
  parameters:
    approach_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.15
      range:
      - 0.05
      - 0.3
      type: scalar
  retries:
    max_attempts: 1
    offset:
    - 0.0
    - 0.01
    - 0.0
    strategy: offset_target
  subtask_id: approach_subtask
  target:
    anchor: task_object
    entity: peg
    offset:
    - 0.0
    - 0.12
    - 0.1
    orientation:
      align_with: channel_axis
      axis:
      - 0.0
      - 0.0
      - 1.0
      mode: align_axis
      tolerance: 0.05
    source: yaml
    tolerance: 0.02
  termination: pose_tolerance
  type: approach
- control: force_threshold_switch
  generator: linear_cartesian
  id: descend_1
  parameters:
    descend_force_threshold:
      binds_to:
      - mode: replace
        path: termination.force_threshold
      default: 5.0
      range:
      - 2.0
      - 10.0
      type: scalar
    descend_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.05
      range:
      - 0.02
      - 0.1
      type: scalar
  retries:
    max_attempts: 2
    offset:
    - 0.0
    - 0.01
    - 0.0
    strategy: offset_target
  subtask_id: descend_subtask
  target:
    anchor: task_object
    entity: peg
    offset:
    - 0.0
    - 0.12
    - 0.0
    orientation:
      mode: keep_current
    source: yaml
  termination: force_exceeded
  type: descend
- control: impedance_control
  generator: linear_cartesian
  guards:
  - args: {}
    id: push_force_guard
    on_failure: retry
    predicate: force_below
    threshold: 40.0
    when: during_phase
  id: push_1
  parameters:
    push_force_limit:
      binds_to:
      - mode: replace
        path: guards.push_force_guard.threshold
      default: 40.0
      range:
      - 30.0
      - 40.0
      type: scalar
    push_speed:
      binds_to:
      - mode: replace
        path: generator.speed
      default: 0.05
      range:
      - 0.02
      - 0.15
      type: scalar
  retries:
    max_attempts: 2
    offset:
    - 0.0
    - 0.0
    - 0.0
    strategy: reduce_speed
  subtask_id: push_subtask
  target:
    anchor: task_goal
    offset:
    - 0.0
    - 0.0
    - 0.0
    orientation:
      mode: keep_current
    source: yaml
    tolerance: 0.02
  termination: pose_tolerance
  type: push
skill: peg_channel
subtasks:
- anchor: object
  id: approach_subtask
  metric: distance
  offset:
  - 0.0
  - 0.12
  - 0.1
  target_entity: tcp
  weight: 0.2
- anchor: object
  id: descend_subtask
  metric: distance
  offset:
  - 0.0
  - 0.12
  - 0.0
  target_entity: tcp
  weight: 0.3
- anchor: goal
  id: push_subtask
  metric: goal_progress
  target_entity: object
  weight: 0.5
