
skill: peg_insert

phases:
  - id: align_1
    type: align
    generator: linear_cartesian
    control: position_control
    termination: pose_tolerance
    parameters:
      lateral_offset_x:
        type: scalar
        range: [-0.01, 0.01]
      lateral_offset_y:
        type: scalar
        range: [-0.01, 0.01]

  - id: approach_1
    type: approach
    generator: linear_cartesian
    control: position_control
    termination: pose_tolerance
    parameters:
      approach_height:
        type: scalar
        range: [0.05, 0.2]

  - id: contact_1
    type: contact
    generator: impedance_motion
    control: impedance_control
    termination: force_exceeded

  - id: insert_1
    type: insert
    generator: impedance_motion
    control: admittance_control
    termination: pose_tolerance
    parameters:
      insert_depth:
        type: scalar
        range: [0.01, 0.15]
      insertion_force:
        type: scalar
        range: [2.0, 15.0]

  - id: retract_1
    type: retract
    generator: linear_cartesian
    control: position_control
    termination: pose_tolerance
