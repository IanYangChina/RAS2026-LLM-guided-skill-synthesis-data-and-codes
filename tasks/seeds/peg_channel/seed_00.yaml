skill: peg_channel
skill_type: arm
phases:
  - id: approach_1
    type: approach
    generator: linear_cartesian
    control: position_control
    termination: pose_tolerance
    parameters:
      approach_height:
        type: scalar
        range: [0.05, 0.2]
  - id: contact_1
    type: contact
    generator: linear_cartesian
    control: force_threshold_switch
    termination: contact_detected
    parameters:
      contact_force:
        type: scalar
        range: [1.0, 20.0]
  - id: push_1
    type: push
    generator: linear_cartesian
    control: impedance_control
    termination: time_limit
    parameters:
      push_depth:
        type: scalar
        range: [0.05, 0.18]
  - id: retract_1
    type: retract
    generator: linear_cartesian
    control: position_control
    termination: pose_tolerance
