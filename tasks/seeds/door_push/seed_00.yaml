
skill: door_push
skill_type: arm

phases:
  - id: approach_1
    type: approach
    generator: arc_cartesian
    control: position_control
    termination: pose_tolerance
    parameters:
      arc_height:
        type: scalar
        range: [0.02, 0.15]

  - id: contact_1
    type: contact
    generator: linear_cartesian
    control: force_threshold_switch
    termination: contact_detected

  - id: push_1
    type: push
    generator: linear_cartesian
    control: impedance_control
    termination: time_limit
    parameters:
      push_distance:
        type: scalar
        range: [0.02, 0.20]
      push_speed:
        type: scalar
        range: [0.01, 0.10]
      push_depth:
        type: scalar
        range: [0.01, 0.10]

  - id: retract_1
    type: retract
    generator: linear_cartesian
    control: position_control
    termination: pose_tolerance
